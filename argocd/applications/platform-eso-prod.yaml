# ArgoCD Application — platform-eso-prod (k3d-prod cluster, prod Vault)
# S2-C2 + D32: ESO CR'ları prod cluster'da sync (staging-sw-2 bootstrap sonrası)
# Prereq: ESO Deployment + Vault AppRole secret-id prod Vault'ta manuel
#   (bootstrap/install-on-staging-sw-2.sh F6)
# Codex iter-2 AGREE: base DOĞRUDAN apply edilmez, overlay zorunlu.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-eso-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/cluster: prod
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: kustomize/overlays/prod/eso    # Overlay split — prod Vault FQDN
  destination:
    # D32 cutover sonrası: prod cluster ArgoCD external cluster (secret ile bağlı)
    # veya tek ArgoCD multi-cluster; şu an placeholder — staging-sw-2 bootstrap
    # sırasında gerçek server URL + cluster secret tanımlanacak.
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    # MANUAL sync — D30 HARD RULE: Codex PR #1 iter-9 tespit — `automated`
    # field varsa (değerleri false olsa bile) ArgoCD auto-sync açar.
    # Ref: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # 2026-04-24 Session 28: RespectIgnoreDifferences (bkz. platform-prod.yaml açıklaması)
      - RespectIgnoreDifferences=true
  # 2026-04-23 PR #54 (post PR #52 v1beta1→v1 migration):
  # ServerSideApply v1 spec'i cluster'a dayattı ama stored managedFields +
  # annotations + status alanları v1beta1 era'dan kalma serialization ile
  # cosmetic diff üretiyor. Runtime sağlıklı: `ClusterSecretStore` Ready=True,
  # `ExternalSecret/ghcr-pull` SecretSynced=True, ESO controller reconcile ediyor.
  # Bu ignore'lar yalnız cosmetic diff'i susturur; gerçek provider/data/path
  # drift'i hâlâ Argo tarafından yakalanır (örn. `spec.provider.vault.server` FQDN).
  ignoreDifferences:
    # 2026-04-24 Session 28: /metadata agresif (PR #72 yetersizdi, ServerSideApply
    # field manager drift'i başka metadata alanlarında da üretiyor).
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /metadata
        - /status
    - group: external-secrets.io
      kind: ClusterSecretStore
      jsonPointers:
        - /metadata
        - /status
