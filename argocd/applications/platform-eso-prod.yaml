# ArgoCD Application — platform-eso-prod (k3d-prod cluster, prod Vault)
# S2-C2 + D32: ESO CR'ları prod cluster'da sync (staging-sw-2 bootstrap sonrası)
# Prereq: ESO Deployment + Vault AppRole secret-id prod Vault'ta manuel
#   (bootstrap/install-on-staging-sw-2.sh F6)
# Codex iter-2 AGREE: base DOĞRUDAN apply edilmez, overlay zorunlu.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-eso-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/cluster: prod
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: kustomize/overlays/prod/eso    # Overlay split — prod Vault FQDN
  destination:
    # D32 cutover sonrası: prod cluster ArgoCD external cluster (secret ile bağlı)
    # veya tek ArgoCD multi-cluster; şu an placeholder — staging-sw-2 bootstrap
    # sırasında gerçek server URL + cluster secret tanımlanacak.
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    # MANUAL sync — D30 HARD RULE: Codex PR #1 iter-9 tespit — `automated`
    # field varsa (değerleri false olsa bile) ArgoCD auto-sync açar.
    # Ref: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      # RespectIgnoreDifferences KALDIRILDI (2026-05-19, Codex 019e41d7):
      # bu option + aşağıdaki blanket `/metadata` ignore birlikte, sync
      # sırasında canlı `/metadata`'yı (managedFields dahil) Server-Side-Apply
      # gövdesine taşıyıp `metadata.managedFields must be nil` ile TÜM sync'leri
      # Failed yapıyordu — app OutOfSync+Degraded kilidi. Fix: option kaldır +
      # `/metadata` ignore'unu `/status`'a daralt (aşağıda).
  # ignoreDifferences — yalnız cosmetic diff susturma; gerçek provider/data/path
  # drift'ini Argo yine yakalar (örn. `spec.provider.vault.server` FQDN).
  # 2026-05-19 (Codex 019e41d7): blanket `/metadata` ignore KALDIRILDI — ESO v1
  # CRD'sinde `/metadata` managedFields'i de kapsıyordu; RespectIgnoreDifferences
  # ile birlikte SSA sync'ini `metadata.managedFields must be nil` ile bozuyordu
  # (app OutOfSync+Degraded). `/status` + ESO v1 default-field jq ignore'ları
  # cosmetic diff için yeterli; managedFields cosmetic diff'ini ArgoCD kendi
  # normalize eder. Eski rationale: PR #54 (v1beta1→v1 migration) cosmetic diff.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
      jqPathExpressions:
        # ESO v1 default fields (canlıda var, manifest'te yok — Session 28 T+30 diff investigate)
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
    - group: external-secrets.io
      kind: ClusterSecretStore
      jsonPointers:
        - /status
