# ArgoCD Application — platform-eso-test (k3d-test cluster, test Vault)
# S2-C2: ESO CR'ları GitOps ile sync (test cluster)
# Prereq: ESO Deployment + Vault AppRole secret-id test Vault'ta manuel
#   (helm-values/external-secrets/ + bootstrap F6)
# Codex iter-2 AGREE: base DOĞRUDAN apply edilmez, overlay zorunlu.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-eso-test
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/cluster: test
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: kustomize/overlays/test/eso    # Overlay split — test Vault FQDN
  destination:
    server: https://kubernetes.default.svc    # ArgoCD kendi cluster'ı = test
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false    # ClusterSecretStore silinmesi risk — manuel temizlik
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # external-secrets ns Helm tarafından
      - ServerSideApply=true
