# ArgoCD Application — platform-eso-test (k3d-test cluster, test Vault)
# S2-C2: ESO CR'ları GitOps ile sync (test cluster)
# Prereq: ESO Deployment + Vault AppRole secret-id test Vault'ta manuel
#   (helm-values/external-secrets/ + bootstrap F6)
# Codex iter-2 AGREE: base DOĞRUDAN apply edilmez, overlay zorunlu.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-eso-test
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/cluster: test
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: kustomize/overlays/test/eso    # Overlay split — test Vault FQDN
  destination:
    name: test-cluster    # ArgoCD prod hub registered k3d-test destination
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: false    # ClusterSecretStore silinmesi risk — manuel temizlik
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # external-secrets ns Helm tarafından
      - ServerSideApply=true
  # Keep ESO status/default-field noise out of sync status without ignoring real
  # provider/data/path drift. Mirrors the prod ESO app's narrowed ignore policy.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
    - group: external-secrets.io
      kind: ClusterSecretStore
      jsonPointers:
        - /status
