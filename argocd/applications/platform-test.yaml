# ArgoCD Application — platform-test overlay sync
# S2-C2: test cluster overlay GitOps yönetimi (opsiyonel — dev ergonomics)
# NOT: Test cluster için ArgoCD multi-cluster kayıt gerekli:
#   argocd cluster add k3d-test --name test-cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-test
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: kustomize/overlays/test
  destination:
    name: test-cluster       # argocd cluster add k3d-test --name test-cluster
    namespace: platform-test
  syncPolicy:
    automated:
      # 2026-05-20 — Guardrail PR-2 (ADR-0023, Codex 019e40e4 Option A):
      # İlk aktivasyonda prune: false → ArgoCD test cluster'da overlays/test
      # dışında bulduğu kaynakları SILMEZ; sadece manifest'lerde olanı sync
      # eder. Stabil çalıştıktan sonra ayrı PR ile prune: true'ya çevrilebilir
      # (operatör test cluster'da silinmesi istenmeyen out-of-band kaynak
      # olmadığını teyit edince).
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # 2026-05-14: Phase 2 status ConfigMap writer (Codex `019e25a7`
      # iter-1 P1 absorb).  The smoke CronJob upserts `/data` fields
      # of `frontend-federation-smoke-status` on every fire; without
      # `RespectIgnoreDifferences` Argo auto-sync + selfHeal would
      # repeatedly revert those dynamic values to the GitOps-empty
      # baseline, creating drift-fight noise.  This option, combined
      # with the targeted `ignoreDifferences` block below, makes the
      # GitOps manifest the source of truth for metadata/labels but
      # leaves `/data` to the runtime writer.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Faz 22.6 bounded VIEW_ONLY pilot route 29 is runtime-owned only while
    # the signed TTL watchdog is active. Route 28 remains GitOps-owned by
    # Budget Control. Exact-key ignores prevent Argo self-heal from removing
    # the temporary route without weakening ownership of the ConfigMap.
    - kind: ConfigMap
      name: api-gateway-config
      jsonPointers:
        - /data/SPRING_CLOUD_GATEWAY_ROUTES_29_ID
        - /data/SPRING_CLOUD_GATEWAY_ROUTES_29_URI
        - /data/SPRING_CLOUD_GATEWAY_ROUTES_29_ORDER
        - /data/SPRING_CLOUD_GATEWAY_ROUTES_29_PREDICATES_0
        - /data/SPRING_CLOUD_GATEWAY_ROUTES_29_PREDICATES_1
        - /data/SPRING_CLOUD_GATEWAY_ROUTES_29_FILTERS_0
    # Status ConfigMap `/data` is runtime-managed by the smoke CronJob
    # writer (Codex `019e2580` Sprint 1 E + `019e25a7` iter-1 P1).
    # Argo must NOT revert the dynamic last-fire/result/failures fields.
    - kind: ConfigMap
      name: frontend-federation-smoke-status
      jsonPointers:
        - /data
        # Ops-B core (Codex `019e26c5` R3 absorb): writer annotation extension
        # ile aynı 3 key dinamik update; Argo self-heal revert etmemeli.
        - /metadata/annotations/frontend-federation-smoke.io~1last-fire
        - /metadata/annotations/frontend-federation-smoke.io~1result
        - /metadata/annotations/frontend-federation-smoke.io~1failures
    # ESO runtime/default drift is constrained to status, known v1 defaulted
    # remoteRef fields, and two specific operator/client annotations. This
    # avoids blanket metadata ignore while keeping ExternalSecret specs
    # GitOps-authoritative.
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/annotations/force-sync
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
    # gitops#3653 (2026-09-11): the HPA and self-heal were fighting over
    # spec.replicas. Every HPA-managed Deployment in this overlay pins
    # `replicas: 1` in git; when the HPA scaled one to 2 (schema-service
    # warm-up, 2026-09-10) self-heal applied the git value back within
    # seconds and the second pod was deleted mid-warm-up — measured today:
    # a replica change on a Deployment is reverted 1.2 s later, owner
    # `argocd-controller`. So the HPA could never keep a scale-up on test.
    #
    # The ignore is scoped to the FIELD MANAGER, not the field: the HPA
    # controller writes replicas through the scale subresource as manager
    # `k3s` (k3s bundles kube-controller-manager; live managedFields show
    # `k3s Update scale`), while `kubectl scale` writes as manager
    # `kubectl` — measured on both today. A field owned by `k3s` is left to
    # the HPA; a field owned by anything else (a manual scale, including
    # scale=0) is still self-healed to the git value. That keeps the
    # HARD RULE — TEST Cluster Scale-to-Zero YASAK guard (2026-05-10) intact:
    # a plain `/spec/replicas` jsonPointer ignore would have reopened it.
    # RespectIgnoreDifferences=true above makes the sync leave the HPA-owned
    # value in place instead of forcing the git value back.
    - group: apps
      kind: Deployment
      managedFieldsManagers:
        - k3s
  # 2026-05-10: D17 scale-to-zero ignoreDifferences DEPRECATED.
  # HARD RULE — TEST Cluster Scale-to-Zero YASAK (kullanıcı 2026-05-10
  # kararı): multi-Claude paralel session geliştirme modelinde scale-down
  # unsafe; ArgoCD self-heal manuel scale=0 drift'ini geri alır.
  # Eski yorum: "test-toggle.sh ile 1'e çekildiğinde ArgoCD drift düzeltmesin"
  # Davranış: hiç scale=0 olmamalı; manuel drift olursa ArgoCD self-heal 1'e
  # geri çeker. Yalnız HPA'nın (manager `k3s`) yazdığı replicas serbest —
  # gitops#3653 kuralı yukarıda.
