# ArgoCD Application — platform-test overlay sync
# S2-C2: test cluster overlay GitOps yönetimi (opsiyonel — dev ergonomics)
# NOT: Test cluster için ArgoCD multi-cluster kayıt gerekli:
#   argocd cluster add k3d-test --name test-cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-test
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: kustomize/overlays/test
  destination:
    name: test-cluster       # argocd cluster add k3d-test --name test-cluster
    namespace: platform-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # 2026-05-14: Phase 2 status ConfigMap writer (Codex `019e25a7`
      # iter-1 P1 absorb).  The smoke CronJob upserts `/data` fields
      # of `frontend-federation-smoke-status` on every fire; without
      # `RespectIgnoreDifferences` Argo auto-sync + selfHeal would
      # repeatedly revert those dynamic values to the GitOps-empty
      # baseline, creating drift-fight noise.  This option, combined
      # with the targeted `ignoreDifferences` block below, makes the
      # GitOps manifest the source of truth for metadata/labels but
      # leaves `/data` to the runtime writer.
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Status ConfigMap `/data` is runtime-managed by the smoke CronJob
    # writer (Codex `019e2580` Sprint 1 E + `019e25a7` iter-1 P1).
    # Argo must NOT revert the dynamic last-fire/result/failures fields.
    - kind: ConfigMap
      name: frontend-federation-smoke-status
      jsonPointers:
        - /data
        # Ops-B core (Codex `019e26c5` R3 absorb): writer annotation extension
        # ile aynı 3 key dinamik update; Argo self-heal revert etmemeli.
        - /metadata/annotations/frontend-federation-smoke.io~1last-fire
        - /metadata/annotations/frontend-federation-smoke.io~1result
        - /metadata/annotations/frontend-federation-smoke.io~1failures
  # 2026-05-10: D17 scale-to-zero ignoreDifferences DEPRECATED.
  # HARD RULE — TEST Cluster Scale-to-Zero YASAK (kullanıcı 2026-05-10
  # kararı): multi-Claude paralel session geliştirme modelinde scale-down
  # unsafe; ArgoCD self-heal manuel scale=0 drift'ini geri alır.
  # Eski yorum: "test-toggle.sh ile 1'e çekildiğinde ArgoCD drift düzeltmesin"
  # Yeni davranış: hiç scale=0 olmamalı; drift olursa ArgoCD self-heal 1'e
  # geri çekecek. ignoreDifferences boş bırakıldı (test cluster).
