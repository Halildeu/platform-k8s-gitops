# ArgoCD root.yaml — app-of-apps kök
# Source: docs/S2-C-argocd-install-plan.md
# Apply: S2-C2 session, ArgoCD install sonrasi
#   kubectl --context k3d-prod apply -f argocd/applications/root.yaml
# Codex Tur 1: "ArgoCD MVP'de sadece prod cluster yönetsin" — prod-only hub
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  # Finalizer ile cascade delete (app-of-apps kök silindiğinde child uygulamalar da silinir)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: argocd/applications
    directory:
      recurse: false
      # Exclude pattern (PROD ROOT app-of-apps):
      # - root.yaml kendini include etmesin (recursive loop)
      # - platform-policies.yaml + platform-cert-manager.yaml: DRAFT (CRD
      #   install edilmeden apply fail)
      # NOT (ADR-0023 Guardrail PR-2, Codex 019e40e4 Option A — 2026-05-20):
      #   platform-test.yaml ARTIK un-excluded — prod root, test cluster'a
      #   yönelik Application'ı YÖNETIR (destination.name=test-cluster, prod
      #   in-cluster'a deploy DEĞİL). `argocd cluster add k3d-test` öncesi
      #   Application Unknown/Error kalır (operatör adımı için
      #   docs/operations/RUNBOOKS/RB-argocd-register-test-cluster.md).
      # - platform-eso-test.yaml is now safe to include: it targets the
      #   registered `test-cluster` destination, same as platform-test.yaml.
      exclude: '{root.yaml,platform-policies.yaml,platform-cert-manager.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true        # Git'te silinmiş Application CR'lar cluster'dan silinir
      selfHeal: true     # Cluster drift otomatik düzeltilir
    syncOptions:
      - CreateNamespace=true
