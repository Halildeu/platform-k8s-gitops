# ArgoCD Application — platform-system (platform-wide operator/helm)
# S2-C2: ingress-nginx + ESO + kube-prometheus-stack + Loki + Tempo + Promtail
# NOT: Bu Application Helm chart release'lerini YÖNETMEZ. helm-values/ dizini
# bootstrap/install-*.sh script'leri ile kurulduktan sonra, platform-system
# namespace'leri altında CRD'ler (ServiceMonitor, PrometheusRule, ExternalSecret)
# GitOps ile yönetilir.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-system
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: kustomize/base/monitoring  # S3-A PrometheusRule + Probe CR'ları
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false   # monitoring ns helm tarafından oluşturulmuş olmalı
      - ServerSideApply=true
