# ArgoCD Application — platform-prod overlay sync (MANUAL — D30 atomic cutover)
# S2-C2: prod cluster overlay GitOps (staging-sw-2, D32 sonrasi)
# Codex Tur 3: "Cutover atomic switch — auto-sync YOK, manual trigger"
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: kustomize/overlays/prod
  destination:
    # 2026-04-20: ADR-0002 single-host-dual-cluster (D32 SUPERSEDED).
    # ArgoCD hub k3d-prod içinde; platform-prod overlay aynı cluster'a sync.
    # Önceki `name: prod-cluster` external cluster secret varsayımı Faz D sonrası
    # geçersiz — in-cluster direct sync.
    server: https://kubernetes.default.svc
    namespace: platform-prod
  syncPolicy:
    # MANUAL sync — D30 HARD RULE: atomic cutover
    # Codex PR #1 iter-9 tespit: `automated: {}` ArgoCD docs'a göre auto-sync
    # AÇAR (boş field yeterli). Manual sync için `automated` field TAMAMEN
    # olmamalı.
    # Ref: https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # 2026-04-24 Session 28 — PR #54 ignoreDifferences ServerSideApply ile
      # çakışıyordu; Argo sync sırasında managed field'lar yeniden yaratılıyor
      # ve OutOfSync cosmetic kalıcı. RespectIgnoreDifferences bu çakışmayı
      # çözer: ignore edilen jsonPointers sync sırasında dokunulmaz.
      # Ref: https://argo-cd.readthedocs.io/en/stable/user-guide/sync-options/#respect-ignore-difference-configs
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Prod replicas (D21: sabit 2, HPA yok) — ArgoCD drift düzeltmesin
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    # 2026-04-23 PR #54 (post PR #52 v1beta1→v1 migration):
    # ServerSideApply ile v1 spec dayatıldı ama cluster'da v1beta1 era'dan kalma
    # stored managedFields/annotations/status cosmetic diff üretiyor.
    # Runtime davranışı v1 spec ile birebir (CSS Ready=True, ES SecretSynced=True),
    # fakat Argo diff cosmetic farkı OutOfSync olarak raporluyor.
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        # /metadata tümü + /status (ServerSideApply field manager cosmetic)
        - /metadata
        - /status
      # 2026-04-24 Session 28 T+30 (d investigate): OutOfSync gerçek sebebi
      # ESO v1 API default field'ları (canlıda var, manifest'te yok):
      #   spec.data[].remoteRef.conversionStrategy = "Default"
      #   spec.data[].remoteRef.decodingStrategy = "None"
      #   spec.data[].remoteRef.metadataPolicy = "None"
      #   spec.data[].remoteRef.nullBytePolicy = "Ignore"
      # Argo diff: "manifest'te yok ama canlıda var → OutOfSync"
      # Fix: jqPathExpressions ile bu default alanları targeted ignore
      jqPathExpressions:
        - .spec.data[].remoteRef.conversionStrategy
        - .spec.data[].remoteRef.decodingStrategy
        - .spec.data[].remoteRef.metadataPolicy
        - .spec.data[].remoteRef.nullBytePolicy
    # Host-bridge Endpoints (D20 + PR #49): manifest 10.9.10.53:{5432,8081,8200}
    # ile cluster canlı değerleri birebir, ama subset serialization'da stored
    # v1 bin-format farkı diff üretiyor. Runtime trafik akışı korundu:
    # `ai.acik.com/api/` → K8s ingress-nginx (NodePort 30443) → api-gateway
    # ve pod'lar `postgres/keycloak/vault` Service DNS'leri üstünden
    # 10.9.10.53'teki compose stateful'lara bağlanıyor.
    - kind: Endpoints
      jsonPointers:
        - /subsets
    # openfga-config: base manifest'te placeholder `change-me-local-only`
    # şifreli connection string var; canlı override bu değerle eşleşiyor
    # (test overlay de aynı override yapıyor). ESO ile gerçek şifre
    # seed edilene kadar bu field'ı ignore ediyoruz; aksi halde sync spec'i
    # cluster'a dayatırsa (şu an zaten aynı değer) kozmetik diff üretir.
    - kind: ConfigMap
      name: openfga-config
      jsonPointers:
        - /data/OPENFGA_DATASTORE_URI
