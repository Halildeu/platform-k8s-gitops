# ArgoCD Application — metrics-server (test cluster, kube-system ns)
#
# 2026-05-10 (Codex iter-22 absorb): metrics-server platform overlay'in
# içinde değil, ayrı cluster-addon ArgoCD Application olarak deploy edilir.
# Sebep: namespace transform riski — platform overlay namespace=platform-test
# transformer kube-system resource'larını platform namespace'e taşıyabilir;
# extension-apiserver-authentication-reader RoleBinding'e bağımlılık kırılır.
#
# Source: kustomize/base/metrics-server/ (kubernetes-sigs v0.8.1 + k3d
# --kubelet-insecure-tls patch).
#
# Bağımlılık: PR-471 (HPA foundation) + PR-472 (PROD cost mode) sonrası
# HPA Resource type cpu metric için metrics.k8s.io API gerekli.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server-test
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: cluster-addon
    platform: "true"
    env: test
spec:
  project: default
  source:
    repoURL: https://github.com/Halildeu/platform-k8s-gitops.git
    targetRevision: main
    path: kustomize/base/metrics-server
  # 2026-05-19 (Codex thread `019e42c1` Session 42 B2 fix + ADR-0023 Guardrail
  # PR-2 + Codex `019e40e4` pattern uyum): destination ARTIK `name: test-cluster`
  # external cluster registration ile. Önceki `server: https://kubernetes.default.svc`
  # in-cluster (prod hub) destination YANLIŞTI — prod cluster'da metrics-server
  # resource'larını selfHeal:true ile sürekli reconcile ediyordu ve
  # `metrics-server-test:...` tracking-id basıyordu; bu da `metrics-server-prod`
  # app'i için 9-resource OutOfSync (cosmetic) anlamına geliyordu. Tracked by #858.
  #
  # Pattern (platform-test.yaml ile aynı):
  # - `destination.name: test-cluster` external cluster ArgoCD secret ile bağlanır
  # - `argocd cluster add k3d-test` öncesi Application Unknown/Error kalır (beklenen)
  # - Operator action: docs/operations/RUNBOOKS/RB-argocd-register-test-cluster.md
  # - Cluster register sonrası selfHeal:true ile test cluster otomatik reconcile başlar
  destination:
    name: test-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false       # kube-system add-on silinme risk; manual prune
      selfHeal: true     # test cluster register sonrası dev ergonomics
    syncOptions:
      - CreateNamespace=false   # kube-system zaten var
      - ServerSideApply=true
