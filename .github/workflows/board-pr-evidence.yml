name: Board — PR merge evidence

# A merged PR's `Tracked by <ref>` lines move the linked roadmap board item
# to Needs Verify and post a machine-readable EVIDENCE comment. Thin wrapper:
# all board logic lives in scripts/board-sync.sh (verify subcommand).
# Protocol: docs/board-protocol.md sections 5 and 15.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  # #1085: fall back to GITHUB_TOKEN when ADD_TO_PROJECT_PAT is unset.
  # GITHUB_TOKEN can write issue comments and read pull requests but
  # cannot mutate org-level projects (Status field) — those mutations
  # require a PAT with `project` scope. The fallback path still produces
  # an EVIDENCE comment on every Tracked-by issue; the board Status
  # move stays a no-op until the operator seeds the PAT. The workflow
  # logs the missing-PAT case in the step summary and exits 0 (no
  # error noise), so a fresh fork / rotated secret doesn't fail every
  # merge.
  issues: write
  pull-requests: read

jobs:
  pr-evidence:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: board-sync verify for each Tracked-by ref
        # #1085: ADD_TO_PROJECT_PAT is the canonical token (project-scope
        # mutations require a PAT — GITHUB_TOKEN cannot write org-level
        # project Status). When the PAT is unset (e.g. a fresh fork or
        # a rotated secret) the workflow falls back to GITHUB_TOKEN so
        # the issue-comment half of the evidence path still runs; the
        # step summary surfaces a clear "PAT missing → board Status
        # mutation skipped" notice so the operator sees what half ran.
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT || secrets.GITHUB_TOKEN }}
          BOARD_PAT_PRESENT: ${{ secrets.ADD_TO_PROJECT_PAT != '' && '1' || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # The fallback only helps if SOME token expanded. Empty
          # GH_TOKEN here means neither the PAT nor GITHUB_TOKEN
          # produced anything — workflow-config bug, fail loudly.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty (neither ADD_TO_PROJECT_PAT nor GITHUB_TOKEN expanded)"
            exit 1
          fi
          if ! gh auth status >/dev/null 2>&1; then
            echo "::error::gh auth status failed — token present but invalid"
            exit 1
          fi
          if [ -z "${BOARD_PAT_PRESENT:-}" ]; then
            {
              echo "⚠️ ADD_TO_PROJECT_PAT secret is unset — using GITHUB_TOKEN fallback."
              echo
              echo "Issue-comment EVIDENCE half will run normally;"
              echo "**board Status mutation will be SKIPPED** (project field"
              echo "writes require a PAT with \`project\` scope)."
              echo
              echo "To close the second half: seed \`ADD_TO_PROJECT_PAT\`"
              echo "with a fine-grained PAT (Org → Halildeu, Projects: Read+Write)."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # tracked-by line(s) -> ref token(s): #N, owner/repo#N, or issue URL.
          refs="$(printf '%s\n' "${PR_BODY:-}" \
            | grep -iE '^[[:space:]]*tracked[ -]?by\b' \
            | grep -oE '(https://github\.com/[^ ]+/issues/[0-9]+|[A-Za-z0-9._-]+/[A-Za-z0-9._-]+#[0-9]+|#[0-9]+)' \
            | head -20 || true)"
          if [ -z "$refs" ]; then
            echo "PR #$PR_NUMBER — no 'Tracked by' refs; nothing to do." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          n=0
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            n=$((n + 1))
            echo "::group::verify $ref (PR #$PR_NUMBER)"
            scripts/board-sync.sh verify "${ref#\#}" --pr "$PR_NUMBER" --pr-repo "$PR_REPO"
            echo "::endgroup::"
          done <<< "$refs"
          echo "PR #$PR_NUMBER — board-sync verify ran for $n Tracked-by ref(s)." \
            | tee -a "$GITHUB_STEP_SUMMARY"
