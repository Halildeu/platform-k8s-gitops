name: Board — PR merge evidence

# A merged PR's `Tracked by <ref>` lines move the linked roadmap board item
# to Needs Verify and post a machine-readable EVIDENCE comment. Thin wrapper:
# all board logic lives in scripts/board-sync.sh (verify subcommand).
# Protocol: docs/board-protocol.md sections 5 and 15.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  # #1085: GITHUB_TOKEN fallback path needs `issues: write` so the
  # workflow can post the EVIDENCE comment when ADD_TO_PROJECT_PAT is
  # unset (org-level project mutation still requires the PAT — see the
  # cmd_verify PAT-missing branch in board-sync.sh). The PR body itself
  # is read from the event payload (github.event.pull_request.body), so
  # `pull-requests` read is not needed; keeping the perm set minimal.
  issues: write

jobs:
  pr-evidence:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: board-sync verify for each Tracked-by ref
        # #1085 Codex 019e8079: ADD_TO_PROJECT_PAT is the canonical token
        # (project-scope mutations require a PAT — GITHUB_TOKEN cannot
        # write org-level project Status). When the PAT is unset (fresh
        # fork or rotated secret) we fall back to GITHUB_TOKEN so the
        # issue-comment half of the evidence path still runs;
        # board-sync.sh verify routes to a comment-only branch keyed on
        # BOARD_PAT_PRESENT="" that skips Project API entirely and never
        # writes a "needs-verify" body without also moving the board
        # (drift-prevention). Cross-repo refs are skipped with a clear
        # warning so the workflow loop does not die mid-Tracked-by.
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT || secrets.GITHUB_TOKEN }}
          BOARD_PAT_PRESENT: ${{ secrets.ADD_TO_PROJECT_PAT != '' && '1' || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty (neither ADD_TO_PROJECT_PAT nor GITHUB_TOKEN expanded)"
            exit 1
          fi
          if ! gh auth status >/dev/null 2>&1; then
            echo "::error::gh auth status failed — token present but invalid"
            exit 1
          fi
          if [ -z "${BOARD_PAT_PRESENT:-}" ]; then
            {
              echo "## ⚠️ Action required: seed \`ADD_TO_PROJECT_PAT\`"
              echo
              echo "Running under \`GITHUB_TOKEN\` fallback (the \`ADD_TO_PROJECT_PAT\` secret is unset)."
              echo
              echo "| Half | This run |"
              echo "|---|---|"
              echo "| EVIDENCE comment on same-repo \`Tracked by\` refs | ✓ runs |"
              echo "| Board Status \`Needs Verify\` (project field mutation) | ⏭ skipped |"
              echo "| Cross-repo refs (e.g. owner/other-repo#42) | ⏭ skipped |"
              echo
              echo "### Required PAT scope (Codex 019e809d iter-3 must_fix)"
              echo
              echo "Once \`ADD_TO_PROJECT_PAT\` is seeded the SAME token handles both halves of every verify run — Project field mutation **and** issue comment/body read+write. A PAT scoped only to Projects will repair the board half but die on the next \`gh issue view/comment/edit\` call. Required scope:"
              echo
              echo "- **Organization** (Halildeu): **Projects → Read & Write**"
              echo "- **Repository** access — every roadmap-tracked repo (e.g. \`platform-k8s-gitops\`, \`platform-backend\`, \`platform-web\`): **Issues → Read & Write**, **Metadata → Read**"
              echo "- If you expect cross-repo \`Tracked by\` refs (sibling roadmap issues), include those sibling repos in the same PAT — otherwise cross-repo refs keep skipping."
              echo "- Classic PAT alternative: \`repo\` + \`project\` (or \`read:project\` + \`write:project\`)."
              echo
              echo "Settings → Secrets and variables → Actions → \`ADD_TO_PROJECT_PAT\`."
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # tracked-by line(s) -> ref token(s): #N, repo#N, owner/repo#N, or issue URL.
          refs="$(printf '%s\n' "${PR_BODY:-}" \
            | grep -iE '^[[:space:]]*tracked[ -]?by\b' \
            | grep -oE '(https://github\.com/[^ ]+/issues/[0-9]+|[A-Za-z0-9._-]+/[A-Za-z0-9._-]+#[0-9]+|[A-Za-z0-9._-]+#[0-9]+|#[0-9]+)' \
            | head -20 || true)"
          if [ -z "$refs" ]; then
            echo "PR #$PR_NUMBER — no 'Tracked by' refs; nothing to do." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          n=0
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            n=$((n + 1))
            echo "::group::verify $ref (PR #$PR_NUMBER)"
            scripts/board-sync.sh verify "${ref#\#}" --pr "$PR_NUMBER" --pr-repo "$PR_REPO"
            echo "::endgroup::"
          done <<< "$refs"
          echo "PR #$PR_NUMBER — board-sync verify ran for $n Tracked-by ref(s)." \
            | tee -a "$GITHUB_STEP_SUMMARY"
