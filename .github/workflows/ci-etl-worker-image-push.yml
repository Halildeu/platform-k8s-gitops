# Faz 16.3 + Faz 21.3 master data ETL — etl-worker image build + GHCR push
#
# Tetikleyici: 2026-04-29 kullanıcı feedback "MSSQL'de var ama PG'ye
# çekeceğiz, bilgiler ordan yetkilendirme yapacağız. MSSQL readonly".
# scripts/migration/etl_worker/ image build pipeline'ı yoktu (Dockerfile
# mevcut ama CI workflow eksikti). Bu workflow image'ı GHCR'a push eder.
#
# Output: ghcr.io/halildeu/platform/etl-worker:sha-<short>
# Sonra kustomize/base/apps/etl-worker/job.yaml PLACEHOLDER_DIGEST
# substitute edilir + operatör K8s Job apply eder (manuel, runbook
# `docs/etl-worker-staging-dry-run.md` per).
#
# D27 uyumlu (community-standard Docker build-push action).
# D30 immutable artifact (sha-<short> tag + digest pinnable).

name: CI - ETL Worker Image Push

on:
  push:
    branches: [main]
    paths:
      - "scripts/migration/etl_worker/**"
      - ".github/workflows/ci-etl-worker-image-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: halildeu
  IMAGE_NAME: platform/etl-worker

jobs:
  build-and-push:
    name: Build + Push etl-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build + Push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: scripts/migration/etl_worker
          file: scripts/migration/etl_worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=etl-worker
          cache-to: type=gha,scope=etl-worker,mode=max
          provenance: false

      - name: Summary — digest (Job manifest pin için kanıt)
        run: |
          echo "### etl-worker image push" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`sha-${{ steps.sha.outputs.short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pinnable**: \`${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Operatör: kustomize/base/apps/etl-worker/job.yaml içinde \`PLACEHOLDER_DIGEST\` → bu digest ile substitute + apply (runbook \`docs/etl-worker-staging-dry-run.md\` per)." >> $GITHUB_STEP_SUMMARY
