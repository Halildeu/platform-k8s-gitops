name: Faz 24 Product Gate Operator Handoff

# Builds a metadata-only operator handoff package for platform-k8s-gitops#1615
# G-CAP/G-OPS/G-COMP evidence sequencing. This workflow does not collect
# runtime evidence, run pilots, mutate Kubernetes/Vault/firewall/legal state,
# ingest evidence, or make product-gate acceptance claims.

on:
  workflow_dispatch:
    inputs:
      operator_batch_id:
        description: "Symbolic operator batch id"
        required: true
        default: "faz24-product-gate-20260628"
      gitops_ref:
        description: "Git ref used by follow-up ingest workflows"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: faz24-product-gate-operator-handoff
  cancel-in-progress: false

jobs:
  package:
    name: build product-gate operator handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HANDOFF_DIR: /tmp/faz24-product-gate-operator-handoff-${{ github.run_id }}

    steps:
      - name: Validate dispatch inputs
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "${value}" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be single-line"
                exit 1
                ;;
            esac
          }

          reject_unsupported_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.:@/+~-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          reject_path_escape() {
            name="$1"
            value="$2"
            if printf '%s' "${value}" | grep -Eq '(^/|(^|/)\.\.(/|$)|^[A-Za-z]:)'; then
              echo "::error::${name} must stay inside the handoff boundary"
              exit 1
            fi
          }

          reject_multiline operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_multiline gitops_ref "${GITOPS_REF}"
          reject_unsupported_chars operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_unsupported_chars gitops_ref "${GITOPS_REF}"
          reject_path_escape operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_path_escape gitops_ref "${GITOPS_REF}"

          all_inputs="${OPERATOR_BATCH_ID}${GITOPS_REF}"
          if printf '%s' "${all_inputs}" | grep -Eq -- '-----BEGIN .*PRIVATE KEY-----|-----BEGIN CERTIFICATE-----|Bearer |eyJ[A-Za-z0-9_-]+\.|data:audio/[A-Za-z0-9.+-]+;base64,'; then
            echo "::error::inputs must not contain certificate/private/secret/raw-audio-like material"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build handoff package
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
        run: |
          set -euo pipefail
          python3 scripts/faz24/build-product-gate-operator-handoff.py \
            --output-dir "${HANDOFF_DIR}" \
            --operator-batch-id "${OPERATOR_BATCH_ID}" \
            --gitops-ref "${GITOPS_REF}"

      - name: Verify handoff artifact boundary
        run: |
          set -euo pipefail
          test -s "${HANDOFF_DIR}/README.md"
          test -s "${HANDOFF_DIR}/faz24-product-gate-operator-handoff.json"
          test -s "${HANDOFF_DIR}/SHA256SUMS"
          if grep -R -E -- '-----BEGIN (CERTIFICATE|OPENSSH |RSA |EC |DSA )|-----END (CERTIFICATE|OPENSSH |RSA |EC |DSA )|Bearer |eyJ[A-Za-z0-9_-]+\.|data:audio/[A-Za-z0-9.+-]+;base64,' "${HANDOFF_DIR}"; then
            echo "::error::handoff artifact contains forbidden certificate/private/token/raw-audio-like material"
            exit 1
          fi
          (cd "${HANDOFF_DIR}" && sha256sum --check SHA256SUMS)
          python3 - <<'PY' "${HANDOFF_DIR}/faz24-product-gate-operator-handoff.json"
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["schemaVersion"] == "faz24.productGate.operator-handoff.v1"
          assert data["acceptanceBoundary"]["operatorExecutionRequired"] is True
          assert data["acceptanceBoundary"]["gcapVerifierPassRequired"] is True
          assert data["acceptanceBoundary"]["gopsVerifierPassRequired"] is True
          assert data["acceptanceBoundary"]["gcompVerifierPassRequired"] is True
          assert data["acceptanceBoundary"]["legalTrackParallel"] is True
          assert data["acceptanceBoundary"]["kvkkOwnerLegalAcceptanceNotEngineeringBlocker"] is True
          assert data["mutationBoundary"]["packageBuildClusterMutation"] is False
          assert data["mutationBoundary"]["packageBuildVaultMutation"] is False
          assert data["mutationBoundary"]["packageBuildLegalMutation"] is False
          assert data["mutationBoundary"]["containsCredentials"] is False
          assert data["mutationBoundary"]["containsRawAudio"] is False
          assert data["mutationBoundary"]["containsUnredactedPersonalData"] is False
          PY

      - name: Write workflow summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 product-gate operator handoff"
            echo
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-product-gate-operator-handoff-${{ github.run_id }}\`"
            echo "- GitOps issue: #1615"
            echo
            echo "Boundary: metadata-only coordination artifact. It does not collect runtime evidence, run pilots, mutate Kubernetes/Vault/firewall/legal state, ingest evidence, produce legal go, or mark #1615 accepted."
            echo
            if [ -s "${HANDOFF_DIR}/README.md" ]; then
              sed -n '1,220p' "${HANDOFF_DIR}/README.md"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload handoff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: faz24-product-gate-operator-handoff-${{ github.run_id }}
          path: ${{ env.HANDOFF_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local handoff directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${HANDOFF_DIR}"
