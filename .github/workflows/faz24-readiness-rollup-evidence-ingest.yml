name: Faz 24 Readiness Rollup Evidence Ingest

# Validates a redacted Faz 24 rollup evidence envelope for #1615. This workflow
# does not collect evidence, mutate runtime, seed secrets, enable direct-STT, run
# desktop capture, perform legal acceptance, or claim production readiness.

on:
  workflow_dispatch:
    inputs:
      evidence_json_base64:
        description: "Base64 of faz24.readinessRollupEvidence.v1 JSON"
        required: true

permissions:
  contents: read

concurrency:
  group: faz24-readiness-rollup-evidence-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: verify Faz 24 readiness rollup evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EVIDENCE_DIR: /tmp/faz24-readiness-rollup-${{ github.run_id }}
      EVIDENCE_JSON: /tmp/faz24-readiness-rollup-${{ github.run_id }}/faz24-readiness-rollup.json
      SUMMARY_JSON: /tmp/faz24-readiness-rollup-${{ github.run_id }}/verification-summary.json

    steps:
      - name: Validate dispatch input
        env:
          EVIDENCE_JSON_BASE64: ${{ inputs.evidence_json_base64 }}
        run: |
          set -euo pipefail

          case "${EVIDENCE_JSON_BASE64}" in
            *$'\n'*|*$'\r'*)
              echo "::error::evidence_json_base64 must be a single line"
              exit 1
              ;;
          esac

          if [ "${#EVIDENCE_JSON_BASE64}" -gt 200000 ]; then
            echo "::error::evidence_json_base64 is too large"
            exit 1
          fi

          if ! printf '%s' "${EVIDENCE_JSON_BASE64}" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            echo "::error::evidence_json_base64 must be plain base64"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Decode evidence JSON
        env:
          EVIDENCE_JSON_BASE64: ${{ inputs.evidence_json_base64 }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          printf '%s' "${EVIDENCE_JSON_BASE64}" | base64 -d > "${EVIDENCE_JSON}"
          python3 -m json.tool "${EVIDENCE_JSON}" > "${EVIDENCE_JSON}.pretty"
          mv "${EVIDENCE_JSON}.pretty" "${EVIDENCE_JSON}"

      - name: Verify Faz 24 readiness rollup evidence
        id: verify
        run: |
          set +e
          python3 scripts/faz24/verify_faz24_readiness_rollup.py \
            --evidence-file "${EVIDENCE_JSON}" \
            --output-file "${SUMMARY_JSON}" \
            > "${EVIDENCE_DIR}/verifier.stdout" \
            2> "${EVIDENCE_DIR}/verifier.stderr"
          exit_code="$?"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          cat "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
          exit 0

      - name: Verify artifact excludes private material
        id: secret_scan
        if: always()
        run: |
          set -euo pipefail
          if grep -R -I -q -E \
            -e '-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----' \
            -e '-----END (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----' \
            -e '-----BEGIN CERTIFICATE-----' \
            -e 'Bearer ' \
            -e 'Authorization:' \
            -e 'eyJ[A-Za-z0-9_-]+\.' \
            -e 'data:audio/[A-Za-z0-9.+-]+;base64,' \
            -e '"(access_token|refresh_token|token|jwt|password|secret|private_key|audio|raw_audio|transcript|prompt|response|payload|email|phone|telephone|full_name)"[[:space:]]*:' \
            -- "${EVIDENCE_DIR}"; then
            echo "::error::readiness rollup artifact contains forbidden private/secret/raw media/personal material"
            exit 1
          fi

      - name: Write workflow summary
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 readiness rollup evidence ingest"
            echo
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-readiness-rollup-${{ github.run_id }}\`"
            echo "- Verifier exit code: \`${VERIFY_EXIT_CODE:-missing}\`"
            echo
            echo "Boundary: no evidence collection, runtime/Kubernetes/Vault/firewall/legal mutation, direct-STT enablement, desktop capture, raw audio, transcript payload, legal acceptance, or production readiness claim."
            echo
            echo '```text'
            sed -n '1,200p' "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
            sed -n '1,200p' "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence ingest artifact
        if: always() && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: faz24-readiness-rollup-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local evidence directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"

      - name: Fail workflow when evidence is rejected
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ -z "${VERIFY_EXIT_CODE}" ]; then
            echo "::error::readiness rollup verifier did not expose an exit code"
            exit 1
          fi
          if [ "${VERIFY_EXIT_CODE}" != "0" ]; then
            echo "::error::Faz 24 readiness rollup evidence was rejected"
            exit "${VERIFY_EXIT_CODE}"
          fi
