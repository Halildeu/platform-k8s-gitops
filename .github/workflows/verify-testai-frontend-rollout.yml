name: Verify testai frontend GitOps rollout

on:
  push:
    branches: [main]
    paths:
      - "kustomize/overlays/test/kustomization.yaml"
      - ".github/workflows/verify-testai-frontend-rollout.yml"
      - "scripts/automation/test-overlay-frontend-image.py"
      - "scripts/deploy/check-testai-frontend-rollout-headroom.py"
      - "scripts/deploy/preflight-testai-frontend-rollout.sh"
      - "scripts/deploy/verify-testai-frontend-runtime.sh"
      - "scripts/faz22/sync-platform-test-gitops.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testai-frontend-promotion
  cancel-in-progress: false

jobs:
  verify:
    name: Reconcile merged pin and verify cluster runtime
    runs-on: [self-hosted, aiserver, testai-deploy]
    timeout-minutes: 15

    steps:
      - name: Checkout merged desired state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - name: Detect frontend pin change and resolve expectation
        id: pin
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_REVISION: ${{ github.sha }}
          KUSTOMIZATION: kustomize/overlays/test/kustomization.yaml
        run: |
          set -euo pipefail
          current=$(python3 scripts/automation/test-overlay-frontend-image.py inspect \
            --kustomization "$KUSTOMIZATION")
          tag=$(jq -r '.tag // empty' <<< "$current")
          source_sha=$(jq -r '.source_sha // empty' <<< "$current")
          digest=$(jq -r '.digest // empty' <<< "$current")
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::frontend overlay is missing a machine-readable full sourceRevision"; exit 1;
          }
          [[ "$tag" =~ ^sha-[a-f0-9]{7}$ ]] || {
            echo "::error::frontend overlay is missing a machine-readable sha-* newTag"; exit 1;
          }
          [[ "${source_sha:0:7}" == "${tag#sha-}" ]] || {
            echo "::error::frontend sourceRevision and newTag disagree"; exit 1;
          }
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::frontend overlay digest is malformed"; exit 1;
          }

          should_verify=true
          reconcile_revision="$CURRENT_REVISION"

          # A newer main commit may land while this run is queued. Never ask
          # ArgoCD to move backwards. If latest main carries the same frontend
          # pin, reconcile latest; if it carries a newer frontend pin, this run
          # is superseded and the newer push owns verification.
          git fetch origin main --depth=1 --quiet
          latest_revision=$(git rev-parse FETCH_HEAD)
          if [[ "$latest_revision" != "$CURRENT_REVISION" ]]; then
            latest_file="$RUNNER_TEMP/frontend-overlay-latest.yaml"
            git show "${latest_revision}:${KUSTOMIZATION}" > "$latest_file"
            latest=$(python3 scripts/automation/test-overlay-frontend-image.py inspect \
              --kustomization "$latest_file")
            if [[ "$latest" == "$current" ]]; then
              reconcile_revision="$latest_revision"
              echo "::notice::newer main carries the same frontend pin; reconciling ${latest_revision}"
            else
              should_verify=false
              echo "::notice::frontend pin superseded by ${latest_revision}; newer push owns verification"
            fi
          fi

          if [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            before_file="$RUNNER_TEMP/frontend-overlay-before.yaml"
            if git show "${BEFORE_SHA}:${KUSTOMIZATION}" > "$before_file" 2>/dev/null; then
              before=$(python3 scripts/automation/test-overlay-frontend-image.py inspect \
                --kustomization "$before_file")
              if [[ "$before" == "$current" ]]; then
                if git diff --quiet "$BEFORE_SHA" "$CURRENT_REVISION" -- \
                  .github/workflows/verify-testai-frontend-rollout.yml \
                  scripts/automation/test-overlay-frontend-image.py \
                  scripts/deploy/check-testai-frontend-rollout-headroom.py \
                  scripts/deploy/preflight-testai-frontend-rollout.sh \
                  scripts/deploy/verify-testai-frontend-runtime.sh \
                  scripts/faz22/sync-platform-test-gitops.sh; then
                  should_verify=false
                  echo "::notice::test overlay changed outside the frontend image/rollout contract; frontend runtime verification skipped"
                else
                  echo "::notice::frontend verification contract changed; reconciling and verifying the current immutable pin"
                fi
              fi
            fi
          fi

          {
            echo "should_verify=$should_verify"
            echo "reconcile_revision=$reconcile_revision"
            echo "tag=$tag"
            echo "source_sha=$source_sha"
            echo "short_sha=${tag#sha-}"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Preflight live quota headroom before Argo mutation
        if: steps.pin.outputs.should_verify == 'true'
        env:
          PREFLIGHT_REPORT_PATH: ${{ runner.temp }}/testai-frontend-quota-preflight.json
        run: bash scripts/deploy/preflight-testai-frontend-rollout.sh

      - name: Reconcile main revision through ArgoCD
        id: reconcile
        if: steps.pin.outputs.should_verify == 'true'
        continue-on-error: true
        env:
          REVISION: ${{ steps.pin.outputs.reconcile_revision }}
          REPORT_PATH: ${{ runner.temp }}/platform-test-frontend-sync-report.json
          ALLOW_KUBECTL_SELECTED_RESOURCE_FALLBACK: "false"
        run: bash scripts/faz22/sync-platform-test-gitops.sh

      - name: Verify exact pod digest
        id: runtime
        if: always() && steps.pin.outputs.should_verify == 'true'
        run: |
          bash scripts/deploy/verify-testai-frontend-runtime.sh \
            --expected-digest "${{ steps.pin.outputs.digest }}" \
            --expected-sha "${{ steps.pin.outputs.source_sha }}" \
            --expected-short-sha "${{ steps.pin.outputs.short_sha }}" \
            --cluster-only

      - name: Upload ArgoCD reconciliation report
        if: always() && steps.pin.outputs.should_verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testai-frontend-gitops-rollout-${{ steps.pin.outputs.reconcile_revision }}
          path: |
            ${{ runner.temp }}/testai-frontend-quota-preflight.json
            ${{ runner.temp }}/platform-test-frontend-sync-report.json
          retention-days: 14

      - name: Classify reconciliation and exact runtime evidence
        if: always() && steps.pin.outputs.should_verify == 'true'
        env:
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          EXPECTED_REVISION: ${{ steps.pin.outputs.reconcile_revision }}
          REPORT_PATH: ${{ runner.temp }}/platform-test-frontend-sync-report.json
        run: |
          set -euo pipefail

          [[ "$RUNTIME_OUTCOME" == "success" ]] || {
            echo "::error::exact frontend cluster runtime verification did not pass (outcome=$RUNTIME_OUTCOME)"
            exit 1
          }

          if [[ "$RECONCILE_OUTCOME" == "success" ]]; then
            echo "PASS: ArgoCD reconciliation and exact frontend cluster runtime verification succeeded"
            exit 0
          fi

          [[ -s "$REPORT_PATH" ]] || {
            echo "::error::ArgoCD reconciliation failed without a report"
            exit 1
          }

          jq -e --arg revision "$EXPECTED_REVISION" '
            .verdict == "FAIL"
            and .observed_revision == $revision
            and .sync_status == "Synced"
            and .health_status == "Degraded"
            and (.reason | contains("ArgoCD sync command failed"))
          ' "$REPORT_PATH" >/dev/null || {
            echo "::error::failed reconciliation is not bounded to a synced revision with unrelated degradation"
            exit 1
          }

          degraded_resources=$(kubectl --context k3d-prod -n argocd \
            get application platform-test -o json \
            | jq -c '[.status.resources[] | select(.health.status == "Degraded") | {group, kind, namespace, name}]')

          jq -e '
            length > 0
            and all(.[]; .kind != "Deployment" or .namespace != "platform-test" or .name != "frontend")
          ' <<< "$degraded_resources" >/dev/null || {
            echo "::error::ArgoCD degradation set is empty or includes the frontend deployment"
            exit 1
          }

          echo "::warning::ArgoCD application remains Degraded only on non-frontend resources: $degraded_resources"
          echo "PASS: exact frontend digest is live at the requested synced revision"

      - name: Verification summary
        if: always()
        run: |
          {
            echo "## testai frontend GitOps verification"
            echo ""
            echo "- merged revision: \`${{ github.sha }}\`"
            echo "- reconciled revision: \`${{ steps.pin.outputs.reconcile_revision }}\`"
            echo "- frontend changed: \`${{ steps.pin.outputs.should_verify }}\`"
            echo "- expected tag: \`${{ steps.pin.outputs.tag }}\`"
            echo "- expected source: \`${{ steps.pin.outputs.source_sha }}\`"
            echo "- expected digest: \`${{ steps.pin.outputs.digest }}\`"
            echo "- rollout policy: \`maxSurge=1 / maxUnavailable=0\`"
            echo "- quota gate: rendered frontend + desired/live ResourceQuota"
            echo "- mutation path: ArgoCD application reconciliation only"
            echo "- public WG/corporate browser route: separate acceptance gate"
            echo "- authenticated Meeting behavior: separate acceptance gate"
          } >> "$GITHUB_STEP_SUMMARY"
