name: Faz 24 External Recorder Operator Handoff

# Builds a metadata-only operator handoff package for platform-k8s-gitops#1615
# external meeting-admin and recorder lifecycle evidence. This workflow does
# not mint or read tokens, connect to testai, mutate Keycloak, Kubernetes,
# Vault, or production, run the smoke, or send audio.

on:
  workflow_dispatch:
    inputs:
      operator_batch_id:
        description: "Symbolic operator batch id"
        required: true
        default: "faz24-external-recorder-20260628"
      gitops_ref:
        description: "Git ref used by follow-up ingest workflows"
        required: true
        default: "main"
      base_url:
        description: "Public testai base URL"
        required: true
        default: "https://testai.acik.com"
      expected_issuer:
        description: "Expected platform-test issuer URL"
        required: true
        default: "https://testai.acik.com/realms/platform-test"

permissions:
  contents: read

concurrency:
  group: faz24-external-recorder-operator-handoff
  cancel-in-progress: false

jobs:
  package:
    name: build external recorder operator handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HANDOFF_DIR: /tmp/faz24-external-recorder-operator-handoff-${{ github.run_id }}

    steps:
      - name: Validate dispatch inputs
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
          BASE_URL: ${{ inputs.base_url }}
          EXPECTED_ISSUER: ${{ inputs.expected_issuer }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "${value}" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be single-line"
                exit 1
                ;;
            esac
          }

          reject_symbol_unsupported_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.:@/+~-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          reject_path_escape() {
            name="$1"
            value="$2"
            if printf '%s' "${value}" | grep -Eq '(^/|(^|/)\.\.(/|$)|^[A-Za-z]:)'; then
              echo "::error::${name} must stay inside the handoff boundary"
              exit 1
            fi
          }

          require_https_url() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$'; then
              echo "::error::${name} must be a bounded https URL without credentials, query, or fragment"
              exit 1
            fi
            if printf '%s' "${value}" | grep -Eq '(^|/)\.\.(/|$)|@|[?&=#]'; then
              echo "::error::${name} must not contain path escape, credentials, query, or fragment"
              exit 1
            fi
          }

          reject_multiline operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_multiline gitops_ref "${GITOPS_REF}"
          reject_multiline base_url "${BASE_URL}"
          reject_multiline expected_issuer "${EXPECTED_ISSUER}"

          reject_symbol_unsupported_chars operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_symbol_unsupported_chars gitops_ref "${GITOPS_REF}"
          reject_path_escape operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_path_escape gitops_ref "${GITOPS_REF}"
          require_https_url base_url "${BASE_URL}"
          require_https_url expected_issuer "${EXPECTED_ISSUER}"

          all_inputs="${OPERATOR_BATCH_ID}${GITOPS_REF}${BASE_URL}${EXPECTED_ISSUER}"
          if printf '%s' "${all_inputs}" | grep -Eq -- '-----BEGIN .*PRIVATE KEY-----|-----BEGIN CERTIFICATE-----|Bearer |eyJ[A-Za-z0-9_-]+\.'; then
            echo "::error::inputs must not contain certificate/private/secret-like material"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build handoff package
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
          BASE_URL: ${{ inputs.base_url }}
          EXPECTED_ISSUER: ${{ inputs.expected_issuer }}
        run: |
          set -euo pipefail
          python3 scripts/faz24/build-external-recorder-operator-handoff.py \
            --output-dir "${HANDOFF_DIR}" \
            --operator-batch-id "${OPERATOR_BATCH_ID}" \
            --gitops-ref "${GITOPS_REF}" \
            --base-url "${BASE_URL}" \
            --expected-issuer "${EXPECTED_ISSUER}"

      - name: Verify handoff artifact boundary
        env:
          EXPECTED_BASE_URL: ${{ inputs.base_url }}
          EXPECTED_ISSUER_URL: ${{ inputs.expected_issuer }}
        run: |
          set -euo pipefail
          test -s "${HANDOFF_DIR}/README.md"
          test -s "${HANDOFF_DIR}/faz24-external-recorder-operator-handoff.json"
          test -s "${HANDOFF_DIR}/SHA256SUMS"
          if grep -R -E -- '-----BEGIN (CERTIFICATE|OPENSSH |RSA |EC |DSA )|-----END (CERTIFICATE|OPENSSH |RSA |EC |DSA )|Bearer |eyJ[A-Za-z0-9_-]+\.' "${HANDOFF_DIR}"; then
            echo "::error::handoff artifact contains forbidden certificate/private/secret-like material"
            exit 1
          fi
          (cd "${HANDOFF_DIR}" && sha256sum --check SHA256SUMS)
          python3 - <<'PY' "${HANDOFF_DIR}/faz24-external-recorder-operator-handoff.json"
          import json
          import os
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["schemaVersion"] == "faz24.externalRecorder.operator-handoff.v1"
          assert data["acceptanceBoundary"]["operatorExecutionRequired"] is True
          assert data["acceptanceBoundary"]["tokenContractPassRequired"] is True
          assert data["acceptanceBoundary"]["externalSmokePassRequired"] is True
          assert data["acceptanceBoundary"]["smokeVerifierPassRequired"] is True
          assert data["mutationBoundary"]["packageBuildKeycloakMutation"] is False
          assert data["mutationBoundary"]["packageBuildClusterMutation"] is False
          assert data["mutationBoundary"]["containsCredentials"] is False
          assert data["target"]["baseUrl"] == os.environ["EXPECTED_BASE_URL"]
          assert data["target"]["expectedIssuer"] == os.environ["EXPECTED_ISSUER_URL"]
          PY

      - name: Write workflow summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 external recorder operator handoff"
            echo
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-external-recorder-operator-handoff-${{ github.run_id }}\`"
            echo "- GitOps issue: #1615"
            echo
            echo "Boundary: metadata-only coordination artifact. It does not mint/read tokens, connect to testai, mutate Keycloak/Kubernetes/Vault/production, run the smoke, send audio, or mark #1615 accepted."
            echo
            if [ -s "${HANDOFF_DIR}/README.md" ]; then
              sed -n '1,200p' "${HANDOFF_DIR}/README.md"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload handoff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: faz24-external-recorder-operator-handoff-${{ github.run_id }}
          path: ${{ env.HANDOFF_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local handoff directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${HANDOFF_DIR}"
