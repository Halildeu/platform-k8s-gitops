# ADR-0011 Drift Detection (umbrella workflow — DD-1 + DD-2 + DD-4 + DD-5)
#
# Codex `019dd409` PARTIAL/AGREE-with-revisions: tek workflow, multiple drift
# scripts. Failure CI red → blocks merge of any data_access schema / ETL
# contract change PR.
#
# DD-5 (Codex `019f531e`, gitops #2313): the scripts/drift_detection/tests/
# unit suite (deployment-contract + service-catalog drift guards) — a parallel
# test tree that previously ran in NO workflow, letting #2287 sit red for 5+
# weeks. Now discovered + run here; docs/operations/services.yaml is in the
# path filter so a catalog-only prod-state regression triggers the guard.
#
# Triggers:
#   - workflow_dispatch (manuel debug + ad-hoc run)
#   - schedule weekly Mon 03:30 UTC (regression catch on stale main)
#   - pull_request paths filter (data_access schema, ETL contract, ADR docs)
#
# Authority: Codex consensus only (no operator approval — read-only static
# analysis, no state mutation, no credential read).

name: ADR-0011 Drift Detection Guards

on:
  workflow_dispatch:
  schedule:
    # Weekly Mon 03:30 UTC — catches drift on main after last merge week
    - cron: "30 3 * * 1"
  pull_request:
    paths:
      - ".github/workflows/gate-drift-detection.yml"
      - "scripts/drift_detection/**"
      - "tests/drift_detection/**"
      # DD-5 reads the real service catalog; a catalog-only PR must trigger it
      # (else a prod-state regression in services.yaml slips past the guard).
      - "docs/operations/services.yaml"
      - "sql/migration/V*.sql"
      - "docs/migration/workcube-schema.json"
      - "docs/adr/0008-*.md"
      - "docs/adr/0011-*.md"
      # DD-2 ETL contract additions
      - "scripts/migration/etl_worker/etl_worker/transform.py"
      - "scripts/migration/etl_worker/tests/test_transform.py"
      - "scripts/migration/etl_worker/config/tables.yaml"
      # DD-4 env+Dockerfile+Python compat
      - "scripts/migration/etl_worker/etl_worker/config.py"
      - "scripts/migration/etl_worker/Dockerfile"
      - "scripts/migration/etl_worker/pyproject.toml"
      - "scripts/migration/etl_worker/README.md"
      - ".github/workflows/etl-worker-tests.yml"

jobs:
  drift-detection:
    name: ADR-0011 — DD-1 + DD-2 + DD-4 + DD-5 drift guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test deps (PyYAML + pytest — DD-5 mixed unittest/pytest suite)
        run: python3 -m pip install --disable-pip-version-check "PyYAML==6.0.3" "pytest==8.3.3"

      - name: DD-1 — anchor table + V25/V26 contract drift check
        run: |
          python3 scripts/drift_detection/check_drift_anchor_table.py --verbose

      - name: DD-2 — ETL canonical JSON contract drift check
        run: |
          python3 scripts/drift_detection/check_drift_etl_contract.py --verbose

      - name: DD-4 — env prefix + Python compat + Dockerfile keyring lint
        run: |
          python3 scripts/drift_detection/check_drift_env_dockerfile.py --verbose

      - name: DD-1 JSON artifact
        if: always()
        run: |
          python3 scripts/drift_detection/check_drift_anchor_table.py --json > /tmp/drift-anchor-report.json || true
          cat /tmp/drift-anchor-report.json

      - name: DD-2 JSON artifact
        if: always()
        run: |
          python3 scripts/drift_detection/check_drift_etl_contract.py --json > /tmp/drift-etl-report.json || true
          cat /tmp/drift-etl-report.json

      - name: DD-4 JSON artifact
        if: always()
        run: |
          python3 scripts/drift_detection/check_drift_env_dockerfile.py --json > /tmp/drift-env-dockerfile-report.json || true
          cat /tmp/drift-env-dockerfile-report.json

      - name: Upload drift reports artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-detection-reports
          path: |
            /tmp/drift-anchor-report.json
            /tmp/drift-etl-report.json
            /tmp/drift-env-dockerfile-report.json
          retention-days: 7

      - name: Run unit tests (DD-1 + DD-2 + DD-4)
        run: |
          python3 -m unittest \
            tests.drift_detection.test_check_drift_anchor_table \
            tests.drift_detection.test_check_drift_etl_contract \
            tests.drift_detection.test_check_drift_env_dockerfile \
            -v

      # DD-5 — deployment-contract + service-catalog drift guards
      # (scripts/drift_detection/tests/ was a parallel test tree wired NOWHERE;
      # gitops #2287 sat red for 5+ weeks because nothing ran it. #2313.)
      # pytest (NOT unittest discover): the suite is MIXED — 5 unittest-style
      # files + test_cross_repo_enum_fetcher_retry.py which is pure pytest
      # (fixtures/parametrize/monkeypatch). unittest discover errors importing
      # that file (no pytest) and silently skips pytest-style tests; pytest runs
      # the whole tree (86 tests) — and auto-covers any future test_*.py here.
      - name: Run unit tests (DD-5 — service catalog + deployment contract)
        working-directory: scripts/drift_detection
        run: |
          python3 -m pytest tests/ -v
