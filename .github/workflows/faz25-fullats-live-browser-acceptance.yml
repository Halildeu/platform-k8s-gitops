name: Faz 25 Full ATS live browser acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Live literal: RUN_FAZ25_FULLATS_LIVE_BROWSER"
        required: true
        default: "DRY_RUN_ONLY"

permissions:
  contents: read

concurrency:
  group: faz25-fullats-live-browser-acceptance
  cancel-in-progress: false

jobs:
  live-browser:
    name: Recruiter job lifecycle to candidate application on testai
    runs-on: [self-hosted, staging-sw, testai-deploy]
    # Includes the customer journey plus a bounded wait for a protected
    # compensating rollback PR if runtime/browser acceptance fails.
    timeout-minutes: 45
    env:
      EXPECTED_ATS_DIGEST: sha256:8812ab4eed4881c24e8a8cc7129648d201e064f032dced571d9a56916ad66a11
      EXPECTED_PERMISSION_DIGEST: sha256:55f2f2f2d1edb3aa67c663c1411b0cc21ab1818d10b4d8d70a5beeeb32ade13d
      EXPECTED_FRONTEND_DIGEST: sha256:dc4c10c76359836da06d83bca9d977433313a43ae06da1e909e28cd31ec71ead
      EXPECTED_FRONTEND_SHA: 07e9672d1e206544d95226d4a0d20111e269677c
      ATS_BUILD_RUN: https://github.com/Halildeu/ats/actions/runs/29629811674
      PERMISSION_BUILD_RUN: https://github.com/Halildeu/platform-backend/actions/runs/29629811595
      FRONTEND_BUILD_RUN: https://github.com/Halildeu/platform-web/actions/runs/29630193356
    steps:
      - name: Validate test-only dispatch boundary
        id: preflight
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Halildeu/platform-k8s-gitops" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$CONFIRM_INPUT" == "RUN_FAZ25_FULLATS_LIVE_BROWSER" ]]
          [[ "$CONFIRM_INPUT" != *$'\n'* && "$CONFIRM_INPUT" != *$'\r'* ]]

      - name: Checkout canonical acceptance scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Assert canonical test runtime is healthy
        id: runtime
        run: |
          set -euo pipefail
          kubectl --context=k3d-test -n platform-test rollout status \
            deployment/ats-interview-evidence --timeout=180s
          kubectl --context=k3d-test -n platform-test rollout status \
            deployment/permission-service --timeout=180s
          kubectl --context=k3d-test -n platform-test rollout status \
            deployment/frontend --timeout=180s
          desired="$(kubectl --context=k3d-test -n platform-test get deployment \
            ats-interview-evidence -o jsonpath='{.spec.template.spec.containers[?(@.name=="app-boot")].image}')"
          [[ "$desired" == "ghcr.io/halildeu/ats-app-boot@$EXPECTED_ATS_DIGEST" ]]
          kubectl --context=k3d-test -n platform-test get pods \
            -l app=ats-interview-evidence -o json | jq -e --arg digest "${desired##*@}" '
              [.items[].status.containerStatuses[]? | select(.name=="app-boot")] as $statuses |
              ($statuses | length) > 0 and
              ($statuses | all(.ready == true and (.imageID | endswith("@" + $digest))))
            ' >/dev/null
          permission_desired="$(kubectl --context=k3d-test -n platform-test get deployment \
            permission-service -o jsonpath='{.spec.template.spec.containers[?(@.name=="permission-service")].image}')"
          [[ "$permission_desired" == "ghcr.io/halildeu/platform-backend-permission-service@$EXPECTED_PERMISSION_DIGEST" ]]
          kubectl --context=k3d-test -n platform-test get pods \
            -l app.kubernetes.io/name=permission-service -o json | jq -e \
            --arg digest "${permission_desired##*@}" '
              [.items[].status.containerStatuses[]? | select(.name=="permission-service")] as $statuses |
              ($statuses | length) > 0 and
              ($statuses | all(.ready == true and (.imageID | endswith("@" + $digest))))
            ' >/dev/null
          frontend_desired="$(kubectl --context=k3d-test -n platform-test get deployment \
            frontend -o jsonpath='{.spec.template.spec.containers[?(@.name=="frontend")].image}')"
          [[ "$frontend_desired" == "ghcr.io/halildeu/platform-web-frontend-testai:sha-07e9672@$EXPECTED_FRONTEND_DIGEST" ]]
          kubectl --context=k3d-test -n platform-test get pods \
            -l app.kubernetes.io/name=frontend -o json | jq -e \
            --arg digest "${frontend_desired##*@}" '
              [.items[].status.containerStatuses[]? | select(.name=="frontend")] as $statuses |
              ($statuses | length) > 0 and
              ($statuses | all(.ready == true and (.imageID | endswith("@" + $digest))))
            ' >/dev/null
          curl -fsS https://testai.acik.com/build-info.json | jq -e \
            --arg expected "$EXPECTED_FRONTEND_SHA" '.sha == $expected' >/dev/null

      - name: Run product-path persona setup and real browser journey
        id: browser
        env:
          CONFIRM: ${{ inputs.confirm }}
          EVIDENCE_DIR: ${{ runner.temp }}/fullats-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          VAULT_INIT_JSON: /home/halil/bootstrap-drill/vault-init-test.json
        run: bash scripts/ats/fullats-live-browser-acceptance.sh

      - name: Require rollback GitHub App credentials after acceptance failure
        if: failure() && steps.preflight.outcome == 'success' && (steps.runtime.outcome == 'failure' || steps.browser.outcome == 'failure')
        id: rollback-credentials
        env:
          APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${APP_ID:-}" && -n "${APP_PRIVATE_KEY:-}" ]] || {
            echo "::error::Full ATS acceptance failed, but rollback App credentials are unavailable"
            exit 1
          }

      - name: Generate least-privilege rollback GitHub App token
        if: failure() && steps.rollback-credentials.outcome == 'success'
        id: rollback-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout failed promotion with rollback App identity
        if: failure() && steps.rollback-app-token.outcome == 'success'
        id: rollback-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ steps.rollback-app-token.outputs.token }}
          fetch-depth: 0

      - name: Open atomic compensating GitOps rollback PR
        if: failure() && steps.rollback-checkout.outcome == 'success'
        id: rollback
        env:
          GH_TOKEN: ${{ steps.rollback-app-token.outputs.token }}
          GH_REPO: Halildeu/platform-k8s-gitops
          PROMOTION_PR: "2617"
          FAILED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bash scripts/ats/open-fullats-test-rollback-pr.sh

      - name: Upload redacted live browser evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: faz25-fullats-live-browser-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fullats-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7

      - name: Publish non-secret outcome
        if: always()
        run: |
          {
            echo "## Faz 25 Full ATS live browser acceptance"
            echo ""
            echo "- environment: testai.acik.com"
            echo "- personas: synthetic candidate + synthetic recruiter"
            echo "- journey: recruiter draft -> edit -> preview -> publish -> candidate application -> recruiter inbox/status -> pause/republish/close -> new intake fail-closed -> existing receipt survives"
            echo "- recruiter access setup: user activation + least-privilege ATS module/actions + role member product APIs"
            echo "- direct DB/OpenFGA acceptance seed: none"
            echo "- real PII / production mutation: none"
            echo "- secrets/JWT/candidate access token in artifact: none"
            echo "- artifact authority: live desired image + ready pod imageID exact digest"
            echo "- source lineage boundary: Actions build run metadata; no signed provenance attestation claimed"
            echo "- ATS build: ${ATS_BUILD_RUN}"
            echo "- permission build: ${PERMISSION_BUILD_RUN}"
            echo "- frontend build: ${FRONTEND_BUILD_RUN}"
            if [[ -n "${{ steps.rollback.outputs.rollback_pr_url }}" ]]; then
              echo "- compensating rollback PR: ${{ steps.rollback.outputs.rollback_pr_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
