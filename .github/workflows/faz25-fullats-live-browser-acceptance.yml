name: Faz 25 Full ATS live browser acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Live literal: RUN_FAZ25_FULLATS_LIVE_BROWSER"
        required: true
        default: "DRY_RUN_ONLY"

permissions:
  contents: read

concurrency:
  group: faz25-fullats-live-browser-acceptance
  cancel-in-progress: false

jobs:
  live-browser:
    name: Recruiter job lifecycle to candidate application on testai
    runs-on: [self-hosted, aiserver, testai-deploy]
    # Includes the customer journey plus a bounded wait for a protected
    # compensating rollback PR if runtime/browser acceptance fails.
    timeout-minutes: 90
    env:
      EXPECTED_ATS_DIGEST: sha256:1cd9e5b259a22fc7e501e1c71fc8592833dd41dd6a5b9c3640cddb456349b32a
      EXPECTED_PERMISSION_DIGEST: sha256:264901f4a11ea00d2f27fd56bb31bd35536394eb0ae2c83d992763a0b4d3bb02
      ATS_BUILD_RUN: https://github.com/Halildeu/ats/actions/runs/34033796475
      PERMISSION_BUILD_RUN: https://github.com/Halildeu/platform-backend/actions/runs/30516555877
    steps:
      - name: Validate test-only dispatch boundary
        id: preflight
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Halildeu/platform-k8s-gitops" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$CONFIRM_INPUT" == "RUN_FAZ25_FULLATS_LIVE_BROWSER" ]]
          [[ "$CONFIRM_INPUT" != *$'\n'* && "$CONFIRM_INPUT" != *$'\r'* ]]

      - name: Checkout canonical acceptance scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Bind frontend runtime to canonical test overlay
        id: frontend-pin
        run: |
          set -euo pipefail
          pin="$(python3 scripts/automation/test-overlay-frontend-image.py inspect \
            --kustomization kustomize/overlays/test/kustomization.yaml)"
          source_sha="$(jq -er '.source_sha | select(type == "string" and test("^[a-f0-9]{40}$"))' <<<"$pin")"
          tag="$(jq -er '.tag | select(type == "string" and test("^sha-[a-f0-9]{7}$"))' <<<"$pin")"
          digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[a-f0-9]{64}$"))' <<<"$pin")"
          [[ "$tag" == "sha-${source_sha:0:7}" ]] || {
            echo "::error::frontend sourceRevision and newTag disagree"
            exit 1
          }
          {
            echo "EXPECTED_FRONTEND_SHA=$source_sha"
            echo "EXPECTED_FRONTEND_DIGEST=$digest"
            echo "FRONTEND_SOURCE_URL=https://github.com/Halildeu/platform-web/commit/$source_sha"
          } >> "$GITHUB_ENV"

      - name: Wait for exact GitOps auto-sync convergence
        id: convergence
        env:
          EXPECTED_GITOPS_SHA: ${{ github.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/fullats-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          digest_map="$(python3 scripts/automation/backend-testai-digest-contract.py inspect \
            --kustomization kustomize/overlays/test/kustomization.yaml)"
          REVISION="$EXPECTED_GITOPS_SHA" \
          DIGEST_MAP="$digest_map" \
          FULL_SYNC_TIMEOUT=900 \
          REPORT_PATH="$EVIDENCE_DIR/argocd-convergence.json" \
            bash scripts/deploy/reconcile-testai-backend-sequential.sh
          effective_revision="$(
            jq -er '
              select(
                .schemaVersion == "testai-backend-argocd-auto-sync-v4" and
                .verdict == "PASS" and
                (.effectiveRevision | type == "string" and test("^[a-f0-9]{40}$")) and
                .effectiveRevision == .observedRevision
              ) |
              .effectiveRevision
            ' "$EVIDENCE_DIR/argocd-convergence.json"
          )"
          git merge-base --is-ancestor "$GITHUB_SHA" "$effective_revision" || {
            echo "::error::effective GitOps revision is not a descendant of the dispatched revision"
            exit 1
          }
          git checkout --detach "$effective_revision"
          [[ "$(git rev-parse HEAD)" == "$effective_revision" ]]
          echo "effective_gitops_sha=$effective_revision" >> "$GITHUB_OUTPUT"

      - name: Bind pre-journey runtime to this exact GitOps revision
        id: runtime
        env:
          EXPECTED_GITOPS_SHA: ${{ steps.convergence.outputs.effective_gitops_sha }}
          PHASE: pre
          EVIDENCE_DIR: ${{ runner.temp }}/fullats-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ats/verify-fullats-live-runtime.sh

      - name: Run product-path persona setup and real browser journey
        id: browser
        env:
          CONFIRM: ${{ inputs.confirm }}
          EVIDENCE_DIR: ${{ runner.temp }}/fullats-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          VAULT_INIT_JSON: /srv/platform/secrets/backup-auth/vault-init-test.json
        run: bash scripts/ats/fullats-live-browser-acceptance.sh

      - name: Rebind post-journey runtime to the same exact revision
        id: final-runtime
        env:
          EXPECTED_GITOPS_SHA: ${{ steps.convergence.outputs.effective_gitops_sha }}
          PHASE: post
          EVIDENCE_DIR: ${{ runner.temp }}/fullats-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ats/verify-fullats-live-runtime.sh

      - name: Require rollback GitHub App credentials after acceptance failure
        if: failure() && steps.preflight.outcome == 'success' && (steps.convergence.outcome == 'failure' || steps.runtime.outcome == 'failure' || steps.browser.outcome == 'failure' || steps.final-runtime.outcome == 'failure')
        id: rollback-credentials
        env:
          APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${APP_ID:-}" && -n "${APP_PRIVATE_KEY:-}" ]] || {
            echo "::error::Full ATS acceptance failed, but rollback App credentials are unavailable"
            exit 1
          }

      - name: Generate least-privilege rollback GitHub App token
        if: failure() && steps.rollback-credentials.outcome == 'success'
        id: rollback-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout failed promotion with rollback App identity
        if: failure() && steps.rollback-app-token.outcome == 'success'
        id: rollback-checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ steps.rollback-app-token.outputs.token }}
          fetch-depth: 0

      - name: Install pinned GitHub CLI for rollback automation
        if: failure() && steps.rollback-checkout.outcome == 'success'
        id: rollback-gh
        run: bash scripts/ats/install-pinned-gh-cli.sh

      - name: Install pinned kustomize for rollback rendering
        if: failure() && steps.rollback-gh.outcome == 'success'
        id: rollback-kustomize
        run: bash scripts/ats/install-pinned-kustomize.sh

      - name: Open atomic compensating GitOps rollback PR
        if: failure() && steps.rollback-kustomize.outcome == 'success'
        id: rollback
        env:
          GH_TOKEN: ${{ steps.rollback-app-token.outputs.token }}
          GH_REPO: Halildeu/platform-k8s-gitops
          PROMOTION_PR: "2636"
          FAILED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ROLLBACK_EVIDENCE_DIR: ${{ runner.temp }}/fullats-rollback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ats/open-fullats-test-rollback-pr.sh

      - name: Require compensating rollback completion after acceptance failure
        if: always() && steps.preflight.outcome == 'success' && (steps.convergence.outcome == 'failure' || steps.runtime.outcome == 'failure' || steps.browser.outcome == 'failure' || steps.final-runtime.outcome == 'failure') && steps.rollback.outcome != 'success'
        run: |
          echo "::error::Full ATS acceptance failed and protected compensating rollback did not complete"
          echo "convergence=${{ steps.convergence.outcome }} runtime=${{ steps.runtime.outcome }} browser=${{ steps.browser.outcome }} final-runtime=${{ steps.final-runtime.outcome }} rollback-gh=${{ steps.rollback-gh.outcome }} rollback-kustomize=${{ steps.rollback-kustomize.outcome }} rollback=${{ steps.rollback.outcome }}"
          exit 1

      - name: Upload redacted live browser evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: faz25-fullats-live-browser-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/fullats-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/fullats-runtime-evidence-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/fullats-rollback-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7

      - name: Publish non-secret outcome
        if: always()
        run: |
          {
            echo "## Faz 25 Full ATS live browser acceptance"
            echo ""
            echo "- environment: testai.acik.com"
            echo "- personas: synthetic candidate + synthetic recruiter"
            echo "- journey: recruiter draft -> edit -> preview -> publish -> candidate real-PDF local autofill/edit/application -> recruiter inbox/status -> pause/republish/close -> new intake fail-closed -> existing receipt survives"
            echo "- recruiter access setup: user activation + least-privilege ATS module/actions + role member product APIs"
            echo "- customer-slice D29: exact runtime + real browser function + anonymous recruiter deny + least-privilege recruiter allow"
            echo "- meeting/STT model-governance matrix: separate product slice; not an applicant/recruiter acceptance dependency"
            echo "- revision fence: origin/main + Argo Synced/Healthy + pre/post runtime == workflow GitOps SHA"
            echo "- direct DB/OpenFGA acceptance seed: none"
            echo "- real PII / production mutation: none"
            echo "- secrets/JWT/candidate access token in artifact: none"
            echo "- artifact authority: live desired image + ready pod imageID exact digest"
            echo "- source lineage boundary: Actions build run metadata; no signed provenance attestation claimed"
            echo "- ATS build: ${ATS_BUILD_RUN}"
            echo "- permission build: ${PERMISSION_BUILD_RUN}"
            echo "- frontend source: ${FRONTEND_SOURCE_URL}"
            echo "- frontend immutable digest: ${EXPECTED_FRONTEND_DIGEST}"
            if [[ -n "${{ steps.rollback.outputs.rollback_pr_url }}" ]]; then
              echo "- compensating rollback PR: ${{ steps.rollback.outputs.rollback_pr_url }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
