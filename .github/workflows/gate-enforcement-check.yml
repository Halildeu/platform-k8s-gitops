name: gate-enforcement-check

# Faz 19.11.D PR-B — port `ci/check_enforcement_rules.py` to a CI gate.
# Codex thread `019dd322` canary verdict: PR-A ✓ shim landed; PR-B
# is the first canary-passing script (0 violations on dry-run, 17 EP
# rules supported).
#
# Triggers:
#   - push/pull_request on changes to ci/, src/, policies/ (file scope)
#   - weekly cron Mon 03:00 UTC (drift-detect cadence; matches
#     etl-worker-tests + openfga-model-drift pattern)
#   - workflow_dispatch (manual run)
#
# What it checks: regex-based policy violations across the repo. Replaces
# semgrep for non-AST rules; AST rules (EP-006, EP-009, EP-014) require
# semgrep separately (NOT in this gate).
#
# Output:
#   - JSON report at /tmp/enforcement-rules-report.json
#   - Uploaded as workflow artifact (retention 30 days)
#   - Exit code 0 = pass, non-zero = fail (any rule violation triggers fail)

on:
  push:
    branches: [main]
    paths:
      - 'ci/check_enforcement_rules.py'
      - 'ci/check_enforcement_rules_*.py'
      - 'src/**'
      - 'policies/**'
      - '.github/workflows/gate-enforcement-check.yml'
  pull_request:
    paths:
      - 'ci/check_enforcement_rules.py'
      - 'ci/check_enforcement_rules_*.py'
      - 'src/**'
      - 'policies/**'
      - '.github/workflows/gate-enforcement-check.yml'
  schedule:
    # Drift-detect: weekly Monday 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  enforcement-check:
    name: Enforcement Rules Check (script-based)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run enforcement rules check
        id: enforce
        run: |
          # Warning-tolerant: don't fail on script's non-zero exit (warnings).
          # Fail-on-errors logic is in the next step (parse error_count from
          # report). Codex `019dd322` recommendation: "errors/warnings
          # politikası net olmalı".
          python3 ci/check_enforcement_rules.py \
            --repo-root . \
            --out /tmp/enforcement-rules-report.json \
            || true
          echo "report-path=/tmp/enforcement-rules-report.json" >> "$GITHUB_OUTPUT"

      - name: Fail on errors (warnings tolerated)
        run: |
          if [ ! -f /tmp/enforcement-rules-report.json ]; then
            echo "ERROR: report file missing"
            exit 1
          fi
          ERRORS=$(python3 -c "import json; print(json.load(open('/tmp/enforcement-rules-report.json')).get('error_count', 0))")
          if [ "$ERRORS" -gt 0 ]; then
            echo "FAIL: $ERRORS error-severity findings"
            exit 1
          fi
          echo "PASS: 0 error-severity findings (warnings may exist; see summary)"

      - name: Show report summary
        if: always()
        run: |
          if [ -f /tmp/enforcement-rules-report.json ]; then
            python3 ci/_summarize_enforcement_report.py /tmp/enforcement-rules-report.json
          else
            echo "No report file produced"
            exit 1
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enforcement-rules-report-${{ github.run_id }}
          path: /tmp/enforcement-rules-report.json
          retention-days: 30
