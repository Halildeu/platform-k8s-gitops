name: Cross-AI Peer Review Audit (V2.1-GOV-1)

# PR body Cross-AI structured field enum validate (HARD RULE provider seviyesinde)
# PMD v9.1 §7 + scripts/ci/pr-cross-ai-audit.mjs
#
# Required check (durumsal az-kanal governance, #2621):
# - none: routine work + reason + zero receipt; governance/auto-promotion blocked
# - single: exact context-isolated Codex exec ephemeral/read-only + scope + AGREE;
#   routine=Spark, governance/high-impact=SOL
# - Claude challenger is non-authoritative and cannot be a receipt
# - no path requires provider diversity; Claude/MiniMax receipts are forbidden
# - Fetched owner evidence, model, freshness, digest and redaction remain strict
#
# #827 — automation-PR governance: a PR whose head branch matches an automation
# prefix (auto-test-overlay/ · auto-test-frontend/ · auto-verified/) is audited in
# pr-cross-ai-audit.mjs `auditAutomation` mode — a bot-generated PR is exempt
# from the peer-review claim iff a multi-signal predicate holds (same-repo +
# actor allowlist + Automation source/exempt-reason/evidence).
#
# #842 PR-A2 (Codex thread `019e42c7-6470-7c71-bccb-e052248dfd99`, PARTIAL→AGREE):
# This workflow migrates from `pull_request` to `pull_request_target`:
#   * The audit script now runs from the BASE ref (e.g. `main`) instead of the
#     PR head. A malicious PR that ships a tampered `pr-cross-ai-audit.mjs` in
#     its head no longer weakens its own audit — the trusted main copy runs.
#   * `pull_request_target` is the more privileged event variant. Read grants
#     remain minimal; `statuses: write` is restricted to non-required
#     publication-generation fencing on validation failures. The native job
#     check, not a custom commit-status success POST, is merge authority.
#   * Job name `cross-ai-audit` is preserved so the branch-protection ruleset
#     context (PMD §2.10 must-pass list) matches without rename.
#   * `concurrency` block cancels superseded runs on the same PR — guards
#     against rapid `synchronize` push churn (an attacker or noisy author
#     cannot pile up N parallel audit runs to exhaust CI minutes).
#   * Evidence publication is draft-only. `ready_for_review` re-audits the
#     final live generation before it becomes mergeable; `converted_to_draft`
#     cancels a superseded ready audit. Production `auto-promotion/` candidates
#     are NOT automation-exempt and must acquire normal explicit
#     consultation-mode contract before merge.

on:
  # #842 PR-A2 cleanup (post-PR #868 merge): the transition `pull_request`
  # trigger is removed now that `pull_request_target` is live on main. The
  # bootstrap problem (PR head's workflow not matching the event) does not
  # recur because main now lists `pull_request_target` — `pull_request_target`
  # reads the workflow from base, so any future PR's audit fires from the
  # trusted base copy without needing a `pull_request` parallel.
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      # #842 follow-up cleanup (Codex thread 019e5b85, 2026-05-24):
      # `labeled` / `unlabeled` triggers REMOVED. The audit script is
      # currently label-agnostic (pr-cross-ai-audit.mjs reads PR body fields
      # only, not labels). Under label events the GitHub `sender` flips to
      # whoever toggled the label — usually a human operator. For
      # exempt automation PRs (auto-test-overlay/, auto-test-frontend/,
      # auto-verified/)
      # the audit script's `auditAutomation` mode requires BOTH the PR
      # author AND the event sender to be in the prefix-specific bot
      # allowlist (pr-cross-ai-audit.mjs `auditAutomation` actor check).
      # A human labeling an automation PR therefore turns a previously-
      # green `cross-ai-audit` check RED on the very same content — a
      # false-negative governance failure, not a real audit failure.
      # The inverse risk (human launders a prior malicious `synchronize`
      # by toggling a label) is also blocked by removing these triggers.
      # When the audit script gains genuine label-aware semantics, this
      # block should be re-added with the matching script logic in the
      # SAME PR (atomic wiring + behavior), not pre-wired ahead.
  # Owner-authored PR comment history can add or mutate fail-closed evidence
  # after a successful PR-head check. Owner create/edit/delete events share
  # the PR audit concurrency group and append a failing exact-head check-run.
  # Non-owner comments use their own run-id group so they cannot cancel this
  # authority guard before it writes the failure check.
  issue_comment:
    types:
      - created
      - edited
      - deleted
permissions:
  actions: read
  checks: write
  contents: read
  issues: read
  pull-requests: read
  statuses: write

# #842 Codex 019e42c7 Q8: concurrency guards parallel runs on the same PR.
# Per-PR concurrency group. An owner-comment mutation cancels an in-flight
# audit so it cannot publish a stale success. A later PR event must not cancel
# the mutation guard before its exact-head pending check and durable tombstone
# exist; it queues behind the guard instead.
concurrency:
  group: cross-ai-audit-${{ github.event.pull_request.number || (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER' && github.event.issue.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'issue_comment' }}

jobs:
  cross-ai-audit:
    if: github.event_name == 'pull_request_target'
    # Codex `019e2693` HIGH-1: canonical check context PMD §2.10 must-pass list
    # branch protection ruleset bu exact context'i arıyor (`cross-ai-audit`).
    # #842 PR-A2: job name preserved across the pull_request → pull_request_target
    # migration so branch protection ruleset does not need an "Expected" sweep.
    name: cross-ai-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base ref (trusted main, not PR head)
        # Pull-request-target must execute only the immutable trusted base tree.
        # Binding to the event's exact base SHA prevents a mutable-ref TOCTOU
        # window after this privileged event starts. A later base hardening
        # naturally appears on the next edited/synchronize/reopened event.
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Load or recover exact-base Cross-AI source-trust activation
        id: activation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTIVATION_DIR: ${{ runner.temp }}/cross-ai-source-trust-activation
          ACTIVATION_WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTIVATION_RUN_ID: ${{ github.run_id }}
          ACTIVATION_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          run_id="$({
            gh api --paginate \
              "repos/${GH_REPO}/actions/workflows/ci.yml/runs?event=push&branch=main&status=success&per_page=100"
          } | jq -r --arg sha "$PR_BASE_SHA" \
            '.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success") | .id' \
            | sed -n '1p')"
          mkdir -p "$ACTIVATION_DIR"
          activation_file="${ACTIVATION_DIR}/cross-ai-source-trust-activation.json"
          if [[ -n "$run_id" ]] && gh run download "$run_id" \
              --repo "$GH_REPO" \
              --name "cross-ai-source-trust-activation-${PR_BASE_SHA}" \
              --dir "$ACTIVATION_DIR"; then
            test -s "$activation_file"
          else
            rm -f "$activation_file"
            test "$PR_BASE_REF" = "main"
            anchor_file="${ACTIVATION_DIR}/durable-main-status-anchor.json"
            statuses="$(gh api --paginate --slurp \
              "repos/${GH_REPO}/commits/${PR_BASE_SHA}/statuses?per_page=100")"
            status="$(jq -c '
              [ .[][]
                | select(.context == "cross-ai/source-trust-activation")
                | select(.state == "success")
                | select(.description == "Cross-AI source trust activated")
                | select(.creator.login == "github-actions[bot]")
              ] | max_by(.id) // empty
            ' <<<"$statuses")"
            test -n "$status"
            anchor_run_id="$(jq -r '
              .target_url
              | capture("/actions/runs/(?<id>[0-9]+)$").id
            ' <<<"$status")"
            anchor_run="$(gh api \
              "repos/${GH_REPO}/actions/runs/${anchor_run_id}")"
            jq -nc \
              --arg anchor_sha "$PR_BASE_SHA" \
              --argjson status "$status" \
              --argjson run "$anchor_run" \
              '{anchor_sha:$anchor_sha,status:$status,run:$run}' > "$anchor_file"
            test -s "$anchor_file"
            python3 scripts/ai/verify_cross_ai_source_activation.py \
              --repo . \
              --trusted-ref "$PR_BASE_SHA" \
              --expected-sha "$PR_BASE_SHA" \
              --repository "$GH_REPO" \
              --workflow-ref "$ACTIVATION_WORKFLOW_REF" \
              --event-name "pull_request_target" \
              --git-ref "refs/heads/main" \
              --run-id "$ACTIVATION_RUN_ID" \
              --run-attempt "$ACTIVATION_RUN_ATTEMPT" \
              --recovery-anchor-file "$anchor_file" \
              --output "$activation_file"
            run_id="$ACTIVATION_RUN_ID"
          fi
          test -s "$activation_file"
          echo "file=$activation_file" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      # Run the trusted-base verifier before importing any PR-head git object
      # into the job. The verifier opens from the immutable base checkout and
      # fetches the exact rollback head internally only for content inspection;
      # it never checks out or executes a file from that head.
      - name: Verify exact Full ATS rollback content from trusted base
        if: startsWith(github.event.pull_request.head.ref, 'auto-fullats-rollback/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROMOTION_PR: "2636"
          ATTESTATION_OUTPUT: ${{ runner.temp }}/fullats-rollback-content-attestation-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: bash scripts/ats/verify-fullats-test-rollback-content.sh

      - name: Derive trusted merge-base and scope digest
        id: scope
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          fetched_head="$(git rev-parse FETCH_HEAD)"
          test "$fetched_head" = "$PR_HEAD_SHA"
          merge_base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          # Derive the exemption file list from the same fetched git objects.
          # --no-renames emits both the deleted authority path and the added
          # archive path, so a governance-file rename cannot enter docs-only.
          git -c core.quotePath=true diff --name-only --no-renames \
            "$merge_base...$PR_HEAD_SHA" > /tmp/changed-files.txt
          test -s /tmp/changed-files.txt
          receipt="$(python3 scripts/ai/prepare_cross_ai_scope.py \
            --derive-only \
            --base-ref "$PR_BASE_SHA" \
            --base-sha "$merge_base" \
            --head-sha "$PR_HEAD_SHA" \
            --output /tmp/cross-ai-derived-scope.patch)"
          scope_sha256="$(printf '%s' "$receipt" | jq -r .scope_sha256)"
          test -n "$merge_base"
          test "$scope_sha256" != "null"
          echo "PR files:"
          sed -n '1,400p' /tmp/changed-files.txt
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"
          echo "scope_sha256=$scope_sha256" >> "$GITHUB_OUTPUT"

      - name: Run cross-AI audit
        # `GITHUB_EVENT_PATH` carries the PR payload (head ref/sha, base, body,
        # actor, sender, labels) — the audit reads PR metadata from there, not
        # from the checked-out tree. So the base-ref checkout above does not
        # restrict what the audit can inspect about the PR (Codex Q3 onay).
        # `--changed-files-file` feeds both the Dependabot exemption allowlist
        # and normal explicit consultation-mode scope floor. Missing/empty
        # metadata intentionally rejects `none` instead of silently bypassing it.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATTESTATION_OUTPUT: ${{ runner.temp }}/fullats-rollback-content-attestation-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: |
          args=(
            --event-path "$GITHUB_EVENT_PATH"
            --changed-files-file /tmp/changed-files.txt
            --derived-base-sha "${{ steps.scope.outputs.merge_base }}"
            --derived-scope-sha256 "${{ steps.scope.outputs.scope_sha256 }}"
            --activation-attestation-file "${{ steps.activation.outputs.file }}"
            --activation-run-id "${{ steps.activation.outputs.run_id }}"
          )
          if [[ -f "$ATTESTATION_OUTPUT" ]]; then
            args+=(
              --automation-content-attestation-file
              "$ATTESTATION_OUTPUT"
            )
          fi
          node scripts/ci/pr-cross-ai-audit.mjs "${args[@]}"

      - name: Validate exact-head publication generation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/ai/complete_cross_ai_audit_status.py \
            --repo "$GH_REPO" \
            --issue "$PR_NUMBER" \
            --event-path "$GITHUB_EVENT_PATH"

  evidence-mutation-guard:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
    name: cross-ai-evidence-mutation-guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout exact trusted default-branch event SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Invalidate owner comment history change on exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/ai/complete_cross_ai_audit_status.py \
            --repo "$GH_REPO" \
            --comment-event-path "$GITHUB_EVENT_PATH"
