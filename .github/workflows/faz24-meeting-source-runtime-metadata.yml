name: Faz 24 Meeting source read-only runtime metadata
on:
  workflow_dispatch:
    inputs:
      live_analysis:
        description: 'Read aggregate live-analysis counters and allowlisted recent error metadata'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  metadata:
    runs-on: [self-hosted, aiserver, testai-deploy]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Read bounded TEST metadata only
        env:
          LIVE_ANALYSIS: ${{ inputs.live_analysis && 'true' || 'false' }}
        run: |
          args=()
          if [ "$LIVE_ANALYSIS" = true ]; then args+=(--live-analysis); fi
          python3 scripts/faz24/meeting_source_runtime_metadata.py "${args[@]}"
      - name: Verify changed meeting-service stability
        run: >-
          bash scripts/deploy/gate-stability-window.sh
          --service meeting-service --context k3d-test
          --namespace platform-test --catalog docs/operations/services.yaml
