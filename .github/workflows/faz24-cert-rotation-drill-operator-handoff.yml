name: Faz 24 Cert Rotation Drill Operator Handoff

# Builds a metadata-only operator handoff package for the Meeting-AI gateway
# certificate rotation fire drill (platform-k8s-gitops#2321 / #1615). This
# workflow does not connect to staging-sw, Vault, Kubernetes, Caddy, systemd,
# or production; it does not seed tokens, trigger rotation, run the drill, or
# collect runtime evidence.

on:
  workflow_dispatch:
    inputs:
      operator_batch_id:
        description: "Symbolic operator batch id"
        required: true
        default: "faz24-cert-rotation-drill-20260713"
      gitops_ref:
        description: "Git ref used by the follow-up ingest workflow"
        required: true
        default: "main"
      gateway_host:
        description: "Symbolic gateway host label"
        required: true
        default: "staging-sw"
      gateway_service:
        description: "Systemd unit for the private gateway"
        required: true
        default: "meeting-ai-private-gateway.service"
      rotation_timer:
        description: "Systemd timer for cert rotation"
        required: true
        default: "meeting-ai-server-cert-rotation.timer"
      evidence_path:
        description: "Path for the cert rotation drill evidence JSON"
        required: true
        default: "/tmp/faz24-meeting-ai-cert-rotation-drill.json"

permissions:
  contents: read

concurrency:
  group: faz24-cert-rotation-drill-operator-handoff
  cancel-in-progress: false

jobs:
  package:
    name: build cert rotation drill operator handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HANDOFF_DIR: /tmp/faz24-cert-rotation-drill-operator-handoff-${{ github.run_id }}

    steps:
      - name: Validate dispatch inputs
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
          GATEWAY_HOST: ${{ inputs.gateway_host }}
          GATEWAY_SERVICE: ${{ inputs.gateway_service }}
          ROTATION_TIMER: ${{ inputs.rotation_timer }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "${value}" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be single-line"
                exit 1
                ;;
            esac
          }

          reject_secret_like() {
            name="$1"
            value="$2"
            if printf '%s' "${value}" | grep -Eq -- '-----BEGIN .*PRIVATE KEY-----|-----BEGIN CERTIFICATE-----|Bearer |eyJ[A-Za-z0-9_-]+\.|hvs\.[A-Za-z0-9._-]+|data:audio/[A-Za-z0-9.+-]+;base64,'; then
              echo "::error::${name} must not contain certificate/private/secret/token/raw-audio-like material"
              exit 1
            fi
          }

          reject_token_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.:@/-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          reject_host_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          reject_unit_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.@-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          reject_path_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.:@/+~-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
            if printf '%s' "${value}" | grep -Eq '(^|/)\.\.(/|$)|^[A-Za-z]:'; then
              echo "::error::${name} must not escape the handoff boundary"
              exit 1
            fi
            if printf '%s' "${value}" | grep -Eq '^/' && ! printf '%s' "${value}" | grep -Eq '^/tmp/'; then
              echo "::error::${name} absolute paths are only allowed under /tmp"
              exit 1
            fi
          }

          for item in \
            "operator_batch_id:${OPERATOR_BATCH_ID}" \
            "gitops_ref:${GITOPS_REF}" \
            "gateway_host:${GATEWAY_HOST}" \
            "gateway_service:${GATEWAY_SERVICE}" \
            "rotation_timer:${ROTATION_TIMER}" \
            "evidence_path:${EVIDENCE_PATH}"
          do
            name="${item%%:*}"
            value="${item#*:}"
            reject_multiline "${name}" "${value}"
            reject_secret_like "${name}" "${value}"
          done

          reject_token_chars operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_token_chars gitops_ref "${GITOPS_REF}"
          reject_host_chars gateway_host "${GATEWAY_HOST}"
          reject_unit_chars gateway_service "${GATEWAY_SERVICE}"
          reject_unit_chars rotation_timer "${ROTATION_TIMER}"
          reject_path_chars evidence_path "${EVIDENCE_PATH}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build handoff package
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
          GATEWAY_HOST: ${{ inputs.gateway_host }}
          GATEWAY_SERVICE: ${{ inputs.gateway_service }}
          ROTATION_TIMER: ${{ inputs.rotation_timer }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          set -euo pipefail
          python3 scripts/faz24/build-cert-rotation-drill-operator-handoff.py \
            --output-dir "${HANDOFF_DIR}" \
            --operator-batch-id "${OPERATOR_BATCH_ID}" \
            --gitops-ref "${GITOPS_REF}" \
            --gateway-host "${GATEWAY_HOST}" \
            --gateway-service "${GATEWAY_SERVICE}" \
            --rotation-timer "${ROTATION_TIMER}" \
            --evidence-path "${EVIDENCE_PATH}"

      - name: Verify handoff artifact boundary
        env:
          EXPECTED_GATEWAY_HOST: ${{ inputs.gateway_host }}
          EXPECTED_GATEWAY_SERVICE: ${{ inputs.gateway_service }}
        run: |
          set -euo pipefail
          test -s "${HANDOFF_DIR}/README.md"
          test -s "${HANDOFF_DIR}/faz24-cert-rotation-drill-operator-handoff.json"
          test -s "${HANDOFF_DIR}/SHA256SUMS"
          if grep -R -E -- '-----BEGIN (CERTIFICATE|OPENSSH |RSA |EC |DSA )|-----END (CERTIFICATE|OPENSSH |RSA |EC |DSA )|Bearer |eyJ[A-Za-z0-9_-]+\.|hvs\.[A-Za-z0-9._-]+|data:audio/[A-Za-z0-9.+-]+;base64,' "${HANDOFF_DIR}"; then
            echo "::error::handoff artifact contains forbidden certificate/private/secret/token/raw-audio-like material"
            exit 1
          fi
          (cd "${HANDOFF_DIR}" && sha256sum --check SHA256SUMS)
          python3 - <<'PY' "${HANDOFF_DIR}/faz24-cert-rotation-drill-operator-handoff.json"
          import json
          import os
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["schemaVersion"] == "faz24.certRotationDrill.operator-handoff.v1"
          assert data["acceptanceBoundary"]["operatorExecutionRequired"] is True
          assert data["acceptanceBoundary"]["scopedVaultTokenSeedRequired"] is True
          assert data["acceptanceBoundary"]["inducedReloadFailureRollbackRequired"] is True
          assert data["acceptanceBoundary"]["alertFireAndClearRequired"] is True
          assert data["acceptanceBoundary"]["drillVerifierPassRequired"] is True
          assert data["acceptanceBoundary"]["doesNotSeedVault"] is True
          assert data["acceptanceBoundary"]["doesNotTriggerRotation"] is True
          assert data["acceptanceBoundary"]["doesNotAcceptProductionReadiness"] is True
          assert data["mutationBoundary"]["packageBuildVaultMutation"] is False
          assert data["mutationBoundary"]["packageBuildHostMutation"] is False
          assert data["mutationBoundary"]["packageBuildSystemdMutation"] is False
          assert data["mutationBoundary"]["containsVaultTokens"] is False
          assert data["mutationBoundary"]["containsIssuingCa"] is False
          assert data["target"]["gatewayHost"] == os.environ["EXPECTED_GATEWAY_HOST"]
          assert data["target"]["gatewayService"] == os.environ["EXPECTED_GATEWAY_SERVICE"]
          PY

      - name: Write workflow summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 cert rotation drill operator handoff"
            echo
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-cert-rotation-drill-operator-handoff-${{ github.run_id }}\`"
            echo "- GitOps rollup issue: #1615"
            echo "- Private delivery runtime issue: #2321"
            echo
            echo "Boundary: metadata-only coordination artifact. It does not connect to staging-sw, Vault, Kubernetes, Caddy, systemd, or production; seed tokens; trigger rotation; run the drill; collect runtime evidence; or mark #2321/#1615 accepted."
            echo
            if [ -s "${HANDOFF_DIR}/README.md" ]; then
              sed -n '1,180p' "${HANDOFF_DIR}/README.md"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload handoff artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: faz24-cert-rotation-drill-operator-handoff-${{ github.run_id }}
          path: ${{ env.HANDOFF_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local handoff directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${HANDOFF_DIR}"
