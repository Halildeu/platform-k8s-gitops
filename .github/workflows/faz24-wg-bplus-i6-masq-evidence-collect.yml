name: Faz 24 WG-B+ I6 MASQ Evidence Collect

# Collects metadata-only I6 evidence on the self-hosted staging-sw runner, then
# validates it with the I6 verifier. Default mode is read-only and fail-closed:
# no host iptables/nftables, WireGuard, Kubernetes object, platform-ai, or
# production mutation is performed by this workflow.

on:
  workflow_dispatch:
    inputs:
      pod_cidr:
        description: "Pod CIDR expected to be MASQed toward WireGuard"
        required: true
        default: "10.42.0.0/16"
      service_cidr:
        description: "Optional service CIDR metadata"
        required: false
        default: ""
      wg_interface:
        description: "WireGuard interface, or auto"
        required: true
        default: "auto"
      platform_ai_host:
        description: "platform-ai target host/IP reached over WG"
        required: true
        default: "10.99.0.2"
      platform_ai_port:
        description: "platform-ai target port"
        required: true
        default: "8200"
      kube_context:
        description: "Kubernetes context on staging-sw"
        required: true
        default: "k3d-test"
      namespace:
        description: "Namespace for existing pod-origin HTTP probe"
        required: true
        default: "platform-test"
      systemd_unit:
        description: "Host systemd unit that owns the MASQ rule"
        required: true
        default: "k3d-wg-masq.service"
      drift_timer:
        description: "Host systemd timer that checks MASQ drift"
        required: true
        default: "k3d-wg-masq.timer"
      rollback_tested_ref:
        description: "Optional relative metadata ref proving rollback was tested"
        required: false
        default: ""
      protected_evidence_path:
        description: "Optional protected evidence URI override for operator-collected host evidence"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: faz24-wg-bplus-i6-masq-evidence-collect
  cancel-in-progress: false

jobs:
  collect:
    name: collect and verify I6 MASQ evidence
    runs-on: [self-hosted, staging-sw, testai-deploy]
    timeout-minutes: 10

    env:
      EVIDENCE_DIR: /tmp/faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}
      EVIDENCE_JSON: /tmp/faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}/wg-bplus-i6-masq-evidence.json
      SUMMARY_JSON: /tmp/faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}/verification-summary.json

    steps:
      - name: Validate dispatch inputs
        env:
          POD_CIDR: ${{ inputs.pod_cidr }}
          SERVICE_CIDR: ${{ inputs.service_cidr }}
          WG_INTERFACE: ${{ inputs.wg_interface }}
          PLATFORM_AI_HOST: ${{ inputs.platform_ai_host }}
          PLATFORM_AI_PORT: ${{ inputs.platform_ai_port }}
          KUBE_CONTEXT: ${{ inputs.kube_context }}
          KUBE_NAMESPACE: ${{ inputs.namespace }}
          SYSTEMD_UNIT: ${{ inputs.systemd_unit }}
          DRIFT_TIMER: ${{ inputs.drift_timer }}
          ROLLBACK_TESTED_REF: ${{ inputs.rollback_tested_ref }}
          PROTECTED_EVIDENCE_PATH: ${{ inputs.protected_evidence_path }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "${value}" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be single-line"
                exit 1
                ;;
            esac
          }

          reject_multiline pod_cidr "${POD_CIDR}"
          reject_multiline service_cidr "${SERVICE_CIDR}"
          reject_multiline wg_interface "${WG_INTERFACE}"
          reject_multiline platform_ai_host "${PLATFORM_AI_HOST}"
          reject_multiline platform_ai_port "${PLATFORM_AI_PORT}"
          reject_multiline kube_context "${KUBE_CONTEXT}"
          reject_multiline namespace "${KUBE_NAMESPACE}"
          reject_multiline systemd_unit "${SYSTEMD_UNIT}"
          reject_multiline drift_timer "${DRIFT_TIMER}"
          reject_multiline rollback_tested_ref "${ROLLBACK_TESTED_REF}"
          reject_multiline protected_evidence_path "${PROTECTED_EVIDENCE_PATH}"

          if ! printf '%s' "${POD_CIDR}" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$'; then
            echo "::error::pod_cidr must be IPv4 CIDR"
            exit 1
          fi
          if [ -n "${SERVICE_CIDR}" ] && ! printf '%s' "${SERVICE_CIDR}" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$'; then
            echo "::error::service_cidr must be empty or IPv4 CIDR"
            exit 1
          fi
          if ! printf '%s' "${PLATFORM_AI_PORT}" | grep -Eq '^[0-9]{1,5}$'; then
            echo "::error::platform_ai_port must be numeric"
            exit 1
          fi
          if ! printf '%s' "${WG_INTERFACE}${KUBE_CONTEXT}${KUBE_NAMESPACE}${SYSTEMD_UNIT}${DRIFT_TIMER}" | grep -Eq '^[A-Za-z0-9_.:@-]+$'; then
            echo "::error::name-like inputs contain unsupported characters"
            exit 1
          fi
          if [ -n "${ROLLBACK_TESTED_REF}" ] && printf '%s' "${ROLLBACK_TESTED_REF}" | grep -Eq '(^/|(^|/)\.\.(/|$)|^[A-Za-z]:)'; then
            echo "::error::rollback_tested_ref must be relative and stay under the protected evidence path"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect metadata-only I6 evidence
        env:
          POD_CIDR: ${{ inputs.pod_cidr }}
          SERVICE_CIDR: ${{ inputs.service_cidr }}
          WG_INTERFACE: ${{ inputs.wg_interface }}
          PLATFORM_AI_HOST: ${{ inputs.platform_ai_host }}
          PLATFORM_AI_PORT: ${{ inputs.platform_ai_port }}
          KUBE_CONTEXT: ${{ inputs.kube_context }}
          KUBE_NAMESPACE: ${{ inputs.namespace }}
          SYSTEMD_UNIT: ${{ inputs.systemd_unit }}
          DRIFT_TIMER: ${{ inputs.drift_timer }}
          ROLLBACK_TESTED_REF: ${{ inputs.rollback_tested_ref }}
          PROTECTED_EVIDENCE_PATH: ${{ inputs.protected_evidence_path }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          python3 scripts/faz24/collect-wg-bplus-i6-masq-evidence.py \
            --output "${EVIDENCE_JSON}" \
            --pod-cidr "${POD_CIDR}" \
            --service-cidr "${SERVICE_CIDR}" \
            --wg-interface "${WG_INTERFACE}" \
            --platform-ai-host "${PLATFORM_AI_HOST}" \
            --platform-ai-port "${PLATFORM_AI_PORT}" \
            --kube-context "${KUBE_CONTEXT}" \
            --namespace "${KUBE_NAMESPACE}" \
            --systemd-unit "${SYSTEMD_UNIT}" \
            --drift-timer "${DRIFT_TIMER}" \
            --rollback-tested-ref "${ROLLBACK_TESTED_REF}" \
            --protected-evidence-path "${PROTECTED_EVIDENCE_PATH}" \
            > "${EVIDENCE_DIR}/collector.stdout" \
            2> "${EVIDENCE_DIR}/collector.stderr"

      - name: Verify I6 MASQ evidence
        id: verify
        run: |
          set +e
          python3 scripts/faz24/verify-wg-bplus-i6-masq-evidence.py \
            "${EVIDENCE_JSON}" \
            --summary-json "${SUMMARY_JSON}" \
            > "${EVIDENCE_DIR}/verifier.stdout" \
            2> "${EVIDENCE_DIR}/verifier.stderr"
          exit_code="$?"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          cat "${EVIDENCE_DIR}/collector.stdout" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/collector.stderr" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
          exit 0

      - name: Verify artifact excludes private material
        if: always()
        id: verify_artifact
        run: |
          set -euo pipefail
          if grep -R -E -- '-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----|-----END (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----|Bearer |eyJ[A-Za-z0-9_-]+\.' "${EVIDENCE_DIR}"; then
            echo "::error::evidence artifact contains forbidden private/secret-like material"
            exit 1
          fi

      - name: Write workflow summary
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 WG-B+ I6 MASQ evidence collect"
            echo
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}\`"
            echo "- Verifier exit code: \`${VERIFY_EXIT_CODE:-missing}\`"
            echo
            echo "Boundary: metadata-only read-only collection plus validation. This workflow does not change host iptables/nftables, WireGuard, Kubernetes objects, platform-ai, or production state."
            echo
            echo '```text'
            sed -n '1,160p' "${EVIDENCE_DIR}/collector.stdout" 2>/dev/null || true
            sed -n '1,160p' "${EVIDENCE_DIR}/collector.stderr" 2>/dev/null || true
            sed -n '1,160p' "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
            sed -n '1,160p' "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence collect artifact
        if: always() && steps.verify_artifact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local evidence directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"

      - name: Fail workflow when evidence is rejected
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ -z "${VERIFY_EXIT_CODE}" ]; then
            echo "::error::I6 verifier did not expose an exit code"
            exit 1
          fi
          if [ "${VERIFY_EXIT_CODE}" != "0" ]; then
            echo "::error::I6 MASQ evidence was collected but not accepted"
            exit "${VERIFY_EXIT_CODE}"
          fi
