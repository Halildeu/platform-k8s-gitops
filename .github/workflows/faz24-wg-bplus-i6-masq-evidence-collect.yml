name: Faz 24 WG-B+ I6 MASQ Evidence Collect

# Collects metadata-only I6 evidence on the self-hosted aiserver runner, then
# validates it with the I6 verifier. Fail-closed. This workflow deploys and then
# deletes ONE ephemeral, policy-approved, digest-pinned probe pod + a run-scoped
# egress NetworkPolicy (egress only to the WG peer). It does NOT change host
# iptables/nftables, WireGuard, platform-ai, or production state, and touches no
# Kubernetes object other than its own run-scoped probe pod + NetworkPolicy.

on:
  workflow_dispatch:
    inputs:
      cluster_cidr:
        description: "k3s cluster CIDR (test=10.44.0.0/16, prod=10.42.0.0/16). No wrong default."
        required: true
        default: "10.44.0.0/16"
      service_cidr:
        description: "Optional service CIDR metadata"
        required: false
        default: ""
      wg_interface:
        description: "WireGuard interface, or auto"
        required: true
        default: "auto"
      peer_host:
        description: "WireGuard peer host/IP reached over WG"
        required: true
        default: "10.99.0.2"
      peer_port:
        description: "WireGuard peer TCP port"
        required: true
        default: "8243"
      wg_node:
        description: "k3d node container that owns the pod CIDR"
        required: true
        default: "k3d-test-server-0"
      docker_network:
        description: "Docker network the k3d node is attached to"
        required: true
        default: "platform-test-net"
      probe_attempts:
        description: "Fresh pod-origin TCP connects (counter traversal gate)"
        required: true
        default: "3"
      wg_node_k8s_name:
        description: "Kubernetes node name for the probe-pod nodeSelector + nodeName check"
        required: true
        default: "k3d-test-server-0"
      installed_host_rule_script:
        description: "Installed ROOT-OWNED host-rule script (must be uid 0, not group/world writable, sha == canonical). Required for host-owned-chain-authority."
        required: true
        default: "/usr/local/sbin/k3d-wg-masq-host-rule.sh"
      kube_context:
        description: "Kubernetes context on aiserver"
        required: true
        default: "k3d-test"
      namespace:
        description: "Namespace for the pod-origin TCP probe"
        required: true
        default: "platform-test"
      systemd_unit:
        description: "Host systemd unit that owns the MASQ rule"
        required: true
        default: "k3d-wg-masq.service"
      drift_timer:
        description: "Host systemd timer that checks MASQ drift"
        required: true
        default: "k3d-wg-masq.timer"
      rollback_tested_ref:
        description: "Optional relative metadata ref proving rollback was tested"
        required: false
        default: ""
      protected_evidence_path:
        description: "Optional protected evidence URI override for operator-collected host evidence"
        required: false
        default: ""
      run_rollback_drill:
        description: "Run the SAFE scratch-chain rollback drill to close rollback-defined. Uses THROWAWAY chains K3D_WG_MASQ_NAT_DRILL/FWD_DRILL that are NEVER jumped from POSTROUTING/FORWARD — zero live-path impact. Default false keeps rollback-defined fail-closed."
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: faz24-wg-bplus-i6-masq-evidence-collect
  cancel-in-progress: false

jobs:
  collect:
    name: collect and verify I6 MASQ evidence
    runs-on: [self-hosted, aiserver, testai-deploy]
    timeout-minutes: 10

    env:
      EVIDENCE_DIR: /tmp/faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}
      EVIDENCE_JSON: /tmp/faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}/wg-bplus-i6-masq-evidence.json
      SUMMARY_JSON: /tmp/faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}/verification-summary.json
      PROBE_POD_NAME: wg-i6-probe-${{ github.run_id }}
      PROBE_POD_SELECTOR: wg-i6-probe=true,wg-i6-probe-run=${{ github.run_id }}
      # Pinned to the busybox 1.36 multi-arch INDEX (manifest-list) digest. LIVE-PROVEN
      # on this aiserver k3s/containerd runtime (workflow_dispatch 29201436668):
      # when a pod requests busybox by ANY digest, .status.containerStatuses[].imageID is
      # reported as docker.io/library/busybox@sha256:<INDEX-digest> — NOT the platform
      # (amd64) manifest digest. So the "Verify probe pod runtime imageID" step + the
      # verifier's requestedDigest==runtimeDigest binding only hold when we pin the INDEX
      # digest here. (An earlier attempt pinned the amd64 manifest digest and the digest
      # gate correctly fail-closed on the mismatch — that is what surfaced this.)
      PROBE_IMAGE: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662

    steps:
      - name: Validate dispatch inputs
        env:
          CLUSTER_CIDR: ${{ inputs.cluster_cidr }}
          SERVICE_CIDR: ${{ inputs.service_cidr }}
          WG_INTERFACE: ${{ inputs.wg_interface }}
          PEER_HOST: ${{ inputs.peer_host }}
          PEER_PORT: ${{ inputs.peer_port }}
          WG_NODE: ${{ inputs.wg_node }}
          DOCKER_NETWORK: ${{ inputs.docker_network }}
          PROBE_ATTEMPTS: ${{ inputs.probe_attempts }}
          WG_NODE_K8S_NAME: ${{ inputs.wg_node_k8s_name }}
          INSTALLED_HOST_RULE_SCRIPT: ${{ inputs.installed_host_rule_script }}
          KUBE_CONTEXT: ${{ inputs.kube_context }}
          KUBE_NAMESPACE: ${{ inputs.namespace }}
          SYSTEMD_UNIT: ${{ inputs.systemd_unit }}
          DRIFT_TIMER: ${{ inputs.drift_timer }}
          ROLLBACK_TESTED_REF: ${{ inputs.rollback_tested_ref }}
          PROTECTED_EVIDENCE_PATH: ${{ inputs.protected_evidence_path }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "${value}" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be single-line"
                exit 1
                ;;
            esac
          }

          reject_multiline cluster_cidr "${CLUSTER_CIDR}"
          reject_multiline service_cidr "${SERVICE_CIDR}"
          reject_multiline wg_interface "${WG_INTERFACE}"
          reject_multiline peer_host "${PEER_HOST}"
          reject_multiline peer_port "${PEER_PORT}"
          reject_multiline wg_node "${WG_NODE}"
          reject_multiline docker_network "${DOCKER_NETWORK}"
          reject_multiline probe_attempts "${PROBE_ATTEMPTS}"
          reject_multiline installed_host_rule_script "${INSTALLED_HOST_RULE_SCRIPT}"
          reject_multiline kube_context "${KUBE_CONTEXT}"
          reject_multiline namespace "${KUBE_NAMESPACE}"
          reject_multiline systemd_unit "${SYSTEMD_UNIT}"
          reject_multiline drift_timer "${DRIFT_TIMER}"
          reject_multiline rollback_tested_ref "${ROLLBACK_TESTED_REF}"
          reject_multiline protected_evidence_path "${PROTECTED_EVIDENCE_PATH}"
          reject_multiline wg_node_k8s_name "${WG_NODE_K8S_NAME}"

          if ! printf '%s' "${CLUSTER_CIDR}" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$'; then
            echo "::error::cluster_cidr must be IPv4 CIDR"
            exit 1
          fi
          if [ -n "${SERVICE_CIDR}" ] && ! printf '%s' "${SERVICE_CIDR}" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$'; then
            echo "::error::service_cidr must be empty or IPv4 CIDR"
            exit 1
          fi
          if ! printf '%s' "${PEER_PORT}" | grep -Eq '^[0-9]{1,5}$'; then
            echo "::error::peer_port must be numeric"
            exit 1
          fi
          if ! printf '%s' "${PROBE_ATTEMPTS}" | grep -Eq '^[0-9]{1,2}$'; then
            echo "::error::probe_attempts must be numeric"
            exit 1
          fi
          if ! printf '%s' "${WG_INTERFACE}${PEER_HOST}${WG_NODE}${DOCKER_NETWORK}${WG_NODE_K8S_NAME}${KUBE_CONTEXT}${KUBE_NAMESPACE}${SYSTEMD_UNIT}${DRIFT_TIMER}" | grep -Eq '^[A-Za-z0-9_.:@-]+$'; then
            echo "::error::name-like inputs contain unsupported characters"
            exit 1
          fi
          if [ -n "${INSTALLED_HOST_RULE_SCRIPT}" ] && printf '%s' "${INSTALLED_HOST_RULE_SCRIPT}" | grep -Eq '(^|/)\.\.(/|$)'; then
            echo "::error::installed_host_rule_script must not contain parent traversal segments"
            exit 1
          fi
          if [ -n "${ROLLBACK_TESTED_REF}" ] && printf '%s' "${ROLLBACK_TESTED_REF}" | grep -Eq '(^/|(^|/)\.\.(/|$)|^[A-Za-z]:)'; then
            echo "::error::rollback_tested_ref must be relative and stay under the protected evidence path"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy ephemeral probe pod + egress NetworkPolicy
        env:
          KUBE_CONTEXT: ${{ inputs.kube_context }}
          KUBE_NAMESPACE: ${{ inputs.namespace }}
          PEER_HOST: ${{ inputs.peer_host }}
          PEER_PORT: ${{ inputs.peer_port }}
          WG_NODE_K8S_NAME: ${{ inputs.wg_node_k8s_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Egress-only NetworkPolicy: the probe pod may reach ONLY the WG peer
          # <PEER_HOST>:<PEER_PORT>/TCP. No DNS egress, no other destinations.
          kubectl --context "${KUBE_CONTEXT}" -n "${KUBE_NAMESPACE}" apply -f - <<EOF
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: ${PROBE_POD_NAME}
            labels:
              wg-i6-probe-run: "${RUN_ID}"
          spec:
            podSelector:
              matchLabels:
                wg-i6-probe: "true"
                wg-i6-probe-run: "${RUN_ID}"
            policyTypes: [Egress]
            egress:
              - to:
                  - ipBlock:
                      cidr: ${PEER_HOST}/32
                ports:
                  - protocol: TCP
                    port: ${PEER_PORT}
          EOF
          kubectl --context "${KUBE_CONTEXT}" -n "${KUBE_NAMESPACE}" apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: ${PROBE_POD_NAME}
            labels:
              wg-i6-probe: "true"
              wg-i6-probe-run: "${RUN_ID}"
          spec:
            automountServiceAccountToken: false
            hostNetwork: false
            hostPID: false
            hostIPC: false
            restartPolicy: Never
            nodeSelector:
              kubernetes.io/hostname: ${WG_NODE_K8S_NAME}
            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: probe
                image: ${PROBE_IMAGE}
                command: ["sh", "-c", "sleep 600"]
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 65534
                  capabilities:
                    drop: [ALL]
                  seccompProfile:
                    type: RuntimeDefault
                resources:
                  requests:
                    # platform-test enforces a LimitRange min of 32Mi memory per
                    # container; 16Mi is admission-rejected. 32Mi is the minimum that
                    # satisfies it and is ample for a short-lived busybox nc probe.
                    cpu: 10m
                    memory: 32Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
          EOF
          kubectl --context "${KUBE_CONTEXT}" -n "${KUBE_NAMESPACE}" \
            wait --for=condition=Ready "pod/${PROBE_POD_NAME}" --timeout=90s

      - name: Verify probe pod runtime imageID is the pinned digest
        env:
          KUBE_CONTEXT: ${{ inputs.kube_context }}
          KUBE_NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          case "${PROBE_IMAGE}" in
            *PLACEHOLDER_DIGEST_TO_FILL*)
              echo "::error::PROBE_IMAGE still has the PLACEHOLDER digest; set a real busybox digest"
              exit 1
              ;;
          esac
          # HARD gate (same authority as the verifier's cryptographic digest binding):
          # (1) the pod's REQUESTED image must be exactly the pinned digest ref (immutable —
          # no tag drift); (2) the RUNTIME imageID must carry a sha256 digest that EQUALS the
          # pinned digest. A moving tag or a merely-present imageID is not proof.
          SPEC_IMAGE="$(kubectl --context "${KUBE_CONTEXT}" -n "${KUBE_NAMESPACE}" \
            get pod "${PROBE_POD_NAME}" -o jsonpath='{.spec.containers[0].image}')"
          IMAGE_ID="$(kubectl --context "${KUBE_CONTEXT}" -n "${KUBE_NAMESPACE}" \
            get pod "${PROBE_POD_NAME}" -o jsonpath='{.status.containerStatuses[0].imageID}')"
          echo "spec image: ${SPEC_IMAGE} | runtime imageID: ${IMAGE_ID}"
          if [ "${SPEC_IMAGE}" != "${PROBE_IMAGE}" ]; then
            echo "::error::probe pod spec image '${SPEC_IMAGE}' != pinned '${PROBE_IMAGE}'"
            exit 1
          fi
          DIGEST="${PROBE_IMAGE##*@}"   # sha256:<64hex>
          # Extract exactly one sha256:<64hex> from the runtime imageID (informational note:
          # this is the "which digest form" logging — the equality below is the hard gate).
          RUNTIME_DIGEST="$(printf '%s' "${IMAGE_ID}" | grep -oiE 'sha256:[0-9a-f]{64}' | head -n1 || true)"
          echo "requested digest: ${DIGEST} | runtime digest: ${RUNTIME_DIGEST:-<none>}"
          if [ -z "${RUNTIME_DIGEST}" ]; then
            echo "::error::probe pod runtime imageID has no sha256 digest (image not pulled/running)"
            exit 1
          fi
          if [ "${RUNTIME_DIGEST}" != "${DIGEST}" ]; then
            echo "::error::runtime image digest ${RUNTIME_DIGEST} != pinned digest ${DIGEST}"
            exit 1
          fi

      - name: Collect metadata-only I6 evidence
        env:
          CLUSTER_CIDR: ${{ inputs.cluster_cidr }}
          SERVICE_CIDR: ${{ inputs.service_cidr }}
          WG_INTERFACE: ${{ inputs.wg_interface }}
          PEER_HOST: ${{ inputs.peer_host }}
          PEER_PORT: ${{ inputs.peer_port }}
          WG_NODE: ${{ inputs.wg_node }}
          DOCKER_NETWORK: ${{ inputs.docker_network }}
          PROBE_ATTEMPTS: ${{ inputs.probe_attempts }}
          INSTALLED_HOST_RULE_SCRIPT: ${{ inputs.installed_host_rule_script }}
          KUBE_CONTEXT: ${{ inputs.kube_context }}
          KUBE_NAMESPACE: ${{ inputs.namespace }}
          SYSTEMD_UNIT: ${{ inputs.systemd_unit }}
          DRIFT_TIMER: ${{ inputs.drift_timer }}
          ROLLBACK_TESTED_REF: ${{ inputs.rollback_tested_ref }}
          PROTECTED_EVIDENCE_PATH: ${{ inputs.protected_evidence_path }}
          RUN_ROLLBACK_DRILL: ${{ inputs.run_rollback_drill }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          # Opt-in SAFE scratch-chain rollback drill (zero live-path impact). Default off
          # keeps rollback-defined fail-closed on normal runs.
          DRILL_ARGS=()
          if [ "${RUN_ROLLBACK_DRILL}" = "true" ]; then
            DRILL_ARGS=(--rollback-drill --rollback-drill-script "${INSTALLED_HOST_RULE_SCRIPT}")
          fi
          python3 scripts/faz24/collect-wg-bplus-i6-masq-evidence.py \
            --output "${EVIDENCE_JSON}" \
            --cluster-cidr "${CLUSTER_CIDR}" \
            --service-cidr "${SERVICE_CIDR}" \
            --wg-interface "${WG_INTERFACE}" \
            --peer-host "${PEER_HOST}" \
            --peer-port "${PEER_PORT}" \
            --wg-node "${WG_NODE}" \
            --docker-network "${DOCKER_NETWORK}" \
            --probe-attempts "${PROBE_ATTEMPTS}" \
            --probe-pod-selector "${PROBE_POD_SELECTOR}" \
            --installed-host-rule-script "${INSTALLED_HOST_RULE_SCRIPT}" \
            "${DRILL_ARGS[@]}" \
            --kube-context "${KUBE_CONTEXT}" \
            --namespace "${KUBE_NAMESPACE}" \
            --systemd-unit "${SYSTEMD_UNIT}" \
            --drift-timer "${DRIFT_TIMER}" \
            --rollback-tested-ref "${ROLLBACK_TESTED_REF}" \
            --protected-evidence-path "${PROTECTED_EVIDENCE_PATH}" \
            > "${EVIDENCE_DIR}/collector.stdout" \
            2> "${EVIDENCE_DIR}/collector.stderr"

      - name: Verify I6 MASQ evidence
        id: verify
        run: |
          set +e
          python3 scripts/faz24/verify-wg-bplus-i6-masq-evidence.py \
            "${EVIDENCE_JSON}" \
            --summary-json "${SUMMARY_JSON}" \
            > "${EVIDENCE_DIR}/verifier.stdout" \
            2> "${EVIDENCE_DIR}/verifier.stderr"
          exit_code="$?"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          cat "${EVIDENCE_DIR}/collector.stdout" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/collector.stderr" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
          exit 0

      - name: Verify artifact excludes private material
        if: always()
        id: verify_artifact
        run: |
          set -euo pipefail
          if grep -R -E -- '-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----|-----END (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----|Bearer |eyJ[A-Za-z0-9_-]+\.' "${EVIDENCE_DIR}"; then
            echo "::error::evidence artifact contains forbidden private/secret-like material"
            exit 1
          fi

      - name: Write workflow summary
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 WG-B+ I6 MASQ evidence collect"
            echo
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}\`"
            echo "- Verifier exit code: \`${VERIFY_EXIT_CODE:-missing}\`"
            echo
            echo "Boundary: metadata-only collection plus validation. This workflow deploys+deletes only its own run-scoped ephemeral probe pod + egress NetworkPolicy; it does not change host iptables/nftables, WireGuard, platform-ai, production state, or any other Kubernetes object."
            echo
            echo '```text'
            sed -n '1,160p' "${EVIDENCE_DIR}/collector.stdout" 2>/dev/null || true
            sed -n '1,160p' "${EVIDENCE_DIR}/collector.stderr" 2>/dev/null || true
            sed -n '1,160p' "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
            sed -n '1,160p' "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence collect artifact
        if: always() && steps.verify_artifact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: faz24-wg-bplus-i6-masq-collect-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local evidence directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"

      - name: Cleanup ephemeral probe pod + NetworkPolicy
        if: always()
        env:
          KUBE_CONTEXT: ${{ inputs.kube_context }}
          KUBE_NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          # Delete ONLY this run's named resources; never touch other runs'.
          kubectl --context "${KUBE_CONTEXT}" -n "${KUBE_NAMESPACE}" \
            delete pod "${PROBE_POD_NAME}" --ignore-not-found --wait=false || true
          kubectl --context "${KUBE_CONTEXT}" -n "${KUBE_NAMESPACE}" \
            delete networkpolicy "${PROBE_POD_NAME}" --ignore-not-found || true

      - name: Fail workflow when evidence is rejected
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ -z "${VERIFY_EXIT_CODE}" ]; then
            echo "::error::I6 verifier did not expose an exit code"
            exit 1
          fi
          if [ "${VERIFY_EXIT_CODE}" != "0" ]; then
            echo "::error::I6 MASQ evidence was collected but not accepted"
            exit "${VERIFY_EXIT_CODE}"
          fi
