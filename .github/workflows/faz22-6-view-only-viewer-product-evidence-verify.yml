name: Verify Faz 22.6 VIEW_ONLY viewer product evidence

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: "Completed Faz 22.6 VIEW_ONLY viewer product evidence producer run ID"
        required: true
        type: string
      confirm:
        description: "Required literal: VERIFY_FAZ22_6_VIEW_ONLY_VIEWER_PRODUCT_EVIDENCE"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: faz22-6-view-only-viewer-product-evidence-verify-${{ inputs.producer_run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify provenance, source evidence and bounded product SLOs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate dispatch inputs
        env:
          CONFIRM: ${{ inputs.confirm }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "VERIFY_FAZ22_6_VIEW_ONLY_VIEWER_PRODUCT_EVIDENCE" ] || {
            echo "::error::invalid confirmation literal"
            exit 2
          }
          printf '%s' "$PRODUCER_RUN_ID" | grep -Eq '^[1-9][0-9]{5,19}$' || {
            echo "::error::producer_run_id must be a positive GitHub Actions run ID"
            exit 2
          }

      - name: Checkout independent verifier revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install signed authority verifier dependencies
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --requirement scripts/github_apps/cross_ai_deployment_policy/requirements.lock

      - name: Fetch and verify producer artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/faz22-6-viewer-product-verifier"
          mkdir -p "$out"
          python3 scripts/faz22-remote-ops/verify-view-only-viewer-product-evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$PRODUCER_RUN_ID" \
            --output "$out/verifier-result.json" \
            --marker-out "$out/viewer-product-acceptance-marker.txt"

          jq -e '
            .status == "pass"
            and .scope == "test-only-attended-recording-off-one-viewer"
            and .computed.renderedFrames >= 100
            and .computed.pilotSeconds >= 300
            and .computed.renderLossRate <= 0.05
          ' "$out/verifier-result.json" >/dev/null
          grep -Fx 'F22_6_VIEW_ONLY_VIEWER_PRODUCT_ACCEPTANCE: v2' \
            "$out/viewer-product-acceptance-marker.txt"
          (cd "$out" && sha256sum verifier-result.json viewer-product-acceptance-marker.txt > SHA256SUMS)

          {
            echo "## #2373 VIEW_ONLY viewer product evidence verification"
            echo
            echo "- Producer run: \`$PRODUCER_RUN_ID\`"
            echo "- Artifact ID: \`$(jq -r .artifactId "$out/verifier-result.json")\`"
            echo "- Artifact digest: \`$(jq -r .artifactDigest "$out/verifier-result.json")\`"
            echo "- Evidence root: \`$(jq -r .evidenceRootSha256 "$out/verifier-result.json")\`"
            echo "- Session binding: \`$(jq -r .sessionBindingSha256 "$out/verifier-result.json")\`"
            echo "- Result: \`pass\` (bounded test-only marker; not production/legal acceptance)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted verifier result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: faz22-6-view-only-viewer-product-verifier-${{ inputs.producer_run_id }}
          path: ${{ runner.temp }}/faz22-6-viewer-product-verifier/
          if-no-files-found: error
          retention-days: 30
