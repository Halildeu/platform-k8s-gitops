name: Faz 25 Full ATS test recovery and acceptance

# Mac-side SSH aiserver'de kapali olsa da self-hosted runner test cluster ve
# host Docker control'una erisebilir. Bu workflow yalniz test ortaminda,
# kullanici tarafindan acikca dispatch edilen fail-closed recovery hattidir.
# Flyway history'de failed satir varsa otomatik repair/silme yapmaz; runbook'a
# yonlendiren acik hata ile mutation oncesi durur.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Requires zero failed Flyway rows. Live literal: APPLY_FAZ25_FULLATS_TEST_RECOVERY"
        required: true
        default: "DRY_RUN_ONLY"
      dry_run:
        description: "Only verify exact Argo revision, image/config binding, role and Flyway state"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: faz25-fullats-test-recovery
  cancel-in-progress: false

env:
  KUBE_CONTEXT: k3d-test
  KUBE_NAMESPACE: platform-test
  ARGOCD_CONTEXT: k3d-prod
  ARGOCD_NAMESPACE: argocd
  ARGOCD_APPLICATION: platform-test
  ATS_IMAGE_REPOSITORY: ghcr.io/halildeu/ats-app-boot
  EXPECTED_ATS_DIGEST: sha256:5e4496643069a44693a1f886c3c9323405634f6ecbee55f76a484183504186df
  EXPECTED_ATS_ENDPOINT_REF: faz24-stt-prod
  EXPECTED_ATS_APPROVAL_REF: mapr_04cabd439b5b51992e86e215b9796f64d27b91dd951acdf542ab6635d517fc43

jobs:
  recover:
    name: Recover ATS migration and run Full ATS acceptance
    runs-on: [self-hosted, aiserver, testai-deploy]
    timeout-minutes: 25

    steps:
      - name: Validate canonical dispatch boundary
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Halildeu/platform-k8s-gitops" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$CONFIRM_INPUT" != *$'\n'* && "$CONFIRM_INPUT" != *$'\r'* ]]
          if [[ "$DRY_RUN_INPUT" == "false" && \
                "$CONFIRM_INPUT" != "APPLY_FAZ25_FULLATS_TEST_RECOVERY" ]]; then
            echo "::error::live test recovery requires exact confirmation literal"
            exit 1
          fi

      - name: Checkout canonical recovery scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Wait for exact GitOps reconciliation and inspect pre-recovery state
        run: |
          set -euo pipefail
          argo_state=""
          argo_revision=""
          ats_deployment_sync=""
          ats_configmap_sync=""
          desired_image=""
          live_binding=""
          for _ in $(seq 1 60); do
            # A transient Argo read/JSON failure must not reuse a prior
            # iteration's successful resource/revision values.
            argo_revision=""
            ats_deployment_sync=""
            ats_configmap_sync=""
            argo_state="$(kubectl --context="$ARGOCD_CONTEXT" -n "$ARGOCD_NAMESPACE" \
              get application "$ARGOCD_APPLICATION" \
              -o json 2>/dev/null || true)"
            if [[ -n "$argo_state" ]] && jq -e . >/dev/null 2>&1 <<<"$argo_state"; then
              argo_revision="$(jq -r '.status.sync.revision // ""' <<<"$argo_state")"
              ats_deployment_sync="$(jq -r '
                [.status.resources[]?
                 | select(.group == "apps" and .kind == "Deployment" and
                          .namespace == "platform-test" and .name == "ats-interview-evidence")]
                | if length == 1 then (.[0].status // "") else "" end' <<<"$argo_state")"
              ats_configmap_sync="$(jq -r '
                [.status.resources[]?
                 | select((.group // "") == "" and .kind == "ConfigMap" and
                          .namespace == "platform-test" and .name == "ats-interview-evidence-config")]
                | if length == 1 then (.[0].status // "") else "" end' <<<"$argo_state")"
            fi
            desired_image="$(kubectl --context="$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
              get deployment ats-interview-evidence \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="app-boot")].image}' \
              2>/dev/null || true)"
            live_binding="$(kubectl --context="$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
              get configmap ats-interview-evidence-config \
              -o jsonpath='{.data.ATS_AI_ENDPOINT_REF}{"|"}{.data.ATS_AI_APPROVAL_TRANSCRIBE_REF}' \
              2>/dev/null || true)"
            if [[ "$argo_revision" == "$GITHUB_SHA" && \
                  "$ats_deployment_sync" == "Synced" && "$ats_configmap_sync" == "Synced" && \
                  "$desired_image" == "${ATS_IMAGE_REPOSITORY}@${EXPECTED_ATS_DIGEST}" && \
                  "$live_binding" == "${EXPECTED_ATS_ENDPOINT_REF}|${EXPECTED_ATS_APPROVAL_REF}" ]]; then
              break
            fi
            sleep 5
          done
          [[ "$argo_revision" == "$GITHUB_SHA" && \
             "$ats_deployment_sync" == "Synced" && "$ats_configmap_sync" == "Synced" ]] || {
            echo "::error::ArgoCD did not reconcile the exact ATS Deployment/ConfigMap at the workflow commit within 300s"
            exit 1
          }
          [[ "$desired_image" == "${ATS_IMAGE_REPOSITORY}@${EXPECTED_ATS_DIGEST}" ]] || {
            echo "::error::live Deployment does not desire the exact immutable ATS image"
            exit 1
          }
          [[ "$live_binding" == "${EXPECTED_ATS_ENDPOINT_REF}|${EXPECTED_ATS_APPROVAL_REF}" ]] || {
            echo "::error::live ConfigMap endpoint/approval refs do not equal the fixed transition"
            exit 1
          }

          role_state="$(docker exec platform-pg-test psql -U postgres -At -F '|' -c \
            "SELECT rolcanlogin,rolsuper,rolcreatedb,rolcreaterole,rolreplication,rolbypassrls FROM pg_roles WHERE rolname='ats_app'")"
          [[ "$role_state" == "t|f|f|f|f|f" ]]

          failed_history="$(docker exec platform-pg-test psql -U postgres -d ats -At -c \
            "SELECT count(*) FROM flyway_schema_history WHERE success = false")"
          if [[ "$failed_history" != "0" ]]; then
            echo "::error::Flyway failed history row detected; no automatic repair. Inspect checksums/state per docs/RB-ats-39d-testai.md."
            exit 1
          fi

          echo "PASS ArgoCD reconciled the exact ATS Deployment/ConfigMap at the workflow commit"
          echo "PASS live Deployment and ConfigMap match the fixed image/endpoint/approval binding"
          echo "PASS pre-recovery ats_app has no admin attributes"
          echo "PASS pre-recovery Flyway has no failed history row"

      - name: Stop after read-only preflight
        if: inputs.dry_run == 'true'
        run: echo "Dry-run requested; no PostgreSQL, Keycloak or application state mutation performed."

      - name: Bootstrap governance writer without credential mutation
        if: inputs.dry_run == 'false'
        run: bash scripts/ats/provision-test-pg-vault.sh --roles-only

      - name: Wait for V6 and append fixed model-governance approval
        if: inputs.dry_run == 'false'
        run: |
          set -euo pipefail
          # ATS source f34a761 WiringConfig ordering is explicit: flyway() calls
          # migrate(); modelGovernanceLedgerReader(DataSource, Flyway) depends
          # on that bean; the registry and boot gate depend on the reader.
          # Therefore the first fail-closed boot can materialize V6 before the
          # empty governance ledger prevents application readiness.
          migration_v6=""
          for _ in $(seq 1 60); do
            migration_v6="$(docker exec platform-pg-test psql -U postgres -d ats -At -F '|' -c \
              "SELECT version,success FROM flyway_schema_history WHERE version='6'")"
            [[ "$migration_v6" == "6|t" ]] && break
            sleep 5
          done
          [[ "$migration_v6" == "6|t" ]] || {
            echo "::error::Flyway V6 writer schema grant was not observed within 300s"
            exit 1
          }

          bash scripts/ats/transition-test-model-governance.sh \
            --mode append \
            --image-ref "${ATS_IMAGE_REPOSITORY}@${EXPECTED_ATS_DIGEST}" \
            --confirm APPEND_FAZ25_TEST_MODEL_GOVERNANCE

      - name: Wait for GitOps-owned ATS rollout and verify V4/V5/V6
        if: inputs.dry_run == 'false'
        run: |
          set -euo pipefail
          ready_pod=""
          for _ in $(seq 1 120); do
            pods="$(kubectl --context="$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
              get pods -l app=ats-interview-evidence -o json)"
            ready_pod="$(jq -r --arg digest "$EXPECTED_ATS_DIGEST" '
              [.items[]
               | select(any(.status.containerStatuses[]?;
                   .name == "app-boot" and .ready == true and
                   (.imageID | endswith("@" + $digest))))
               | .metadata.name][0] // ""' <<<"$pods")"
            [[ -n "$ready_pod" ]] && break
            sleep 5
          done
          if [[ -z "$ready_pod" ]]; then
            echo "::error::ATS rollout timeout after 600s; no workload restart or patch attempted"
            kubectl --context="$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
              get deployment ats-interview-evidence -o json \
              | jq -r '.status.conditions[]? |
                  ["deployment-condition", .type, .status, (.reason // ""), (.message // "")] | @tsv' \
              || echo "WARN deployment condition diagnosis unavailable"
            jq -r '.items[] | .metadata.name as $pod | .status.phase as $phase |
              .status.containerStatuses[]? | select(.name == "app-boot") |
              ["pod-container", $pod, $phase, .name,
               ("ready=" + (.ready | tostring)),
               ("restartCount=" + (.restartCount | tostring)),
               ("waiting=" + (.state.waiting.reason // "")),
               ("terminated=" + (.state.terminated.reason // "")),
               ("exitCode=" + ((.state.terminated.exitCode // "") | tostring))] | @tsv' \
              <<<"$pods" || echo "WARN pod status diagnosis unavailable"
            pod_names="$(jq -c '[.items[].metadata.name]' <<<"$pods")"
            kubectl --context="$KUBE_CONTEXT" -n "$KUBE_NAMESPACE" \
              get events --field-selector involvedObject.kind=Pod -o json \
              | jq -r --argjson names "$pod_names" '.items[] |
                  select(.involvedObject.name as $name | $names | index($name)) |
                  ["pod-event", .involvedObject.name, (.reason // ""), (.message // "")] | @tsv' \
              || echo "WARN pod event diagnosis unavailable"
            exit 1
          fi

          migration_state="$(docker exec platform-pg-test psql -U postgres -d ats -At -F '|' -c \
            "SELECT version,success FROM flyway_schema_history WHERE version IN ('4','5','6') ORDER BY installed_rank")"
          [[ "$migration_state" == $'4|t\n5|t\n6|t' ]]

          echo "PASS ATS Ready pod uses expected immutable digest"
          echo "PASS Flyway V4, V5 and V6 are successful"

      - name: Provision tenant-scoped Keycloak application roles
        if: inputs.dry_run == 'false'
        run: bash scripts/ats/provision-test-keycloak.sh

      - name: Run sentetik Full ATS 10 of 10 acceptance
        if: inputs.dry_run == 'false'
        run: bash scripts/ats/fullats-application-smoke.sh

      - name: Publish redacted summary
        if: always()
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Faz 25 Full ATS test recovery"
            echo ""
            echo "- runner: self-hosted aiserver"
            echo "- canonical ref: \`$GITHUB_REF\`"
            echo "- dry_run: \`$DRY_RUN_INPUT\`"
            echo "- immutable ATS digest: \`$EXPECTED_ATS_DIGEST\`"
            echo "- direct workload patch/restart: none"
            echo "- ats_app password or Vault mutation: none"
            echo "- ephemeral governance operator: random short-lived password via stdin only"
            echo "- model-governance transition: fixed-id, idempotent, short-lived writer login"
            echo "- production mutation: none"
            echo ""
            echo "Raw secrets, JWTs and candidate access tokens are never published."
          } >> "$GITHUB_STEP_SUMMARY"
