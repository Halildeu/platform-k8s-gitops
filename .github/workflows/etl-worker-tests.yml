name: etl_worker pytest (Faz 16 regression gate)

# Faz 16.3 etl_worker has 12 test modules / 3185 LoC of pytest coverage
# (audit, cli, ddl_compat, extract, load_reject, load_sql, reconcile,
# retry, runner, transform, v16_preflight) but no CI runner before this
# workflow.  159 tests use mocks for psycopg / pyodbc — no live DB
# required; ~0.4s wall on a developer laptop.
#
# Triggers on every change under scripts/migration/etl_worker/** or
# this workflow, plus weekly Mondays as a baseline check (catches
# silent breakage from upstream dependency drift).

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/migration/etl_worker/**"
      - ".github/workflows/etl-worker-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/migration/etl_worker/**"
  schedule:
    # Weekly Mondays 04:00 UTC (1 hour after the openfga drift gate)
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (159 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/migration/etl_worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/migration/etl_worker/pyproject.toml

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          # `pyodbc` requires unixodbc-dev to build; install it before
          # `pip install -e .[dev]`.  The runtime mssql connection isn't
          # exercised in tests (mocked), but the import has to resolve.
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq unixodbc-dev
          pip install -e ".[dev]"

      - name: Run pytest with coverage
        run: |
          set -euo pipefail
          python -m pytest --tb=short -q \
            --junitxml=/tmp/etl-worker-junit.xml \
            --cov=etl_worker --cov-report=term-missing:skip-covered \
            | tee /tmp/etl-worker-pytest.log
          # Floor: 159 tests today.  If a future change deletes tests,
          # the count drops and we want to know.  Soft floor at 150 so
          # that intentional consolidation (one larger test replacing
          # several small ones) doesn't fail noisily.
          PASSES=$(grep -oE "[0-9]+ passed" /tmp/etl-worker-pytest.log | head -1 | awk '{print $1}')
          echo "pytest passes: ${PASSES}"
          if [[ -z "${PASSES}" ]] || (( PASSES < 150 )); then
            echo "::error::expected ≥150 passing tests; got '${PASSES}'"
            exit 1
          fi

      - name: Run ruff (style)
        run: ruff check .

      - name: Run mypy (strict)
        run: python -m mypy etl_worker

      - name: Upload junit + coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: etl-worker-pytest-${{ github.run_id }}
          path: |
            /tmp/etl-worker-junit.xml
            /tmp/etl-worker-pytest.log
          retention-days: 14
