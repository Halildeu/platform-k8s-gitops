name: Faz 24 Meeting AI Analyze Smoke Operator Handoff

# Builds a metadata-only operator handoff package for the authenticated Meeting
# AI analyze smoke (platform-k8s-gitops#2186 / #1615). This workflow does not
# connect to staging-sw, WireGuard, Keycloak, Kubernetes, the api-gateway, the
# testai edge, or production; it does not seed a token, run the smoke, or collect
# runtime evidence.

on:
  workflow_dispatch:
    inputs:
      operator_batch_id:
        description: "Symbolic operator batch id"
        required: true
        default: "faz24-analyze-smoke-20260713"
      gitops_ref:
        description: "Git ref recorded for the follow-up run/verify tooling"
        required: true
        default: "main"
      staging_host:
        description: "Symbolic staging host label"
        required: true
        default: "staging-sw"
      base_url:
        description: "Public testai edge base URL"
        required: true
        default: "https://testai.acik.com"
      expected_issuer:
        description: "Expected token issuer for the analyze smoke"
        required: true
        default: "https://testai.acik.com/realms/platform-test"
      token_file:
        description: "Path for the scoped test token file"
        required: true
        default: "/tmp/faz24-analyze-smoke-token"
      evidence_path:
        description: "Path for the analyze smoke evidence JSON"
        required: true
        default: "/tmp/faz24-meeting-ai-analyze-smoke.json"

permissions:
  contents: read

concurrency:
  group: faz24-meeting-ai-analyze-smoke-operator-handoff
  cancel-in-progress: false

jobs:
  package:
    name: build meeting ai analyze smoke operator handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HANDOFF_DIR: /tmp/faz24-meeting-ai-analyze-smoke-operator-handoff-${{ github.run_id }}

    steps:
      - name: Validate dispatch inputs
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
          STAGING_HOST: ${{ inputs.staging_host }}
          BASE_URL: ${{ inputs.base_url }}
          EXPECTED_ISSUER: ${{ inputs.expected_issuer }}
          TOKEN_FILE: ${{ inputs.token_file }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "${value}" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be single-line"
                exit 1
                ;;
            esac
          }

          reject_secret_like() {
            name="$1"
            value="$2"
            if printf '%s' "${value}" | grep -Eq -- '-----BEGIN .*PRIVATE KEY-----|-----BEGIN CERTIFICATE-----|Bearer |eyJ[A-Za-z0-9_-]+\.|hvs\.[A-Za-z0-9._-]+|data:audio/[A-Za-z0-9.+-]+;base64,'; then
              echo "::error::${name} must not contain certificate/private/secret/token/raw-audio-like material"
              exit 1
            fi
          }

          reject_token_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.:@/-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          reject_host_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          reject_url_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^https://[A-Za-z0-9_.:/-]+$'; then
              echo "::error::${name} must be an https:// URL with supported characters"
              exit 1
            fi
          }

          reject_path_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.:@/+~-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
            if printf '%s' "${value}" | grep -Eq '(^|/)\.\.(/|$)|^[A-Za-z]:'; then
              echo "::error::${name} must not escape the handoff boundary"
              exit 1
            fi
            if printf '%s' "${value}" | grep -Eq '^/' && ! printf '%s' "${value}" | grep -Eq '^/tmp/'; then
              echo "::error::${name} absolute paths are only allowed under /tmp"
              exit 1
            fi
          }

          for item in \
            "operator_batch_id:${OPERATOR_BATCH_ID}" \
            "gitops_ref:${GITOPS_REF}" \
            "staging_host:${STAGING_HOST}" \
            "base_url:${BASE_URL}" \
            "expected_issuer:${EXPECTED_ISSUER}" \
            "token_file:${TOKEN_FILE}" \
            "evidence_path:${EVIDENCE_PATH}"
          do
            name="${item%%:*}"
            value="${item#*:}"
            reject_multiline "${name}" "${value}"
            reject_secret_like "${name}" "${value}"
          done

          reject_token_chars operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_token_chars gitops_ref "${GITOPS_REF}"
          reject_host_chars staging_host "${STAGING_HOST}"
          reject_url_chars base_url "${BASE_URL}"
          reject_url_chars expected_issuer "${EXPECTED_ISSUER}"
          reject_path_chars token_file "${TOKEN_FILE}"
          reject_path_chars evidence_path "${EVIDENCE_PATH}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build handoff package
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
          STAGING_HOST: ${{ inputs.staging_host }}
          BASE_URL: ${{ inputs.base_url }}
          EXPECTED_ISSUER: ${{ inputs.expected_issuer }}
          TOKEN_FILE: ${{ inputs.token_file }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          set -euo pipefail
          python3 scripts/faz24/build-meeting-ai-analyze-smoke-operator-handoff.py \
            --output-dir "${HANDOFF_DIR}" \
            --operator-batch-id "${OPERATOR_BATCH_ID}" \
            --gitops-ref "${GITOPS_REF}" \
            --staging-host "${STAGING_HOST}" \
            --base-url "${BASE_URL}" \
            --expected-issuer "${EXPECTED_ISSUER}" \
            --token-file "${TOKEN_FILE}" \
            --evidence-path "${EVIDENCE_PATH}"

      - name: Verify handoff artifact boundary
        env:
          EXPECTED_STAGING_HOST: ${{ inputs.staging_host }}
          EXPECTED_BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          test -s "${HANDOFF_DIR}/README.md"
          test -s "${HANDOFF_DIR}/faz24-meeting-ai-analyze-smoke-operator-handoff.json"
          test -s "${HANDOFF_DIR}/SHA256SUMS"
          if grep -R -E -- '-----BEGIN (CERTIFICATE|OPENSSH |RSA |EC |DSA )|-----END (CERTIFICATE|OPENSSH |RSA |EC |DSA )|Bearer |eyJ[A-Za-z0-9_-]+\.|hvs\.[A-Za-z0-9._-]+|data:audio/[A-Za-z0-9.+-]+;base64,' "${HANDOFF_DIR}"; then
            echo "::error::handoff artifact contains forbidden certificate/private/secret/token/raw-audio-like material"
            exit 1
          fi
          (cd "${HANDOFF_DIR}" && sha256sum --check SHA256SUMS)
          python3 - <<'PY' "${HANDOFF_DIR}/faz24-meeting-ai-analyze-smoke-operator-handoff.json"
          import json
          import os
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["schemaVersion"] == "faz24.meetingAiAnalyzeSmoke.operator-handoff.v1"
          assert data["acceptanceBoundary"]["operatorExecutionRequired"] is True
          assert data["acceptanceBoundary"]["stagingReachabilityRestoreRequired"] is True
          assert data["acceptanceBoundary"]["scopedTestTokenSeedRequired"] is True
          assert data["acceptanceBoundary"]["analyzeVerifierPassRequired"] is True
          assert data["acceptanceBoundary"]["doesNotSeedToken"] is True
          assert data["acceptanceBoundary"]["doesNotRunSmoke"] is True
          assert data["acceptanceBoundary"]["doesNotAcceptProductionReadiness"] is True
          assert data["mutationBoundary"]["packageBuildTokenMutation"] is False
          assert data["mutationBoundary"]["packageBuildClusterMutation"] is False
          assert data["mutationBoundary"]["containsTokens"] is False
          assert data["mutationBoundary"]["containsSourceText"] is False
          assert data["mutationBoundary"]["containsAnalyzeOutput"] is False
          assert data["target"]["stagingHost"] == os.environ["EXPECTED_STAGING_HOST"]
          assert data["target"]["baseUrl"] == os.environ["EXPECTED_BASE_URL"]
          PY

      - name: Write workflow summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 Meeting AI analyze smoke operator handoff"
            echo
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-meeting-ai-analyze-smoke-operator-handoff-${{ github.run_id }}\`"
            echo "- GitOps rollup issue: #1615"
            echo "- Transcript delivery rollout issue: #2186"
            echo
            echo "Boundary: metadata-only coordination artifact. It does not connect to staging-sw, WireGuard, Keycloak, Kubernetes, the api-gateway, the testai edge, or production; seed a token; run the smoke; collect runtime evidence; or mark #2186/#1615 accepted."
            echo
            if [ -s "${HANDOFF_DIR}/README.md" ]; then
              sed -n '1,180p' "${HANDOFF_DIR}/README.md"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload handoff artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: faz24-meeting-ai-analyze-smoke-operator-handoff-${{ github.run_id }}
          path: ${{ env.HANDOFF_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local handoff directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${HANDOFF_DIR}"
