name: Faz 22.6.3 AgentPC2 product update

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Required literal: RUN_AGENTPC2_UPDATE_AGENT_RELEASE'
        required: true
      release_id:
        description: 'Optional release tag override; empty uses the checked-in EndpointAgent release policy'
        required: false
      target_version:
        description: 'Optional target version override; empty uses the checked-in EndpointAgent release policy'
        required: false
      expected_sha256:
        description: 'Optional endpoint-agent.exe SHA256 override; empty uses the checked-in EndpointAgent release policy'
        required: false
      expected_signer_thumbprint:
        description: 'Optional internal-CA Authenticode signer thumbprint override; empty uses the checked-in EndpointAgent release policy'
        required: false
      max_bytes:
        description: 'Optional maximum endpoint-agent.exe size override; empty uses the checked-in EndpointAgent release policy'
        required: false
      target_product_device_id:
        description: 'Endpoint-admin product device UUID for AgentPC2'
        required: true
        default: '2f7ad30f-970a-42e7-8af8-08764ae6066f'
      device_hostname:
        description: 'Target endpoint hostname'
        required: true
        default: 'AgentPc2'
      poll_seconds:
        description: 'Max seconds to wait for AgentPC2 to report target_version'
        required: true
        default: '900'

permissions:
  contents: read
  issues: write

concurrency:
  group: faz22-agentpc2-update-agent
  cancel-in-progress: false

env:
  EVIDENCE_DIR: /tmp/agentpc2-update-agent-${{ github.run_id }}

jobs:
  update-agent:
    name: AgentPC2 release-catalog UPDATE_AGENT
    runs-on: [self-hosted, aiserver, testai-deploy]
    timeout-minutes: 25

    steps:
      - name: Validate dispatch inputs
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
          INPUT_RELEASE_ID: ${{ inputs.release_id }}
          INPUT_TARGET_VERSION: ${{ inputs.target_version }}
          INPUT_EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          INPUT_EXPECTED_SIGNER_THUMBPRINT: ${{ inputs.expected_signer_thumbprint }}
          INPUT_MAX_BYTES: ${{ inputs.max_bytes }}
          INPUT_TARGET_PRODUCT_DEVICE_ID: ${{ inputs.target_product_device_id }}
          INPUT_DEVICE_HOSTNAME: ${{ inputs.device_hostname }}
          INPUT_POLL_SECONDS: ${{ inputs.poll_seconds }}
        run: |
          set -euo pipefail

          reject_multiline() {
            local name="$1"
            local value="$2"

            case "${value}" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be a single line"
                exit 1
                ;;
            esac
          }

          reject_multiline confirm "${INPUT_CONFIRM}"
          reject_multiline release_id "${INPUT_RELEASE_ID}"
          reject_multiline target_version "${INPUT_TARGET_VERSION}"
          reject_multiline expected_sha256 "${INPUT_EXPECTED_SHA256}"
          reject_multiline expected_signer_thumbprint "${INPUT_EXPECTED_SIGNER_THUMBPRINT}"
          reject_multiline max_bytes "${INPUT_MAX_BYTES}"
          reject_multiline target_product_device_id "${INPUT_TARGET_PRODUCT_DEVICE_ID}"
          reject_multiline device_hostname "${INPUT_DEVICE_HOSTNAME}"
          reject_multiline poll_seconds "${INPUT_POLL_SECONDS}"

          if [ "${INPUT_CONFIRM}" != "RUN_AGENTPC2_UPDATE_AGENT_RELEASE" ]; then
            echo "::error::confirm input must be RUN_AGENTPC2_UPDATE_AGENT_RELEASE"
            exit 1
          fi

          if [ -n "${INPUT_RELEASE_ID}" ] && [[ ! "${INPUT_RELEASE_ID}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_id must look like vX.Y.Z"
            exit 1
          fi

          if [ -n "${INPUT_TARGET_VERSION}" ] && [[ ! "${INPUT_TARGET_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::target_version must look like X.Y.Z"
            exit 1
          fi

          if [ -n "${INPUT_RELEASE_ID}" ] && [ -n "${INPUT_TARGET_VERSION}" ] && [ "${INPUT_RELEASE_ID}" != "v${INPUT_TARGET_VERSION}" ]; then
            echo "::error::release_id must equal v<target_version>"
            exit 1
          fi

          if [ -n "${INPUT_EXPECTED_SHA256}" ] && [[ ! "${INPUT_EXPECTED_SHA256}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::expected_sha256 must be 64 lowercase hex characters"
            exit 1
          fi

          if [ -n "${INPUT_EXPECTED_SIGNER_THUMBPRINT}" ] && [[ ! "${INPUT_EXPECTED_SIGNER_THUMBPRINT}" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::expected_signer_thumbprint must be 40 hex characters"
            exit 1
          fi

          if [ -n "${INPUT_MAX_BYTES}" ] && [[ ! "${INPUT_MAX_BYTES}" =~ ^[0-9]+$ ]]; then
            echo "::error::max_bytes must be numeric"
            exit 1
          fi

          if [[ ! "${INPUT_TARGET_PRODUCT_DEVICE_ID}" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::target_product_device_id must look like a UUID"
            exit 1
          fi

          case "${INPUT_DEVICE_HOSTNAME}" in
            ""|"-"*|*"-"|*[^A-Za-z0-9-]*)
              echo "::error::device_hostname must be a single DNS hostname label"
              exit 1
              ;;
          esac

          if [ "${#INPUT_DEVICE_HOSTNAME}" -gt 63 ]; then
            echo "::error::device_hostname must be at most 63 characters"
            exit 1
          fi

          if [[ ! "${INPUT_POLL_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "::error::poll_seconds must be numeric"
            exit 1
          fi

          {
            if [ -n "${INPUT_RELEASE_ID}" ]; then
              printf 'RELEASE_ID=%s\n' "${INPUT_RELEASE_ID}"
              printf 'BINARY_URL=https://github.com/Halildeu/platform-agent/releases/download/%s/endpoint-agent.exe\n' "${INPUT_RELEASE_ID}"
              printf 'MANIFEST_URL=https://github.com/Halildeu/platform-agent/releases/download/%s/release-manifest.json\n' "${INPUT_RELEASE_ID}"
            fi
            if [ -n "${INPUT_TARGET_VERSION}" ]; then
              printf 'TARGET_VERSION=%s\n' "${INPUT_TARGET_VERSION}"
              printf 'EXPECTED_AGENT_VERSION=%s\n' "${INPUT_TARGET_VERSION}"
            fi
            if [ -n "${INPUT_EXPECTED_SHA256}" ]; then
              printf 'EXPECTED_SHA256=%s\n' "${INPUT_EXPECTED_SHA256}"
            fi
            if [ -n "${INPUT_EXPECTED_SIGNER_THUMBPRINT}" ]; then
              printf 'EXPECTED_SIGNER_THUMBPRINT=%s\n' "${INPUT_EXPECTED_SIGNER_THUMBPRINT}"
            fi
            if [ -n "${INPUT_MAX_BYTES}" ]; then
              printf 'MAX_BYTES=%s\n' "${INPUT_MAX_BYTES}"
            fi
            printf 'TARGET_DEVICE_ID=%s\n' "${INPUT_TARGET_PRODUCT_DEVICE_ID}"
            printf 'TARGET_DEVICE_HOSTNAME=%s\n' "${INPUT_DEVICE_HOSTNAME}"
            printf 'POLL_SECONDS=%s\n' "${INPUT_POLL_SECONDS}"
          } >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release policy
        run: scripts/faz22-remote-ops/check-endpoint-agent-release-policy.sh

      - name: Run AgentPC2 product update
        id: update
        continue-on-error: true
        env:
          KC_ADMIN_PASSWORD: ${{ secrets.KC_TEST_ADMIN_PASSWORD }}
        run: |
          set +e
          mkdir -p "${EVIDENCE_DIR}"
          chmod +x scripts/faz22-remote-ops/agentpc2-update-agent-v0214.sh

          scripts/faz22-remote-ops/agentpc2-update-agent-v0214.sh \
            2>&1 | sed -E 's/^::add-mask::.*/::add-mask::<redacted>/' | tee "${EVIDENCE_DIR}/workflow-update.log"
          exit_code="${PIPESTATUS[0]}"

          checksum_exit=0
          (
            set -e
            cd "${EVIDENCE_DIR}"
            rm -f SHA256SUMS
            tmp_sums="$(mktemp)"

            if command -v shasum >/dev/null 2>&1; then
              find . -type f ! -name SHA256SUMS -print0 \
                | sort -z \
                | xargs -0 shasum -a 256 > "${tmp_sums}"
              mv "${tmp_sums}" SHA256SUMS
              shasum -a 256 -c SHA256SUMS
            else
              find . -type f ! -name SHA256SUMS -print0 \
                | sort -z \
                | xargs -0 sha256sum > "${tmp_sums}"
              mv "${tmp_sums}" SHA256SUMS
              sha256sum -c SHA256SUMS
            fi
          )
          checksum_exit="${?}"

          if [ "${checksum_exit}" != "0" ] && [ "${exit_code}" = "0" ]; then
            exit_code="${checksum_exit}"
          fi

          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          echo "AGENTPC2_UPDATE_AGENT_EXIT_CODE=${exit_code}"
          exit 0

      - name: Publish redacted issue evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT || github.token }}
        run: |
          set -euo pipefail

          workflow_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          target_device_hostname="${TARGET_DEVICE_HOSTNAME:-unknown}"
          target_device_id="${TARGET_DEVICE_ID:-unknown}"
          release_id="${RELEASE_ID:-unknown}"
          target_version="${TARGET_VERSION:-unknown}"
          binary_url="${BINARY_URL:-unknown}"
          manifest_url="${MANIFEST_URL:-unknown}"
          expected_sha256="${EXPECTED_SHA256:-unknown}"
          signer_thumbprint="${EXPECTED_SIGNER_THUMBPRINT:-unknown}"
          max_bytes="${MAX_BYTES:-unknown}"

          summary="${EVIDENCE_DIR}/summary.json"
          mkdir -p "${EVIDENCE_DIR}"
          if [ ! -f "${summary}" ]; then
            jq -n \
              --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg status "no-go" \
              --arg reason "summary-json-missing" \
              --arg evidenceDir "${EVIDENCE_DIR}" \
              '{
                generatedAt:$generatedAt,
                status:$status,
                reason:$reason,
                evidenceDir:$evidenceDir,
                secretHygiene:{
                  rawBearerTokenLogged:false,
                  rawPasswordLogged:false,
                  rawPrivateKeyLogged:false
                }
              }' > "${summary}"
          fi

          status="$(jq -r '.status // "unknown"' "${summary}")"
          reason="$(jq -r '.reason // ""' "${summary}")"
          observed_version="$(jq -r '.targetEndpoint.observedAgentVersion // ""' "${summary}")"
          observed_status="$(jq -r '.targetEndpoint.observedStatus // ""' "${summary}")"
          observed_last_seen="$(jq -r '.targetEndpoint.observedLastSeenAt // ""' "${summary}")"
          seed_exit="$(jq -r '.seed.exitCode // ""' "${summary}")"
          seed_status="$(jq -r '.seed.status // ""' "${summary}")"
          poll_result="$(jq -r '.poll.result // ""' "${summary}")"
          poll_reason="$(jq -r '.poll.reason // ""' "${summary}")"
          sha_manifest=""
          if [ -f "${EVIDENCE_DIR}/SHA256SUMS" ]; then
            sha_manifest="$(sha256sum "${EVIDENCE_DIR}/SHA256SUMS" | awk '{print $1}')"
          fi

          comment="${RUNNER_TEMP}/agentpc2-update-agent-release.md"
          {
            echo "AGENTPC2_UPDATE_AGENT_RELEASE status=${status}"
            echo ""
            echo "- Workflow: ${workflow_url}"
            echo "- Target product device: \`${target_device_hostname}\` / \`${target_device_id}\`"
            echo "- Release: \`${release_id}\`"
            echo "- Target version: \`${target_version}\`"
            echo "- Binary URL: \`${binary_url}\`"
            echo "- Manifest URL: \`${manifest_url}\`"
            echo "- Binary SHA256: \`${expected_sha256}\`"
            echo "- Signer thumbprint: \`${signer_thumbprint}\`"
            echo "- Max bytes: \`${max_bytes}\`"
            echo "- Seed helper exit/status: \`${seed_exit}\` / \`${seed_status}\`"
            echo "- Observed AgentPC2 version/status/lastSeen: \`${observed_version}\` / \`${observed_status}\` / \`${observed_last_seen}\`"
            echo "- Poll result/reason: \`${poll_result}\` / \`${poll_reason}\`"
            echo "- Evidence dir on staging runner: \`${EVIDENCE_DIR}\`"
            echo "- Evidence SHA256SUMS hash: \`${sha_manifest}\`"
            echo "- Secret hygiene: raw bearer tokens, Keycloak passwords, and private keys are intentionally omitted."
            echo ""
            echo "Boundary: this proves only the release-catalog UPDATE_AGENT product update path. Status \`update-observed\` means the endpoint version was observed through this workflow; status \`update-dispatched-unobserved\` means dispatch succeeded but version observation is deferred to the #208 acceptance workflow. It does not prove #208 constrained executor acceptance, broad MSI/GPO rollout, production support readiness, inbound SSH/RDP/WinRM/SMB/RPC, unrestricted shell, or TPM/device-key attestation."
            if [ -n "${reason}" ]; then
              echo ""
              echo "Reason: \`${reason}\`"
            fi
          } > "${comment}"

          gh issue comment 208 \
            --repo Halildeu/platform-agent \
            --body-file "${comment}" \
            || echo "::warning::Could not comment on platform-agent#208 with this workflow token; evidence remains in the workflow artifact."

          backend_comment="${RUNNER_TEMP}/platform-backend-717-update-link.md"
          {
            echo "AGENTPC2_UPDATE_AGENT_RELEASE_LINK status=${status}"
            echo ""
            echo "- platform-backend#718 is merged; this run attempted the next product update gate before #208 acceptance."
            echo "- Workflow: ${workflow_url}"
            echo "- Target product device: \`${target_device_hostname}\` / \`${target_device_id}\`"
            echo "- Release/version: \`${release_id}\` / \`${target_version}\`"
            echo "- Observed AgentPC2 version/status/lastSeen: \`${observed_version}\` / \`${observed_status}\` / \`${observed_last_seen}\`"
            echo "- Product update status: \`${status}\`"
            if [ -n "${reason}" ]; then
              echo "- Reason: \`${reason}\`"
            fi
          } > "${backend_comment}"

          gh issue comment 717 \
            --repo Halildeu/platform-backend \
            --body-file "${backend_comment}" \
            || echo "::warning::Could not comment on platform-backend#717 with this workflow token; evidence remains in the workflow artifact."

          {
            echo "## AgentPC2 product update"
            echo ""
            cat "${comment}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload redacted evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentpc2-update-agent-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow on no-go
        if: always()
        run: |
          set -euo pipefail

          exit_code="${{ steps.update.outputs.exit_code }}"
          if [ -z "${exit_code}" ]; then
            echo "::error::update step did not expose exit_code"
            exit 1
          fi

          if [ "${exit_code}" != "0" ]; then
            echo "::error::AgentPC2 product update did not pass; see issue comment and uploaded evidence."
            exit "${exit_code}"
          fi
