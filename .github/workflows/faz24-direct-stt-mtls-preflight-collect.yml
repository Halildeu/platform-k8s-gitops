name: Faz 24 Direct-STT mTLS Preflight Collect

# Metadata-only live collector for the seed-after / flag-before point in
# platform-ai#182. This runs on the self-hosted staging-sw runner because the
# preflight must read k3d-test/platform-test runtime shape and execute the
# mTLS health probe from the real audio-gateway pod.
#
# Boundary: no Vault read/write, no Kubernetes mutation, no Caddy/firewall
# mutation, no direct-STT flag flip, no /transcribe call, no audio send.

on:
  workflow_dispatch:
    inputs:
      kube_context:
        description: "Kubernetes context for test cluster"
        required: true
        default: "k3d-test"
      namespace:
        description: "Kubernetes namespace"
        required: true
        default: "platform-test"
      deployment:
        description: "audio-gateway deployment name"
        required: true
        default: "audio-gateway"
      probe_timeout:
        description: "mTLS health probe timeout seconds"
        required: true
        default: "40"

permissions:
  contents: read

concurrency:
  group: faz24-direct-stt-mtls-preflight-collect
  cancel-in-progress: false

jobs:
  collect:
    name: collect direct-STT mTLS preflight evidence
    runs-on: [self-hosted, staging-sw, testai-deploy]
    timeout-minutes: 10

    env:
      EVIDENCE_DIR: /tmp/faz24-direct-stt-mtls-preflight-collect-${{ github.run_id }}
      EVIDENCE_JSON: /tmp/faz24-direct-stt-mtls-preflight-collect-${{ github.run_id }}/faz24-direct-stt-mtls-preflight.json
      SUMMARY_JSON: /tmp/faz24-direct-stt-mtls-preflight-collect-${{ github.run_id }}/verification-summary.json

    steps:
      - name: Validate dispatch inputs
        env:
          KUBE_CONTEXT_INPUT: ${{ inputs.kube_context }}
          NAMESPACE_INPUT: ${{ inputs.namespace }}
          DEPLOYMENT_INPUT: ${{ inputs.deployment }}
          PROBE_TIMEOUT_INPUT: ${{ inputs.probe_timeout }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "$value" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be a single line"
                exit 1
                ;;
            esac
          }

          reject_name() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -Eq '^[A-Za-z0-9_.:-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          reject_multiline kube_context "${KUBE_CONTEXT_INPUT}"
          reject_multiline namespace "${NAMESPACE_INPUT}"
          reject_multiline deployment "${DEPLOYMENT_INPUT}"
          reject_multiline probe_timeout "${PROBE_TIMEOUT_INPUT}"

          reject_name kube_context "${KUBE_CONTEXT_INPUT}"
          reject_name namespace "${NAMESPACE_INPUT}"
          reject_name deployment "${DEPLOYMENT_INPUT}"

          if ! printf '%s' "${PROBE_TIMEOUT_INPUT}" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::probe_timeout must be a positive integer"
            exit 1
          fi
          if [ "${PROBE_TIMEOUT_INPUT}" -gt 120 ]; then
            echo "::error::probe_timeout must be <= 120"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Collect metadata-only preflight evidence
        id: collect
        env:
          KUBE_CONTEXT_INPUT: ${{ inputs.kube_context }}
          NAMESPACE_INPUT: ${{ inputs.namespace }}
          DEPLOYMENT_INPUT: ${{ inputs.deployment }}
          PROBE_TIMEOUT_INPUT: ${{ inputs.probe_timeout }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          set +e
          python3 scripts/faz24/collect_direct_stt_mtls_enablement_preflight.py \
            --context "${KUBE_CONTEXT_INPUT}" \
            --namespace "${NAMESPACE_INPUT}" \
            --deployment "${DEPLOYMENT_INPUT}" \
            --gitops-commit "${GITHUB_SHA}" \
            --probe-timeout "${PROBE_TIMEOUT_INPUT}" \
            --output "${EVIDENCE_JSON}" \
            > "${EVIDENCE_DIR}/collector.stdout" \
            2> "${EVIDENCE_DIR}/collector.stderr"
          exit_code="$?"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          cat "${EVIDENCE_DIR}/collector.stdout" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/collector.stderr" 2>/dev/null || true
          exit 0

      - name: Verify direct-STT mTLS preflight evidence
        id: verify
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          set +e
          if [ ! -s "${EVIDENCE_JSON}" ]; then
            echo "missing evidence json" > "${EVIDENCE_DIR}/verifier.stderr"
            echo "exit_code=99" >> "${GITHUB_OUTPUT}"
            cat "${EVIDENCE_DIR}/verifier.stderr"
            exit 0
          fi
          python3 scripts/faz24/verify_direct_stt_mtls_enablement_preflight.py \
            "${EVIDENCE_JSON}" \
            --summary-json "${SUMMARY_JSON}" \
            > "${EVIDENCE_DIR}/verifier.stdout" \
            2> "${EVIDENCE_DIR}/verifier.stderr"
          exit_code="$?"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          cat "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
          exit 0

      - name: Verify artifact excludes private material
        id: verify_artifact
        if: always()
        run: |
          set -euo pipefail
          if grep -R -a -q -E -- '-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----|-----END (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----|Bearer |eyJ[A-Za-z0-9_-]+\.|-----BEGIN CERTIFICATE-----|audio/wav|audio/mpeg|https://live-stt\.denetim:8243|/transcribe' "${EVIDENCE_DIR}"; then
            echo "::error::preflight artifact contains forbidden private/secret/raw media/endpoint material"
            exit 1
          fi

      - name: Write workflow summary
        if: always()
        env:
          COLLECT_EXIT_CODE: ${{ steps.collect.outputs.exit_code }}
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 direct-STT mTLS preflight collect"
            echo
            echo "- Runner: self-hosted staging-sw"
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-direct-stt-mtls-preflight-collect-${{ github.run_id }}\`"
            echo "- Collector exit code: \`${COLLECT_EXIT_CODE:-missing}\`"
            echo "- Verifier exit code: \`${VERIFY_EXIT_CODE:-missing}\`"
            echo
            echo "Boundary: metadata-only pre-flag collection. This workflow does not read/write Vault, mutate Kubernetes, mutate Caddy/firewall, enable direct-STT, call /transcribe, send audio, or make production ready."
            echo
            echo '```text'
            sed -n '1,120p' "${EVIDENCE_DIR}/collector.stdout" 2>/dev/null || true
            sed -n '1,120p' "${EVIDENCE_DIR}/collector.stderr" 2>/dev/null || true
            sed -n '1,180p' "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
            sed -n '1,180p' "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload preflight collection artifact
        if: always() && steps.verify_artifact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: faz24-direct-stt-mtls-preflight-collect-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local evidence directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"

      - name: Fail workflow when preflight is not accepted
        if: always()
        env:
          COLLECT_EXIT_CODE: ${{ steps.collect.outputs.exit_code }}
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ -z "${COLLECT_EXIT_CODE}" ]; then
            echo "::error::preflight collector did not expose an exit code"
            exit 1
          fi
          if [ -z "${VERIFY_EXIT_CODE}" ]; then
            echo "::error::preflight verifier did not expose an exit code"
            exit 1
          fi
          if [ "${VERIFY_EXIT_CODE}" != "0" ]; then
            echo "::error::direct-STT mTLS preflight evidence was rejected"
            exit "${VERIFY_EXIT_CODE}"
          fi
          if [ "${COLLECT_EXIT_CODE}" != "0" ]; then
            echo "::error::direct-STT mTLS preflight collector returned failure"
            exit "${COLLECT_EXIT_CODE}"
          fi
