name: Promote testai backend desired state

# platform-backend dispatches this workflow only after all immutable runtime
# images have been published. This workflow validates the full digest contract
# and opens/updates a reviewable desired-state PR. It has no cluster runner and
# never mutates Kubernetes. Runtime reconciliation starts only after normal PR
# review + merge, in verify-testai-backend-rollout.yml.

on:
  repository_dispatch:
    types: [backend-testai-deploy]
  workflow_dispatch:
    inputs:
      sha:
        description: "Canonical platform-backend commit SHA (40 lowercase hex)"
        required: true
      short_sha:
        description: "First seven characters of sha"
        required: true
      digests:
        description: "Full immutable runtime digest map JSON (13 required services)"
        required: true

permissions:
  contents: read

concurrency:
  group: testai-backend-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Open or update test overlay PR
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout promotion contract
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve and validate immutable full-map payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_SHORT_SHA: ${{ inputs.short_sha }}
          INPUT_DIGESTS: ${{ inputs.digests }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_SHORT_SHA: ${{ github.event.client_payload.short_sha }}
          DISPATCH_DIGESTS: ${{ toJSON(github.event.client_payload.digests) }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SHA="$INPUT_SHA"
            SHORT_SHA="$INPUT_SHORT_SHA"
            RAW_DIGESTS="$INPUT_DIGESTS"
          else
            SHA="$DISPATCH_SHA"
            SHORT_SHA="$DISPATCH_SHORT_SHA"
            RAW_DIGESTS="$DISPATCH_DIGESTS"
          fi

          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || {
            echo "::error::sha must be 40 lowercase hex"; exit 1;
          }
          [[ "$SHORT_SHA" =~ ^[a-f0-9]{7}$ && "$SHORT_SHA" == "${SHA:0:7}" ]] || {
            echo "::error::short_sha must equal sha[0:7]"; exit 1;
          }

          DIGEST_MAP=$(printf '%s' "$RAW_DIGESTS" \
            | python3 scripts/automation/backend-testai-digest-contract.py normalize)
          [[ -n "$DIGEST_MAP" && "$DIGEST_MAP" != "{}" ]] || {
            echo "::error::normalized backend digest map is empty"; exit 1;
          }

          {
            echo "sha=$SHA"
            echo "short_sha=$SHORT_SHA"
            echo "digest_map=$DIGEST_MAP"
          } >> "$GITHUB_OUTPUT"

      - name: Require platform-gitops-automation GitHub App credentials
        env:
          APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_PRIVATE_KEY:-}" ]]; then
            echo "::error title=desired-state promotion disabled::AUTOMATION_APP_ID and AUTOMATION_APP_PRIVATE_KEY are required."
            echo "No cluster mutation was attempted. See docs/operations/RUNBOOKS/RB-automation-overlay-sync.md and #2384."
            exit 1
          fi

      - name: Generate least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout with App identity
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Open or update immutable backend promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST_MAP: ${{ steps.payload.outputs.digest_map }}
          SHA: ${{ steps.payload.outputs.sha }}
          SHORT_SHA: ${{ steps.payload.outputs.short_sha }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_REPO: ${{ github.repository }}
        run: bash scripts/automation/sync-test-overlay.sh

      - name: Promotion boundary summary
        if: always()
        env:
          SHA: ${{ steps.payload.outputs.sha }}
          SHORT_SHA: ${{ steps.payload.outputs.short_sha }}
          DIGEST_MAP: ${{ steps.payload.outputs.digest_map }}
        run: |
          {
            echo "## testai backend desired-state promotion"
            echo ""
            echo "- source: \`${SHA:-unresolved}\`"
            echo "- source tag family: \`sha-${SHORT_SHA:-unresolved}\`"
            echo "- required runtime digests: \`$(jq 'length' <<< "${DIGEST_MAP:-{}}" 2>/dev/null || echo unresolved)\`"
            echo "- direct Kubernetes workload mutation: **none**"
            echo "- runtime reconciliation: after normal PR review + merge"
            echo "- targeted single-service source builds: build-only; no dispatch"
          } >> "$GITHUB_STEP_SUMMARY"
