name: Deploy backend testai (auto)

# iter-49 backend deploy automation — Codex 019ddf43 PARTIAL+AGREE.
#
# Trigger: `repository_dispatch` event_type=backend-testai-deploy from
# platform-backend's ci-image-push.yml after a successful 9-service GHCR push
# (ayrı PR — bu workflow merge sonrası backend tarafına dispatch step eklenir).
#
# Codex sertleştirmeleri uygulanmış:
#   S1 — sha+short_sha payload, kubectl set image TAG, pod imageID =
#         containerd-resolved digest (skopeo runner credential yok hotfix)
#   S2 — SEQUENTIAL rollout (paralel ResourceQuota riski; iter-50 frontend
#         deploy'da 1000m+1000m=2000m > 8000m quota aşımı yaşandı)
#   S3 — api-gateway entry-point EN SON deploy
#   S4 — endpoint-admin-service + discovery-server bu ilk cut'ta SKIP
#         (manifest contract netleşince ayrı PR)
#   S5 — Gate 2 (auth flow) opt-in warn-only; primary blocking pod imageID
#         + api-gateway health
#
# Self-hosted runner: testai-deploy label reuse (tek runner, generic deploy).
#
# Required secrets (gitops repo):
#   - none — runner kubeconfig + GHCR pull credential mount in.
#   - (Optional) SMOKE_AUTH_USERNAME/PASSWORD — Gate 2 functional smoke

on:
  repository_dispatch:
    types: [backend-testai-deploy]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit sha (40-char) — manuel override için'
        required: true
      short_sha:
        description: 'Short sha (7-char)'
        required: true

permissions:
  contents: read

# #821 (Codex 019e3f2c AGREE): the rollout step pins 8 services sequentially.
# A run cancelled mid-rollout would leave k3d-test on a partial digest set;
# two concurrent backend rollouts would race the same Deployments. Serialise
# every run and never cancel in-flight (queue instead).
concurrency:
  group: backend-testai-deploy
  cancel-in-progress: false

env:
  K8S_CONTEXT: k3d-test
  K8S_NAMESPACE: platform-test
  TESTAI_URL: https://testai.acik.com
  IMAGE_OWNER: halildeu

jobs:
  deploy:
    name: Deploy backend testai (sequential digest pin + verify)
    runs-on: [self-hosted, staging-sw, testai-deploy]
    # Codex 019e233b review #1 — Gate 1d adds deterministic 17 min budget
    # (auth 180s + 7 services * 120s). Plus rollout (8 * 180s = 24m max) +
    # Gate 1c (per-service curl) + buffer. 30m timeout was insufficient.
    timeout-minutes: 60

    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Resolve dispatch payload
        id: payload
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHA="${{ inputs.sha }}"
            SHORT_SHA="${{ inputs.short_sha }}"
          else
            SHA="${{ github.event.client_payload.sha }}"
            SHORT_SHA="${{ github.event.client_payload.short_sha }}"
          fi

          if [ -z "$SHA" ] || [ -z "$SHORT_SHA" ]; then
            echo "::error::Missing payload (sha/short_sha)"
            exit 1
          fi

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          {
            echo "## Backend deploy testai — payload"
            echo "- sha: \`${SHA}\`"
            echo "- short_sha: \`${SHORT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # iter-49 hotfix: skopeo bypass — runner GHCR pull credential yok
      # (skopeo unauthorized canli kanit). Yerine kubectl set image TAG
      # ile yapilir; k3d cluster image pull (kubelet credential) zaten
      # configured. Pod imageID rollout sonrasi AUTHORITATIVE digest olur
      # (containerd resolved tag→digest). D30 immutable artifact garanti
      # kirilmaz: ayni tag iki farkli image'a isaret etmez.
      #
      # Codex S2 — sequential rollout, api-gateway EN SON.
      # iter-49 B.3 hardening: digest-pin mode + tag-based fallback
      # (backward-compat). client_payload.digests JSON map varsa
      # @sha256:<digest> direct pin (D30 immutable cutover-ready);
      # yoksa tag-based set image + pod imageID verification fallback
      # (skopeo bypass continue, mevcut davranış).
      #
      # Sprint "Prod post-cutover compliance" PR-1: digest-pin mode
      # assertion artık scripts/deploy/verify-pod-digest.sh helper'ını
      # kullanır (multi-replica strict mode ortak helper).
      - name: Checkout (for verify-pod-digest helper)
        uses: actions/checkout@v6

      - name: Sequential kubectl set image (digest-pin or tag-based)
        id: rollout
        env:
          SHORT_SHA: ${{ steps.payload.outputs.short_sha }}
          DIGESTS_JSON: ${{ toJSON(github.event.client_payload.digests) }}
        run: |
          set -euo pipefail
          # Codex S3: api-gateway en sonda
          # discovery-server + endpoint-admin-service ilk cut'tan SKIP (S4)
          SERVICES=(
            "auth-service"
            "permission-service"
            "user-service"
            "variant-service"
            "core-data-service"
            "report-service"
            "schema-service"
            "api-gateway"
          )

          # Digest-pin mode detect: dispatch payload digests map?
          # toJSON(null) → "null"; geçerli JSON object → "{...}"
          # iter-49 B.3 follow-up (run 25185749414 ölçümü): backend
          # ci-image-push.yml `gh api -F client_payload[digests]=<json>`
          # syntax'i ile gönderildiğinde GitHub webhook payload'da
          # `digests` alanı STRING (escaped JSON) olarak gelir;
          # toJSON sonrası "{\\\"svc\\\":\\\"...\\\"}". Bu yüzden
          # 1. raw type check (object form, native nested case)
          # 2. string→fromjson normalize (string form, gh api -F case)
          # iki path'i de destekle.
          #
          # Codex 019de00f PARTIAL #2: payload'da digests ALANI VARSA
          # (null değil) parse fail = hard fail (silent tag fallback'e
          # düşme). Field yoksa (legacy dispatcher) tag fallback OK.
          # Bu, prod cutover öncesi strict mode için temel: payload
          # niyetle digest gönderdi ise, parse hatası → fail-closed.
          DIGEST_FIELD_PRESENT="false"
          if [ -n "${DIGESTS_JSON:-}" ] && [ "${DIGESTS_JSON}" != "null" ]; then
            DIGEST_FIELD_PRESENT="true"
          fi
          DIGEST_MODE="false"
          DIGESTS_PARSED=""
          if [ "${DIGEST_FIELD_PRESENT}" = "true" ]; then
            # Step 1: try direct object parse
            if echo "${DIGESTS_JSON}" | jq -e 'type == "object"' >/dev/null 2>&1; then
              DIGESTS_PARSED="${DIGESTS_JSON}"
            # Step 2: try string→fromjson normalize
            elif echo "${DIGESTS_JSON}" | jq -e 'type == "string"' >/dev/null 2>&1; then
              CANDIDATE=$(echo "${DIGESTS_JSON}" | jq -r 'fromjson? // empty')
              if [ -n "${CANDIDATE}" ] && echo "${CANDIDATE}" | jq -e 'type == "object"' >/dev/null 2>&1; then
                DIGESTS_PARSED="${CANDIDATE}"
              fi
            fi
            # Strict: field present but parse failed → hard fail
            if [ -z "${DIGESTS_PARSED}" ]; then
              echo "::error::client_payload.digests present but unparseable (not object, not stringified-object). Refusing silent tag fallback."
              echo "  raw: ${DIGESTS_JSON}"
              exit 1
            fi
            # Strict: field present but empty object → hard fail
            if [ "$(echo "${DIGESTS_PARSED}" | jq 'length')" -eq 0 ]; then
              echo "::error::client_payload.digests is empty object — dispatcher meant to send digests but produced none."
              exit 1
            fi
            DIGEST_MODE="true"
            echo "✓ Digest-pin mode active ($(echo "${DIGESTS_PARSED}" | jq 'length') services in payload)"
          else
            echo "⊘ Tag-based fallback mode (dispatch payload digests field absent — legacy dispatcher; backward-compat)"
          fi
          # Override DIGESTS_JSON with normalized (object-form) for downstream jq
          DIGESTS_JSON="${DIGESTS_PARSED:-null}"

          {
            if [ "${DIGEST_MODE}" = "true" ]; then
              echo "## Sequential rollout (digest-pin)"
            else
              echo "## Sequential rollout (tag-based fallback)"
            fi
            echo ""
            echo "| Service | Pod imageID (containerd-resolved digest) |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for svc in "${SERVICES[@]}"; do
            if [ "${DIGEST_MODE}" = "true" ]; then
              # Direct digest pin (B.3 hardening)
              # Codex 019de00f PARTIAL #2: regex-strict format
              # ^sha256:[a-f0-9]{64}$ — sadece prefix değil tam doğrulama.
              DIGEST=$(echo "${DIGESTS_JSON}" | jq -r --arg s "${svc}" '.[$s] // empty')
              if [ -z "${DIGEST}" ]; then
                echo "::error::${svc} digest missing from payload"
                exit 1
              fi
              if ! [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                echo "::error::${svc} digest format invalid (expected ^sha256:[a-f0-9]{64}$): ${DIGEST}"
                exit 1
              fi
              IMAGE="ghcr.io/${IMAGE_OWNER}/platform-backend-${svc}@${DIGEST}"
            else
              # Tag-based fallback (mevcut davranış, runtime'da pod imageID = digest)
              IMAGE="ghcr.io/${IMAGE_OWNER}/platform-backend-${svc}:sha-${SHORT_SHA}"
            fi

            echo ""
            echo "==============================================="
            echo "Rolling out: ${svc}"
            echo "Image: ${IMAGE}"
            echo "==============================================="

            kubectl --context="${K8S_CONTEXT}" set image \
              "deployment/${svc}" \
              "${svc}=${IMAGE}" \
              -n "${K8S_NAMESPACE}"

            kubectl --context="${K8S_CONTEXT}" rollout status \
              "deployment/${svc}" \
              -n "${K8S_NAMESPACE}" \
              --timeout=180s

            if [ "${DIGEST_MODE}" = "true" ]; then
              # Digest-pin mode: shared helper (multi-replica strict mode).
              # Tüm non-terminating Running pod'lar expected digest ile
              # eşleşmeli. Tek pod (testai replicas=1) için trivially geçer;
              # prod replicas=2 için her iki pod doğrulanır.
              ./scripts/deploy/verify-pod-digest.sh \
                --context "${K8S_CONTEXT}" \
                --namespace "${K8S_NAMESPACE}" \
                --selector "app.kubernetes.io/name=${svc}" \
                --expected-digest "${DIGEST}"
              # Helper success → record digest in summary
              NORMALIZED="${DIGEST}"
            else
              # Tag-based fallback: pod imageID extract + record (no
              # expected digest to verify against). Inline pattern korunur;
              # newest non-terminating Running pod seçilir.
              POD=$(kubectl --context="${K8S_CONTEXT}" get pod \
                -n "${K8S_NAMESPACE}" \
                -l "app.kubernetes.io/name=${svc}" \
                --field-selector=status.phase=Running \
                -o json \
                | jq -r '.items
                    | map(select(.metadata.deletionTimestamp == null))
                    | sort_by(.metadata.creationTimestamp)
                    | last
                    | .metadata.name // empty')
              if [ -z "${POD}" ]; then
                echo "::error::${svc} no live (Running + non-terminating) pod found"
                exit 1
              fi
              RAW_ID=$(kubectl --context="${K8S_CONTEXT}" get pod "${POD}" \
                -n "${K8S_NAMESPACE}" \
                -o jsonpath='{.status.containerStatuses[0].imageID}')
              NORMALIZED=$(echo "${RAW_ID}" | sed -E 's|^.*@(sha256:[a-f0-9]{64})$|\1|')

              if [ -z "${NORMALIZED}" ] || [[ "${NORMALIZED}" != sha256:* ]]; then
                echo "::error::${svc} pod imageID format unexpected: ${RAW_ID}"
                exit 1
              fi
              echo "✓ ${svc} pod imageID resolved: ${NORMALIZED}"
            fi

            echo "| ${svc} | \`${NORMALIZED}\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      # Gate 1b: api-gateway public edge chain health (Codex S5 primary blocking)
      #
      # iter-49 fix (run 25184239631): /actuator/health public exposure
      # PROTECTED via JWT (return 401), prod security best-practice
      # (info disclosure block). Liveness check management port'tan (Gate 1c).
      #
      # Bu gate edge → host nginx → k3d ingress → api-gateway POD chain'i
      # doğrular. Geçerli sinyal:
      #   - 200/401/403 → gateway ALIVE (request gateway pod'una ulaştı,
      #     auth filter / route filter çalıştı)
      #   - 502/503/504/000 → chain BROKEN (gateway pod down, ingress
      #     misconfig, network split)
      # 401 specifically iter-49 A.1 production fix (BadJwtException) ile
      # pozitif sinyal: gateway JWT filter alive + audz chain reachable.
      - name: Gate 1b — api-gateway public edge chain alive
        run: |
          set -euo pipefail
          # /api/users/all → forces gateway routing (downstream user-service)
          # + auth filter trigger; 401 unauthenticated = healthy edge chain
          STATUS=$(curl -sko /dev/null -w '%{http_code}' "${TESTAI_URL}/api/users/all")
          case "${STATUS}" in
            200|401|403)
              echo "✓ api-gateway edge chain alive (HTTP ${STATUS})"
              ;;
            *)
              echo "::error::api-gateway edge chain BROKEN — /api/users/all returned ${STATUS} (expected 200/401/403)"
              exit 1
              ;;
          esac

      # Gate 1c: 8 service in-cluster /actuator/health/readiness 200
      # Codex S4: management port 8081, readiness sub-path
      - name: Gate 1c — per-service in-cluster readiness
        run: |
          set -euo pipefail
          SERVICES=(
            "auth-service"
            "permission-service"
            "user-service"
            "variant-service"
            "core-data-service"
            "report-service"
            "schema-service"
            "api-gateway"
          )
          FAILED=0
          for svc in "${SERVICES[@]}"; do
            # Codex 019de00f PARTIAL #1: items[0] race fix (Gate 1c).
            # Aynı pattern rollout step'inde uygulandı; readiness
            # gate'inde de tutarlı non-terminating + en yeni pod seçimi.
            POD=$(kubectl --context="${K8S_CONTEXT}" get pod \
              -n "${K8S_NAMESPACE}" \
              -l "app.kubernetes.io/name=${svc}" \
              --field-selector=status.phase=Running \
              -o json \
              | jq -r '.items
                  | map(select(.metadata.deletionTimestamp == null))
                  | sort_by(.metadata.creationTimestamp)
                  | last
                  | .metadata.name // empty')
            if [ -z "${POD}" ]; then
              echo "::warning::${svc} no live pod found for readiness check"
              FAILED=$((FAILED + 1))
              continue
            fi
            STATUS=$(kubectl --context="${K8S_CONTEXT}" exec "${POD}" \
              -n "${K8S_NAMESPACE}" -- \
              curl -sko /dev/null -w '%{http_code}' \
              http://localhost:8081/actuator/health/readiness 2>/dev/null || echo "000")
            if [ "${STATUS}" = "200" ]; then
              echo "✓ ${svc} readiness 200"
            else
              echo "::warning::${svc} readiness returned ${STATUS}"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ ${FAILED} -gt 0 ]; then
            echo "::error::${FAILED} service(s) failed readiness probe"
            exit 1
          fi

      # Gate 1d — Pod stability window (Codex 019e2319 iter-3 AGREE — PR-2)
      #
      # Runs AFTER Gate 1c (immediate readiness) and asserts the freshly
      # rolled Deployments stay stable for a catalog-driven window (2 min
      # default, 3 min for jvm_warmup_extra services like auth-service /
      # endpoint-admin-service). Closes the bug class where rollout
      # completes + Gate 1c sees readiness 200, then the new pod crashes
      # 30-60 s later — the endpoint-admin /healthz/* probe drift
      # fingerprint that caused 16h silent CrashLoopBackOff on 2026-05-13.
      - name: Gate 1d — Pod stability window
        run: |
          set -euo pipefail
          SERVICES=(
            "auth-service"
            "permission-service"
            "user-service"
            "variant-service"
            "core-data-service"
            "report-service"
            "schema-service"
            "api-gateway"
          )
          for svc in "${SERVICES[@]}"; do
            echo ""
            echo "==============================================="
            echo "Stability window: ${svc}"
            echo "==============================================="
            ./scripts/deploy/gate-stability-window.sh \
              --service "${svc}" \
              --context "${K8S_CONTEXT}" \
              --namespace "${K8S_NAMESPACE}" \
              --catalog docs/operations/services.yaml
          done

      # Gate 2 — opt-in JWT auth flow (warn-only if persona yok)
      - name: Gate 2 — JWT auth flow smoke (opt-in)
        env:
          SMOKE_AUTH_USERNAME: ${{ secrets.SMOKE_AUTH_USERNAME }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.SMOKE_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_AUTH_USERNAME:-}" ] || [ -z "${SMOKE_AUTH_PASSWORD:-}" ]; then
            echo "::warning::Gate 2 (JWT auth flow) skipped — SMOKE_AUTH_* secrets yok"
            exit 0
          fi
          # Codex S5: persona/secret hazır olunca blocking'e yükselt.
          # Şimdilik basic chain: token al + /api/users/all 401 değil 200
          # (auth + audz + downstream forward zinciri test eder)
          TOKEN=$(curl -sk -X POST \
            "${TESTAI_URL}/realms/platform-test/protocol/openid-connect/token" \
            -d "grant_type=password" \
            -d "client_id=frontend" \
            -d "username=${SMOKE_AUTH_USERNAME}" \
            -d "password=${SMOKE_AUTH_PASSWORD}" | jq -r .access_token)
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::Gate 2 token fetch failed"
            exit 1
          fi
          STATUS=$(curl -sko /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            "${TESTAI_URL}/api/users/all?page=1&pageSize=1")
          if [ "${STATUS}" != "200" ]; then
            echo "::error::Gate 2 /api/users/all returned ${STATUS} (expected 200)"
            exit 1
          fi
          echo "✓ Gate 2 JWT auth flow PASS"

      - name: Summary
        if: always()
        env:
          SHA: ${{ steps.payload.outputs.sha }}
          SHORT_SHA: ${{ steps.payload.outputs.short_sha }}
        run: |
          {
            echo ""
            echo "## Backend deploy verify chain"
            echo ""
            echo "- Sequential rollout (8 service): ✓"
            echo "- Gate 1a (per-service pod digest): ✓"
            echo "- Gate 1b (api-gateway public health): ✓"
            echo "- Gate 1c (in-cluster readiness): ✓"
            echo "- Gate 1d (post-rollout stability window 2-3 min): ✓"
            echo "- Gate 2 (JWT auth flow): ${{ secrets.SMOKE_AUTH_USERNAME && '✓' || '⊘ skipped (no creds)' }}"
            echo ""
            echo "## Manual workflow_dispatch retry"
            echo ""
            echo '```bash'
            echo "gh workflow run deploy-backend-testai.yml -R Halildeu/platform-k8s-gitops \\"
            echo "  -f sha=${SHA} \\"
            echo "  -f short_sha=${SHORT_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
