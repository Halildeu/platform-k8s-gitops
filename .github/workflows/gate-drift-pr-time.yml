name: Drift Detection — PR-time Gate

on:
  pull_request:
    paths:
      - 'kustomize/overlays/**'
      - 'kustomize/base/**'
      - 'scripts/drift-detection/**'
      - '.github/workflows/gate-drift-pr-time.yml'
      - 'docs/operations/services.yaml'

permissions:
  contents: read
  packages: read  # required for GHCR manifest existence check (Codex Sprint A P0 Item 4)

jobs:
  drift-pr-time:
    name: Drift PR-time render gate (Codex P0)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        env: [test, prod]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup kubectl (kustomize built-in)
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.31.0'

      - name: Setup Python (for GHCR manifest verifier + ConfigMap invariants)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python3 -m pip install --quiet PyYAML

      - name: Drift PR-time check (${{ matrix.env }})
        env:
          PLATFORM_GITOPS_REPO: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/drift-detection/check_pr_time.sh
          chmod +x scripts/drift-detection/verify_ghcr_manifests.py
          bash scripts/drift-detection/check_pr_time.sh ${{ matrix.env }}
