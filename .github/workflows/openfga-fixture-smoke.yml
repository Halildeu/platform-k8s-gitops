name: OpenFGA Fixture Smoke (Faz 21.3 — D29 Zanzibar third level)

# Faz 21.3 fixture-level regression gate — turns the one-time E2E proof
# from PR #168 into a permanent CI check. On every change that could
# break the dev/local OpenFGA seed flow:
#   1. Spin up an ephemeral OpenFGA container (image tag pinned to a
#      minor version below — Codex retrospective WARNING #3 absorb).
#   2. Run `scripts/dev-seed.sh --openfga-only` against it (renders
#      model.fga via render_model_json.py, writes model + tuples).
#   3. Run `scripts/smoke-openfga-fixture.sh` which executes every
#      `smoke_checks[]` from `tuples.json` and asserts the expected
#      allow/deny outcome.
#
# Catches: render_model_json.py regressions, dev-seed.sh OpenFGA
# block regressions, model.fga ↔ tuples.json relation-name drift,
# smoke_checks expectations vs current model semantics.

on:
  pull_request:
    branches: [main]
    paths:
      - "bootstrap/local-fixtures/openfga/**"
      - "scripts/dev-seed.sh"
      - "scripts/smoke-openfga-fixture.sh"
      - ".github/workflows/openfga-fixture-smoke.yml"
      - "tests/openfga/**"
      - "docs/authz/openfga-model-contract.md"
  push:
    branches: [main]
    paths:
      - "bootstrap/local-fixtures/openfga/**"
      - "scripts/dev-seed.sh"
      - "scripts/smoke-openfga-fixture.sh"
      - "tests/openfga/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fixture-smoke:
    name: dev-seed.sh + fixture smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Start ephemeral OpenFGA
        # Pin to v1.14 minor — `latest` would silently change API/health
        # response shape on a future OpenFGA release and break unrelated
        # PRs. Bump in a deliberate PR after a local pipe-test of the new
        # tag confirms render_model_json.py + tuples + smoke still work.
        run: |
          docker run -d --name openfga-fixture \
            -p 8080:8080 -p 8081:8081 \
            openfga/openfga:v1.14 run

      - name: Wait for OpenFGA /healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            STATUS=$(curl -s --max-time 2 http://localhost:8080/healthz | jq -r '.status // empty' 2>/dev/null || true)
            if [[ "${STATUS}" == "SERVING" ]]; then
              echo "openfga healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "openfga did not become healthy in 30s; logs:"
          docker logs openfga-fixture 2>&1 | tail -50
          exit 1

      - name: Seed model + tuples (dev-seed.sh --openfga-only)
        env:
          OPENFGA_URL: http://localhost:8080
        run: |
          # KC + PG blocks are skipped via --openfga-only. The trailing k8s
          # secret stub now self-skips when no k3d-dev kubectl context is
          # present (PR #170 + this PR's request-timeout hardening), so the
          # whole script exits 0. We still grep the marker as a positive
          # signal that the OpenFGA block actually completed.
          bash scripts/dev-seed.sh --openfga-only 2>&1 | tee /tmp/dev-seed.log
          if ! grep -q "OpenFGA tuples written" /tmp/dev-seed.log; then
            echo "❌ dev-seed.sh did not reach 'OpenFGA tuples written' marker"
            exit 1
          fi

      - name: Run dev-seed smoke checks (bootstrap fixture)
        env:
          OPENFGA_URL: http://localhost:8080
        run: bash scripts/smoke-openfga-fixture.sh

      - name: Install Python dependencies for super-admin fixture
        run: python3 -m pip install --quiet PyYAML

      - name: Run super-admin canonical fixture (Codex P0 #5 — target-state coverage)
        # 2026-05-04 empirical finding (Codex thread 019df310 follow-up):
        # bootstrap/local-fixtures/openfga/model.fga and upstream
        # Halildeu/platform-backend:backend/openfga/model.fga both do NOT implement
        # organization:default#admin -> module/action/report inheritance.
        #
        # The OpenFGA Model Drift Gate (Faz 19.11 Step 4) enforces parity between
        # local fixture and upstream backend model. Initial B0a attempt to add
        # inheritance to local fixture diverged from upstream → drift gate fail
        # (correctly). Therefore this super-admin fixture is target-state coverage
        # (documentation of the desired contract), NOT a current model gate.
        #
        # It remains continue-on-error until the platform-backend OpenFGA schema rev
        # + tuple migration lands and the drift gate proves upstream parity. At that
        # point bootstrap fixture model.fga will get inheritance via drift-sync PR
        # and this step will become a hard gate.
        continue-on-error: true
        env:
          OPENFGA_URL: http://localhost:8080
        run: |
          if [ -f tests/openfga/run_super_admin_fixture.py ]; then
            python3 tests/openfga/run_super_admin_fixture.py
          else
            echo "[SKIP] tests/openfga/run_super_admin_fixture.py not present"
          fi

      - name: Super-admin target-state fixture annotation
        if: always()
        run: |
          echo "::warning title=Super-admin target-state fixture::Current upstream OpenFGA model does not implement organization admin inheritance for module/action/report checks. This fixture documents target-state behavior and must become a hard gate only after platform-backend model migration + live tuple migration evidence."

      - name: Dump OpenFGA logs on failure
        if: failure()
        run: docker logs openfga-fixture 2>&1 | tail -100 || true

      - name: Cleanup
        if: always()
        run: docker rm -f openfga-fixture 2>&1 || true
