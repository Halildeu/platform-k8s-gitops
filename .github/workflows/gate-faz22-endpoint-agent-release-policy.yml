name: Gate Faz 22.6 EndpointAgent release policy

on:
  pull_request:
    paths:
      - '.github/workflows/gate-faz22-endpoint-agent-release-policy.yml'
      - 'config/faz22-6-endpoint-agent-release-policy.v1.json'
      - 'scripts/faz22-remote-ops/check-endpoint-agent-release-policy.sh'
      - 'scripts/faz22-remote-ops/endpoint-agent-release-policy.sh'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gate-faz22-endpoint-agent-release-policy.yml'
      - 'config/faz22-6-endpoint-agent-release-policy.v1.json'
      - 'scripts/faz22-remote-ops/check-endpoint-agent-release-policy.sh'
      - 'scripts/faz22-remote-ops/endpoint-agent-release-policy.sh'

permissions:
  actions: read
  contents: read

concurrency:
  group: gate-faz22-endpoint-agent-release-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Verify EndpointAgent release policy SSOT
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Parse policy scripts
        run: |
          set -euo pipefail
          bash -n \
            scripts/faz22-remote-ops/check-endpoint-agent-release-policy.sh \
            scripts/faz22-remote-ops/endpoint-agent-release-policy.sh

      - name: Validate policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/faz22-remote-ops/check-endpoint-agent-release-policy.sh
