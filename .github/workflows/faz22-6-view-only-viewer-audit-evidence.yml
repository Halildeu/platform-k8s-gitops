name: Faz 22.6 VIEW_ONLY viewer audit evidence

on:
  workflow_dispatch:
    inputs:
      browser_run_id: {description: "Successful browser source run ID", required: true, type: string}
      confirm: {description: "Required literal: PRODUCE_FAZ22_6_VIEW_ONLY_VIEWER_AUDIT_EVIDENCE", required: true, type: string}

permissions:
  actions: read
  contents: read

concurrency:
  group: faz22-6-view-only-viewer-audit-evidence-${{ inputs.browser_run_id }}
  cancel-in-progress: false

jobs:
  audit-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}
          BROWSER_RUN_ID: ${{ inputs.browser_run_id }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "PRODUCE_FAZ22_6_VIEW_ONLY_VIEWER_AUDIT_EVIDENCE" ]
          printf '%s' "$BROWSER_RUN_ID" | grep -Eq '^[1-9][0-9]{5,19}$'
      - name: Checkout producer revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install strict schema validator
        run: python3 -m pip install --quiet jsonschema==4.25.1
      - name: Produce independently verified audit child
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/faz22-viewer-audit-source/evidence/audit.json"
          python3 scripts/faz22-remote-ops/produce-view-only-viewer-audit-evidence.py \
            --repository "$GITHUB_REPOSITORY" --browser-run-id "${{ inputs.browser_run_id }}" \
            --head-sha "$GITHUB_SHA" --output "$out"
          test "$(find "$(dirname "$(dirname "$out")")" -type f | wc -l | tr -d ' ')" = "1"
          sha256sum "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload exact audit source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: faz22-6-view-only-viewer-audit-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/faz22-viewer-audit-source/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
