name: Coordination Ledger Replay Gate

on:
  pull_request:
    paths:
      - "coordination-ledger/**/*.jsonl"
      - "docs/coordination/coordination-ledger-event-v1.schema.json"
      - "docs/coordination/ledger-event-authority-v1.json"
      - "scripts/coordination/append-ledger-branch.sh"
      - "scripts/coordination/append-ledger-event.py"
      - "scripts/coordination/apply-ledger-mirrors.py"
      - "scripts/coordination/emit-ledger-event.sh"
      - "scripts/coordination/ledger-claim-state.py"
      - "scripts/coordination/materialize-ledger-comment.py"
      - "scripts/coordination/reap-ledger-state.py"
      - "scripts/coordination/retry-audit-debt.py"
      - "scripts/coordination/takeover-recovery-flow.py"
      - "scripts/coordination/verify-ledger-replay.py"
      - "scripts/test/coordination-ledger-audit-debt-retry.sh"
      - "scripts/test/coordination-ledger-branch-cas.sh"
      - "scripts/test/coordination-ledger-materialized-comment.sh"
      - "scripts/test/coordination-ledger-mirror-safe-emission.sh"
      - "scripts/test/coordination-ledger-post-cas-mirrors.sh"
      - "scripts/test/coordination-ledger-reaper.sh"
      - "scripts/test/coordination-ledger-replay.sh"
      - "scripts/test/coordination-ledger-takeover-recovery.sh"
      - "scripts/test/coordination-ledger-writer.sh"
      - "scripts/test/board-sync-ledger-require-claim.sh"
      - "scripts/board-sync.sh"
      - ".github/workflows/gate-coordination-ledger-replay.yml"
  push:
    branches:
      - main
    paths:
      - "coordination-ledger/**/*.jsonl"
      - "docs/coordination/coordination-ledger-event-v1.schema.json"
      - "docs/coordination/ledger-event-authority-v1.json"
      - "scripts/coordination/append-ledger-branch.sh"
      - "scripts/coordination/append-ledger-event.py"
      - "scripts/coordination/apply-ledger-mirrors.py"
      - "scripts/coordination/emit-ledger-event.sh"
      - "scripts/coordination/ledger-claim-state.py"
      - "scripts/coordination/materialize-ledger-comment.py"
      - "scripts/coordination/reap-ledger-state.py"
      - "scripts/coordination/retry-audit-debt.py"
      - "scripts/coordination/takeover-recovery-flow.py"
      - "scripts/coordination/verify-ledger-replay.py"
      - "scripts/test/coordination-ledger-audit-debt-retry.sh"
      - "scripts/test/coordination-ledger-branch-cas.sh"
      - "scripts/test/coordination-ledger-materialized-comment.sh"
      - "scripts/test/coordination-ledger-mirror-safe-emission.sh"
      - "scripts/test/coordination-ledger-post-cas-mirrors.sh"
      - "scripts/test/coordination-ledger-reaper.sh"
      - "scripts/test/coordination-ledger-replay.sh"
      - "scripts/test/coordination-ledger-takeover-recovery.sh"
      - "scripts/test/coordination-ledger-writer.sh"
      - "scripts/test/board-sync-ledger-require-claim.sh"
      - "scripts/board-sync.sh"
      - ".github/workflows/gate-coordination-ledger-replay.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile ledger scripts
        run: python3 -m py_compile scripts/coordination/append-ledger-event.py scripts/coordination/apply-ledger-mirrors.py scripts/coordination/ledger-claim-state.py scripts/coordination/materialize-ledger-comment.py scripts/coordination/reap-ledger-state.py scripts/coordination/retry-audit-debt.py scripts/coordination/takeover-recovery-flow.py scripts/coordination/verify-ledger-replay.py

      - name: Run verifier harness
        run: bash scripts/test/coordination-ledger-replay.sh

      - name: Run append writer harness
        run: bash scripts/test/coordination-ledger-writer.sh

      - name: Run remote branch CAS harness
        run: bash scripts/test/coordination-ledger-branch-cas.sh

      - name: Run materialized comment harness
        run: bash scripts/test/coordination-ledger-materialized-comment.sh

      - name: Run mirror-safe emission harness
        run: bash scripts/test/coordination-ledger-mirror-safe-emission.sh

      - name: Run post-CAS mirror writer harness
        run: bash scripts/test/coordination-ledger-post-cas-mirrors.sh

      - name: Run reaper harness
        run: bash scripts/test/coordination-ledger-reaper.sh

      - name: Run audit debt retry harness
        run: bash scripts/test/coordination-ledger-audit-debt-retry.sh

      - name: Run takeover/recovery harness
        run: bash scripts/test/coordination-ledger-takeover-recovery.sh

      - name: Run ledger-backed require-claim harness
        run: bash scripts/test/board-sync-ledger-require-claim.sh

      - name: Replay repository ledger files
        shell: bash
        run: |
          set -euo pipefail
          # bash is required for mapfile and process substitution.
          mapfile -t ledgers < <(find coordination-ledger -type f -name '*.jsonl' 2>/dev/null | sort || true)
          if [ "${#ledgers[@]}" -eq 0 ]; then
            echo "No coordination-ledger JSONL files present."
            exit 0
          fi
          python3 scripts/coordination/verify-ledger-replay.py "${ledgers[@]}"
