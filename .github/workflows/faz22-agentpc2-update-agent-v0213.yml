name: Faz 22.6.3 AgentPC2 v0.2.13 product update

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Required literal: RUN_AGENTPC2_UPDATE_AGENT_V0213'
        required: true
      target_product_device_id:
        description: 'Endpoint-admin product device UUID for AgentPC2'
        required: true
        default: '2f7ad30f-970a-42e7-8af8-08764ae6066f'
      device_hostname:
        description: 'Target endpoint hostname'
        required: true
        default: 'AgentPc2'
      poll_seconds:
        description: 'Max seconds to wait for AgentPC2 to report v0.2.13'
        required: true
        default: '900'

permissions:
  contents: read
  issues: write

concurrency:
  group: faz22-agentpc2-update-agent-v0213
  cancel-in-progress: false

env:
  KC_ADMIN_PASSWORD: ${{ secrets.KC_TEST_ADMIN_PASSWORD }}
  GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT || github.token }}
  EVIDENCE_DIR: /tmp/agentpc2-update-agent-v0213-${{ github.run_id }}
  TARGET_DEVICE_ID: ${{ inputs.target_product_device_id }}
  TARGET_DEVICE_HOSTNAME: ${{ inputs.device_hostname }}
  POLL_SECONDS: ${{ inputs.poll_seconds }}

jobs:
  update-agent:
    name: AgentPC2 release-catalog UPDATE_AGENT
    runs-on: [self-hosted, staging-sw, testai-deploy]
    timeout-minutes: 25

    steps:
      - name: Validate dispatch inputs
        run: |
          set -euo pipefail

          if [ "${{ inputs.confirm }}" != "RUN_AGENTPC2_UPDATE_AGENT_V0213" ]; then
            echo "::error::confirm input must be RUN_AGENTPC2_UPDATE_AGENT_V0213"
            exit 1
          fi

          if ! printf '%s' "${{ inputs.target_product_device_id }}" | grep -Eq '^[0-9a-fA-F-]{36}$'; then
            echo "::error::target_product_device_id must look like a UUID"
            exit 1
          fi

          if ! printf '%s' "${{ inputs.poll_seconds }}" | grep -Eq '^[0-9]+$'; then
            echo "::error::poll_seconds must be numeric"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Run AgentPC2 v0.2.13 product update
        id: update
        continue-on-error: true
        run: |
          set +e
          mkdir -p "${EVIDENCE_DIR}"
          chmod +x scripts/faz22-remote-ops/agentpc2-update-agent-v0213.sh

          scripts/faz22-remote-ops/agentpc2-update-agent-v0213.sh \
            2>&1 | sed -E 's/^::add-mask::.*/::add-mask::<redacted>/' | tee "${EVIDENCE_DIR}/workflow-update.log"
          exit_code="${PIPESTATUS[0]}"

          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          echo "AGENTPC2_UPDATE_AGENT_EXIT_CODE=${exit_code}"
          exit 0

      - name: Publish redacted issue evidence
        if: always()
        run: |
          set -euo pipefail

          summary="${EVIDENCE_DIR}/summary.json"
          mkdir -p "${EVIDENCE_DIR}"
          if [ ! -f "${summary}" ]; then
            jq -n \
              --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg status "no-go" \
              --arg reason "summary-json-missing" \
              --arg evidenceDir "${EVIDENCE_DIR}" \
              '{
                generatedAt:$generatedAt,
                status:$status,
                reason:$reason,
                evidenceDir:$evidenceDir,
                secretHygiene:{
                  rawBearerTokenLogged:false,
                  rawPasswordLogged:false,
                  rawPrivateKeyLogged:false
                }
              }' > "${summary}"
          fi

          status="$(jq -r '.status // "unknown"' "${summary}")"
          reason="$(jq -r '.reason // ""' "${summary}")"
          observed_version="$(jq -r '.targetEndpoint.observedAgentVersion // ""' "${summary}")"
          observed_status="$(jq -r '.targetEndpoint.observedStatus // ""' "${summary}")"
          observed_last_seen="$(jq -r '.targetEndpoint.observedLastSeenAt // ""' "${summary}")"
          seed_exit="$(jq -r '.seed.exitCode // ""' "${summary}")"
          seed_status="$(jq -r '.seed.status // ""' "${summary}")"
          poll_result="$(jq -r '.poll.result // ""' "${summary}")"
          poll_reason="$(jq -r '.poll.reason // ""' "${summary}")"
          sha_manifest=""
          if [ -f "${EVIDENCE_DIR}/SHA256SUMS" ]; then
            sha_manifest="$(sha256sum "${EVIDENCE_DIR}/SHA256SUMS" | awk '{print $1}')"
          fi

          comment="${RUNNER_TEMP}/agentpc2-update-agent-v0213.md"
          {
            echo "AGENTPC2_UPDATE_AGENT_V0213 status=${status}"
            echo ""
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Target product device: \`${{ inputs.device_hostname }}\` / \`${{ inputs.target_product_device_id }}\`"
            echo "- Release: \`v0.2.13\`"
            echo "- Binary SHA256: \`6e3a79b8ea076d08e2288be98359d3db6049b6179e655ceaff924f792736cd0c\`"
            echo "- Signer thumbprint: \`D68F4F530137EB65CE44E3405E82B46205E753E5\`"
            echo "- Seed helper exit/status: \`${seed_exit}\` / \`${seed_status}\`"
            echo "- Observed AgentPC2 version/status/lastSeen: \`${observed_version}\` / \`${observed_status}\` / \`${observed_last_seen}\`"
            echo "- Poll result/reason: \`${poll_result}\` / \`${poll_reason}\`"
            echo "- Evidence dir on staging runner: \`${EVIDENCE_DIR}\`"
            echo "- Evidence SHA256SUMS hash: \`${sha_manifest}\`"
            echo "- Secret hygiene: raw bearer tokens, Keycloak passwords, and private keys are intentionally omitted."
            echo ""
            echo "Boundary: this proves only the release-catalog UPDATE_AGENT product update path when status is \`update-observed\`. It does not prove #208 constrained executor acceptance, broad MSI/GPO rollout, production support readiness, inbound SSH/RDP/WinRM/SMB/RPC, unrestricted shell, or TPM/device-key attestation."
            if [ -n "${reason}" ]; then
              echo ""
              echo "Reason: \`${reason}\`"
            fi
          } > "${comment}"

          gh issue comment 208 \
            --repo Halildeu/platform-agent \
            --body-file "${comment}" \
            || echo "::warning::Could not comment on platform-agent#208 with this workflow token; evidence remains in the workflow artifact."

          backend_comment="${RUNNER_TEMP}/platform-backend-717-update-link.md"
          {
            echo "AGENTPC2_UPDATE_AGENT_V0213_LINK status=${status}"
            echo ""
            echo "- platform-backend#718 is merged; this run attempted the next product update gate before #208 acceptance."
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Target product device: \`${{ inputs.device_hostname }}\` / \`${{ inputs.target_product_device_id }}\`"
            echo "- Observed AgentPC2 version/status/lastSeen: \`${observed_version}\` / \`${observed_status}\` / \`${observed_last_seen}\`"
            echo "- Product update status: \`${status}\`"
            if [ -n "${reason}" ]; then
              echo "- Reason: \`${reason}\`"
            fi
          } > "${backend_comment}"

          gh issue comment 717 \
            --repo Halildeu/platform-backend \
            --body-file "${backend_comment}" \
            || echo "::warning::Could not comment on platform-backend#717 with this workflow token; evidence remains in the workflow artifact."

          {
            echo "## AgentPC2 v0.2.13 product update"
            echo ""
            cat "${comment}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload redacted evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentpc2-update-agent-v0213-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Fail workflow on no-go
        if: always()
        run: |
          set -euo pipefail

          exit_code="${{ steps.update.outputs.exit_code }}"
          if [ -z "${exit_code}" ]; then
            echo "::error::update step did not expose exit_code"
            exit 1
          fi

          if [ "${exit_code}" != "0" ]; then
            echo "::error::AgentPC2 v0.2.13 product update did not pass; see issue comment and uploaded evidence."
            exit "${exit_code}"
          fi
