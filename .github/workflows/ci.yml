name: CI — Kustomize Build + Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kustomize-build:
    name: Kustomize Build Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.3.0"

      - name: Build overlays/test
        run: kustomize build kustomize/overlays/test > /tmp/test.yaml
      - name: Build overlays/prod
        run: kustomize build kustomize/overlays/prod > /tmp/prod.yaml
      - name: Build overlays/test/eso
        run: kustomize build kustomize/overlays/test/eso > /tmp/test-eso.yaml
      # overlays/prod/eso: OPS-PREREQ gated — prod Vault AppRole yaratılana kadar
      # role_id UUID placeholder kalır (kustomization.yaml OPS-PREREQ bloğu 1-6 adım).
      # Re-enable prod Vault seed PR'ında: bu step kaldır + placeholder-leak-check'e prod/eso ekle.
      #
      # DAR MUAFİYET (Codex iter-2 refinement): SADECE roleId placeholder'ı serbest;
      # FQDN veya başka herhangi bir OVERLAY_MUST_OVERRIDE sızarsa CI FAIL etmeli.
      - name: Build overlays/prod/eso (dar placeholder muafiyeti — OPS-PREREQ)
        run: |
          set -e
          out=$(kustomize build kustomize/overlays/prod/eso 2>&1)
          # İzin verilen: tek bir satırda "roleId: OVERLAY_MUST_OVERRIDE_ROLE_ID_UUID"
          # Yasak: server FQDN placeholder'ı, ya da başka herhangi OVERLAY_MUST_OVERRIDE
          leaks=$(echo "${out}" | grep "OVERLAY_MUST_OVERRIDE" || true)
          if [[ -z "${leaks}" ]]; then
            echo "ℹ prod/eso roleId gerçek UUID — OPS-PREREQ tamamlanmış gibi; placeholder-leak-check'i re-enable et"
            exit 0
          fi
          # Sadece "roleId:" satırındaki OVERLAY_MUST_OVERRIDE_ROLE_ID_UUID kabul
          disallowed=$(echo "${leaks}" | grep -v "roleId: OVERLAY_MUST_OVERRIDE_ROLE_ID_UUID" || true)
          if [[ -n "${disallowed}" ]]; then
            echo "❌ prod/eso'da izinsiz placeholder leak:"
            echo "${disallowed}"
            exit 1
          fi
          echo "✓ prod/eso yalnız roleId placeholder'ı var (OPS-PREREQ gated, Codex iter-2 dar muafiyet)"
      - name: Build base/monitoring
        run: kustomize build kustomize/base/monitoring > /tmp/monitoring.yaml
      - name: Build base/eso (MUST FAIL — placeholder FQDN)
        run: |
          if kustomize build kustomize/base/eso 2>&1 | grep -q "OVERLAY_MUST_OVERRIDE"; then
            echo "✓ base/eso placeholder doğru (fail-closed, overlay zorlar)"
          else
            echo "❌ base/eso placeholder eksik! W1 drift önleme bozuk"
            exit 1
          fi

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: relaxed
            rules:
              line-length:
                max: 200
                level: warning
              document-start: disable
              truthy:
                check-keys: false
          file_or_dir: "kustomize argocd docs helm-values"

  shell-lint:
    name: Shell Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bootstrap
          # severity: error (warning'lerde SC2034 unused var + SC2294 eval
          # array pattern var — değiştirmeye değmez; error'a çeken real bug'a)
          severity: error
          ignore_paths: ""

  closure-language-check:
    name: No-Closure Language Check (HARD RULE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Grep forbidden closure terms
        run: |
          # CLAUDE.md kural: "kapandı/bitti/gün sonu/başarıyla tamamlandı/pause"
          # PLAN.md tarihsel entry'ler grep dışı (içerik tarih değiştirilmez)
          # Meta dosyalar (kural tanımlayan) da exclude — kural kendisi kelimeyi içerir.
          set +e
          PATTERN='(bugün kapandı|tamam bitti|gün sonu|başarıyla tamamlandı|Seviye [0-9X]+ tamam)'
          FOUND=$(grep -rIE "$PATTERN" --include="*.md" \
            --exclude="PLAN.md" \
            --exclude="CLAUDE.md" \
            --exclude="CONTRIBUTING.md" \
            --exclude="CHANGELOG.md" \
            --exclude="README.md" \
            --exclude="pull_request_template.md" \
            --exclude="dev-repo-handoff-bundle.md" \
            --exclude="session-handoff-*.md" \
            . || true)
          if [[ -n "$FOUND" ]]; then
            echo "❌ Closure language bulundu (HARD RULE ihlal):"
            echo "$FOUND"
            exit 1
          fi
          echo "✓ No closure language (runbook/handoff/meta dışı)"

  placeholder-leak-check:
    name: Placeholder Leak Check (OVERLAY_MUST_OVERRIDE runtime sızmaması)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.3.0"
      - name: Check overlay render clean (Codex PR #1 iter-9 fix)
        run: |
          # Overlay render'da OVERLAY_MUST_OVERRIDE placeholder sızmamalı
          # Base/eso fail-closed placeholder — overlay patch ile gerçek FQDN + role_id
          # NOT: overlays/prod/eso placeholder-leak-check MUAF — prod Vault AppRole
          # henüz yaratılmadı (overlays/prod/eso/kustomization.yaml OPS-PREREQ bloğu).
          # Re-enable: prod Vault seed PR'ında bu listeye "overlays/prod/eso" ekle.
          set -e
          for overlay in overlays/test/eso; do
            out=$(kustomize build kustomize/${overlay})
            if echo "${out}" | grep -q "OVERLAY_MUST_OVERRIDE"; then
              echo "❌ ${overlay} render'da OVERLAY_MUST_OVERRIDE kaldı — patch eksik"
              exit 1
            fi
            echo "✓ ${overlay} placeholder temiz"
          done
          echo "ℹ prod/eso placeholder-leak-check MUAF (OPS-PREREQ gated)"
