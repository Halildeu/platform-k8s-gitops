name: CI — Kustomize Build + Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kustomize-build:
    name: Kustomize Build Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.3.0"

      - name: Build overlays/test
        run: kustomize build kustomize/overlays/test > /tmp/test.yaml
      - name: Build overlays/prod
        run: kustomize build kustomize/overlays/prod > /tmp/prod.yaml
      - name: Build overlays/test/eso
        run: kustomize build kustomize/overlays/test/eso > /tmp/test-eso.yaml
      - name: Build overlays/prod/eso
        run: kustomize build kustomize/overlays/prod/eso > /tmp/prod-eso.yaml
      - name: Build base/monitoring
        run: kustomize build kustomize/base/monitoring > /tmp/monitoring.yaml
      # PR-3A — staged RBAC entrypoint'leri (hiçbir overlay'e bağlı değil;
      # yalnız render sanity — canlıya operator-gated apply ile gider)
      - name: Build base/rbac (break-glass — staged)
        run: kustomize build kustomize/base/rbac > /tmp/rbac-break-glass.yaml
      - name: Build base/rbac/prod-deploy-smoke (PR-3A staged least-privilege)
        run: kustomize build kustomize/base/rbac/prod-deploy-smoke > /tmp/rbac-prod-deploy-smoke.yaml
      - name: Build base/rbac/prod-operator-readonly (PR-3D staged readonly identity)
        run: kustomize build kustomize/base/rbac/prod-operator-readonly > /tmp/rbac-prod-operator-readonly.yaml
      # Faz 22.6 D10-8 — remote-bridge broker isolation. Desired-state, NOT in
      # the Argo root (owner-gated activation). Render sanity + isolation guards
      # (Codex 019ebc51 P2 — machine-enforced, not self-attestation).
      - name: Build base/apps/endpoint-admin-remote-bridge (D10-8 scaffold — staged)
        run: kustomize build kustomize/base/apps/endpoint-admin-remote-bridge > /tmp/eab-bridge-base.yaml
      - name: Build overlays/test/activation/endpoint-admin-remote-bridge (D10-8 activation — staged)
        run: kustomize build kustomize/overlays/test/activation/endpoint-admin-remote-bridge > /tmp/eab-bridge-activation.yaml
      - name: D10-8 broker isolation guards (no part-of=platform; not in Argo root)
        run: |
          # control #1 — the broker must NEVER carry part-of=platform (it would
          # match the broad platform ingress/egress allowlists in base/netpol).
          if grep -q "part-of: platform" /tmp/eab-bridge-base.yaml; then
            echo "❌ broker scaffold render carries app.kubernetes.io/part-of: platform — control #1 broken"; exit 1
          fi
          if grep -q "part-of: platform" /tmp/eab-bridge-activation.yaml; then
            echo "❌ broker activation render carries app.kubernetes.io/part-of: platform — control #1 broken"; exit 1
          fi
          # desired-state boundary — the broker must NOT leak into the synced
          # test Argo root (/tmp/test.yaml built above), else it could auto-roll.
          if grep -q "endpoint-admin-remote-bridge" /tmp/test.yaml; then
            echo "❌ endpoint-admin-remote-bridge leaked into overlays/test render — must stay out of the Argo root"; exit 1
          fi
          # control #11 — the scaffold must ship inert (replicas:0 + enabled false).
          if ! grep -q "REMOTE_BRIDGE_ENABLED: \"false\"" /tmp/eab-bridge-base.yaml; then
            echo "❌ scaffold ConfigMap missing REMOTE_BRIDGE_ENABLED=false — control #11 broken"; exit 1
          fi
          if ! grep -q "replicas: 0" /tmp/eab-bridge-base.yaml; then
            echo "❌ scaffold Deployment is not replicas:0 — control #11 (inert) broken"; exit 1
          fi
          echo "✓ D10-8 broker isolation guards pass (no part-of=platform; not in Argo root; scaffold inert replicas:0/enabled=false)"
      # Faz 17.Z — PR'da blocking: local overlay'ler render sanity (lokal dev drift yakalama)
      - name: Build overlays/local-authn-min (Faz 17.2)
        run: kustomize build kustomize/overlays/local-authn-min > /tmp/local-authn-min.yaml
      - name: Build overlays/local-zanzibar-min (Faz 17.2)
        run: kustomize build kustomize/overlays/local-zanzibar-min > /tmp/local-zanzibar-min.yaml
      - name: Build overlays/local-full (Faz 17.2)
        run: kustomize build kustomize/overlays/local-full > /tmp/local-full.yaml
      - name: Build overlays/local (Faz 17.2 DEPRECATED — legacy render sanity)
        run: kustomize build kustomize/overlays/local > /tmp/local-legacy.yaml
      - name: Build base/eso (MUST FAIL — placeholder FQDN)
        run: |
          if kustomize build kustomize/base/eso 2>&1 | grep -q "OVERLAY_MUST_OVERRIDE"; then
            echo "✓ base/eso placeholder doğru (fail-closed, overlay zorlar)"
          else
            echo "❌ base/eso placeholder eksik! W1 drift önleme bozuk"
            exit 1
          fi

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: relaxed
            rules:
              line-length:
                max: 200
                level: warning
              document-start: disable
              truthy:
                check-keys: false
          file_or_dir: "kustomize argocd docs helm-values"

  shell-lint:
    name: Shell Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bootstrap
          # severity: error (warning'lerde SC2034 unused var + SC2294 eval
          # array pattern var — değiştirmeye değmez; error'a çeken real bug'a)
          severity: error
          ignore_paths: ""

  closure-language-check:
    name: No-Closure Language Check (HARD RULE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Grep forbidden closure terms
        run: |
          # CLAUDE.md kural: "kapandı/bitti/gün sonu/başarıyla tamamlandı/pause"
          # PLAN.md tarihsel entry'ler grep dışı (içerik tarih değiştirilmez)
          # Meta dosyalar (kural tanımlayan) da exclude — kural kendisi kelimeyi içerir.
          set +e
          PATTERN='(bugün kapandı|tamam bitti|gün sonu|başarıyla tamamlandı|Seviye [0-9X]+ tamam)'
          FOUND=$(grep -rIE "$PATTERN" --include="*.md" \
            --exclude="PLAN.md" \
            --exclude="CLAUDE.md" \
            --exclude="CONTRIBUTING.md" \
            --exclude="CHANGELOG.md" \
            --exclude="README.md" \
            --exclude="pull_request_template.md" \
            --exclude="dev-repo-handoff-bundle.md" \
            --exclude="session-handoff-*.md" \
            --exclude-dir="handbook" \
            --exclude-dir="architecture" \
            --exclude-dir="operations" \
            --exclude-dir="templates" \
            --exclude-dir="agent-codex" \
            . || true)
          if [[ -n "$FOUND" ]]; then
            echo "❌ Closure language bulundu (HARD RULE ihlal):"
            echo "$FOUND"
            exit 1
          fi
          echo "✓ No closure language (runbook/handoff/meta dışı)"

  placeholder-leak-check:
    name: Placeholder Leak Check (OVERLAY_MUST_OVERRIDE runtime sızmaması)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.3.0"
      - name: Check overlay render clean (Codex PR #1 iter-9 fix)
        run: |
          # Overlay render'da OVERLAY_MUST_OVERRIDE placeholder sızmamalı
          # Base/eso fail-closed placeholder — overlay patch ile gerçek FQDN
          set -e
          for overlay in overlays/test/eso overlays/prod/eso; do
            out=$(kustomize build kustomize/${overlay})
            if echo "${out}" | grep -q "OVERLAY_MUST_OVERRIDE"; then
              echo "❌ ${overlay} render'da OVERLAY_MUST_OVERRIDE kaldı — patch eksik"
              exit 1
            fi
            echo "✓ ${overlay} placeholder temiz"
          done
