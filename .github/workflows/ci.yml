name: CI — Kustomize Build + Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kustomize-build:
    name: Kustomize Build Sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.3.0"

      - name: Build overlays/test
        run: kustomize build kustomize/overlays/test > /tmp/test.yaml
      - name: Verify rendered backend ArgoCD sync-wave contract
        run: python3 scripts/test/verify-backend-sync-wave-render.py /tmp/test.yaml
      - name: Build overlays/prod
        run: kustomize build kustomize/overlays/prod > /tmp/prod.yaml
      - name: Build overlays/test/eso
        run: kustomize build kustomize/overlays/test/eso > /tmp/test-eso.yaml
      - name: Install rendered ownership verifier dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify notification ExternalSecret has one Argo owner
        run: |
          python3 scripts/test/verify-argocd-resource-single-owner.py \
            --workload-render /tmp/test.yaml \
            --eso-render /tmp/test-eso.yaml \
            --workload-application argocd/applications/platform-test.yaml \
            --eso-application argocd/applications/platform-eso-test.yaml
      - name: Build overlays/prod/eso
        run: kustomize build kustomize/overlays/prod/eso > /tmp/prod-eso.yaml
      - name: Build base/monitoring
        run: kustomize build kustomize/base/monitoring > /tmp/monitoring.yaml
      # PR-3A — staged RBAC entrypoint'leri (hiçbir overlay'e bağlı değil;
      # yalnız render sanity — canlıya operator-gated apply ile gider)
      - name: Build base/rbac (break-glass — staged)
        run: kustomize build kustomize/base/rbac > /tmp/rbac-break-glass.yaml
      - name: Build base/rbac/prod-deploy-smoke (PR-3A staged least-privilege)
        run: kustomize build kustomize/base/rbac/prod-deploy-smoke > /tmp/rbac-prod-deploy-smoke.yaml
      - name: Build base/rbac/prod-operator-readonly (PR-3D staged readonly identity)
        run: kustomize build kustomize/base/rbac/prod-operator-readonly > /tmp/rbac-prod-operator-readonly.yaml
      - name: Build base/endpoint-agent-mtls (Faz 22.5 M2 staged inert)
        run: kustomize build kustomize/base/endpoint-agent-mtls > /tmp/endpoint-agent-mtls.yaml
      - name: Endpoint Agent mTLS canonical host guard
        run: bash scripts/test/endpoint-agent-mtls-hosts.sh
      - name: AgentPC2 first-install bootstrap static guard
        run: bash scripts/test/agentpc2-first-install-bootstrap-static.sh
      - name: AgentPC2 constrained-executor acceptance static guard
        run: bash scripts/test/agentpc2-constrained-executor-acceptance-static.sh
      - name: AgentPC2 UPDATE_AGENT static guard
        run: bash scripts/test/agentpc2-update-agent-static.sh
      - name: AgentPC2 TPM auto-enroll packet static guard
        run: bash scripts/test/agentpc2-tpm-autoenroll-packet-static.sh
      - name: Denetim TPM device-key VIEW_ONLY activation static guard
        run: bash scripts/test/denetim-device-key-view-only-env-patch-static.sh
      - name: Faz 22.6 acceptance package workflows static guard
        run: bash scripts/test/faz22-6-acceptance-package-workflows-static.sh
      - name: platform-test GitOps sync static guard
        run: bash scripts/test/platform-test-gitops-sync-static.sh
      - name: Faz 24 Meeting-AI private gateway static guard
        run: bash scripts/test/faz24-meeting-ai-private-gateway-static.sh
      - name: Faz 24 GPU exact-SHA rollout static guard
        run: bash scripts/test/faz24-gpu-host-exact-sha-rollout-static.sh
      - name: testai frontend desired-state promotion contract
        run: |
          python3 -m unittest \
            tests.automation.test_test_overlay_frontend_image \
            tests.automation.test_frontend_promotion_contract \
            tests.automation.test_frontend_diff_guard \
            -v
      - name: testai backend desired-state promotion contract
        run: |
          python3 -m unittest \
            tests.automation.test_backend_testai_digest_contract \
            tests.automation.test_backend_promotion_contract \
            tests.governance.test_deploy_backend_testai_stability_gate \
            -v
      # Faz 22.6 D10-8 — remote-bridge broker isolation. Desired-state, NOT in
      # the Argo root (owner-gated activation). Render sanity + isolation guards
      # (Codex 019ebc51 P2 — machine-enforced, not self-attestation).
      - name: Build base/apps/endpoint-admin-remote-bridge (D10-8 scaffold — staged)
        run: kustomize build kustomize/base/apps/endpoint-admin-remote-bridge > /tmp/eab-bridge-base.yaml
      - name: Build overlays/test/activation/endpoint-admin-remote-bridge (D10-8 activation — staged)
        run: kustomize build kustomize/overlays/test/activation/endpoint-admin-remote-bridge > /tmp/eab-bridge-activation.yaml
      - name: Build overlays/test/activation/endpoint-admin-remote-bridge-device-key (#548 child — staged)
        run: kustomize build kustomize/overlays/test/activation/endpoint-admin-remote-bridge-device-key > /tmp/eab-bridge-device-key.yaml
      - name: Build overlays/test/activation/endpoint-admin-remote-bridge-device-key-live (#548 live wrapper — staged)
        run: kustomize build kustomize/overlays/test/activation/endpoint-admin-remote-bridge-device-key-live > /tmp/eab-bridge-device-key-live.yaml
      - name: Build overlays/test/activation/endpoint-admin-remote-bridge-viewer (#1580 viewer — staged)
        run: kustomize build kustomize/overlays/test/activation/endpoint-admin-remote-bridge-viewer > /tmp/eab-bridge-viewer.yaml
      - name: D10-8 broker isolation guards (no part-of=platform; not in Argo root)
        run: |
          # control #1 — the broker must NEVER carry part-of=platform (it would
          # match the broad platform ingress/egress allowlists in base/netpol).
          if grep -q "part-of: platform" /tmp/eab-bridge-base.yaml; then
            echo "❌ broker scaffold render carries app.kubernetes.io/part-of: platform — control #1 broken"; exit 1
          fi
          if grep -q "part-of: platform" /tmp/eab-bridge-activation.yaml; then
            echo "❌ broker activation render carries app.kubernetes.io/part-of: platform — control #1 broken"; exit 1
          fi
          # desired-state boundary — the broker must NOT leak into the synced
          # test Argo root (/tmp/test.yaml built above), else it could auto-roll.
          if grep -q "endpoint-admin-remote-bridge" /tmp/test.yaml; then
            echo "❌ endpoint-admin-remote-bridge leaked into overlays/test render — must stay out of the Argo root"; exit 1
          fi
          # control #11 — the scaffold must ship inert (replicas:0 + enabled false).
          if ! grep -q "REMOTE_BRIDGE_ENABLED: \"false\"" /tmp/eab-bridge-base.yaml; then
            echo "❌ scaffold ConfigMap missing REMOTE_BRIDGE_ENABLED=false — control #11 broken"; exit 1
          fi
          if ! grep -q "replicas: 0" /tmp/eab-bridge-base.yaml; then
            echo "❌ scaffold Deployment is not replicas:0 — control #11 (inert) broken"; exit 1
          fi
          echo "✓ D10-8 broker isolation guards pass (no part-of=platform; not in Argo root; scaffold inert replicas:0/enabled=false)"
      - name: "#548 device-key broker guards (REAL verifier; isolated; SNI wrapper)"
        run: |
          set -euo pipefail

          # The strong device-key broker must stay isolated from the broad
          # platform allowlists and out of the synced test Argo root.
          if grep -q "part-of: platform" /tmp/eab-bridge-device-key.yaml; then
            echo "❌ device-key child render carries app.kubernetes.io/part-of: platform"
            exit 1
          fi
          if grep -q "part-of: platform" /tmp/eab-bridge-device-key-live.yaml; then
            echo "❌ device-key live wrapper render carries app.kubernetes.io/part-of: platform"
            exit 1
          fi
          if grep -q "endpoint-admin-remote-bridge-device-key" /tmp/test.yaml; then
            echo "❌ device-key broker leaked into overlays/test render — must stay owner-gated"
            exit 1
          fi

          # #548 must exercise the real hardware/device-key verifier path, not
          # the bounded pilot acceptance path used by the shared broker.
          grep -F 'REMOTE_BRIDGE_DEVICE_TRUST_VERIFIER: DEVICE_KEY_ATTESTATION_REAL' \
            /tmp/eab-bridge-device-key-live.yaml
          grep -F 'REMOTE_BRIDGE_DURESS_PILOT_RISK_ACCEPTED: "false"' \
            /tmp/eab-bridge-device-key-live.yaml
          if grep -q "REMOTE_BRIDGE_BROKER_ENROLLMENT_BACKED_CRYPTO_IDENTITY_PILOT_RISK_ACCEPTED" \
            /tmp/eab-bridge-device-key-live.yaml; then
            echo "❌ device-key broker render contains bounded pilot risk-acceptance flag"
            exit 1
          fi

          grep -F "name: endpoint-admin-remote-bridge-mtls" /tmp/eab-bridge-device-key-live.yaml
          grep -F "host: remote-bridge-mtls.testai.acik.com" /tmp/eab-bridge-device-key-live.yaml
          grep -F "name: endpoint-admin-remote-bridge-device-key" /tmp/eab-bridge-device-key-live.yaml
          grep -F "maxSurge: 0" /tmp/eab-bridge-device-key-live.yaml
          grep -F "maxUnavailable: 1" /tmp/eab-bridge-device-key-live.yaml

          IMG=ghcr.io/halildeu/platform-backend-endpoint-admin-service
          digest_count="$(grep -oE "image: ${IMG}@sha256:[0-9a-f]{64}" \
            /tmp/eab-bridge-device-key-live.yaml | sort -u | wc -l | tr -d ' ')"
          if [ "${digest_count}" != "1" ]; then
            echo "❌ device-key live wrapper must render exactly one immutable endpoint-admin-service digest"
            exit 1
          fi

          echo "✓ #548 device-key broker guards pass (REAL verifier; isolated; owner-gated SNI wrapper)"
      - name: "#1580 VIEW_ONLY viewer exposure guards (ClusterIP-only; owner-gated)"
        run: |
          set -euo pipefail

          # The viewer surface is an owner-gated superset overlay. It must stay
          # isolated from platform-wide NetworkPolicies and out of the synced
          # test Argo root.
          if grep -q "part-of: platform" /tmp/eab-bridge-viewer.yaml; then
            echo "❌ viewer render carries app.kubernetes.io/part-of: platform"
            exit 1
          fi
          if grep -q "endpoint-admin-remote-bridge-viewer" /tmp/test.yaml; then
            echo "❌ viewer overlay leaked into overlays/test render — must stay owner-gated"
            exit 1
          fi

          grep -A1 -F 'name: REMOTE_BRIDGE_ENABLED' /tmp/eab-bridge-viewer.yaml \
            | grep -F 'value: "true"'
          grep -F 'REMOTE_BRIDGE_VIEWER_ENABLED: "true"' /tmp/eab-bridge-viewer.yaml
          grep -F 'REMOTE_BRIDGE_VIEW_ONLY_ALLOWED_FRAME_CONTENT_TYPES: image/png' \
            /tmp/eab-bridge-viewer.yaml
          grep -F 'containerPort: 8096' /tmp/eab-bridge-viewer.yaml

          grep -F 'name: endpoint-admin-remote-bridge-viewer' /tmp/eab-bridge-viewer.yaml
          grep -F 'type: ClusterIP' /tmp/eab-bridge-viewer.yaml
          grep -F 'name: endpoint-admin-remote-bridge-device-key' /tmp/eab-bridge-viewer.yaml
          grep -F 'name: endpoint-admin-remote-bridge-config-device-key' /tmp/eab-bridge-viewer.yaml
          grep -F 'host: remote-bridge-mtls.testai.acik.com' /tmp/eab-bridge-viewer.yaml
          if awk '
              /^---[[:space:]]*$/ { in_viewer_service = 0 }
              /name: endpoint-admin-remote-bridge-viewer/ { in_viewer_service = 1 }
              in_viewer_service && /nodePort:/ { bad = 1 }
              END { exit bad ? 0 : 1 }
            ' /tmp/eab-bridge-viewer.yaml; then
            echo "❌ viewer Service rendered a nodePort; 8096 must stay ClusterIP-only"
            exit 1
          fi
          grep -F 'nodePort: 31945' /tmp/eab-bridge-viewer.yaml

          grep -F 'name: eab-bridge-viewer-allow-ingress-8096-from-api-gateway' \
            /tmp/eab-bridge-viewer.yaml
          grep -F 'name: eab-api-gateway-allow-egress-8096-to-bridge-viewer' \
            /tmp/eab-bridge-viewer.yaml
          grep -F 'app.kubernetes.io/name: api-gateway' /tmp/eab-bridge-viewer.yaml

          echo "✓ #1580 VIEW_ONLY viewer exposure guards pass (ClusterIP-only; owner-gated; route still runtime-patched)"
      # Faz 17.Z — PR'da blocking: local overlay'ler render sanity (lokal dev drift yakalama)
      - name: Build overlays/local-authn-min (Faz 17.2)
        run: kustomize build kustomize/overlays/local-authn-min > /tmp/local-authn-min.yaml
      - name: Build overlays/local-zanzibar-min (Faz 17.2)
        run: kustomize build kustomize/overlays/local-zanzibar-min > /tmp/local-zanzibar-min.yaml
      - name: Build overlays/local-full (Faz 17.2)
        run: kustomize build kustomize/overlays/local-full > /tmp/local-full.yaml
      - name: Build overlays/local (Faz 17.2 DEPRECATED — legacy render sanity)
        run: kustomize build kustomize/overlays/local > /tmp/local-legacy.yaml
      - name: Build base/eso (MUST FAIL — placeholder FQDN)
        run: |
          if kustomize build kustomize/base/eso 2>&1 | grep -q "OVERLAY_MUST_OVERRIDE"; then
            echo "✓ base/eso placeholder doğru (fail-closed, overlay zorlar)"
          else
            echo "❌ base/eso placeholder eksik! W1 drift önleme bozuk"
            exit 1
          fi

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          config_data: |
            extends: relaxed
            rules:
              line-length:
                max: 200
                level: warning
              document-start: disable
              truthy:
                check-keys: false
          file_or_dir: "kustomize argocd docs helm-values"

  shell-lint:
    name: Shell Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bootstrap
          # severity: error (warning'lerde SC2034 unused var + SC2294 eval
          # array pattern var — değiştirmeye değmez; error'a çeken real bug'a)
          severity: error
          ignore_paths: ""

  closure-language-check:
    name: No-Closure Language Check (HARD RULE)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Grep forbidden closure terms
        run: |
          # CLAUDE.md kural: "kapandı/bitti/gün sonu/başarıyla tamamlandı/pause"
          # PLAN.md tarihsel entry'ler grep dışı (içerik tarih değiştirilmez)
          # Meta dosyalar (kural tanımlayan) da exclude — kural kendisi kelimeyi içerir.
          set +e
          PATTERN='(bugün kapandı|tamam bitti|gün sonu|başarıyla tamamlandı|Seviye [0-9X]+ tamam)'
          FOUND=$(grep -rIE "$PATTERN" --include="*.md" \
            --exclude="PLAN.md" \
            --exclude="CLAUDE.md" \
            --exclude="CONTRIBUTING.md" \
            --exclude="CHANGELOG.md" \
            --exclude="README.md" \
            --exclude="pull_request_template.md" \
            --exclude="dev-repo-handoff-bundle.md" \
            --exclude="session-handoff-*.md" \
            --exclude-dir="handbook" \
            --exclude-dir="architecture" \
            --exclude-dir="operations" \
            --exclude-dir="templates" \
            --exclude-dir="agent-codex" \
            . || true)
          if [[ -n "$FOUND" ]]; then
            echo "❌ Closure language bulundu (HARD RULE ihlal):"
            echo "$FOUND"
            exit 1
          fi
          echo "✓ No closure language (runbook/handoff/meta dışı)"

  placeholder-leak-check:
    name: Placeholder Leak Check (OVERLAY_MUST_OVERRIDE runtime sızmaması)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.3.0"
      - name: Check overlay render clean (Codex PR #1 iter-9 fix)
        run: |
          # Overlay render'da OVERLAY_MUST_OVERRIDE placeholder sızmamalı
          # Base/eso fail-closed placeholder — overlay patch ile gerçek FQDN
          set -e
          for overlay in overlays/test/eso overlays/prod/eso; do
            out=$(kustomize build kustomize/${overlay})
            if echo "${out}" | grep -q "OVERLAY_MUST_OVERRIDE"; then
              echo "❌ ${overlay} render'da OVERLAY_MUST_OVERRIDE kaldı — patch eksik"
              exit 1
            fi
            echo "✓ ${overlay} placeholder temiz"
          done
