name: Faz 24 Direct-STT E2E Collect

# Runs the real-recorder Gate 2 path for platform-ai#182 on the self-hosted
# aiserver runner. Boundary: platform-test only; temporary Keycloak user and
# token files are cleaned up by the token chain; uploaded artifacts are
# metadata-only and must not contain tokens, PEM material, raw audio, raw
# transcript text, destination URLs, or raw command output.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public testai base URL"
        required: true
        default: "https://testai.acik.com"
      expected_issuer:
        description: "Expected platform-test issuer URL"
        required: true
        default: "https://testai.acik.com/realms/platform-test"
      keycloak_base_url:
        description: "Runner-local Keycloak token endpoint base URL"
        required: true
        default: "http://127.0.0.1:8082"
      kube_context:
        description: "Kubernetes context for test cluster"
        required: true
        default: "k3d-test"
      namespace:
        description: "Kubernetes namespace"
        required: true
        default: "platform-test"
      deployment:
        description: "audio-gateway deployment name"
        required: true
        default: "audio-gateway"
      redis_container:
        description: "Host Docker container running Redis Streams"
        required: true
        default: "platform-redis-streams-test"
      chunk_file:
        description: "Runner-local privacy-safe raw PCM16 fixture path"
        required: true
        default: "/tmp/sample-tr-cv17-001.pcm"
      audio_format:
        description: "Direct-STT audio format header for the fixture"
        required: true
        type: choice
        options:
          - "PCM16"
        default: "PCM16"
      sample_rate_hz:
        description: "Sample rate header for the fixture"
        required: true
        default: "16000"
      channels:
        description: "Channel count header for the fixture"
        required: true
        default: "1"
      probe_timeout:
        description: "mTLS health probe timeout seconds"
        required: true
        default: "40"

permissions:
  contents: read

concurrency:
  group: faz24-platform-desktop-keycloak-test-mutation
  cancel-in-progress: false

jobs:
  collect:
    name: collect direct-STT e2e evidence
    runs-on: [self-hosted, aiserver, testai-deploy]
    timeout-minutes: 30

    env:
      EVIDENCE_DIR: /tmp/faz24-direct-stt-e2e-collect-${{ github.run_id }}
      DIAG_JSON: /tmp/faz24-direct-stt-e2e-collect-${{ github.run_id }}/faz24-platform-desktop-token-diagnostic.json
      SMOKE_JSON: /tmp/faz24-direct-stt-e2e-collect-${{ github.run_id }}/faz24-external-recorder-smoke.json
      SMOKE_VERIFY_JSON: /tmp/faz24-direct-stt-e2e-collect-${{ github.run_id }}/faz24-external-recorder-smoke.verify.json
      DIRECT_STT_JSON: /tmp/faz24-direct-stt-e2e-collect-${{ github.run_id }}/faz24-direct-stt-e2e.json
      DIRECT_STT_VERIFY_JSON: /tmp/faz24-direct-stt-e2e-collect-${{ github.run_id }}/faz24-direct-stt-e2e.verify.json

    steps:
      - name: Validate dispatch inputs
        env:
          BASE_URL_INPUT: ${{ inputs.base_url }}
          EXPECTED_ISSUER_INPUT: ${{ inputs.expected_issuer }}
          KEYCLOAK_BASE_URL_INPUT: ${{ inputs.keycloak_base_url }}
          KUBE_CONTEXT_INPUT: ${{ inputs.kube_context }}
          NAMESPACE_INPUT: ${{ inputs.namespace }}
          DEPLOYMENT_INPUT: ${{ inputs.deployment }}
          REDIS_CONTAINER_INPUT: ${{ inputs.redis_container }}
          CHUNK_FILE_INPUT: ${{ inputs.chunk_file }}
          AUDIO_FORMAT_INPUT: ${{ inputs.audio_format }}
          SAMPLE_RATE_HZ_INPUT: ${{ inputs.sample_rate_hz }}
          CHANNELS_INPUT: ${{ inputs.channels }}
          PROBE_TIMEOUT_INPUT: ${{ inputs.probe_timeout }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "$value" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be a single line"
                exit 1
                ;;
            esac
          }

          require_http_url() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$'; then
              echo "::error::${name} must be a bounded http(s) URL without credentials, query, or fragment"
              exit 1
            fi
            if printf '%s' "$value" | grep -Eq '(^|/)\.\.(/|$)|@|[?&=#]'; then
              echo "::error::${name} must not contain path escape, credentials, query, or fragment"
              exit 1
            fi
          }

          require_name() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -Eq '^[A-Za-z0-9_.:-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          require_path() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -Eq '^/[A-Za-z0-9._~+/@=-]+$'; then
              echo "::error::${name} must be an absolute bounded path"
              exit 1
            fi
            if printf '%s' "$value" | grep -Eq '(^|/)\.\.(/|$)'; then
              echo "::error::${name} must not contain path traversal"
              exit 1
            fi
          }

          for item in \
            "base_url=${BASE_URL_INPUT}" \
            "expected_issuer=${EXPECTED_ISSUER_INPUT}" \
            "keycloak_base_url=${KEYCLOAK_BASE_URL_INPUT}" \
            "kube_context=${KUBE_CONTEXT_INPUT}" \
            "namespace=${NAMESPACE_INPUT}" \
            "deployment=${DEPLOYMENT_INPUT}" \
            "redis_container=${REDIS_CONTAINER_INPUT}" \
            "chunk_file=${CHUNK_FILE_INPUT}" \
            "audio_format=${AUDIO_FORMAT_INPUT}" \
            "sample_rate_hz=${SAMPLE_RATE_HZ_INPUT}" \
            "channels=${CHANNELS_INPUT}" \
            "probe_timeout=${PROBE_TIMEOUT_INPUT}"; do
            reject_multiline "${item%%=*}" "${item#*=}"
          done

          require_http_url base_url "${BASE_URL_INPUT}"
          require_http_url expected_issuer "${EXPECTED_ISSUER_INPUT}"
          require_http_url keycloak_base_url "${KEYCLOAK_BASE_URL_INPUT}"
          require_name kube_context "${KUBE_CONTEXT_INPUT}"
          require_name namespace "${NAMESPACE_INPUT}"
          require_name deployment "${DEPLOYMENT_INPUT}"
          require_name redis_container "${REDIS_CONTAINER_INPUT}"
          require_path chunk_file "${CHUNK_FILE_INPUT}"
          test "${AUDIO_FORMAT_INPUT}" = "PCM16"
          printf '%s' "${SAMPLE_RATE_HZ_INPUT}" | grep -Eq '^[1-9][0-9]{3,5}$'
          printf '%s' "${CHANNELS_INPUT}" | grep -Eq '^[1-2]$'
          printf '%s' "${PROBE_TIMEOUT_INPUT}" | grep -Eq '^[1-9][0-9]*$'
          test "${PROBE_TIMEOUT_INPUT}" -le 120

          all_inputs="${BASE_URL_INPUT}${EXPECTED_ISSUER_INPUT}${KEYCLOAK_BASE_URL_INPUT}${KUBE_CONTEXT_INPUT}${NAMESPACE_INPUT}${DEPLOYMENT_INPUT}${REDIS_CONTAINER_INPUT}${CHUNK_FILE_INPUT}${AUDIO_FORMAT_INPUT}${SAMPLE_RATE_HZ_INPUT}${CHANNELS_INPUT}${PROBE_TIMEOUT_INPUT}"
          if printf '%s' "${all_inputs}" | grep -Eq -- '-----BEGIN .*PRIVATE KEY-----|Bearer |Authorization:|eyJ[A-Za-z0-9_-]+\.'; then
            echo "::error::inputs must not contain token/private/secret-like material"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare privacy-safe smoke chunk fixture
        id: prepare_chunk
        env:
          CHUNK_FILE_INPUT: ${{ inputs.chunk_file }}
          SAMPLE_RATE_HZ_INPUT: ${{ inputs.sample_rate_hz }}
          CHANNELS_INPUT: ${{ inputs.channels }}
        run: |
          set -euo pipefail

          if [ -r "${CHUNK_FILE_INPUT}" ]; then
            chunk_file="${CHUNK_FILE_INPUT}"
            fixture_source="input"
          else
            chunk_file="${RUNNER_TEMP}/faz24-synthetic-smoke-${GITHUB_RUN_ID}.pcm"
            fixture_source="generated"
            python3 - "${chunk_file}" "${SAMPLE_RATE_HZ_INPUT}" "${CHANNELS_INPUT}" <<'PY'
          import math
          import struct
          import sys

          path = sys.argv[1]
          rate = int(sys.argv[2])
          channels = int(sys.argv[3])
          duration_s = 5.0
          frames = int(rate * duration_s)

          with open(path, "wb") as pcm:
              for idx in range(frames):
                  t = idx / rate
                  # Deterministic synthetic, privacy-safe fixture. It is audio-shaped
                  # enough for transport and format gates, but contains no human speech.
                  envelope = min(1.0, t / 0.08, (duration_s - t) / 0.08)
                  carrier = (
                      0.55 * math.sin(2.0 * math.pi * 220.0 * t)
                      + 0.30 * math.sin(2.0 * math.pi * 440.0 * t)
                      + 0.15 * math.sin(2.0 * math.pi * 660.0 * t)
                  )
                  value = int(max(-1.0, min(1.0, carrier * envelope * 0.25)) * 32767)
                  packed = struct.pack("<h", value)
                  pcm.write(packed * channels)
          PY
          fi

          test -s "${chunk_file}"
          echo "chunk_file=${chunk_file}" >> "${GITHUB_OUTPUT}"
          echo "chunk_fixture_source=${fixture_source}" >> "${GITHUB_OUTPUT}"
          echo "chunk_fixture_source=${fixture_source}"
          echo "chunk_fixture.bytes=$(wc -c < "${chunk_file}" | tr -d ' ')"
          echo "chunk_fixture.sha256=$(sha256sum "${chunk_file}" | awk '{print $1}')"

      - name: Run token and external recorder lifecycle
        id: run_chain
        env:
          OUT_DIR: ${{ env.EVIDENCE_DIR }}
          BASE_URL: ${{ inputs.base_url }}
          EXPECTED_ISSUER: ${{ inputs.expected_issuer }}
          KC_BASE_URL: ${{ inputs.keycloak_base_url }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_TEST_ADMIN_PASSWORD }}
          RUN_EXTERNAL_SMOKE: "1"
          CONFIRM_CONTROLLED_MAPPER_PRUNE: "YES"
          SMOKE_CHUNK_FILE: ${{ steps.prepare_chunk.outputs.chunk_file }}
          SMOKE_AUDIO_FORMAT: ${{ inputs.audio_format }}
          SMOKE_SAMPLE_RATE_HZ: ${{ inputs.sample_rate_hz }}
          SMOKE_CHANNELS: ${{ inputs.channels }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          set +e
          bash scripts/faz24/run-platform-desktop-token-evidence-chain.sh \
            > "${EVIDENCE_DIR}/runner.stdout" \
            2> "${EVIDENCE_DIR}/runner.stderr"
          exit_code="$?"
          set -e
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          grep -E '^(Faz 24 platform-desktop token evidence chain started|realm=|diagnostic=|token_contract=|external_smoke=|external_smoke_verify=|status=)' "${EVIDENCE_DIR}/runner.stdout" || true
          echo "runner.stderr.bytes=$(wc -c < "${EVIDENCE_DIR}/runner.stderr" | tr -d ' ')"
          echo "runner.stderr.sha256=$(sha256sum "${EVIDENCE_DIR}/runner.stderr" | awk '{print $1}')"
          exit 0

      - name: Collect direct-STT e2e metadata
        id: collect_e2e
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          set +e
          python3 scripts/faz24/collect_direct_stt_e2e_evidence.py \
            --external-smoke-file "${SMOKE_JSON}" \
            --output "${DIRECT_STT_JSON}" \
            --context "${{ inputs.kube_context }}" \
            --namespace "${{ inputs.namespace }}" \
            --deployment "${{ inputs.deployment }}" \
            --redis-container "${{ inputs.redis_container }}" \
            --gitops-commit "${GITHUB_SHA}" \
            --probe-timeout "${{ inputs.probe_timeout }}" \
            > "${EVIDENCE_DIR}/collector.stdout" \
            2> "${EVIDENCE_DIR}/collector.stderr"
          exit_code="$?"
          set -e
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          grep -E '^(evidence=|collector=metadata-written$)' "${EVIDENCE_DIR}/collector.stdout" || true
          echo "collector.stderr.bytes=$(wc -c < "${EVIDENCE_DIR}/collector.stderr" | tr -d ' ')"
          echo "collector.stderr.sha256=$(sha256sum "${EVIDENCE_DIR}/collector.stderr" | awk '{print $1}')"
          exit 0

      - name: Verify direct-STT e2e evidence
        id: verify_e2e
        if: always()
        run: |
          set -euo pipefail
          set +e
          if [ ! -s "${DIRECT_STT_JSON}" ]; then
            echo "missing direct-STT evidence JSON" > "${EVIDENCE_DIR}/direct-stt-verifier.stderr"
            echo "exit_code=99" >> "${GITHUB_OUTPUT}"
            cat "${EVIDENCE_DIR}/direct-stt-verifier.stderr"
            exit 0
          fi
          python3 scripts/faz24/verify_direct_stt_e2e_evidence.py \
            "${DIRECT_STT_JSON}" \
            --summary-json "${DIRECT_STT_VERIFY_JSON}" \
            > "${EVIDENCE_DIR}/direct-stt-verifier.stdout" \
            2> "${EVIDENCE_DIR}/direct-stt-verifier.stderr"
          exit_code="$?"
          set -e
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          sed -n '1,180p' "${EVIDENCE_DIR}/direct-stt-verifier.stdout" 2>/dev/null || true
          sed -n '1,180p' "${EVIDENCE_DIR}/direct-stt-verifier.stderr" 2>/dev/null || true
          exit 0

      - name: Verify artifact excludes private material
        id: secret_scan
        if: always()
        run: |
          set -euo pipefail

          test -d "${EVIDENCE_DIR}"
          test -s "${DIAG_JSON}"

          if grep -R -a -E \
            -e '-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----' \
            -e '-----END (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----' \
            -e 'Bearer ' \
            -e 'Authorization:' \
            -e 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.' \
            -e '-----BEGIN CERTIFICATE-----' \
            -e 'data:audio/[A-Za-z0-9.+-]+;base64,' \
            -- \
            "${EVIDENCE_DIR}"; then
            echo "::error::evidence artifact contains forbidden private/secret/raw media material"
            exit 1
          fi

          if grep -R -a -E \
            -e '"(access_token|refresh_token)"[[:space:]]*:' \
            -e '"(authorization|bearer|jwt|api_key|private_key)"[[:space:]]*:' \
            -e '"(client_secret|password|secret)"[[:space:]]*:' \
            -e '"(raw_audio|audio_bytes|audio_base64|transcript_text|textDraft)"[[:space:]]*:' \
            -e '"(raw_request|raw_response|cookie|command_output)"[[:space:]]*:' \
            -- \
            "${EVIDENCE_DIR}"; then
            echo "::error::evidence artifact contains forbidden key names"
            exit 1
          fi

      - name: Write workflow summary
        if: always()
        env:
          CHAIN_EXIT_CODE: ${{ steps.run_chain.outputs.exit_code }}
          COLLECT_EXIT_CODE: ${{ steps.collect_e2e.outputs.exit_code }}
          VERIFY_EXIT_CODE: ${{ steps.verify_e2e.outputs.exit_code }}
          CHUNK_FIXTURE_SOURCE: ${{ steps.prepare_chunk.outputs.chunk_fixture_source }}
        run: |
          set -euo pipefail
          direct_status="missing"
          direct_failures="missing"
          if [ -s "${DIRECT_STT_JSON}" ]; then
            direct_status="$(jq -r '.status // "missing"' "${DIRECT_STT_JSON}")"
            direct_failures="$(jq -r '(.failures // []) | join(",")' "${DIRECT_STT_JSON}")"
          fi
          {
            echo "## Faz 24 direct-STT e2e collect"
            echo
            echo "- Runner: self-hosted aiserver"
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-direct-stt-e2e-collect-${{ github.run_id }}\`"
            echo "- Token/external chain exit code: \`${CHAIN_EXIT_CODE:-missing}\`"
            echo "- Collector exit code: \`${COLLECT_EXIT_CODE:-missing}\`"
            echo "- E2E verifier exit code: \`${VERIFY_EXIT_CODE:-missing}\`"
            echo "- Chunk fixture source: \`${CHUNK_FIXTURE_SOURCE:-missing}\`"
            echo "- Direct-STT evidence status: \`${direct_status}\`"
            echo "- Direct-STT failures: \`${direct_failures:-none}\`"
            echo
            echo "Boundary: platform-test metadata-only Gate 2 evidence collection. The workflow uses a privacy-safe runner-local fixture, uploads only hashes/ids/status/timing metadata, and does not claim production readiness, desktop mic-loopback, or real confidential meeting audio."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload direct-STT e2e artifact
        if: always() && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: faz24-direct-stt-e2e-collect-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local evidence directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"

      - name: Fail workflow when e2e evidence is not accepted
        if: always()
        env:
          CHAIN_EXIT_CODE: ${{ steps.run_chain.outputs.exit_code }}
          COLLECT_EXIT_CODE: ${{ steps.collect_e2e.outputs.exit_code }}
          VERIFY_EXIT_CODE: ${{ steps.verify_e2e.outputs.exit_code }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
        run: |
          set -euo pipefail
          if [ "${SECRET_SCAN_OUTCOME}" != "success" ]; then
            echo "::error::direct-STT e2e artifact secret scan did not pass"
            exit 1
          fi
          if [ "${CHAIN_EXIT_CODE:-}" != "0" ]; then
            echo "::error::token/external recorder chain was not accepted"
            exit "${CHAIN_EXIT_CODE:-1}"
          fi
          if [ "${COLLECT_EXIT_CODE:-}" != "0" ]; then
            echo "::error::direct-STT e2e collector did not produce accepted evidence"
            exit "${COLLECT_EXIT_CODE:-1}"
          fi
          if [ "${VERIFY_EXIT_CODE:-}" != "0" ]; then
            echo "::error::direct-STT e2e verifier rejected evidence"
            exit "${VERIFY_EXIT_CODE:-1}"
          fi
