name: Faz 24 I3 Denetim SSH Authorize Evidence Ingest

# Validates metadata-only evidence produced on Denetim PC after running the
# public-key authorization package. It does not connect to Denetim PC and does
# not run the I3 acceptance workflow by itself.

on:
  workflow_dispatch:
    inputs:
      evidence_json_base64:
        description: "Base64 of denetim-i3-ssh-authorize-evidence.json"
        required: true
      expected_target_user:
        description: "Expected Denetim local user"
        required: true
        default: "svc-denetim-agent"
      expected_public_key_fingerprint:
        description: "Expected runner public key fingerprint"
        required: true
        default: "SHA256:4hWKcV0D3yrRfW4srj0mQJb+297J+RnS0HuoR0D6t1Y"
      expected_public_key_line_sha256:
        description: "Expected runner public key line SHA256"
        required: true
        default: "83f4788c09f9d7e68af113e9680c4a996f95a66c230d6240780ace47734844ff"
      expected_public_key_blob_sha256:
        description: "Expected runner public key blob SHA256"
        required: true
        default: "e2158a715d03df2ad17d6e2cae3d264096fedbdec9f919d2d07ba84740fab756"

permissions:
  contents: read

concurrency:
  group: faz24-i3-denetim-ssh-authorize-evidence-ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: verify Denetim authorization evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EVIDENCE_DIR: /tmp/faz24-i3-denetim-ssh-authorize-evidence-${{ github.run_id }}
      EVIDENCE_JSON: /tmp/faz24-i3-denetim-ssh-authorize-evidence-${{ github.run_id }}/denetim-i3-ssh-authorize-evidence.json
      SUMMARY_JSON: /tmp/faz24-i3-denetim-ssh-authorize-evidence-${{ github.run_id }}/verification-summary.json

    steps:
      - name: Validate dispatch inputs
        env:
          EVIDENCE_JSON_BASE64: ${{ inputs.evidence_json_base64 }}
          EXPECTED_TARGET_USER: ${{ inputs.expected_target_user }}
          EXPECTED_PUBLIC_KEY_FINGERPRINT: ${{ inputs.expected_public_key_fingerprint }}
          EXPECTED_PUBLIC_KEY_LINE_SHA256: ${{ inputs.expected_public_key_line_sha256 }}
          EXPECTED_PUBLIC_KEY_BLOB_SHA256: ${{ inputs.expected_public_key_blob_sha256 }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "$value" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be a single line"
                exit 1
                ;;
            esac
          }

          reject_multiline evidence_json_base64 "${EVIDENCE_JSON_BASE64}"
          reject_multiline expected_target_user "${EXPECTED_TARGET_USER}"
          reject_multiline expected_public_key_fingerprint "${EXPECTED_PUBLIC_KEY_FINGERPRINT}"
          reject_multiline expected_public_key_line_sha256 "${EXPECTED_PUBLIC_KEY_LINE_SHA256}"
          reject_multiline expected_public_key_blob_sha256 "${EXPECTED_PUBLIC_KEY_BLOB_SHA256}"

          if [ "${#EVIDENCE_JSON_BASE64}" -gt 200000 ]; then
            echo "::error::evidence_json_base64 is too large"
            exit 1
          fi

          if ! printf '%s' "${EVIDENCE_JSON_BASE64}" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            echo "::error::evidence_json_base64 must be plain base64"
            exit 1
          fi
          if ! printf '%s' "${EXPECTED_TARGET_USER}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::expected_target_user contains unsupported characters"
            exit 1
          fi
          if ! printf '%s' "${EXPECTED_PUBLIC_KEY_FINGERPRINT}" | grep -Eq '^SHA256:[A-Za-z0-9+/]+={0,2}$'; then
            echo "::error::expected_public_key_fingerprint must be an OpenSSH SHA256 fingerprint"
            exit 1
          fi
          if ! printf '%s' "${EXPECTED_PUBLIC_KEY_LINE_SHA256}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::expected_public_key_line_sha256 must be 64 lowercase hex chars"
            exit 1
          fi
          if ! printf '%s' "${EXPECTED_PUBLIC_KEY_BLOB_SHA256}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::expected_public_key_blob_sha256 must be 64 lowercase hex chars"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Decode evidence JSON
        env:
          EVIDENCE_JSON_BASE64: ${{ inputs.evidence_json_base64 }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          printf '%s' "${EVIDENCE_JSON_BASE64}" | base64 -d > "${EVIDENCE_JSON}"
          python3 -m json.tool "${EVIDENCE_JSON}" > "${EVIDENCE_JSON}.pretty"
          mv "${EVIDENCE_JSON}.pretty" "${EVIDENCE_JSON}"

      - name: Verify Denetim authorization evidence
        id: verify
        continue-on-error: true
        env:
          EXPECTED_TARGET_USER: ${{ inputs.expected_target_user }}
          EXPECTED_PUBLIC_KEY_FINGERPRINT: ${{ inputs.expected_public_key_fingerprint }}
          EXPECTED_PUBLIC_KEY_LINE_SHA256: ${{ inputs.expected_public_key_line_sha256 }}
          EXPECTED_PUBLIC_KEY_BLOB_SHA256: ${{ inputs.expected_public_key_blob_sha256 }}
        run: |
          set +e
          python3 scripts/faz24/verify-i3-denetim-ssh-authorize-evidence.py \
            "${EVIDENCE_JSON}" \
            --expected-target-user "${EXPECTED_TARGET_USER}" \
            --expected-public-key-fingerprint "${EXPECTED_PUBLIC_KEY_FINGERPRINT}" \
            --expected-public-key-line-sha256 "${EXPECTED_PUBLIC_KEY_LINE_SHA256}" \
            --expected-public-key-blob-sha256 "${EXPECTED_PUBLIC_KEY_BLOB_SHA256}" \
            --summary-json "${SUMMARY_JSON}" \
            > "${EVIDENCE_DIR}/verifier.stdout" \
            2> "${EVIDENCE_DIR}/verifier.stderr"
          exit_code="$?"
          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          cat "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
          cat "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
          exit 0

      - name: Verify artifact excludes private material
        if: always()
        id: verify_artifact
        run: |
          set -euo pipefail
          if grep -R -E -- '-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----|-----END (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----|Bearer |eyJ[A-Za-z0-9_-]+\.' "${EVIDENCE_DIR}"; then
            echo "::error::evidence artifact contains forbidden private/secret-like material"
            exit 1
          fi

      - name: Write workflow summary
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 I3 Denetim SSH authorize evidence ingest"
            echo
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-i3-denetim-ssh-authorize-evidence-${{ github.run_id }}\`"
            echo "- Verifier exit code: \`${VERIFY_EXIT_CODE:-missing}\`"
            echo
            echo "Boundary: metadata-only evidence validation. This workflow does not connect to Denetim PC, does not change host config, and does not make #1864 accepted. A passing ingest only unlocks the next I3 evidence rerun."
            echo
            echo '```text'
            sed -n '1,160p' "${EVIDENCE_DIR}/verifier.stdout" 2>/dev/null || true
            sed -n '1,160p' "${EVIDENCE_DIR}/verifier.stderr" 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence ingest artifact
        if: always() && steps.verify_artifact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: faz24-i3-denetim-ssh-authorize-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local evidence directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"

      - name: Fail workflow when evidence is rejected
        if: always()
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ -z "${VERIFY_EXIT_CODE}" ]; then
            echo "::error::evidence verifier did not expose an exit code"
            exit 1
          fi
          if [ "${VERIFY_EXIT_CODE}" != "0" ]; then
            echo "::error::Denetim authorization evidence was rejected"
            exit "${VERIFY_EXIT_CODE}"
          fi
