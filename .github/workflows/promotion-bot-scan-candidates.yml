name: Promotion Bot — scheduled prod-candidate scan (Codex Sprint B B5)

# Daily scheduled run of scripts/promotion/scan-promotion-candidates.sh.
# Walks release-candidates/<repo>/<sha>.json entries, finds those that are
# verified-in-test but NOT yet promoted-to-prod, and opens DRAFT prod-candidate
# PRs for operator review.
#
# Schedule: Pazartesi-Cuma 08:00 UTC (covers Türkiye business hours start).
# workflow_dispatch: also manual trigger for ad-hoc scans.
#
# This is the central B-side automation: combines B1 primitives (scan script)
# with scheduled cadence + GitHub App credential context.

on:
  schedule:
    # Mon-Fri 08:00 UTC — operator review window opens around this time
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      repo:
        description: 'Optional repo filter (platform-backend or platform-web; empty = all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry-run mode (validate only, no PR creation)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # bot needs to push branch with prod overlay digest update
  pull-requests: write  # bot needs to open DRAFT PR

jobs:
  scan-candidates:
    name: Scan ledger entries + open prod-candidate PRs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # #842 Part 2 — promotion-bot opens auto-promotion/ PRs. With the default
      # GITHUB_TOKEN those PRs do NOT trigger the required cross-ai-audit check
      # (GitHub recursion guard), so the scan is opened with a GitHub App
      # installation token (the same platform-automation[bot] App as the
      # deploy-backend-testai.yml test-overlay sync — #827 PR-B).
      #
      # secrets.* is unavailable in job/step `if:` — pass it via `env:` and
      # branch in the preflight. Skip is explicit (::notice::), never silent:
      # the scan stays operator-disabled until the App is installed.
      - name: Preflight — automation App credentials present?
        id: preflight
        env:
          APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ID:-}" ] && [ -n "${APP_PRIVATE_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✓ AUTOMATION_APP_* present — promotion-bot scan active"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=promotion-bot inactive::AUTOMATION_APP_ID / AUTOMATION_APP_PRIVATE_KEY repo secrets absent or incomplete — the scheduled prod-candidate scan is source-ready but operator-disabled. Setup: docs/operations/RUNBOOKS/RB-automation-overlay-sync.md"
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.preflight.outputs.enabled == 'true'
        run: python3 -m pip install --quiet jsonschema PyYAML

      - name: Configure git
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          git config user.name "platform-automation[bot]"
          git config user.email "platform-automation[bot]@users.noreply.github.com"

      - name: Run scan-promotion-candidates
        if: steps.preflight.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPO: ${{ github.repository }}
          PROMOTION_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          chmod +x scripts/promotion/scan-promotion-candidates.sh
          if [ -n "${{ inputs.repo }}" ]; then
            bash scripts/promotion/scan-promotion-candidates.sh "${{ inputs.repo }}"
          else
            bash scripts/promotion/scan-promotion-candidates.sh
          fi

      - name: Summary annotation
        if: always()
        run: |
          if [ "${{ steps.preflight.outputs.enabled }}" != "true" ]; then
            echo "::notice title=promotion-bot inactive::Scan skipped — AUTOMATION_APP_* repo secrets absent (operator-disabled). Setup: docs/operations/RUNBOOKS/RB-automation-overlay-sync.md"
          else
            echo "::notice title=Promotion bot scan complete::Scheduled scan finished. Check this run's log for opened DRAFT PRs (auto-promotion). Operator review needed before merge."
          fi
