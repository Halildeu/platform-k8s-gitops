name: Runtime PR Auto-close Guard

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - main
  release:
    types:
      - published
      - edited

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: forbidden-close-keywords-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  forbidden-close-keywords:
    name: Forbidden close keyword scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base ref (trusted script, not PR head)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Fetch PR commit messages (paginated, read-only)
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" \
            --paginate --jq '.[] | {sha:.sha,message:.commit.message}' > /tmp/pr-commits.ndjson

      - name: Scan event metadata and commit messages
        shell: bash
        run: |
          extra_args=()
          if [ -s /tmp/pr-commits.ndjson ]; then
            extra_args+=(--commit-messages-file /tmp/pr-commits.ndjson)
          fi
          node scripts/ci/check-forbidden-close-keywords.mjs \
            --event-path "$GITHUB_EVENT_PATH" \
            "${extra_args[@]}"

      - name: Run regression tests
        run: |
          node tests/ci/test-forbidden-close-keywords.mjs
