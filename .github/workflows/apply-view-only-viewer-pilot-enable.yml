name: "Apply #2373 VIEW_ONLY viewer product pilot surface"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - apply
          - rollback
      confirm:
        description: "Required literal per action: DRY_RUN_VIEW_ONLY_VIEWER_PILOT_ENABLE, APPLY_VIEW_ONLY_VIEWER_PILOT_ENABLE, or ROLLBACK_VIEW_ONLY_VIEWER_PILOT_ENABLE"
        required: true
      pilot_ttl_minutes:
        description: "For apply: bounded test-only viewer exposure TTL in minutes (5-120)"
        required: false
        default: "10"

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  # Shares the remote-bridge activation group: broker/device-key/viewer overlays
  # all mutate the same isolated broker Deployment and must not race.
  group: endpoint-admin-remote-bridge-activation
  cancel-in-progress: false

env:
  K8S_CONTEXT: k3d-test
  K8S_NAMESPACE: platform-test
  BRIDGE_DEPLOYMENT: endpoint-admin-remote-bridge-device-key
  BRIDGE_CONFIGMAP: endpoint-admin-remote-bridge-config-device-key
  GATEWAY_DEPLOYMENT: api-gateway
  GATEWAY_CONFIGMAP: api-gateway-config
  GATEWAY_ROUTE_PREFIX: SPRING_CLOUD_GATEWAY_ROUTES_28_
  VIEWER_OVERLAY: kustomize/overlays/test/activation/endpoint-admin-remote-bridge-viewer
  BROKER_ONLY_OVERLAY: kustomize/overlays/test/activation/endpoint-admin-remote-bridge-device-key-live
  TEST_ROOT_OVERLAY: kustomize/overlays/test
  WATCHDOG_TEMPLATE: scripts/faz22-remote-ops/view-only-viewer-pilot-watchdog.template.yaml

jobs:
  authorize-live-apply:
    name: Verify owner/AI-advisory bounded pilot authorization
    if: inputs.action == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: faz22-view-only-pilot
      url: https://github.com/Halildeu/platform-k8s-gitops/issues/2373
    outputs:
      authorization_sha256: ${{ steps.authorization.outputs.authorization_sha256 }}
      authorization_expires_epoch: ${{ steps.authorization.outputs.authorization_expires_epoch }}

    steps:
      - name: Checkout canonical owner policy and authorization builder
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify owner directive, advisory provenance and protected authorization
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
          PILOT_OPERATOR_SHA256: ${{ secrets.VIEW_ONLY_PILOT_OPERATOR_SHA256 }}
          PILOT_DEVICE_SHA256: ${{ secrets.VIEW_ONLY_PILOT_DEVICE_SHA256 }}
          PILOT_AUTHORIZATION_EXPIRES_AT: ${{ secrets.VIEW_ONLY_PILOT_AUTHORIZATION_EXPIRES_AT }}
        run: |
          set -euo pipefail
          policy=config/faz22-6-view-only-pilot-owner-policy.v1.json
          revocations=config/faz22-6-view-only-pilot-authorization-revocations.v1.json
          test -s "$policy"
          test -s "$revocations"
          for name in PILOT_OPERATOR_SHA256 PILOT_DEVICE_SHA256; do
            value="${!name:-}"
            printf '%s' "$value" | grep -Eq '^sha256:[a-f0-9]{64}$' || {
              echo "::error::protected environment secret $name is missing or invalid"
              exit 1
            }
          done
          [ "$PILOT_OPERATOR_SHA256" != "$PILOT_DEVICE_SHA256" ] || {
            echo "::error::operator and device authorization hashes must be distinct"
            exit 1
          }
          printf '%s' "${PILOT_AUTHORIZATION_EXPIRES_AT:-}" \
            | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' || {
              echo "::error::protected authorization expiry must be RFC3339 UTC"
              exit 1
            }
          [ "$(date -u -d "$PILOT_AUTHORIZATION_EXPIRES_AT" +%s)" -gt "$(date -u +%s)" ] || {
            echo "::error::protected pilot authorization is expired"
            exit 1
          }

          out="$RUNNER_TEMP/faz22-view-only-pilot-authorization"
          mkdir -p "$out"
          owner_comment_id="$(jq -er '.ownerDirective.commentId' "$policy")"
          advisory_comment_id="$(jq -er '.aiAdvisory.commentId' "$policy")"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$owner_comment_id" > "$out/owner-comment.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$advisory_comment_id" > "$out/advisory-comment.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/2374" > "$out/legal-issue.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/faz22-view-only-pilot" > "$out/environment.json"
          issued_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/faz22-remote-ops/build-view-only-pilot-owner-authorization.py \
            --policy "$policy" \
            --owner-comment "$out/owner-comment.json" \
            --advisory-comment "$out/advisory-comment.json" \
            --legal-issue "$out/legal-issue.json" \
            --environment "$out/environment.json" \
            --revocations "$revocations" \
            --operator-sha256 "$PILOT_OPERATOR_SHA256" \
            --device-sha256 "$PILOT_DEVICE_SHA256" \
            --issued-at "$issued_at" \
            --expires-at "$PILOT_AUTHORIZATION_EXPIRES_AT" \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$GITHUB_SHA" \
            --triggering-actor "$GITHUB_ACTOR" \
            --output "$out/protected-authorization.json"
          python3 scripts/faz22-remote-ops/verify-view-only-pilot-authorization-receipt.py \
            --receipt "$out/protected-authorization.json" \
            --policy "$policy" \
            --revocations "$revocations" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$GITHUB_SHA"
          authorization_sha256="sha256:$(sha256sum "$out/protected-authorization.json" | awk '{print $1}')"
          printf 'authorization_sha256=%s\n' "$authorization_sha256" >> "$GITHUB_OUTPUT"
          printf 'authorization_expires_epoch=%s\n' \
            "$(date -u -d "$PILOT_AUTHORIZATION_EXPIRES_AT" +%s)" >> "$GITHUB_OUTPUT"
          (cd "$out" && sha256sum protected-authorization.json > SHA256SUMS)
          (cd "$out" && sha256sum -c SHA256SUMS)
          rm -f "$out/owner-comment.json" "$out/advisory-comment.json" \
            "$out/legal-issue.json" "$out/environment.json"

      - name: Upload protected authorization receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: faz22-view-only-pilot-protected-authorization-${{ github.run_id }}
          path: ${{ runner.temp }}/faz22-view-only-pilot-authorization/
          if-no-files-found: error
          retention-days: 30

  viewer-pilot-surface:
    name: "Apply or rollback owner-gated #2373 VIEW_ONLY viewer product pilot surface"
    needs: [authorize-live-apply]
    if: always() && (inputs.action != 'apply' || needs.authorize-live-apply.result == 'success')
    runs-on: [self-hosted, staging-sw, testai-deploy]
    timeout-minutes: 20

    steps:
      - name: Validate dispatch inputs
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          PILOT_TTL_MINUTES: ${{ inputs.pilot_ttl_minutes }}
          AUTHORIZATION_SHA256: ${{ needs.authorize-live-apply.outputs.authorization_sha256 }}
        run: |
          set -euo pipefail

          case "$ACTION" in
            dry_run)
              expected_confirm="DRY_RUN_VIEW_ONLY_VIEWER_PILOT_ENABLE"
              ;;
            apply)
              expected_confirm="APPLY_VIEW_ONLY_VIEWER_PILOT_ENABLE"
              ;;
            rollback)
              expected_confirm="ROLLBACK_VIEW_ONLY_VIEWER_PILOT_ENABLE"
              ;;
            *)
              echo "::error::unsupported action: $ACTION"
              exit 1
              ;;
          esac

          if [ "$CONFIRM" != "${expected_confirm}" ]; then
            echo "::error::confirm input must be ${expected_confirm}"
            exit 1
          fi

          if [ "$ACTION" = "apply" ]; then
            printf '%s' "$PILOT_TTL_MINUTES" | grep -Eq '^[0-9]+$' || {
              echo "::error::pilot_ttl_minutes must be an integer"
              exit 1
            }
            [ "$PILOT_TTL_MINUTES" -ge 5 ] && [ "$PILOT_TTL_MINUTES" -le 120 ] || {
              echo "::error::pilot_ttl_minutes must be between 5 and 120"
              exit 1
            }
            printf '%s' "$AUTHORIZATION_SHA256" \
              | grep -Eq '^sha256:[a-f0-9]{64}$' || {
                echo "::error::protected authorization receipt is absent"
                exit 1
              }
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Reconcile least-privilege VIEW_ONLY audit DB role
        if: inputs.action == 'apply'
        env:
          VIEWER_AUDIT_DB_ROLE_CONFIRM: RECONCILE_FAZ22_6_VIEWER_AUDIT_DB_ROLE
        run: bash scripts/faz22-remote-ops/reconcile-viewer-audit-db-role.sh apply

      - name: Render and guard viewer exposure overlay
        if: inputs.action != 'rollback'
        run: |
          set -euo pipefail

          kubectl kustomize "${VIEWER_OVERLAY}" > /tmp/endpoint-admin-remote-bridge-viewer.yaml
          kubectl create --dry-run=client --validate=false \
            -f /tmp/endpoint-admin-remote-bridge-viewer.yaml \
            -o json \
            | jq -s '{apiVersion:"v1", kind:"List", items:[.[]
                | if (.kind == "List" and (.items | type) == "array")
                  then .items[]
                  else .
                  end]}' \
            > /tmp/endpoint-admin-remote-bridge-viewer.json

          jq -e --arg deploy "$BRIDGE_DEPLOYMENT" --arg config "$BRIDGE_CONFIGMAP" '
            ([.items[] | select(.kind == "Deployment" and .metadata.name == $deploy)] | length) == 1
            and ([.items[] | select(.kind == "Deployment" and .metadata.name == "endpoint-admin-remote-bridge")] | length) == 0
            and ([.items[] | select(.kind == "ConfigMap" and .metadata.name == $config
              and .data.REMOTE_BRIDGE_VIEWER_ENABLED == "true"
              and .data.REMOTE_BRIDGE_VIEW_ONLY_ALLOWED_FRAME_CONTENT_TYPES == "image/png"
              and .data.REMOTE_BRIDGE_BROKER_VIEW_ONLY_PERMIT_TTL_MILLIS == "600000")] | length) == 1
            and ([.items[] | select(.kind == "Service" and .metadata.name == "endpoint-admin-remote-bridge-viewer"
              and .spec.type == "ClusterIP"
              and .spec.selector["app.kubernetes.io/name"] == $deploy
              and ([.spec.ports[] | select(.port == 8096 and .targetPort == "http")] | length) == 1)] | length) == 1
            and ([.items[] | select(.kind == "Ingress" and .metadata.name == "endpoint-admin-remote-bridge-mtls")
              | .spec.rules[].http.paths[].backend.service.name] | unique) == [$deploy]
          ' /tmp/endpoint-admin-remote-bridge-viewer.json >/dev/null

          grep -A1 -F 'name: REMOTE_BRIDGE_ENABLED' /tmp/endpoint-admin-remote-bridge-viewer.yaml \
            | grep -F 'value: "true"'
          grep -F 'REMOTE_BRIDGE_VIEWER_ENABLED: "true"' /tmp/endpoint-admin-remote-bridge-viewer.yaml
          grep -F 'REMOTE_BRIDGE_VIEW_ONLY_ALLOWED_FRAME_CONTENT_TYPES: image/png' \
            /tmp/endpoint-admin-remote-bridge-viewer.yaml
          grep -F 'REMOTE_BRIDGE_CONSENT_PROMPT_TTL_MILLIS: "240000"' \
            /tmp/endpoint-admin-remote-bridge-viewer.yaml
          grep -F 'REMOTE_BRIDGE_BROKER_PERMIT_TTL_MILLIS: "60000"' \
            /tmp/endpoint-admin-remote-bridge-viewer.yaml
          grep -F 'REMOTE_BRIDGE_BROKER_VIEW_ONLY_PERMIT_TTL_MILLIS: "600000"' \
            /tmp/endpoint-admin-remote-bridge-viewer.yaml

          grep -F 'name: endpoint-admin-remote-bridge-viewer' \
            /tmp/endpoint-admin-remote-bridge-viewer.yaml
          grep -F 'type: ClusterIP' /tmp/endpoint-admin-remote-bridge-viewer.yaml
          if awk '
              /^---[[:space:]]*$/ { in_viewer_service = 0 }
              /name: endpoint-admin-remote-bridge-viewer/ { in_viewer_service = 1 }
              in_viewer_service && /nodePort:/ { bad = 1 }
              END { exit bad ? 0 : 1 }
            ' \
            /tmp/endpoint-admin-remote-bridge-viewer.yaml; then
            echo "::error::viewer exposure rendered a nodePort; 8096 must remain ClusterIP-only"
            exit 1
          fi

          grep -F 'containerPort: 8096' /tmp/endpoint-admin-remote-bridge-viewer.yaml
          grep -F 'name: eab-bridge-viewer-allow-ingress-8096-from-api-gateway' \
            /tmp/endpoint-admin-remote-bridge-viewer.yaml
          grep -F 'name: eab-api-gateway-allow-egress-8096-to-bridge-viewer' \
            /tmp/endpoint-admin-remote-bridge-viewer.yaml
          grep -F 'app.kubernetes.io/name: api-gateway' /tmp/endpoint-admin-remote-bridge-viewer.yaml

          kubectl kustomize "${TEST_ROOT_OVERLAY}" > /tmp/platform-test-root.yaml
          if grep -q 'endpoint-admin-remote-bridge-viewer' /tmp/platform-test-root.yaml; then
            echo "::error::viewer overlay leaked into the synced test Argo root"
            exit 1
          fi
          if grep -q 'REMOTE_BRIDGE_CONSENT_PROMPT_TTL_MILLIS' /tmp/platform-test-root.yaml; then
            echo "::error::attended consent pilot TTL leaked into the synced test Argo root"
            exit 1
          fi
          if grep -q 'REMOTE_BRIDGE_BROKER_VIEW_ONLY_PERMIT_TTL_MILLIS' /tmp/platform-test-root.yaml; then
            echo "::error::VIEW_ONLY permit TTL leaked into the synced test Argo root"
            exit 1
          fi

          {
            echo "## #2373 VIEW_ONLY viewer product pilot surface render"
            echo ""
            echo "- action: \`${{ inputs.action }}\`"
            echo "- context: \`${K8S_CONTEXT}\`"
            echo "- namespace: \`${K8S_NAMESPACE}\`"
            echo "- viewer overlay: \`${VIEWER_OVERLAY}\`"
            echo "- viewer service: \`endpoint-admin-remote-bridge-viewer:8096\`"
            echo "- service type: \`ClusterIP\`"
            echo "- route: \`/api/v1/endpoint-admin/remote-access/sessions/*/view\`"
            echo "- attended consent prompt TTL: \`240000ms\` (test-only)"
            echo "- constrained PTY permit TTL: \`60000ms\` (unchanged)"
            echo "- VIEW_ONLY permit TTL: \`600000ms\` (owner-gated test overlay)"
            echo "- Argo root exposure: \`absent\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Server-side dry-run viewer exposure overlay
        if: inputs.action != 'rollback'
        run: |
          set -euo pipefail

          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            apply --dry-run=server -f /tmp/endpoint-admin-remote-bridge-viewer.yaml

      - name: Install absolute-expiry fail-closed watchdog
        if: inputs.action == 'apply'
        env:
          PILOT_TTL_MINUTES: ${{ inputs.pilot_ttl_minutes }}
          AUTHORIZATION_SHA256: ${{ needs.authorize-live-apply.outputs.authorization_sha256 }}
          AUTHORIZATION_EXPIRES_EPOCH: ${{ needs.authorize-live-apply.outputs.authorization_expires_epoch }}
          VIEWER_APPLY_ATTEMPT_MARKER: ${{ runner.temp }}/faz22-view-only-pilot-overlay-attempted
        run: |
          set -euo pipefail
          rm -f "$VIEWER_APPLY_ATTEMPT_MARKER"
          expires_epoch="$(( $(date -u +%s) + PILOT_TTL_MINUTES * 60 ))"
          printf '%s' "$AUTHORIZATION_EXPIRES_EPOCH" | grep -Eq '^[1-9][0-9]{9,12}$' || {
            echo "::error::protected authorization expiry output is absent or invalid"
            exit 1
          }
          [ "$expires_epoch" -le "$AUTHORIZATION_EXPIRES_EPOCH" ] || {
            echo "::error::requested watchdog expiry exceeds the signed protected authorization"
            exit 1
          }
          active_deadline="$(( PILOT_TTL_MINUTES * 60 + 600 ))"
          sed \
            -e "s/__EXPIRES_EPOCH__/${expires_epoch}/g" \
            -e "s/__ACTIVE_DEADLINE_SECONDS__/${active_deadline}/g" \
            -e "s/__AUTHORIZATION_SHA256__/${AUTHORIZATION_SHA256}/g" \
            -e "s/__GATEWAY_ROUTE_PREFIX__/${GATEWAY_ROUTE_PREFIX}/g" \
            "$WATCHDOG_TEMPLATE" > /tmp/faz22-view-only-pilot-watchdog.yaml
          if grep -q '__[A-Z0-9_]*__' /tmp/faz22-view-only-pilot-watchdog.yaml; then
            echo "::error::watchdog template contains unresolved placeholders"
            exit 1
          fi
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete job faz22-view-only-pilot-watchdog --ignore-not-found --wait=true
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            apply --dry-run=server -f /tmp/faz22-view-only-pilot-watchdog.yaml
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            apply -f /tmp/faz22-view-only-pilot-watchdog.yaml
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            wait --for=condition=Ready pod -l app.kubernetes.io/name=faz22-view-only-pilot-watchdog \
            --timeout=120s
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get job faz22-view-only-pilot-watchdog \
            -o jsonpath='watchdog_expires_epoch={.metadata.annotations.faz22\.6\.acik\.com/expires-at-epoch}{"\n"}'

      - name: Apply viewer exposure overlay
        if: inputs.action == 'apply'
        env:
          VIEWER_APPLY_ATTEMPT_MARKER: ${{ runner.temp }}/faz22-view-only-pilot-overlay-attempted
        run: |
          set -euo pipefail

          # Compensation may remove a failed watchdog only before any viewer
          # resource apply was attempted. Once this marker exists, the
          # watchdog remains authoritative until explicit rollback succeeds.
          touch "$VIEWER_APPLY_ATTEMPT_MARKER"
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            apply -f /tmp/endpoint-admin-remote-bridge-viewer.yaml

          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            rollout restart "deploy/${BRIDGE_DEPLOYMENT}"
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            rollout status "deploy/${BRIDGE_DEPLOYMENT}" --timeout=300s

      - name: Patch api-gateway route to viewer
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail

          # ${sid} is a Spring RewritePath variable, not a shell variable.
          # shellcheck disable=SC2016
          # MethodRoutePredicateFactory uses ShortcutType.GATHER_LIST; one comma-separated
          # predicate is OR semantics. Two Method predicates would be AND and never match.
          patch_payload='{
            "data": {
              "SPRING_CLOUD_GATEWAY_ROUTES_28_ID": "remote-bridge-viewer-route",
              "SPRING_CLOUD_GATEWAY_ROUTES_28_URI": "http://endpoint-admin-remote-bridge-viewer:8096",
              "SPRING_CLOUD_GATEWAY_ROUTES_28_ORDER": "-10",
              "SPRING_CLOUD_GATEWAY_ROUTES_28_PREDICATES_0": "Path=/api/v1/endpoint-admin/remote-access/sessions/*/view",
              "SPRING_CLOUD_GATEWAY_ROUTES_28_PREDICATES_1": "Method=GET,POST",
              "SPRING_CLOUD_GATEWAY_ROUTES_28_FILTERS_0": "RewritePath=/api/v1/endpoint-admin/remote-access/sessions/(?<sid>[^/]+)/view, /internal/remote-bridge/operator/sessions/${sid}/view"
            }
          }'

          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            patch configmap api-gateway-config --type merge -p "${patch_payload}"

          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            rollout restart "deploy/${GATEWAY_DEPLOYMENT}"
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            rollout status "deploy/${GATEWAY_DEPLOYMENT}" --timeout=300s

      - name: Verify live viewer pilot surface
        if: inputs.action == 'apply'
        run: |
          set -euo pipefail

          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get svc endpoint-admin-remote-bridge-viewer \
            -o jsonpath='viewer_service_type={.spec.type} ports={.spec.ports[*].port} nodePorts={.spec.ports[*].nodePort}{"\n"}'

          svc_type="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get svc endpoint-admin-remote-bridge-viewer -o jsonpath='{.spec.type}')"
          node_ports="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get svc endpoint-admin-remote-bridge-viewer -o jsonpath='{.spec.ports[*].nodePort}')"
          if [ "${svc_type}" != "ClusterIP" ] || [ -n "${node_ports}" ]; then
            echo "::error::viewer service must be ClusterIP with no nodePort"
            exit 1
          fi

          bridge_env="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get deploy "${BRIDGE_DEPLOYMENT}" \
            -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}')"
          printf '%s\n' "${bridge_env}" | grep -F 'REMOTE_BRIDGE_ENABLED=true'

          bridge_config="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get configmap "${BRIDGE_CONFIGMAP}" -o json)"
          printf '%s\n' "${bridge_config}" \
            | jq -e '.data.REMOTE_BRIDGE_VIEWER_ENABLED == "true"'
          printf '%s\n' "${bridge_config}" \
            | jq -e '.data.REMOTE_BRIDGE_VIEW_ONLY_ALLOWED_FRAME_CONTENT_TYPES == "image/png"'
          printf '%s\n' "${bridge_config}" \
            | jq -e '.data.REMOTE_BRIDGE_BROKER_VIEW_ONLY_PERMIT_TTL_MILLIS == "600000"'
          bridge_runtime_view_only_ttl="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            exec "deploy/${BRIDGE_DEPLOYMENT}" -- \
            printenv REMOTE_BRIDGE_BROKER_VIEW_ONLY_PERMIT_TTL_MILLIS)"
          if [ "${bridge_runtime_view_only_ttl}" != "600000" ]; then
            echo "::error::broker runtime did not load the owner-gated 600000ms VIEW_ONLY permit TTL"
            exit 1
          fi

          gateway_env="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            exec "deploy/${GATEWAY_DEPLOYMENT}" -- printenv \
            | grep -E 'SPRING_CLOUD_GATEWAY_ROUTES_28_(ID|URI|ORDER)=|KEYCLOAK_(ISSUER_URI|JWKS_URI)=')"
          printf '%s\n' "${gateway_env}"
          printf '%s\n' "${gateway_env}" | grep -F 'SPRING_CLOUD_GATEWAY_ROUTES_28_ID=remote-bridge-viewer-route'
          printf '%s\n' "${gateway_env}" | grep -F 'SPRING_CLOUD_GATEWAY_ROUTES_28_URI=http://endpoint-admin-remote-bridge-viewer:8096'
          printf '%s\n' "${gateway_env}" | grep -F 'SPRING_CLOUD_GATEWAY_ROUTES_28_ORDER=-10'
          route_method="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get configmap api-gateway-config \
            -o jsonpath='{.data.SPRING_CLOUD_GATEWAY_ROUTES_28_PREDICATES_1}')"
          [ "${route_method}" = 'Method=GET,POST' ] || {
            echo "::error::viewer route must permit only GET stream + POST render acknowledgement"
            exit 1
          }
          if printf '%s\n' "${gateway_env}" | grep -F 'OVERLAY_MUST_OVERRIDE'; then
            echo "::error::api-gateway KEYCLOAK overlay values were clobbered"
            exit 1
          fi

          {
            echo ""
            echo "## #2373 VIEW_ONLY viewer product pilot live surface"
            echo ""
            echo "- bridge rollout: \`ok\`"
            echo "- api-gateway rollout: \`ok\`"
            echo "- viewer service: \`ClusterIP/no-nodePort\`"
            echo "- gateway route 28: \`remote-bridge-viewer-route\`"
            echo "- keycloak overlay placeholders: \`absent\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compensating rollback after failed apply
        if: always() && inputs.action == 'apply' && failure()
        env:
          VIEWER_APPLY_ATTEMPT_MARKER: ${{ runner.temp }}/faz22-view-only-pilot-overlay-attempted
        run: |
          set +e
          bash scripts/faz22-remote-ops/rollback-view-only-viewer-pilot-config.sh
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete service endpoint-admin-remote-bridge-viewer --ignore-not-found
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete networkpolicy eab-bridge-viewer-allow-ingress-8096-from-api-gateway --ignore-not-found
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete networkpolicy eab-api-gateway-allow-egress-8096-to-bridge-viewer --ignore-not-found
          # Reconcile the exact broker-only desired state so the viewer
          # containerPort and ConfigMap keys are removed, not merely disabled.
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            apply -k "${BROKER_ONLY_OVERLAY}"
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" rollout restart \
            "deploy/${BRIDGE_DEPLOYMENT}" "deploy/${GATEWAY_DEPLOYMENT}"
          if [ ! -e "$VIEWER_APPLY_ATTEMPT_MARKER" ]; then
            kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
              delete job faz22-view-only-pilot-watchdog --ignore-not-found --wait=true
            kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
              delete rolebinding faz22-view-only-pilot-watchdog --ignore-not-found
            kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
              delete role faz22-view-only-pilot-watchdog --ignore-not-found
            kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
              delete serviceaccount faz22-view-only-pilot-watchdog --ignore-not-found
            kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
              delete networkpolicy allow-faz22-view-only-watchdog-kubernetes-api --ignore-not-found
            echo "::warning::apply failed before viewer resources were attempted; failed watchdog resources removed."
          else
            echo "::warning::apply failed after viewer resource apply began; immediate compensation requested and cluster watchdog remains authoritative."
          fi

      - name: Rollback viewer pilot surface
        if: inputs.action == 'rollback'
        run: |
          set -euo pipefail

          bash scripts/faz22-remote-ops/rollback-view-only-viewer-pilot-config.sh

          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            rollout restart "deploy/${GATEWAY_DEPLOYMENT}"
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            rollout status "deploy/${GATEWAY_DEPLOYMENT}" --timeout=300s

          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete service endpoint-admin-remote-bridge-viewer --ignore-not-found
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete networkpolicy eab-bridge-viewer-allow-ingress-8096-from-api-gateway --ignore-not-found
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete networkpolicy eab-api-gateway-allow-egress-8096-to-bridge-viewer --ignore-not-found

          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            apply -k "${BROKER_ONLY_OVERLAY}"
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            rollout restart "deploy/${BRIDGE_DEPLOYMENT}"
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            rollout status "deploy/${BRIDGE_DEPLOYMENT}" --timeout=300s

          # The viewer surface is already closed and the broker-only overlay is
          # healthy. Remove the now-obsolete safety controller last.
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete job faz22-view-only-pilot-watchdog --ignore-not-found --wait=true
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete rolebinding faz22-view-only-pilot-watchdog --ignore-not-found
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete role faz22-view-only-pilot-watchdog --ignore-not-found
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete serviceaccount faz22-view-only-pilot-watchdog --ignore-not-found
          kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            delete networkpolicy allow-faz22-view-only-watchdog-kubernetes-api --ignore-not-found

      - name: Verify rollback posture
        if: inputs.action == 'rollback'
        run: |
          set -euo pipefail

          if kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get svc endpoint-admin-remote-bridge-viewer >/dev/null 2>&1; then
            echo "::error::viewer ClusterIP service still exists after rollback"
            exit 1
          fi
          if kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get networkpolicy eab-bridge-viewer-allow-ingress-8096-from-api-gateway >/dev/null 2>&1; then
            echo "::error::viewer ingress NetworkPolicy still exists after rollback"
            exit 1
          fi
          if kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get networkpolicy eab-api-gateway-allow-egress-8096-to-bridge-viewer >/dev/null 2>&1; then
            echo "::error::viewer egress NetworkPolicy still exists after rollback"
            exit 1
          fi

          route_keys="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get configmap api-gateway-config -o json \
            | jq -r '.data | keys[] | select(startswith("SPRING_CLOUD_GATEWAY_ROUTES_28_"))' || true)"
          if [ -n "${route_keys}" ]; then
            echo "::error::api-gateway route 28 keys remain after rollback"
            printf '%s\n' "${route_keys}"
            exit 1
          fi

          bridge_env="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get deploy "${BRIDGE_DEPLOYMENT}" \
            -o jsonpath='{range .spec.template.spec.containers[0].env[*]}{.name}={.value}{"\n"}{end}')"
          printf '%s\n' "${bridge_env}" | grep -F 'REMOTE_BRIDGE_ENABLED=true'

          bridge_config="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get configmap "${BRIDGE_CONFIGMAP}" -o json)"
          if ! printf '%s\n' "${bridge_config}" \
            | jq -e '
                (.data | has("REMOTE_BRIDGE_VIEWER_ENABLED") | not)
                and (.data | has("REMOTE_BRIDGE_VIEW_ONLY_ALLOWED_FRAME_CONTENT_TYPES") | not)
                and (.data | has("REMOTE_BRIDGE_BROKER_VIEW_ONLY_PERMIT_TTL_MILLIS") | not)
              ' >/dev/null; then
            echo "::error::viewer-only ConfigMap keys remain after rollback"
            exit 1
          fi
          bridge_ports="$(kubectl --context="${K8S_CONTEXT}" -n "${K8S_NAMESPACE}" \
            get deploy "${BRIDGE_DEPLOYMENT}" \
            -o jsonpath='{range .spec.template.spec.containers[0].ports[*]}{.containerPort}{"\n"}{end}')"
          if printf '%s\n' "${bridge_ports}" | grep -Fx '8096'; then
            echo "::error::containerPort 8096 is still advertised after rollback"
            exit 1
          fi

          {
            echo "## #2373 VIEW_ONLY viewer product pilot rollback verification"
            echo ""
            echo "- viewer service: \`absent\`"
            echo "- viewer NetworkPolicies: \`absent\`"
            echo "- api-gateway route 28: \`absent\`"
            echo "- broker remains enabled: \`REMOTE_BRIDGE_ENABLED=true\`"
          } >> "$GITHUB_STEP_SUMMARY"
