name: Faz 24 Platform Desktop Token Evidence

# Runs the #1995/#1996/#1997 external-recorder evidence chain on the
# self-hosted aiserver runner. Boundary: platform-test Keycloak only;
# direct grants are restored, the temp user is deleted, token/password/admin
# material is never uploaded, and production/direct-STT readiness is not
# claimed by this workflow.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public testai base URL"
        required: true
        default: "https://testai.acik.com"
      expected_issuer:
        description: "Expected platform-test issuer URL"
        required: true
        default: "https://testai.acik.com/realms/platform-test"
      keycloak_base_url:
        description: "Runner-local Keycloak token endpoint base URL"
        required: true
        default: "http://127.0.0.1:8082"
      run_external_smoke:
        description: "Run external recorder smoke after token-contract PASS"
        required: true
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      run_speechmatics_realtime:
        description: "Run Speechmatics partial/final/terminal plus durable web read-back acceptance"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      run_session_expiry_smoke:
        description: "Run transient audio-gateway session-expiry capacity smoke"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
      recover_stale_run_id:
        description: "Exact prior GitHub run id whose platform-test smoke state must be recovered"
        required: false
        default: ""
      expected_audio_gateway_image:
        description: "Exact audio-gateway image@sha256 for session-expiry smoke"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: faz24-platform-desktop-keycloak-test-mutation
  cancel-in-progress: false

jobs:
  evidence:
    name: platform-desktop token + external recorder evidence
    runs-on: [self-hosted, aiserver, testai-deploy]
    timeout-minutes: 30

    env:
      EVIDENCE_DIR: /tmp/faz24-platform-desktop-token-evidence-${{ github.run_id }}-${{ github.run_attempt }}
      DIAG_JSON: /tmp/faz24-platform-desktop-token-evidence-${{ github.run_id }}-${{ github.run_attempt }}/faz24-platform-desktop-token-diagnostic.json
      TOKEN_CONTRACT_JSON: /tmp/faz24-platform-desktop-token-evidence-${{ github.run_id }}-${{ github.run_attempt }}/faz24-platform-desktop-token-contract.json
      SMOKE_JSON: /tmp/faz24-platform-desktop-token-evidence-${{ github.run_id }}-${{ github.run_attempt }}/faz24-external-recorder-smoke.json
      SMOKE_VERIFY_JSON: /tmp/faz24-platform-desktop-token-evidence-${{ github.run_id }}-${{ github.run_attempt }}/faz24-external-recorder-smoke.verify.json
      SESSION_EXPIRY_SMOKE_JSON: /tmp/faz24-platform-desktop-token-evidence-${{ github.run_id }}-${{ github.run_attempt }}/faz24-audio-gateway-session-expiry-smoke.json
      REALTIME_ACCEPTANCE_JSON: /tmp/faz24-platform-desktop-token-evidence-${{ github.run_id }}-${{ github.run_attempt }}/faz24-speechmatics-realtime-lifecycle-acceptance.json
      RUNNER_STDOUT: /tmp/faz24-platform-desktop-token-runner-${{ github.run_id }}-${{ github.run_attempt }}.stdout
      RUNNER_STDERR: /tmp/faz24-platform-desktop-token-runner-${{ github.run_id }}-${{ github.run_attempt }}.stderr

    steps:
      - name: Validate dispatch inputs
        env:
          BASE_URL_INPUT: ${{ inputs.base_url }}
          EXPECTED_ISSUER_INPUT: ${{ inputs.expected_issuer }}
          KEYCLOAK_BASE_URL_INPUT: ${{ inputs.keycloak_base_url }}
          RUN_EXTERNAL_SMOKE_INPUT: ${{ inputs.run_external_smoke }}
          RUN_SPEECHMATICS_REALTIME_INPUT: ${{ inputs.run_speechmatics_realtime }}
          RUN_SESSION_EXPIRY_SMOKE_INPUT: ${{ inputs.run_session_expiry_smoke }}
          RECOVER_STALE_RUN_ID_INPUT: ${{ inputs.recover_stale_run_id }}
          EXPECTED_AUDIO_GATEWAY_IMAGE_INPUT: ${{ inputs.expected_audio_gateway_image }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "$value" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be a single line"
                exit 1
                ;;
            esac
          }

          require_http_url() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$'; then
              echo "::error::${name} must be a bounded http(s) URL without credentials, query, or fragment"
              exit 1
            fi
            if printf '%s' "$value" | grep -Eq '(^|/)\.\.(/|$)|@|[?&=#]'; then
              echo "::error::${name} must not contain path escape, credentials, query, or fragment"
              exit 1
            fi
          }

          require_audio_gateway_digest() {
            value="$1"
            if ! printf '%s' "$value" | grep -Eq '^ghcr\.io/halildeu/platform-backend-audio-gateway-service@sha256:[0-9a-f]{64}$'; then
              echo "::error::expected_audio_gateway_image must be the exact governed audio-gateway image@sha256"
              exit 1
            fi
          }

          reject_multiline base_url "${BASE_URL_INPUT}"
          reject_multiline expected_issuer "${EXPECTED_ISSUER_INPUT}"
          reject_multiline keycloak_base_url "${KEYCLOAK_BASE_URL_INPUT}"
          reject_multiline run_external_smoke "${RUN_EXTERNAL_SMOKE_INPUT}"
          reject_multiline run_speechmatics_realtime "${RUN_SPEECHMATICS_REALTIME_INPUT}"
          reject_multiline run_session_expiry_smoke "${RUN_SESSION_EXPIRY_SMOKE_INPUT}"
          reject_multiline recover_stale_run_id "${RECOVER_STALE_RUN_ID_INPUT}"
          reject_multiline expected_audio_gateway_image "${EXPECTED_AUDIO_GATEWAY_IMAGE_INPUT}"
          require_http_url base_url "${BASE_URL_INPUT}"
          require_http_url expected_issuer "${EXPECTED_ISSUER_INPUT}"
          require_http_url keycloak_base_url "${KEYCLOAK_BASE_URL_INPUT}"

          case "${RUN_EXTERNAL_SMOKE_INPUT}" in
            true|false) ;;
            *)
              echo "::error::run_external_smoke must be true or false"
              exit 1
              ;;
          esac

          case "${RUN_SESSION_EXPIRY_SMOKE_INPUT}" in
            true|false) ;;
            *)
              echo "::error::run_session_expiry_smoke must be true or false"
              exit 1
              ;;
          esac

          case "${RUN_SPEECHMATICS_REALTIME_INPUT}" in
            true|false) ;;
            *)
              echo "::error::run_speechmatics_realtime must be true or false"
              exit 1
              ;;
          esac

          if [ -n "${RECOVER_STALE_RUN_ID_INPUT}" ] \
              && ! printf '%s' "${RECOVER_STALE_RUN_ID_INPUT}" | grep -Eq '^[0-9]{6,20}$'; then
            echo "::error::recover_stale_run_id must be an exact bounded GitHub run id"
            exit 1
          fi

          if [ -n "${RECOVER_STALE_RUN_ID_INPUT}" ] \
              && [ "${RUN_SESSION_EXPIRY_SMOKE_INPUT}" != "true" ]; then
            echo "::error::stale test-state recovery requires session-expiry smoke"
            exit 1
          fi

          if [ "${RUN_SESSION_EXPIRY_SMOKE_INPUT}" = "true" ]; then
            if [ "${RUN_EXTERNAL_SMOKE_INPUT}" != "false" ]; then
              echo "::error::session-expiry and external-recorder smokes cannot run in the same dispatch"
              exit 1
            fi
            require_audio_gateway_digest "${EXPECTED_AUDIO_GATEWAY_IMAGE_INPUT}"
          elif [ -n "${EXPECTED_AUDIO_GATEWAY_IMAGE_INPUT}" ]; then
            require_audio_gateway_digest "${EXPECTED_AUDIO_GATEWAY_IMAGE_INPUT}"
          fi

          if [ "${RUN_SPEECHMATICS_REALTIME_INPUT}" = "true" ] \
              && [ "${RUN_SESSION_EXPIRY_SMOKE_INPUT}" = "true" ]; then
            echo "::error::Speechmatics realtime and session-expiry smokes cannot share one dispatch"
            exit 1
          fi

          all_inputs="${BASE_URL_INPUT}${EXPECTED_ISSUER_INPUT}${KEYCLOAK_BASE_URL_INPUT}${RUN_EXTERNAL_SMOKE_INPUT}${RUN_SPEECHMATICS_REALTIME_INPUT}${RUN_SESSION_EXPIRY_SMOKE_INPUT}${RECOVER_STALE_RUN_ID_INPUT}${EXPECTED_AUDIO_GATEWAY_IMAGE_INPUT}"
          if printf '%s' "${all_inputs}" | grep -Eq -- '-----BEGIN .*PRIVATE KEY-----|Bearer |Authorization:|eyJ[A-Za-z0-9_-]+\.'; then
            echo "::error::inputs must not contain token/private/secret-like material"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Run platform-desktop token evidence chain
        id: run_chain
        env:
          OUT_DIR: ${{ env.EVIDENCE_DIR }}
          BASE_URL: ${{ inputs.base_url }}
          EXPECTED_ISSUER: ${{ inputs.expected_issuer }}
          KC_BASE_URL: ${{ inputs.keycloak_base_url }}
          KC_ADMIN_PASSWORD: ${{ secrets.KC_TEST_ADMIN_PASSWORD }}
          RUN_EXTERNAL_SMOKE: ${{ inputs.run_external_smoke == 'true' && '1' || '0' }}
          RUN_SPEECHMATICS_REALTIME: ${{ inputs.run_speechmatics_realtime == 'true' && '1' || '0' }}
          RUN_SESSION_EXPIRY_SMOKE: ${{ inputs.run_session_expiry_smoke == 'true' && '1' || '0' }}
          RECOVER_STALE_RUN_ID: ${{ inputs.recover_stale_run_id }}
          EXPECTED_AUDIO_GATEWAY_IMAGE: ${{ inputs.expected_audio_gateway_image }}
          REALTIME_PYTHON: python3
          REALTIME_HELPER: ${{ github.workspace }}/scripts/faz24/run_speechmatics_realtime_lifecycle_acceptance.py
          REALTIME_AUDIO_FILE: ${{ github.workspace }}/scripts/faz24/fixtures/speechmatics-realtime-tr-v1.wav
          REALTIME_DURABLE_TIMEOUT_SECONDS: "720"
          # The platform-desktop client owns these five direct claims. This
          # explicit test-only confirmation removes foreign/hardcoded direct
          # emitters only after a 0600 rollback snapshot is written.
          CONFIRM_CONTROLLED_MAPPER_PRUNE: ${{ inputs.run_session_expiry_smoke == 'true' && 'NO' || 'YES' }}
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          install -m 0600 /dev/null "${RUNNER_STDOUT}"
          install -m 0600 /dev/null "${RUNNER_STDERR}"
          realtime_deps_dir="${RUNNER_TEMP}/faz24-realtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'rm -f -- "${RUNNER_STDOUT}" "${RUNNER_STDERR}"; rm -rf -- "${realtime_deps_dir}"' EXIT

          if [ "${RUN_SPEECHMATICS_REALTIME}" = "1" ]; then
            mkdir -p "${realtime_deps_dir}"
            wheel="${realtime_deps_dir}/websockets-15.0.1-py3-none-any.whl"
            curl -fsSL --retry 3 --proto '=https' --tlsv1.2 \
              'https://files.pythonhosted.org/packages/fa/a8/5b41e0da817d64113292ab1f8247140aac61cbf6cfd085d6a0fa77f4984f/websockets-15.0.1-py3-none-any.whl' \
              -o "${wheel}"
            printf '%s  %s\n' \
              'f7a866fbc1e97b5c617ee4116daaa09b722101d4a3c170c787450ba409f9736f' \
              "${wheel}" | sha256sum -c -
            export PYTHONPATH="${wheel}${PYTHONPATH:+:${PYTHONPATH}}"
            python3 -c 'import websockets; assert websockets.__version__ == "15.0.1"'
          fi

          promote_single_artifact() {
            name="$1"
            target="$2"
            mapfile -t matches < <(find "${EVIDENCE_DIR}" -mindepth 2 -maxdepth 2 -type f -name "$name" -print)
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::required ${name} artifact was not produced"
              return 1
            fi
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::expected one ${name} artifact, found ${#matches[@]}"
              return 1
            fi
            install -m 0600 "${matches[0]}" "$target"
          }

          set +e
          if [ "${RUN_SESSION_EXPIRY_SMOKE}" = "1" ]; then
            EXPECTED_IMAGE="${EXPECTED_AUDIO_GATEWAY_IMAGE}" \
            OUT_DIR="${EVIDENCE_DIR}" \
              bash scripts/faz24/run_audio_gateway_session_expiry_transient_smoke.sh \
                > "${RUNNER_STDOUT}" \
                2> "${RUNNER_STDERR}"
          else
            bash scripts/faz24/run-platform-desktop-token-evidence-chain.sh \
              > "${RUNNER_STDOUT}" \
              2> "${RUNNER_STDERR}"
          fi
          exit_code="$?"
          set -e

          if [ "${RUN_SESSION_EXPIRY_SMOKE}" = "1" ]; then
            promote_single_artifact \
              "faz24-platform-desktop-token-diagnostic.json" \
              "${DIAG_JSON}" || exit_code=1
            promote_single_artifact \
              "faz24-audio-gateway-session-expiry-smoke.json" \
              "${SESSION_EXPIRY_SMOKE_JSON}" || exit_code=1
          fi

          if [ ! -s "${DIAG_JSON}" ]; then
            jq -n --argjson chainExitCode "${exit_code}" '{
              schemaVersion: "faz24.platformDesktopTokenEvidenceChain.v1",
              status: "fail",
              failureReason: "evidence-chain-exited-before-diagnostic",
              chainExitCode: $chainExitCode,
              tokenIncluded: false,
              boundaries: {
                platformTestOnly: true,
                productionMutation: false,
                rawTokenLogged: false,
                rawPasswordLogged: false,
                rawAdminCredentialLogged: false
              },
              cleanup: {
                directGrantsToggled: false,
                directGrantsRestored: false,
                tempUserCreated: false,
                tempUserDeleted: false,
                tokenFileRemoved: false,
                recoveryRequested: false,
                recoveryRunId: null,
                staleDirectGrantsVerified: false,
                staleTempUsersMatched: 0,
                staleTempUsersDeleted: 0,
                staleTempUsersRemaining: -1,
                adminSessionRefreshAttempted: false,
                adminSessionRefreshed: false
              },
              results: {
                tokenContract: {status: "not-proven"},
                externalRecorderSmoke: {status: "not-proven"},
                externalRecorderVerifier: {status: "not-proven"},
                audioGatewaySessionExpirySmoke: {status: "not-proven"},
                speechmaticsRealtimeLifecycle: {status: "not-proven"}
              }
            }' > "${DIAG_JSON}"
            chmod 0600 "${DIAG_JSON}"
          fi

          echo "exit_code=${exit_code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Verify artifact excludes private material
        id: secret_scan
        if: always()
        env:
          KC_ADMIN_PASSWORD: ${{ secrets.KC_TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          test -d "${EVIDENCE_DIR}"
          test -s "${DIAG_JSON}"

          python3 - "${EVIDENCE_DIR}" <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          secret = os.environ.get("KC_ADMIN_PASSWORD", "").encode()
          if not secret:
              raise SystemExit("KC_TEST_ADMIN_PASSWORD is missing")
          for candidate in root.rglob("*"):
              if candidate.is_file() and secret in candidate.read_bytes():
                  raise SystemExit(f"evidence contains exact admin secret bytes: {candidate.name}")

          import json

          diagnostic = root / "faz24-platform-desktop-token-diagnostic.json"
          data = json.load(diagnostic.open(encoding="utf-8"))
          assert data["schemaVersion"] == "faz24.platformDesktopTokenEvidenceChain.v1"
          assert data["tokenIncluded"] is False
          assert data["boundaries"]["platformTestOnly"] is True
          assert data["boundaries"]["productionMutation"] is False
          assert data["boundaries"]["rawTokenLogged"] is False
          assert data["boundaries"]["rawPasswordLogged"] is False
          assert data["boundaries"]["rawAdminCredentialLogged"] is False
          PY

          sensitive_scan_rc=0
          grep -R -a -q -E \
            -e '-----BEGIN (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----' \
            -e '-----END (OPENSSH |RSA |EC |DSA )?PRIVATE KEY-----' \
            -e 'Bearer ' \
            -e 'Authorization:' \
            -e 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.' \
            -e '-----BEGIN CERTIFICATE-----' \
            -e 'data:audio/[A-Za-z0-9.+-]+;base64,' \
            -- \
            "${EVIDENCE_DIR}" || sensitive_scan_rc="$?"
          if [ "${sensitive_scan_rc}" -eq 0 ]; then
            echo "::error::evidence artifact contains forbidden token/key/certificate material"
            exit 1
          elif [ "${sensitive_scan_rc}" -ne 1 ]; then
            echo "::error::evidence artifact sensitive-material scan could not complete"
            exit 1
          fi

          key_scan_rc=0
          grep -R -a -q -E \
            -e '"(access_token|refresh_token)"[[:space:]]*:' \
            -e '"(authorization|bearer|jwt|api_key|private_key)"[[:space:]]*:' \
            -e '"(client_secret|password|secret)"[[:space:]]*:' \
            -e '"(raw_audio|audio_bytes|audio_base64|transcript_text)"[[:space:]]*:' \
            -e '"(raw_request|raw_response|cookie)"[[:space:]]*:' \
            -- \
            "${EVIDENCE_DIR}" || key_scan_rc="$?"
          if [ "${key_scan_rc}" -eq 0 ]; then
            echo "::error::evidence artifact contains forbidden key names"
            exit 1
          elif [ "${key_scan_rc}" -ne 1 ]; then
            echo "::error::evidence artifact key-name scan could not complete"
            exit 1
          fi

      - name: Validate evidence acceptance
        id: acceptance
        if: always() && steps.secret_scan.outcome == 'success'
        env:
          RUN_SESSION_EXPIRY_SMOKE_INPUT: ${{ inputs.run_session_expiry_smoke }}
          RUN_SPEECHMATICS_REALTIME_INPUT: ${{ inputs.run_speechmatics_realtime }}
          RECOVER_STALE_RUN_ID_INPUT: ${{ inputs.recover_stale_run_id }}
        run: |
          set -euo pipefail

          test -s "${DIAG_JSON}"

          python3 - "${DIAG_JSON}" "${SESSION_EXPIRY_SMOKE_JSON}" "${RUN_SESSION_EXPIRY_SMOKE_INPUT}" "${RECOVER_STALE_RUN_ID_INPUT}" "${REALTIME_ACCEPTANCE_JSON}" "${RUN_SPEECHMATICS_REALTIME_INPUT}" <<'PY'
          import json
          import pathlib
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["cleanup"]["directGrantsToggled"] in (True, False)
          if data["cleanup"]["directGrantsToggled"]:
              assert data["cleanup"]["directGrantsRestored"] is True
          if data["cleanup"]["tempUserCreated"]:
              assert data["cleanup"]["tempUserDeleted"] is True
          if data["cleanup"]["directGrantsToggled"] or data["cleanup"]["tempUserCreated"]:
              assert data["cleanup"]["adminSessionRefreshAttempted"] is True
              assert data["cleanup"]["adminSessionRefreshed"] is True
          assert data["cleanup"]["tokenFileRemoved"] is True
          if sys.argv[4]:
              assert data["cleanup"]["recoveryRequested"] is True
              assert data["cleanup"]["recoveryRunId"] == sys.argv[4]
              assert data["cleanup"]["staleDirectGrantsVerified"] is True
              assert type(data["cleanup"]["staleTempUsersMatched"]) is int
              assert 0 <= data["cleanup"]["staleTempUsersMatched"] <= 20
              assert data["cleanup"]["staleTempUsersDeleted"] == data["cleanup"]["staleTempUsersMatched"]
              assert data["cleanup"]["staleTempUsersRemaining"] == 0
          if sys.argv[3] == "true":
              session_path = pathlib.Path(sys.argv[2])
              assert session_path.is_file()
              session = json.load(session_path.open(encoding="utf-8"))
              assert data["status"] == "pass"
              assert data["results"]["audioGatewaySessionExpirySmoke"]["status"] == "pass"
              assert session["status"] == "pass"
              assert session["boundaries"]["sessionRegistryCapacityReused"] is True
              assert session["boundaries"]["aggregationReservationReleased"] is True
              assert session["boundaries"]["negativeInvariantStable"] is True
          if sys.argv[6] == "true":
              realtime_path = pathlib.Path(sys.argv[5])
              assert realtime_path.is_file()
              realtime = json.load(realtime_path.open(encoding="utf-8"))
              assert data["status"] == "pass"
              assert data["results"]["speechmaticsRealtimeLifecycle"]["status"] == "pass"
              assert data["results"]["speechmaticsRealtimePersona"] == {
                  "platformUserId": "990001",
                  "transcriptRealmRole": "TRANSCRIPT_ADMIN",
                  "transcriptRealmRoleAssigned": True,
                  "openFgaGrantSource": "preseeded-test-recorder-persona",
              }
              assert realtime["schemaVersion"] == "faz24.speechmaticsRealtimeLifecycleAcceptance.v1"
              assert realtime["status"] == "pass"
              assert realtime["tokenIncluded"] is False
              assert realtime["transcriptIncluded"] is False
              assert realtime["audioIncluded"] is False
              assert realtime["stream"]["partialWhileSpeaking"] is True
              assert realtime["stream"]["eofAck"] is True
              assert realtime["stream"]["drained"] is True
              assert realtime["stream"]["terminalTimeout"] is False
              assert realtime["durable"]["intelligenceResultSessionMatch"] is True
              assert realtime["durable"]["durableApiReadBackProven"] is True
          PY

      - name: Write workflow summary
        if: always()
        env:
          CHAIN_EXIT_CODE: ${{ steps.run_chain.outputs.exit_code }}
        run: |
          set -euo pipefail
          status="missing"
          failure="missing"
          token_contract="missing"
          smoke="missing"
          verifier="missing"
          session_expiry="missing"
          realtime="missing"
          if [ -s "${DIAG_JSON}" ]; then
            status="$(jq -r '.status // "missing"' "${DIAG_JSON}")"
            failure="$(jq -r '.failureReason // "none"' "${DIAG_JSON}")"
            token_contract="$(jq -r '.results.tokenContract.status // "missing"' "${DIAG_JSON}")"
            smoke="$(jq -r '.results.externalRecorderSmoke.status // "missing"' "${DIAG_JSON}")"
            verifier="$(jq -r '.results.externalRecorderVerifier.status // "missing"' "${DIAG_JSON}")"
            session_expiry="$(jq -r '.results.audioGatewaySessionExpirySmoke.status // "missing"' "${DIAG_JSON}")"
            realtime="$(jq -r '.results.speechmaticsRealtimeLifecycle.status // "missing"' "${DIAG_JSON}")"
          fi
          {
            echo "## Faz 24 platform-desktop token evidence"
            echo
            echo "- Runner: self-hosted aiserver"
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-platform-desktop-token-evidence-${{ github.run_id }}-${{ github.run_attempt }}\`"
            echo "- Chain exit code: \`${CHAIN_EXIT_CODE:-missing}\`"
            echo "- Diagnostic status: \`${status}\`"
            echo "- Failure reason: \`${failure}\`"
            echo "- Token contract: \`${token_contract}\`"
            echo "- External recorder smoke: \`${smoke}\`"
            echo "- External recorder verifier: \`${verifier}\`"
            echo "- Audio-gateway session expiry: \`${session_expiry}\`"
            echo "- Speechmatics realtime lifecycle: \`${realtime}\`"
            echo
            echo "Boundary: platform-test only. The workflow restores direct grants, deletes the temporary smoke user, removes local token/password files, cleans transient Job/NetworkPolicy resources, and uploads only structured redacted evidence. Free-form runner logs are ephemeral and never uploaded. Speechmatics mode proves realtime partial/final/terminal behavior and durable web read-back for one synthetic TEST journey; it does not claim production or physical desktop mic/loopback acceptance."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload platform-desktop token evidence artifact
        if: always() && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: faz24-platform-desktop-token-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local evidence directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${EVIDENCE_DIR}"
          rm -f "${RUNNER_STDOUT}" "${RUNNER_STDERR}"

      - name: Fail workflow when chain is not accepted
        if: always()
        env:
          CHAIN_EXIT_CODE: ${{ steps.run_chain.outputs.exit_code }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          set -euo pipefail
          if [ "${SECRET_SCAN_OUTCOME}" != "success" ]; then
            echo "::error::platform-desktop token evidence secret scan did not pass"
            exit 1
          fi
          if [ "${ACCEPTANCE_OUTCOME}" != "success" ]; then
            echo "::error::platform-desktop token evidence acceptance did not pass"
            exit 1
          fi
          if [ -z "${CHAIN_EXIT_CODE}" ]; then
            echo "::error::platform-desktop token evidence chain did not expose an exit code"
            exit 1
          fi
          if [ "${CHAIN_EXIT_CODE}" != "0" ]; then
            echo "::error::platform-desktop token evidence chain was not accepted"
            exit "${CHAIN_EXIT_CODE}"
          fi
