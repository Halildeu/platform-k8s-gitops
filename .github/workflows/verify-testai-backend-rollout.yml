name: Verify testai backend GitOps rollout

on:
  push:
    branches: [main]
    paths:
      - "kustomize/overlays/test/kustomization.yaml"
      - "docs/operations/services.yaml"
      - "argocd/applications/platform-test.yaml"
      - ".github/workflows/deploy-backend-testai.yml"
      - ".github/workflows/verify-testai-backend-rollout.yml"
      - "scripts/automation/backend-testai-digest-contract.py"
      - "scripts/automation/testai-last-verified-map.py"
      - "scripts/automation/sync-test-overlay.sh"
      - "scripts/automation/apply-test-overlay-digests.py"
      - "scripts/deploy/reconcile-testai-backend-sequential.sh"
      - "scripts/deploy/ensure-argocd-cli.sh"
      - "scripts/deploy/verify-testai-backend-runtime.sh"
      - "scripts/deploy/verify-pod-digest.sh"
      - "scripts/deploy/gate-stability-window.sh"
  workflow_dispatch:

permissions:
  contents: read
  # gitops#3618: read the newest successful run's evidence artifact to scope
  # stability windows to services not yet verified (read-only).
  actions: read

concurrency:
  group: testai-backend-promotion
  cancel-in-progress: false

jobs:
  verify:
    name: Observe ArgoCD auto-sync and verify runtime
    environment: testai-product-acceptance
    runs-on: [self-hosted, aiserver, testai-deploy]
    timeout-minutes: 60

    steps:
      - name: Checkout merged desired state
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2

      - name: Detect backend pin change and resolve expectation
        id: pin
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_REVISION: ${{ github.sha }}
          KUSTOMIZATION: kustomize/overlays/test/kustomization.yaml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(python3 scripts/automation/backend-testai-digest-contract.py inspect \
            --kustomization "$KUSTOMIZATION")
          should_verify=true
          reconcile_revision="$CURRENT_REVISION"

          # Never reconcile an older queued revision over a newer main. If the
          # immutable map is unchanged, use latest main; if it changed, the
          # newer push owns its own verification run.
          git fetch origin main --depth=1 --quiet
          latest_revision=$(git rev-parse FETCH_HEAD)
          if [[ "$latest_revision" != "$CURRENT_REVISION" ]]; then
            latest_file="$RUNNER_TEMP/backend-overlay-latest.yaml"
            git show "${latest_revision}:${KUSTOMIZATION}" > "$latest_file"
            latest=$(python3 scripts/automation/backend-testai-digest-contract.py inspect \
              --kustomization "$latest_file")
            if [[ "$latest" == "$current" ]]; then
              if git diff --quiet "$CURRENT_REVISION" "$latest_revision" -- \
                docs/operations/services.yaml \
                .github/workflows/deploy-backend-testai.yml \
                .github/workflows/verify-testai-backend-rollout.yml \
                argocd/applications/platform-test.yaml \
                scripts/automation/backend-testai-digest-contract.py \
                scripts/automation/sync-test-overlay.sh \
                scripts/automation/apply-test-overlay-digests.py \
                scripts/deploy/reconcile-testai-backend-sequential.sh \
                scripts/deploy/ensure-argocd-cli.sh \
                scripts/deploy/verify-testai-backend-runtime.sh \
                scripts/deploy/verify-pod-digest.sh \
                scripts/deploy/gate-stability-window.sh; then
                reconcile_revision="$latest_revision"
                echo "::notice::newer main carries the same backend map and verifier contract; reconciling ${latest_revision}"
              else
                should_verify=false
                echo "::notice::backend verifier contract superseded by ${latest_revision}; newer push owns verification"
              fi
            else
              should_verify=false
              echo "::notice::backend map superseded by ${latest_revision}; newer push owns verification"
            fi
          fi

          contract_changed=false
          if [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            before_file="$RUNNER_TEMP/backend-overlay-before.yaml"
            if git show "${BEFORE_SHA}:${KUSTOMIZATION}" > "$before_file" 2>/dev/null; then
              before=$(python3 scripts/automation/backend-testai-digest-contract.py inspect \
                --kustomization "$before_file")
              # One contract diff for both decisions below (gitops#3618): a git
              # error also counts as "changed" — fail-closed to full verification.
              git diff --quiet "$BEFORE_SHA" "$CURRENT_REVISION" -- \
                docs/operations/services.yaml \
                .github/workflows/deploy-backend-testai.yml \
                .github/workflows/verify-testai-backend-rollout.yml \
                argocd/applications/platform-test.yaml \
                scripts/automation/backend-testai-digest-contract.py \
                scripts/automation/testai-last-verified-map.py \
                scripts/automation/sync-test-overlay.sh \
                scripts/automation/apply-test-overlay-digests.py \
                scripts/deploy/reconcile-testai-backend-sequential.sh \
                scripts/deploy/ensure-argocd-cli.sh \
                scripts/deploy/verify-testai-backend-runtime.sh \
                scripts/deploy/verify-pod-digest.sh \
                scripts/deploy/gate-stability-window.sh || contract_changed=true
              # The overlay file itself is deliberately not in the contract list
              # (as before): a frontend-only overlay change with an unchanged
              # backend map keeps skipping, and a digest bump must not force all
              # 13 stability windows.
              if [[ "$before" == "$current" ]]; then
                if [[ "$contract_changed" == "false" ]]; then
                  should_verify=false
                  echo "::notice::test overlay changed outside the backend image/rollout contract; backend verification skipped"
                else
                  echo "::notice::backend verification contract changed; verifying current immutable map"
                fi
              fi
            fi
          fi

          # gitops#3618: which services still owe a stability window — those whose
          # digest differs from the newest *successfully verified* map (the last
          # PASS evidence artifact), so a service moved by a superseded or failed
          # earlier push is never skipped. Exact imageID + readiness stay for all
          # 13. Empty = every service (no usable evidence, or this push also
          # changed the verifier contract — see contract_changed above).
          changed_services=$(python3 scripts/automation/testai-last-verified-map.py \
            --current-map "$current" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow-file verify-testai-backend-rollout.yml \
            --contract-changed "$contract_changed")
          echo "::notice::stability windows this run: ${changed_services:-all services} (contract_changed=$contract_changed)"

          {
            echo "should_verify=$should_verify"
            echo "reconcile_revision=$reconcile_revision"
            echo "digest_map=$current"
            echo "changed_services=$changed_services"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for sync-wave auto-sync and exact Application convergence
        id: reconcile
        if: steps.pin.outputs.should_verify == 'true'
        env:
          REVISION: ${{ steps.pin.outputs.reconcile_revision }}
          DIGEST_MAP: ${{ steps.pin.outputs.digest_map }}
          REPORT_PATH: ${{ runner.temp }}/testai-backend-argocd-auto-sync.json
        run: |
          set +e
          bash scripts/deploy/reconcile-testai-backend-sequential.sh
          rc=$?
          set -e
          # gitops#3618: exit 75 = a newer main superseded this run's map mid-run;
          # that push owns verification. Record it and free the runner — not red.
          if [[ "$rc" -eq 75 ]]; then
            # superseded is only acceptable with its own evidence on disk
            jq -e '.verdict == "SUPERSEDED"' "$REPORT_PATH" >/dev/null || {
              echo "::error::convergence exited 75 without a SUPERSEDED evidence report"; exit 1; }
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::backend map superseded on main during convergence; newer push owns verification"
            exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Verify exact pod digests, public edge, readiness and stability
        id: verify
        if: steps.pin.outputs.should_verify == 'true' && steps.reconcile.outputs.superseded != 'true'
        env:
          REVISION: ${{ steps.pin.outputs.reconcile_revision }}
          DIGEST_MAP: ${{ steps.pin.outputs.digest_map }}
          CHANGED_SERVICES: ${{ steps.pin.outputs.changed_services }}
          REPORT_PATH: ${{ runner.temp }}/testai-backend-runtime-verification.json
          SMOKE_AUTH_USERNAME: ${{ secrets.P5_SMOKE_AUTH_USERNAME }}
          SMOKE_AUTH_PASSWORD: ${{ secrets.P5_SMOKE_AUTH_PASSWORD }}
          SMOKE_CLIENT_SECRET: ${{ secrets.P5_SMOKE_CLIENT_SECRET }}
        run: |
          set +e
          bash scripts/deploy/verify-testai-backend-runtime.sh
          rc=$?
          set -e
          if [[ "$rc" -eq 75 ]]; then
            jq -e '.verdict == "SUPERSEDED"' "$REPORT_PATH" >/dev/null || {
              echo "::error::runtime verification exited 75 without a SUPERSEDED evidence report"; exit 1; }
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::backend map superseded on main during runtime verification; newer push owns verification"
            exit 0
          fi
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Validate terminal backend evidence contract
        id: evidence_contract
        if: always() && steps.pin.outputs.should_verify == 'true' && steps.reconcile.outputs.superseded != 'true' && steps.verify.outputs.superseded != 'true'
        env:
          DIGEST_MAP: ${{ steps.pin.outputs.digest_map }}
          RECONCILE_REVISION: ${{ steps.pin.outputs.reconcile_revision }}
          RECONCILE_REPORT: ${{ runner.temp }}/testai-backend-argocd-auto-sync.json
          RUNTIME_REPORT: ${{ runner.temp }}/testai-backend-runtime-verification.json
        run: |
          set -euo pipefail
          echo "artifact_kind=diagnostic" >> "$GITHUB_OUTPUT"
          echo "artifact_revision=$RECONCILE_REVISION" >> "$GITHUB_OUTPUT"
          evidence_passed=false
          expected="$(printf '%s' "$DIGEST_MAP" \
            | python3 scripts/automation/backend-testai-digest-contract.py normalize)"

          if [[ -s "$RECONCILE_REPORT" && -s "$RUNTIME_REPORT" ]] && \
            [[ "$(stat -c '%a' "$RECONCILE_REPORT")" == "600" ]] && \
            [[ "$(stat -c '%a' "$RUNTIME_REPORT")" == "600" ]] && \
            jq -e --arg requested "$RECONCILE_REVISION" --argjson expected "$expected" '
              .schemaVersion == "testai-backend-argocd-auto-sync-v4" and
              .verdict == "PASS" and
              .requestedRevision == $requested and
              (.effectiveRevision | test("^[0-9a-f]{40}$")) and
              .observedRevision == .effectiveRevision and
              .syncStatus == "Synced" and
              .healthStatus == "Healthy" and
              .reconciliationOwner == "argocd-auto-sync-waves" and
              .verificationMode == "read-only-exact-convergence" and
              .verifierMutationPerformed == false and
              .outOfSyncResources == [] and
              .expectedDigests == $expected
            ' "$RECONCILE_REPORT" >/dev/null && \
            jq -e --argjson expected "$expected" '
              keys == [
                "authGate", "expectedDigests", "failedOrLastGate",
                "mapFenceAfterPassed", "mapFenceBeforePassed", "publicEntry",
                "schemaVersion", "verdict", "verificationMode",
                "verifierMutationPerformed"
              ] and
              .schemaVersion == "testai-backend-runtime-verification-v1" and
              .verdict == "PASS" and
              .failedOrLastGate == "complete" and
              .authGate == "pass-p5-readiness-viewer-exact-view" and
              .publicEntry == "https://testai.acik.com" and
              .verificationMode == "read-only-runtime-evidence" and
              .verifierMutationPerformed == false and
              .mapFenceBeforePassed == true and
              .mapFenceAfterPassed == true and
              .expectedDigests == $expected
            ' "$RUNTIME_REPORT" >/dev/null; then
            evidence_passed=true
            effective_revision="$(jq -r '.effectiveRevision' "$RECONCILE_REPORT")"
            echo "artifact_kind=acceptance" >> "$GITHUB_OUTPUT"
            echo "artifact_revision=$effective_revision" >> "$GITHUB_OUTPUT"
          fi
          [[ "$evidence_passed" == "true" ]]

      - name: Resolve evidence artifact kind
        id: artifact
        if: always() && steps.pin.outputs.should_verify == 'true'
        env:
          SUPERSEDED: ${{ steps.reconcile.outputs.superseded == 'true' || steps.verify.outputs.superseded == 'true' }}
          KIND: ${{ steps.evidence_contract.outputs.artifact_kind }}
          REVISION: ${{ steps.evidence_contract.outputs.artifact_revision || steps.pin.outputs.reconcile_revision }}
        run: |
          if [[ "$SUPERSEDED" == "true" ]]; then
            echo "kind=superseded" >> "$GITHUB_OUTPUT"
          else
            echo "kind=${KIND:-diagnostic}" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Upload GitOps reconciliation evidence
        if: always() && steps.pin.outputs.should_verify == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testai-backend-${{ steps.artifact.outputs.kind }}-${{ steps.artifact.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/testai-backend-argocd-auto-sync.json
            ${{ runner.temp }}/testai-backend-runtime-verification.json
          # both scripts write their report from an EXIT trap, also when superseded
          if-no-files-found: error
          retention-days: 14

      - name: Verification summary
        if: always()
        run: |
          {
            echo "## testai backend GitOps verification"
            echo ""
            echo "- merged revision: \`${{ github.sha }}\`"
            echo "- reconciled revision: \`${{ steps.pin.outputs.reconcile_revision }}\`"
            echo "- backend verification required: \`${{ steps.pin.outputs.should_verify }}\`"
            echo "- superseded by a newer main mid-run: \`${{ steps.reconcile.outputs.superseded == 'true' || steps.verify.outputs.superseded == 'true' }}\`"
            echo "- runtime services: \`13\` (exact imageID + readiness); stability windows: \`${{ steps.pin.outputs.changed_services || 'all' }}\`"
            echo "- rollout order: test-overlay ArgoCD sync waves (10..22; api-gateway last)"
            echo "- reconciliation owner: ArgoCD auto-sync on merged desired state"
            echo "- verifier mode: read-only exact revision convergence"
            echo "- drift diagnostics: resource identifiers only; raw manifest diff excluded"
            echo "- direct Kubernetes workload mutation: **none**"
            echo "- acceptance: exact imageID + public edge + readiness + stability"
            echo "- rollback: revert immutable digest PR and reconcile through this same path"
          } >> "$GITHUB_STEP_SUMMARY"
