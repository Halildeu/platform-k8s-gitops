name: Faz 22.6 VIEW_ONLY viewer termination collector

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Required literal: RUN_FAZ22_6_VIEW_ONLY_VIEWER_TERMINATION_COLLECTOR"
        required: true
        type: string
      activation_run_id:
        description: "Successful protected viewer activation run ID"
        required: true
        type: string
      browser_run_id:
        description: "Successful same-revision protected browser evidence run ID"
        required: true
        type: string
      case_name:
        description: "One isolated termination case"
        required: true
        type: choice
        options:
          - localAbort
          - killOrRevoke
          - ttlExpiry
          - heartbeatLoss
          - indicatorLoss
      device_id:
        description: "Consented attended-pilot device UUID"
        required: true
        type: string
      device_hostname:
        description: "Consented attended-pilot device hostname"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: faz22-6-view-only-viewer-termination-collector
  cancel-in-progress: false

jobs:
  collect:
    name: One isolated protected termination case
    runs-on: [self-hosted, staging-sw, testai-deploy]
    timeout-minutes: 30
    environment:
      name: faz22-view-only-pilot

    steps:
      - name: Validate bounded dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}
          ACTIVATION_RUN_ID: ${{ inputs.activation_run_id }}
          BROWSER_RUN_ID: ${{ inputs.browser_run_id }}
          CASE_NAME: ${{ inputs.case_name }}
          DEVICE_ID: ${{ inputs.device_id }}
          DEVICE_HOSTNAME: ${{ inputs.device_hostname }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "RUN_FAZ22_6_VIEW_ONLY_VIEWER_TERMINATION_COLLECTOR" ]
          printf '%s' "$ACTIVATION_RUN_ID" | grep -Eq '^[1-9][0-9]{5,19}$'
          printf '%s' "$BROWSER_RUN_ID" | grep -Eq '^[1-9][0-9]{5,19}$'
          case "$CASE_NAME" in
            localAbort|killOrRevoke|ttlExpiry|heartbeatLoss|indicatorLoss) ;;
            *) exit 1 ;;
          esac
          printf '%s' "$DEVICE_ID" | grep -Eq '^[0-9a-fA-F-]{36}$'
          printf '%s' "$DEVICE_HOSTNAME" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{1,126}$'

      - name: Checkout collector revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify protected activation authorization receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_RUN_ID: ${{ inputs.activation_run_id }}
        run: |
          set -euo pipefail
          source scripts/faz22-remote-ops/lib-github-read-api.sh
          github_read_api_preflight
          out="$RUNNER_TEMP/faz22-viewer-termination-authorization"
          mkdir -p "$out"
          github_read_api "repos/$GITHUB_REPOSITORY/actions/runs/$ACTIVATION_RUN_ID" > "$out/run.json"
          jq -e '
            .status == "completed" and .conclusion == "success"
            and .event == "workflow_dispatch" and .head_branch == "main"
            and (.head_sha | test("^[a-f0-9]{40}$"))
            and .name == "Apply #2373 VIEW_ONLY viewer product pilot surface"
            and .path == ".github/workflows/apply-view-only-viewer-pilot-enable.yml"
          ' "$out/run.json" >/dev/null
          activation_head_sha="$(jq -er '.head_sha' "$out/run.json")"
          activation_run_created_at="$(jq -er '.created_at' "$out/run.json")"
          activation_run_started_at="$(jq -er '.run_started_at' "$out/run.json")"
          github_read_api "repos/$GITHUB_REPOSITORY/actions/runs/$ACTIVATION_RUN_ID/artifacts?per_page=100" \
            > "$out/artifacts.json"
          expected="faz22-view-only-pilot-protected-authorization-$ACTIVATION_RUN_ID"
          jq -e --arg name "$expected" '
            [.artifacts[] | select(.name == $name and .expired == false)] | length == 1
          ' "$out/artifacts.json" >/dev/null
          artifact_id="$(jq -r --arg name "$expected" '.artifacts[] | select(.name == $name) | .id' "$out/artifacts.json")"
          artifact_digest="$(jq -r --arg name "$expected" '.artifacts[] | select(.name == $name) | .digest' "$out/artifacts.json")"
          github_read_api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$out/authorization.zip"
          [ "sha256:$(sha256sum "$out/authorization.zip" | awk '{print $1}')" = "$artifact_digest" ]
          python3 scripts/faz22-remote-ops/extract-exact-zip.py \
            --archive "$out/authorization.zip" \
            --destination "$out/receipt" \
            --expected-file SHA256SUMS \
            --expected-file protected-authorization.json
          (cd "$out/receipt" && sha256sum -c SHA256SUMS)
          authorization_sha256="sha256:$(sha256sum "$out/receipt/protected-authorization.json" | awk '{print $1}')"
          policy_mode="$(python3 - "$out/receipt/protected-authorization.json" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          receipt = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          expected = receipt.get("ownerPolicySha256")
          matches = []
          for mode, path in (
              ("v2", pathlib.Path("config/faz22-6-view-only-pilot-owner-policy.v2.json")),
              ("v1", pathlib.Path("config/faz22-6-view-only-pilot-owner-policy.v1.json")),
          ):
              value = json.loads(path.read_bytes())
              canonical = json.dumps(
                  value, ensure_ascii=False, separators=(",", ":"), sort_keys=True,
              ).encode()
              if f"sha256:{hashlib.sha256(canonical).hexdigest()}" == expected:
                  matches.append(mode)
          if len(matches) != 1:
              raise SystemExit("authorization owner policy digest is not uniquely canonical")
          print(matches[0])
          PY
          )"
          case "$policy_mode" in
            v2)
              policy=config/faz22-6-view-only-pilot-owner-policy.v2.json
              legacy_args=()
              [ "$activation_head_sha" = "$GITHUB_SHA" ] || {
                echo "::error::current v2 authorization must match the collector revision"
                exit 1
              }
              ;;
            v1)
              policy=config/faz22-6-view-only-pilot-owner-policy.v1.json
              legacy_args=(
                --allow-legacy-v1
                --activation-run-created-at "$activation_run_created_at"
                --activation-run-started-at "$activation_run_started_at"
              )
              ;;
            *)
              echo "::error::unsupported owner policy selection"
              exit 1
              ;;
          esac
          python3 scripts/faz22-remote-ops/verify-view-only-pilot-authorization-receipt.py \
            --receipt "$out/receipt/protected-authorization.json" \
            --policy "$policy" \
            --revocations config/faz22-6-view-only-pilot-authorization-revocations.v1.json \
            --expected-run-id "$ACTIVATION_RUN_ID" \
            --expected-head-sha "$activation_head_sha" \
            "${legacy_args[@]}"
          echo "MATRIX_AUTHORIZATION_SHA256=$authorization_sha256" >> "$GITHUB_ENV"
          echo "MATRIX_ACTIVATION_HEAD_SHA=$activation_head_sha" >> "$GITHUB_ENV"

      - name: Fetch and bind canonical browser root
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_RUN_ID: ${{ inputs.browser_run_id }}
        run: |
          set -euo pipefail
          source scripts/faz22-remote-ops/lib-github-read-api.sh
          github_read_api_preflight
          out="$RUNNER_TEMP/faz22-viewer-termination-browser-root"
          mkdir -p "$out"
          github_read_api "repos/$GITHUB_REPOSITORY/actions/runs/$BROWSER_RUN_ID" > "$out/run.json"
          jq -e --arg sha "$MATRIX_ACTIVATION_HEAD_SHA" '
            .status == "completed" and .conclusion == "success"
            and .event == "workflow_dispatch" and .head_branch == "main"
            and .head_sha == $sha
            and .name == "Faz 22.6 VIEW_ONLY viewer browser evidence"
            and .path == ".github/workflows/faz22-6-view-only-viewer-browser-evidence.yml"
          ' "$out/run.json" >/dev/null
          github_read_api "repos/$GITHUB_REPOSITORY/actions/runs/$BROWSER_RUN_ID/artifacts?per_page=100" \
            > "$out/artifacts.json"
          expected="faz22-6-view-only-viewer-browser-evidence-$BROWSER_RUN_ID"
          jq -e --arg name "$expected" '
            [.artifacts[] | select(.name == $name and .expired == false)] | length == 1
          ' "$out/artifacts.json" >/dev/null
          artifact_id="$(jq -r --arg name "$expected" '.artifacts[] | select(.name == $name) | .id' "$out/artifacts.json")"
          artifact_digest="$(jq -r --arg name "$expected" '.artifacts[] | select(.name == $name) | .digest' "$out/artifacts.json")"
          printf '%s' "$artifact_digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          github_read_api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$out/browser.zip"
          [ "sha256:$(sha256sum "$out/browser.zip" | awk '{print $1}')" = "$artifact_digest" ]
          python3 scripts/faz22-remote-ops/extract-exact-zip.py \
            --archive "$out/browser.zip" \
            --destination "$out/artifact" \
            --expected-file evidence/browser.json
          jq -e --arg sha "$GITHUB_SHA" --slurpfile authorization \
              "$RUNNER_TEMP/faz22-viewer-termination-authorization/receipt/protected-authorization.json" '
            .schemaVersion == "faz22.6.viewOnlyViewerProductChildEvidence.v2"
            and .evidenceType == "browser" and .sourceRevision == $sha
            and .producer.kind == "browser-harness"
            and .producer.toolVersion == "v3-ack-drain"
            and .payload.ackDrainCompleted == true
            and .payload.ackDrainCutoffAt == .payload.pilotEndedAt
            and (.payload.ackDrainNonceSha256 | test("^sha256:[a-f0-9]{64}$"))
            and (.payload.ackDrainClosureKind == "none"
              or .payload.ackDrainClosureKind == "stream-ended-after-drain")
            and .payload.renderAckRejectedCount == 0
            and .payload.renderAckPendingCount == 0
            and .payload.renderAckAcceptedCount >= 100
            and .payload.renderAckAcceptedCount == .payload.renderAckAttemptedCount
            and .binding.operatorSha256 == $authorization[0].operatorSha256
            and .binding.deviceSha256 == $authorization[0].deviceSha256
          ' "$out/artifact/evidence/browser.json" >/dev/null
          jq -cS '.binding' "$out/artifact/evidence/browser.json" > "$out/root-binding.json"

      - name: Verify live watchdog authorization and headroom
        run: |
          set -euo pipefail
          expected="$MATRIX_AUTHORIZATION_SHA256"
          actual="$(kubectl --context=k3d-test -n platform-test get job faz22-view-only-pilot-watchdog \
            -o jsonpath='{.metadata.annotations.faz22\.6\.acik\.com/authorization-sha256}')"
          expires="$(kubectl --context=k3d-test -n platform-test get job faz22-view-only-pilot-watchdog \
            -o jsonpath='{.metadata.annotations.faz22\.6\.acik\.com/expires-at-epoch}')"
          [ "$actual" = "$expected" ]
          printf '%s' "$expires" | grep -Eq '^[1-9][0-9]{9,12}$'
          [ "$(( expires - $(date -u +%s) ))" -ge 1200 ]

      - name: Collect one isolated termination case
        env:
          KC_TEST_ADMIN_PASSWORD: ${{ secrets.KC_TEST_ADMIN_PASSWORD }}
          EMIT_GITHUB_MASK_COMMANDS: "1"
          DEVICE_ID: ${{ inputs.device_id }}
          DEVICE_HOSTNAME: ${{ inputs.device_hostname }}
          SOURCE_REVISION: ${{ github.sha }}
          REMOTE_BRIDGE_DEPLOYMENT: endpoint-admin-remote-bridge-device-key
          REQUIRE_ACTIVE_GUI: "1"
          # Evidence-management SSH only; the product session remains the outbound,
          # device-key-attested channel. The smoke fail-closed validates this protected
          # runner alias as denetimpc@10.99.0.2 with an id_denetim identity.
          DENETIM_SSH_TARGET: denetim-pc
          DENETIM_SSH_OPTS: __SSH_CONFIG__
          AUTO_FINALIZE: "0"
          CASE_NAME: ${{ inputs.case_name }}
        run: |
          set -euo pipefail
          suffix="$(date -u +%Y%m%dT%H%M%SZ)-$RANDOM"
          case_dir="$RUNNER_TEMP/faz22-viewer-termination-$CASE_NAME"
          stage="$RUNNER_TEMP/faz22-viewer-termination-collector"
          mkdir -p "$case_dir" "$stage/observations" "$stage/audit"
          EVIDENCE_DIR="$case_dir" \
          SESSION_ID="rb-viewonly-term-${CASE_NAME}-${suffix}" \
          OPERATION_ID="op-view-term-${CASE_NAME}-${suffix}" \
          MATRIX_TERMINATION_CASE="$CASE_NAME" \
          MATRIX_AUTHORIZATION_SHA256="$MATRIX_AUTHORIZATION_SHA256" \
          MATRIX_HOOK_SCRIPT="$GITHUB_WORKSPACE/scripts/faz22-remote-ops/collect-view-only-viewer-termination-case.sh" \
            bash scripts/faz22-remote-ops/faz22-6-view-only-attended-smoke.sh
          install -m 0600 "$case_dir/matrix/observations/$CASE_NAME.jsonl" \
            "$stage/observations/$CASE_NAME.jsonl"
          install -m 0600 "$case_dir/matrix/audit/$CASE_NAME.jsonl" \
            "$stage/audit/$CASE_NAME.jsonl"
          observation_sha="sha256:$(sha256sum "$stage/observations/$CASE_NAME.jsonl" | awk '{print $1}')"
          audit_sha="sha256:$(sha256sum "$stage/audit/$CASE_NAME.jsonl" | awk '{print $1}')"
          jq -cS -n \
            --arg schemaVersion 'faz22.6.viewOnlyViewerTerminationCaseCollectorContext.v1' \
            --arg evidenceType termination --arg caseName "$CASE_NAME" \
            --arg sourceRevision "$GITHUB_SHA" \
            --arg collectedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg authorizationSha256 "$MATRIX_AUTHORIZATION_SHA256" \
            --argjson rootBinding "$(cat "$RUNNER_TEMP/faz22-viewer-termination-browser-root/root-binding.json")" \
            --arg observationSha256 "$observation_sha" --arg auditSha256 "$audit_sha" '
              {schemaVersion:$schemaVersion,evidenceType:$evidenceType,caseName:$caseName,
               sourceRevision:$sourceRevision,collectedAt:$collectedAt,
               authorizationSha256:$authorizationSha256,rootBinding:$rootBinding,
               observationSha256:$observationSha256,auditSha256:$auditSha256}' \
            > "$stage/context.json"

      - name: Validate exact case collector envelope
        env:
          CASE_NAME: ${{ inputs.case_name }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/faz22-viewer-termination-collector"
          test "$(find "$stage" -type f | wc -l | tr -d ' ')" = 3
          python3 - "$stage" "$CASE_NAME" <<'PY'
          import importlib.util
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          scripts = root / "scripts/faz22-remote-ops"
          sys.path.insert(0, str(scripts))
          path = scripts / "produce-view-only-viewer-matrix-evidence.py"
          spec = importlib.util.spec_from_file_location("matrix_producer", path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          stage = pathlib.Path(sys.argv[1])
          case_name = sys.argv[2]
          context_raw = (stage / "context.json").read_bytes()
          context_json = module.common.VERIFIER.load_json_bytes(context_raw, "case context")
          context = module.load_termination_case_context(
              context_raw, case_name, context_json["sourceRevision"],
          )
          observations = (stage / f"observations/{case_name}.jsonl").read_bytes()
          audits = (stage / f"audit/{case_name}.jsonl").read_bytes()
          module.common.VERIFIER.require_equal(
              module.common.VERIFIER.digest_bytes(observations), context["observationSha256"],
              "collector observation digest",
          )
          module.common.VERIFIER.require_equal(
              module.common.VERIFIER.digest_bytes(audits), context["auditSha256"],
              "collector audit digest",
          )
          snapshot, snapshot_raw = module.common.VERIFIER.load_canonical_matrix_jsonl(
              observations, "case observation", (case_name,),
          )[case_name]
          audit, audit_raw = module.common.VERIFIER.load_canonical_matrix_jsonl(
              audits, "case audit", (case_name,),
          )[case_name]
          module.build_termination_case(
              context, case_name, snapshot, snapshot_raw, audit, audit_raw,
          )
          PY
          sha256sum "$stage/context.json" "$stage/observations/$CASE_NAME.jsonl" \
            "$stage/audit/$CASE_NAME.jsonl" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact termination collector artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: faz22-6-view-only-viewer-termination-collector-${{ inputs.case_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/faz22-viewer-termination-collector/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 2

      - name: Remove transient protected runner material
        if: always()
        run: |
          rm -rf \
            "$RUNNER_TEMP/faz22-viewer-termination-${{ inputs.case_name }}" \
            "$RUNNER_TEMP/faz22-viewer-termination-authorization" \
            "$RUNNER_TEMP/faz22-viewer-termination-browser-root"

      # Per-case directories can contain transient HTTP bodies and runner logs.
      # They are intentionally never uploaded.
