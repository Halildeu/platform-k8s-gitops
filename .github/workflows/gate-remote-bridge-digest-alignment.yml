name: "Remote-bridge digest alignment (Faz 22.6 #2031)"

# Faz 22.6 durable re-drift guard (Codex 019f008a Q6, AGREE 2026-06-26). The remote-bridge
# activation overlay must render the SAME endpoint-admin-service digest as the primary test
# overlay (same-image pilot topology). The testai auto-sync now co-bumps the bridge whenever it
# bumps the primary endpoint-admin digest (sync-test-overlay.sh #2031), so auto-sync PRs stay
# aligned; this guard is the fail-closed enforcement that catches any PR (manual or regression)
# that bumps one side without the other, before the completion-audit REMOTE_BRIDGE_LIVE gate
# re-blocks at runtime (proven: 3015656f->5eff536b drifted within an hour of PR #2030).

on:
  pull_request:
    paths:
      - 'kustomize/overlays/test/**'
      - 'kustomize/base/apps/endpoint-admin-service/**'
      - 'kustomize/base/apps/endpoint-admin-remote-bridge/**'
      - 'scripts/governance/check-remote-bridge-digest-alignment.sh'
      - '.github/workflows/gate-remote-bridge-digest-alignment.yml'

permissions:
  contents: read

jobs:
  remote-bridge-digest-alignment:
    name: remote-bridge-digest-alignment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.3.0"

      - name: Assert remote-bridge digest == primary endpoint-admin digest
        run: bash scripts/governance/check-remote-bridge-digest-alignment.sh
