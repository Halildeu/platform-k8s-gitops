name: Faz 24 Desktop Capture Operator Handoff

# Builds a metadata-only operator handoff package for platform-k8s-gitops#1615
# desktop microphone + loopback evidence. This workflow does not run the
# desktop app, read tokens, connect to testai, mutate Kubernetes, touch Vault,
# send audio, or collect live evidence.

on:
  workflow_dispatch:
    inputs:
      operator_batch_id:
        description: "Symbolic operator batch id"
        required: true
        default: "faz24-desktop-capture-20260628"
      gitops_ref:
        description: "Git ref used by follow-up ingest workflows"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: faz24-desktop-capture-operator-handoff
  cancel-in-progress: false

jobs:
  package:
    name: build desktop capture operator handoff package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      HANDOFF_DIR: /tmp/faz24-desktop-capture-operator-handoff-${{ github.run_id }}

    steps:
      - name: Validate dispatch inputs
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
        run: |
          set -euo pipefail

          reject_multiline() {
            name="$1"
            value="$2"
            case "${value}" in
              *$'\n'*|*$'\r'*)
                echo "::error::${name} must be single-line"
                exit 1
                ;;
            esac
          }

          reject_unsupported_chars() {
            name="$1"
            value="$2"
            if ! printf '%s' "${value}" | grep -Eq '^[A-Za-z0-9_.:@/+~-]+$'; then
              echo "::error::${name} contains unsupported characters"
              exit 1
            fi
          }

          reject_path_escape() {
            name="$1"
            value="$2"
            if printf '%s' "${value}" | grep -Eq '(^/|(^|/)\.\.(/|$)|^[A-Za-z]:)'; then
              echo "::error::${name} must stay inside the handoff boundary"
              exit 1
            fi
          }

          reject_multiline operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_multiline gitops_ref "${GITOPS_REF}"
          reject_unsupported_chars operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_unsupported_chars gitops_ref "${GITOPS_REF}"
          reject_path_escape operator_batch_id "${OPERATOR_BATCH_ID}"
          reject_path_escape gitops_ref "${GITOPS_REF}"

          all_inputs="${OPERATOR_BATCH_ID}${GITOPS_REF}"
          if printf '%s' "${all_inputs}" | grep -Eq -- '-----BEGIN .*PRIVATE KEY-----|-----BEGIN CERTIFICATE-----|Bearer |eyJ[A-Za-z0-9_-]+\.'; then
            echo "::error::inputs must not contain certificate/private/secret-like material"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build handoff package
        env:
          OPERATOR_BATCH_ID: ${{ inputs.operator_batch_id }}
          GITOPS_REF: ${{ inputs.gitops_ref }}
        run: |
          set -euo pipefail
          python3 scripts/faz24/build-desktop-capture-operator-handoff.py \
            --output-dir "${HANDOFF_DIR}" \
            --operator-batch-id "${OPERATOR_BATCH_ID}" \
            --gitops-ref "${GITOPS_REF}"

      - name: Verify handoff artifact boundary
        run: |
          set -euo pipefail
          test -s "${HANDOFF_DIR}/README.md"
          test -s "${HANDOFF_DIR}/faz24-desktop-capture-operator-handoff.json"
          test -s "${HANDOFF_DIR}/SHA256SUMS"
          if grep -R -E -- '-----BEGIN (CERTIFICATE|OPENSSH |RSA |EC |DSA )|-----END (CERTIFICATE|OPENSSH |RSA |EC |DSA )|Bearer |eyJ[A-Za-z0-9_-]+\.|data:audio/[A-Za-z0-9.+-]+;base64,' "${HANDOFF_DIR}"; then
            echo "::error::handoff artifact contains forbidden certificate/private/token/raw-audio-like material"
            exit 1
          fi
          (cd "${HANDOFF_DIR}" && sha256sum --check SHA256SUMS)
          python3 - <<'PY' "${HANDOFF_DIR}/faz24-desktop-capture-operator-handoff.json"
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["schemaVersion"] == "faz24.desktopCapture.operator-handoff.v1"
          assert data["acceptanceBoundary"]["operatorExecutionRequired"] is True
          assert data["acceptanceBoundary"]["realDesktopRunRequired"] is True
          assert data["acceptanceBoundary"]["microphoneRealDeviceRequired"] is True
          assert data["acceptanceBoundary"]["loopbackRealDeviceRequired"] is True
          assert data["acceptanceBoundary"]["verifierPassRequired"] is True
          assert data["mutationBoundary"]["packageBuildDesktopMutation"] is False
          assert data["mutationBoundary"]["containsCredentials"] is False
          assert data["mutationBoundary"]["containsRawAudio"] is False
          assert data["mutationBoundary"]["containsDeviceLabels"] is False
          PY

      - name: Write workflow summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Faz 24 desktop capture operator handoff"
            echo
            echo "- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Artifact: \`faz24-desktop-capture-operator-handoff-${{ github.run_id }}\`"
            echo "- GitOps issue: #1615"
            echo
            echo "Boundary: metadata-only coordination artifact. It does not run the desktop app, read tokens, connect to testai, mutate Kubernetes/Vault/production, send audio, collect live evidence, or mark #1615 accepted."
            echo
            if [ -s "${HANDOFF_DIR}/README.md" ]; then
              sed -n '1,200p' "${HANDOFF_DIR}/README.md"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload handoff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: faz24-desktop-capture-operator-handoff-${{ github.run_id }}
          path: ${{ env.HANDOFF_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup local handoff directory
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${HANDOFF_DIR}"
