permissions:
  contents: read

concurrency:
  group: gate-faz22-view-only-evidence-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier-regression:
    name: Verify VIEW_ONLY evidence manifest guard and package generator
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install JSON Schema and Ed25519 verifier dependencies
        run: python3 -m pip install --quiet jsonschema==4.25.1 cryptography==46.0.7

      - name: Parse completion audit and verifier test
        run: |
          set -euo pipefail
          bash -n \
            scripts/faz22-remote-ops/faz22-6-completion-audit.sh \
            scripts/faz22-remote-ops/faz22-6-denetim-ssh-preflight.sh \
            scripts/faz22-remote-ops/faz22-6-view-only-attended-smoke.sh \
            scripts/faz22-remote-ops/faz22-6-view-only-evidence-package.sh \
            scripts/test/faz22-6-acceptance-package-workflows-static.sh \
            tests/faz22_remote_ops/test_faz22_6_denetim_ssh_preflight_workflow.sh \
            tests/faz22_remote_ops/test_faz22_6_view_only_attended_smoke_runner.sh \
            tests/faz22_remote_ops/test_faz22_6_view_only_evidence_verifier.sh \
            tests/faz22_remote_ops/test_faz22_6_view_only_evidence_package.sh \
            tests/faz22_remote_ops/test_faz22_6_view_only_split_gate.sh
          python3 -m py_compile \
            scripts/faz22-remote-ops/assemble-view-only-viewer-product-evidence.py \
            scripts/faz22-remote-ops/produce-view-only-viewer-operator-evidence.py \
            scripts/faz22-remote-ops/produce-view-only-viewer-d30-evidence.py \
            scripts/faz22-remote-ops/produce-view-only-viewer-broker-evidence.py \
            scripts/faz22-remote-ops/produce-view-only-viewer-audit-evidence.py \
            scripts/faz22-remote-ops/produce-view-only-viewer-matrix-evidence.py \
            scripts/faz22-remote-ops/build-view-only-viewer-audit-summary.py \
            scripts/faz22-remote-ops/view_only_viewer_source_common.py \
            scripts/faz22-remote-ops/build-view-only-viewer-frame-flow-summary.py \
            scripts/faz22-remote-ops/extract-exact-zip.py \
            scripts/faz22-remote-ops/verify-denetim-ssh-key-evidence.py \
            scripts/faz22-remote-ops/verify-view-only-viewer-product-evidence.py \
            scripts/faz22-remote-ops/verify-view-only-kvkk-decision.py

      - name: Run exact ZIP extraction regression test
        run: python3 -m unittest tests.faz22_remote_ops.test_extract_exact_zip

      - name: Run Denetim SSH preflight workflow regression test
        run: |
          set -euo pipefail
          TMPDIR="$RUNNER_TEMP" \
            tests/faz22_remote_ops/test_faz22_6_denetim_ssh_preflight_workflow.sh

      - name: Run Denetim SSH key evidence verifier regression test
        run: |
          set -euo pipefail
          python3 -m unittest tests.faz22_remote_ops.test_faz22_6_denetim_ssh_key_evidence_verifier

      - name: Run VIEW_ONLY attended smoke runner regression test
        run: |
          set -euo pipefail
          TMPDIR="$RUNNER_TEMP" \
            tests/faz22_remote_ops/test_faz22_6_view_only_attended_smoke_runner.sh

      - name: Run VIEW_ONLY evidence verifier regression test
        run: |
          set -euo pipefail
          TMPDIR="$RUNNER_TEMP" \
            tests/faz22_remote_ops/test_faz22_6_view_only_evidence_verifier.sh

      - name: Run VIEW_ONLY evidence package generator regression test
        run: |
          set -euo pipefail
          TMPDIR="$RUNNER_TEMP" \
            tests/faz22_remote_ops/test_faz22_6_view_only_evidence_package.sh

      - name: Run VIEW_ONLY split-gate (engineering vs KVKK) regression test
        run: |
          set -euo pipefail
          TMPDIR="$RUNNER_TEMP" \
            tests/faz22_remote_ops/test_faz22_6_view_only_split_gate.sh

      - name: Run VIEW_ONLY viewer product evidence verifier regression test
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.faz22_remote_ops.test_faz22_6_viewer_product_evidence_verifier

      - name: Run VIEW_ONLY viewer product evidence assembler regression test
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.faz22_remote_ops.test_faz22_6_viewer_product_evidence_assembler

      - name: Run VIEW_ONLY operator evidence producer regression test
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.faz22_remote_ops.test_faz22_6_viewer_operator_evidence_producer

      - name: Run VIEW_ONLY D30 evidence producer regression test
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.faz22_remote_ops.test_faz22_6_viewer_d30_evidence_producer

      - name: Run VIEW_ONLY frame-flow summary regression test
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.faz22_remote_ops.test_faz22_6_viewer_frame_flow_summary

      - name: Run VIEW_ONLY broker evidence producer regression test
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.faz22_remote_ops.test_faz22_6_viewer_broker_evidence_producer

      - name: Run VIEW_ONLY audit evidence regressions
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.faz22_remote_ops.test_faz22_6_viewer_audit_evidence_producer \
            tests.faz22_remote_ops.test_faz22_6_viewer_audit_summary

      - name: Run VIEW_ONLY matrix evidence producer regressions
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.faz22_remote_ops.test_faz22_6_viewer_matrix_evidence_producer \
            tests.faz22_remote_ops.test_faz22_6_viewer_negative_matrix_collector

      - name: Run VIEW_ONLY KVKK signed-decision verifier regression test
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests.faz22_remote_ops.test_faz22_6_view_only_kvkk_decision
