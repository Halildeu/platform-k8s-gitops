name: Faz 22.6 VIEW_ONLY viewer browser evidence

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Required literal: RUN_FAZ22_6_VIEW_ONLY_VIEWER_BROWSER_EVIDENCE"
        required: true
        type: string
      activation_run_id:
        description: "Successful protected apply-view-only-viewer-pilot-enable run ID"
        required: true
        type: string
      device_id:
        description: "Consented attended-pilot device UUID"
        required: true
        type: string
      device_hostname:
        description: "Consented attended-pilot device hostname"
        required: true
        type: string
      pilot_seconds:
        description: "Bounded product observation window"
        required: true
        default: "300"
        type: choice
        options: ["300", "600", "900", "1200", "1800"]
      mask_rect_bps:
        description: "Expected endpoint DLP mask x,y,width,height in primary-monitor basis points"
        required: true
        default: "7500,7500,2500,2500"
        type: string

permissions:
  contents: read

concurrency:
  group: faz22-6-view-only-viewer-browser-evidence
  cancel-in-progress: false

jobs:
  browser-evidence:
    name: Attended testai browser render and ACK evidence
    runs-on: [self-hosted, staging-sw, testai-deploy]
    timeout-minutes: 45
    environment:
      name: faz22-view-only-pilot

    steps:
      - name: Validate bounded dispatch
        env:
          CONFIRM: ${{ inputs.confirm }}
          ACTIVATION_RUN_ID: ${{ inputs.activation_run_id }}
          DEVICE_ID: ${{ inputs.device_id }}
          DEVICE_HOSTNAME: ${{ inputs.device_hostname }}
          PILOT_SECONDS: ${{ inputs.pilot_seconds }}
          MASK_RECT_BPS: ${{ inputs.mask_rect_bps }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "RUN_FAZ22_6_VIEW_ONLY_VIEWER_BROWSER_EVIDENCE" ] || {
            echo "::error::invalid confirmation literal"
            exit 2
          }
          printf '%s' "$ACTIVATION_RUN_ID" | grep -Eq '^[1-9][0-9]{5,19}$' || {
            echo "::error::activation_run_id must be a GitHub Actions run ID"
            exit 2
          }
          printf '%s' "$DEVICE_ID" | grep -Eq '^[0-9a-fA-F-]{36}$' || {
            echo "::error::device_id must be a UUID"
            exit 2
          }
          printf '%s' "$DEVICE_HOSTNAME" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{1,126}$' || {
            echo "::error::device_hostname is invalid"
            exit 2
          }
          case "$PILOT_SECONDS" in 300|600|900|1200|1800) ;; *) exit 2 ;; esac
          printf '%s' "$MASK_RECT_BPS" | grep -Eq '^[0-9]{1,5},[0-9]{1,5},[0-9]{1,5},[0-9]{1,5}$' || {
            echo "::error::mask_rect_bps must be canonical x,y,width,height"
            exit 2
          }

      - name: Checkout evidence producer revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify protected activation authorization receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVATION_RUN_ID: ${{ inputs.activation_run_id }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/faz22-viewer-activation"
          mkdir -p "$out"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACTIVATION_RUN_ID" > "$out/run.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .status == "completed"
            and .conclusion == "success"
            and .event == "workflow_dispatch"
            and .head_branch == "main"
            and .head_sha == $sha
            and .name == "Apply #2373 VIEW_ONLY viewer product pilot surface"
            and .path == ".github/workflows/apply-view-only-viewer-pilot-enable.yml"
          ' "$out/run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ACTIVATION_RUN_ID/artifacts?per_page=100" \
            > "$out/artifacts.json"
          expected="faz22-view-only-pilot-protected-authorization-$ACTIVATION_RUN_ID"
          jq -e --arg name "$expected" '
            [.artifacts[] | select(.name == $name and .expired == false)] | length == 1
          ' "$out/artifacts.json" >/dev/null
          artifact_id="$(jq -r --arg name "$expected" '.artifacts[] | select(.name == $name) | .id' "$out/artifacts.json")"
          artifact_digest="$(jq -r --arg name "$expected" '.artifacts[] | select(.name == $name) | .digest' "$out/artifacts.json")"
          printf '%s' "$artifact_digest" | grep -Eq '^sha256:[a-f0-9]{64}$'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$out/authorization.zip"
          [ "sha256:$(sha256sum "$out/authorization.zip" | awk '{print $1}')" = "$artifact_digest" ]
          printf '%s\n' \
            SHA256SUMS \
            protected-authorization.json \
            | sort > "$out/expected-files.txt"
          unzip -Z1 "$out/authorization.zip" | sort > "$out/actual-files.txt"
          diff -u "$out/expected-files.txt" "$out/actual-files.txt"
          unzip -q "$out/authorization.zip" -d "$out/receipt"
          (cd "$out/receipt" && sha256sum -c SHA256SUMS)
          python3 scripts/faz22-remote-ops/verify-view-only-pilot-authorization-receipt.py \
            --receipt "$out/receipt/protected-authorization.json" \
            --policy config/faz22-6-view-only-pilot-owner-policy.v1.json \
            --revocations config/faz22-6-view-only-pilot-authorization-revocations.v1.json \
            --expected-run-id "$ACTIVATION_RUN_ID" \
            --expected-head-sha "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install pinned browser harness runtime
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/faz22-viewer-playwright"
          mkdir -p "$runtime"
          npm --prefix "$runtime" init --yes >/dev/null
          npm --prefix "$runtime" install --no-audit --no-fund --save-exact playwright@1.60.0
          npm --prefix "$runtime" exec playwright install chromium

      - name: Verify live watchdog binding and pilot headroom
        env:
          PILOT_SECONDS: ${{ inputs.pilot_seconds }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/faz22-viewer-activation/receipt/protected-authorization.json"
          expected_authorization="sha256:$(sha256sum "$receipt" | awk '{print $1}')"
          watchdog_authorization="$(kubectl --context=k3d-test -n platform-test \
            get job faz22-view-only-pilot-watchdog \
            -o jsonpath='{.metadata.annotations.faz22\.6\.acik\.com/authorization-sha256}')"
          expires_epoch="$(kubectl --context=k3d-test -n platform-test \
            get job faz22-view-only-pilot-watchdog \
            -o jsonpath='{.metadata.annotations.faz22\.6\.acik\.com/expires-at-epoch}')"
          [ "$watchdog_authorization" = "$expected_authorization" ] || {
            echo "::error::live watchdog is not bound to the verified activation receipt"
            exit 1
          }
          printf '%s' "$expires_epoch" | grep -Eq '^[1-9][0-9]{9,12}$'
          remaining="$(( expires_epoch - $(date -u +%s) ))"
          required="$(( PILOT_SECONDS + 120 ))"
          [ "$remaining" -ge "$required" ] || {
            echo "::error::watchdog has ${remaining}s remaining; ${required}s is required"
            exit 1
          }

      - name: Run attended product-channel collector
        env:
          KC_TEST_ADMIN_PASSWORD: ${{ secrets.KC_TEST_ADMIN_PASSWORD }}
          EMIT_GITHUB_MASK_COMMANDS: "1"
          DEVICE_ID: ${{ inputs.device_id }}
          DEVICE_HOSTNAME: ${{ inputs.device_hostname }}
          PILOT_SECONDS: ${{ inputs.pilot_seconds }}
          PRODUCT_PILOT_SECONDS: ${{ inputs.pilot_seconds }}
          SOURCE_REVISION: ${{ github.sha }}
          BROWSER_EVIDENCE_SCRIPT: ${{ github.workspace }}/scripts/faz22-remote-ops/faz22-6-viewer-browser-evidence.mjs
          PLAYWRIGHT_PACKAGE_ROOT: ${{ runner.temp }}/faz22-viewer-playwright
          VIEWER_PRODUCT_BASE_URL: https://testai.acik.com
          REMOTE_BRIDGE_DEPLOYMENT: endpoint-admin-remote-bridge-device-key
          REQUIRE_ACTIVE_GUI: "1"
          DENETIM_SSH_TARGET: svc-denetim-agent@10.99.0.2
          EVIDENCE_DIR: ${{ runner.temp }}/faz22-viewer-browser-collector
          AUTO_FINALIZE: "0"
          DLP_MASK_RECT_BPS: ${{ inputs.mask_rect_bps }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          bash scripts/faz22-remote-ops/faz22-6-view-only-attended-smoke.sh
          test -s "$EVIDENCE_DIR/browser.json"
          test -s "$EVIDENCE_DIR/summary.json"
          test -s "$EVIDENCE_DIR/open-session.body"
          jq -e '
            .status == "accepted-candidate"
            and .consentWait == "granted"
            and (.brokerSignals | index("CONSENT_GRANTED") != null)
            and (.brokerSignals | index("CONSENT_DENIED") == null)
          ' "$EVIDENCE_DIR/summary.json" >/dev/null
          jq -e '.consentPromptSent == true' "$EVIDENCE_DIR/open-session.body" >/dev/null
          consent_session_id="$(jq -er '.sessionId' "$EVIDENCE_DIR/summary.json")"
          consent_log_line="$(grep -F "session=\"$consent_session_id\"" \
            "$EVIDENCE_DIR/endpoint-agent-relevant.log" | grep -F 'granted=true' | tail -n 1)"
          test -n "$consent_log_line"
          summary_sha256="sha256:$(sha256sum "$EVIDENCE_DIR/summary.json" | awk '{print $1}')"
          open_session_sha256="sha256:$(sha256sum "$EVIDENCE_DIR/open-session.body" | awk '{print $1}')"
          endpoint_consent_line_sha256="sha256:$(printf '%s' "$consent_log_line" | sha256sum | awk '{print $1}')"
          jq -cS -n \
            --slurpfile browser "$EVIDENCE_DIR/browser.json" \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg summarySha256 "$summary_sha256" \
            --arg openSessionSha256 "$open_session_sha256" \
            --arg endpointLineSha256 "$endpoint_consent_line_sha256" \
            '{
              schemaVersion:"faz22.6.viewOnlyViewerConsentSourceAttestation.v1",
              sourceRevision:$sourceRevision,
              observedAt:$browser[0].observedAt,
              binding:$browser[0].binding,
              smokeSummarySha256:$summarySha256,
              openSessionResponseSha256:$openSessionSha256,
              endpointConsentLogLineSha256:$endpointLineSha256,
              openSessionConsentPromptSent:true,
              brokerHelloVerified:true,
              brokerConsentGranted:true,
              endpointConsentGranted:true,
              transportPushed:true
            }' > "$EVIDENCE_DIR/consent-source.json"
          consent_source_sha256="sha256:$(sha256sum "$EVIDENCE_DIR/consent-source.json" | awk '{print $1}')"
          jq -cS -n \
            --slurpfile browser "$EVIDENCE_DIR/browser.json" \
            --arg sourceRevision "$SOURCE_REVISION" \
            --arg sourceAttestationSha256 "$consent_source_sha256" \
            '{
              schemaVersion:"faz22.6.viewOnlyViewerConsentEvidence.v1",
              sourceRevision:$sourceRevision,
              observedAt:$browser[0].observedAt,
              binding:$browser[0].binding,
              consentPromptSent:true,
              decision:"granted",
              decisionSignal:"CONSENT_GRANTED",
              decisionProtocol:"remote-bridge-consent-signal-v1",
              decisionSource:"device-key-attested-endpoint-outbound-channel",
              sourceAttestationSha256:$sourceAttestationSha256,
              pilotAutoConsent:false,
              recordingMode:"disabled",
              screenContentPersisted:false
            }' > "$EVIDENCE_DIR/consent.json"
          consent_sha256="sha256:$(sha256sum "$EVIDENCE_DIR/consent.json" | awk '{print $1}')"
          jq --arg digest "$consent_sha256" '.payload.consentEvidenceSha256 = $digest' \
            "$EVIDENCE_DIR/browser.json" | jq -S . > "$EVIDENCE_DIR/browser.json.tmp"
          mv "$EVIDENCE_DIR/browser.json.tmp" "$EVIDENCE_DIR/browser.json"
          jq -e '
            .schemaVersion == "faz22.6.viewOnlyViewerProductChildEvidence.v2"
            and .evidenceType == "browser"
            and .sourceRevision == env.SOURCE_REVISION
            and .payload.renderAckAcceptedCount >= 100
            and .payload.renderAckAcceptedCount == .payload.renderAckAttemptedCount
          ' "$EVIDENCE_DIR/browser.json" >/dev/null

      - name: Stage exact redacted source artifact
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/faz22-viewer-browser-collector
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/faz22-viewer-browser-source"
          mkdir -p "$source_dir/evidence"
          install -m 0600 "$EVIDENCE_DIR/browser.json" "$source_dir/evidence/browser.json"
          install -m 0600 "$EVIDENCE_DIR/consent.json" "$source_dir/evidence/consent.json"
          install -m 0600 "$EVIDENCE_DIR/consent-source.json" "$source_dir/evidence/consent-source.json"
          jq -e --slurpfile authorization "$RUNNER_TEMP/faz22-viewer-activation/receipt/protected-authorization.json" '
            .binding.operatorSha256 == $authorization[0].operatorSha256
            and .binding.deviceSha256 == $authorization[0].deviceSha256
          ' "$source_dir/evidence/browser.json" >/dev/null
          test "$(find "$source_dir" -type f | wc -l | tr -d ' ')" = "3"
          sha256sum "$source_dir/evidence/browser.json" "$source_dir/evidence/consent.json" \
            "$source_dir/evidence/consent-source.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload browser source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: faz22-6-view-only-viewer-browser-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/faz22-viewer-browser-source/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Stage allowlisted runtime snapshots
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/faz22-viewer-browser-collector
        run: |
          set -euo pipefail
          snapshot_dir="$RUNNER_TEMP/faz22-viewer-runtime-snapshots/snapshots"
          mkdir -p "$snapshot_dir"
          for name in metrics-before.prom metrics-after.prom d30-snapshot.json frame-flow-summary.json audit-summary.json; do
            test -s "$EVIDENCE_DIR/$name"
            install -m 0600 "$EVIDENCE_DIR/$name" "$snapshot_dir/$name"
          done
          (
            cd "$(dirname "$snapshot_dir")"
            sha256sum snapshots/d30-snapshot.json snapshots/frame-flow-summary.json \
              snapshots/audit-summary.json snapshots/metrics-after.prom snapshots/metrics-before.prom \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          test "$(find "$(dirname "$snapshot_dir")" -type f | wc -l | tr -d ' ')" = "6"
          if grep -Eiq 'Bearer |data:image/|BEGIN .*PRIVATE KEY|viewer-sse|sessionId|deviceId|operatorId' \
              "${snapshot_dir}"/*; then
            echo "::error::runtime snapshot allowlist contains forbidden raw content"
            exit 1
          fi

      - name: Upload allowlisted runtime snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: faz22-6-view-only-viewer-runtime-snapshots-${{ github.run_id }}
          path: ${{ runner.temp }}/faz22-viewer-runtime-snapshots/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 2

      # The collector directory contains the transient SSE response body used by
      # the attended harness. It is intentionally never uploaded: even a short
      # retention period would persist raw screen frames outside the product's
      # recording-off boundary. Only the strict browser child above may leave
      # the self-hosted runner.
