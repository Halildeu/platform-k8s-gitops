name: Faz 24 backend preflight

# Least-privilege GITHUB_TOKEN — read-only smoke never opens PRs, comments,
# creates releases, or writes to any repo scope. CodeQL Actions rule 27.
permissions:
  contents: read

# Runs the non-attended backend preflight against k3d-test.
#
# Runs on-demand + nightly to catch handshake regressions BEFORE Zeynep hits them.
# The script itself is scripts/faz24-live-e2e-smoke.sh — reuse locally on staging-sw
# with `bash scripts/faz24-live-e2e-smoke.sh` (needs vault-test root token + kubectl).
#
# HTTP 4xx is not handshake evidence: only HTTP 101 passes the WebSocket gate.
# Success still does not equal Zeynep smoke acceptance; packaged desktop, real
# mic, transcript, stop, persistence and reopen remain the user-journey gate.

on:
  workflow_dispatch:
  schedule:
    # Nightly 02:00 UTC → k3d-test quiet window
    - cron: '0 2 * * *'
  pull_request:
    paths:
      - 'kustomize/overlays/test/audio-gateway/**'
      - 'kustomize/overlays/test/meeting-service/**'
      - 'kustomize/overlays/test/transcript-service/**'
      - 'kustomize/overlays/test/audit-event-consumer-service/**'
      - 'kustomize/base/apps/audio-gateway/**'
      - 'kustomize/base/apps/meeting-service/**'
      - 'kustomize/base/apps/transcript-service/**'
      - 'kustomize/base/apps/audit-event-consumer-service/**'
      - 'scripts/faz24-live-e2e-smoke.sh'
      - '.github/workflows/faz24-live-e2e-smoke.yml'

jobs:
  backend-preflight:
    runs-on: [self-hosted, staging-sw]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull requests validate the fail-closed harness itself. Running the live
      # gate here would make a fix for a known TEST outage depend on that outage.
      - name: Validate backend preflight harness
        if: github.event_name == 'pull_request'
        run: |
          bash -n scripts/faz24-live-e2e-smoke.sh
          shellcheck scripts/faz24-live-e2e-smoke.sh

      - name: Run Faz 24 backend preflight on staging-sw
        if: github.event_name != 'pull_request'
        env:
          KUBE_CTX: k3d-test
          KUBE_NS: platform-test
          TESTAI_BASE: https://testai.acik.com
        run: bash scripts/faz24-live-e2e-smoke.sh
