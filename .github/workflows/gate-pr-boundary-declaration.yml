# ADR-0011 BG-1 — PR boundary declaration CI gate (Codex 019dd409 PARTIAL/REVISE)
# BG-1.1 follow-up: dependabot coverage gap fix (Codex 019dd409 A-prime)
#
# Per-PR governance hard gate: PR description must contain the ADR-0011
# §2.3 boundary declaration block + 7 expected classes + at least one
# marked + user-approval evidence + label for credential-read/write/
# state-mutation-prod/boundary-cross/user-communication classes.
#
# Trigger: `pull_request_target` (BG-1.1) — fires on dependabot PRs as well,
# unlike `pull_request` which GitHub restricts for fork/dependabot security
# policy. Metadata-only validation (PR body + labels via event payload);
# NO PR HEAD checkout, NO secrets, NO write permissions.
#
# Authority: Codex consensus only (read-only PR metadata validation).

name: ADR-0011 BG-1 — PR Boundary Declaration

on:
  pull_request_target:
    # `labeled`/`unlabeled` ensures the gate re-runs after operator adds
    # `user-approval-required` label.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  boundary-declaration:
    name: ADR-0011 BG-1 — PR boundary declaration validate
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout base repository (BG-1.2 — base ref HEAD, NOT PR HEAD)
        uses: actions/checkout@v7
        with:
          # Trusted: base BRANCH HEAD (main HEAD), NOT base SHA (PR fork-point).
          # BG-1.1 used base.sha but that pointed to old commits for stale
          # dependabot PRs (script file didn't exist in fork-point commit).
          # BG-1.2 fix: base.ref → main HEAD → güncel script + workflow.
          # PR HEAD checkout YASAK (pull_request_target security pattern).
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # #898 — Dependabot exemption diff-allowlist gate needs the PR file list.
      # `gh api ... --paginate` over the already-granted read-only
      # `pull-requests: read` permission. No head checkout, no token scope
      # expansion — `pull_request_target` security model preserved.
      - name: Fetch changed files (paginated, read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' > /tmp/changed-files.txt
          echo "PR files:"
          cat /tmp/changed-files.txt

      - name: Validate PR boundary declaration (event payload)
        # #898: `--changed-files-file` feeds the Dependabot exemption diff
        # allowlist gate. For non-Dependabot PRs the dispatch falls through to
        # the normal `run_all_checks()` body audit and the flag is unused.
        run: |
          python3 scripts/governance/check_pr_boundary_declaration.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --changed-files-file /tmp/changed-files.txt \
            --verbose

      - name: BG-1 JSON artifact
        if: always()
        # #898 Codex `019e4523` non-blocking guardrail: artifact step must also
        # carry `--changed-files-file` so the JSON output is semantically the
        # same as the human-readable output (both lanes consistent).
        run: |
          python3 scripts/governance/check_pr_boundary_declaration.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --changed-files-file /tmp/changed-files.txt \
            --json > /tmp/bg-1-report.json || true
          cat /tmp/bg-1-report.json

      - name: Upload BG-1 report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bg-1-boundary-declaration-report
          path: /tmp/bg-1-report.json
          retention-days: 7

      - name: Run unit tests
        run: |
          python3 -m unittest tests.governance.test_check_pr_boundary_declaration -v
