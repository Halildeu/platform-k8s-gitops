name: Deploy frontend prod (manual)

# Sprint "Prod post-cutover compliance" PR-3:
# Frontend prod deploy workflow — production environment gate'li manuel.
#
# Hedef: D30 atomic cutover sonrası frontend prod güncellemeleri için
# disiplinli manuel akış. Test'in repository_dispatch auto-trigger
# pattern'i prod'a TAŞINMAZ:
#
#   - Yalnız `workflow_dispatch` (manuel)
#   - `environment: production` (GitHub UI required reviewers gate)
#   - Strict digest mode: `image_digest` zorunlu
#   - Multi-replica strict verification helper (PR #304)
#   - 4 verify gate (1a digest match, 1b ai.acik.com edge chain,
#     1c build-info.json sha match, 2 Playwright opt-in)
#   - Concurrency lock: aynı anda iki prod frontend deploy çalışmaz

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Frontend commit sha (40-char)'
        required: true
      short_sha:
        description: 'Short sha (7-char)'
        required: true
      image:
        description: 'GHCR image base (örn. ghcr.io/halildeu/platform-web-frontend)'
        required: true
      image_tag:
        description: 'Image tag (örn. sha-abc1234)'
        required: true
      image_digest:
        description: 'Image digest (sha256:...) — REQUIRED for prod (no tag fallback)'
        required: true

permissions:
  contents: read

env:
  K8S_CONTEXT: k3d-prod
  K8S_NAMESPACE: platform-prod
  K8S_DEPLOYMENT: frontend
  K8S_LABEL_SELECTOR: app.kubernetes.io/name=frontend
  AI_URL: https://ai.acik.com

concurrency:
  group: prod-frontend-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (digest format validation, no cluster access)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      short_sha: ${{ steps.validate.outputs.short_sha }}
      image: ${{ steps.validate.outputs.image }}
      image_tag: ${{ steps.validate.outputs.image_tag }}
      image_digest: ${{ steps.validate.outputs.image_digest }}
      pinned_ref: ${{ steps.validate.outputs.pinned_ref }}
    steps:
      - name: Validate inputs (strict digest format)
        id: validate
        run: |
          set -euo pipefail
          SHA="${{ inputs.sha }}"
          SHORT_SHA="${{ inputs.short_sha }}"
          IMAGE="${{ inputs.image }}"
          IMAGE_TAG="${{ inputs.image_tag }}"
          IMAGE_DIGEST="${{ inputs.image_digest }}"

          # Format checks
          if ! [[ "${SHA}" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::sha must be 40-char hex (got: ${SHA})"
            exit 1
          fi
          if ! [[ "${SHORT_SHA}" =~ ^[a-f0-9]{7}$ ]]; then
            echo "::error::short_sha must be 7-char hex (got: ${SHORT_SHA})"
            exit 1
          fi
          if [[ "${SHORT_SHA}" != "${SHA:0:7}" ]]; then
            echo "::error::short_sha must be sha[0:7] prefix"
            exit 1
          fi
          if ! [[ "${IMAGE_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::image_digest must be ^sha256:[a-f0-9]{64}$ (got: ${IMAGE_DIGEST})"
            exit 1
          fi

          PINNED_REF="${IMAGE}@${IMAGE_DIGEST}"

          {
            echo "sha=${SHA}"
            echo "short_sha=${SHORT_SHA}"
            echo "image=${IMAGE}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image_digest=${IMAGE_DIGEST}"
            echo "pinned_ref=${PINNED_REF}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Frontend prod deploy — preflight"
            echo "- sha: \`${SHA}\`"
            echo "- short_sha: \`${SHORT_SHA}\`"
            echo "- image: \`${IMAGE}\`"
            echo "- image_tag: \`${IMAGE_TAG}\`"
            echo "- digest: \`${IMAGE_DIGEST}\`"
            echo "- pinned_ref: \`${PINNED_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy frontend prod (digest-pin, multi-replica strict)
    needs: preflight
    runs-on: [self-hosted, staging-sw, prod-deploy]
    timeout-minutes: 15
    environment:
      name: production
      # GitHub Environment settings (UI'dan):
      #   - Required reviewers: 1+
      #   - Deployment branches: main only
    steps:
      - name: Checkout (verify-pod-digest helper)
        uses: actions/checkout@v6

      - name: kubectl set image (digest pin)
        env:
          PINNED_REF: ${{ needs.preflight.outputs.pinned_ref }}
        run: |
          set -euo pipefail
          kubectl --context="${K8S_CONTEXT}" set image \
            "deployment/${K8S_DEPLOYMENT}" \
            "${K8S_DEPLOYMENT}=${PINNED_REF}" \
            -n "${K8S_NAMESPACE}"

      - name: kubectl rollout status
        run: |
          set -euo pipefail
          kubectl --context="${K8S_CONTEXT}" rollout status \
            "deployment/${K8S_DEPLOYMENT}" \
            -n "${K8S_NAMESPACE}" \
            --timeout=300s

      - name: Gate 1a — multi-replica digest match (fail-fast)
        env:
          EXPECTED: ${{ needs.preflight.outputs.image_digest }}
        run: |
          set -euo pipefail
          # Multi-replica strict mode: prod replicas=2 her iki pod
          # expected digest match olmalı; eski ReplicaSet pod sızıntısı
          # yakalanır.
          ./scripts/deploy/verify-pod-digest.sh \
            --context "${K8S_CONTEXT}" \
            --namespace "${K8S_NAMESPACE}" \
            --selector "${K8S_LABEL_SELECTOR}" \
            --expected-digest "${EXPECTED}"

      - name: Gate 1b — ai.acik.com surface 200 + entry asset reachable
        run: |
          set -euo pipefail
          # iter-49 PR #303 retry pattern: brief ingress propagation race.
          # Module Federation refactor (platform-web 2026-05) renamed the
          # entry bundle from /assets/index-<hash>.js to /mf-entry-bootstrap-<n>.js
          # at the document root. Extract the actual src from the module
          # script tag instead of assuming the legacy path layout. ROOT_ENTRY
          # is the absolute path so it is appended verbatim — no /assets/ prefix.
          INDEX_BODY=""
          ROOT_ENTRY=""
          for attempt in 1 2 3 4 5; do
            INDEX_BODY=$(curl -sk "${AI_URL}/" || true)
            ROOT_ENTRY=$(echo "${INDEX_BODY}" \
              | grep -oE '<script[^>]+type="module"[^>]+src="[^"]+\.js"' \
              | grep -oE 'src="[^"]+"' \
              | head -1 \
              | sed -E 's/^src="//; s/"$//' || true)
            if [ -n "${ROOT_ENTRY}" ]; then
              echo "✓ index.html valid (attempt ${attempt}/5): entry=${ROOT_ENTRY}"
              break
            fi
            echo "⊘ attempt ${attempt}/5: retrying in 3s..."
            sleep 3
          done

          if [ -z "${ROOT_ENTRY}" ]; then
            echo "::error::Could not extract module entry script from /index.html after 5 retries"
            echo "${INDEX_BODY}" | head -50
            exit 1
          fi

          ASSET_STATUS=""
          for attempt in 1 2 3; do
            ASSET_STATUS=$(curl -sko /dev/null -w '%{http_code}' "${AI_URL}${ROOT_ENTRY}" || echo "000")
            if [ "${ASSET_STATUS}" = "200" ]; then
              break
            fi
            sleep 2
          done
          if [ "${ASSET_STATUS}" != "200" ]; then
            echo "::error::Root entry asset ${ROOT_ENTRY} returned ${ASSET_STATUS}"
            exit 1
          fi
          echo "✓ root entry asset reachable: ${ROOT_ENTRY} (HTTP ${ASSET_STATUS})"

      - name: Gate 1c — build-info.json sha match
        env:
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
          SHORT_SHA: ${{ needs.preflight.outputs.short_sha }}
        run: |
          set -euo pipefail
          # Public build-info.json frontend bundle source-of-truth.
          # iter-49 #303 retry pattern: brief propagation race.
          BUILD_INFO=""
          ACTUAL_SHA=""
          for attempt in 1 2 3 4 5; do
            BUILD_INFO=$(curl -sk "${AI_URL}/build-info.json" || true)
            ACTUAL_SHA=$(echo "${BUILD_INFO}" | jq -r '.sha // empty' 2>/dev/null || echo "")
            if [ -n "${ACTUAL_SHA}" ] && [ "${ACTUAL_SHA}" = "${EXPECTED_SHA}" ]; then
              echo "✓ build-info.json sha matches (attempt ${attempt}/5): ${ACTUAL_SHA}"
              break
            fi
            echo "⊘ attempt ${attempt}/5: actual=${ACTUAL_SHA} expected=${EXPECTED_SHA}, retrying in 3s..."
            sleep 3
          done
          if [ "${ACTUAL_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "::error::build-info.json sha mismatch after 5 retries"
            echo "  expected: ${EXPECTED_SHA}"
            echo "  actual:   ${ACTUAL_SHA}"
            echo "  short:    ${SHORT_SHA}"
            exit 1
          fi

      # Gate 2 (opt-in): Playwright behavior smoke
      - name: Gate 2 — Playwright behavior smoke (opt-in)
        run: |
          set -euo pipefail
          if [ ! -x "scripts/smoke/playwright-prod.sh" ]; then
            echo "::warning::Gate 2 (Playwright) skipped — scripts/smoke/playwright-prod.sh yok"
            exit 0
          fi
          ./scripts/smoke/playwright-prod.sh "${AI_URL}"

      - name: Summary
        if: always()
        env:
          SHA: ${{ needs.preflight.outputs.sha }}
          SHORT_SHA: ${{ needs.preflight.outputs.short_sha }}
          IMAGE: ${{ needs.preflight.outputs.image }}
          IMAGE_TAG: ${{ needs.preflight.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.preflight.outputs.image_digest }}
        run: |
          {
            echo ""
            echo "## Frontend PROD deploy verify chain"
            echo ""
            echo "- Preflight (input validation):       ✓"
            echo "- kubectl set image (digest pin):     ✓"
            echo "- kubectl rollout status:             ✓"
            echo "- Gate 1a (multi-replica digest):     ✓"
            echo "- Gate 1b (ai.acik.com edge chain):   ✓"
            echo "- Gate 1c (build-info.json sha):      ✓"
            echo ""
            echo "## Manual workflow_dispatch retry"
            echo ""
            echo '```bash'
            echo "gh workflow run deploy-frontend-prod.yml -R Halildeu/platform-k8s-gitops \\"
            echo "  -f sha=${SHA} \\"
            echo "  -f short_sha=${SHORT_SHA} \\"
            echo "  -f image=${IMAGE} \\"
            echo "  -f image_tag=${IMAGE_TAG} \\"
            echo "  -f image_digest=${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
