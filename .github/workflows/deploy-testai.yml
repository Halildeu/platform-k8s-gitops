name: Promote testai frontend desired state

# platform-web dispatches this workflow only after publishing an immutable
# testai image. The workflow opens/updates a reviewable desired-state PR; it
# never mutates a Kubernetes workload. Runtime reconciliation is performed by
# verify-testai-frontend-rollout.yml after that PR is reviewed and merged.

on:
  repository_dispatch:
    types: [testai-deploy]
  workflow_dispatch:
    inputs:
      sha:
        description: "Canonical platform-web commit SHA (40 lowercase hex)"
        required: true
      short_sha:
        description: "First seven characters of sha"
        required: true
      image_digest:
        description: "Immutable GHCR manifest digest (sha256:...)"
        required: true
      image:
        description: "Canonical testai frontend image"
        required: false
        default: "ghcr.io/halildeu/platform-web-frontend-testai"
      image_tag:
        description: "Source tag (sha-XXXXXXX)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: testai-frontend-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Open or update test overlay PR
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Resolve and validate immutable artifact payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_SHORT_SHA: ${{ inputs.short_sha }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_SHORT_SHA: ${{ github.event.client_payload.short_sha }}
          DISPATCH_IMAGE: ${{ github.event.client_payload.image }}
          DISPATCH_IMAGE_TAG: ${{ github.event.client_payload.image_tag }}
          DISPATCH_IMAGE_DIGEST: ${{ github.event.client_payload.image_digest }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            SHA="$INPUT_SHA"
            SHORT_SHA="$INPUT_SHORT_SHA"
            IMAGE="${INPUT_IMAGE:-ghcr.io/halildeu/platform-web-frontend-testai}"
            IMAGE_TAG="$INPUT_IMAGE_TAG"
            IMAGE_DIGEST="$INPUT_IMAGE_DIGEST"
          else
            SHA="$DISPATCH_SHA"
            SHORT_SHA="$DISPATCH_SHORT_SHA"
            IMAGE="$DISPATCH_IMAGE"
            IMAGE_TAG="$DISPATCH_IMAGE_TAG"
            IMAGE_DIGEST="$DISPATCH_IMAGE_DIGEST"
          fi

          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::sha must be 40 lowercase hex"; exit 1; }
          [[ "$SHORT_SHA" =~ ^[a-f0-9]{7}$ && "$SHORT_SHA" == "${SHA:0:7}" ]] || {
            echo "::error::short_sha must equal sha[0:7]"; exit 1;
          }
          [[ "$IMAGE" == "ghcr.io/halildeu/platform-web-frontend-testai" ]] || {
            echo "::error::noncanonical image rejected: $IMAGE"; exit 1;
          }
          IMAGE_TAG="${IMAGE_TAG:-sha-${SHORT_SHA}}"
          [[ "$IMAGE_TAG" == "sha-${SHORT_SHA}" ]] || {
            echo "::error::image_tag must equal sha-${SHORT_SHA}"; exit 1;
          }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::image_digest must match sha256:<64 lowercase hex>"; exit 1;
          }

          {
            echo "sha=$SHA"
            echo "short_sha=$SHORT_SHA"
            echo "image=$IMAGE"
            echo "image_tag=$IMAGE_TAG"
            echo "image_digest=$IMAGE_DIGEST"
          } >> "$GITHUB_OUTPUT"

      - name: Require platform-gitops-automation GitHub App credentials
        env:
          APP_ID: ${{ secrets.AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID:-}" || -z "${APP_PRIVATE_KEY:-}" ]]; then
            echo "::error title=desired-state promotion disabled::AUTOMATION_APP_ID and AUTOMATION_APP_PRIVATE_KEY are required."
            echo "No cluster mutation was attempted. See docs/operations/RUNBOOKS/RB-automation-overlay-sync.md and #2295."
            exit 1
          fi

      - name: Generate least-privilege GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout with App identity
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Open or update immutable frontend promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ steps.payload.outputs.sha }}
          SHORT_SHA: ${{ steps.payload.outputs.short_sha }}
          IMAGE: ${{ steps.payload.outputs.image }}
          IMAGE_TAG: ${{ steps.payload.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.payload.outputs.image_digest }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/automation/sync-test-overlay-frontend.sh

      - name: Promotion boundary summary
        if: always()
        env:
          SHA: ${{ steps.payload.outputs.sha }}
          IMAGE_TAG: ${{ steps.payload.outputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.payload.outputs.image_digest }}
        run: |
          {
            echo "## testai frontend desired-state promotion"
            echo ""
            echo "- source: \`${SHA:-unresolved}\`"
            echo "- tag: \`${IMAGE_TAG:-unresolved}\`"
            echo "- digest: \`${IMAGE_DIGEST:-unresolved}\`"
            echo "- direct Kubernetes workload mutation: **none**"
            echo "- runtime verification: after normal PR review + merge"
          } >> "$GITHUB_STEP_SUMMARY"
