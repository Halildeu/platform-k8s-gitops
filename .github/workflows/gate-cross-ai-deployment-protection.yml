      - "scripts/ai/post_cross_ai_evidence.py"
      - "scripts/ai/prepare_cross_ai_scope.py"
      - "scripts/ai/trusted_cross_ai_evidence.py"
      - "scripts/ai/verify_cross_ai_evidence_comment.py"
      - "scripts/ai/verify_cross_ai_authority_transition.py"
      - "tests/ai/signed_evidence_fixture.py"
      - "tests/ai/test_build_cross_ai_evidence.py"
      - "tests/ai/test_cross_ai_runtime_attestor_service.py"
      - "tests/ai/test_cross_ai_runtime_workload.py"
      - "tests/ai/test_prepare_cross_ai_scope.py"
      - "tests/ai/test_cross_ai_authority.py"
      - "tests/ai/test_post_cross_ai_evidence.py"
      - "scripts/faz22-remote-ops/**"
      - "kustomize/overlays/test/activation/cross-ai-deployment-protection-observe/**"
