      - ".github/workflows/gate-cross-ai-deployment-protection.yml"
      - ".github/workflows/cross-ai-provider-review-genesis.yml"

permissions:
  contents: read

jobs:
  fail-closed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require merge-commit auto-merge topology
        if: ${{ github.event_name == 'pull_request' }}
        env:
          AUTO_MERGE_METHOD: ${{ github.event.pull_request.auto_merge.merge_method }}
        run: |
          if [ "$AUTO_MERGE_METHOD" != "merge" ]; then
            echo "cross-ai gate: select merge-commit auto-merge; squash/rebase is forbidden" >&2
            exit 1
          fi

      - name: Checkout immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The contract proves that the action source commit is an ancestor of
          # HEAD and byte-identical. A depth-1 clone cannot make that proof.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install content-addressed verifier dependencies
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --requirement scripts/github_apps/cross_ai_deployment_policy/requirements.lock

      - name: Compile policy implementation
        run: >-
          python3 -m py_compile
          scripts/github_apps/cross_ai_deployment_policy/*.py
          scripts/github_apps/*.py
          scripts/ops/bootstrap_cross_ai_transit.py
          scripts/ops/build_cross_ai_test_trust_root.py
          scripts/ops/build_cross_ai_provider_review_revocations.py
          scripts/ai/build_cross_ai_evidence.py
          scripts/ai/cross_ai_runtime_authorization.py
          scripts/ai/cross_ai_runtime_attestor.py
          scripts/ai/cross_ai_runtime_attestor_service.py
          scripts/ai/cross_ai_runtime_workload.py
          scripts/ai/run_cross_ai_runtime_attestor.py
          scripts/ai/cross_ai_authority.py
          scripts/ai/post_cross_ai_evidence.py
          scripts/ai/prepare_cross_ai_scope.py
          scripts/ai/trusted_cross_ai_evidence.py
          scripts/ai/verify_cross_ai_evidence_comment.py
          scripts/ai/verify_cross_ai_authority_transition.py
          scripts/faz22-remote-ops/extract-cross-ai-browser-runtime.py
          tests/github_apps/*.py
          tests/ai/signed_evidence_fixture.py
          tests/ai/test_build_cross_ai_evidence.py
          tests/ai/test_cross_ai_runtime_attestor_service.py
          tests/ai/test_cross_ai_authority.py
          tests/ai/test_post_cross_ai_evidence.py

      - name: Lint TEST Vault and protected-stage shell
        run: >-
          shellcheck
          scripts/ops/vault-policy-reconcile.sh
          scripts/faz22-remote-ops/run-cross-ai-protected-view-only-stage.sh

      - name: Validate JSON schemas and example policy
        run: |
          for schema in schema/cross-ai-*.json; do
            jq -e . "$schema" >/dev/null
          done
          python3 - <<'PY'
          from pathlib import Path
          from scripts.github_apps.cross_ai_deployment_policy.policy import load_policy
          load_policy(Path("config/github-apps/cross-ai-deployment-policy.example.json"))
          PY

      - name: Run signed-evidence, replay and callback negative matrix
        run: |
          python3 -m unittest discover -s tests/github_apps -p 'test_*.py' -v
          python3 -m unittest \
            tests.ai.test_build_cross_ai_evidence \
            tests.ai.test_cross_ai_runtime_attestor_service \
            tests.ai.test_cross_ai_runtime_workload \
            tests.ai.test_cross_ai_authority \
            tests.ai.test_post_cross_ai_evidence \
            tests.ai.test_prepare_cross_ai_scope -v
