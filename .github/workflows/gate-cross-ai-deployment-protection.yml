name: Gate — signed Cross-AI deployment protection

on:
  pull_request:
    paths:
      - "schema/cross-ai-*.json"
      - "scripts/github_apps/**"
      - "tests/github_apps/**"
      - "config/github-apps/**"
      - "bootstrap/vault-policies/common/eso-runtime.hcl"
      - "bootstrap/vault-policies/test/cross-ai-*.hcl"
      - "bootstrap/vault-policies/test/vault-config-reconciler.hcl"
      - "scripts/ops/bootstrap_cross_ai_transit.py"
      - "scripts/ops/vault-policy-reconcile.sh"
      - "scripts/faz22-remote-ops/**"
      - "kustomize/overlays/test/activation/cross-ai-deployment-protection-observe/**"
      - "docs/adr/0045-signed-cross-ai-custom-deployment-protection-rule.md"
      - "docs/runbooks/RB-cross-ai-deployment-protection-rule.md"
      - ".github/actions/protected-apply/**"
      - ".github/actions/protected-bootstrap/**"
      - ".github/actions/protected-browser-evidence/**"
      - ".github/actions/protected-rollback/**"
      - ".github/workflows/apply-view-only-viewer-pilot-protected.yml"
      - ".github/workflows/faz22-6-view-only-viewer-browser-evidence-protected.yml"
      - ".github/workflows/rollback-view-only-viewer-pilot-protected.yml"
      - ".github/workflows/gate-cross-ai-deployment-protection.yml"
  push:
    branches: [main]
    paths:
      - "schema/cross-ai-*.json"
      - "scripts/github_apps/**"
      - "tests/github_apps/**"
      - "config/github-apps/**"
      - "bootstrap/vault-policies/common/eso-runtime.hcl"
      - "bootstrap/vault-policies/test/cross-ai-*.hcl"
      - "bootstrap/vault-policies/test/vault-config-reconciler.hcl"
      - "scripts/ops/bootstrap_cross_ai_transit.py"
      - "scripts/ops/vault-policy-reconcile.sh"
      - "scripts/faz22-remote-ops/**"
      - "kustomize/overlays/test/activation/cross-ai-deployment-protection-observe/**"
      - "docs/adr/0045-signed-cross-ai-custom-deployment-protection-rule.md"
      - "docs/runbooks/RB-cross-ai-deployment-protection-rule.md"
      - ".github/actions/protected-apply/**"
      - ".github/actions/protected-bootstrap/**"
      - ".github/actions/protected-browser-evidence/**"
      - ".github/actions/protected-rollback/**"
      - ".github/workflows/apply-view-only-viewer-pilot-protected.yml"
      - ".github/workflows/faz22-6-view-only-viewer-browser-evidence-protected.yml"
      - ".github/workflows/rollback-view-only-viewer-pilot-protected.yml"
      - ".github/workflows/gate-cross-ai-deployment-protection.yml"

permissions:
  contents: read

jobs:
  fail-closed-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install content-addressed verifier dependencies
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            --requirement scripts/github_apps/cross_ai_deployment_policy/requirements.lock

      - name: Compile policy implementation
        run: python3 -m py_compile scripts/github_apps/cross_ai_deployment_policy/*.py scripts/github_apps/*.py scripts/ops/bootstrap_cross_ai_transit.py scripts/faz22-remote-ops/extract-cross-ai-browser-runtime.py tests/github_apps/*.py

      - name: Lint TEST Vault and protected-stage shell
        run: >-
          shellcheck
          scripts/ops/vault-policy-reconcile.sh
          scripts/faz22-remote-ops/run-cross-ai-protected-view-only-stage.sh

      - name: Validate JSON schemas and example policy
        run: |
          for schema in schema/cross-ai-*.schema.json; do
            jq -e . "$schema" >/dev/null
          done
          python3 - <<'PY'
          from pathlib import Path
          from scripts.github_apps.cross_ai_deployment_policy.policy import load_policy
          load_policy(Path("config/github-apps/cross-ai-deployment-policy.example.json"))
          PY

      - name: Run signed-evidence, replay and callback negative matrix
        run: python3 -m unittest discover -s tests/github_apps -p 'test_*.py' -v
