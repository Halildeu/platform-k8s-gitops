name: Cross-AI protected VIEW_ONLY rollback
description: Execute the pre-signed compensating rollback and publish canonical outcome evidence.
runs:
  using: composite
  steps:
    - name: Execute fixed rollback stage
      id: execute
      shell: bash
      run: bash scripts/faz22-remote-ops/run-cross-ai-protected-view-only-stage.sh compensating-rollback

    - name: Build canonical rollback outcome evidence
      id: evidence
      if: ${{ always() }}
      shell: bash
      env:
        STAGE_CONCLUSION: ${{ steps.execute.outcome == 'success' && 'rolled-back' || 'failure' }}
      run: >-
        python3 scripts/github_apps/build_cross_ai_stage_evidence.py
        --bootstrap-file "$CROSS_AI_BOOTSTRAP_FILE"
        --stage compensating-rollback
        --conclusion "$STAGE_CONCLUSION"
        --output-dir "$RUNNER_TEMP/cross-ai-stage-outcome"
        --github-output "$GITHUB_OUTPUT"

    - name: Remove private bootstrap response
      id: cleanup
      if: ${{ always() }}
      shell: bash
      run: rm -f -- "$CROSS_AI_BOOTSTRAP_FILE"

    - name: Upload canonical rollback outcome evidence
      if: ${{ always() && steps.evidence.outcome == 'success' && steps.cleanup.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.evidence.outputs.artifact-name }}
        path: ${{ steps.evidence.outputs.evidence-file }}
        if-no-files-found: error
        include-hidden-files: false
        compression-level: 0
        retention-days: 30
