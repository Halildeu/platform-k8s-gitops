name: Cross-AI protected VIEW_ONLY browser evidence
description: Execute the fixed attended-consent browser stage and publish redacted evidence.
runs:
  using: composite
  steps:
    - name: Execute fixed attended browser stage
      id: execute
      shell: bash
      env:
        CROSS_AI_SOURCE_ROOT: ${{ github.action_path }}/../../..
        CROSS_AI_BOOTSTRAP_FILE: ${{ runner.temp }}/cross-ai-bootstrap.json
      run: |
        cd -- "$CROSS_AI_SOURCE_ROOT"
        bash scripts/faz22-remote-ops/run-cross-ai-protected-view-only-stage.sh browser-evidence

    - name: Upload redacted product browser evidence
      id: product_evidence
      if: ${{ steps.execute.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: faz22-6-view-only-viewer-browser-evidence-${{ github.run_id }}
        path: ${{ runner.temp }}/faz22-viewer-browser-source/
        if-no-files-found: error
        include-hidden-files: false
        compression-level: 0
        retention-days: 30

    - name: Build canonical browser outcome evidence
      id: evidence
      if: ${{ always() }}
      shell: bash
      env:
        STAGE_CONCLUSION: ${{ steps.execute.outcome == 'success' && steps.product_evidence.outcome == 'success' && 'success' || 'failure' }}
        PRODUCT_ARTIFACT_DIGEST_RAW: ${{ steps.product_evidence.outputs['artifact-digest'] }}
        CROSS_AI_SOURCE_ROOT: ${{ github.action_path }}/../../..
        CROSS_AI_BOOTSTRAP_FILE: ${{ runner.temp }}/cross-ai-bootstrap.json
      run: |
        cd -- "$CROSS_AI_SOURCE_ROOT"
        if [[ "$PRODUCT_ARTIFACT_DIGEST_RAW" =~ ^[a-f0-9]{64}$ ]]; then
          product_artifact_digest="sha256:$PRODUCT_ARTIFACT_DIGEST_RAW"
        elif [[ "$PRODUCT_ARTIFACT_DIGEST_RAW" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          product_artifact_digest="$PRODUCT_ARTIFACT_DIGEST_RAW"
        else
          echo "protected-browser-evidence: artifact digest is invalid" >&2
          exit 2
        fi
        python3 scripts/github_apps/build_cross_ai_stage_evidence.py \
          --bootstrap-file "$CROSS_AI_BOOTSTRAP_FILE" \
          --stage browser-evidence \
          --conclusion "$STAGE_CONCLUSION" \
          --product-artifact-id "${{ steps.product_evidence.outputs['artifact-id'] }}" \
          --product-artifact-digest "$product_artifact_digest" \
          --output-dir "$RUNNER_TEMP/cross-ai-stage-outcome" \
          --github-output "$GITHUB_OUTPUT"

    - name: Remove private bootstrap response
      id: cleanup
      if: ${{ always() }}
      shell: bash
      run: rm -f -- "$RUNNER_TEMP/cross-ai-bootstrap.json"

    - name: Upload canonical browser outcome evidence
      if: ${{ always() && steps.evidence.outcome == 'success' && steps.cleanup.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.evidence.outputs.artifact-name }}
        path: ${{ steps.evidence.outputs.evidence-file }}
        if-no-files-found: error
        include-hidden-files: false
        compression-level: 0
        retention-days: 30
