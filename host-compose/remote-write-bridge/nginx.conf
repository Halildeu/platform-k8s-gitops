# remote-write-bridge nginx — tek endpoint, auth'lu (gitops#1459)
worker_processes 1;
events { worker_connections 256; }

http {
  # Prometheus remote_write: snappy-compressed protobuf gövde.
  # Test cluster tam scrape'i batch'lerle gelir — 16m üst sınır bol.
  client_max_body_size 16m;

  # DoS guard L7 katmanı: test Prometheus default ~1 shard / 10s batch —
  # 50 r/s burst'lü sınır normal akışı etkilemez, flood'u keser.
  # Canli kalibrasyon 2026-06-12: 4 shard x ~20 req/s WAL-drain'de 50r/s'i
  # asti -> nginx 503 retry firtinasi. Normal akis ~80r/s; 200r/s+burst 400
  # DoS guard'i olarak hala anlamli.
  limit_req_zone $binary_remote_addr zone=rw:1m rate=200r/s;

  # Loki push (gitops#1462) — AYRI zone (Codex S1: hat izolasyonu). promtail
  # batch'leri Prometheus'tan daha az sık; 50r/s+burst 50 yeterli.
  limit_req_zone $binary_remote_addr zone=loki_push:1m rate=50r/s;

  # docker embedded DNS (compose network'leri) — k3d-prod-server-0 çözümü
  resolver 127.0.0.11 valid=30s;

  server {
    listen 9091;

    # Sağlık ucu (compose healthcheck + bridge Service probe'u) — auth'suz,
    # bilgi sızdırmaz.
    location = /healthz {
      return 200 "ok\n";
    }

    # TEK proxy endpoint'i: Prometheus remote_write receiver yolu.
    location = /api/v1/write {
      limit_req zone=rw burst=400 nodelay;

      auth_basic "remote-write";
      auth_basic_user_file /etc/nginx/htpasswd;

      # Yalnız POST (remote_write kontratı) — diğer metodlar 405.
      limit_except POST { deny all; }

      # k3d-prod NodePort (yalnız platform-prod-net bridge içi; host publish yok).
      # Container DNS adı kullanılır — node container recreate'inde IP değişse
      # de çözüm bozulmaz.
      set $backend "k3d-prod-server-0:30090";
      # Prod Prometheus routePrefix=/prometheus ile kosar — receiver yolu
      # /prometheus/api/v1/write (canli 404 bulgusu 2026-06-12; prefix'siz yok).
      proxy_pass http://$backend/prometheus/api/v1/write;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # Auth header'ı backend'e SIZDIRMA (receiver auth'suz; kimlik bilgisi
      # yalnız bu katmanda kalır).
      proxy_set_header Authorization "";
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # Loki push (gitops#1462) — AYRI auth (loki.htpasswd ≠ htpasswd; Codex S1
    # credential izolasyonu: metrics cred sızarsa logs yazılamasın). promtail
    # → bu location → prod Loki NodePort 30100.
    location = /loki/api/v1/push {
      limit_req zone=loki_push burst=50 nodelay;

      auth_basic "loki-push";
      auth_basic_user_file /etc/nginx/loki.htpasswd;

      limit_except POST { deny all; }

      client_max_body_size 8m;
      set $loki_backend "k3d-prod-server-0:30100";
      # Loki default API (routePrefix yok — canlı svc port http-metrics:3100).
      proxy_pass http://$loki_backend/loki/api/v1/push;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization "";
      proxy_set_header X-Scope-OrgID "";
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }

    # Diğer /loki/* yolları (query/admin) bridge'den ERİŞİLEMEZ (yüzey daraltma).
    location ^~ /loki/ {
      return 404;
    }

    # Geri kalan her şey: 404 (yüzey daraltma — Codex Must-Fix).
    location / {
      return 404;
    }
  }
}
