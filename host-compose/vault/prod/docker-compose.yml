# Vault Prod Instance — ADR-0002 Same-Host Full Isolation
# KV v2 + AppRole auth + audit backend
# Storage: Raft (local filesystem), single-node (forward-extension: replication)
# Network: platform-prod-net
# Port: 8200 (prod)
# Container: platform-vault-prod
# Seal: manual unseal (HSM yok — ADR §3.6; forward-extension: transit seal)

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: platform-vault-prod
    restart: unless-stopped
    command: ["vault", "server", "-config=/vault/config/config.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://platform-vault-prod:8200   # intra-network API addr
    ports:
      - "127.0.0.1:8200:8200"   # Localhost-only; k3d-prod pod'lar platform-prod-net DNS ile
    cap_add:
      - IPC_LOCK   # mlock — secret swap RAM'den koruma (ADR güvenlik katmanı)
    volumes:
      - ./config:/vault/config:ro
      - /srv/platform/stateful/prod/vault/data:/vault/data
      - /srv/platform/stateful/prod/vault/logs:/vault/logs   # audit log persist
    # 2026-05-20 network drift incident: container was found with
    # NetworkSettings.Networks:{} despite Up 39m; k3d-prod → vault Endpoint
    # went stale (kube-proxy reported "vault:http has no endpoints") and
    # every prod ExternalSecret sat SecretSyncedError for 2d17h. Root cause
    # unknown (probable container recreate outside compose). Fix (this file):
    # pin a static IPv4 so a recreate lands on the SAME address the overlay
    # Endpoints resource points at — no manual `kubectl patch endpoints`
    # after each restart. Value 172.21.0.9 = the live IP at pin-time; the
    # prod overlay endpoint patch (kustomize/overlays/prod/kustomization.yaml)
    # is aligned to the same value in this PR so merge is atomic and
    # container restart-free. See docs/RB-vault-ops.md §"Network drift".
    networks:
      platform-prod-net:
        ipv4_address: 172.21.0.9
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

networks:
  platform-prod-net:
    external: true
