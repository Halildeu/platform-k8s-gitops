# Vault prod instance — staging-sw-2 D32
# KV v2 + AppRole auth + audit backend enabled
# Storage: Raft (local filesystem) — single-node MVP
# Port: 8200 host-side

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: platform-vault-prod
    restart: unless-stopped
    command: ["vault", "server", "-config=/vault/config/config.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://10.9.10.53:8200
    ports:
      - "10.9.10.53:8200:8200"   # Host bind (D20)
    cap_add:
      - IPC_LOCK   # mlock — secret swap RAM'den koruma
    volumes:
      - ./config:/vault/config:ro
      - vault-data:/vault/data
      - vault-logs:/vault/logs   # audit log persist (docs/S5-vault-audit-retention.md)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  vault-data:    # Raft storage — backup critical (docs/S5-DR §2.3)
  vault-logs:    # audit log persist
