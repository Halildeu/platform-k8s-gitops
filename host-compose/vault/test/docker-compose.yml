# Vault Test Instance — ADR-0002 Same-Host Full Isolation
# Network: platform-test-net (test ESO ile aynı network)
# Ports:
# - 8201 -> 8200 HTTP API (legacy test host-local access)
# - 8302 -> 8202 HTTPS API (Faz 22.6 A1 backend TPM-attestation sign path)
# Container: platform-vault-test
# Operasyon: test default scale-to-zero; ESO apply için up edilir

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: platform-vault-test
    # ADR-0002 §5.1: test default scale-to-zero
    profiles: ["manual"]
    restart: "no"
    command: ["vault", "server", "-config=/vault/config/config.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://platform-vault-test:8200
    ports:
      - "127.0.0.1:8201:8200"   # Localhost-only bind
      - "127.0.0.1:8302:8202"   # Localhost-only HTTPS bind
    cap_add:
      - IPC_LOCK
    volumes:
      - ./config:/vault/config:ro
      - /home/halil/platform-stateful/test/vault/data:/vault/data
      - /home/halil/platform-stateful/test/vault/logs:/vault/logs
      - /home/halil/platform-stateful/test/vault/tls:/vault/tls:ro
    networks:
      - platform-test-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # Faz 22.6 A1 HTTPS listener pushed the old 256M cap into OOMKilled
          # on staging-sw during controlled recreate; keep test Vault bounded
          # but leave enough headroom for dual listeners + Raft startup.
          memory: 512M
          cpus: "0.50"

networks:
  platform-test-net:
    external: true
