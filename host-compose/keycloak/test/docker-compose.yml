# Keycloak Test Instance — ADR-0002 Same-Host Full Isolation
# Bind-mount: /srv/platform/stateful/test/keycloak
# Network: platform-test-net (test PG ile aynı network)
# Port: 8082 (test — prod 8081 ile çakışma yok)
# Container: platform-kc-test
# Operasyon: test default scale-to-zero

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: platform-kc-test
    # profiles: [manual] → yalnız `--profile manual` ile bilerek ayağa kaldırılır
    # (kazara `compose up` guard'ı). Bu, reboot davranışından bağımsızdır.
    profiles: ["manual"]
    # restart: unless-stopped — host reboot'unda TEST Keycloak geri gelmeli.
    # Eski `restart: "no"` gerekçesi "ADR-0002 §5.1 test default scale-to-zero"
    # (D17) idi; o politika 2026-05-10'da DEPRECATED edildi: test veri düzlemi
    # sessizce kapalı kalınca paralel geliştirme oturumları kırılıyor ve her
    # seferinde elle kurtarma (scale up + ESO refresh + Vault unseal) gerekiyor.
    restart: unless-stopped
    # Not: --optimized flag'i KALDIRILDI cunku KC_FEATURES degistiginde
    # augmentation cache mismatch fail-fast yapiyor. "start" auto-build yapar
    # her startup'ta (~10s startup penalty, test icin kabul).
    #
    # Entrypoint wrapper: KC 26 _FILE suffix env'leri auto-resolve etmiyor (live
    # kanit: 2026-05-09 spike-2 restart). Wrapper KC_DB_PASSWORD_FILE ve
    # KEYCLOAK_ADMIN_PASSWORD_FILE icindeki dosyalari okuyup literal env'e
    # cevirir, ardindan kc.sh'a exec eder. Secret YAML'a sizmaz; docker secrets
    # mount ile gelir, sadece env'e propagation yapilir.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -n "$$KC_DB_PASSWORD_FILE" ] && [ -f "$$KC_DB_PASSWORD_FILE" ] && export KC_DB_PASSWORD="$$(cat $$KC_DB_PASSWORD_FILE)"
        [ -n "$$KEYCLOAK_ADMIN_PASSWORD_FILE" ] && [ -f "$$KEYCLOAK_ADMIN_PASSWORD_FILE" ] && export KEYCLOAK_ADMIN_PASSWORD="$$(cat $$KEYCLOAK_ADMIN_PASSWORD_FILE)"
        exec /opt/keycloak/bin/kc.sh "$$@"
      - --
    command: ["start"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: platform-pg-test
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD_FILE: /run/secrets/kc_db_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password
      KC_HTTP_ENABLED: "true"
      # KC_HOSTNAME_STRICT: keep false during the transition — internal
      # backends (auth-service, api-gateway, JWKS cache) still talk to
      # KC via the internal http://keycloak:8080 path which has a
      # different host. Hardening to strict belongs in a separate PR
      # with its own internal-path smoke (Codex peer-review 019e142d).
      KC_HOSTNAME_STRICT: "false"
      # KC_HOSTNAME_STRICT_HTTPS removed (was "false"):
      # Hostname v1 family option, deprecated in Keycloak 26 and the
      # source of the remaining startup warning even after this hotfix:
      #   WARNING: Hostname v1 options [hostname-strict-https] are
      #   still in use, please review your configuration.
      # With KC_HOSTNAME explicitly set to a full https:// URL the
      # strict-https knob is redundant — KC v2 hostname provider
      # already derives the scheme from KC_HOSTNAME.
      # 2026-05-11 hotfix (login flow root cause):
      # KC_PROXY=edge is DEPRECATED in Keycloak 26 (silently ignored).
      # Without proxy-header trust KC sees inbound requests as HTTP and
      # refuses cross-origin operations from the SPA — exact symptom KC
      # logs at startup:
      #   "With HTTPS not enabled, proxy-headers unset, and
      #    hostname-strict=false, the server is running in an insecure
      #    context. ... requests from the proxy to the server will fail
      #    CORS checks with 403s because the wrong origin will be
      #    determined. Make sure proxy-headers are configured properly."
      # That is the user-facing "açılmıyor" — SPA POST /token fails
      # CORS preflight; kc.init() resolves with no token; user lands
      # back at /login with no observable error.
      # Fix: enable xforwarded mode (host edge nginx sets X-Forwarded-*).
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://testai.acik.com
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # User Impersonation v1 (PR-A spike-2): authorization feature gerekli
      # — fine-grained authz REST endpoint client management/permissions için.
      # admin-fine-grained-authz:v1 explicit (KC 26 default v2; v1 endpoint shape
      # broker token-exchange policy attach script'i için lazım).
      KC_FEATURES: "token-exchange,admin-fine-grained-authz:v1,authorization"
      JAVA_OPTS: "-Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"   # Test daha dar
    ports:
      # 2026-05-11 hardening (Codex 019e142d follow-up): drop the
      # 10.9.10.53:8082 LAN bind. With KC_PROXY_HEADERS=xforwarded now
      # trusting X-Forwarded-* headers from the edge proxy, a LAN-
      # accessible non-localhost port on the same KC is a header-
      # injection surface — an attacker on the LAN could spoof
      # X-Forwarded-Proto/Host to bypass the host nginx terminator.
      # The k3d cluster reaches KC via the Docker bridge IP
      # 172.19.0.5:8080 directly (overlays/test Endpoints patch), so
      # the LAN bind is unused. host nginx routes testai.acik.com:443
      # → k3d-test ingress (127.0.0.1:31080), never via this bind.
      # Local kcadm/operator scripts use 127.0.0.1:8082 below.
      # Matches prod compose (also localhost-only).
      - "127.0.0.1:8082:8080"
    volumes:
      - /srv/platform/stateful/test/keycloak:/opt/keycloak/data
    secrets:
      - kc_db_password
      - kc_admin_password
    # Sister-pin to prod. Test KC drifted from overlay .5 to live .7 on
    # a past compose recreate; the same class of failure vault-prod hit
    # on 2026-05-20 would apply on the next docker recreate. Pin to the
    # live IP so overlay Endpoints (updated to .7 in this PR) stay
    # canonical across restarts.
    networks:
      platform-test-net:
        ipv4_address: 172.19.0.7
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

networks:
  platform-test-net:
    external: true

secrets:
  kc_db_password:
    file: ./secrets/kc_db_password.txt
  kc_admin_password:
    file: ./secrets/kc_admin_password.txt
