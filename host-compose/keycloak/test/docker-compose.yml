# Keycloak Test Instance — ADR-0002 Same-Host Full Isolation
# Bind-mount: /srv/platform/stateful/test/keycloak
# Network: platform-test-net (test PG ile aynı network)
# Port: 8082 (test — prod 8081 ile çakışma yok)
# Container: platform-kc-test
# Operasyon: test default scale-to-zero

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: platform-kc-test
    # ADR-0002 §5.1: test default scale-to-zero (profiles: [manual] enforce)
    profiles: ["manual"]
    restart: "no"
    command: ["start", "--optimized"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: platform-pg-test
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD_FILE: /run/secrets/kc_db_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY: edge
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "token-exchange,admin-fine-grained-authz"
      JAVA_OPTS: "-Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100"   # Test daha dar
    ports:
      - "127.0.0.1:8082:8080"
      - "10.9.10.53:8082:8080"
    volumes:
      - /srv/platform/stateful/test/keycloak:/opt/keycloak/data
    secrets:
      - kc_db_password
      - kc_admin_password
    networks:
      - platform-test-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"

networks:
  platform-test-net:
    external: true

secrets:
  kc_db_password:
    file: ./secrets/kc_db_password.txt
  kc_admin_password:
    file: ./secrets/kc_admin_password.txt
