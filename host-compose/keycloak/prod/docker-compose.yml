# Keycloak Prod Instance — ADR-0002 Same-Host Full Isolation
# Bind-mount: /srv/platform/stateful/prod/keycloak (provider + themes için custom dir)
# Network: platform-prod-net (stateful DB) + platform_microservice-network (backend JWT/JWKS erişimi)
# Çift-network gerekçesi: prod backend compose servisleri (api-gateway, auth-service,
# variant-service) JWT JWKS cache'ini `http://keycloak:8080/realms/serban/protocol/openid-connect/certs`
# ile çeker; DNS resolve 'keycloak' → platform_microservice-network içindeki KC container
# olmadan fail eder (ayrı platform-prod-net izolasyonu nedeniyle).
# Port: 8081 (prod)
# Container: platform-kc-prod
# DB: prod PG (platform-pg-prod) — cross-read test'ten YASAK

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: platform-kc-prod
    restart: unless-stopped
    # 2026-05-11 follow-on to KC_PROXY_HEADERS migration:
    # --optimized requires the augmentation cache (built via kc.sh build)
    # to be present in the persistent data dir AND for the build-time
    # env vars to match the runtime ones. Changing KC_PROXY_HEADERS /
    # KC_HOSTNAME invalidates the cache and causes a crash loop:
    #   "The '--optimized' flag was used for first ever server start.
    #    Please don't use this flag for the first startup or use
    #    'kc.sh build' to build the server first."
    # Match the test overlay pattern: use plain "start" which auto-runs
    # the build step on every startup (~10–30s penalty). Acceptable for
    # this single-host install; eliminates the env-drift crash class
    # entirely.
    #
    # Entrypoint wrapper (mirrored from test compose): KC 26 does NOT
    # auto-resolve KC_DB_PASSWORD_FILE / KEYCLOAK_ADMIN_PASSWORD_FILE at
    # runtime (live evidence 2026-05-09 spike-2). With --optimized the
    # previously-baked augmentation cache carried the resolved values;
    # with plain "start" runtime resolution is required so the wrapper
    # exports them before exec'ing kc.sh. Secrets stay in docker secret
    # mounts; only env propagation happens, no YAML leak.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -n "$$KC_DB_PASSWORD_FILE" ] && [ -f "$$KC_DB_PASSWORD_FILE" ] && export KC_DB_PASSWORD="$$(cat $$KC_DB_PASSWORD_FILE)"
        [ -n "$$KEYCLOAK_ADMIN_PASSWORD_FILE" ] && [ -f "$$KEYCLOAK_ADMIN_PASSWORD_FILE" ] && export KEYCLOAK_ADMIN_PASSWORD="$$(cat $$KEYCLOAK_ADMIN_PASSWORD_FILE)"
        exec /opt/keycloak/bin/kc.sh "$$@"
      - --
    command: ["start"]
    environment:
      # DB bağlantı (prod PG instance, aynı network)
      KC_DB: postgres
      KC_DB_URL_HOST: platform-pg-prod   # container isim ile resolve (platform-prod-net DNS)
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD_FILE: /run/secrets/kc_db_password
      # Admin (bootstrap sonra rotate — day-2-governance §2.1)
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD_FILE: /run/secrets/kc_admin_password
      # HTTP (SSL upstream — host nginx edge)
      KC_HTTP_ENABLED: "true"
      # KC_HOSTNAME_STRICT: keep false during the transition — internal
      # backends still talk to KC via the internal http://keycloak:8080
      # path which has a different host. Hardening to strict belongs
      # in a separate PR with internal-path smoke (Codex peer-review
      # 019e142d).
      KC_HOSTNAME_STRICT: "false"
      # KC_HOSTNAME_STRICT_HTTPS removed (was "false"): Hostname v1
      # family option, deprecated in Keycloak 26 — the source of the
      # remaining "Hostname v1 options [hostname-strict-https] are
      # still in use" startup warning even after the proxy-headers
      # hotfix. With KC_HOSTNAME set to a full https:// URL the
      # strict-https knob is redundant; KC v2 derives the scheme
      # directly from KC_HOSTNAME.
      # 2026-05-11 hotfix (login flow root cause, mirrored from
      # host-compose/keycloak/test/docker-compose.yml):
      # KC_PROXY=edge is DEPRECATED in Keycloak 26 (silently ignored)
      # and breaks the CORS preflight on /token from a HTTPS SPA. The
      # KC startup log itself warns:
      #   "With HTTPS not enabled, proxy-headers unset, and
      #    hostname-strict=false, ... requests from the proxy to the
      #    server will fail CORS checks with 403s ..."
      # Fix: switch to xforwarded mode (host edge nginx already sets
      # X-Forwarded-Proto/Host/For). KC_HOSTNAME locks the public
      # canonical URL so KC builds correct redirect URLs even before
      # the SPA echoes them back.
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://ai.acik.com
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "token-exchange,admin-fine-grained-authz:v1,authorization"
      JAVA_OPTS: "-Xmx1g -XX:+UseG1GC -XX:MaxGCPauseMillis=100"
    ports:
      - "127.0.0.1:8081:8080"   # Localhost-only; host nginx edge aynı host'tan reverse proxy yapar
    volumes:
      - /srv/platform/stateful/prod/keycloak:/opt/keycloak/data
    secrets:
      - kc_db_password
      - kc_admin_password
    # Sister-pin to postgres/vault (2026-05-20 drift class). Static IPv4 on
    # platform-prod-net locks the k3d-prod ↔ keycloak bridge target so a
    # container recreate cannot silently drift the overlay Endpoint. The
    # second network (platform_microservice-network) reaches KC via DNS
    # name from the backend compose stack; no pin needed there.
    networks:
      platform-prod-net:
        ipv4_address: 172.21.0.3
      platform_microservice-network: {}
    healthcheck:
      # 2026-04-24: localhost → 127.0.0.1 (DNS resolve bypass) + printf (echo -e
      # portability). Bu combination staging-sw'de `Health.Status=unhealthy` drift'ini
      # kapatıyor (Known Drift §platform-kc-prod healthcheck).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

networks:
  platform-prod-net:
    external: true
  platform_microservice-network:
    external: true

secrets:
  kc_db_password:
    file: ./secrets/kc_db_password.txt
  kc_admin_password:
    file: ./secrets/kc_admin_password.txt
