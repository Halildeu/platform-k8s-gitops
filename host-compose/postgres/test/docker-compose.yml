# PostgreSQL Test Instance — ADR-0002 Same-Host Full Isolation
# Bind-mount: /srv/platform/stateful/test/postgres (forward-extension: ayrı partition)
# Network: platform-test-net (k3d-test + test stateful ONLY)
# Port: 5433 (test — prod 5432 ile çakışma yok)
# Container: platform-pg-test
# Operasyon: test default scale-to-zero (ADR §5.1); gerektiğinde up.

services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-pg-test
    # ADR-0002 §5.1: test default scale-to-zero
    # profiles: [manual] → compose up SADECE `--profile manual` flag ile çalışır
    # Host reboot'unda restart:no ile geri gelmez (normalde unless-stopped ama test için no)
    profiles: ["manual"]
    restart: "no"
    ports:
      # 2026-05-11 hardening (Codex 019e15dd follow-up to PR #517 KC
      # bind drop). Same pattern: the 10.9.10.53:5433 LAN bind comment
      # claimed "k3d-test pod'lar için host-bridge erişimi" but the
      # overlays/test kustomization patches the postgres Endpoint to
      # the Docker bridge IP directly (172.19.0.6:5432), so k3d-test
      # pods reach PG through the Docker bridge — NOT via the host
      # LAN bind. Verified live: `kubectl -n platform-test get endpoints
      # postgres` returns `172.19.0.6:5432`.
      #
      # Risk: PG admin port on the LAN is a higher blast-radius
      # surface than the equivalent KC bind that #517 dropped. Even
      # with strong auth, anyone on the LAN could brute-force the
      # password file or exploit a CVE. Localhost-only matches the
      # prod compose pattern and the rest of the host-service stack.
      #
      # Local admin/drill on the host still uses 127.0.0.1:5433.
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: postgres
    volumes:
      - /srv/platform/stateful/test/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    secrets:
      - pg_password
    # Sister-pin to prod (2026-05-20 vault-prod drift class). Test PG live
    # IP already matches the overlay Endpoints patch (172.19.0.6); pinning
    # here just prevents a future docker recreate from silently drifting.
    networks:
      platform-test-net:
        ipv4_address: 172.19.0.6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1.5G      # ADR §7.2 platform-test-stateful.slice (daha dar)
          cpus: "0.75"

networks:
  platform-test-net:
    external: true          # pre-created (k3d-test zaten kullanıyor)

secrets:
  pg_password:
    file: ./secrets/pg_password.txt   # chmod 600, .gitignore
