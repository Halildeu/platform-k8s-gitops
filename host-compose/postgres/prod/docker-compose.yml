# PostgreSQL Prod Instance — ADR-0002 Same-Host Full Isolation
# Bind-mount: /srv/platform/stateful/prod/postgres (forward-extension: ayrı partition)
# Network: platform-prod-net (k3d-prod + prod stateful ONLY)
# Port: 5432 (prod)
# Container: platform-pg-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-pg-prod
    restart: unless-stopped
    ports:
      # Host bind ONLY localhost (127.0.0.1) — k3d-prod pod'lar platform-prod-net
      # üzerinden container DNS (platform-pg-prod:5432) ile ulaşır, host port
      # yalnız admin/debug için gerekli. External exposure YOK.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_DB: postgres
      # DB'ler migrate-init.sql ile yaratılır (bkz init/01-create-databases.sql)
    volumes:
      - /srv/platform/stateful/prod/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro   # DB create + grant scripts
    secrets:
      - pg_password
    networks:
      - platform-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 3G        # ADR §7.2 platform-prod-stateful.slice
          cpus: "1.5"

networks:
  platform-prod-net:
    external: true         # pre-created by bootstrap: docker network create platform-prod-net

secrets:
  pg_password:
    file: ./secrets/pg_password.txt   # chmod 600, .gitignore
