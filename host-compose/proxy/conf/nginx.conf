# Host-level edge nginx: SSL termination + SNI routing
# ai.acik.com   → prod k3d (127.0.0.1:30080)
# testai.acik.com → test k3d (127.0.0.1:31080)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'host="$host" upstream="$upstream_addr" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  # Gzip — statik ve JSON response'lar için
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss
             application/atom+xml image/svg+xml text/javascript;

  # Upstream tanımları — k3d cluster ingress portları (host loopback)
  upstream prod_k3d_ingress {
    server 127.0.0.1:30080 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream test_k3d_ingress {
    server 127.0.0.1:31080 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  # SSL ayarları — tek yerde tanımlı
  ssl_protocols         TLSv1.2 TLSv1.3;
  ssl_ciphers           'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
  ssl_prefer_server_ciphers on;
  ssl_session_cache     shared:SSL:10m;
  ssl_session_timeout   10m;
  ssl_session_tickets   off;

  # Global HTTP → HTTPS redirect + ACME challenge geçişi (ileride LE için)
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt HTTP-01 için rezerv (şimdilik boş)
    location /.well-known/acme-challenge/ {
      root /var/www/acme;
      try_files $uri =404;
    }

    # Local health check
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Her şey 443'e yönlenir
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ai.acik.com → prod cluster
  server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name ai.acik.com;

    ssl_certificate     /etc/nginx/tls/wildcard-acik-com.crt;
    ssl_certificate_key /etc/nginx/tls/wildcard-acik-com.key;

    # HSTS (6 ay — renewal 2026-10 öncesi riski dengeler)
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 25m;
    proxy_read_timeout   300s;
    proxy_connect_timeout 10s;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass         http://prod_k3d_ingress;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  443;

      # WebSocket / HTTP/2 upgrade (ArgoCD UI gerektirir)
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # testai.acik.com → test cluster
  server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name testai.acik.com;

    ssl_certificate     /etc/nginx/tls/wildcard-acik-com.crt;
    ssl_certificate_key /etc/nginx/tls/wildcard-acik-com.key;

    # Test: HSTS daha kısa, gözlemle
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;

    client_max_body_size 25m;

    # Test cluster down (scale-to-zero) ise 503 + anlamlı sayfa
    error_page 502 503 504 /test-down.html;
    location = /test-down.html {
      return 503 "Test ortamı şu an kapalı. Açmak için: scripts/test-toggle.sh up\n";
      add_header Content-Type "text/plain; charset=utf-8";
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass         http://test_k3d_ingress;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host  $host;
      proxy_set_header X-Forwarded-Port  443;

      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # Bilinmeyen hostname → 444 (connection closed)
  server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/tls/wildcard-acik-com.crt;
    ssl_certificate_key /etc/nginx/tls/wildcard-acik-com.key;
    return 444;
  }

  # WebSocket upgrade map — proxy'nin Connection header'ını düzgün set etmesi için
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }
}
