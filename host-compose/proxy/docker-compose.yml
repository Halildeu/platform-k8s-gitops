# Host-level nginx reverse proxy
# SSL'i (Sectigo wildcard) burada termine eder, SNI'a göre prod/test k3d cluster'a yönlendirir.
# Mevcut `platform-web-nginx` yerine geçer (cutover anında).
#
# Gereksinim:
#   - tls/wildcard-acik-com.crt  (Sectigo wildcard cert, Nginx bundle)
#   - tls/wildcard-acik-com.key  (private key)
#   - k3d cluster'ları host 127.0.0.1:30080 (prod) ve :31080 (test) dinliyor olmalı

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: platform-edge-nginx
    restart: unless-stopped
    network_mode: host           # host portlarını doğrudan alır (Linux)
    # macOS/Docker-Desktop: host network desteklenmez; bu dosya staging-sw içindir.
    # Lokal dev için ayrı compose override gerekebilir (extra_hosts + ports).
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
