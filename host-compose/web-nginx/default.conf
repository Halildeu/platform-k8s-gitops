# Faz 35 Etik Speak — public reporter hosts (etik.acik.com + speakup.acik.com).
# Both hosts terminate TLS at this host edge and proxy to the k3d-test cluster
# ingress-nginx (127.0.0.1:31080), where the public-ui + public-api ingresses
# apply the synthetic Basic Auth test gate and route to platform-test pods.
server {
  listen 80;
  server_name etik.acik.com speakup.acik.com;
  access_log off;

  location = /nginx-healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  # Public :443 belongs to the stream SNI router in nginx.conf. Normal browser
  # hosts terminate TLS on this shared loopback listener.
  listen 8444 ssl;
  http2 on;
  server_name etik.acik.com speakup.acik.com;
  access_log off;

  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # API and UI use separate per-client limits. Identity is available only for
  # this volatile edge decision and is cleared before the cluster boundary.
  location ^~ /api/v1/public/ethics {
    # The evidence custody contract caps an attachment at 26214400 bytes and the
    # service enforces that itself. This edge sits in FRONT of ingress-nginx, so
    # its limit is the operative one — and with no directive here nginx applies
    # its 1m default, which rejected a compliant 25 MiB upload in 50ms, before a
    # single byte of body was read. Raising the ingress annotation alone did
    # nothing: the request never reached it.
    client_max_body_size 26m;
    # A 25 MiB body over a slow link must not trip the read timeout either.
    client_body_timeout 120s;
    limit_req zone=etik_speak_api_rps burst=6 nodelay;
    limit_req zone=etik_speak_api_rpm burst=120 nodelay;
    limit_conn etik_speak_public_conn 10;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Etik-Speak-Transport https;
    proxy_set_header Authorization "";
    proxy_set_header Cookie $etik_speak_public_cookie;
    proxy_set_header Forwarded "";
    proxy_set_header Referer "";
    proxy_set_header User-Agent "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Original-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_hide_header Set-Cookie;
    add_header Set-Cookie $etik_speak_public_set_cookie always;
    # add_header inheritance stops when a location declares its own header.
    # Repeat the public security boundary together with the cookie allowlist.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
    proxy_pass http://127.0.0.1:31080;
  }

  location / {
    limit_req zone=etik_speak_ui_rps burst=30 nodelay;
    limit_req zone=etik_speak_ui_rpm burst=900 nodelay;
    limit_conn etik_speak_public_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Etik-Speak-Transport https;
    proxy_set_header Authorization "";
    proxy_set_header Cookie $etik_speak_public_cookie;
    proxy_set_header Forwarded "";
    proxy_set_header Referer "";
    proxy_set_header User-Agent "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Original-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_hide_header Set-Cookie;
    add_header Set-Cookie $etik_speak_public_set_cookie always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_pass http://127.0.0.1:31080;
  }
}
