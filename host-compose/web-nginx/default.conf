server_tokens off;

server {
  listen 80;
  server_name ai.acik.com;

  location = /nginx-healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name ai.acik.com;

  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }
  location = /remoteEntry.js {
    try_files $uri =404;
    add_header Cache-Control "no-store, must-revalidate" always;
  }
  location ~ ^/remotes/[^/]+/remoteEntry\.js$ {
    # Faz 19.11: /remotes/ static → K8s proxy (7 MFE: access/audit/reporting/users/schema-explorer/suggestions/ethic)
    # Eski static 4 MFE idi (compose dönem). K8s pod'unda 7 MFE var.
    try_files $uri @remotes_k8s_proxy;
    add_header Cache-Control "no-store, must-revalidate" always;
  }

  location /admin/master/ {
    return 403;
  }
  location /admin/realms/ {
    return 403;
  }

  location = /nginx-healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # PERF-INIT-V2 PR-B3c (Codex thread `019e240d` REVISE iter-2 absorb):
  # Host-served Vite hashed chunks under `/assets/` get long-cache.
  # Content-hash in filename (e.g. `bootstrap-CDWbzp5o.js`) auto-
  # invalidates on every new build, so 1y immutable is safe.
  # Vite docs canonical pattern.
  #
  # Warm-cache effect: returning visitors load 0 KB transfer for all
  # cached hashed JS/CSS chunks (browser uses cached copy without
  # conditional request).  Cold-cache unchanged (2,344 KB post-B5b2).
  #
  # Codex iter-2 P1.1 absorb: use `expires off` + explicit `add_header`
  # to emit EXACTLY ONE `Cache-Control` line.  Pre-B3c had `expires 1h`
  # AND `add_header Cache-Control` which emitted TWO `max-age` lines —
  # stricter caches treat repeated max-age as invalid freshness.
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # PERF-INIT-V2 PR-B3c: hashed remote chunks under
  # `/remotes/<remote>/assets/` get the same 1y immutable treatment.
  # Vite-emitted bundle hash means cache invalidation is automatic
  # per remote per build.
  #
  # Nginx location matching: regex locations are evaluated AFTER the
  # longest prefix match unless that prefix uses `^~`.  Both this regex
  # and the parent `/remotes/` are evaluated against requests starting
  # with `/remotes/`; since the regex is more specific (asserts
  # `/<remote>/assets/`), it wins for hashed asset paths.  Non-asset
  # paths under `/remotes/` fall through to the parent prefix location
  # below.
  location ~ ^/remotes/[^/]+/assets/ {
    try_files $uri @remotes_k8s_proxy;
    access_log off;
    expires off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /remotes/ {
    # Faz 19.11: /remotes/ static → K8s proxy fallback (yeni MFE'ler K8s pod'da)
    # Codex `019e240d` REVISE: parent `/remotes/` stays at 1h.  More
    # specific `/remotes/<remote>/assets/` regex above handles
    # long-cache for hashed remote chunks.  Top-level `remoteEntry.js`
    # locations (lines below at `= /remoteEntry.js` + `~ ^/remotes/[^/]+/remoteEntry\.js$`)
    # explicitly carry `no-store` so federation entry points stay
    # uncached regardless of this parent's 1h.
    try_files $uri @remotes_k8s_proxy;
    access_log off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, immutable";
  }

  # Faz 19.11 — /remotes/ fallback K8s proxy (host-static → K8s pod serve, 7 MFE)
  # Bu named location static dosya bulunamayınca K8s NodePort'a yönlendirir.
  location @remotes_k8s_proxy {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_ssl_server_name on;
    proxy_pass https://127.0.0.1:30443;
  }

  resolver 127.0.0.11 valid=10s;

  location /cockpit-api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 "{\"status\":\"offline\",\"error\":\"Cockpit API not available in this environment\"}";
  }

  # Faz 18.2 — Tombstone (PLAN.md §18.2, Codex thread 019dbfa5 iter-3 AGREE)
  # Eski platform-service-manager-1 compose Docker socket debug endpoint.
  # 7 takvim günü + 0 hit sonrası full removal (18.3 service-manager retirement ile birlikte).
  # Replacement: ArgoCD UI + Grafana dashboards + runbook linkleri (MFE ops-links).
  location /api/services/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 410 "{\"status\":\"gone\",\"message\":\"/api/services endpoint retired. Use ArgoCD UI, Grafana dashboards, or runbook references.\",\"phase\":\"18.2\"}";
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_ssl_server_name on;
    proxy_pass https://127.0.0.1:30443;
  }

  location /realms/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_pass http://127.0.0.1:8081;
  }

  location /resources/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_pass http://127.0.0.1:8081;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 80;
  server_name testai.acik.com;

  location = /testai-healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name testai.acik.com;

  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /testai-healthz {
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name testai.acik.com;
    proxy_ssl_verify off;
    proxy_set_header Host testai.acik.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_pass https://127.0.0.1:5545/nginx-healthz;
  }

  # Faz 18.2 — Tombstone (testai.acik.com, same pattern as ai.acik.com)
  location /api/services/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 410 "{\"status\":\"gone\",\"message\":\"/api/services endpoint retired. Use ArgoCD UI, Grafana dashboards, or runbook references.\",\"phase\":\"18.2\"}";
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_pass http://127.0.0.1:31080;
  }

  location /realms/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_pass http://127.0.0.1:8082;
  }

  location /resources/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_pass http://127.0.0.1:8082;
  }

  # 2026-04-30: testai frontend edge cluster-authoritative (Codex 019ddf23
  # REVISE -> AGREE). Önceki: proxy_pass https://127.0.0.1:5545 (nginx-stage
  # static layer, host-stage releases). Yeni: doğrudan k3d-test ingress
  # NodePort HTTP (31080, D18 contract), gitops digest pin public flow'a
  # yansır; AG Grid license + drawer fix iter'leri authoritative.
  #
  # nginx-stage container ayakta kalır (testai-healthz probe için, lines
  # 191-203). Manuel HTML inject + host stage release rotation drift
  # request path'ten çıkar.
  #
  # Rollback (silent fallback değil, açık switch): bu satırı tekrar
  # `proxy_pass https://127.0.0.1:5545;` yap + nginx -s reload. Beklenen
  # etki: public flow tekrar nginx-stage static'e döner, gitops digest
  # public'e yansımaz.
  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_pass http://127.0.0.1:31080;
  }
}
