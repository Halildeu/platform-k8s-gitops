  # GPP-2 AO gate public health + GitHub callback routes (#937, Codex
  # `019e4a10-0fd5-7ff3-9601-80f56a9c8e81` AGREE v2.1).
  #
  # The AO gate runtime lives in host-compose/ao-gate/compose.yaml and binds
  # `127.0.0.1:18081 -> policy-service:8000` and `127.0.0.1:18082 ->
  # release-gate:8000` on the host. Only `/ao-gate/*` is exposed publicly;
  # the underlying services have no public listener of their own.
  #
  # `location =` exact-match is deliberate: prefix matching would risk the
  # SPA `location /` fallback masking a typo (e.g. `/ao-gate/policy/health`
  # would otherwise return 200 text/html instead of a clean 404). The four
  # exact-match locations cover the entire public surface GPP-2 needs.
  #
  # `/github/*` routes preserve the operator-bound callback path; webhook
  # config is OUT OF SCOPE for this PR (no GitHub App registration changes
  # until public-health evidence passes — Codex AGREE constraint).
  location = /ao-gate/policy/healthz {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
