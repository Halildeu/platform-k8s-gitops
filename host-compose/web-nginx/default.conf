server_tokens off;

server {
  listen 80;
  server_name ai.acik.com;

  location = /nginx-healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;

  # PERF-INIT-V2 B3b host edge: gzip transport compression
  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain text/css application/json application/javascript
    application/xml+rss application/atom+xml image/svg+xml
    text/javascript application/wasm font/woff2 application/x-font-ttf
    application/manifest+json application/x-javascript;
  server_name ai.acik.com;

  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # 2026-05-03: ai.acik.com frontend edge cluster-authoritative (Codex 019ded8d
  # PARTIAL -> AGREE absorb). Önceki: root /usr/share/nginx/html (host static
  # disk serve, manual rsync gerekiyordu — Faz 19 prod migration drift). Yeni:
  # doğrudan k3d-prod ingress NodePort HTTPS (30443, D18 contract). Gitops
  # digest pin + AG Grid lisans + single-source refactor public flow'a yansır.
  #
  # Rollback (silent fallback değil, açık switch): default.conf.bak-20260503-1425
  # geri kopyala + nginx -s reload. Beklenen etki: public flow tekrar host
  # static'e döner, manual rsync drift döngüsü geri gelir.

  location = /nginx-healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /admin/master/ {
    return 403;
  }
  location /admin/realms/ {
    return 403;
  }

  location /cockpit-api/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 "{\"status\":\"offline\",\"error\":\"Cockpit API not available in this environment\"}";
  }

  # Faz 18.2 — Tombstone
  location /api/services/ {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 410 "{\"status\":\"gone\",\"message\":\"/api/services endpoint retired. Use ArgoCD UI, Grafana dashboards, or runbook references.\",\"phase\":\"18.2\"}";
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_ssl_server_name on;
    proxy_pass https://127.0.0.1:30443;
  }

  location /realms/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_pass http://127.0.0.1:8081;
  }

  location /resources/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_pass http://127.0.0.1:8081;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_ssl_server_name on;
    proxy_ssl_name ai.acik.com;
    proxy_ssl_verify off;
    proxy_pass https://127.0.0.1:30443;
  }
}

