user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

# Faz 22.5 M2 edge mTLS SNI passthrough.
#
# Public :443 belongs to this stream router. It reads SNI without terminating
# TLS. Dedicated mTLS hosts pass raw TLS to ingress-nginx ssl-passthrough so the
# endpoint-admin backend sees and validates the client machine certificate.
# Normal browser hosts fall through to the legacy HTTPS edge on :8444, where
# host-compose/web-nginx/default.conf terminates the wildcard Sectigo cert.
stream {
    map $ssl_preread_server_name $mtls_upstream {
        mtls.testai.acik.com   test_ingress_nginx_passthrough;
        mtls.ai.acik.com       prod_ingress_nginx_passthrough;
        default                http_edge_passthrough;
    }

    upstream test_ingress_nginx_passthrough {
        server 127.0.0.1:31443;
    }

    upstream prod_ingress_nginx_passthrough {
        server 127.0.0.1:30443;
    }

    upstream http_edge_passthrough {
        server 127.0.0.1:8444;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $mtls_upstream;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
