# ingress-nginx — test cluster (k3d-test)
# Prod ile aynı temel config, daha dar kaynak (test hafif)

controller:
  kind: DaemonSet
  replicaCount: 1

  # k3d-test port mapping: host 31080 → k3d-LB 80 → node 80 → hostPort 80
  # Prod ile aynı pattern (bkz values-prod.yaml) — NodePort kullanımı k3d LB
  # forward modeline uymuyordu, P0 fix (Codex Tur-3).
  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443

  service:
    enabled: true
    type: ClusterIP
    externalTrafficPolicy: Local

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

  metrics:
    enabled: false           # test'te monitoring yok (prod federate eder)

  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    proxy-body-size: "10m"
    log-format-escape-json: "true"

  watchIngressWithoutClass: false
  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  minAvailable: 0
  podDisruptionBudget:
    enabled: false

defaultBackend:
  enabled: false

rbac:
  create: true
  scope: false
