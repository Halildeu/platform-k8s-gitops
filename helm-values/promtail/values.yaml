# Promtail — DaemonSet log shipper (D27 upstream)
# Her node'da çalışır, /var/log + container log'larını Loki'ye push eder

daemonset:
  enabled: true

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

config:
  clients:
    - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

  snippets:
    # Pipeline — container stdout'u Loki'ye etiketlerle gönder
    pipelineStages:
      - cri: {}
      - json:
          expressions:
            output: log
            timestamp: time
            stream: stream
      - labels:
          stream:
      - timestamp:
          source: timestamp
          format: RFC3339Nano

    # Cluster-wide scrape (tüm namespaces)
    extraScrapeConfigs: |
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_part_of]
            target_label: part_of
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log

# Tolerations: master/control-plane node dahil
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

# Metrics ServiceMonitor (sonra açılır)
serviceMonitor:
  enabled: false
