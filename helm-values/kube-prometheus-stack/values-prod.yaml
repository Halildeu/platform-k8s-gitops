# kube-prometheus-stack — prod cluster (D10: Prom 10d, Loki 7d, Tempo 48h)
# D27: upstream-first — Grafana dashboard'ları otomatik yerleşik
# Path routing: /grafana, /prometheus (Helm Ingress kendi ns'inde)

# Namespace / cluster-scope
nameOverride: ""
fullnameOverride: ""

# Kritik bileşenler
crds:
  enabled: true

defaultRules:
  create: true                        # prom community alerts
  rules:
    alertmanager: true
    etcd: false                       # k3d'de etcd yok (SQLite)
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false      # k3s'te ayrı değil
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# ─── Alertmanager ───
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1                       # D21: HPA yok

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

    # Storage — local-path provisioner
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

    # V2.1 Ops-A — Perf alert receiver secret mount (Codex 019e267a spike absorb)
    # ESO `perf-alertmanager-secrets` K8s Secret pod'a file mount edilir;
    # Alertmanager config `slack_configs.api_url_file` ile path okur (env injection DEĞİL).
    # Mount path: /etc/alertmanager/secrets/perf-alertmanager-secrets/SLACK_WEBHOOK_URL
    #
    # NOT: `github-issues-receiver-token` mount KALDIRILDI (Codex `019e4256`
    # Session 42 REVISE iter-2 P0 absorb — sibling PR #857b). Alertmanager
    # `webhook_configs` does not wrap payload into GitHub `repository_dispatch`
    # schema `{event_type, client_payload}`, so the direct receiver fails 4xx;
    # ref. PR #648 RED. GitHub Issue trail flows through
    # `alarm-receiver-bridge` → `alertmanager-bridge` pod (uses `gh` CLI to
    # create/comment/close GitHub Issues directly — NOT via repository_dispatch).
    # The mount + token will be re-introduced when a payload wrapper bridge
    # (sidecar/proxy) is built — separate future PR.
    secrets:
      - perf-alertmanager-secrets
      # D43 fallback secret (mevcut, audit only — alarm-receiver-bridge baseline path)
      - alertmanager-fallback-secrets

  ingress:
    enabled: false                    # admin-only, kubectl port-forward ile ulaş

  # AlertManager → alarm_receiver bridge config (Codex Sprint A follow-up)
  # Observability alarm'ları drift detection alarm_receiver pipeline'ına bağlanıyor.
  # Bridge: alertmanager-bridge K8s service (kustomize/base/monitoring/alertmanager-bridge/).
  #
  # V2.1 Ops-A extension (Codex 019e267a spike AGREE_AFTER_REVISIONS +
  # 019e2772 post-impl review P0/P1/P2 absorb):
  # `team=perf` matched alert'ler perf-alerts-slack receiver'a (#perf-alerts);
  # critical perf alarmları DUAL delivery (Slack + bridge P1 yolu korunuyor);
  # throttle group_interval: 5m, repeat_interval: 6h (alarm fatigue azaltma).
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'alarm-receiver-bridge'
      routes:
        # D43 — notification-orchestrator outage fallback (Codex 019e4234 +
        # 019e0dea iter-2 absorb #3; Codex 019e4234 post-impl P1 absorb:
        # continue=true to preserve the existing P1 bridge evidence trail).
        #
        # NotifyServiceDown / NotifyServiceAbsent fire when the orchestrator is
        # down/absent — these MUST bypass orchestrator-routed delivery and hit
        # the direct-fallback receiver (Slack + SMTP combined via ESO
        # `alertmanager-fallback-secrets`). `bypass_orchestrator=true` label is
        # stable (PrometheusRule contract); the matcher uses alertname for
        # readability + the label is the fingerprint anchor.
        #
        # `continue: true` is INTENTIONAL: Alertmanager route semantics say a
        # matched child route delivers to its receiver and (if continue=false)
        # STOPS sibling evaluation — the parent's `receiver` does NOT auto-fire.
        # If we used continue=false here, the existing `severity=critical →
        # alarm-receiver-bridge` route below would be bypassed for D43 alerts;
        # the GitHub Issues P1 evidence trail would silently disappear during
        # the very outages this route is supposed to make MORE visible. With
        # continue=true, D43 delivers Slack + SMTP first, then the next-matching
        # `severity=critical` sibling delivers to alarm-receiver-bridge, giving
        # 3-channel defense-in-depth (Slack + SMTP + GitHub Issue). The bridge
        # dedupes on alertname+namespace, so only one Issue is opened.
        #
        # SOURCE-OF-TRUTH ONLY — desired-state lands in values-prod.yaml on
        # merge of #855 (PR-1 staged/gated). Prod cluster activation requires:
        #   (a) Operator seeds Vault `kv/platform/alertmanager-fallback` with
        #       real values (#alerts-d43-drill Slack webhook + prod SMTP relay
        #       credentials);
        #   (b) ESO sync → SecretSynced=True;
        #   (c) `helm upgrade kube-prometheus-stack -n monitoring
        #        -f helm-values/kube-prometheus-stack/values-prod.yaml`
        #       (Alertmanager pod restart picks up the new config + Secret mount);
        #   (d) Synthetic NotifyServiceDown smoke (scale orchestrator=0 in a
        #       controlled window) → Slack receipt + SMTP receipt + GitHub
        #       Issue + recovery.
        # Until (a-c), Secret-driven legs (Slack via api_url_file, SMTP via
        # auth_*_file) silently no-op when files are missing. continue=true
        # ensures the operator-action gap is observable through the bridge
        # P1 evidence path, not silent.
        # Runbook: docs/runbooks/RB-notification-outage-fallback.md §3.2 prod
        # sub-section + §6.5 activation procedure.
        - matchers:
            - alertname =~ "NotifyServiceDown|NotifyServiceAbsent"
          receiver: direct-fallback
          group_wait: 0s
          group_interval: 5m
          repeat_interval: 30m
          continue: true
        # V2.1 Ops-A — Critical perf alarms DUAL delivery (Codex `019e4256`
        # REVISE iter-2 P0 absorb — perf-alerts-github-issues direct receiver
        # KALDIRILDI; payload wrapper bridge gelene kadar). Akış:
        # 1. perf-alerts-slack (continue:true → 2.) — Vault DR sonrası activate
        # 2. critical bridge route (alarm-receiver-bridge → alertmanager-bridge
        #    pod GitHub Issue wrap) — P1 operator action <10min pipeline
        # Net: Slack + bridge GitHub Issue (2 channel, defense-in-depth).
        - matchers:
            - team = "perf"
            - severity = "critical"
          receiver: 'perf-alerts-slack'
          group_by: ['alertname', 'namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          continue: true
        # Critical generic: page immediately, no grouping (catches DUAL-delivered perf-critical too)
        - matchers:
            - severity = "critical"
          receiver: 'alarm-receiver-bridge'
          group_wait: 0s
          repeat_interval: 1h
        # V2.1 Ops-A — Non-critical perf alarms DUAL delivery via Slack
        # (`perf-alerts-slack` here, continue:true) + warning/info bridge
        # GitHub Issue (catch-all `severity=~"warning|info"` route below also
        # matches → `alarm-receiver-bridge` → alertmanager-bridge pod GitHub
        # Issue wrap). Codex `019e4256` REVISE iter-2 P0 absorb —
        # `perf-alerts-github-issues` direct receiver removed; bridge-wrapped
        # GitHub Issue leg preserved through continue:true → catch-all path.
        # Payload wrapper bridge gelirse direct GitHub Issue leg geri eklenir
        # → DUAL → TRIPLE.
        - matchers:
            - team = "perf"
          receiver: 'perf-alerts-slack'
          group_by: ['alertname', 'namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          continue: true
        # Warning/info generic: standard route
        - matchers:
            - severity =~ "warning|info"
          receiver: 'alarm-receiver-bridge'
    receivers:
      - name: 'alarm-receiver-bridge'
        webhook_configs:
          - url: 'http://alertmanager-bridge.monitoring.svc.cluster.local:9093/alert'
            send_resolved: true
            max_alerts: 50
      # V2.1 Ops-A — Perf alerts Slack receiver (Codex 019e267a spike absorb +
      # 019e2772 P0 #2 template fix: `default` Sprig fonksiyonu Alertmanager Go
      # template'inde desteklenmez; `with ... else ... end` pattern).
      # api_url_file: ESO `perf-alertmanager-secrets` Secret → file mount;
      # owner Vault `kv/platform/perf-alertmanager.SLACK_WEBHOOK_URL` yazımı sonrası
      # ESO 1h refresh-interval içinde Secret oluşturur; Alertmanager pod restart
      # gerekmez (file mount auto-update kube-prometheus-stack 84.x pattern).
      - name: 'perf-alerts-slack'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/perf-alertmanager-secrets/SLACK_WEBHOOK_URL
            channel: '#perf-alerts'
            send_resolved: true
            title: 'V2.1 Perf Alert | {{ .GroupLabels.alertname }}'
            text: |-
              *Status:* {{ .Status | toUpper }}
              *Severity:* {{ .CommonLabels.severity }}
              *Namespace:* {{ with .CommonLabels.namespace }}{{ . }}{{ else }}n/a{{ end }}
              *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
              *Runbook:* {{ range .Alerts }}{{ with .Annotations.runbook_url }}{{ . }}{{ else }}—{{ end }}{{ end }}
      # V2.1 Ops-A — Perf alerts GitHub Issues receiver KALDIRILDI (Codex
      # `019e4256` Session 42 REVISE iter-2 P0 absorb — PR #857b sibling).
      #
      # Sebep: Alertmanager `webhook_configs` ham v4 payload gönderir; GitHub
      # `repository_dispatch` API `{event_type, client_payload}` wrapper ister.
      # Alertmanager Go template ile body wrap edilemez. Bu receiver canlıya
      # alınırsa her perf alert için 4xx fail log spam üretir. PR #648 aynı
      # nedenle RED/closed (ref. `docs/session-52-handoff-final-honest-close.md:111`).
      #
      # GitHub Issue trail prod perf alerts için şu an `alarm-receiver-bridge`
      # route → `alertmanager-bridge` pod (Python wrapper) üzerinden akıyor;
      # bridge payload'u doğru wrap eder. perf-alerts-slack receiver ise
      # `api_url_file` ile çalışıyor (Slack webhook POST).
      #
      # Wrapper bridge (sidecar/proxy) PR'ı geldiğinde bu receiver + ilgili
      # secret mount + 2 perf route geri eklenir. Bkz. board issue #857
      # acceptance + RB-prod-alertmanager-activation.md §2.2.
      # D43 outage fallback direct receiver (Codex 019e4234 + 019e0dea iter-2
      # absorb #3): Slack + SMTP combined in a single receiver — simpler than
      # two sibling routes with continue:true (Codex iter-2 verdict). Both
      # legs read credentials from ESO-mounted `alertmanager-fallback-secrets`
      # Secret via file paths (NOT env injection; api_url_file + auth_*_file).
      #
      # Channel choices (prod-specific vs test drill):
      #   * Slack channel `#alerts-d43-drill` — same as test drill default
      #     (Codex 019e4234 verdict: sentinel YASAK; gerçek webhook gerek).
      #     Operator owns the real workspace webhook URL (Slack admin artifact).
      #   * SMTP `notify-ops@acik.com` — placeholder; operator confirms the
      #     prod ops mail group. Smarthost `smtp.office365.com:587` mirrors
      #     notification-orchestrator's Office 365 SMTP relay default.
      #
      # Templates: Alertmanager Go template — Sprig `default` is unsupported
      # in Alertmanager (Codex 019e0dea iter-3 P1 #3); use `{{ with X }}{{ . }}
      # {{ else }}fallback{{ end }}` pattern.
      - name: direct-fallback
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-fallback-secrets/SLACK_WEBHOOK_URL
            channel: '#alerts-d43-drill'
            send_resolved: true
            title: '[D43 PROD] {{ .CommonLabels.alertname }} — {{ .CommonLabels.severity }}'
            text: |-
              {{ range .Alerts }}
              *Alert*: {{ .Labels.alertname }}
              *Cluster*: {{ with .Labels.cluster }}{{ . }}{{ else }}prod{{ end }}
              *Namespace*: {{ with .Labels.namespace }}{{ . }}{{ else }}n/a{{ end }}
              *Severity*: {{ .Labels.severity }}
              *Outage Fallback*: {{ with .Labels.outage_fallback }}{{ . }}{{ else }}false{{ end }}
              *Bypass*: {{ with .Labels.bypass_orchestrator }}{{ . }}{{ else }}false{{ end }}
              *Description*: {{ .Annotations.description }}
              *Runbook*: {{ with .Annotations.runbook_url }}{{ . }}{{ else }}—{{ end }}
              {{ end }}
        email_configs:
          # BLOCKER for board #854 prod activation (BL-008 2026-05-24 finding):
          # Operator v0.90.1 stricter schema reddediyor `auth_username_file`/
          # `auth_password_file` field'larını ("field not found in type
          # config.plain"). Test cluster BL-008 mock-receipt drill bu hatayı
          # email_configs auth_*_file kaldırarak workaround'lamıştı (Mailpit
          # no-auth). PROD aktivasyonu öncesi schema fix gerekir:
          #   Opsiyon 1: inline `auth_username` + `auth_password` (Vault'tan
          #              template injection; ESO ref'i pod env via valueFrom)
          #   Opsiyon 2: Operator upgrade (newer version `_file` desteği)
          # Bu blocker board issue #854 prod activation chain'inde
          # ele alınmalı. Şu an helm upgrade `--kube-context k3d-prod`
          # FAIL eder (ReconciliationFailed status) — runbook §6.5.8
          # SMTP endpoint config note revize edilecek.
          - to: notify-ops@acik.com
            from: alertmanager-fallback@acik.com
            smarthost: 'smtp.office365.com:587'
            auth_username_file: /etc/alertmanager/secrets/alertmanager-fallback-secrets/SMTP_USER
            auth_password_file: /etc/alertmanager/secrets/alertmanager-fallback-secrets/SMTP_PASSWORD
            require_tls: true
            send_resolved: true
            headers:
              subject: '[D43 PROD] {{ .CommonLabels.alertname }}'
            html: |-
              <h3>D43 Outage Fallback — Prod</h3>
              <ul>
              {{ range .Alerts }}
              <li>
                <strong>{{ .Labels.alertname }}</strong> ({{ .Labels.severity }})<br/>
                Cluster: {{ with .Labels.cluster }}{{ . }}{{ else }}prod{{ end }}<br/>
                Namespace: {{ with .Labels.namespace }}{{ . }}{{ else }}n/a{{ end }}<br/>
                Outage Fallback: {{ with .Labels.outage_fallback }}{{ . }}{{ else }}false{{ end }}<br/>
                Bypass Orchestrator: {{ with .Labels.bypass_orchestrator }}{{ . }}{{ else }}false{{ end }}<br/>
                Description: {{ .Annotations.description }}<br/>
                Runbook: {{ with .Annotations.runbook_url }}{{ . }}{{ else }}—{{ end }}
              </li>
              {{ end }}
              </ul>
    inhibit_rules:
      # Critical inhibits warning of same alertname
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'namespace']

# ─── Grafana ───
grafana:
  enabled: true

  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

  # Persistent (dashboards, user DB)
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi

  # Path prefix /grafana
  grafana.ini:
    server:
      root_url: "https://ai.acik.com/grafana"
      serve_from_sub_path: true
    security:
      disable_initial_admin_creation: false
    users:
      default_theme: dark
    auth:
      disable_login_form: false       # SSO gelince true
    # SSO — Keycloak OIDC (şu an kapalı; Faz 3 sonrası)
    # auth.generic_oauth:
    #   enabled: true
    #   name: Keycloak
    #   auth_url: http://keycloak.platform-prod.svc.cluster.local:8080/realms/platform/protocol/openid-connect/auth
    #   token_url: http://keycloak.platform-prod.svc.cluster.local:8080/realms/platform/protocol/openid-connect/token
    #   ...

  # Ingress — Helm kendi ns'inde
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - ai.acik.com
    path: /grafana
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      # D26 admin hardening: intranet + VPN whitelist (staging-sw CIDR cutover'da)
      nginx.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1/32,10.0.0.0/8"

  # Datasource: Loki + Tempo (sonra auto-add)
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
    dashboards:
      enabled: true

  # D26 admin hardening: şifre Git'te DEĞİL. existingSecret ile bootstrap'tan gelir.
  # bootstrap/install-monitoring.sh rastgele üretir ya da Vault'tan çeker.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # M7 T4.3.7 BL-015 — Notify per-template analytics datasource credential
  # Codex iter-3 verdict thread `019e5a75-ebf3-7860-9832-2776a6d185b6` prod activation chain
  # Secret-backed env var (optional:true defer-aware)
  # - ExternalSecret: kustomize/overlays/prod/eso/grafana/externalsecret-grafana-notify-pg.yaml
  # - Datasource ConfigMap: kustomize/base/monitoring/grafana-datasources/notify-pg-datasource.yaml
  # - Operator activation chain: docs/runbooks/RB-grafana-notify-pg-datasource.md §3
  envValueFrom:
    NOTIFY_PG_RO_PASSWORD:
      secretKeyRef:
        name: grafana-notify-pg-secret
        key: NOTIFY_PG_RO_PASSWORD
        optional: true

# ─── Prometheus ───
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1
    retention: 10d                    # D10
    retentionSize: "8GB"

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # ServiceMonitor selector — cluster-wide scrape
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # External URL — /prometheus prefix
    externalUrl: "https://ai.acik.com/prometheus"
    routePrefix: /prometheus

    # External labels — Codex `019e2a4f` Session 53 P0 #1 P1 absorb:
    # PMD DoD §2.4(d) dedupe key contract `alertname + cluster + namespace + configmap`
    # için cluster label gerek. alertmanager-bridge make_issue_title() bu label'i
    # `@<cluster>` suffix olarak kullanır (PR #650 absorb).
    # Test cluster zaten `cluster=test` set ediyor (values-test.yaml:53-55); prod
    # için aynı pattern.
    externalLabels:
      cluster: "prod"
      environment: "prod"

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - ai.acik.com
    paths:
      - /prometheus
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      # D26 admin hardening: Prometheus raw query endpoint'i sızarsa metadata sızar
      nginx.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1/32,10.0.0.0/8"

# ─── Prometheus Operator ───
prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

  # Admission webhook — HA gerekmez tek node'da
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

# ─── kube-state-metrics ───
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  # Ops-B core (Codex `019e26c5` R2 absorb): annotation allowlist gerekli ki
  # `kube_configmap_annotations` metric'i frontend-federation-smoke.io/* keylerini
  # label olarak expose etsin. Allowlist olmadan ConfigMap annotation default scrape
  # edilmez. PrometheusRule (frontend-federation-smoke-alerts) bu metric'e bağlı.
  extraArgs:
    - --metric-annotations-allowlist=configmaps=[frontend-federation-smoke.io/last-fire,frontend-federation-smoke.io/result,frontend-federation-smoke.io/failures]

# ─── node-exporter ───
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# ─── Bileşenleri kapat (k3s'de yok / gerekmiyor) ───
kubeControllerManager:
  enabled: false                      # k3s combined server
kubeEtcd:
  enabled: false                      # SQLite
kubeScheduler:
  enabled: false                      # k3s combined server
kubeProxy:
  enabled: false                      # k3s embedded
