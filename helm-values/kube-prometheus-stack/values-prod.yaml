# kube-prometheus-stack — prod cluster (D10: Prom 10d, Loki 7d, Tempo 48h)
# D27: upstream-first — Grafana dashboard'ları otomatik yerleşik
# Path routing: /grafana, /prometheus (Helm Ingress kendi ns'inde)

# Namespace / cluster-scope
nameOverride: ""
fullnameOverride: ""

# Kritik bileşenler
crds:
  enabled: true

defaultRules:
  create: true                        # prom community alerts
  rules:
    alertmanager: true
    etcd: false                       # k3d'de etcd yok (SQLite)
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false      # k3s'te ayrı değil
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

# ─── Alertmanager ───
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 1                       # D21: HPA yok

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi

    # Storage — local-path provisioner
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

    # V2.1 Ops-A — Perf alert receiver secret mount (Codex 019e267a spike absorb)
    # ESO `perf-alertmanager-secrets` K8s Secret pod'a file mount edilir;
    # Alertmanager config `slack_configs.api_url_file` ile path okur (env injection DEĞİL).
    # Mount path: /etc/alertmanager/secrets/perf-alertmanager-secrets/SLACK_WEBHOOK_URL
    secrets:
      - perf-alertmanager-secrets
      # V2.1 Ops-A GitHub Issues receiver (Codex 019e2a4f Q1+Q2 + PR #645 spike):
      # Vault'tan bağımsız PAT mount; GHA secret olarak da configure edilebilir.
      # Mount path: /etc/alertmanager/secrets/github-issues-receiver-token/GITHUB_TOKEN
      # Owner action: kubectl create secret generic github-issues-receiver-token \
      #   --from-literal=GITHUB_TOKEN=<PAT_with_repo_workflow_scope>
      - github-issues-receiver-token
      # D43 fallback secret (mevcut, audit only — alarm-receiver-bridge baseline path)
      - alertmanager-fallback-secrets

  ingress:
    enabled: false                    # admin-only, kubectl port-forward ile ulaş

  # AlertManager → alarm_receiver bridge config (Codex Sprint A follow-up)
  # Observability alarm'ları drift detection alarm_receiver pipeline'ına bağlanıyor.
  # Bridge: alertmanager-bridge K8s service (kustomize/base/monitoring/alertmanager-bridge/).
  #
  # V2.1 Ops-A extension (Codex 019e267a spike AGREE_AFTER_REVISIONS +
  # 019e2772 post-impl review P0/P1/P2 absorb):
  # `team=perf` matched alert'ler perf-alerts-slack receiver'a (#perf-alerts);
  # critical perf alarmları DUAL delivery (Slack + bridge P1 yolu korunuyor);
  # throttle group_interval: 5m, repeat_interval: 6h (alarm fatigue azaltma).
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'alarm-receiver-bridge'
      routes:
        # V2.1 Ops-A — Critical perf alarms TRIPLE delivery (Codex 019e2772 P1 + 019e2a4f Q1+Q2):
        # 1. perf-alerts-github-issues (continue:true → 2. + 3.) — Vault'tan bağımsız (V2.1 #4 closure)
        # 2. perf-alerts-slack (continue:true → 3. critical bridge route) — Vault DR sonrası activate
        # 3. critical bridge (P1 operator action <10min pipeline)
        - matchers:
            - team = "perf"
            - severity = "critical"
          receiver: 'perf-alerts-github-issues'
          group_by: ['alertname', 'namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          continue: true
        - matchers:
            - team = "perf"
            - severity = "critical"
          receiver: 'perf-alerts-slack'
          group_by: ['alertname', 'namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          continue: true
        # Critical generic: page immediately, no grouping (catches DUAL-delivered perf-critical too)
        - matchers:
            - severity = "critical"
          receiver: 'alarm-receiver-bridge'
          group_wait: 0s
          repeat_interval: 1h
        # V2.1 Ops-A — Non-critical perf alarms DUAL delivery (warning/info)
        # GitHub Issues (V2.1 #4 closure path) + Slack (Vault DR sonrası).
        - matchers:
            - team = "perf"
          receiver: 'perf-alerts-github-issues'
          group_by: ['alertname', 'namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          continue: true
        - matchers:
            - team = "perf"
          receiver: 'perf-alerts-slack'
          group_by: ['alertname', 'namespace']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
          continue: false
        # Warning/info generic: standard route
        - matchers:
            - severity =~ "warning|info"
          receiver: 'alarm-receiver-bridge'
    receivers:
      - name: 'alarm-receiver-bridge'
        webhook_configs:
          - url: 'http://alertmanager-bridge.monitoring.svc.cluster.local:9093/alert'
            send_resolved: true
            max_alerts: 50
      # V2.1 Ops-A — Perf alerts Slack receiver (Codex 019e267a spike absorb +
      # 019e2772 P0 #2 template fix: `default` Sprig fonksiyonu Alertmanager Go
      # template'inde desteklenmez; `with ... else ... end` pattern).
      # api_url_file: ESO `perf-alertmanager-secrets` Secret → file mount;
      # owner Vault `kv/platform/perf-alertmanager.SLACK_WEBHOOK_URL` yazımı sonrası
      # ESO 1h refresh-interval içinde Secret oluşturur; Alertmanager pod restart
      # gerekmez (file mount auto-update kube-prometheus-stack 84.x pattern).
      - name: 'perf-alerts-slack'
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/perf-alertmanager-secrets/SLACK_WEBHOOK_URL
            channel: '#perf-alerts'
            send_resolved: true
            title: 'V2.1 Perf Alert | {{ .GroupLabels.alertname }}'
            text: |-
              *Status:* {{ .Status | toUpper }}
              *Severity:* {{ .CommonLabels.severity }}
              *Namespace:* {{ with .CommonLabels.namespace }}{{ . }}{{ else }}n/a{{ end }}
              *Description:* {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
              *Runbook:* {{ range .Alerts }}{{ with .Annotations.runbook_url }}{{ . }}{{ else }}—{{ end }}{{ end }}
      # V2.1 Ops-A — Perf alerts GitHub Issues receiver (Codex 019e2a4f Q1+Q2 + PR #645 spike).
      # Vault DR blocker bypass: GitHub PAT GHA secret olarak veya K8s Secret manual create.
      # Alertmanager webhook → GitHub API repository_dispatch → .github/workflows/alert-receiver.yml
      # → Issue create/comment/close lifecycle.
      #
      # http_config Bearer auth header_file:
      #   /etc/alertmanager/secrets/github-issues-receiver-token/GITHUB_TOKEN
      #
      # Payload: Alertmanager v4 webhook format (status + commonLabels + alerts[] + annotations)
      # Workflow parses STATUS, ALERTNAME, SEVERITY, NAMESPACE, DESC, RUNBOOK → Issue body.
      # Dedupe: label `alert/<alertname>/<namespace>`; existing open issue → comment, no new.
      # Resolved lifecycle: status=resolved → issue close + comment.
      - name: 'perf-alerts-github-issues'
        webhook_configs:
          - url: 'https://api.github.com/repos/Halildeu/platform-k8s-gitops/dispatches'
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/github-issues-receiver-token/GITHUB_TOKEN
            send_resolved: true
            max_alerts: 50
            # Alertmanager webhook payload mapping → GitHub repository_dispatch:
            # body = {"event_type": "perf-alert", "client_payload": <alertmanager v4 webhook>}
            # Alertmanager Go template ile wrap edilemez; workflow parser PAYLOAD field'larını
            # commonLabels/alerts[]/status üzerinden okur (toJSON GitHub Actions side).
    inhibit_rules:
      # Critical inhibits warning of same alertname
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'namespace']

# ─── Grafana ───
grafana:
  enabled: true

  replicas: 1

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

  # Persistent (dashboards, user DB)
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi

  # Path prefix /grafana
  grafana.ini:
    server:
      root_url: "https://ai.acik.com/grafana"
      serve_from_sub_path: true
    security:
      disable_initial_admin_creation: false
    users:
      default_theme: dark
    auth:
      disable_login_form: false       # SSO gelince true
    # SSO — Keycloak OIDC (şu an kapalı; Faz 3 sonrası)
    # auth.generic_oauth:
    #   enabled: true
    #   name: Keycloak
    #   auth_url: http://keycloak.platform-prod.svc.cluster.local:8080/realms/platform/protocol/openid-connect/auth
    #   token_url: http://keycloak.platform-prod.svc.cluster.local:8080/realms/platform/protocol/openid-connect/token
    #   ...

  # Ingress — Helm kendi ns'inde
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - ai.acik.com
    path: /grafana
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      # D26 admin hardening: intranet + VPN whitelist (staging-sw CIDR cutover'da)
      nginx.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1/32,10.0.0.0/8"

  # Datasource: Loki + Tempo (sonra auto-add)
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
    dashboards:
      enabled: true

  # D26 admin hardening: şifre Git'te DEĞİL. existingSecret ile bootstrap'tan gelir.
  # bootstrap/install-monitoring.sh rastgele üretir ya da Vault'tan çeker.
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

# ─── Prometheus ───
prometheus:
  enabled: true

  prometheusSpec:
    replicas: 1
    retention: 10d                    # D10
    retentionSize: "8GB"

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    # ServiceMonitor selector — cluster-wide scrape
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # External URL — /prometheus prefix
    externalUrl: "https://ai.acik.com/prometheus"
    routePrefix: /prometheus

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - ai.acik.com
    paths:
      - /prometheus
    pathType: Prefix
    annotations:
      nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
      # D26 admin hardening: Prometheus raw query endpoint'i sızarsa metadata sızar
      nginx.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1/32,10.0.0.0/8"

# ─── Prometheus Operator ───
prometheusOperator:
  enabled: true

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

  # Admission webhook — HA gerekmez tek node'da
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true

# ─── kube-state-metrics ───
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  # Ops-B core (Codex `019e26c5` R2 absorb): annotation allowlist gerekli ki
  # `kube_configmap_annotations` metric'i frontend-federation-smoke.io/* keylerini
  # label olarak expose etsin. Allowlist olmadan ConfigMap annotation default scrape
  # edilmez. PrometheusRule (frontend-federation-smoke-alerts) bu metric'e bağlı.
  extraArgs:
    - --metric-annotations-allowlist=configmaps=[frontend-federation-smoke.io/last-fire,frontend-federation-smoke.io/result,frontend-federation-smoke.io/failures]

# ─── node-exporter ───
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# ─── Bileşenleri kapat (k3s'de yok / gerekmiyor) ───
kubeControllerManager:
  enabled: false                      # k3s combined server
kubeEtcd:
  enabled: false                      # SQLite
kubeScheduler:
  enabled: false                      # k3s combined server
kubeProxy:
  enabled: false                      # k3s embedded
