# Faz 23.2.D T1.4 D43 Outage Fallback Drill — test cluster Helm override.
#
# Bağlam: Mevcut values-test.yaml `alertmanager.enabled=false` (test cluster
# resource quota tasarrufu). D43 drill için Alertmanager geçici enable + native
# Slack/SMTP fallback receiver + dedicated route. Drill bittiğinde bu override
# dosyası kullanımdan çıkar, helm upgrade override'sız ile values-test.yaml
# baz tek başına kalır.
#
# Codex thread 019e0dea iter-2 absorb #2: --reset-values YERINE override file
# pattern. Revert: `helm upgrade ... -f values-test.yaml` (override'sız).
#
# Codex iter-2 absorb #3: Tek receiver `direct-fallback` (slack_configs +
# email_configs birlikte). İki sibling route + continue:true patterni daha
# karmaşık ve hatalıdır.
#
# Codex iter-2 absorb #4: alertmanagerSpec.secrets[] mount + Alertmanager
# config'te file path (api_url_file / auth_username_file / auth_password_file)
# secret env injection değil.
#
# Codex iter-3 absorb (P1):
#   #2: Self-contained Alertmanager config (root route.receiver explicit).
#       values-test.yaml default Alertmanager config taşımıyor; remote chart
#       null receiver'a düşmesin. Burada FULL Alertmanager config sağlanır.
#   #3: Sprig `default` Alertmanager Go template'inde mevcut değil. `{{ with X }}
#       {{ . }}{{ else }}fallback{{ end }}` pattern'i kullanılır.
#
# Apply (drill window aç):
#   helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring \
#     -f helm-values/kube-prometheus-stack/values-test.yaml \
#     -f helm-values/kube-prometheus-stack/values-test-d43-drill.yaml
#
# Apply (drill window kapat — baseline'a dön):
#   helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     -n monitoring \
#     -f helm-values/kube-prometheus-stack/values-test.yaml

alertmanager:
  enabled: true
  alertmanagerSpec:
    # Codex iter-2 absorb #4: ESO Secret mount via secrets[] field;
    # Alertmanager Operator pod'a /etc/alertmanager/secrets/<name>/<key> path'inde
    # mount eder. Config'te file path kullanılacak (api_url_file gibi).
    secrets:
      - alertmanager-fallback-secrets
    # Drill window minimal resource (test cluster 8-core quota disiplin).
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # Single replica drill için yeterli.
    replicas: 1
    # Dedicated retention drill kanıtı için kısa (24h).
    retention: 24h
  # Native Alertmanager FULL config — Codex iter-3 P1 #2 absorb: self-contained.
  # Drill window'da root route.receiver `direct-fallback`; sub-route NotifyServiceDown
  # match aynı receiver'a gider (sade pattern, daha az hata yüzeyi).
  # values-test.yaml baseline Alertmanager config taşımıyor + chart default'una
  # güvenmemek için bu config tam yazılmalı.
  config:
    global:
      resolve_timeout: 5m
    route:
      # Codex thread `019e5aaf` REVISE absorb (BL-008 2026-05-24): root route
      # `null` — drill window'da default null receiver, gereksiz POST/mail
      # noise yok. Sadece D43 outage fallback alert'leri explicit regex match
      # ile `direct-fallback` receiver'a yönlendirilir.
      receiver: "null"
      group_by: ['alertname', 'severity', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 30m
      routes:
        # D43 outage fallback dar match — NotifyServiceDown VEYA NotifyServiceAbsent.
        # Codex `019e5aaf` REVISE absorb: explicit regex; root null kalır,
        # sadece bu iki alert direct-fallback'e gider.
        - matchers:
            - alertname =~ "NotifyServiceDown|NotifyServiceAbsent"
          receiver: direct-fallback
          group_wait: 0s
          repeat_interval: 30m
          continue: false
    receivers:
      # Codex `019e5aaf` REVISE absorb: null receiver eklenir (root drop için).
      # 2026-05-24 user decision Slack DEFER absorb via Codex 019e5b9c REVISE
      # plan: SMTP-only direct-fallback receiver. Slack channel removed per
      # user decision 2026-05-24 ("slack kullanmıyoruz. sonrasınd agelirse
      # yapılacak"). Future Slack reactivation requires operator workspace
      # adoption + admin onayı + Vault SLACK_WEBHOOK_URL seed + this block
      # re-add (atomic in same PR with drill rerun).
      #
      # Slack-only historical (pre-2026-05-24 user decision Slack DEFER):
      # `slack_configs` block previously routed to #alerts-d43-drill via
      # api_url_file: /etc/alertmanager/secrets/alertmanager-fallback-secrets/SLACK_WEBHOOK_URL
      # using `webhook-receiver.platform-test.svc.cluster.local:8080/slack-mock`
      # (BL-008 2026-05-24 dual-receipt drill in-cluster mock URL).
      # Removed in PR Lane B (roadmap-faz23-d43-slack-defer-helm-cleanup).
      # Reference: docs/faz-23-evidence/2026-05-24-d43-slack-defer-smtp-only-acceptance.md
      - name: "null"
      - name: direct-fallback
        email_configs:
          # NOTE 2026-05-24 (Codex `019e5aaf` post-impl absorb): Mailpit
          # accepts unauthenticated SMTP; Operator v0.90.1 doesn't recognize
          # `auth_*_file` fields in email_configs schema. For the
          # in-cluster mock drill, auth_* fields are omitted (Mailpit
          # require_tls=false + no auth required). Real prod SMTP relays
          # (Office 365 etc.) MUST use inline `auth_username` /
          # `auth_password` or `_file` variants per Operator version
          # support — see RB-notification-outage-fallback.md §6.5.8.
          - to: drill-fallback@local
            from: alertmanager-fallback@local
            smarthost: 'mailpit.platform-test.svc.cluster.local:587'
            require_tls: false
            send_resolved: true
            headers:
              subject: '[D43 DRILL] {{ .CommonLabels.alertname }}'
            html: |-
              <h3>D43 Outage Fallback Drill</h3>
              <ul>
              {{ range .Alerts }}
              <li>
                <strong>{{ .Labels.alertname }}</strong> ({{ .Labels.severity }})<br/>
                Cluster: {{ with .Labels.cluster }}{{ . }}{{ else }}k3d-test{{ end }}<br/>
                Outage Fallback: {{ with .Labels.outage_fallback }}{{ . }}{{ else }}false{{ end }}<br/>
                Description: {{ .Annotations.description }}
              </li>
              {{ end }}
              </ul>
