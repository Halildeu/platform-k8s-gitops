# /etc/logrotate.d/git-cleanup-audit.conf — Codex 019df310 absorb
#
# AI auto-merge cleanup audit log rotation policy.
# Default: ~/.claude/logs/git-cleanup.log (host-level, repo-bağımsız).
#
# Usage:
#   sudo cp scripts/ops/systemd/git-cleanup-audit-logrotate.conf /etc/logrotate.d/
#   sudo logrotate -d /etc/logrotate.d/git-cleanup-audit.conf  # dry-run
#
# Behavior:
#   - Daily rotation (logs append throughout day, rotate at midnight)
#   - Keep 365 rotations (1+ year forensic recovery — matches archive tag retention claim)
#   - Compress old rotations (gzip)
#   - Don't truncate active log (copytruncate avoid; use create instead)
#   - Tamper-detection: read-only after rotate (operator-only edit)

/Users/halilkocoglu/.claude/logs/git-cleanup.log
/home/halil/.claude/logs/git-cleanup.log
/var/log/platform-cleanup/git-cleanup.log
{
  daily
  rotate 365
  compress
  delaycompress
  missingok
  notifempty
  create 0600 halil halil
  # Tamper-detection: rotated logs read-only (sudo to edit)
  postrotate
    /bin/chmod 0400 $(ls -t /Users/halilkocoglu/.claude/logs/git-cleanup.log.*.gz 2>/dev/null | head -1) 2>/dev/null || true
    /bin/chmod 0400 $(ls -t /home/halil/.claude/logs/git-cleanup.log.*.gz 2>/dev/null | head -1) 2>/dev/null || true
  endscript
  # Forensic note: rotation audit
  prerotate
    echo "$(date -Iseconds) | logrotate | git-cleanup-audit rotation triggered" >> /var/log/platform-cleanup/rotation-audit.log 2>/dev/null || true
  endscript
}
