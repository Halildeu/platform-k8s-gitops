# Faz 16.3 — ETL Tables Manifest (Codex iter-5 AGREE / iter-6 absorb)
# 40 tablo allowlist. Per-table:
# - source_schema: workcube_mikrolink (canonical) veya parametric (workcube_mikrolink_1, _2, ...)
# - idempotency_key: business PK kolon listesi (Codex iter-5: manifest zorunlu, runtime tahmin etmesin)
# - parametric: bool (yıllık schema mode)
# - source_year_column: parametric için fiscal year extraction
# - reports: bu tablo hangi raporlarda kullanılır (audit)
# - columns: pg_type + nullable + max_length (Codex iter-6: Day 7 fail-fast)
#
# Manifest validation: etl-worker validate-manifest
# Source uyuşmazlığı: fail-fast (PK mismatch, table not found, columns missing)
#
# Day 7 KAPSAMINDA: COMPANY + BRANCH (V16 DDL doğrudan; minimal kolon altkümesi
# — production manifest tüm kolonlar için V16 generator çıktısından üretilecek
# (Faz 16.3.E placeholder)).

version: "1.0-DRAFT"
contract_ref: "docs/migration/mssql-pg-data-contract.md"
annex_ref: "docs/migration/report-source-annex.yaml"

# ============================================================================
# Canonical tables (snapshot var, generator full DDL)
# ============================================================================

tables:
  # Faz 21.3 D35-1 anchor: OUR_COMPANY is the AÇIK org's tenant-scoped table
  # (42 rows in source). PR-3 of ADR-0010 OUR_COMPANY drift fix sequence;
  # Codex `019dd34e` hybrid contract — anchor for company scope_kind in V25.
  # Snapshot: docs/migration/workcube-schema.json shows 68 columns; minimum
  # subset here for D35-1 evidence. Full set extends post-D35-2 if needed.
  - name: OUR_COMPANY
    source_schema: workcube_mikrolink
    parametric: false
    idempotency_key: [COMP_ID]
    reports: [d35-1-anchor]
    notes: "Tenant-scoped (AÇIK org's 42 OUR companies). D35-1 anchor table per Codex 019dd34e + V25 hybrid contract. PK = COMP_ID."
    columns:
      - { name: COMP_ID,       pg_type: INTEGER,        nullable: false }
      - { name: COMPANY_NAME,  pg_type: VARCHAR(200),   nullable: true,  max_length: 200 }
      - { name: NICK_NAME,     pg_type: VARCHAR(50),    nullable: true,  max_length: 50 }
      - { name: TAX_OFFICE,    pg_type: VARCHAR(50),    nullable: true,  max_length: 50 }
      - { name: TAX_NO,        pg_type: VARCHAR(50),    nullable: true,  max_length: 50 }

  # COMPANY remains for financial reports + 2-hop tenant predicates
  # (BRANCH/PRO_PROJECTS join through COMPANY to OUR_COMPANY). NOT the
  # anchor for company scope_kind (that role is now OUR_COMPANY per V25).
  - name: COMPANY
    source_schema: workcube_mikrolink
    parametric: false
    idempotency_key: [COMPANY_ID]
    reports: [fin-company-listing]
    notes: "113 kolon canonical; Day 7 dry-run minimal subset, full set Faz 16.3.E. NOT D35-1 anchor — that's OUR_COMPANY (V25)."
    columns:
      - { name: COMPANY_ID,    pg_type: INTEGER,        nullable: false }
      - { name: COMPANYCAT_ID, pg_type: INTEGER,        nullable: false }
      - { name: COMPANY_STATUS, pg_type: BOOLEAN,       nullable: false }
      - { name: NICKNAME,      pg_type: VARCHAR(150),   nullable: true,  max_length: 150 }
      - { name: FULLNAME,      pg_type: VARCHAR(250),   nullable: true,  max_length: 250 }
      - { name: TAXOFFICE,     pg_type: VARCHAR(50),    nullable: true,  max_length: 50 }
      - { name: TAXNO,         pg_type: VARCHAR(43),    nullable: true,  max_length: 43 }
      - { name: COMPANY_EMAIL, pg_type: VARCHAR(100),   nullable: true,  max_length: 100 }
      - { name: OUR_COMPANY_ID, pg_type: INTEGER,       nullable: true }

  - name: BRANCH
    source_schema: workcube_mikrolink
    parametric: false
    idempotency_key: [BRANCH_ID]
    reports: [fin-branch-listing]
    notes: "Branches/locations; Day 7 minimal subset."
    columns:
      - { name: BRANCH_ID,      pg_type: INTEGER,       nullable: false }
      - { name: BRANCH_STATUS,  pg_type: BOOLEAN,       nullable: false }
      - { name: COMPANY_ID,     pg_type: INTEGER,       nullable: true }
      - { name: BRANCH_NAME,    pg_type: VARCHAR(50),   nullable: false, max_length: 50 }
      - { name: BRANCH_FULLNAME, pg_type: VARCHAR(250), nullable: true,  max_length: 250 }
      - { name: BRANCH_EMAIL,   pg_type: VARCHAR(75),   nullable: true,  max_length: 75 }
      - { name: BRANCH_ADDRESS, pg_type: VARCHAR(250),  nullable: true,  max_length: 250 }

  # COMPANY_PARTNER: V16 DDL'de yok (snapshot eksik) — Faz 16.2.P sprint
  # sonrası schema-service crawl tamamlanınca kolonlar eklenir + V16 generator
  # rerun. O zamana kadar bu tablo manifest dışı; çağıranlar fail-fast alır.

  # ============================================================================
  # Faz 21.1 — Veri Erişimi entity'leri (Codex 019dc8b4 AGREE)
  # ============================================================================
  # Source-of-truth: docs/migration/depolar-source-decision.md (Faz 21.A merged).
  # data_access.scope_kind ↔ source_table contract (V20):
  #   project → PRO_PROJECTS
  #   depot   → DEPARTMENT
  # SETUP_DEPARTMENT_TYPE lookup ETL kapsamı dışı (Faz 21.4 backend repo işi).

  - name: PRO_PROJECTS
    source_schema: workcube_mikrolink
    parametric: false
    idempotency_key: [PROJECT_ID]
    reports: [data-access-scope-listing]
    notes: "Veri Erişimi → Projeler (Faz 21.1). Min kolon altkümesi (75 toplam)."
    columns:
      - { name: PROJECT_ID,      pg_type: INTEGER,        nullable: false }
      - { name: PROJECT_NUMBER,  pg_type: VARCHAR(50),    nullable: true,  max_length: 50 }
      - { name: PROJECT_STATUS,  pg_type: BOOLEAN,        nullable: true }
      - { name: PROJECT_HEAD,    pg_type: VARCHAR(100),   nullable: false, max_length: 100 }
      - { name: PROJECT_EMP_ID,  pg_type: INTEGER,        nullable: true }
      - { name: AGREEMENT_NO,    pg_type: VARCHAR(43),    nullable: true,  max_length: 43 }

  - name: DEPARTMENT
    source_schema: workcube_mikrolink
    parametric: false
    idempotency_key: [DEPARTMENT_ID]
    reports: [data-access-scope-listing]
    notes: |
      Veri Erişimi → Depolar (Faz 21.1, Faz 21.A karar).
      DEPARTMENT multi-purpose (HR + fiziksel lokasyon).
      Filter PG-side data_access listing query'sinde uygulanır
      (DEPARTMENT_TYPE in (...) OR IS_STORE > 0). Min kolon altkümesi (43 toplam).
    columns:
      - { name: DEPARTMENT_ID,         pg_type: INTEGER,        nullable: false }
      - { name: DEPARTMENT_STATUS,     pg_type: BOOLEAN,        nullable: true }
      - { name: IS_STORE,              pg_type: INTEGER,        nullable: true }
      - { name: BRANCH_ID,             pg_type: INTEGER,        nullable: true }
      - { name: OUR_COMPANY_ID,        pg_type: INTEGER,        nullable: true }
      - { name: DEPARTMENT_HEAD,       pg_type: VARCHAR(100),   nullable: false, max_length: 100 }
      - { name: DEPARTMENT_DETAIL,     pg_type: VARCHAR(150),   nullable: true,  max_length: 150 }
      - { name: HIERARCHY_DEP_ID,      pg_type: VARCHAR(50),    nullable: true,  max_length: 50 }
      - { name: HIERARCHY,             pg_type: VARCHAR(75),    nullable: true,  max_length: 75 }
      - { name: LEVEL_NO,              pg_type: INTEGER,        nullable: true }
      - { name: DEPARTMENT_TYPE,       pg_type: INTEGER,        nullable: true }
      - { name: DEPARTMENT_CAT,        pg_type: INTEGER,        nullable: true }
      - { name: ADMIN1_POSITION_CODE,  pg_type: INTEGER,        nullable: true }
      - { name: ADMIN2_POSITION_CODE,  pg_type: INTEGER,        nullable: true }
      - { name: DEPARTMENT_ADDRESS,    pg_type: VARCHAR(500),   nullable: true,  max_length: 500 }

  # TODO: kalan 18 matched canonical tablo (V16 generator çıktısından kopyala)
  # TODO: 17 parametric tablo (Faz 16.2.P snapshot sonrası)

# ============================================================================
# Validation rules (Codex iter-5/6)
# ============================================================================

validation:
  fail_on_pk_mismatch: true       # idempotency_key INFORMATION_SCHEMA'da yoksa abort
  fail_on_missing_table: true      # tablo MSSQL'de yoksa abort
  fail_on_empty_columns: true      # Codex iter-6: columns boş manifest entry kabul edilmez
  warn_on_extra_columns: true      # snapshot'tan fazla kolon varsa warn (drift)
  max_reject_ratio_default: 0.0    # cutover: 0; dry-run: 0.05 (override CLI)
