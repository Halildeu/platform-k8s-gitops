#   idempotency_key: [BANK_ACTION_ID]
#   reports: [fin-banka-hareketleri, fin-nakit-akis-ozet]
#   notes: "TODO_PARAMETRIC_SCHEMA_SNAPSHOT_REQUIRED"

# ============================================================================
# Validation rules (Codex iter-5)
# ============================================================================

validation:
  fail_on_pk_mismatch: true       # idempotency_key INFORMATION_SCHEMA'da yoksa abort
  fail_on_missing_table: true      # tablo MSSQL'de yoksa abort
  warn_on_extra_columns: true      # snapshot'tan fazla kolon varsa warn (drift)
  max_reject_ratio_default: 0.0    # cutover: 0; dry-run: 0.05 (override CLI)
