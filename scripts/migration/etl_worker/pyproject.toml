[project]
name = "etl-worker"
version = "0.1.0"
description = "Faz 16.3 — Workcube MSSQL → PG ETL stand-alone worker (Codex iter-5 AGREE)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Platform Team", email = "platform@acik.com" }]

dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.2",
    "pyodbc>=5.1",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
etl-worker = "etl_worker.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
