# iter-50 Step 3.4a — Self-hosted GitHub Actions runner (staging-sw).
#
# Codex 019dded6 S1 sertleştirmesi:
#   - Tek amaçlı runner; testai-deploy event'leri için.
#   - docker.sock NO mount (deploy işi container build/job çalıştırmamalı).
#   - Mount'lar: kubeconfig RO + releases dir RW.
#   - PR event'lerinde asla çalıştırma — workflow yan(`.github/workflows/deploy-testai.yml`)
#     `if: github.event_name == 'repository_dispatch'` guard ile zorlanır.
#
# Setup:
#   1. .env dosyası oluştur (.env.example'ı kopyala + doldur)
#   2. GitHub UI'da new self-hosted runner oluştur, registration token al
#   3. RUNNER_REGISTRATION_TOKEN env'i set et
#   4. `docker compose up -d`
#   5. GitHub Settings → Actions → Runners'da `staging-sw-testai-deploy` görünmeli
#
# Runner ephemeral mode'da; her job sonrası container restart eder ve
# yeni registration token ile yeniden bağlanır. Bu güvenlik için (token
# hijacking riski azalır) ve runner image upgrade için kolaylık sağlar.

services:
  runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: gha-runner-testai-deploy:latest
    container_name: platform-gha-runner-testai-deploy
    restart: unless-stopped

    # Container kullanıcı: runner (UID 1000 default). Host'ta runner için
    # /home/halil/platform/web-stage/releases write yetkisi gerek.
    user: runner

    environment:
      RUNNER_REPO: ${RUNNER_REPO}
      RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN}
      RUNNER_NAME: ${RUNNER_NAME:-staging-sw-testai-deploy}
      # Codex S1: tek amaçlı label set
      RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,staging-sw,testai-deploy}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}

    volumes:
      # kubeconfig — read-only (k3d-test context için)
      - ${HOST_KUBECONFIG:-/home/halil/.kube/config}:/home/runner/.kube/config:ro

      # Host nginx releases dir — read-write (kubectl cp + rsync target)
      - /home/halil/platform/web-stage/releases:/home/halil/platform/web-stage/releases:rw

      # Codex S1: docker.sock NO mount — silinmiş özellikle.
      # - /var/run/docker.sock:/var/run/docker.sock  # ❌ DO NOT ADD

    # Runner k3d-test API'sine ulaşmak için host network değil bridge yeterli;
    # ama "kubectl --context k3d-test" doğrudan k3d API endpoint'e gider
    # (genelde 0.0.0.0:RANDOM port). Eğer kubeconfig API URL `https://localhost:RANDOM`
    # ise host network gerek.
    network_mode: host
