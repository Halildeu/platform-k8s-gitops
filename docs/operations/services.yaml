      prod: deferred   # Faz 24 D30 cutover'a kadar prod overlay'e dahil değil

  - name: cross-ai-deployment-protection
    repo: platform-k8s-gitops
    description: |
      Faz 22.6 #2502 signed Cross-AI deployment-protection GitHub App observer.
      Phase 1 receives only the exact HMAC-protected deployment-protection
      webhook path and persists the accepted delivery in a local SQLite PVC.
      It has no evaluator App private key, GitHub callback client, Kubernetes
      service-account token or egress. An HTTP 202 is observe-queue admission,
      not a deployment approval or product acceptance signal.
    jwt_validates: false  # GitHub webhook HMAC; not a user JWT endpoint
    route_external: true  # exact /github-apps/cross-ai-deployment-protection ingress
    workload_kind: Deployment
    runtime_class: lab-tool
    probe_contract: exempt  # app-native /healthz + /readyz split
    environments:
      test: enabled
      prod: deferred   # ADR-0045 v1 production/custom-rule activation out of scope

  - name: redis-streams-exporter
    repo: oliver006/redis_exporter
    description: |
      Faz 24 PR-obs-01a (gitops#1247): Redis Streams chunk transport queue
      görünürlüğü — stream length + consumer-group lag/pending/idle (XINFO,
      32 partition explicit check-single-streams). Hedef: host-services
      redis-streams D19 bridge (host-compose/redis-streams). Parola ESO
      kv/platform/audio-gateway-service.redis_password (paylaşımlı requirepass
      — geçici; read-only ACL ayrımı follow-up gitops#1457). ServiceMonitor
      9121 /metrics; netpol allow-monitoring-scrape 9121.
    jwt_validates: false  # internal metrics endpoint, monitoring-ns scrape only
    route_external: false
    third_party: true
    workload_kind: Deployment
    runtime_class: lab-tool
    probe_contract: exempt   # redis_exporter kendi /health modeli (healthz seti dışı)
    environments:
      test: enabled
      prod: deferred   # prod'da Redis Streams yok — D30 cutover'da runtime ile birlikte

  - name: audit-archive-exporter
    repo: prometheuscommunity/postgres-exporter
    description: |
      Faz 24 PR-obs-02 (gitops#1656, ADR-0042 §4): audit-retention-worker
      DB-state observability — postgres_exporter custom queries over the durable
      audit_archive.* state (cursor/ledger). The worker is a run-once CronJob so
      its in-process Micrometer counters are ephemeral; this always-on exporter
      surfaces the DB truth + the companion PrometheusRule alerts on it. Read-only
      role via ESO kv/platform/audit-archive-exporter; ServiceMonitor 9187 /metrics.
      Network posture = redis-streams-exporter parity (part-of=platform → shared
      allow-egress-host-bridge + allow-monitoring-scrape 9187); DB blast radius is
      bounded by the dedicated read-only role, not the network layer.
    jwt_validates: false  # internal metrics endpoint, monitoring-ns scrape only
    route_external: false
    third_party: true
    workload_kind: Deployment
    runtime_class: lab-tool
    probe_contract: exempt   # postgres_exporter tcp/metrics; no actuator healthz set
    environments:
      test: enabled
      prod: deferred   # worker/exporter test-only until the ADR-0042 §5 prod gate

