      SHA256SUMS,release-manifest.json}. Image
      ghcr.io/halildeu/platform-agent-artifacts (built by the platform-agent
      release workflow), pulled with ghcr-pull, D30 digest-pinned.
    jwt_validates: false  # static artifact host, no auth (public install URL)
    route_external: true  # /artifacts path (edge → cluster ingress)
    workload_kind: Deployment
    runtime_class: nginx
    probe_contract: http-healthz   # /healthz nginx
    environments:
      test: enabled
      prod: enabled    # Faz 22.5 prod-enable (gitops#1436; supersedes #1429):
                       # in prod overlay (../../base/apps/artifact-host) + image
                       # digest pin (v0.2.3 @sha256:d8e4b1c7… — trusted-internal-ca,
                       # /current/ alias) + /artifacts Ingress path. ai.acik.com/
                       # artifacts serves the real installer (no longer SPA
                       # fallback). Edge unchanged — the prod `/` catch-all
                       # already forwards /artifacts to the cluster ingress.
                       # Public exposure of the lab-signed installer; owner
                       # sign-off 2026-06-10 ("Onayla + sonuna kadar sür"). The
                       # endpoint-admin UI one-command derives -ApiUrl from
                       # window.location.origin → prod installs target ai.acik.com
