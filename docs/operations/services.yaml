# Service Catalog Manifest — Codex Sprint A P0
#
# Single-source-of-truth for "which services exist in which environment".
# Drift detection gates (PR-time + runtime) consult this file to decide
# whether a service catalog mismatch is intentional (deferred) or a drift.
#
# Drift gate behavior per environment status:
#   enabled  — service must render in overlay AND must run in cluster.
#              Missing in render = FAIL. Missing in cluster = drift P1.
#   deferred — service intentionally NOT in this env. Render absence OK.
#              Cluster pod absence OK. If pod EXISTS in cluster → P1 drift
#              (cluster running an unmanaged service).
#   disabled — service permanently removed from this env. Same as deferred
#              but signals retirement intent (not future enablement).
#
# Codex retrospective P0 — "services.yaml manifest" requirement:
#   "endpoint-admin-service testte var prod'da yok ancak services.yaml ile
#    intentional/deferred yapılırsa sağlıklı. Yoksa unmanaged service P2/P1
#    sınırında kalır."

schema_version: "1.0"

services:
  - name: auth-service
    repo: platform-backend
    description: Login orchestrator (BFF-style, KC-backed)
    jwt_validates: false  # auth-service issues tokens via KC, doesn't validate inbound JWTs itself
    route_external: true  # /auth/cookie/** path
    environments:
      test: enabled
      prod: enabled

  - name: api-gateway
    repo: platform-backend
    description: Spring Cloud Gateway — JWT validation + routing
    jwt_validates: true
    route_external: true  # ingress entry point
    environments:
      test: enabled
      prod: enabled

  - name: user-service
    repo: platform-backend
    description: Users CRUD + profile + session management
    jwt_validates: true
    route_external: false  # gateway-routed
    environments:
      test: enabled
      prod: enabled

  - name: variant-service
    repo: platform-backend
    description: Schema variant management (multi-tenant)
    jwt_validates: true
    route_external: false
    environments:
      test: enabled
      prod: enabled

  - name: core-data-service
    repo: platform-backend
    description: Core master-data API (companies, projects, warehouses, branches)
    jwt_validates: false  # legacy: gateway-validated, no own JWT decoder
    route_external: false
    environments:
      test: enabled
      prod: enabled

  - name: report-service
    repo: platform-backend
    description: HR/finance report aggregator
    jwt_validates: true
    route_external: false
    environments:
      test: enabled
      prod: enabled

  - name: schema-service
    repo: platform-backend
    description: MSSQL schema explorer + Workcube ETL coordinator
    jwt_validates: true
    route_external: false
    environments:
      test: enabled
      prod: enabled

  - name: permission-service
    repo: platform-backend
    description: OpenFGA-backed authorization service + admin endpoints
    jwt_validates: true
    route_external: false
    environments:
      test: enabled
      prod: enabled

  - name: openfga
    repo: openfga/openfga
    description: Zanzibar-style authorization engine (StatefulSet)
    jwt_validates: false  # internal grpc, no Bearer
    route_external: false
    third_party: true
    environments:
      test: enabled
      prod: enabled

  - name: frontend
    repo: platform-web
    description: React/Vite MFE shell + remoteEntry modules
    jwt_validates: false  # static SPA, JWT in cookies forwarded by gateway
    route_external: true  # primary user entry
    environments:
      test: enabled    # variant: platform-web-frontend-testai
      prod: enabled    # variant: platform-web-frontend

  # --- DEFERRED services (intentionally not in target env) ---

  - name: endpoint-admin-service
    repo: platform-backend
    description: |
      Endpoint admin / governance API (Faz 22.1.3 lab tier — DD-EA-1 manifest
      contract gate's subject). Currently dev/test only; prod scope decision
      pending Faz 22.2 BG-EA-1 product review.

      Status note (Codex Sprint A P0 truthful state — 2026-05-04):
        Test cluster pod RUNNING (compose-era leftover / unmanaged), but NOT
        in test gitops overlay (kustomize/overlays/test). Mark deferred from
        gitops perspective — runtime drift detector will P1-alarm the
        unmanaged cluster pod, surfacing the integration gap.

        Faz 22.x onboard task: bring endpoint-admin-service into gitops
        (kustomize base + test overlay), then flip test→enabled here. Until
        then catalog reflects gitops-governed state, not cluster-actual state.
    jwt_validates: true
    route_external: false
    environments:
      test: enabled   # Faz 22.1.1b onboard COMPLETE 2026-05-05: gitops manifest live'a hizalandı (35 ConfigMap key + 4 ExternalSecret key + port 8096) + image digest pin sha-bd1e5c8. ESO ClusterSecretStore vault-platform-gitops zaten Ready, kv/platform/endpoint-admin-service Vault path populated. D29-EA smoke pending (kubectl apply sonrası).
      prod: deferred  # Faz 22.2 product decision (it-pilot tier acik.local + prod realm 'serban' + Azure Trusted Signing); drift gate accepts absence in prod

  - name: notification-orchestrator
    repo: platform-backend
    description: |
      Multi-channel notification orchestration platform (Faz 23 — ADR-0013).
      Kernel/Closed Beta (Faz 23.1) implementation kapsamında: email + Slack +
      webhook + outbox + retry/DLQ + audit + OpenFGA + PII redaction + metrics
      + Mailpit/WireMock CI test. Production MVP geniş'te (Faz 23.3) SMS
      (NetGSM) + in-app inbox API eklenecek.

      Status note (Faz 23.0 charter close — 2026-05-05):
        Manifest skeleton mevcut (kustomize/base/apps/notification-orchestrator/),
        replicas: 0 placeholder. Image yet to be built in platform-backend
        repo (cross-repo write, boundary-cross + user-approval-required —
        ADR-0011 BG-1). Faz 23.1 Kernel implementation Faz 22.1.1b III
        review verdict (I-staged-pending-schema-rev) fix-forward sonrası
        başlayabilir.

        Detail: docs/adr/0013-notification-orchestration.md +
        docs/runbooks/RB-faz-23-1-kernel-impl-checklist.md

        Drift gate behavior: notification-orchestrator manifest mevcut ama
        replicas:0 + image:placeholder, cluster pod yok — gitops-as-source-
        of-truth açısından tutarlı (deferred kabul). Faz 23.1 implementation
        sonrası replicas:1 (test) + image digest pin → enabled flip.
    jwt_validates: true
    route_external: false
    environments:
      test: enabled   # Faz 23.1 PR5 D29-NOTIFY (2026-05-06) — backend PR #65 merged + GHCR sha-4b886bc digest pin
      prod: deferred  # Faz 23.9 prod cutover'da enabled olur

# --- Future / disabled (placeholder for retirement signal) ---
# (none yet — when a service is permanently removed, move it here with
#  environments.{test,prod}: disabled)

