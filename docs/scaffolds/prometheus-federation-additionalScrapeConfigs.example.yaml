# NON-APPLIED reference scaffold — DO NOT wire into kustomize root.
# Faz 23.8 M7 T4.3.8 — bounded operator-only Prometheus federation example.
# ADR referansı: docs/adr/0026-observability-federation-phased.md
# Runbook: docs/runbooks/RB-observability-federation-rollout.md
# Codex 019e4ee7 plan-time AGREE (Anthropic Claude implementer + OpenAI Codex
# reviewer per HARD RULE Cross-AI Peer Review provider-different).
#
# Apply triggers (Faz 24+/M8 scope — bu scaffold M7 iter-1'de apply EDİLMEZ):
#   - Cluster sayısı > 5
#   - Dış tenant self-service observability gerek
#   - Retention local Prometheus limit aşımı (>30 gün)
#   - M8 tenant onboarding plan'ı somut hale gelir
#
# Cardinality budget M7 iter-1:
#   - Recording rules (federated): ≤ 5K series
#   - up + ALERTS:                 ≤ 1K series
#   - Total central federation:    ≤ 10K series

- job_name: 'central-federate-test-cluster'
  honor_labels: false   # central labels (cluster, environment, tenant_source) win
  metrics_path: '/federate'
  params:
    match[]:
      # Recording rule allowlist (low cardinality, derived series only)
      - '{__name__=~"notify:dispatch:outcome:.+"}'
      - '{__name__=~"notify:intent:terminated:.+"}'
      - '{__name__=~"notify:abuse:blocked:.+"}'
      - '{__name__=~"notify:kvkk:erasure:.+"}'
      - '{__name__="up", job=~"notification-orchestrator.+"}'
      - '{__name__=~"ALERTS|ALERTS_FOR_STATE"}'
  static_configs:
    - targets: ['test-prometheus.platform-test.svc.cluster.local:9090']
      labels:
        cluster: 'k3d-test'
        environment: 'test'
        tenant_source: 'internal'
  relabel_configs:
    # Drop high-cardinality jobs at central ingest
    - source_labels: [__name__]
      regex: '(container_|kube_pod_|node_).+'
      action: drop
  metric_relabel_configs:
    # Strip PII / high-cardinality labels if any leak through
    - regex: '(recipient_hash|message_id|email|mailbox|domain|user_id|session_id)'
      action: labeldrop

- job_name: 'central-federate-prod-cluster'
  honor_labels: false
  metrics_path: '/federate'
  params:
    match[]:
      # SAME allowlist as test cluster — duplicated rather than templated for
      # readability; if alllowlists drift, audit each cluster's recording rules
      # explicitly (no implicit equivalence).
      - '{__name__=~"notify:dispatch:outcome:.+"}'
      - '{__name__=~"notify:intent:terminated:.+"}'
      - '{__name__=~"notify:abuse:blocked:.+"}'
      - '{__name__=~"notify:kvkk:erasure:.+"}'
      - '{__name__="up", job=~"notification-orchestrator.+"}'
      - '{__name__=~"ALERTS|ALERTS_FOR_STATE"}'
  static_configs:
    - targets: ['prod-prometheus.platform-prod.svc.cluster.local:9090']
      labels:
        cluster: 'k3d-prod'
        environment: 'prod'
        tenant_source: 'internal'
  relabel_configs:
    - source_labels: [__name__]
      regex: '(container_|kube_pod_|node_).+'
      action: drop
  metric_relabel_configs:
    - regex: '(recipient_hash|message_id|email|mailbox|domain|user_id|session_id)'
      action: labeldrop

# ============================================================================
# How to apply (Faz 24+/M8 — NOT M7 scope):
#
# 1. Save this file as a ConfigMap or Secret:
#    kubectl -n monitoring create configmap prometheus-additional-scrape-config \
#      --from-file=federation.yaml=this-file.yaml \
#      --dry-run=client -o yaml | kubectl apply -f -
#
# 2. Reference in Prometheus CR (kube-prometheus-stack values):
#    additionalScrapeConfigs:
#      name: prometheus-additional-scrape-config
#      key: federation.yaml
#
# 3. Prometheus operator auto-reloads (no manual restart needed).
#
# 4. Verify (Grafana Explore or PromQL):
#    count({cluster=~"k3d-(test|prod)"})
#    notify:dispatch:outcome:5m{cluster="k3d-test"}
#
# 5. Cardinality regression check:
#    sum(scrape_samples_scraped{job=~"central-federate-.*"})
#    Budget: ≤ 10K
#
# 6. Kill-switch (if budget exceeded or breakage):
#    kubectl -n monitoring patch configmap prometheus-additional-scrape-config \
#      --type=json -p='[{"op":"replace","path":"/data/federation.yaml","value":"# disabled"}]'
#
# ============================================================================
