# Faz 19.MSSQL — Workcube MSSQL host bridge (D19 Service, Endpoints overlay-only)
# ADR-0005 Dual DataSource Reporting — live ERP data source (read-only)
#
# 2026-04-25 Faz 20 LIVE — Direct routing (bridge proxy decommissioned):
# - Calico containerIPForwarding=Enabled (PR #136) ile pod overlay → external 10.9.193.0/24 routing aktif
# - Pod direct → 10.9.193.201:1433 (bridge proxy yok, ekstra hop yok)
# - Service port 11433 (Vault JDBC URL backward compat) → targetPort 1433 (real MSSQL)
# - Endpoints overlay-spesifik: 10.9.193.201:1433 (her iki cluster aynı, çünkü direkt LAN'a gidiyor)
#
# Authentication (Workcube boreas domain, IT mesajı 2026-04-25):
#   JDBC URL: jdbc:sqlserver://workcube-mssql:11433;...;authenticationScheme=NTLM;domain=boreas
#   Username: AlUser_App (plain, domain= ayrı parametre)
#   Vault path: kv/platform/mssql-external (D34 izolasyon)
#
# Runtime behavior (degraded mode per ADR-0005):
# - MSSQL unreachable → MSSQL-backed endpoints 503, PG-backed OK
# - Health indicator ayrı (NOT in readiness — pod evict döngüsü riski)
---
apiVersion: v1
kind: Service
metadata:
  name: workcube-mssql
  labels:
    app.kubernetes.io/name: workcube-mssql
    app.kubernetes.io/component: host-bridge
    app.kubernetes.io/part-of: reporting
  annotations:
    platform.acik.com/adr: "0005"
    platform.acik.com/source: "Workcube Mikrolink ERP (read-only, live, boreas domain)"
    platform.acik.com/direct-routing: "Faz 20 LIVE — Calico containerIPForwarding pod direct (10.9.193.201:1433)"
spec:
  # Pod-facing port 11433 unchanged (Vault JDBC URL backward compat — no rotation needed).
  # targetPort 1433 = real MSSQL port (Endpoints'te 10.9.193.201:1433).
  # kube-proxy DNAT: pod connect :11433 → Service → Endpoint 10.9.193.201:1433.
  ports:
    - name: mssql
      port: 11433
      targetPort: 1433
      protocol: TCP
# NOTE: Endpoints (subset.addresses) overlay-spesifik, base'de yok.
#       overlays/{prod,test}/endpoints-workcube-mssql.yaml: 10.9.193.201:1433 (direct, post-Faz-20)
