# Faz 19.MSSQL — Workcube MSSQL host bridge (D19 Service, Endpoints overlay-only)
# ADR-0005 Dual DataSource Reporting — live ERP data source (read-only)
#
# 2026-04-25 Faz 19.MSSQL.F (network teşhis sonrası strateji):
# - K3d cluster pod overlay → 10.9.193.0/24 dış subnet'e Calico tunneling/routing fail
# - Çözüm: docker bridge'de socat proxy container (cluster ile AYNI bridge'de)
# - Endpoints overlay-spesifik (her bridge subnet'i farklı): kustomize/overlays/{prod,test}
#
# Proxy bootstrap (idempotent): bash bootstrap/workcube-mssql-proxy.sh
#
# Authentication (Workcube boreas domain, IT mesajı 2026-04-25):
#   JDBC URL: ...;authenticationScheme=NTLM;domain=boreas
#   Username: AlUser_App (plain, domain= ayrı parametre)
#   Vault path: kv/platform/mssql-external (D34 izolasyon)
#
# Runtime behavior (degraded mode per ADR-0005):
# - MSSQL unreachable → MSSQL-backed endpoints 503, PG-backed OK
# - Health indicator ayrı (NOT in readiness — pod evict döngüsü riski)
---
apiVersion: v1
kind: Service
metadata:
  name: workcube-mssql
  labels:
    app.kubernetes.io/name: workcube-mssql
    app.kubernetes.io/component: host-bridge
    app.kubernetes.io/part-of: reporting
  annotations:
    platform.acik.com/adr: "0005"
    platform.acik.com/source: "Workcube Mikrolink ERP (read-only, live, boreas domain)"
    platform.acik.com/proxy: "alpine/socat bridge container per-cluster (workcube-mssql-proxy-{prod,test})"
spec:
  ports:
    - name: mssql
      port: 11433
      targetPort: 11433
      protocol: TCP
# NOTE: Endpoints (subset.addresses) overlay-spesifik, base'de yok.
#       overlays/prod/endpoints-workcube-mssql.yaml: 172.21.0.7
#       overlays/test/endpoints-workcube-mssql.yaml: 172.19.0.8
