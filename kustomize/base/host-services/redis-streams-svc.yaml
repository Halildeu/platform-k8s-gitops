# Host-level Redis Streams bridge — Faz 24 cross-server chunk transport
# (D19 pattern: Service + Endpoints, postgres/keycloak/vault emsali)
#
# Gerçek Redis staging-sw'da host-compose ile çalışır
# (host-compose/redis-streams/docker-compose.yml — ADR-0031 D2 "dış altyapı").
# Test live değeri: 172.19.0.250:6379 (platform-test-net static IP; compose
# ipv4_address pin'i — PG'deki dinamik-IP-drift riskine karşı sabitlendi).
# Base placeholder host-LAN IP taşır; overlay Endpoints patch'i gerçek
# bridge IP'yi yazar (postgres-svc.yaml ile aynı disiplin).
---
apiVersion: v1
kind: Service
metadata:
  name: redis-streams
  labels:
    app.kubernetes.io/name: redis-streams
    app.kubernetes.io/component: host-bridge
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
# Endpoints manuel (selector yok — Service otomatik eşleştirmez)
apiVersion: v1
kind: Endpoints
metadata:
  name: redis-streams                # Service ile aynı isim
  labels:
    app.kubernetes.io/name: redis-streams
subsets:
  - addresses:
      - ip: 10.9.10.53               # placeholder; overlay override (test: 172.19.0.250)
    ports:
      - name: redis
        port: 6379
        protocol: TCP
