# Host-level Keycloak bridge (D19)
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: host-bridge
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
subsets:
  - addresses:
      - ip: 10.9.10.53              # overlays'de override
    ports:
      - name: http
        port: 8081                  # prod mevcut (overlays/test 8082'ye çevirir)
        protocol: TCP
