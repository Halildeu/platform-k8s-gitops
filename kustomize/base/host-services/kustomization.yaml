apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOT: commonLabels KULLANMIYORUZ — Service selector'ına enjekte ederdi ve
# manuel Endpoints'i kırarlı. Bunun yerine `labels: includeSelectors: false`.
labels:
  - pairs:
      app.kubernetes.io/component: host-bridge
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: false

resources:
  - postgres-svc.yaml
  - keycloak-svc.yaml
  - vault-svc.yaml
  - workcube-mssql-svc.yaml    # Faz 19.MSSQL (ADR-0005 Dual DataSource Reporting)
  - redis-streams-svc.yaml      # Faz 24 cross-server chunk transport (ADR-0031 D2)
  - minio-svc.yaml              # Faz 24 #1250 audit-archive 7yr WORM cold storage (ADR-0042)
