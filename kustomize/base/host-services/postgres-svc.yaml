# Host-level PostgreSQL bridge (D19: Service + Endpoints, IP pin değil ExternalName)
# Host IP ve port overlays'de override edilir. Active aiserver topology:
#   prod: 172.21.0.10:5432 (Docker bridge IP, platform-prod-net)
#   test: 172.19.0.6:5432  (Docker bridge IP, platform-test-net)
#   local (Docker Desktop): host.docker.internal (resolve edilen IP)
#
# 2026-05-11 (PR #519): the older host-LAN model (10.9.10.53:5432 prod,
# 10.9.10.53:5433 test) is deprecated for cluster traffic. Overlays
# patch the Endpoint to the Docker bridge IP of the host postgres
# container directly so k3d pods reach PG over the bridge network, not
# the host LAN. Host compose binds are localhost-only by design
# (host-compose/postgres/{prod,test}/docker-compose.yml). Local
# admin/drill on the host still uses 127.0.0.1:5432 (prod) /
# 127.0.0.1:5433 (test).
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: host-bridge
spec:
  # Headless değil — cluster ClusterIP alıp Endpoints'e forward eder
  ports:
    - name: pg
      port: 5432
      targetPort: 5432
      protocol: TCP
---
# Endpoints manuel yazılır (selector yok, Service otomatik eşleştirmez)
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres                    # Service ile aynı isim
  labels:
    app.kubernetes.io/name: postgres
subsets:
  - addresses:
      - ip: 192.0.2.1               # fail-closed placeholder; overlay override zorunlu
    ports:
      - name: pg
        port: 5432                  # overlays'de override (prod 5432, test 5433)
        protocol: TCP
