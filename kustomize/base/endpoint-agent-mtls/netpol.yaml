# Faz 22.5 M2 — NetworkPolicy for the backend mTLS listener (8443).
#
# ⚠️ ISOLATION CAVEAT (Codex review F2): Kubernetes NetworkPolicy is ADDITIVE —
# it cannot express a deny. The endpoint-admin pod carries
# `app.kubernetes.io/part-of: platform`, and the base broad intra-namespace allow
# (kustomize/base/netpol/allow-ingress-intra-ns.yaml) already permits ingress
# from ALL platform pods to ALL ports. So the allow below does NOT by itself
# isolate 8443 — any platform pod could still reach it. TRUE isolation requires
# ONE of (operator decision, before activation):
#   (a) port-scope the broad intra-ns allow so 8443 is excluded, OR
#   (b) move the mTLS listener onto a SEPARATELY-LABELED workload/Deployment that
#       the broad policy's selector does not match, then bind the allow below to
#       that label.
# Until (a) or (b), treat 8443 as reachable intra-namespace and rely on the
# backend's mTLS client-auth (no anonymous/in-cluster bypass of cert validation).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mtls-passthrough-to-backend
  labels:
    app.kubernetes.io/part-of: faz22-endpoint-agent-mtls
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8443
---
# Egress for mTLS chain validation (Codex review F3): the namespace runs
# default-deny egress; the base egress allow only opens DNS + intra-ns + the
# host bridge (5432/8080/8200). mTLS chain validation needs the backend to reach
# the AD CS CRL/OCSP distribution points (and, if it resolves AD computer
# identity, the domain controller LDAPS). Without this, revocation checking
# either fails-closed (rejecting all enrollments) or cannot be proven.
#
# ⚠️ TEMPLATE — fail-closed by default (Codex F1-round2). The placeholder CIDRs
# below are RFC 5737 documentation/TEST-NET ranges that route NOWHERE real, so if
# this bundle is wired into an overlay BEFORE the operator patches it, no actual
# egress opens (the policy renders, but to dead addresses). The operator MUST
# replace them with the real AD CS CRL/OCSP host(s) and DC as narrow /32s before
# activation. Never widen to 0.0.0.0/0 or an RFC1918 supernet (cluster/pod/svc
# CIDRs live in 10/8 — a 10.0.0.0/8 allow would expose in-cluster traffic).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mtls-backend-pki-egress
  labels:
    app.kubernetes.io/part-of: faz22-endpoint-agent-mtls
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.255/32   # SENTINEL (RFC5737 TEST-NET-1) — REPLACE with AD CS CRL/OCSP host /32(s)
      ports:
        - protocol: TCP
          port: 80    # HTTP CRL distribution point
        - protocol: TCP
          port: 443   # OCSP responder
    - to:
        - ipBlock:
            cidr: 198.51.100.255/32   # SENTINEL (RFC5737 TEST-NET-2) — REPLACE with domain controller /32(s)
      ports:
        - protocol: TCP
          port: 636   # LDAPS (objectGUID resolve, if used)
