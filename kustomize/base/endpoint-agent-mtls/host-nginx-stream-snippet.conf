# Faz 22.5 M2 — host-nginx (staging-sw, the real internet edge) SNI passthrough
# for the device-API mTLS host. The platform host nginx terminates TLS for the
# wildcard *.acik.com browser hosts (D8/D18); the mTLS host must NOT be
# TLS-terminated here — its TLS (incl. the client cert) must reach the backend
# intact. Uses the `stream` module to SNI-route the raw TLS by hostname.
#
# INCLUDE CONTRACT (Codex review): these directives go INSIDE your host nginx's
# single `stream { }` block — nginx permits exactly ONE stream context, so do NOT
# wrap them in another `stream {}` and do NOT nest. If the host has no stream
# block yet, create one in the main nginx.conf and place these inside it
# (e.g. `stream { include /etc/nginx/conf.d/mtls-passthrough.stream; }`). Do NOT
# put these in `http { }`. Requires nginx built with --with-stream and
# --with-stream_ssl_preread_module.
#
# Activation is operator-gated (see RB-faz22-M2-edge-mtls-activation.md):
#  - DNS A records:
#      mtls.testai.acik.com                -> test edge public IP
#      remote-bridge-mtls.testai.acik.com  -> test edge public IP
#      mtls.ai.acik.com                    -> prod edge public IP
#  - ingress-nginx running with --enable-ssl-passthrough (it owns 443 SNI demux
#    inside the cluster); forward each host to the matching cluster's
#    ssl-passthrough listener.

# Read SNI without terminating TLS.
map $ssl_preread_server_name $mtls_upstream {
    mtls.testai.acik.com   test_ingress_nginx_passthrough;
    # Faz 22.6 remote-ops broker: dedicated SNI host on standard 443.
    # Host nginx and ingress-nginx pass raw TLS through; the broker terminates
    # mTLS with its own AD CS server certificate.
    remote-bridge-mtls.testai.acik.com test_ingress_nginx_passthrough;
    mtls.ai.acik.com       prod_ingress_nginx_passthrough;
    # all other SNI continue to the normal http/TLS edge (default server)
    default                 http_edge_passthrough;
}

# ingress-nginx ssl-passthrough listeners (cluster node:port). Replace with the
# actual NodePort/host-port each ingress-nginx controller exposes for
# ssl-passthrough. Do not send mtls.ai.acik.com to test or vice versa.
upstream test_ingress_nginx_passthrough {
    server 127.0.0.1:31443;  # k3d-test serverlb 443/tcp (verified 2026-06-14)
}
upstream prod_ingress_nginx_passthrough {
    server 127.0.0.1:30443;  # k3d-prod serverlb 443/tcp (verified 2026-06-14)
}
upstream http_edge_passthrough {
    server 127.0.0.1:8444;   # <-- operator: set to the existing http/TLS edge listener
}

server {
    listen 443;
    ssl_preread on;          # inspect SNI without decrypting
    proxy_pass $mtls_upstream;
    # NOTE: do NOT enable `proxy_protocol on` by default. It prepends a PROXY
    # line BEFORE the TLS ClientHello — if the ingress-nginx ssl-passthrough
    # listener (or the default browser-edge upstream) does not explicitly expect
    # PROXY protocol, it breaks SNI parsing / the TLS handshake and would also
    # corrupt normal browser traffic on the shared `default` branch. Only enable
    # it if EVERY downstream upstream is PROXY-aware AND direct access to those
    # listeners is firewalled to this host nginx. The PROXY source IP is
    # audit-only — never a security/identity input (identity comes solely from
    # the mTLS client cert at the backend).
}
