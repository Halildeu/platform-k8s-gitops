# Faz 22.5 M2 — passthrough target Service. Selects the backend that terminates
# mTLS (derives identity from the client cert). BACKEND DEPENDENCY: the selected
# workload must expose an mTLS listener on `mtls` (8443) with client-auth=need,
# trust anchor = AD CS Root CA ("CN=ACIK Endpoint CA"), serving the device API at
# the CANONICAL AutoEnroll route POST /api/v1/endpoint-agent/endpoint-enrollments/
# auto (per current-state + gateway route parity — NOT /endpoint-admin/) +
# heartbeat + command poll/result. Until that listener exists this Service
# (the Ingress is inert — see runbook).
#
# NOTE: selector + port name must match the backend Deployment's mTLS port once
# the platform-backend mTLS-listener PR lands; placeholder pinned to
# endpoint-admin-service. Confirm against that PR before activation.
apiVersion: v1
kind: Service
metadata:
  name: endpoint-agent-mtls-backend
  labels:
    app.kubernetes.io/part-of: faz22-endpoint-agent-mtls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: endpoint-admin-service
  ports:
    - name: mtls
      port: 8443
      targetPort: mtls   # backend Deployment must name its mTLS containerPort "mtls"
      protocol: TCP
