# Platform ingress — path routing (D18)
# Host: overlays'de override
#   local: ai.acik.com (etc hosts 127.0.0.1) veya test.acik.com
#   prod:  ai.acik.com
#   test:  test.acik.com
#
# TLS: host nginx'te termine (D8/D18), buraya HTTP gelir → tls bölümü YOK
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  annotations:
    # rewrite-target YOK — path olduğu gibi api-gateway'e geçer; gateway
    # route predicate'ları (Path=/auth/**, StripPrefix=1) içeriden route eder.
    # Codex Tur-5 NEW-1 fix: rewrite /$2 + 3-capture regex bozuk kombinasyondu.
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  rules:
    - host: PLACEHOLDER_HOST       # overlays'de override: ai.acik.com / test.acik.com
      http:
        paths:
          # NOT: ArgoCD/Grafana/Prometheus UI'ları kendi namespace'lerinde
          # AYRI Ingress kaynaklarıyla exposed (Helm chart'ların ingress.enabled ile).
          #
          # D25: TÜM trafik (/, /auth, /api, /actuator) api-gateway'e gider.
          # Gateway içeriden:
          #   Path=/auth/**  → StripPrefix=1 → http://auth-service:8088/{rest}
          #   Path=/api/**   → (Dilim 2+) backend servisler
          #   Path=/actuator → gateway kendi actuator'u
          # Bu sayede D7 (Eureka → K8s svc DNS) zinciri gateway üzerinden
          # doğrulanır, ingress backend'i bypass etmez.
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          # Root — gateway'e git (frontend Dilim 3+'da eklenince override)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
