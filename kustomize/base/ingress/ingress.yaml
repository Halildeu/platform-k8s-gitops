# Platform ingress — path routing (D18)
# Host: overlays'de override
#   local: ai.acik.com (etc hosts 127.0.0.1) veya testai.acik.com
#   prod:  ai.acik.com
#   test:  testai.acik.com
#
# TLS: host nginx'te termine (D8/D18), buraya HTTP gelir → tls bölümü YOK
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  annotations:
    # rewrite-target YOK — path olduğu gibi api-gateway'e geçer; gateway
    # route predicate'ları (Path=/auth/**, StripPrefix=1) içeriden route eder.
    # Codex Tur-5 NEW-1 fix: rewrite /$2 + 3-capture regex bozuk kombinasyondu.
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - PLACEHOLDER_HOST          # overlays'de override; cert SAN *.acik.com kapsıyor
      secretName: wildcard-acik-com-tls
  rules:
    - host: PLACEHOLDER_HOST       # overlays'de override: ai.acik.com / testai.acik.com
      http:
        paths:
          # NOT: ArgoCD/Grafana/Prometheus UI'ları kendi namespace'lerinde
          # AYRI Ingress kaynaklarıyla exposed (Helm chart'ların ingress.enabled ile).
          #
          # Dilim 3: API path'leri → api-gateway, / → frontend.
          # Gateway içeriden route predicate'larıyla downstream servisleri çözer:
          #   Path=/auth/**  → StripPrefix=1 → auth-service:8088
          #   Path=/api/**   → backend servisler (Dilim 2)
          #   Path=/actuator → gateway kendi actuator'u
          #   Path=/users|/variants|/core|/reports|/schemas → ilgili backend
          # /users gibi path'leri açıkça listelememizin sebebi: ingress-nginx'in
          # /users'ı default backend'e (frontend) göndermemesi.
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          # Faz 24 Aşama-2: audio-gateway doğrudan path (platform-ai#151).
          # nginx longest-prefix → /api/v1/audio-gateway buraya, kalan /api
          # api-gateway'e. audio-gateway kendi JWT validation'ını fail-closed
          # yapar (api-gateway auth filter'ına bağımlı değil). Canonical
          # api-gateway route'u client'lar (24.11/24.12/24.13) gelirken
          # değerlendirilir — bkz docs/runbooks/redis-streams-staging-sw.md.
          - path: /api/v1/audio-gateway
            pathType: Prefix
            backend:
              service:
                name: audio-gateway
                port: { number: 8210 }
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          - path: /variants
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          - path: /core
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          - path: /reports
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          - path: /schemas
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
          # Root → frontend (MFE shell); daha spesifik /auth, /api vb. öncelikli.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
