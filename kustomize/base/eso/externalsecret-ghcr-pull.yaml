# ExternalSecret — ghcr-pull (W1 kalıcı çözüm)
# Source: docs/handoff-S2-B-artifact-hardening.md
# Prereq: ESO Deployment + ClusterSecretStore 'vault-platform-gitops' tanımlı
# Prereq: Vault kv/gitops/ghcr-token path (sysadmin/ops iş)
# Apply: S2 session (ESO aktif cluster'da)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: image-pull
spec:
  refreshInterval: 30m   # PAT rotation için düşük interval
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: kv/gitops/ghcr-token
        property: username
    - secretKey: password
      remoteRef:
        key: kv/gitops/ghcr-token
        property: password   # GitHub PAT read:packages scope
