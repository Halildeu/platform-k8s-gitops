# ClusterSecretStore — Vault HashiCorp (D9 ESO + Vault)
# Source: docs/handoff-S2-B-artifact-hardening.md
# Prereq: Vault AppRole `eso-runtime` + policy `eso-runtime` (bootstrap/vault-policies/eso-runtime.hcl)
# Prereq: ESO Deployment Helm chart kurulu (external-secrets.io namespace)
# Apply: S2 session, ESO install sonrasi
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-platform-gitops
  labels:
    app.kubernetes.io/part-of: platform
spec:
  provider:
    vault:
      # PLACEHOLDER FQDN — overlay'de ZORUNLU override (Codex iter-2 AGREE D-1).
      # Base apply edilirse FQDN tanımsız → ClusterSecretStore Ready=False (fail-closed).
      #   overlays/test/eso → vault.platform-test.svc.cluster.local:8200 + test role_id UUID
      #   overlays/prod/eso → vault.platform-prod.svc.cluster.local:8200 + prod role_id UUID
      #
      # roleId: default "eso-runtime" literal placeholder; overlay JSON6902 patch ile
      # gerçek AppRole role_id UUID'ye replace edilir. Placeholder format:
      # - "eso-runtime" string Vault AppRole login'de 400 "invalid role" döndürür
      # - Bu BİLİNÇLİ fail-closed: overlay patch uygulanmadan base login çalışmaz
      #
      # role_id: AppRole identity (low-sensitivity UUID, tek başına auth vermez).
      # Yine de credential material — secret_id ile birlikte saldırı yüzeyi.
      # Savunma katmanları: etcd encryption-at-rest, secret_id rotation, CIDR binding.
      # secret_id: vault-approle-secret K8s Secret'te (git dışı, SRE manuel seed).
      server: "http://vault.OVERLAY_MUST_OVERRIDE.svc.cluster.local:8200"
      path: "kv"          # KV v2 mount
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "eso-runtime"
          secretRef:
            name: vault-approle-secret
            key: secret-id
            namespace: external-secrets
---
# Vault AppRole secret-id (ESO için; başlangıçta manuel kubectl create secret)
# Sonrasinda Vault'tan auto-rotate (SRE iş)
# YAMLSecret gizlilik: dosyada literal YOK, apply sirasinda olusturulur
# kubectl create secret generic vault-approle-secret -n external-secrets \
#   --from-literal=secret-id=<vault-read-approle-secret-id>
