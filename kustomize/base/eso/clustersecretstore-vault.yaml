# ClusterSecretStore — Vault HashiCorp (D9 ESO + Vault)
# Source: docs/handoff-S2-B-artifact-hardening.md
# Prereq: Vault AppRole `eso-runtime` + policy `eso-runtime-kv-read`
# Prereq: ESO Deployment Helm chart kurulu (external-secrets.io namespace)
# Apply: S2 session, ESO install sonrasi
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-platform-gitops
  labels:
    app.kubernetes.io/part-of: platform
spec:
  provider:
    vault:
      # Vault test instance default (D6, D19 host bridge overlay'de namespace set edilir)
      # Overlay test: vault.platform-test.svc.cluster.local:8200 (test host compose, port 5433 D20)
      # Overlay prod: vault.platform-prod.svc.cluster.local:8200 (prod host compose, staging-sw-2 D32)
      # 2026-04-19 Codex AR3 WARN düzeltmesi: host-services ns YOK, overlay platform-* ns'lerinde
      server: "http://vault.platform-test.svc.cluster.local:8200"
      path: "kv"          # KV v2 mount
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "eso-runtime"
          secretRef:
            name: vault-approle-secret
            key: secret-id
            namespace: external-secrets
---
# Vault AppRole secret-id (ESO için; başlangıçta manuel kubectl create secret)
# Sonrasinda Vault'tan auto-rotate (SRE iş)
# YAMLSecret gizlilik: dosyada literal YOK, apply sirasinda olusturulur
# kubectl create secret generic vault-approle-secret -n external-secrets \
#   --from-literal=secret-id=<vault-read-approle-secret-id>
