# ClusterSecretStore — Vault HashiCorp (D9 ESO + Vault)
# Source: docs/handoff-S2-B-artifact-hardening.md
# Prereq: Vault AppRole `eso-runtime` + policy `eso-runtime-kv-read`
# Prereq: ESO Deployment Helm chart kurulu (external-secrets.io namespace)
# Apply: S2 session, ESO install sonrasi
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-platform-gitops
  labels:
    app.kubernetes.io/part-of: platform
spec:
  provider:
    vault:
      # PLACEHOLDER FQDN + roleId — overlay'de ZORUNLU override (Codex iter-2 AGREE
      # D-1: placeholder + overlay patch deseni). Base apply edilirse FQDN tanımsız
      # + roleId string kabul (UUID olmalı) → ClusterSecretStore Ready=False (fail-closed).
      #   overlays/test/eso → vault.platform-test.svc.cluster.local:8200 + test role_id UUID
      #   overlays/prod/eso → vault.platform-prod.svc.cluster.local:8200 + prod role_id UUID
      # role_id = AppRole identity (NOT secret; public UUID per-Vault-instance). secret_id
      # vault-approle-secret K8s Secret'te tutulur (not in git).
      server: "http://vault.OVERLAY_MUST_OVERRIDE.svc.cluster.local:8200"
      path: "kv"          # KV v2 mount
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId: "OVERLAY_MUST_OVERRIDE_ROLE_ID_UUID"
          secretRef:
            name: vault-approle-secret
            key: secret-id
            namespace: external-secrets
---
# Vault AppRole secret-id (ESO için; başlangıçta manuel kubectl create secret)
# Sonrasinda Vault'tan auto-rotate (SRE iş)
# YAMLSecret gizlilik: dosyada literal YOK, apply sirasinda olusturulur
# kubectl create secret generic vault-approle-secret -n external-secrets \
#   --from-literal=secret-id=<vault-read-approle-secret-id>
