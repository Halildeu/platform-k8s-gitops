# Monitoring base — kustomize
# S3-A pack: PrometheusRule + BlackboxExporter + Probe CRs
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace monitoring (prod cluster) — overlay'de namespace override olabilir
namespace: monitoring

labels:
  - pairs:
      app.kubernetes.io/part-of: platform
      app.kubernetes.io/component: monitoring
    includeSelectors: false
    includeTemplates: false

resources:
  - zanzibar-stability-rule.yaml
  - blackbox-exporter.yaml
  - backup-freshness-rule.yaml    # Codex iter-8 day-2 ek — backup_last_success metric + 5 alert
  - dr-drill-rule.yaml            # Session 28 paralel cleanup (c) — dr_drill_last_run_* metric + 4 alert (PLAN.md D23 quarterly)
  - recording-rules.yaml          # Pre-compute expensive PromQL (Grafana + alert hızlandırma)
  - api-gateway-slo-rule.yaml     # iter-49 B.2 — api-gateway SLO warning rules (4 alert, dev-observable)
  - notify-dlq-slo-rule.yaml      # Step B.4 (Codex 019e0892 + 019e094a iter-1) — notify DLQ SLO + true multi-window burn rate alerts (4 alert, 18 recording rules incl. 5m/30m short windows, 99.5% target, 28d window, slow `unless` fast suppression)
  - rollout-replicaset-crash-rule.yaml  # Codex 019e256f PR-4 — KubeDeploymentRolloutStuck + KubeReplicaSetSplit + KubePodCrashLooping (continuous cluster alerting for drift gate observation layer)
  - rbac-least-privilege-rule.yaml      # prod-deploy PR-3E (Codex 019e3a40) — k8s API 403/Forbidden proxy-telemetri: KubeAPIForbiddenMutatingRequest + KubeAPIForbiddenRequestSpike
  # Ops-B core common rules (Codex 019e26c5 + 019e2772 iter-4 split):
  # cluster-agnostic 3 alert (Failing, ResultFail, Stale). Cross-cluster
  # AbsentTest/AbsentProd rule'ları `base/monitoring-prod-hub/` altında
  # (yalnızca prod-hub'a apply).
  - prometheusrule-frontend-federation-smoke-common.yaml
  # Bridge self-watch (Session 53 P0 #6 — Codex 019e2a4f):
  # Session 52 close tespit — bridge CrashLoopBackOff 10 gündür hiç alarm
  # gelmedi (observability gap). 3 alert: BridgeDown / BridgeCrashLooping /
  # BridgeHealthzFail. Prom k8s API state scrape bridge'den bağımsız.
  - prometheusrule-alertmanager-bridge-self-watch.yaml
  - alertmanager-bridge           # Codex Sprint A follow-up — AlertManager → GitHub Issues bridge
  # Grafana dashboard ConfigMap'ler — kube-prometheus-stack sidecar provisioner
  # otomatik import (label grafana_dashboard=1). Helm values
  # helm-values/kube-prometheus-stack/values.yaml sidecar.dashboards.enabled: true.
  - grafana-dashboards/authz-plane-dashboard.yaml
  - grafana-dashboards/platform-pods-dashboard.yaml
  - grafana-dashboards/edge-synthetic-dashboard.yaml
  - grafana-dashboards/jvm-db-hikari-dashboard.yaml     # Codex iter-7 day-2 4. dashboard
  - grafana-dashboards/api-gateway-slo-dashboard.yaml   # iter-49 B — api-gateway status code matrix + SLO candidate (Codex 019ddf43)
  - grafana-dashboards/notification-orchestrator-dashboard.yaml  # Step B.3 + B.3.2 (Codex 019e0892 + 019e0935 + 019e0bb6) — 7 rows, 15 panels (strict cutover + retention + queue/dispatch + DLQ + alert state + SLO burn rate)

# Kullanım:
# Apply sadece S3 session'da (testai soak başlangıcı öncesi):
#   kubectl --context k3d-prod apply -k kustomize/base/monitoring
# Veya overlay üzerinden (prod cluster için namespace=monitoring zaten default)
