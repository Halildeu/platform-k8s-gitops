# PrometheusRule — Faz 23 M7 v1 30-day stable observation recording rules
#
# Faz 23 M8 PR-1 (Codex `019e8c24` AGREE order D→B→A→C, multi-PR sequenced).
#
# Context: Faz 23 M7 v1 closure 2026-05-23 (Web Push browser-only DELIVERED
# end-to-end). M8 (Multi-tenant Trigger Gate) DoD requires M7 v1 stable
# ≥30 days in production (canonical: docs/notify/milestones.md §M8). This
# rule emits the **observation truth surface** the evidence script + Grafana
# panel consume — it does NOT shorten the 30-day clock or convert M7 to green
# before 2026-06-22+ (the natural 30-day mark from 2026-05-23 LIVE).
#
# Reuse contract: leverages existing `notify-dlq-slo-rule.yaml` recording
# rules (notify:dlq:burn_rate:24h, notify:dlq:burn_rate:72h) instead of
# re-deriving the burn-rate math. Single source-of-truth.
#
# Acceptance semantics for M7 v1 stable_30d=1:
#   1) DLQ burn rate ≤ 1.0× over the past 30 days (24h + 72h windows clean)
#   2) Dispatch success rate ≥ 0.995 (the SLO target) over the 30-day window
#   3) No critical SLO burn alert has fired in the past 30 days
#
# All three predicates must hold concurrently for stable_30d == 1. The
# absent_over_time guard ensures absence-of-metric (e.g. recently scraped
# Prometheus or Notify silent) does NOT silently flip stable_30d to 1.
#
# IMPORTANT — Codex 019e8c24 anti-pattern guards:
#   - DO NOT retroactively shorten the 30-day window
#   - DO NOT convert M7 to green before 2026-06-22+ with clean evidence
#   - This rule is OBSERVATION-ONLY; it does not mutate any system

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notification-orchestrator-m7-stable-recording
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: notification-orchestrator
    release: kube-prometheus-stack
spec:
  groups:
    - name: notification-orchestrator-m7-stable-recording
      interval: 1m
      rules:
        # 30-day rolling dispatch success rate (terminal outcomes only;
        # mirrors notify-dlq-slo-rule.yaml denominator semantics so the
        # success ratio and DLQ burn rate are computed on the same base).
        #
        # Formula: success / (success + FAILED). RETRY transient outcomes
        # excluded — already the convention in notify-dlq-slo-rule.yaml.
        - record: notify:m7_v1:dispatch_success_rate:30d
          expr: |
            sum by (namespace) (
              rate(notify_dispatch_outcome_total{namespace="platform-prod", status="SUCCESS"}[30d])
            )
            /
            clamp_min(
              sum by (namespace) (
                rate(notify_dispatch_outcome_total{namespace="platform-prod", status=~"SUCCESS|FAILED"}[30d])
              ),
              0.0001
            )

        # Maximum DLQ burn rate observed across the 30-day window (sliding
        # max over the 24h burn series). A clean 30-day window means this
        # max never exceeded 1.0 — the at-budget steady-state threshold.
        # We use the 24h burn rate as the observation series (smooths
        # transient spikes; matches the M7 v1 stability claim semantics).
        - record: notify:m7_v1:dlq_burn_max:30d
          expr: |
            max_over_time(notify:dlq:burn_rate:24h[30d])

        # 72h burn observation — supplementary signal for sustained drift
        # at the budget-recovery horizon. Same window aggregation.
        - record: notify:m7_v1:dlq_burn_72h_max:30d
          expr: |
            max_over_time(notify:dlq:burn_rate:72h[30d])

        # Count of SLO burn-rate critical alerts that fired in the past 30d.
        # Uses ALERTS{alertstate="firing"} from kube-prometheus-stack. Any
        # firing minute counts; clean window means 0. (Counted as gauges of
        # alert presence ⇒ count_over_time on absent==1 inverse.)
        #
        # NOTE: kube-prometheus-stack exposes ALERTS as a vector with label
        # alertname; we sum across our two paging alerts (Fast + Slow).
        - record: notify:m7_v1:critical_alert_minutes:30d
          expr: |
            sum_over_time(
              (
                count by (namespace) (
                  ALERTS{
                    alertname=~"NotifyDlqSloBurnRateFast|NotifyDlqSloBurnRateSlow",
                    alertstate="firing",
                    namespace="platform-prod"
                  }
                ) or vector(0)
              )[30d:1m]
            )

        # Observation-availability guard: the 24h burn series must have
        # been observed in the past 30d (defense against silent absence of
        # metric flipping stable_30d to 1 by absent-by-default). The expr
        # returns 1 when the metric is present sometime in the window, 0
        # otherwise. `absent_over_time` returns 1 when absent — invert.
        - record: notify:m7_v1:observation_present:30d
          expr: |
            (1 - absent_over_time(notify:dlq:burn_rate:24h[30d]))
            or vector(0)

        # Boolean stable_30d truth surface. All three predicates must hold:
        #   1) success_rate ≥ 0.995
        #   2) max DLQ burn (24h) over 30d ≤ 1.0
        #   3) zero critical alert minutes over 30d
        #   4) observation present (anti-silence guard)
        #
        # Evidence script + Grafana panel read this single recording rule.
        # `bool` modifier coerces comparisons to 0/1.
        - record: notify:m7_v1:stable_30d
          expr: |
            (
              (notify:m7_v1:dispatch_success_rate:30d >= bool 0.995)
              *
              (notify:m7_v1:dlq_burn_max:30d <= bool 1.0)
              *
              (notify:m7_v1:critical_alert_minutes:30d == bool 0)
              *
              (notify:m7_v1:observation_present:30d == bool 1)
            )
