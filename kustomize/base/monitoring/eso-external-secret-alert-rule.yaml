# PrometheusRule — external-secrets health
#
# 2026-07-06 network-drift observability rule (issue #2268). Prior to this
# rule the 2026-05-20 vault-prod docker-network-drift caused every prod
# ExternalSecret to sit in SecretSyncedError for 2d17h with no alert; the
# ESO controller metrics endpoint existed but had no Service/ServiceMonitor
# (fixed in the sister manifests kustomize/base/eso/service-metrics.yaml
# and kustomize/base/monitoring/eso-servicemonitor.yaml).
#
# Metric verification (before rule authored, Codex thread 019f37d9):
#   $ curl :8080/metrics | grep '^externalsecret_status_condition'
#   externalsecret_status_condition{condition="Ready",name="ghcr-pull",
#     namespace="platform-prod",status="False"} 0
#   externalsecret_status_condition{condition="Ready",name="ghcr-pull",
#     namespace="platform-prod",status="True"} 1
# Series shape: `status="True"|"False"` with value 0/1 acting as a
# one-hot vector. `status="False"` == 1 means the ES is NOT ready.
#
# Alert delivery: Teams (ADR-0029 primary). No PagerDuty gate — this is
# a same-day-repair signal, not a paging incident (Vault re-auth or
# docker recreate solves it). Runbook: docs/RB-vault-ops.md §"Network
# drift".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secret-health
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: monitoring
    # Required by kube-prometheus-stack ruleSelector.
    release: kube-prometheus-stack
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: external-secret-health
      interval: 60s
      rules:
        - alert: ExternalSecretNotReady
          # `status="False"` series carries a 1 exactly when the ES is
          # not ready. by (namespace, name) preserves labels for routing.
          # 5-minute soak absorbs single-scrape flakes (Vault restart,
          # brief network blip during ArgoCD sync) while still catching
          # the 2026-05-20 class where drift persisted for 2d17h.
          expr: |
            sum by (namespace, name) (
              externalsecret_status_condition{condition="Ready", status="False"}
            ) > 0
          for: 5m
          labels:
            severity: warning
            component: external-secrets
            # Route through the existing Teams-primary alertmanager
            # channel (ADR-0029). No PagerDuty; this is not a wake-up.
            team: platform
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} not Ready (>5m)"
            description: |
              ExternalSecret {{ $labels.namespace }}/{{ $labels.name }}
              has Condition Ready=False for at least 5 minutes.
              Common causes:
                (1) Vault container docker network drift (see
                    docs/RB-vault-ops.md §"Network drift" and the
                    2026-05-20 vault-prod incident);
                (2) Vault sealed or unreachable after restart;
                (3) AppRole role_id/secret_id stale.
              Diagnostic:
                kubectl -n {{ $labels.namespace }} describe externalsecret {{ $labels.name }}
                kubectl -n platform-prod get endpoints vault
                docker inspect platform-vault-prod --format '{{ "{{" }}json .NetworkSettings.Networks{{ "}}" }}'
              Runbook: docs/RB-vault-ops.md §"Network drift"
            runbook_url: "https://github.com/Halildeu/platform-k8s-gitops/blob/main/docs/RB-vault-ops.md"

        - alert: ClusterSecretStoreNotReady
          # Store-level failure — a vault outage would flip this for every
          # ES that depends on it. Faster fire (2m) because store-level
          # drift is a broad-blast-radius signal.
          expr: |
            sum by (name) (
              clustersecretstore_status_condition{condition="Ready", status="False"}
            ) > 0
          for: 2m
          labels:
            severity: warning
            component: external-secrets
            team: platform
          annotations:
            summary: "ClusterSecretStore {{ $labels.name }} not Ready (>2m)"
            description: |
              ClusterSecretStore {{ $labels.name }} Ready=False. Every
              ExternalSecret using this store will fail.
              Runbook: docs/RB-vault-ops.md §"Network drift"
            runbook_url: "https://github.com/Halildeu/platform-k8s-gitops/blob/main/docs/RB-vault-ops.md"
