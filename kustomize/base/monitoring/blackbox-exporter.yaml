# Blackbox Exporter — Zanzibar Synthetic Probe (S3-A2)
# Source: docs/S3-stability-soak-pack.md
# Apply: S3 session (S2-B3 smoke-client merged sonrasi, secret mount icin)
# Not: kube-prometheus-stack opsiyonel blackbox-exporter icerir; burada standalone
#
# Codex iter-2 AGREE (2026-04-19) C-1 REVISE-ONAY: Probe hedefleri external
# edge URL'leri (testai.acik.com / ai.acik.com). Cluster-local FQDN hedefleri
# kaldırıldı — prod cluster'dan test cluster'a direkt peering yok.
#
# 3 katman net ayrım:
#   - Prod cluster blackbox (bu dosya): external edge URL'leri — TLS + host
#     nginx + ingress + gateway zinciri authoritative
#   - Test cluster local truth: cluster-direct kubectl smoke (cluster-içi
#     pod-to-pod + permission-service iç health + openfga TCP)
#   - Prod → test peering: şu an GEREKSİZ (S3 için açılmaz)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
data:
  blackbox.yml: |
    modules:
      authz_deny:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_status_codes: [401, 403]
          fail_if_body_matches_regexp:
            - '"error":"server_error"'  # gerçek 401/403 olmalı, 500 olmamalı
          preferred_ip_protocol: ip4
      authz_allow:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_status_codes: [200]
          bearer_token_file: /etc/blackbox/token  # S2-B3 smoke-client secret mount
          preferred_ip_protocol: ip4
      http_200:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_status_codes: [200]
          preferred_ip_protocol: ip4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.27.0
          args:
            - --config.file=/etc/blackbox/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
              protocol: TCP
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "100Mi"
              cpu: "200m"
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox/blackbox.yml
              subPath: blackbox.yml
              readOnly: true
            # S2-B3 sonrasi: smoke-client bearer token mount
            # - name: smoke-token
            #   mountPath: /etc/blackbox/token
            #   subPath: token
            #   readOnly: true
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
        # - name: smoke-token
        #   secret:
        #     secretName: smoke-client-token    # ESO inject (S2-B1 + S2-B3)
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
# Probe CR — testai external edge deny (authoritative edge ölçümü)
# Not: `/variants` ve `/auth/login` artık SPA/public yüzeyler; deny kontratı API
# zincirinde ölçülür.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: zanzibar-testai-edge-deny
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    release: kube-prometheus-stack
spec:
  jobName: blackbox-testai-deny
  module: authz_deny    # unauthenticated 401/403 expect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  interval: 60s
  scrapeTimeout: 15s
  targets:
    staticConfig:
      static:
        - https://testai.acik.com/api/v1/variants?gridId=1204
        - https://testai.acik.com/api/v1/authz/me
      labels:
        component: testai-deny-probe
        edge: testai
---
# Probe CR — testai external edge health (sentinel + actuator)
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: zanzibar-testai-edge-health
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    release: kube-prometheus-stack
spec:
  jobName: blackbox-testai-health
  module: http_200
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  interval: 60s
  targets:
    staticConfig:
      static:
        - https://testai.acik.com/testai-healthz
        - https://testai.acik.com/auth/actuator/health
      labels:
        component: testai-health-probe
        edge: testai
---
# Probe CR — ai.acik.com prod external edge (D32 cutover sonrası aktif)
# Cutover öncesi target 503/404 dönebilir; bu beklenti.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: zanzibar-prod-edge-deny
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    release: kube-prometheus-stack
spec:
  jobName: blackbox-prod-deny
  module: authz_deny
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  interval: 60s
  scrapeTimeout: 15s
  targets:
    staticConfig:
      static:
        - https://ai.acik.com/api/v1/variants?gridId=1204
        - https://ai.acik.com/api/v1/authz/me
      labels:
        component: prod-deny-probe
        edge: ai-prod
---
# Probe CR — ai.acik.com prod edge health (D32 cutover sonrası aktif)
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: zanzibar-prod-edge-health
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    release: kube-prometheus-stack
spec:
  jobName: blackbox-prod-health
  module: http_200
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  interval: 60s
  targets:
    staticConfig:
      static:
        - https://ai.acik.com/auth/actuator/health
      labels:
        component: prod-health-probe
        edge: ai-prod
