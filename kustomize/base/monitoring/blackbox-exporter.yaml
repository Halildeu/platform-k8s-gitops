---
# DiD-2 (defense-in-depth follow-up after 2026-05-21 PermissionProvider
# stale-token incident on ai.acik.com /settings/notifications):
#
# These two Probe CRs are HTTP-level synthetic monitors that detect when the
# frontend's /settings/notifications route stops returning 2xx from the SPA
# nginx fallback (kustomize/base/apps/frontend/nginx-default.conf). They
# explicitly do NOT detect client-side stuck-UI (e.g. PermissionProvider
# AuthNotReadyError loops, "Tercihler yüklenemedi" rendered by JS) — that
# would require a browser-based synthetic (Playwright headless CronJob)
# and is out of scope for this iteration. The HTTP probe still catches:
#   - nginx down / pod CrashLoopBackOff
#   - ingress 5xx / TLS cert expiry / DNS failure
#   - upstream API gateway proxy failures that take the SPA shell with them
#
# Alert wiring lives in prometheusrule-frontend-settings-notifications.yaml.
# Scrape interval 60s + alert `for: 5m` matches existing edge probe pattern
# (zanzibar-prod-edge-health / zanzibar-testai-edge-health above).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: frontend-prod-settings-notifications
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    release: kube-prometheus-stack
spec:
  jobName: blackbox-prod-settings-notifications
  module: http_200
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  interval: 60s
  scrapeTimeout: 15s
  targets:
    staticConfig:
      static:
        - https://ai.acik.com/settings/notifications
      labels:
        component: prod-settings-notifications-probe
        # `edge` is the operational dimension (matches existing
        # zanzibar-prod-edge-* pattern). `host` is the literal DNS name
        # used by alert annotation URLs — keep them SEPARATE because
        # `edge=ai-prod` is NOT a valid hostname (Codex 019e4946 iter-3
        # post-impl REVISE).
        edge: ai-prod
        host: ai.acik.com
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: frontend-testai-settings-notifications
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    release: kube-prometheus-stack
spec:
  jobName: blackbox-testai-settings-notifications
  module: http_200
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  interval: 60s
  scrapeTimeout: 15s
  targets:
    staticConfig:
      static:
        - https://testai.acik.com/settings/notifications
      labels:
        component: testai-settings-notifications-probe
        edge: testai
        host: testai.acik.com
---
# Probe CR — Faz 24 GPU host (Denetim) iç uçları, WireGuard üzerinden.
#
# NEDEN VAR (2026-07-24 arızası): live-stt'nin mTLS ön kapısı olan Caddy,
# Windows zamanlanmış görevinde `ExecutionTimeLimit` tanımsız olduğu için
# varsayılan 3 günün sonunda Windows tarafından öldürüldü. Arkasındaki her şey
# (live-stt :8200, meeting-ai :8300, Ollama) sapasağlam ayaktaydı, ama :8243
# kapandığı için canlı transkripsiyon tamamen durdu. HİÇBİR ALARM ÜRETİLMEDİ;
# arıza ancak kullanıcı "transkript gelmiyor" dediğinde fark edildi.
#
# Bu probe tam o boşluğu kapatır: trafik olmasa bile (gece, kayıt yokken)
# dinleyicinin ölümünü görür. Tüketici-tarafı hata metrikleri bunu yakalayamaz,
# çünkü istek yoksa hata da yoktur.
#
# tcp_connect kullanılır — 8243 mTLS zorunlu olduğu için HTTP probe istemci
# sertifikası olmadan sağlıklı/ölü ayrımı yapamaz (bkz. ConfigMap yorumu).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: faz24-gpu-host-endpoints
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    release: kube-prometheus-stack
spec:
  jobName: blackbox-gpu-host-tcp
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  interval: 60s
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        # live-stt mTLS ön kapısı (Caddy) — direct-STT'nin tek giriş noktası
        - 10.99.0.2:8243
        # meeting-ai — canlı özet/karar/aksiyon üretimi
        - 10.99.0.2:8300
      labels:
        component: faz24-gpu-host-probe
        host: denetim-pc
        transport: wireguard
