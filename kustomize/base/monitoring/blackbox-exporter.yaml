# Blackbox Exporter — Zanzibar Synthetic Probe (S3-A2)
# Source: docs/S3-stability-soak-pack.md
# Apply: S3 session (S2-B3 smoke-client merged sonrasi, secret mount icin)
# Not: kube-prometheus-stack opsiyonel blackbox-exporter icerir; burada standalone
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
data:
  blackbox.yml: |
    modules:
      authz_deny:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_status_codes: [401, 403]
          fail_if_body_matches_regexp:
            - '"error":"server_error"'  # gerçek 401/403 olmalı, 500 olmamalı
          preferred_ip_protocol: ip4
      authz_allow:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_status_codes: [200]
          bearer_token_file: /etc/blackbox/token  # S2-B3 smoke-client secret mount
          preferred_ip_protocol: ip4
      tcp_connect:
        prober: tcp
        timeout: 5s
      http_200:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_status_codes: [200]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.27.0
          args:
            - --config.file=/etc/blackbox/blackbox.yml
          ports:
            - name: http
              containerPort: 9115
              protocol: TCP
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "100Mi"
              cpu: "200m"
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox/blackbox.yml
              subPath: blackbox.yml
              readOnly: true
            # S2-B3 sonrasi: smoke-client bearer token mount
            # - name: smoke-token
            #   mountPath: /etc/blackbox/token
            #   subPath: token
            #   readOnly: true
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter-config
        # - name: smoke-token
        #   secret:
        #     secretName: smoke-client-token    # ESO inject (S2-B1 + S2-B3)
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
# Probe CR — Zanzibar hub smoke (cluster-direct)
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: zanzibar-hub-smoke
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    release: kube-prometheus-stack
spec:
  jobName: blackbox-testai-authz
  module: authz_deny     # Default: unauthenticated deny expect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  interval: 60s
  scrapeTimeout: 15s
  targets:
    staticConfig:
      static:
        - http://permission-service.platform-test.svc.cluster.local:8090/api/v1/authz/version
        - http://permission-service.platform-test.svc.cluster.local:8090/api/v1/authz/me
        - http://api-gateway.platform-test.svc.cluster.local:8080/variants
        - http://api-gateway.platform-test.svc.cluster.local:8080/auth/login
      labels:
        component: zanzibar-deny-probe
---
# Probe CR — Hub TCP health
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: zanzibar-hub-tcp
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    release: kube-prometheus-stack
spec:
  jobName: blackbox-testai-tcp
  module: tcp_connect
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  interval: 60s
  targets:
    staticConfig:
      static:
        - permission-service.platform-test.svc.cluster.local:8090
        - permission-service.platform-test.svc.cluster.local:8081
        - openfga.platform-test.svc.cluster.local:8080
