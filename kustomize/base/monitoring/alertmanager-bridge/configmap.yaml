apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-bridge
    app.kubernetes.io/part-of: monitoring
data:
  # Bridge runtime config; overlays patch GITHUB_REPO + secret reference
  GITHUB_REPO: "Halildeu/platform-k8s-gitops"
  BRIDGE_PORT: "9093"
  BRIDGE_LOG_LEVEL: "INFO"
  BRIDGE_UNDELIVERED_LOG: "/var/log/bridge/undelivered.jsonl"
  # #3888 operator paging (owner decision 2026-10-22: SMS + mail to ai@acik.com;
  # 2026-10-23: SMS only in a crisis, small issues must not page).
  # SMS: only alerts labelled page="sms" (prometheusrule-platform-crisis.yaml),
  # hourly cap. Email: critical only (warnings stay in Prometheus/Grafana).
  ALERT_SMS_MAX_PER_HOUR: "4"
  ALERT_EMAIL_SEVERITIES: "critical"
  ALERT_EMAIL_TO: "ai@acik.com"
  # Graph app access policy allows sending only as ai@acik.com.
  GRAPH_SENDER_MAILBOX: "ai@acik.com"
  JETSMS_CHANNEL: "VF"
