# ServiceMonitor — bridge liveness scrape + future metric exposure.
# Session 53 P0 #5 fix (Codex 019e2a4f): /metrics endpoint bridge'de yok →
# scrape 404 → up{job=alertmanager-bridge}=0 → AlertmanagerBridgeHealthzFail
# false-positive pending. /healthz endpoint mevcut (200 OK) — scrape başarılı,
# up{}=1, alert evaluator local Prom için doğru çalışır.
# Future: bridge prometheus_client eklenince path: /metrics + counter/histogram
# (delivered_total, undelivered_total, github_api_latency).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alertmanager-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-bridge
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-bridge
  endpoints:
    - port: http
      path: /healthz    # scrape 200 OK → up{}=1; metrics yok ama liveness OK
      interval: 60s
      scrapeTimeout: 10s
