# ServiceMonitor — bridge'in kendi metrikleri (future: Prometheus scrape)
# Şu an bridge metric exposure yok ama placeholder; gelecekte counter/histogram
# metrics eklenecek (delivered_total, undelivered_total, github_api_latency).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alertmanager-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-bridge
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-bridge
  endpoints:
    - port: http
      path: /metrics    # bridge prometheus_client eklenince çalışır; şu an 404 OK
      interval: 60s
      scrapeTimeout: 10s
