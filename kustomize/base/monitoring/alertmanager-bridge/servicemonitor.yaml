# ServiceMonitor — bridge Prometheus /metrics scrape (Session 53 P0 C extend).
# Codex `019e2a4f` Q1: bridge'e prometheus_client'sız stdlib pure /metrics
# endpoint eklendi (counter delivered_total/undelivered_total/github_api_*,
# summary github_api_latency_seconds, gauge last_delivery_*). ServiceMonitor
# path /healthz → /metrics geri çevirildi; up{}=1 her iki path'te de çalışır
# (200 OK), ama /metrics scrape ile actual operational counters Prom'a akar.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alertmanager-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-bridge
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-bridge
  endpoints:
    - port: http
      path: /metrics    # Session 53 P0 C: bridge stdlib /metrics endpoint LIVE
      interval: 60s
      scrapeTimeout: 10s
