apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-bridge
    app.kubernetes.io/part-of: monitoring
spec:
  replicas: 1   # D21 — HPA yok
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager-bridge
    spec:
      serviceAccountName: alertmanager-bridge
      containers:
        - name: bridge
          # Use ghcr.io/cli/cli image as it ships gh CLI + Python runtime is added via init
          # Alternatif: alpine:3.19 + apk add github-cli python3 (smaller).
          # Codex consult after first run for image baseline preference.
          image: alpine/git:2.43.0   # placeholder; overlay'de specific image override
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Install runtime deps (cached on layer once we move to dedicated image)
              apk add --no-cache python3 github-cli > /dev/null
              # Run bridge
              python3 /opt/bridge/alertmanager-bridge.py
          envFrom:
            - configMapRef:
                name: alertmanager-bridge
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alertmanager-bridge-gh-token
                  key: token
                  # Bootstrap fallback. Codex `019e6fb5` AGREE Yol C-prime — post-
                  # acceptance flip to `optional: false` (RB §5.2 chain complete +
                  # verify gate Layer 2 machine-enforced ESO Ready=True). Cannot
                  # flip now: ArgoCD reconcile order may schedule pod before ESO
                  # sync, leaving pod Pending forever and disabling self-watch
                  # paging chicken-and-egg. Runtime drift caught via Layer 3
                  # PrometheusRule alertmanager-bridge-gh-auth (3 alerts) routed
                  # SMTP direct-fallback (R9 path), bridge'in kendisine bağımlı
                  # olmadan.
                  optional: true
          ports:
            - containerPort: 9093
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /opt/bridge
              readOnly: true
            - name: log
              mountPath: /var/log/bridge
      volumes:
        - name: script
          configMap:
            name: alertmanager-bridge-script
            defaultMode: 0755
        - name: log
          emptyDir: {}
---
# ServiceAccount for bridge pod (gh CLI auth via env GITHUB_TOKEN OR
# token volume; future: workload identity)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager-bridge
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-bridge
# NOT: Script ConfigMap placeholder kaldırıldı (Codex `019e2a4f` Session 53 P0 #1).
# Gerçek script kustomization.yaml configMapGenerator ile dosyadan üretiliyor:
#   alertmanager-bridge.py (canonical bridge dir altında)
# hashSuffix LIVE → script edit'inde otomatik rolling restart kaskat.
