# PrometheusRule — api-gateway SLO warnings (iter-49 B.2)
#
# Codex 019ddf43 PARTIAL+AGREE: pre-prod scope, paging receiver netleşmediği
# için SADECE warning seviye + annotation. Slack/PagerDuty receiver eklenince
# severity=critical paging rule'ları ayrı PR'da (B.3).
#
# Apply: monitoring base kustomize ile (kube-prometheus-stack Prometheus CR
# ruleSelector `release: kube-prometheus-stack` label match).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-gateway-slo-warnings
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: monitoring
    release: kube-prometheus-stack   # Prom Operator selector
spec:
  groups:
    - name: api-gateway.slo-warnings
      interval: 30s
      rules:
        # 5xx error rate per route — server-side downstream client metric
        # Codex iter-49 B canlı kanıt: http_client_requests_seconds_count
        # {http_method, http_status_code, spring_cloud_gateway_route_id, ...}
        # Pre-prod warning threshold: 1 req/min sustained 5xx → not critical
        # ama dikkat çekici. Prod cutover sonrası threshold sıkılaşır.
        - alert: ApiGatewayDownstream5xxWarning
          expr: |
            sum by (spring_cloud_gateway_route_id) (
              rate(http_client_requests_seconds_count{
                job="api-gateway",
                http_status_code=~"5.."
              }[5m])
            ) > 0.0167
          for: 5m
          labels:
            severity: warning
            component: api-gateway
            slo_class: error-rate
          annotations:
            summary: "api-gateway downstream 5xx rate yüksek ({{ $labels.spring_cloud_gateway_route_id }})"
            description: "Route '{{ $labels.spring_cloud_gateway_route_id }}' downstream 5xx rate son 5dk {{ $value | humanize }}/s. Pre-prod warning eşiği 1/min."
            runbook_url: "docs/runbook-api-gateway-slo.md"
            dashboard_url: "https://ai.acik.com/grafana/d/api-gateway-slo"

        # 4xx error rate (auth fail + client error sinyal) — primary client
        # error sinyali. Production'da yüksek 4xx genelde frontend buggy
        # request veya phishing/scanner. Pre-prod sadece warning.
        - alert: ApiGatewayDownstream4xxWarning
          expr: |
            sum by (spring_cloud_gateway_route_id) (
              rate(http_client_requests_seconds_count{
                job="api-gateway",
                http_status_code=~"4.."
              }[5m])
            ) > 0.0833
          for: 5m
          labels:
            severity: warning
            component: api-gateway
            slo_class: error-rate
          annotations:
            summary: "api-gateway downstream 4xx rate yüksek ({{ $labels.spring_cloud_gateway_route_id }})"
            description: "Route '{{ $labels.spring_cloud_gateway_route_id }}' 4xx rate {{ $value | humanize }}/s (5dk). Pre-prod warning eşiği 5/min — frontend bug veya scanner sinyali."
            runbook_url: "docs/runbook-api-gateway-slo.md"

        # Latency p99 — downstream histogram_quantile
        # Pre-prod warning eşiği p99 > 2s sustained 5dk. Production
        # cutover sonrası SLO target sıkılaşır (p99 < 1s).
        - alert: ApiGatewayLatencyP99Warning
          expr: |
            histogram_quantile(0.99,
              sum by (spring_cloud_gateway_route_id, le) (
                rate(http_client_requests_seconds_bucket{job="api-gateway"}[5m])
              )
            ) > 2
          for: 5m
          labels:
            severity: warning
            component: api-gateway
            slo_class: latency
          annotations:
            summary: "api-gateway p99 latency yüksek ({{ $labels.spring_cloud_gateway_route_id }})"
            description: "Route '{{ $labels.spring_cloud_gateway_route_id }}' p99 latency {{ $value | humanize }}s (5dk). Pre-prod eşiği 2s."
            runbook_url: "docs/runbook-api-gateway-slo.md"

        # Rate limit exceeded — AuthzGuardFilter 429 sinyal
        # /api/v1/authz/check rate limit 60/min default. 429 spike → DoS
        # sinyali veya burst pattern. Pre-prod warning, prod cutover sonrası
        # adaptive threshold + alarm receiver.
        - alert: ApiGatewayAuthzRateLimitWarning
          expr: |
            sum (
              rate(http_server_requests_seconds_count{
                job="api-gateway",
                status="429"
              }[5m])
            ) > 0.167
          for: 5m
          labels:
            severity: warning
            component: api-gateway
            slo_class: rate-limit
          annotations:
            summary: "api-gateway 429 rate limit aşımı yüksek"
            description: "/api/v1/authz/* rate limit 429 trigger {{ $value | humanize }}/s (5dk eşik 10/min). DoS veya bot davranışı sinyali."
            runbook_url: "docs/runbook-api-gateway-slo.md"

        # Phase 2 PR-BE-7b (Codex thread 019e0518 iter-2 absorb): MFE auth
        # transport contract storm signal. The frontend (PR-Refresh-4 + PR-Obs-5)
        # exposes its own counters; the gateway counter complements them from
        # the server side and is independent of the MFE bundle being live.
        #
        # `gateway_auth_unauthorized_total{route_group, auth_mode}` increments
        # on every 401 returned by Spring Security. The alert filters
        # `auth_mode!="none"` so unauthenticated scanner probes don't trigger
        # refresh-storm alarm — they're a separate signal in the
        # GatewayUnauthScannerProbe rule below.
        #
        # Threshold 0.167/s ≈ 10/min for 5+ min ≈ 50 401s in a window where
        # authenticated callers should rarely fail. Soft threshold —
        # promotion to critical after prod cutover + Slack/PagerDuty wired.
        - alert: GatewayAuthRefreshStorm
          expr: |
            sum by (route_group, auth_mode) (
              rate(gateway_auth_unauthorized_total{job="api-gateway",auth_mode!="none"}[5m])
            ) > 0.167
          for: 5m
          labels:
            severity: warning
            component: api-gateway
            slo_class: auth-storm
          annotations:
            summary: "Authenticated 401 storm: {{ $labels.route_group }} ({{ $labels.auth_mode }})"
            description: "401 rate {{ $value | humanize }}/s for route_group={{ $labels.route_group }} auth_mode={{ $labels.auth_mode }} sustained 5+ min. Possible refresh storm — cross-check frontend AuthFsmObserver telemetry + recent recordRefreshAttempt counters."
            runbook_url: "docs/runbook-api-gateway-slo.md"

        # Phase 2 PR-BE-7b: scanner / no-token probe rate. Separate from
        # the refresh-storm alert because root cause differs: no-token 401s
        # are usually scanners or misconfigured clients, not user-facing
        # refresh problems.
        # Threshold 1.67/s ≈ 100/min — info-only sentinel for ops.
        - alert: GatewayUnauthScannerProbe
          expr: |
            sum by (route_group) (
              rate(gateway_auth_unauthorized_total{job="api-gateway",auth_mode="none"}[5m])
            ) > 1.67
          for: 5m
          labels:
            severity: info
            component: api-gateway
            slo_class: scanner-probe
          annotations:
            summary: "No-token 401 probe rate elevated: {{ $labels.route_group }}"
            description: "Unauthenticated 401 rate {{ $value | humanize }}/s for {{ $labels.route_group }} sustained 5+ min. Scanner or misconfigured client (not a refresh storm — see GatewayAuthRefreshStorm)."
            runbook_url: "docs/runbook-api-gateway-slo.md"

        # Phase 2 PR-BE-7b: AuthCookieRateLimitWebFilter 429 sentinel.
        # When this fires, real users are being throttled — either the
        # frontend single-flight is broken (refresh storm got past the
        # frontend dampener and now hits the gateway dampener) OR a
        # focused abuse attempt is underway. Either case needs ops eyes.
        - alert: GatewayAuthCookieRateLimitTriggered
          expr: |
            sum (
              rate(http_server_requests_seconds_count{
                job="api-gateway",
                uri=~"/api/auth/cookie.*",
                status="429"
              }[5m])
            ) > 0.0167
          for: 5m
          labels:
            severity: warning
            component: api-gateway
            slo_class: rate-limit
          annotations:
            summary: "auth-cookie rate limit triggered (≥1/min sustained)"
            description: "POST /api/auth/cookie or /refresh hitting 429 at {{ $value | humanize }}/s. Frontend single-flight may be broken OR focused abuse — investigate gateway rate-limit logs (search 'auth-cookie rate limit denied')."
            runbook_url: "docs/runbook-api-gateway-slo.md"
