# Grafana Dashboard ConfigMap — Platform Pods (8 backend + OpenFGA + frontend)
# Sidecar provisioner auto-import: label grafana_dashboard=1
apiVersion: v1
kind: ConfigMap
metadata:
  name: zanzibar-platform-pods-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: grafana-dashboard
data:
  platform-pods.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "panels": [
        {
          "id": 1,
          "title": "Total Pods Running (platform-*)",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(kube_pod_status_phase{namespace=~\"platform-(test|prod)\",phase=\"Running\"})", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "options": {"colorMode": "background", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 6}, {"color": "green", "value": 8}]}}}
        },
        {
          "id": 2,
          "title": "Pods Not Ready",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(kube_pod_status_ready{namespace=~\"platform-(test|prod)\",condition=\"true\"} == 0)", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "options": {"colorMode": "background", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 2}]}}}
        },
        {
          "id": 3,
          "title": "Pod Restarts (15m)",
          "type": "stat",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"platform-(test|prod)\"}[15m]))", "refId": "A"}],
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "options": {"colorMode": "background", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 3}]}}}
        },
        {
          "id": 4,
          "title": "Pod Memory Usage (MiB)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"platform-(test|prod)\",container!=\"POD\",container!=\"\"}) / 1024 / 1024", "refId": "A", "legendFormat": "{{pod}}"}],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "fieldConfig": {"defaults": {"unit": "MiB"}}
        },
        {
          "id": 5,
          "title": "Pod CPU Usage (cores)",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"platform-(test|prod)\",container!=\"POD\",container!=\"\"}[5m]))", "refId": "A", "legendFormat": "{{pod}}"}],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "fieldConfig": {"defaults": {"unit": "none"}}
        },
        {
          "id": 6,
          "title": "Pod Ready Timeline",
          "type": "timeseries",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "kube_pod_status_ready{namespace=~\"platform-(test|prod)\",condition=\"true\"}", "refId": "A", "legendFormat": "{{namespace}}/{{pod}}"}],
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12},
          "options": {"legend": {"displayMode": "list", "placement": "right"}}
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["platform", "pods"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "",
      "title": "Platform Pods (K8s-6)",
      "uid": "platform-pods",
      "version": 1,
      "weekStart": ""
    }
