          "url": "/d/notification-orchestrator/notification-orchestrator"
        }
      ],
      "panels": [
        {
          "datasource": "Prometheus",
          "description": "Intent terminal transition rate by terminal status (notify_intent_terminated_total{terminal}). System-wide view; per-tenant filter activates when backend adds org_id Counter tag (M8 multi-tenant pre-req).",
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"}
          },
          "targets": [
            {
              "expr": "sum by (terminal) (rate(notify_intent_terminated_total{namespace=\"platform-prod\"}[5m]))",
              "legendFormat": "{{terminal}}",
              "refId": "A"
            }
          ],
          "title": "Intent terminated rate by terminal status",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Dispatch outcome breakdown by channel + status (notify_dispatch_outcome_total{channel, status}). Includes DELIVERED, FAILED, RETRY, BLOCKED_* terminal states. Per-tenant filter follow-up.",
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {
            "legend": {"displayMode": "table", "placement": "right"}
          },
          "targets": [
            {
              "expr": "sum by (channel, status) (rate(notify_dispatch_outcome_total{namespace=\"platform-prod\"}[5m]))",
              "legendFormat": "{{channel}}/{{status}}",
              "refId": "A"
            }
          ],
          "title": "Dispatch outcome by channel + status",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "Eligibility guard block breakdown (DeliveryEligibilityService). Filter dispatch_outcome to BLOCKED_* status set: preference, authz, suppression, idempotency, no-push-endpoint, external-not-allowed. High volumes per reason → tenant policy effects (when org_id tag retrofitted).",
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {
            "legend": {"displayMode": "table", "placement": "right"}
          },
          "targets": [
            {
              "expr": "sum by (channel, status) (rate(notify_dispatch_outcome_total{namespace=\"platform-prod\", status=~\"BLOCKED_.*\"}[5m]))",
              "legendFormat": "{{channel}}/{{status}}",
              "refId": "A"
            }
          ],
          "title": "Eligibility blocks (BLOCKED_*) by channel + status",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "WebPush dispatch outcome (channel=push) breakdown — RFC 8030 status mapping: DELIVERED (201/204), FAILED (410 subscription_expired + 404 endpoint_not_found), BLOCKED_NO_PUSH_ENDPOINT (marker target eligibility guard), RETRY (429/5xx transient). Browser-only scope (Faz 23.7 M7 T4.2); mobile FCM/APNS Faz 22.2 dep.",
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {
            "legend": {"displayMode": "list", "placement": "bottom"}
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(notify_dispatch_outcome_total{namespace=\"platform-prod\", channel=\"push\"}[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "title": "WebPush dispatch outcome by status (channel=push)",
          "type": "timeseries"
        },
        {
          "datasource": "Prometheus",
          "description": "KVKK Madde 13.2 30-gün SLA breach — ErasureSlaWatchdog @Scheduled cron 6h: notify_kvkk_erasure_sla_overdue_count gauge (current overdue) + notify_kvkk_erasure_sla_breach_total counter (cumulative). Per-tenant: requires org_id tag retrofit.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            }
          },
          "gridPos": {"h": 4, "w": 12, "x": 0, "y": 16},
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}
          },
          "targets": [
            {
              "expr": "sum (notify_kvkk_erasure_sla_overdue_count{namespace=\"platform-prod\"})",
              "legendFormat": "overdue (current)",
              "refId": "A"
            },
            {
              "expr": "sum (increase(notify_kvkk_erasure_sla_breach_total{namespace=\"platform-prod\"}[1d]))",
