# Grafana Dashboard ConfigMap — notification-orchestrator per-tenant view
#
# Faz 23.8 M7 T4.3 closure DoD residual (2026-05-21). Companion to
# `notification-orchestrator-dashboard.yaml` (system-wide platform-prod
# namespace view); per-tenant ($tenant) breakdown skeleton.
#
# **Backend metric kontratı hizalama (Codex 019e4bf5 RED absorb)**:
# v1 dashboard query'leri mevcut backend metric isimleriyle uyumlu:
#   - notify_intent_terminated_total{terminal}  (WorkerMetrics)
#   - notify_dispatch_outcome_total{channel, status}  (WorkerMetrics)
#   - notify_kvkk_erasure_sla_overdue_count  (ErasureSlaWatchdog gauge)
#   - notify_kvkk_erasure_sla_breach_total  (ErasureSlaWatchdog counter)
#   - notify_abuse_blocked_total{reason}  (AbuseGuardService)
#   - notify_abuse_bypassed_total  (AbuseGuardService)
#
# **Per-tenant filtering gap (instrumentation follow-up)**:
# Mevcut Counter.builder çağrıları `org_id` Tag taşımıyor (AuditEventPublisher
# audit row'da var, Micrometer counter tag'inde yok). Dashboard $tenant
# template variable'ı + tenant_filter informational panel taşır; backend
# `Counter.builder(...).tag("org_id", orgId).register(...)` retrofit
# sonrası panel filter'ları aktive olur. Backend instrumentation M8
# multi-tenant pre-req (R10 mitigation plan parçası); separate
# platform-backend PR scope.
#
# v1 davranış: panels "All tenants" sistem-genelinde gösterir. $tenant
# variable görsel UI placeholder + dropdown selector; query'lerde aktif
# filter YOK (backend retrofit sonrası filter eklenecek — Codex panel
# query revision iter). Bu pattern → dashboard immediately useful for
# system-wide view + future-ready for multi-tenant.
#
# Sidecar provisioner: grafana_dashboard=1 (helm-values sidecar.dashboards.enabled=true).
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-orchestrator-per-tenant-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  notification-orchestrator-per-tenant.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Notification orchestrator per-tenant ($tenant) view skeleton — Faz 23.8 M7 T4.3 closure DoD. v1 panels system-wide (org_id label backend instrumentation M8 follow-up); $tenant variable future-ready selector.",
      "editable": false,
      "gnetId": null,
      "graphTooltip": 1,
      "id": null,
      "iteration": 1716280800000,
      "links": [
        {
          "icon": "external link",
          "tags": [],
