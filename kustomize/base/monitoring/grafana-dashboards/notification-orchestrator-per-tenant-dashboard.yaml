              "refId": "B"
            }
          ],
          "title": "Erasure 30-gün SLA breach (KVKK Madde 13.2)",
          "type": "stat"
        },
        {
          "datasource": "Prometheus",
          "description": "AbuseGuard rate-limit + fan-out cap decisions. notify_abuse_blocked_total{reason} (RATE_LIMITED / WEBHOOK_FANOUT_CAP / FLOOD) + notify_abuse_bypassed_total (RATE_LIMIT_BYPASSED_CRITICAL severity=critical bypass). Per-tenant: outlier detection requires org_id tag.",
