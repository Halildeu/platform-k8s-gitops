# PrometheusRule — Faz 23 M7 v1 30-day stable observation alerts
#
# Faz 23 M8 PR-1 (Codex `019e8c24` AGREE order D→B→A→C).
#
# Two alerts on the observation truth surface (recording rules in
# notify-m7-stable-recording-rule.yaml):
#
#   1) NotifyM7StableObservationRegression (warning, ticket) — fires when
#      the previously-stable observation flips back to unstable. Operator
#      knows the 30-day clock has effectively restarted.
#
#   2) NotifyM7StableObservationWindowReady (info, evidence trigger) —
#      fires when stable_30d=1 has been continuously true for at least
#      30 days. Triggers the M8 DoD evidence collection step.
#
# These are OBSERVATION alerts — they do NOT mutate the M7 closure state.
# Operator interprets them in conjunction with `docs/scripts/m7-stable-evidence.sh`.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notification-orchestrator-m7-stable-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/name: notification-orchestrator
    release: kube-prometheus-stack
spec:
  groups:
    - name: notification-orchestrator-m7-stable-alerts
      interval: 1m
      rules:
        - alert: NotifyM7StableObservationRegression
          # Stable observation flipped from green to red. The 30-day
          # stability clock has effectively restarted (M7 v1 stable claim
          # is no longer valid). NOT paging — ticket-only; the M8 readiness
          # blocker tracks itself via the recording rule, not via paging.
          expr: |
            notify:m7_v1:stable_30d == 0
            and on(namespace)
            (
              max_over_time(notify:m7_v1:stable_30d[1d]) > 0
            )
          for: 15m
          labels:
            severity: warning
            service: notification-orchestrator
            milestone: faz-23-m7-v1
            page: "false"
          annotations:
            summary: "Notify M7 v1 stable_30d regressed — 30-day clock effectively restarted"
            description: |
              The M7 v1 30-day stable observation has regressed from green
              to red in namespace {{ $labels.namespace }}. Predicates:
              dispatch_success_rate ≥ 0.995 AND dlq_burn_max ≤ 1.0 AND
              zero critical alert minutes — one or more no longer holds.
              The M8 (Multi-tenant Trigger Gate) DoD blocker has reset;
              the next 30-day stability window starts now. Operator action:
              run docs/scripts/m7-stable-evidence.sh to identify which
              predicate failed; investigate corresponding regression
              (provider degradation, template change, retry-policy shift).
            runbook_url: "https://github.com/Halildeu/platform-k8s-gitops/blob/main/docs/operations/RUNBOOKS/RB-faz-23-m7-30day-stable-observation.md"

        - alert: NotifyM7StableObservationWindowReady
          # Stable observation has been green continuously for 30 days.
          # M8 DoD blocker #1 (M7 v1 ≥30 day stable) condition met —
          # trigger evidence collection + downstream M8 readiness sprint.
          # Info severity, page=false; operator-observable signal.
          #
          # `min_over_time(... [30d]) == 1` means stable_30d was 1 at
          # every observation step over the past 30 days. This is the
          # strict claim — any single dip resets the count to 0.
          expr: |
            min_over_time(notify:m7_v1:stable_30d[30d]) == 1
          for: 1h
          labels:
            severity: info
            service: notification-orchestrator
            milestone: faz-23-m7-v1
            page: "false"
            evidence_trigger: m8-readiness
          annotations:
            summary: "Notify M7 v1 stable_30d window READY — M8 DoD evidence collection trigger"
            description: |
              The M7 v1 30-day stable observation has held continuously
              for ≥30 days in namespace {{ $labels.namespace }}. M8
              (Multi-tenant Trigger Gate) DoD blocker #1 condition met.
              Operator action: run docs/scripts/m7-stable-evidence.sh
              to emit the canonical evidence document
              (docs/faz-23-evidence/YYYY-MM-DD-m7-v1-30day-stable-evidence.md);
              start M8 PR-2 (Faz 21 charter draft) when evidence accepted.
            runbook_url: "https://github.com/Halildeu/platform-k8s-gitops/blob/main/docs/operations/RUNBOOKS/RB-faz-23-m7-30day-stable-observation.md"
