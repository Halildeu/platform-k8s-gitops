# ClusterIssuer — Let's Encrypt PROD (rate limit 50 cert/week domain, 5/hour)
# Prereq: staging ClusterIssuer ile test PASS (cert issued); prod'a geçiş.
# HTTP-01 challenge via ingress-nginx
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: platform
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: halildeu@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: nginx
            podTemplate:
              spec:
                nodeSelector:
                  kubernetes.io/os: linux
