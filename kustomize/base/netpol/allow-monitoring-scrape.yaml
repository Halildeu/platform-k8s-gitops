# monitoring namespace'inden (Prometheus, Promtail) app pod'lara metric scrape
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081     # management port (actuator ayrı — standart pattern)
