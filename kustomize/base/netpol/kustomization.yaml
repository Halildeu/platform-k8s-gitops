apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/component: netpol
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: false

resources:
  - default-deny.yaml
  - allow-ingress-from-nginx.yaml
  - allow-ingress-intra-ns.yaml
  - allow-monitoring-scrape.yaml
  - allow-egress-dns-and-host.yaml
  # Faz 19.MSSQL.F: NetPol overlay-spesifik (her cluster bridge subnet'i farklı IP)
  # overlays/prod: egress 172.21.0.7/32:11433 (workcube-mssql-proxy-prod)
  # overlays/test: egress 172.19.0.8/32:11433 (workcube-mssql-proxy-test)
