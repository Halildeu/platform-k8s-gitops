# ingress-nginx namespace'inden app namespace'e HTTP trafiği
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress-nginx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: platform
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        # ingress-nginx hem frontend (80) hem api-gateway (8080) upstream'lerine erişir
        - protocol: TCP
          port: 80       # frontend
        - protocol: TCP
          port: 8080     # api-gateway
        - protocol: TCP
          port: 8210     # audio-gateway (Faz 24 /api/v1/audio-gateway direct path — gitops#1447)
