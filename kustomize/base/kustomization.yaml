# PoC Dilim 1 base — api-gateway + auth-service + host bridges
# Dilim 2+'da user-service, variant-service, ... eklenecek.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: false

resources:
  - host-services
  - apps/auth-service
  - apps/api-gateway
  - apps/user-service
  - apps/variant-service
  - apps/core-data-service
  - apps/report-service
  - apps/schema-service
  - apps/openfga          # Dilim 3 — authz engine (StatefulSet)
  - apps/frontend         # Dilim 3 — MFE shell (nginx)
  - ingress
  - netpol         # D15 + Codex Tur-4 C modeli (default-deny + allowlist)
  - quota          # D22 ResourceQuota + LimitRange
