# meeting-service ServiceMonitor — Faz 24 PR-obs-03 (gitops#1660)
#
# Bağlam: meeting-service (#410) k3d-test'te 1/1 canlı ama ServiceMonitor'u
# YOKTU → hiç scrape edilmiyordu (up{job="meeting-service"} serisi bile yok).
# Bu SM management:8081 /actuator/prometheus hedefini ekler (micrometer-prometheus
# aktif; exposure health,info,prometheus — canlı 200 doğrulandı 2026-06-18).
#
# Metrik tabanı (canlı envanter): http_server_requests_seconds_count{status,uri}
# + hikaricp_connections_* (pool max=5) + JVM seti. Custom meeting_* metriği
# YOK (skeleton domain counter'ları ayrı backend PR'ı).
#
# namespaceSelector test+prod: meeting-service prod'a D30 cutover'a kadar deploy
# EDİLMEYECEK → prod'da eşleşen Service yok → SM boş kalır (audio-gateway
# emsaliyle aynı D30-defer davranışı). NetPol: 8081 zaten allow-monitoring-scrape
# (part-of=platform) içinde → ek NetPol gerekmez.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: meeting-service
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: meeting-service
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - platform-prod
      - platform-test
