# meeting-service ConfigMap — Faz 24 Meeting Intelligence (foundation deploy #410)
#
# Non-secret env contract. Source: meeting-service application-k8s.yml +
# application.yml defaults (platform-backend). DB credentials
# (SPRING_DATASOURCE_USERNAME/PASSWORD) + OpenFGA store/model IDs are delivered
# via the ESO-managed `meeting-service-secrets` Secret (not here), matching
# endpoint-admin-service discipline.
#
# Env-specific override (KEYCLOAK_ISSUER_URI / KEYCLOAK_JWKS_URI /
# SECURITY_JWT_AUDIENCE) stays test-base default; a prod overlay would patch the
# realm ('serban') like endpoint-admin.

apiVersion: v1
kind: ConfigMap
metadata:
  name: meeting-service-config
  annotations:
    # Mirror endpoint-admin: ArgoCD Replace sync keeps this ConfigMap exact and
    # removes stale keys after a desired-state key removal.
    argocd.argoproj.io/sync-options: Replace=true
  labels:
    app.kubernetes.io/name: meeting-service
data:
  # Listen ports (Spring Boot SERVER_PORT 8097)
  SERVER_PORT: "8097"
  MANAGEMENT_SERVER_PORT: "8081"

  # Datasource (host-compose Postgres test cluster — D6 stateful contract).
  # Database name `meeting`; schema `meeting_service` is owned + created by
  # Flyway (flyway.schemas=meeting_service). DB user/password come from ESO.
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/meeting"
  DB_POOL_MAX: "5"

  # JPA / Flyway — Flyway is the sole schema authority. baseline-on-migrate
  # baselines an existing schema; ddl-auto=validate (Hibernate verifies, never
  # mutates). MEETING_DB_SCHEMA defaults to meeting_service in the app, set here
  # explicitly so Flyway default-schema + Hibernate default_schema agree.
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  MEETING_DB_SCHEMA: "meeting_service"

  # Identity / OIDC — test=platform-test realm; prod overlay would patch 'serban'
  KEYCLOAK_ISSUER_URI: "https://testai.acik.com/realms/platform-test"
  KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"

  # JWT Security
  SECURITY_AUTH_ALLOWED_CLIENT_IDS: "frontend,admin-cli,serban-web,account,platform-desktop"
  SECURITY_JWT_AUDIENCE: "meeting-service,frontend,account,serban-web"

  # Meeting-AI durable result ingestion — auth-service issued, short-lived
  # service JWT. The secondary decoder remains fail-closed unless all four
  # bindings agree with the token. JWKS stays on the cluster network; it is not
  # exposed through the GPU-facing private gateway.
  MEETING_INTERNAL_SERVICE_JWT_JWK_SET_URI: "http://auth-service:8088/oauth2/jwks"
  MEETING_INTERNAL_SERVICE_JWT_ISSUER: "auth-service"
  MEETING_INTERNAL_SERVICE_JWT_AUDIENCE: "meeting-service"
  MEETING_INTERNAL_SERVICE_JWT_CLIENT_IDS: "meeting-ai,transcript-service"

  # Spring profile — activates application-k8s.yml (KEYCLOAK_JWKS_URI binding,
  # OpenFGA gate). Without it SecurityConfig falls back to the serban realm JWKS.
  SPRING_PROFILES_ACTIVE: "k8s"

  # Eureka / Spring Cloud (D7 — Eureka removed)
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED: "false"

  # OpenFGA authz gate (common-auth `erp.openfga.*` contract). enabled=true so
  # the @RequireModule (MeetingRequireModuleInterceptor) is NOT a fail-open
  # no-op. Store/Model ID are env-specific runtime selectors delivered through
  # the ESO-managed `meeting-service-secrets` Secret from kv/platform/openfga
  # (shared model ledger; same discipline as endpoint-admin / permission-service).
  ERP_OPENFGA_ENABLED: "true"
  ERP_OPENFGA_API_URL: "http://openfga:8080"
  ERP_OPENFGA_CHECK_CACHE_TTL_SECONDS: "10"

  # Local default tenant (legacy scope key back-fill — meeting.tenant.*)
  MEETING_LOCAL_DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"

  # Logging
  LOGGING_LEVEL_ROOT: "INFO"

  # Management / actuator
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
