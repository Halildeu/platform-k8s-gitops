# meeting-service Service — Faz 24 Meeting Intelligence (foundation deploy #410)
apiVersion: v1
kind: Service
metadata:
  name: meeting-service
  labels:
    app.kubernetes.io/name: meeting-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meeting-service
  ports:
    # App listens 8097 → targetPort http (8097); ClusterIP routing tutarlı.
    - name: http
      port: 8097
      targetPort: http
      protocol: TCP
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
