apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# app.kubernetes.io/name SELECTOR'A DA gider (Deployment pod selector + Service selector
# aynı label ile eşleşsin). Template'e de eklensin ki pod'lar bu label'ı taşısın.
labels:
  - pairs:
      app.kubernetes.io/name: auth-service
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - pdb.yaml
  # externalsecret.yaml — ESO kurulumu sonrası etkinleştirilecek
  # (PoC'de envFrom Secret yoksa Deployment CreateContainerConfigError alır;
  # overlays/local'de stub Secret ya da commented olabilir)
  # - externalsecret.yaml
