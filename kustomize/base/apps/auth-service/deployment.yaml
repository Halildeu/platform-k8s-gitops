# auth-service — D7 (Eureka yok, K8s DNS), D21 (HPA yok, sabit replica),
# D22 (request dar/limit cömert), D24 (Xmx explicit)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2                      # prod default (D21); test overlay 0'a çekecek
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
      # D27 upstream Prometheus Operator: annotation YERİNE ServiceMonitor CR
      # (bkz servicemonitor.yaml). Annotation-based scrape kube-prom-stack
      # default'ta dinlenmez.
    spec:
      serviceAccountName: auth-service     # D26: ghcr-pull secret için
      # D14: non-root (Dockerfile'dan gelen), pod-level güvenlik de sıkıla
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: auth-service:poc        # overlays'de GHCR tag ile değişir
          imagePullPolicy: IfNotPresent  # local overlay'de Never olacak
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
            - name: management           # Spring Boot actuator ayrı port (auth'suz)
              containerPort: 8081
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: JAVA_OPTS
              value: "-Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secrets        # ESO tarafından Vault'tan dolar
          resources:
            requests:
              memory: "256Mi"       # D22: request dar
              cpu: "150m"
            limits:
              memory: "512Mi"       # D24: heap + metaspace + direct tampon
              cpu: "750m"           # D22: limit cömert, request≠limit
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management       # 8081 (auth'suz actuator port)
            failureThreshold: 30
            periodSeconds: 5        # 30*5 = 150 sn startup toleransı
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
