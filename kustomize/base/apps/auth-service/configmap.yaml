# auth-service config — overlays'de namespace-spesifik değerler override edilir
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
data:
  # Host-level bağımlılıklar — Service+Endpoints (D19) üzerinden
  KEYCLOAK_URL: "http://keycloak.PLACEHOLDER_NS.svc.cluster.local:8080"
  DB_URL: "jdbc:postgresql://postgres.PLACEHOLDER_NS.svc.cluster.local:5432/auth_db"
  # Diğer servisler (Dilim 2+'de doldurulacak)
  # USER_SERVICE_URL: "http://user-service.PLACEHOLDER_NS.svc.cluster.local:8089"
  # CORE_DATA_URL: "http://core-data-service.PLACEHOLDER_NS.svc.cluster.local:8092"

  # Spring Boot
  SERVER_PORT: "8088"
  MANAGEMENT_SERVER_PORT: "8088"

  # Tracing (Tempo için; base'de kapalı, monitoring kurulunca aç)
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"

  # Logging level (prod'da INFO, test'te DEBUG override edilir)
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_ACIK: "INFO"
