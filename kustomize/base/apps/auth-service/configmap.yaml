# auth-service config — overlays'de namespace-spesifik değerler override edilir
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
data:
  # Host-level bağımlılıklar — Service+Endpoints (D19) üzerinden
  # Spring Boot convention env: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
  # SPRING_DATASOURCE_PASSWORD (username/password Secret'tan gelir)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/auth_db"
  KEYCLOAK_URL: "http://keycloak:8080"
  # Diğer servisler (Dilim 2+'de doldurulacak)
  # USER_SERVICE_URL: "http://user-service:8089"
  # CORE_DATA_URL: "http://core-data-service:8092"

  # Spring Boot
  SERVER_PORT: "8088"
  # Actuator ayrı port (Spring Boot native): 8081'de yayınlanır, Spring Security
  # filter chain main port'a attached — management port serbest (standart pattern)
  MANAGEMENT_SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"

  # Graceful shutdown — Codex Tur-3 #6
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"

  # PG connection pool — canlı gözlem (follow-up #7): PG max_conn 100, compose
  # prod 50 conn + k8s 7×10=70 → aşım → CrashLoop. PG max_conn 200'e ALTER
  # SYSTEM ile artırıldı; k8s pool 5/min 2 baseline.
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"

  # Service JWT key pair — application.properties Vault placeholder'ı
  # (${vault.jwt.auth-service.privateKey}) K8s'te çözülenmiyor → literal string
  # base64 decode'da "$" illegal char → CrashLoop.
  # Boş bırakınca ServiceJwtConfiguration otomatik geçici key pair üretir
  # (handoff §7.3, follow-up #8). ESO+Vault gelince Secret'tan override edilir.
  SECURITY_SERVICE_JWT_PRIVATE_KEY: ""
  SECURITY_SERVICE_JWT_PUBLIC_KEY: ""

  # Spring Cloud Vault: K8s'te ESO kullanılacak (PLAN Faz 3), Vault client gereksiz.
  # Yoksa "Cannot create authentication mechanism for TOKEN" ile crash.
  SPRING_CLOUD_VAULT_ENABLED: "false"

  # D7 Eureka kapatma (ana repo Eureka temizliği gelene kadar runtime override)
  # Bu env'ler main-stable image'ındaki Eureka client'ı devre dışı bırakır.
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED: "false"

  # Zanzibar runtime (D-003 TRANSFORMED, 2026-04-19 K8s-6 Seviye 1)
  # auth-service K8s profile'daki hardcoded platform-prod.svc override (K8s-6 4-tur Codex tespit)
  # Permission-service Service port 8090 → targetPort 8084 (PR #502 + apps/permission-service/service.yaml)
  # Intra-ns shortname (Codex S1-D5.5 ping-pong Seçenek B uzlaşı, MINIMAL scope)
  PERMISSION_SERVICE_BASE_URL: "http://permission-service:8090"
  PERMISSION_AUDIT_MIRROR_BASE_URL: "http://permission-service:8090"
  PERMISSION_AUDIT_MIRROR_ENABLED: "true"
  USER_SERVICE_BASE_URL: "http://user-service:8089"
  ERP_OPENFGA_ENABLED: "true"
  ERP_OPENFGA_API_URL: "http://openfga:8080"

  # User Impersonation v1 (PR-B platform-backend #137 + GitOps #478):
  # KeycloakBrokerClient RFC 8693 token exchange endpoint.
  # Realm "serban" matches existing KC base config. Broker client
  # secret comes from ESO/Vault (auth-impersonation-broker secret) —
  # populated via overlay-specific ExternalSecret + Deployment env.
  AUTH_IMPERSONATION_KEYCLOAK_TOKEN_URL: "http://keycloak:8080/realms/serban/protocol/openid-connect/token"
  AUTH_IMPERSONATION_BROKER_CLIENT_ID: "impersonation-broker"
  AUTH_IMPERSONATION_EXCHANGE_AUDIENCE: "frontend"

  # Tracing (Tempo için; base'de kapalı, monitoring kurulunca aç)
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"

  # Logging level (prod'da INFO, test'te DEBUG override edilir)
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_ACIK: "INFO"
