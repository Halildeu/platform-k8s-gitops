# Stub Secret — PoC Dilim 1 için auth-service pod'un boot olabilmesi.
# ESO + Vault ClusterSecretStore kurulunca (Faz 3 sonrası) bu dosya
# kustomization'dan çıkarılır ve externalsecret.yaml aktif edilir.
#
# Overlays/local: stub değerler lokal PG/KC ile çalışır
# Overlays/prod, test: ESO bu Secret'ı OVERRIDE eder (aynı isim, Owner policy)
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  annotations:
    platform.acik.com/stub: "true"       # ESO aktif olunca silinir
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  DB_USERNAME: "platform"                 # lokal PG için; Vault prod/test'te override
  DB_PASSWORD: "change-me-local-only"
  KEYCLOAK_CLIENT_SECRET: "change-me-local-only"
