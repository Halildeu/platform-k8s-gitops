# auth-service için Vault'tan secret çekimi (D9, ESO)
# PoC öncesi ESO kurulmamış olabilir — bu manifest deploy edilmeden
# önce external-secrets namespace'i hazır olmalı.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-cluster-store          # ClusterSecretStore (namespace-agnostic)
    kind: ClusterSecretStore
  target:
    name: auth-service-secrets         # Deployment envFrom bunu kullanıyor
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: platform/auth-service     # overlays'de prefix değişebilir (örn /prod/ /test/)
        property: db_username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: platform/auth-service
        property: db_password
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: platform/auth-service
        property: keycloak_client_secret
