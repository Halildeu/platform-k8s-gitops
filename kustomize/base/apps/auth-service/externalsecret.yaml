# ExternalSecret — auth-service (D9 ESO + Vault)
# Source: docs/handoff-S2-B-artifact-hardening.md (S2-B1 per-service pattern)
# Apply: ESO aktif olunca, secret-stub.yaml kustomization'dan çıkarılır
# Revize 2026-04-19: ClusterSecretStore 'vault-platform-gitops' (c5b9789 base),
# Spring Boot convention env (SPRING_DATASOURCE_USERNAME/PASSWORD), JWT key pair,
# permission-service internal API key (auth→permission call)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-secrets
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: auth-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/auth-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/auth-service
        property: db_password
    # Service JWT key pair (auth-service-secrets stub'da boş, ESO ile doldurulur)
    # Handoff §7.3 follow-up #8: ServiceJwtConfiguration otomatik key gen kaldırılır
    - secretKey: SECURITY_SERVICE_JWT_PRIVATE_KEY
      remoteRef:
        key: kv/platform/auth-service
        property: jwt_private_key
    - secretKey: SECURITY_SERVICE_JWT_PUBLIC_KEY
      remoteRef:
        key: kv/platform/auth-service
        property: jwt_public_key
    # Keycloak confidential client
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: kv/platform/auth-service
        property: keycloak_client_secret
    # Permission-service internal API key (auth→permission call D-003 TRANSFORMED)
    - secretKey: PERMISSION_SERVICE_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/permission-service
        property: internal_api_key
