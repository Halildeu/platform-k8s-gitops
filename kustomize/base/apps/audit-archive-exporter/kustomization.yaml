# audit-archive-exporter base — Faz 24 PR-obs-02 (#1656, ADR-0042 §4).
#
# DB-state exporter for the audit-retention-worker (run-once CronJob → ephemeral
# in-process metrics). postgres_exporter with custom queries over the durable
# audit_archive.* state. TEST-overlay-only (worker is test-only until the §5 prod
# gate); ops/ carries the CRD-gated ServiceMonitor (overlay includes it too).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: audit-archive-exporter
    includeSelectors: true
    includeTemplates: true
  # part-of=audit-archive (NOT platform) — same failure-domain discipline as the
  # worker (Codex 019ed602 Must-Fix 3): the pod must NOT inherit the broad
  # namespace-wide allow-egress-host-bridge / allow-egress-dns / allow-monitoring-scrape
  # (all part-of=platform). The overlay's netpol-audit-archive-exporter.yaml is its
  # SOLE allowlist (egress DNS + host PG only; ingress monitoring→9187).
  - pairs:
      app.kubernetes.io/part-of: audit-archive
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  - configmap-queries.yaml
  # Secret comes via ESO (overlay-specific ExternalSecret —
  # overlays/test/eso/audit-archive-exporter/; Vault kv/platform/audit-archive-exporter
  # → DATA_SOURCE_USER/PASS for the dedicated read-only role audit_archive_exporter).
