apiVersion: v1
kind: ServiceAccount
metadata:
  name: etl-worker
  labels:
    app.kubernetes.io/name: etl-worker
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: platform
automountServiceAccountToken: false
# Codex 019e2d27 PR-3c REVISE P1 #1: image lives at
# ghcr.io/halildeu/platform-backend-etl-worker (private package
# under the org). Kubelet needs a pull secret to fetch the digest
# pinned in job.yaml; matches the pattern other private GHCR
# consumers in this repo use. The Secret itself is owned by the
# platform bootstrap (`ghcr-pull` ExternalSecret under
# `kustomize/overlays/<env>/eso/`); PR-4 runbook verifies it
# exists in the platform-test namespace before applying the Job.
imagePullSecrets:
  - name: ghcr-pull
