# etl-worker — bootstrap secret stub (overlays/local only)
# Production overlays use ESO ExternalSecret over Vault.
# Vault path:
#   kv/platform/mssql-external      (shared with schema-service)
#   kv/platform/etl-worker-pg       (separate, ETL-specific PG user)
#
# Codex 019dc88c iter-4 AGREE on user-gated, no-auto-deploy.

apiVersion: v1
kind: Secret
metadata:
  name: etl-worker-pg-secrets
  annotations:
    platform.acik.com/stub: "true"
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  PG_USER: "postgres"
  PG_PASSWORD: "change-me-local-only"
---
apiVersion: v1
kind: Secret
metadata:
  name: etl-worker-mssql-secrets
  annotations:
    platform.acik.com/stub: "true"
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  MSSQL_USER: "stub"
  MSSQL_PASSWORD: "change-me-local-only"
