# etl-worker (Adım 12 PR-3c) — bootstrap secret stub.
#
# Used by the local overlay only. Production overlays use the
# ESO ExternalSecret in `ops/externalsecret.yaml` to populate the
# real values from Vault. Codex `019e2a5c` PR-3a contract:
#
#   - `etl-worker-reports-db-secrets`     → REPORTS_DB_USER / REPORTS_DB_PASSWORD
#   - `etl-worker-schema-service-secrets` → SCHEMA_SERVICE_INTERNAL_API_KEY
#
# Adım 12 dropped the old MSSQL secret stub — schema-service owns
# MSSQL access; the worker only ever talks to schema-service over HTTP.

apiVersion: v1
kind: Secret
metadata:
  name: etl-worker-reports-db-secrets
  annotations:
    platform.acik.com/stub: "true"
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  REPORTS_DB_USER: "etl_writer"
  REPORTS_DB_PASSWORD: "change-me-local-only"
---
apiVersion: v1
kind: Secret
metadata:
  name: etl-worker-schema-service-secrets
  annotations:
    platform.acik.com/stub: "true"
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  SCHEMA_SERVICE_INTERNAL_API_KEY: "change-me-local-only"
