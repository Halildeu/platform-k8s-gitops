# Real ESO ExternalSecrets for prod-grade overlays. base/secret-stub.yaml
# stays in the local overlay only.
#
# Vault paths:
#   kv/platform/mssql-external      (shared with schema-service)
#   kv/platform/etl-worker-pg       (separate ETL-specific PG user)

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-worker-mssql-secrets
  labels:
    app.kubernetes.io/name: etl-worker
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: etl-worker-mssql-secrets
    creationPolicy: Owner
  data:
    - secretKey: MSSQL_USER
      remoteRef:
        key: kv/platform/mssql-external
        property: username
    - secretKey: MSSQL_PASSWORD
      remoteRef:
        key: kv/platform/mssql-external
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-worker-pg-secrets
  labels:
    app.kubernetes.io/name: etl-worker
    app.kubernetes.io/component: migration
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: etl-worker-pg-secrets
    creationPolicy: Owner
  data:
    - secretKey: PG_USER
      remoteRef:
        key: kv/platform/etl-worker-pg
        property: username
    - secretKey: PG_PASSWORD
      remoteRef:
        key: kv/platform/etl-worker-pg
        property: password
