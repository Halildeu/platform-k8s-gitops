# Real ESO ExternalSecrets for prod-grade overlays (Adım 12 PR-3c).
# `base/secret-stub.yaml` stays in the local overlay only.
#
# Codex `019e2a5c` PR-3a contract: REPORTS_DB_USER / REPORTS_DB_PASSWORD
# for the PostgreSQL adapter + SCHEMA_SERVICE_INTERNAL_API_KEY for the
# schema-service HTTP client. The old MSSQL ExternalSecret was dropped
# in PR-3c — schema-service owns MSSQL access; the worker only ever
# talks to schema-service over HTTP.
#
# Vault paths:
#   kv/platform/etl-worker-reports-db    (PG user for reports_db UPSERTs)
#   kv/platform/schema-service-internal  (X-Internal-Api-Key shared with
#                                         the report-service client)

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-worker-reports-db-secrets
  labels:
    app.kubernetes.io/name: etl-worker
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: etl-worker-reports-db-secrets
    creationPolicy: Owner
  data:
    - secretKey: REPORTS_DB_USER
      remoteRef:
        key: kv/platform/etl-worker-reports-db
        property: username
    - secretKey: REPORTS_DB_PASSWORD
      remoteRef:
        key: kv/platform/etl-worker-reports-db
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etl-worker-schema-service-secrets
  labels:
    app.kubernetes.io/name: etl-worker
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: etl-worker-schema-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: SCHEMA_SERVICE_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/schema-service-internal
        property: api_key
