# endpoint-admin-remote-bridge ServiceAccount — Faz 22.6 D10-8 broker isolation
#
# Codex topology A+ (thread 019ebc38-73d9-7332-a9d4-c9ac59c7dfa0): the broker is
# a SEPARATE Deployment on the SAME endpoint-admin image. This SA is its OWN
# identity, deliberately minimal.
#
# Control #2 (Codex): separate ServiceAccount + automountServiceAccountToken:false
# + NO Role/RoleBinding. The broker pod gets NO API access — no secret get, no
# pods/exec, no deployment patch, no cluster token mounted. A broker compromise
# therefore yields zero Kubernetes API authority (control #9 — no ambient creds).
#
# NOTE: NO RBAC (Role/RoleBinding/ClusterRole) ships with this SA — that absence
# is the control. Do not add any.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: endpoint-admin-remote-bridge
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/component: remote-bridge-broker
    # DELIBERATELY NOT app.kubernetes.io/part-of: platform (control #1) — see
    # deployment.yaml header. The broker must not inherit the platform-wide
    # NetworkPolicy allowlists.
    app.kubernetes.io/part-of: remote-bridge
imagePullSecrets:
  - name: ghcr-pull
automountServiceAccountToken: false
