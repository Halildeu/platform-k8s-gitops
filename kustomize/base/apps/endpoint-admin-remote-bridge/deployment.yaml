# endpoint-admin-remote-bridge Deployment — Faz 22.6 D10-8 broker isolation
#
# Codex topology A+ (thread 019ebc38-73d9-7332-a9d4-c9ac59c7dfa0): a SEPARATE
# Deployment running the SAME endpoint-admin-service image with the remote-bridge
# broker ENABLED, while the primary endpoint-admin-service stays
# remote-bridge.enabled=false. This file is the SCAFFOLD (desired-state):
#
#   replicas: 0  +  REMOTE_BRIDGE_ENABLED=false  →  INERT.
#
# It mutates nothing live and is NOT wired into any auto-synced overlay (not in
# the Argo root). The owner-gated activation overlay
# (overlays/test/activation/endpoint-admin-remote-bridge) flips replicas:1 +
# enabled=true + pins an immutable digest + mounts the mTLS/signer secrets +
# attaches the broker NetworkPolicies. Adding the scaffold to a synced overlay
# can never start a live session by itself (still replicas:0 / disabled).
#
# Isolation controls realized here:
#   #1  NO app.kubernetes.io/part-of: platform on the pod → the broker is
#       excluded from every platform-wide NetworkPolicy allowlist
#       (kustomize/base/netpol/* all select part-of=platform). The namespace
#       default-deny (podSelector:{}) STILL applies, so the broker is
#       default-denied with no broad allow — fail-closed by construction.
#   #2  serviceAccountName: endpoint-admin-remote-bridge + automount:false +
#       no RBAC (see serviceaccount.yaml).
#   #5  containerPorts advertise ONLY bridge(9444) + management(8081, kubelet
#       probes). http(8096) is intentionally NOT declared; the Service
#       publishes only 9444; the activation netpol denies 8096/8081 ingress.
#   #9  no ambient admin creds — the broker secret (control #3) carries no
#       admin-REST / admin-JWT / cluster token; SA mounts no API token.
#   #11 fail-closed activation — when the activation overlay sets enabled=true
#       with a missing signer/cert/secret, the broker beans fail to construct
#       (T-2c refuses to bind without mTLS PEMs) and the pod never becomes
#       Ready. enabled=true lives ONLY here, never on the primary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint-admin-remote-bridge
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/component: remote-bridge-broker
    app.kubernetes.io/part-of: remote-bridge
spec:
  # control #11 — scaffold ships scaled to zero; activation overlay sets 1.
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-remote-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: endpoint-admin-remote-bridge
        app.kubernetes.io/component: remote-bridge-broker
        # control #1 — deliberately NO part-of: platform here.
        app.kubernetes.io/part-of: remote-bridge
    spec:
      automountServiceAccountToken: false           # control #2 / #9
      serviceAccountName: endpoint-admin-remote-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup so the non-root user (65532) can read the activation mTLS /
        # signer secret volumes (mounted defaultMode 0440, group-readable).
        # Without it the broker would fail to load the PEMs and fail-closed for
        # the WRONG reason — smoke could not prove real mTLS (Codex 019ebc51 P1).
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: endpoint-admin-remote-bridge
          # PLACEHOLDER — same image as endpoint-admin-service (Codex A+). The
          # activation overlay pins the immutable digest via images: (D30).
          # Fail-closed: literal "OVERLAY_MUST_OVERRIDE" leaking to a live apply
          # is rejected by gate-enforcement-check.yml.
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/endpoint-admin-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            # control #5 — ONLY the mTLS gRPC bridge + management (probes).
            # http(8096) NOT declared.
            - name: bridge
              containerPort: 9444
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: endpoint-admin-remote-bridge-config
            # control #3 — the broker's OWN secret, NOT
            # endpoint-admin-service-secrets. optional:true in the scaffold so an
            # inert (replicas:0) state needs no secret; the activation overlay
            # patches this to optional:false (fail-closed, control #11).
            - secretRef:
                name: endpoint-admin-remote-bridge-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Probes on the management port. control #11 fail-closed: when
          # enabled=true and the broker context fails to start (missing
          # signer/cert/ACL), readiness never passes → pod not-Ready.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: tmp
          emptyDir: {}
