# audit-event-consumer-service Deployment — Faz 24 KVKK audit pipeline (#1249)
#
# Pattern: transcript-service deployment skeleton replicated (port 8098→8099,
# image placeholder + secret/config names excepted). Distroless 65532 + readOnly
# root FS + drop-ALL securityContext (transcript/meeting discipline, NOT the
# audio-gateway uid-1000 custom Dockerfile).
#
# UNLIKE transcript-service this is a PURE Redis-Streams CONSUMER:
# - No CRUD HTTP API (no @RestController) → no api-gateway route, no OpenFGA gate
#   (@RequireModule absent → ERP_OPENFGA_* env intentionally NOT set).
# - server.port 8099 still binds (Spring Boot always serves actuator on the
#   management port; the http port carries the actuator info surface). The work
#   happens off-thread: a Redis Streams XREADGROUP consumer on audit:events.
#
# - image: ghcr.io/OVERLAY_MUST_OVERRIDE/audit-event-consumer-service:OVERLAY_MUST_OVERRIDE
#   fail-closed placeholder. The TEST overlay sets newName + digest.
#   Literal "OVERLAY_MUST_OVERRIDE" leak → gate-enforcement-check.yml CI guard
#   rejects (D30 immutable artifact discipline).
# - replicas: 0 default (base fail-closed); overlay sets 1 (test).
# - App server.port 8099 (SERVER_PORT), management 8081 (Spring Boot Actuator).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-event-consumer-service
  labels:
    app.kubernetes.io/name: audit-event-consumer-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  replicas: 0  # base fail-closed default; overlay sets 1 (test)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: audit-event-consumer-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-event-consumer-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
    spec:
      automountServiceAccountToken: false
      serviceAccountName: audit-event-consumer-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit-event-consumer-service
          # PLACEHOLDER — overlay MUST set via images: + newName + digest.
          # Fail-closed: literal "OVERLAY_MUST_OVERRIDE" leak →
          # gate-enforcement-check.yml CI guard rejects.
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/audit-event-consumer-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            # Spring Boot listens 8099 (application.yml SERVER_PORT:8099).
            - name: http
              containerPort: 8099
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: audit-event-consumer-service-config
            - secretRef:
                name: audit-event-consumer-service-secrets
                optional: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Probe pattern aligned with transcript-service / meeting-service /
          # endpoint-admin-service (Spring Boot Actuator standard
          # liveness/readiness paths + startupProbe gate). startupProbe gives
          # 150s cold-start tolerance so liveness does not race a 50-60s Spring
          # Boot boot.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 5        # 30*5 = 150 sn startup toleransı
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: tmp
          emptyDir: {}
