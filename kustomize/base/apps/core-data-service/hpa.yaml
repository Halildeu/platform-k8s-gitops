# core-data-service HPA — 2026-05-10 (PR-471 base foundation)
# Base default: min=1 (test overlay behavior-neutral; PR #470 replicas=1).
# Prod overlay: HPA patch min=2 override (HA path; mevcut Deploy.replicas=2
# ile behavior-neutral).
# maxReplicas=3 yük artışında otomatik scale.
# Trigger: CPU 70% utilization + Memory 80% utilization.
# PR-471b: metrics-server smoke kanıtı + prod selected domain services
# için min=1 indirme (cost optimization phase).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: core-data-service
  labels:
    app.kubernetes.io/name: core-data-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: core-data-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
