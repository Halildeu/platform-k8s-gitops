# ATS app-boot non-secret env (ATS-0019 39d-3). Secret sınıfı (DB creds,
# ileride AI bearer) ESO ExternalSecret'ten gelir (activation overlay).
# app-boot FAIL-CLOSED: eksik zorunlu değer boot'u düşürür — placeholder'lar
# base'i yanlışlıkla apply etmeye karşı kasıtlı geçersizdir (D18 pattern'i).
apiVersion: v1
kind: ConfigMap
metadata:
  name: ats-interview-evidence-config
data:
  ATS_PORT: "8080"
  # test aktivasyonu bunları gerçek değerlerle patch'ler:
  ATS_JWT_ISSUER: "OVERLAY_MUST_OVERRIDE"
  ATS_JWKS_URI: "OVERLAY_MUST_OVERRIDE"
  ATS_JWT_AUDIENCE: "ats-api"
  # Recruiter karar yetkisi JWT rolünden veya frontend görünürlüğünden
  # türetilmez; aynı bearer kimliği platform'un canonical authz
  # projeksiyonunda yeniden doğrulanır. Bu service origin test/prod namespace
  # içinde aynıdır ve dış internete çıkmaz.
  ATS_AUTHORIZATION_PLATFORM_BASE_URL: "http://api-gateway:8080"
  # Public careers katalog tenant'ı request/header/body'den seçilemez.
  ATS_PUBLIC_TENANT_ID: "OVERLAY_MUST_OVERRIDE"
  ATS_AI_BASE_URL: "OVERLAY_MUST_OVERRIDE"
  # Model-governance boot gate: endpoint and content-addressed approval refs
  # activation overlay'de shipped catalog ile exact bağlanır.
  ATS_AI_ENDPOINT_REF: "OVERLAY_MUST_OVERRIDE"
  ATS_AI_APPROVAL_TRANSCRIBE_REF: "OVERLAY_MUST_OVERRIDE"
  ATS_AI_TIMEOUT: "30s"
  # ingress proxy-body-size ile TEK kontrat (aynı 25 MiB; en düşük limit gerçek limittir)
  ATS_MAX_UPLOAD_BYTES: "26214400"
  # retention default-off (Codex 019f4c6c: sentetik-fixture sınırında kabul;
  # gerçek-veri kapısından önce retention/purge ayrı acceptance)
  ATS_RETENTION_ENABLED: "false"
  # Aday verisi politikası (ats#200) — TEK OTORİTE: hem başvuru formu hem CV import
  # bunu izler. Base'de KASITLI olarak en kısıtlayıcı değerler durur; yalnız test
  # activation overlay'i non-prod beyanıyla gevşetir. Prod overlay bu bloğa
  # dokunmadığı sürece gerçek aday verisi kapalı kalır.
  #
  # app-boot FAIL-CLOSED invariant'ı: mode=real-allowed + environment=prod
  # kombinasyonu boot'u düşürür (machine-enforced; config ile atlatılamaz).
  # Gerçek aday PII'sinin production aktivasyonu Legal/DPO owner gate'indedir.
  ATS_CANDIDATE_DATA_MODE: "synthetic-only"
  ATS_CANDIDATE_DATA_ENVIRONMENT: "prod"
