# Faz 22.5 M1 — endpoint-agent artifact host.
#
# Serves the one-command Windows agent bootstrap artifacts as static files at
#   /artifacts/endpoint-agent/<version>/{bootstrap-package.ps1,EndpointAgent.zip,...}
# Image: ghcr.io/halildeu/platform-agent-artifacts (built+pushed by the
# platform-agent release workflow; nginx + assets baked in). Digest-pinned in
# the overlay (D30). Pulled with the existing ghcr-pull imagePullSecret.
#
# Security/volume model mirrors the live frontend pod (non-root nginx binding
# :80 under readOnlyRootFilesystem + dropped caps — proven in this cluster).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-host
  labels:
    app.kubernetes.io/name: artifact-host
    app.kubernetes.io/component: artifact-host
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: artifact-host
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifact-host
        app.kubernetes.io/component: artifact-host
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: artifact-host
      securityContext:
        runAsNonRoot: true
        runAsUser: 101                # nginx-alpine image's nginx user
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: artifact-host
          image: artifact-host        # kustomize placeholder; overlay pins digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"        # namespace LimitRange min is 32Mi/container
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
      terminationGracePeriodSeconds: 15
