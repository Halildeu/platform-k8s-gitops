# artifact-host pulls a PRIVATE GHCR image (ghcr.io/halildeu/platform-agent-artifacts)
# → ghcr-pull imagePullSecret required (ESO → Vault kv/gitops/ghcr-token).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifact-host
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
