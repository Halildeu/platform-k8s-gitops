# transcript-service Service — Faz 24 Meeting Intelligence (foundation deploy #411)
apiVersion: v1
kind: Service
metadata:
  name: transcript-service
  labels:
    app.kubernetes.io/name: transcript-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: transcript-service
  ports:
    # App listens 8098 → targetPort http (8098); ClusterIP routing tutarlı.
    - name: http
      port: 8098
      targetPort: http
      protocol: TCP
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
