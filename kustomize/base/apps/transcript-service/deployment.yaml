# transcript-service Deployment — Faz 24 Meeting Intelligence (foundation deploy #411)
#
# Pattern: meeting-service deployment skeleton replicated 1:1 (port 8097→8098,
# image placeholder + secret/config names excepted). transcript-service has NO
# mTLS passthrough connector so the 8443 port / mtls secretRef / mtls volume are
# omitted (same as meeting-service).
#
# - image: ghcr.io/OVERLAY_MUST_OVERRIDE/transcript-service:OVERLAY_MUST_OVERRIDE
#   fail-closed placeholder. The TEST overlay sets newName + digest.
#   Literal "OVERLAY_MUST_OVERRIDE" leak → gate-enforcement-check.yml CI guard
#   rejects (D30 immutable artifact discipline).
# - replicas: 0 default (base fail-closed); overlay sets 1 (test).
# - App listens 8098 (SERVER_PORT), management 8081 (Spring Boot Actuator).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcript-service
  labels:
    app.kubernetes.io/name: transcript-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  replicas: 0  # base fail-closed default; overlay sets 1 (test)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: transcript-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: transcript-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
    spec:
      automountServiceAccountToken: false
      serviceAccountName: transcript-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: transcript-service
          # PLACEHOLDER — overlay MUST set via images: + newName + digest.
          # Fail-closed: literal "OVERLAY_MUST_OVERRIDE" leak →
          # gate-enforcement-check.yml CI guard rejects.
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/transcript-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            # Spring Boot listens 8098 (application.yml SERVER_PORT:8098).
            - name: http
              containerPort: 8098
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: transcript-service-config
            - secretRef:
                name: transcript-service-secrets
                optional: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Probe pattern aligned with meeting-service / endpoint-admin-service /
          # auth-service / api-gateway (Spring Boot Actuator standard
          # liveness/readiness paths + startupProbe gate). startupProbe gives
          # 150s cold-start tolerance so liveness does not race a 50-60s Spring
          # Boot boot.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 5        # 30*5 = 150 sn startup toleransı
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: tmp
          emptyDir: {}
