# transcript-service base kustomization — Faz 24 Meeting Intelligence (foundation #411)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# app.kubernetes.io/name selector + Service selector + Deployment pod
# selector aynı label ile eşleşsin (meeting-service / endpoint-admin pattern).
labels:
  - pairs:
      app.kubernetes.io/name: transcript-service
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - serviceaccount.yaml
  # No secret stub: ESO ExternalSecret creates transcript-service-secrets directly
  # (target.creationPolicy: Owner) from overlays/<env>/eso/transcript-service.
