# audit-retention-worker ServiceAccount — Faz 24 (#1250-D). No RBAC: the worker
# talks only to Postgres + MinIO (no Kubernetes API). automountServiceAccountToken
# is false on the pod template. imagePullSecrets ghcr-pull (private GHCR image,
# D26 pattern — consumer/meeting emsali; Codex D post-impl REVISE-1).
#
# NOTE: app.kubernetes.io/part-of is audit-archive (NOT platform) so the worker
# pod escapes the namespace-wide allow-egress-host-bridge; the worker-specific
# allow-egress-audit-retention-worker NetPol is then the SOLE egress allowlist
# (Codex D post-impl REVISE-2). Stamped by the base kustomization label transform.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-retention-worker
  labels:
    app.kubernetes.io/name: audit-retention-worker
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: audit-archive
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull
