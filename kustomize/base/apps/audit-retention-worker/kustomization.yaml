# audit-retention-worker base — Faz 24 KVKK audit-archive 7yr WORM (#1250-D).
#
# A recurring CronJob (NOT the one-shot operator-applied etl-worker model): wired
# into the test overlay (ArgoCD-reconciled, digest-pinned). No service.yaml (no
# HTTP API / no api-gateway route). No secret stub — the ESO ExternalSecret
# (overlays/test/eso/audit-retention-worker) creates audit-retention-worker-secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: audit-retention-worker
    includeSelectors: false
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: true

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - cronjob.yaml
