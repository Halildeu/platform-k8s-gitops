# user-service config — overlays'de namespace-spesifik değerler override edilir
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
data:
  # Host-level bağımlılıklar — Service+Endpoints (D19) üzerinden
  # Spring Boot convention env: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
  # SPRING_DATASOURCE_PASSWORD (username/password Secret'tan gelir)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/users_db"

  # Spring Boot
  SERVER_PORT: "8089"
  # Actuator ayrı port (Spring Boot native): 8081'de yayınlanır, Spring Security
  # filter chain main port'a attached — management port serbest (standart pattern)
  MANAGEMENT_SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"

  # Graceful shutdown — Codex Tur-3 #6
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"

  # PG connection pool — canlı gözlem (follow-up #7)
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"

  # D7 Eureka kapatma (ana repo Eureka temizliği gelene kadar runtime override)
  # Bu env'ler main-stable image'ındaki Eureka client'ı devre dışı bırakır.
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED: "false"

  # Zanzibar runtime (D-003 TRANSFORMED, 2026-04-19 K8s-6 Seviye 1)
  # OpenFgaAuthzConfig direct engine + permission-service /authz/version polling
  # Intra-ns shortname (Codex S1-D5.5 ping-pong Seçenek B uzlaşı, MINIMAL scope)
  PERMISSION_SERVICE_BASE_URL: "http://permission-service:8090"
  ERP_OPENFGA_ENABLED: "true"
  ERP_OPENFGA_API_URL: "http://openfga:8080"

  # Tracing (Tempo için; base'de kapalı, monitoring kurulunca aç)
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"

  # Logging level (prod'da INFO, test'te DEBUG override edilir)
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_ACIK: "INFO"

  # 2026-04-29: authz user-table fix (kullanıcı feedback "/admin/users
  # yetkim bozulmuş", ADMIN drawer modülleri boş).
  # AuthenticatedUserLookupService default `user_service.users` tablosunda
  # admin@example.com id=1201 (farklı seed pattern). Ama OpenFGA tuple'lar
  # public.users ID'leri ile seedli (user:1 admin organization:default)
  # — permission_db.users ile aynı IDs. user-service'in JWT email→id
  # resolution'ı `public.users` (Spring 'users' default) üzerinden olmalı;
  # aksi halde ScopeContext.superAdmin=false → tüm /api/v1/users 403.
  AUTHZ_USER_TABLE: "users"
  # 2026-05-04 Session 37: KC OIDC config — was missing, caused JWT
  # validation to fail in user-service (anonymous SecurityContext on every
  # /api/v1/users/* call → 401 for halil.kocoglu / sezerataasik prod login).
  # Other services (api-gateway, permission-service, variant-service) had
  # these envs in base; user-service was the only outlier. Test cluster uses
  # internal keycloak svc DNS; prod overlay overrides ISSUER to ai.acik.com.
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/serban"
  KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/serban/protocol/openid-connect/certs"

  # 2026-05-12 Session 47 stabilization (Codex 019e1df7 REVISE absorb):
  # ServiceTokenAuthenticationFilter for /api/users/internal/* endpoints
  # uses a SEPARATE Spring property chain (security.service-auth.*).
  # The defaults in application.properties hardcode the unreachable
  # `http://localhost:8081/realms/serban`, breaking the internal
  # service-token contract. Session 47 worked around this by going via
  # public /api/v1/users/{id} + admin JWT forward (PR #160 + #161 + #162),
  # which forced `kcSubject` to be leaked on UserResponse + UserDetailDto.
  #
  # IMPORTANT (Codex 019e1df7 correction): service tokens are minted by
  # auth-service's `ServiceTokenProvider`, signed with the auth-service
  # RSA key and `iss=auth-service` (see `JwtProperties.issuer=auth-service`
  # in auth-service application.properties). They are NOT Keycloak-issued.
  # So the verifier must point to auth-service's JWKS endpoint
  # (`ServiceJwksController`, mounted at `/oauth2/jwks`), NOT the KC
  # realm endpoints. These values are environment-agnostic — same in
  # test and prod (no overlay patch required).
  #
  # Once this lands and the service-token internal endpoint works again,
  # a follow-up platform-backend PR will revert `kcSubject` from both
  # public DTOs and restore the cleaner internal-endpoint contract.
  SERVICE_AUTH_ISSUER: "auth-service"
  SERVICE_AUTH_JWK_SET_URI: "http://auth-service:8088/oauth2/jwks"

  # #734: user-service MINTS a notification-orchestrator-audience service token
  # (client_credentials → auth-service) to POST the admin "new user awaiting
  # activation" email via the internal notify endpoint. CLIENT_SECRET comes from
  # ESO (service_token_client_secret). The token audience/permissions are set
  # per-call in code (getToken("notification-orchestrator", ["notify:intents:system"])).
  SERVICE_TOKEN_MINT_URL: "http://auth-service:8088/oauth2/token"
  SERVICE_TOKEN_CLIENT_ID: "user-service"
  # Admin "awaiting activation" notification (#734). DEFAULT off (prod-safe): the
  # test overlay flips it to "true" (testai activation); prod stays off until its
  # own Vault cred (service_token_client_secret) is seeded + explicitly enabled.
  USER_PENDING_ACTIVATION_NOTIFICATION_ENABLED: "false"
  USER_PENDING_ACTIVATION_NOTIFICATION_BASE_URL: "http://notification-orchestrator:8089"
  USER_PENDING_ACTIVATION_NOTIFICATION_ADMIN_EMAIL: "halil.kocoglu@serban.com.tr"
  USER_PENDING_ACTIVATION_NOTIFICATION_ORG_ID: "platform-system"

  # 2026-05-14 D1.2 reconcile: 3 SECURITY_JWT_* programmatic decoder env'leri
  # inline'dan ConfigMap'e taşındı (D1.1a pattern: intended inline=2 olmak — yalnız
  # SPRING_PROFILES_ACTIVE + JAVA_TOOL_OPTIONS; gerisi envFrom üzerinden).
  # SecurityConfig.java + LocalJwtDecoderConfiguration.java programmatic
  # environment.getProperty() ile bu env'leri okur. ISSUER + JWK_SET_URI
  # overlay-spesifik (D26 fail-closed); AUDIENCE env-agnostic literal.
  SECURITY_JWT_ISSUER: "OVERLAY_MUST_OVERRIDE"
  SECURITY_JWT_JWK_SET_URI: "OVERLAY_MUST_OVERRIDE"
  SECURITY_JWT_AUDIENCE: "account,frontend,user-service"
