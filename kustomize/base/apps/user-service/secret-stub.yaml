# Stub Secret — PoC Dilim 1 için user-service pod'un boot olabilmesi.
# ESO + Vault ClusterSecretStore kurulunca (Faz 3 sonrası) bu dosya
# kustomization'dan çıkarılır ve externalsecret.yaml aktif edilir.
#
# Overlays/local: stub değerler lokal PG ile çalışır
# Overlays/prod, test: ESO bu Secret'ı OVERRIDE eder (aynı isim, Owner policy)
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secrets
  annotations:
    platform.acik.com/stub: "true"       # ESO aktif olunca silinir
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  # Spring Boot convention — envFrom ile auto-map
  SPRING_DATASOURCE_USERNAME: "platform"
  SPRING_DATASOURCE_PASSWORD: "change-me-local-only"
