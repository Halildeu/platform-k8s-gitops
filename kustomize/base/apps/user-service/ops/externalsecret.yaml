# ExternalSecret — user-service (D9 ESO + Vault)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-service-secrets
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: user-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/user-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/user-service
        property: db_password
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: kv/platform/user-service
        property: keycloak_client_secret
    # Zanzibar: permission-service /authz/me çağrısı için internal key
    - secretKey: PERMISSION_SERVICE_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/permission-service
        property: internal_api_key
    # OpenFGA direct engine için Store/Model ID (D-008)
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef:
        key: kv/platform/openfga
        property: store_id
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef:
        key: kv/platform/openfga
        property: model_id
