# user-service — D7 (Eureka yok, K8s DNS), D21 (HPA yok, sabit replica),
# D22 (request dar/limit cömert), D24 (Xmx explicit)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2                      # prod default (D21); test overlay 0'a çekecek
  minReadySeconds: 10              # Codex Tur-3 #6: endpoint propagation için
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
      # D27 upstream Prometheus Operator: annotation YERİNE ServiceMonitor CR
      # (bkz servicemonitor.yaml). Annotation-based scrape kube-prom-stack
      # default'ta dinlenmez.
    spec:
      serviceAccountName: user-service     # D26: ghcr-pull secret için
      # D14: non-root (Dockerfile'dan gelen), pod-level güvenlik de sıkıla
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: user-service
          image: user-service:poc        # overlays'de GHCR tag ile değişir
          imagePullPolicy: IfNotPresent  # local overlay'de Never olacak
          ports:
            - name: http
              containerPort: 8089
              protocol: TCP
            - name: management           # Spring Boot actuator ayrı port (auth'suz)
              containerPort: 8081
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"
          envFrom:
            - configMapRef:
                name: user-service-config
            - secretRef:
                name: user-service-secrets        # ESO tarafından Vault'tan dolar
          resources:
            requests:
              memory: "384Mi"       # D22: request dar
              cpu: "150m"
            limits:
              memory: "768Mi"       # Spring Boot 3 + Flyway + Tomcat ≈ 600 MB (512 OOM)
              cpu: "750m"           # D22: limit cömert, request≠limit
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management       # 8081 (auth'suz actuator port)
            failureThreshold: 60
            periodSeconds: 10        # 60*10 = 600 sn bütçe; ölçülen worst-case boot 243 sn (2026-07-23)
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Graceful shutdown — Codex Tur-3 #6: preStop sleep ile endpoint deregister
          # zamanı kazandır, SIGTERM sonrası Spring graceful shutdown (30s budget)
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Codex Tur-4 önerisi: preStop sleep 5 + Spring graceful shutdown 30s + buffer
      terminationGracePeriodSeconds: 45
