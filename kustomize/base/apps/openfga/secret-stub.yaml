# Stub Secret — OpenFGA envFrom için zorunlu (secretRef hedefi mevcut olmalı).
# Gerçek credential'lar Vault + ESO ile Faz 3 sonrası gelir. Şu an URL içindeki
# parola stub olduğu için DB_PASSWORD ayrı bir değer olarak tutulmuyor.
apiVersion: v1
kind: Secret
metadata:
  name: openfga-secrets
  annotations:
    platform.acik.com/stub: "true"
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  # Advanced: ileride --authn-method=preshared için OPENFGA_AUTHN_PRESHARED_KEYS
  # burada olacak. Şimdilik sadece DB parola placeholder'ı.
  OPENFGA_DATASTORE_PASSWORD: "change-me-local-only"
