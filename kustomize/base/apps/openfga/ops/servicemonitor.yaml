# OpenFGA /metrics HTTP port 8080'de yayınlanır (--metrics-enabled flag).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openfga
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
  endpoints:
    # `http` (8080) is OpenFGA's API port and returns 404 on /metrics. Metrics
    # live on the dedicated 2112 listener — scraping the wrong port kept
    # up{job="openfga"} at 0 and EtikSpeakOpenFgaDown (SEV1) firing forever.
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - platform-prod
      - platform-test
