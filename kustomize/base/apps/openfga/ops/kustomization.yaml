# ops extras for openfga (Faz 17.2.5)
# CRD-gated resources: ServiceMonitor (monitoring.coreos.com)
# Label injection parent runtime kustomization ile simetrik.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: openfga
    includeSelectors: false
    includeTemplates: false
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: false

resources:
  - servicemonitor.yaml
  # Without this the ServiceMonitor above has a target it can never reach:
  # the namespace is default-deny and no policy admitted the monitoring ns.
  - netpol-from-monitoring.yaml
