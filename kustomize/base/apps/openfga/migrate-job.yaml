# OpenFGA schema migration — StatefulSet ayağa kalkmadan önce DB schema'yı
# hazırlar. İlk deploy'da elle tetiklenebilir; ideali Argo CD sync wave -1
# veya init-container, ancak Dilim 3 kapsamında basit Job bırakıldı.
apiVersion: batch/v1
kind: Job
metadata:
  name: openfga-migrate
  annotations:
    # The Job pod template is immutable. Treat migrations as an explicit
    # PreSync hook so a new immutable image pin never attempts an in-place Job
    # patch. TEST may run the idempotent migration during auto-sync; PROD can
    # run it only through the existing human-gated full-sync workflow (hooks
    # are deliberately skipped by selective resource syncs).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: authz
    app.kubernetes.io/part-of: platform
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga
        app.kubernetes.io/component: authz
        app.kubernetes.io/part-of: platform
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: openfga/openfga@sha256:e5891e4676e5a8b4659c010c50aabf487397844b18f66ef7510e5ad00935949f
          imagePullPolicy: IfNotPresent
          args:
            - "migrate"
            - "--datastore-engine=postgres"
            - "--datastore-uri=$(OPENFGA_DATASTORE_URI)"
          envFrom:
            - configMapRef:
                name: openfga-config
            - secretRef:
                name: openfga-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
