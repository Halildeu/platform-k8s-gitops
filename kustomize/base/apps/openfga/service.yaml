apiVersion: v1
kind: Service
metadata:
  name: openfga
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: authz
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openfga
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 8081
      targetPort: grpc
      protocol: TCP
    - name: playground
      port: 3000
      targetPort: playground
      protocol: TCP
    # Prometheus scrape target. Without this the ServiceMonitor cannot reach
    # OpenFGA's metrics endpoint at all (see statefulset.yaml `metrics` port).
    - name: metrics
      port: 2112
      targetPort: metrics
      protocol: TCP
