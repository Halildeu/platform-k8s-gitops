apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: openfga
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: true

resources:
  - statefulset.yaml
  - service.yaml
  - configmap.yaml
  - secret-stub.yaml
  - migrate-job.yaml
