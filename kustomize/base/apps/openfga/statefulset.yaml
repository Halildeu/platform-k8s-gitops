# OpenFGA — authz engine (Zanzibar-style), PoC Faz 5
# StatefulSet tercihi: gelecekte datastore-engine=memory + WAL/snapshot veya
# per-replica cache identity gerekince stable pod ismi kolaylık. Şu an
# datastore=postgres (host PG) olduğu için pratikte Deployment'la farksız,
# ama ileride migration sırası (ordinal) anlamlı olabilir.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openfga
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/component: authz
    app.kubernetes.io/part-of: platform
spec:
  serviceName: openfga
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga
        app.kubernetes.io/component: authz
        app.kubernetes.io/part-of: platform
    spec:
      # Public image (openfga/openfga) — ghcr-pull gerekmiyor, SA default kalır.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openfga
          # Environment overlays own immutable promotion. Keeping the legacy
          # base tag avoids coupling TEST activation to a PROD desired-state change.
          image: openfga/openfga:v1.11.2
          imagePullPolicy: IfNotPresent
          args:
            - "run"
            - "--datastore-engine=postgres"
            - "--datastore-uri=$(OPENFGA_DATASTORE_URI)"
            - "--log-level=info"
            - "--metrics-enabled"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
            - name: playground
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: openfga-config
            - secretRef:
                name: openfga-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 1           # 30*1 = 30 sn başlangıç toleransı
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
