apiVersion: v1
kind: Service
metadata:
  name: budget-service
  labels:
    app.kubernetes.io/name: budget-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  selector:
    app.kubernetes.io/name: budget-service
  ports:
    - name: http
      port: 8101
      # The workload exposes HTTP and management on the same numeric port.
      # Kustomize merges duplicate containerPort entries by port number, so a
      # named target can disappear in the rendered pod and leave EndpointSlice
      # with ports:null. Pin the actual listener port instead.
      targetPort: 8101
      protocol: TCP
