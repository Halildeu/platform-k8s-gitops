apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-service
  labels:
    app.kubernetes.io/name: budget-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  # Environment overlays must opt in explicitly.
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: budget-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: budget-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
    spec:
      automountServiceAccountToken: false
      serviceAccountName: budget-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: budget-service
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/budget-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8101
              protocol: TCP
            - name: management
              containerPort: 8101
              protocol: TCP
          envFrom:
            - configMapRef:
                name: budget-service-config
            - secretRef:
                name: budget-service-secrets
                optional: false
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: tmp
          emptyDir: {}
