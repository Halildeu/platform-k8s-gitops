# frontend HPA — 2026-05-10 (PR-471 base foundation)
# Base default: min=1 (test overlay behavior-neutral; PR #470 replicas=1).
# Prod overlay: HPA patch min=2 override (HA path; mevcut Deploy.replicas=2
# ile behavior-neutral).
# maxReplicas=3 yük artışında otomatik scale.
# Trigger: CPU 70% utilization + Memory 80% utilization.
# PR-471b: metrics-server smoke kanıtı + prod selected domain services
# için min=1 indirme (cost optimization phase).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    # 2026-05-10 (PR #472 / iter-20 absorb): Memory metric KALDIRILDI.
    # Java Spring Boot servisler idle'da bile heap %40+ kullanır;
    # memory target=80%% scale-down'ı bloklar (Codex iter-20 P0).
    # Sadece CPU metric ile HPA cost optimization çalışır; memory
    # right-sizing yapılırsa ileride geri eklenebilir.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
