# Faz 19.MSSQL — ADR-0005 Dual DataSource Reporting
# Workcube MSSQL read-only credentials (Vault kv/platform/mssql-external)
# schema-service introspection lane (Report Builder schema discovery)
#
# Feature flag: SCHEMA_MSSQL_ENABLED=true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schema-service-mssql-secrets
  labels:
    app.kubernetes.io/name: schema-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
    platform.acik.com/feature: mssql-bridge
  annotations:
    platform.acik.com/adr: "0005"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: schema-service-mssql-secrets
    creationPolicy: Owner
  data:
    # Faz 19.MSSQL.D — Spring convention keys (relaxed binding direkt spring.datasource.* property'lerine map)
    # Eski image (binding yok) için bu keys; yeni image binding ile çift parite
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef:
        key: kv/platform/mssql-external
        property: jdbc_url
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/mssql-external
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/mssql-external
        property: password
    # SCHEMA_* prefix (yeni image opsiyonel, dual-binding)
    - secretKey: SCHEMA_MSSQL_USERNAME
      remoteRef:
        key: kv/platform/mssql-external
        property: username
    - secretKey: SCHEMA_MSSQL_PASSWORD
      remoteRef:
        key: kv/platform/mssql-external
        property: password
    - secretKey: SCHEMA_MSSQL_JDBC_URL
      remoteRef:
        key: kv/platform/mssql-external
        property: jdbc_url
