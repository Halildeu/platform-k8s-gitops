# gitops#3594 — IFS ERP Oracle read-only reporting source.
#
# Mirrors externalsecret-mssql.yaml: the connection details live in Vault and
# reach the pod as environment variables, never as repository content. The
# schema-service side stays dormant until SCHEMA_ORACLE_ENABLED is "true", so a
# cluster whose Vault has no oracle-ifs path starts exactly as before.
#
# Vault path: kv/platform/oracle-ifs (jdbc_url / username / password)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: schema-service-oracle-secrets
  labels:
    app.kubernetes.io/name: schema-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
    platform.acik.com/feature: oracle-ifs-bridge
  annotations:
    platform.acik.com/adr: "0005"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: schema-service-oracle-secrets
    creationPolicy: Owner
  data:
    - secretKey: SCHEMA_ORACLE_JDBC_URL
      remoteRef:
        key: kv/platform/oracle-ifs
        property: jdbc_url
    - secretKey: SCHEMA_ORACLE_USERNAME
      remoteRef:
        key: kv/platform/oracle-ifs
        property: username
    - secretKey: SCHEMA_ORACLE_PASSWORD
      remoteRef:
        key: kv/platform/oracle-ifs
        property: password
