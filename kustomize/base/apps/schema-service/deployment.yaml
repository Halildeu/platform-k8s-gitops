# schema-service — D7 (Eureka yok, K8s DNS), D21 (HPA yok, sabit replica),
# D22 (request dar/limit cömert), D24 (Xmx explicit)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-service
  labels:
    app.kubernetes.io/name: schema-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2                      # prod default (D21); test overlay 0'a çekecek
  minReadySeconds: 10              # Codex Tur-3 #6: endpoint propagation için
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
      # D27 upstream Prometheus Operator: annotation YERİNE ServiceMonitor CR
      # (bkz servicemonitor.yaml). Annotation-based scrape kube-prom-stack
      # default'ta dinlenmez.
    spec:
      serviceAccountName: schema-service     # D26: ghcr-pull secret için
      # D14: non-root (Dockerfile'dan gelen), pod-level güvenlik de sıkıla
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schema-service
          image: schema-service:poc        # overlays'de GHCR tag ile değişir
          imagePullPolicy: IfNotPresent  # local overlay'de Never olacak
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
            - name: management           # Spring Boot actuator ayrı port (auth'suz)
              containerPort: 8081
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: JAVA_TOOL_OPTIONS
              # ActiveProcessorCount follows the CPU limit below (1500m → 2): the
              # dictionary reads and relationship discovery run on the warm-up thread
              # while Explorer requests arrive on Tomcat; one JVM-visible CPU serialised
              # them behind the CFS quota (gitops#3635, 2026-09-10).
              # Virtual-thread carriers (gitops#3210 pattern, gitops#3635 evidence): the
              # service runs spring.threads.virtual=true on JDK 21 and the scheduler's
              # carrier count follows ActiveProcessorCount (2). Oracle/MSSQL JDBC read
              # sockets inside synchronized, so every request in a dictionary read pins
              # its carrier; two concurrent requests left no carrier for the actuator's
              # own virtual thread — SIGQUIT dump 11:49:21Z: worker-1 "Carrying virtual
              # thread #52", worker-2 idle, heap 158/242 MB, liveness 42 s, CPU idle.
              value: "-Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=2 -Djdk.virtualThreadScheduler.parallelism=4 -Djdk.virtualThreadScheduler.maxPoolSize=8"
          envFrom:
            - configMapRef:
                name: schema-service-config
            - secretRef:
                name: schema-service-secrets        # ESO Vault → JWT/Auth secrets
            - secretRef:                            # Faz 19.MSSQL — Workcube creds (Spring conv + SCHEMA_*)
                name: schema-service-mssql-secrets  # ESO Vault kv/platform/mssql-external
                optional: true                      # ESO sync gecikse pod start engellenmesin
            - secretRef:                            # gitops#3594 — IFS ERP Oracle creds
                name: schema-service-oracle-secrets # ESO Vault kv/platform/oracle-ifs
                optional: true                      # kaynak kapaliyken secret hic olmayabilir
          resources:
            requests:
              memory: "384Mi"       # D22: request dar
              cpu: "150m"
            limits:
              memory: "768Mi"       # Spring Boot 3 + Flyway + Tomcat ≈ 600 MB (512 OOM)
              # 750m → 1500m (gitops#3635, 2026-09-10): cgroup cpu.stat on the test pod
              # showed 78 s throttled against 72 s used in its first 7 minutes — boot
              # JIT, the 300 s Workcube warm-up and the 52 s IFS warm-up (10,886 views,
              # 205,874 columns) all sit at the old quota, and an Explorer request
              # landing in that window starved the actuator port.
              cpu: "1500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management       # 8081 (auth'suz actuator port)
            failureThreshold: 60
            periodSeconds: 10        # 60*10 = 600 sn bütçe; ölçülen worst-case boot 243 sn (2026-07-23)
            timeoutSeconds: 3
          # Liveness tolerates ~100 s of an unresponsive actuator (6 × 15 s + 10 s).
          # A JVM that is building a catalogue snapshot is busy, not dead: with the old
          # 3 s × 3 budget the kubelet killed the pod twice in five minutes on
          # 2026-09-10 (exit 137 after "Commencing graceful shutdown", memory flat at
          # ~400 Mi) each time a browser request coincided with the start-up warm-up,
          # and every kill restarted the same 6-minute warm-up. Readiness below keeps
          # its tight budget: the pod honestly leaves the Service while it is starved
          # instead of being restarted into the same starvation (gitops#3635).
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Graceful shutdown — Codex Tur-3 #6: preStop sleep ile endpoint deregister
          # zamanı kazandır, SIGTERM sonrası Spring graceful shutdown (30s budget)
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Codex Tur-4 önerisi: preStop sleep 5 + Spring graceful shutdown 30s + buffer
      terminationGracePeriodSeconds: 45
