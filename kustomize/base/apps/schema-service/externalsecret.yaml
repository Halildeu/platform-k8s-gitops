# ExternalSecret — schema-service (D9 ESO + Vault)
# D31: Primary PG + MSSQL secondary (opsiyonel, Workcube ERP schema discovery)
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: schema-service-secrets
  labels:
    app.kubernetes.io/name: schema-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: schema-service-secrets
    creationPolicy: Owner
  data:
    # Primary PG (D31)
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/schema-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/schema-service
        property: db_password
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: kv/platform/schema-service
        property: keycloak_client_secret
    # Secondary MSSQL (workcube_mikrolink schema discovery)
    - secretKey: SCHEMA_MSSQL_USERNAME
      remoteRef:
        key: kv/platform/mssql-external
        property: username
    - secretKey: SCHEMA_MSSQL_PASSWORD
      remoteRef:
        key: kv/platform/mssql-external
        property: password
