apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# app.kubernetes.io/name SELECTOR'A DA gider (Deployment pod selector + Service selector
# aynı label ile eşleşsin). Template'e de eklensin ki pod'lar bu label'ı taşısın.
labels:
  - pairs:
      app.kubernetes.io/name: schema-service
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - pdb.yaml
  - serviceaccount.yaml      # D26: imagePullSecret binding
  - hpa.yaml             # 2026-05-10: HPA min=1 max=3 (CPU 70% / Mem 80%)
