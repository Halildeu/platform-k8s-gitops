# permission-service config — D-003 TRANSFORMED (OpenFGA authz hub, CNS-20260411-001)
# K8s Service port 8090 → targetPort 8084 (container internal) — D-003 kontrat
# PR #502 (platform-ssot dev repo) application-k8s.yml uyumlu
apiVersion: v1
kind: ConfigMap
metadata:
  name: permission-service-config
data:
  # Host-level bağımlılıklar — Service+Endpoints (D19) üzerinden, intra-ns shortname
  # (Codex Tur 2 Minimal scope + S1-D5.5 ping-pong Seçenek B uzlaşı).
  # Pod namespace-local svc DNS'e resolve eder: postgres → postgres.<ns>.svc → Endpoints → 10.9.10.53.
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/permission_db"

  # Faz 21.3 PR-C: secondary datasource for data_access.* schema
  # (V19/V20 in this repo, lineage-locality per ADR-0005).
  # Activation gated on REPORTS_DB_ENABLED. Defaults FAIL-CLOSED at false:
  # the dual-datasource bean graph (ReportsDbDataSourceConfig) only
  # instantiates when this flag is "true". Flip to true during D35
  # staging-sw smoke after PR-D delivers REST contract + Vault credentials
  # populate REPORTS_DB_USERNAME/PASSWORD via ESO (see ops/externalsecret.yaml).
  REPORTS_DB_ENABLED: "false"
  REPORTS_DB_URL: "jdbc:postgresql://postgres:5432/reports_db"
  REPORTS_DB_POOL_MAX: "5"
  REPORTS_DB_POOL_MIN: "1"

  # Spring Boot
  SERVER_PORT: "8084"                 # PR #502: container internal port
  MANAGEMENT_SERVER_PORT: "8081"
  # Runbook RB-zanzibar-canary /actuator/metrics/tuple_sync_outbox_pending
  # için metrics endpoint expose (PR #502 Codex iter2 kararı)
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"

  # Graceful shutdown — Codex Tur-3 #6 (user-service pattern)
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"

  # PG connection pool
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"

  # D7 Eureka kapatma (application-k8s.yml explicit disable + runtime override)
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED: "false"

  # OpenFGA (D-003 authz hub kontrat; PR #502 erp.openfga.* prefix)
  # enabled=true default k8s profile'da (runbook + decision registry gereği)
  # Intra-ns shortname (Codex S1-D5.5 ping-pong Seçenek B)
  ERP_OPENFGA_ENABLED: "true"
  ERP_OPENFGA_API_URL: "http://openfga:8080"
  # Store/Model ID ESO ile Vault'tan gelir (boş stub, runtime override)
  ERP_OPENFGA_STORE_ID: ""
  ERP_OPENFGA_MODEL_ID: ""

  # Permission authz user-lookup (PR #502, intra-ns shortname)
  PERMISSION_AUTHZ_USER_LOOKUP_BASE_URL: "http://user-service:8089"
  PERMISSION_AUTHZ_USER_TABLE: "user_service.users"

  # Source repo k8s profile fallback'i `serban`; overlay'ler issuer'ı token
  # `iss` claim'i ile aynı edge hostname'e çevirir. JWK cluster içi Keycloak'tan okunur.
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/serban"
  KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/serban/protocol/openid-connect/certs"

  # 2026-05-14 D1.3 reconcile: 3 SECURITY_JWT_* programmatic decoder env'leri
  # inline'dan ConfigMap'e taşındı (D1.1a pattern: intended inline=2; gerisi
  # envFrom üzerinden). SecurityConfig.java + LocalJwtDecoderConfiguration.java
  # programmatic environment.getProperty() ile bu env'leri okur. ISSUER +
  # JWK_SET_URI overlay-spesifik (D26 fail-closed); AUDIENCE env-agnostic literal.
  SECURITY_JWT_ISSUER: "OVERLAY_MUST_OVERRIDE"
  SECURITY_JWT_JWK_SET_URI: "OVERLAY_MUST_OVERRIDE"
  SECURITY_JWT_AUDIENCE: "account,frontend,permission-service"

  # Internal API key security (PR #502; secret'ten gelir)
  SECURITY_INTERNAL_API_KEY_ENABLED: "true"
  SECURITY_LEGACY_API_KEY_ENABLED: "false"

  # Tracing (Tempo için; base'de kapalı)
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"

  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_ACIK: "INFO"

  # 2026-04-29: Default admin role + OpenFGA tuple ensure on startup
  # (DefaultAdminRoleAssignmentInitializer). Triggered after D35-3 closure
  # gözleminde admin@example.com için organization:default#admin tuple eksik
  # tespit edildi (kullanıcının kendi browser session'ında 403 toast).
  # Initializer:
  #   1. Listede tüm email'lere DB ADMIN role assign (ensureRoleAssignment)
  #   2. OpenFGA organization:default#admin tuple ensure (writeTuple, idempotent)
  # Bu, runtime drift'e karşı kalıcı koruma: pod restart sonrası admin'ler
  # tekrar seedlenir; admin user'ların 403 hatası ile karşılaşması engellenir.
  PERMISSION_BOOTSTRAP_DEFAULT_ADMIN_ASSIGNMENTS_ENABLED: "true"
  # Admin user listesi — yeni admin eklendikçe bu listeye eklenmeli
  # (D37 D-karar pending: dinamik DB-driven mod tasarımı).
  PERMISSION_BOOTSTRAP_DEFAULT_ADMIN_ASSIGNMENTS_ADMIN_EMAILS: "admin@example.com,d35-admin@example.com"
  # Primary datasource permission_db.users (id, email columns) — initializer
  # email lookup buradan yapar. user_service.users (users_db) farklı datasource'ta.
  PERMISSION_BOOTSTRAP_DEFAULT_ADMIN_ASSIGNMENTS_USER_TABLE: "users"
