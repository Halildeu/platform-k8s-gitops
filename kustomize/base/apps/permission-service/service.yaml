# permission-service — D-003 TRANSFORMED kontrat:
# - Service port 8090 (dış kontrat; compose 8090:8084 mapping ile uyumlu)
# - targetPort 8084 (container internal, PR #502 application-k8s.yml SERVER_PORT)
# - auth-service K8s profile `permission.service.base-url=...svc:8090` eşleşir
apiVersion: v1
kind: Service
metadata:
  name: permission-service
  labels:
    app.kubernetes.io/name: permission-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: permission-service
  ports:
    - name: http
      port: 8090                   # D-003 dış kontrat (caller'lar bu portu çağırır)
      targetPort: http             # container port 8084'e eşlenir
      protocol: TCP
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
