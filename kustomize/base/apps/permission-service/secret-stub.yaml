# Stub Secret — permission-service pod'un ESO öncesi boot olabilmesi.
# ESO + Vault ClusterSecretStore kurulunca (Faz 3 sonrası) bu dosya kustomization'dan
# çıkarılır ve externalsecret.yaml aktif edilir.
apiVersion: v1
kind: Secret
metadata:
  name: permission-service-secrets
  annotations:
    platform.acik.com/stub: "true"       # ESO aktif olunca silinir
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  # Spring Boot convention — envFrom ile auto-map
  SPRING_DATASOURCE_USERNAME: "platform"
  SPRING_DATASOURCE_PASSWORD: "change-me-local-only"
  # D-003 TRANSFORMED hub internal API key (caller servisler bu ile authenticate)
  PERMISSION_SERVICE_INTERNAL_API_KEY: "change-me-local-only"
  # Keycloak confidential client (authz version polling için gerekli ise)
  KEYCLOAK_CLIENT_SECRET: "change-me-local-only"
  # Faz 21.3 PR-C: reports_db credentials stub (local-only).
  # REPORTS_DB_ENABLED=false default → bu değerler okunmaz; ESO pattern
  # tutarlılığı için stub'da da yer alır.
  REPORTS_DB_USERNAME: "stub-not-for-prod"
  REPORTS_DB_PASSWORD: "stub-not-for-prod"
