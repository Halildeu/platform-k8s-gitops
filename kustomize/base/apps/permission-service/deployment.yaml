# permission-service — D-003 TRANSFORMED (authz hub), D7 (Eureka yok, K8s DNS),
# D21 (replica 2 sabit), D22 (request dar/limit cömert), D24 (Xmx explicit)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: permission-service
  labels:
    app.kubernetes.io/name: permission-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2                      # prod default (D21); test overlay 0'a çekecek
  minReadySeconds: 10              # Codex Tur-3 #6: endpoint propagation için
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: permission-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: permission-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: permission-service     # D26: ghcr-pull secret için
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: permission-service
          image: permission-service:poc      # overlays'de GHCR tag ile değişir
          imagePullPolicy: IfNotPresent      # local overlay'de Never olacak
          ports:
            - name: http
              containerPort: 8084            # D-003: container internal port
              protocol: TCP
            - name: management               # Spring Boot actuator (auth'suz)
              containerPort: 8081
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"
          envFrom:
            - configMapRef:
                name: permission-service-config
            - secretRef:
                name: permission-service-secrets   # ESO tarafından Vault'tan dolar
          resources:
            requests:
              memory: "384Mi"       # D22: request dar
              cpu: "150m"
            limits:
              memory: "768Mi"       # Spring Boot 3 + Flyway + Tomcat
              cpu: "750m"           # D22: limit cömert, request≠limit
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management       # 8081 (auth'suz actuator)
            failureThreshold: 60
            periodSeconds: 10        # 60*10 = 600 sn bütçe; ölçülen worst-case boot 243 sn (2026-07-23)
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 45
