# ServiceAccount + imagePullSecret binding (D26 image disiplini, Codex Tur-4)
# ghcr-pull Secret ESO ile Vault'tan çekilir (Faz 3 sonrası).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: permission-service
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-pull          # ESO tarafından oluşturulur (overlays/prod, test)
