# ExternalSecret — permission-service (D9 ESO + Vault)
# Source: docs/handoff-S2-B-artifact-hardening.md (S2-B1 per-service pattern)
# Apply: ESO aktif olunca (S2), secret-stub.yaml kustomization'dan çıkarılır
# ve bu dosya include edilir.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: permission-service-secrets
  labels:
    app.kubernetes.io/name: permission-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: permission-service-secrets
    creationPolicy: Owner
    # Önceki secret-stub ile aynı isim — ExternalSecret bunu OVERRIDE eder
  data:
    # Spring Boot convention env
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/permission-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/permission-service
        property: db_password
    # D-003 TRANSFORMED hub internal API key (caller servisler için)
    - secretKey: PERMISSION_SERVICE_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/permission-service
        property: internal_api_key
    # Keycloak confidential client (PR #502 application-k8s.yml)
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: kv/platform/permission-service
        property: keycloak_client_secret
    # OpenFGA Store + Model ID (D-008 runtime kontratı)
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef:
        key: kv/platform/openfga
        property: store_id
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef:
        key: kv/platform/openfga
        property: model_id
