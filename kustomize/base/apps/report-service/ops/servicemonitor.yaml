# Prometheus Operator ServiceMonitor — D27 upstream pattern (annotation YOK)
# kube-prometheus-stack Prometheus CR serviceMonitorSelectorNilUsesHelmValues=false
# ile cluster-wide tarar; bu CR herhangi ns'de olsa yakalar.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: report-service
  labels:
    release: kube-prometheus-stack   # Prom Operator bu label ile filtreler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: report-service
  endpoints:
    - port: management          # 8081 actuator port (auth'suz)
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - platform-prod
      - platform-test
