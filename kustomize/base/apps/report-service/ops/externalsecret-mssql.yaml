# Faz 19.MSSQL — ADR-0005 Dual DataSource Reporting
# Workcube MSSQL read-only credentials (Vault kv/platform/mssql-external)
# report-service secondary DataSource @Qualifier("mssqlReadOnly")
#
# Prereq:
# - Workcube admin read-only DB user yaratmış olmalı (SELECT on allowlist tables)
# - Vault path: `vault kv put kv/platform/mssql-external username=... password=... jdbc_url=jdbc:sqlserver://workcube-mssql:1433;...`
#
# Feature flag: REPORT_MSSQL_ENABLED=true (report-service configmap)
# Disable path: bu dosya resource listesinden çıkarılır OR feature flag false
#
# NOT: Vault secret yoksa ESO sync fail eder — pre-flight koşul.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: report-service-mssql-secrets
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
    platform.acik.com/feature: mssql-bridge
  annotations:
    platform.acik.com/adr: "0005"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: report-service-mssql-secrets
    creationPolicy: Owner
  data:
    - secretKey: REPORT_MSSQL_USERNAME
      remoteRef:
        key: kv/platform/mssql-external
        property: username
    - secretKey: REPORT_MSSQL_PASSWORD
      remoteRef:
        key: kv/platform/mssql-external
        property: password
    - secretKey: REPORT_MSSQL_JDBC_URL
      remoteRef:
        key: kv/platform/mssql-external
        property: jdbc_url
