# ExternalSecret — report-service (D9 ESO + Vault)
# D31: Primary PG + MSSQL secondary (opsiyonel, feature-flagged)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: report-service-secrets
  labels:
    app.kubernetes.io/name: report-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: report-service-secrets
    creationPolicy: Owner
  data:
    # Primary PG (D31)
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/report-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/report-service
        property: db_password
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: kv/platform/report-service
        property: keycloak_client_secret
    - secretKey: PERMISSION_SERVICE_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/permission-service
        property: internal_api_key
    # D1.5 (2026-05-14) OpenFGA Store + Model ID — inline'dan Secret'a
    # taşındı. Aynı Vault path permission-service ExternalSecret'ında da kullanılıyor
    # (kv/platform/openfga). D-008 runtime kontratı.
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef:
        key: kv/platform/openfga
        property: store_id
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef:
        key: kv/platform/openfga
        property: model_id
    # Secondary MSSQL — 2026-04-19 Codex AR1 WARN: D31 opsiyonel, bu ES zorunlu
    # yapma — aşağıdaki MSSQL keys YORUMLU. REPORT_MSSQL_ENABLED=true feature
    # flag açıldığında ayrı ES CR 'report-service-mssql-secrets' apply edilir
    # (bu dosyanın alt'ına eklenebilir) veya buradaki yorum kaldırılır.
    # Ops iş: kv/platform/mssql-external Vault path yaratılmış olmalı,
    # aksi halde full ES sync fail eder.
    # - secretKey: REPORT_MSSQL_USERNAME
    #   remoteRef:
    #     key: kv/platform/mssql-external
    #     property: username
    # - secretKey: REPORT_MSSQL_PASSWORD
    #   remoteRef:
    #     key: kv/platform/mssql-external
    #     property: password
