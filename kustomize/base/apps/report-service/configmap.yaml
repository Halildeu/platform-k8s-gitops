# report-service config — overlays'de namespace-spesifik değerler override edilir
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-service-config
data:
  # ADR-0005 Dual DataSource Reporting (Faz 19.MSSQL activation)
  # Primary spring.datasource = Workcube MSSQL (read-only live, ERP)
  #   → REPORT_MSSQL_JDBC_URL/USERNAME/PASSWORD ESO secret report-service-mssql-secrets'ten gelir
  #   → application-k8s.yml içinde spring.datasource.url=${REPORT_MSSQL_JDBC_URL:}
  # Secondary report.postgres = platform metadata (custom_reports, alerts, schedules)
  REPORT_PG_URL: "jdbc:postgresql://postgres:5432/reports_db"
  REPORT_MSSQL_ENABLED: "false"   # WorkcubeMssqlConfig (PR #6) feature flag — secondary qualifier opt-in

  # Spring Boot
  SERVER_PORT: "8095"
  # Actuator ayrı port (Spring Boot native): 8081'de yayınlanır, Spring Security
  # filter chain main port'a attached — management port serbest (standart pattern)
  MANAGEMENT_SERVER_PORT: "8081"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"
  # Faz 20 follow-up — Spring Boot health group exclude validation kapatma:
  # application-k8s.yml `management.endpoint.health.group.readiness.exclude: workcubeMssql`
  # MSSQL feature flag-off durumunda contributor yaratılmıyor; validation fail.
  # Spring 2.5+ default validate-group-membership=true → context init fail.
  # Bu config off yapılarak feature-flag mode safe çalışır (bridge decommission sonrası prod
  # report-service crash sebebinin kalıcı fix'i).
  MANAGEMENT_ENDPOINT_HEALTH_VALIDATE_GROUP_MEMBERSHIP: "false"

  # Graceful shutdown — Codex Tur-3 #6
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"

  # PG connection pool — canlı gözlem (follow-up #7)
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"

  # D7 Eureka kapatma (ana repo Eureka temizliği gelene kadar runtime override)
  # Bu env'ler main-stable image'ındaki Eureka client'ı devre dışı bırakır.
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED: "false"

  # Tracing (Tempo için; base'de kapalı, monitoring kurulunca aç)
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"

  # Logging level (prod'da INFO, test'te DEBUG override edilir)
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_ACIK: "INFO"
