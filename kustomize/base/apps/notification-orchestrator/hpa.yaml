# notification-orchestrator HPA (Faz 23.2 PR-C — Codex 019dfae5 Q8 REVISE).
#
# Production baseline (Codex Q8 absorb):
#   - replicas 1-3 (HPA scales 1→3 on CPU)
#   - 70% CPU target (Spring Boot worker thread + DB pool active)
#   - PR-B-foundation: 200/sec sustained throughput target
#   - 10k intent/min target ise Faz 23.3 (geniş scope) load test sonrası
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-orchestrator
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-orchestrator
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
