# notification-orchestrator (Faz 23 — ADR-0013) — DRAFT skeleton.
# replicas:0 default until Faz 23.1 implementation lands (image yet to be built
# in platform-backend repo). D7 (K8s DNS), D21 (no HPA), D22/D24 (resource
# discipline), D27 (upstream-first, no custom operators).
#
# IMPORTANT: This deployment is intentionally NOT functional yet. Image
# placeholder will be replaced when Faz 23.1 Kernel implementation produces
# first GHCR image. services.yaml marks this as `deferred` per env until
# image + cluster deploy completes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-orchestrator
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  # 0 by default — overlay'de Faz 23.1 implementation sonrası 1 (test) / 2 (prod) yapılacak
  replicas: 0
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-orchestrator
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: notification-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-orchestrator
          # Base placeholder — overlay digest pin (D30 immutable) ile override edilir
          image: ghcr.io/halildeu/platform-backend-notification-orchestrator
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8089
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: notification-orchestrator-config
            - secretRef:
                name: notification-orchestrator-secrets
                optional: true  # ESO populates; pod start without secrets uses dev defaults
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: JAVA_OPTS
              value: "-Xmx384m"
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 512Mi
          # PR-Notify-1 GitOps follow-up (2026-05-07; Codex iter-1 absorb):
          # startupProbe added so the JVM warm-up phase (~120 s under
          # constrained CPU scheduling — base request 150m, namespace quota
          # pressure on the test cluster) cannot trip the liveness probe
          # mid-boot. Live evidence (testai.acik.com 2026-05-07): without
          # this probe, `Started NotificationOrchestratorApplication in
          # 121.798 seconds` was followed immediately by liveness-driven
          # shutdown, producing a 5+ restart CrashLoopBackOff that masked
          # the real fix. Effective worst-case kill window is ~215 s
          # (initialDelaySeconds 15 + failureThreshold 40 × periodSeconds 5),
          # generous enough for cold-start while still surfacing a truly
          # stuck JVM within ~3.5 minutes. Once the startupProbe succeeds,
          # liveness/readiness take over with the original cadence (no
          # semantic change to runtime probes).
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 15
            periodSeconds: 10        # 60*10 = 600 sn bütçe; ölçülen worst-case boot 243 sn (2026-07-23)
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
