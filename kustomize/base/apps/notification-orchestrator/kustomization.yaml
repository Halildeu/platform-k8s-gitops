apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# notification-orchestrator (Faz 23 — ADR-0013) — DRAFT skeleton, deployment
# disabled (Faz 23.1 implementation Faz 22.1.1b III review verdict sonrası).
# Image build'i platform-backend repo'da yapılacak (cross-repo); şu an manifest
# skeleton burada lab tier hazırlığı için.

labels:
  - pairs:
      app.kubernetes.io/name: notification-orchestrator
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
      app.kubernetes.io/component: backend
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret-stub.yaml       # PR-C iter-2 (Codex 019dfc6a P0): bootstrap dev secrets;
                           #   PR-D ESO ExternalSecret overlay'de override eder
  - serviceaccount.yaml
  # Faz 23.2 PR-C — production foundation (Codex 019dfae5)
  - servicemonitor.yaml    # kube-prometheus-stack scrape
  - prometheusrule.yaml    # critical + warn alerts
  - hpa.yaml               # 1-3 replicas, 70% CPU target
  - pdb.yaml               # minAvailable=1
