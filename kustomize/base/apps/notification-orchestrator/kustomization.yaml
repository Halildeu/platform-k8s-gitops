apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# notification-orchestrator (Faz 23 — ADR-0013) — DRAFT skeleton, deployment
# disabled (Faz 23.1 implementation Faz 22.1.1b III review verdict sonrası).
# Image build'i platform-backend repo'da yapılacak (cross-repo); şu an manifest
# skeleton burada lab tier hazırlığı için.

labels:
  - pairs:
      app.kubernetes.io/name: notification-orchestrator
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
      app.kubernetes.io/component: backend
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret-stub.yaml
  - serviceaccount.yaml
  - pdb.yaml
