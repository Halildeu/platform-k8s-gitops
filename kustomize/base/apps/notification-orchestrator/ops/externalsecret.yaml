# ExternalSecret — notification-orchestrator (Faz 23.2 PR-D.3 — Codex 019dfc6a P0 absorb).
#
# ESO + Vault: stub Secret (kustomize/base/apps/notification-orchestrator/secret-stub.yaml)
# bootstrap dev sentinel değerleri tutar; ESO ClusterSecretStore vault-platform-gitops
# üzerinden Vault path kv/platform/notify okuyup target Secret'ı (aynı isim, Owner
# policy) override eder.
#
# Vault path layout (PR-D.3):
#   kv/platform/notify
#     db_username           → SPRING_DATASOURCE_USERNAME
#     db_password           → SPRING_DATASOURCE_PASSWORD
#     redaction_pepper      → NOTIFY_REDACTION_PEPPER (HMAC recipient hash)
#     webhook_signing_secret → NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET (active kid)
#     webhook_signing_secret_next → NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET_NEXT (rotation)
#     webhook_active_kid    → NOTIFY_ADAPTERS_WEBHOOK_ACTIVE_KID
#     authz_internal_api_key → NOTIFY_AUTHZ_INTERNAL_API_KEY (permission-service auth)
#
# Ön-koşul: Vault'ta path setup yapılmalı (operatör manuel veya bootstrap script
# — docs/runbooks/RB-faz-23-2-vault-paths.md). ExternalSecret apply sonrası
# Secret synced; pod restart ile Vault değerleri pickup edilir.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-orchestrator-secrets
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: notification-orchestrator-secrets
    creationPolicy: Owner  # stub Secret (bootstrap) → ESO override
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/notify
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/notify
        property: db_password
    - secretKey: NOTIFY_REDACTION_PEPPER
      remoteRef:
        key: kv/platform/notify
        property: redaction_pepper
    - secretKey: NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET
      remoteRef:
        key: kv/platform/notify
        property: webhook_signing_secret
    # PR-A kid-aware HMAC registry (rotation support; webhook_signing_secret_next
    # önce ekle, sonra active_kid bump). Boş kalabilir (Vault'ta yoksa Spring
    # default null tolerant).
    - secretKey: NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET_NEXT
      remoteRef:
        key: kv/platform/notify
        property: webhook_signing_secret_next
    - secretKey: NOTIFY_ADAPTERS_WEBHOOK_ACTIVE_KID
      remoteRef:
        key: kv/platform/notify
        property: webhook_active_kid
    - secretKey: NOTIFY_AUTHZ_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/notify
        property: authz_internal_api_key
