# notification-orchestrator ServiceMonitor (Faz 23.2 PR-C — Codex 019dfc3e Q3 AGREE)
# Prom Operator selector: release=kube-prometheus-stack
# Scrape /actuator/prometheus on management port (8081, auth-free).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notification-orchestrator
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-orchestrator
  endpoints:
    - port: management
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - platform-prod
      - platform-test
