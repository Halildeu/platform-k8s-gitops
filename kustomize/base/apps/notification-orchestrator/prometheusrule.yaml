# notification-orchestrator PrometheusRule (Faz 23.2 PR-C — Codex 019dfae5 Q7).
#
# Critical alerts (page):
#   - service down / readiness probe fail
#   - notify.authz.disabled.state > 0 (security regression)
#   - DLQ rate sustained
#   - DKIM/TLS prod guard fail (validator startup) — manifested as pod restart
#
# Warning alerts (channel/email):
#   - p99 intent processing duration > 30s
#   - dispatch failed rate > 1/min
#   - queue backlog growth (pending intents > 1000 sustained)
#   - retry due growth (retry queue > 500 sustained)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notification-orchestrator
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
    # 2026-05-20 fix: PrometheusOperator ruleSelector matches
    # `release: kube-prometheus-stack` (the kube-prometheus-stack helm
    # release name in this cluster's monitoring namespace). The previous
    # `release: prometheus` label silently failed to match, so this
    # PrometheusRule was never rendered into the operator's
    # `prometheus-kube-prometheus-stack-prometheus-rulefiles-0` ConfigMap
    # and NONE of the notification-orchestrator alerts (NotifyAuthzDisabledRegression,
    # NotifyDlqSustained, NotifyServiceDown, NotifyAbuseStorm, NotifyOrgAccessDeniedStorm,
    # NotifyAuditRetentionStale, ...) were ever evaluated by Prometheus.
    # Live evidence (k3d-test 2026-05-20 04:18 UTC): wget actuator/rules
    # returned 0 of the 6 notification-orchestrator alert names.
    # Fix: align label with operator's ruleSelector matchLabels.
    release: kube-prometheus-stack
spec:
  groups:
    - name: notification-orchestrator-critical
      interval: 30s
      rules:
        - alert: NotifyAuthzDisabledRegression
          expr: notify_authz_disabled_state > 0
          for: 1m
          labels:
            severity: critical
            service: notification-orchestrator
            page: "true"
          annotations:
            summary: "Notify authz disabled (security regression)"
            description: |
              notification-orchestrator pod has notify.authz.enabled=false.
              This is a security regression — notification recipients can
              receive without OpenFGA authz check. Investigate ConfigMap +
              ESO ExternalSecret + ProductionConfigValidator gate.
              Runbook: docs/runbooks/RB-faz-23-2-notify-incident-response.md
            runbook_url: "https://github.com/Halildeu/platform-k8s-gitops/blob/main/docs/runbooks/RB-faz-23-2-notify-incident-response.md"

        - alert: NotifyAuthzBypassed
          expr: rate(notify_authz_disabled_bypass_total[5m]) > 0
          for: 5m
          labels:
            severity: critical
            service: notification-orchestrator
            page: "true"
          annotations:
            summary: "Notify authz bypass observed"
            description: |
              DeliveryEligibilityService skipped authz guard
              ({{ $value | humanize }} bypass/sec). Check
              notify.authz.enabled config + restart recent pods.

        - alert: NotifyDlqSustained
          expr: rate(notify_dlq_terminated_total[15m]) > 5
          for: 15m
          labels:
            severity: critical
            service: notification-orchestrator
            page: "true"
          annotations:
            summary: "Notify DLQ rate sustained (provider degradation)"
            description: |
              {{ $value | humanize }} deliveries/sec moving to DLQ over 15min.
              Check provider config + adapter health + Vault secret rotation.

        - alert: NotifyServiceDown
          expr: up{job="notification-orchestrator",namespace=~"platform-(test|prod)"} == 0
          for: 2m
          labels:
            severity: critical
            service: notification-orchestrator
            page: "true"
            # Faz 23.2.D T1.4 D43 outage fallback labels (Codex 019e0dea iter-3 P2 #4):
            # Alertmanager direct-fallback receiver routing match için stable labels.
            # values-test-d43-drill.yaml ve gelecekteki prod direct-fallback config
            # bu label set'i ile NotifyServiceDown alarmlarını fallback'e yönlendirir.
            # window_ts label DEĞİL annotation'da (fingerprint stability).
            bypass_orchestrator: "true"
            outage_fallback: "true"
          annotations:
            summary: "Notify service down"
            description: |
              notification-orchestrator pod {{ $labels.pod }} in
              {{ $labels.namespace }} is unreachable for 2min. Check pod
              status + readiness probe + ESO secret population.


    - name: notification-orchestrator-warn
      interval: 30s
      rules:
        - alert: NotifyIntentProcessingSlow
          expr: histogram_quantile(0.99, rate(notify_intent_processing_duration_seconds_bucket[5m])) > 30
          for: 10m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify intent processing p99 > 30s"
            description: |
              p99 intent dispatch duration {{ $value | humanizeDuration }}.
              Check provider response times + DB query plan + worker batch
              size config.

        - alert: NotifyDispatchFailureRate
          expr: rate(notify_dispatch_outcome_total{status="FAILED"}[5m]) > 0.0167
          for: 10m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify dispatch FAILED rate > 1/min"
            description: |
              {{ $value | humanize }} permanent failures/sec over 5min.
              Check provider error logs + recipient validity + template lint.

        - alert: NotifyQueueBacklog
          expr: notify_queue_pending_intents > 1000
          for: 15m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify queue backlog > 1000 intents"
            description: |
              {{ $value }} PENDING intents queued for 15min. Worker batch
              size + poll-delay + replica count tuning candidate.

        - alert: NotifyRetryQueueBacklog
          expr: notify_queue_retry_due > 500
          for: 15m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify retry queue > 500 deliveries due"
            description: |
              {{ $value }} RETRY deliveries due. RetryWorker may be
              throttled or provider sustained failure.

        - alert: NotifyDlqUnreplayed
          expr: notify_dlq_unreplayed > 100
          for: 30m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify DLQ unreplayed > 100"
            description: |
              {{ $value }} DLQ rows accumulated. Operator review +
              replayed=true marker after triage.

        # ----- Faz 23.2 T1.6.5 — AbuseGuard storm detection
        # (Codex previous-thread 019e0c28 P2 deferred follow-up;
        #  current-thread 019e42c1 iter-1 REVISE absorb)
        #
        # Counter notify_abuse_blocked_total emits when AbuseGuardService
        # returns HTTP 429 (rate-limit window per (orgId, topicKey) or
        # webhook fan-out cap). Default window=60s, rate=100/window per
        # (org,topic), fan-out cap=10. Critical bypass via severity=critical
        # ONLY — fan-out cap is a HARD safety limit and cannot be bypassed.
        #
        # Aggregation: namespace-sum matches existing storm pattern
        # (NotifyOrgAccessDeniedStorm) so service-wide storms aren't masked
        # by per-pod label distribution. Per-reason inspection happens via
        # the runbook query.
        #
        # Severity choice: warning (NOT critical), no page=true. AbuseGuard
        # is a working-as-designed return path — sustained 429s mean the
        # guard is enforcing the boundary while abuse traffic OR an
        # upstream caller regression is hitting the API. Alertmanager
        # bridge routes critical → P1, warning → P2 (alertmanager-bridge-
        # design.md). Critical/P1 would create false-page burden when one
        # legitimate but noisy automation exceeds rate-limit.
        #
        # Threshold 0.5/sec for 5m: ~150 blocked requests in 5 minutes.
        # Lower (0.1/sec) noises on single noisy caller. Higher (1/sec)
        # misses coordinated low-volume abuse. Effective service limit
        # scales with replica count (in-process ConcurrentHashMap; pod
        # count × per-pod limit). Alert measures blocked-rate, not
        # allowed-rate — independent of replica scaling.
        #
        # No absent() companion: counter only increments on 429. Healthy
        # steady-state may have no series at all (Prometheus doesn't
        # scrape un-incremented counters). An absent() alert would be a
        # permanent false-positive in clean clusters. If a future
        # AbuseGuard always-on gauge (e.g. notify_abuse_guard_initialized)
        # is added, a companion absent() can be split into a follow-up PR.
        - alert: NotifyAbuseStorm
          expr: sum by (namespace) (rate(notify_abuse_blocked_total[5m])) > 0.5
          for: 5m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify abuse-block storm > 0.5/sec"
            description: |
              {{ $value | humanize }} abuse-blocked requests/sec over 5m
              (aggregated by namespace). AbuseGuard is rejecting requests
              with HTTP 429. This usually means abuse traffic or an upstream
              caller regression, while the guard is still enforcing the
              boundary.
              Inspect reason distribution:
              `sum by (namespace, reason) (rate(notify_abuse_blocked_total[5m]))`.
              Fan-out cap hits are higher-priority triage because the cap
              is a hard safety limit and is not bypassed by severity=critical.
              Effective service limit scales with replica count
              (in-process state; pod_count × per-pod limit).
            runbook_url: "https://github.com/Halildeu/platform-k8s-gitops/blob/main/docs/operations/RUNBOOKS/RB-notify-abuse-guard.md"

    # ----- Faz 23.6 PR-5.4/5.5 strict cutover alerts (Step B Codex 019e0892
    # priority 2; iter-1 REVISE absorb thread 019e08fa) -----
    #
    # New strict-mode counters (NotifyOrgAccessGuard + SubscriberIdentityGuard)
    # emit when guards fail-close. In steady state post-cutover, denied counter
    # rate must be 0; non-zero is either an attack or a regression. F3 cutover
    # gate also lives here: source="default" / source="none" must be 0 once
    # NOTIFY_SECURITY_DEFAULT_ORG_ID="" (Faz 23.6 PR-5.4) is the default.
    #
    # Aggregation choice (Codex iter-1 P0): expressions use
    # `sum by (namespace) (rate(...[5m]))` so service-wide storms aren't masked
    # by per-pod / per-reason label distribution. Per-reason inspection happens
    # via the runbook URL or `kubectl exec wget actuator/prometheus | grep
    # <metric>{reason=...}`.
    #
    # Severity choice (Codex iter-1 P1 → iter-2 P0 absorb): only
    # NotifyOrgAccessDeniedStorm is severity=critical (and page=true) —
    # always indicates real abuse or major regression.
    # NotifySubscriberIdentityDeniedStorm is severity=warning with
    # `security_impact: critical` annotation. Reason: alertmanager-bridge.py
    # routes by `severity` only; severity=critical → P1 page regardless of
    # the `page` label. Demoting to warning prevents double-paging when an
    # auth-chain failure fires both alerts simultaneously, while the
    # security_impact annotation preserves dashboard / incident-grouping
    # signal that this is still a security-critical event. Both alerts
    # feed the same incident; runbook treats them as paired indicators
    # of a single auth-chain incident.

    - name: notification-orchestrator-strict-cutover
      interval: 30s
      rules:
        - alert: NotifyOrgAccessDeniedStorm
          expr: sum by (namespace) (rate(notify_org_access_denied_total[5m])) > 0.1
          for: 5m
          labels:
            severity: critical
            service: notification-orchestrator
            page: "true"
          annotations:
            summary: "NotifyOrgAccessGuard fail-close storm > 0.1/sec"
            description: |
              {{ $value | humanize }} org-access denials/sec over 5m
              (aggregated by namespace). Either an active attack
              (caller forging org_id) or a regression in org_id resolve
              chain. Check guard logs + auth-service JWT enrichment +
              inspect denied{reason} tag distribution via
              `notify_org_access_denied_total{reason=...}` per-series query.
              Pair-check: NotifySubscriberIdentityDeniedStorm — if both fire
              at once the root cause is upstream auth-chain failure (filter
              chain not injecting JWT, auth-service down, etc.).
            runbook_url: "https://github.com/Halildeu/platform-k8s-gitops/blob/main/docs/operations/RUNBOOKS/RB-notify-strict-subscriberid-cutover.md"

        - alert: NotifySubscriberIdentityDeniedStorm
          # Codex iter-2 P0 absorb (thread 019e08fa): downgraded from
          # severity=critical to severity=warning. Reason: existing
          # alertmanager-bridge.py routes by `severity` (critical → P1
          # immediate), ignores the `page=true` label. Removing only
          # page=true didn't change actual paging — both alerts still
          # produced two P1 incidents. Demoting this alert to warning
          # + `security_impact: critical` annotation preserves the
          # incident grouping semantics (both visible together) without
          # double-paging when an auth-chain failure fires both at once.
          # If the SubscriberIdentity storm fires *alone* (without the
          # OrgAccess pair), the warning still surfaces in the dashboards
          # and Alertmanager grouping; the upstream impact is real but
          # the immediate response is the same as for the OrgAccess
          # critical (bisect auth chain → guard logs → rollback path).
          expr: sum by (namespace) (rate(notify_subscriber_identity_denied_total[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            security_impact: "critical"
            summary: "SubscriberIdentityGuard fail-close storm > 0.1/sec"
            description: |
              {{ $value | humanize }} subscriber-identity denials/sec over 5m
              (aggregated by namespace). Strict mode reasons: no_auth (filter
              chain not injecting JWT) or non_jwt (anonymous principal hitting
              guarded route). Inspect denied{reason} distribution via
              `notify_subscriber_identity_denied_total{reason=...}` per-series.
              Pair-check: NotifyOrgAccessDeniedStorm — if both fire at once
              the root cause is upstream auth-chain failure (treat as one
              incident; the Org alert paged this one didn't to avoid double
              paging).
            runbook_url: "https://github.com/Halildeu/platform-k8s-gitops/blob/main/docs/operations/RUNBOOKS/RB-notify-strict-subscriberid-cutover.md"

        - alert: NotifyOrgAccessSourceDefaultRegression
          # `increase` over the [10m] window with `for: 10m` — semantic intent:
          # "any non-zero default-source emission for 10 minutes" (Codex
          # 019e08fa iter-1 P2 absorb).
          expr: sum by (namespace) (increase(notify_org_access_match_total{source="default"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "NotifyOrgAccessGuard source=\"default\" fallback re-emit"
            description: |
              {{ $value | humanize }} default-source matches over 10m.
              F3 cutover gate (Faz 23.6 PR-5.4) expects this counter to be 0
              in steady state — non-zero means either the env override
              `NOTIFY_SECURITY_DEFAULT_ORG_ID=""` was reverted, or org_id
              resolve chain regressed and is falling back to the default-org
              fast-path that was supposed to be closed. Inspect the request
              set hitting this branch + audit recent ConfigMap changes +
              restart history.

        - alert: NotifyOrgAccessSourceNoneRegression
          expr: sum by (namespace) (increase(notify_org_access_match_total{source="none"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "NotifyOrgAccessGuard source=\"none\" miss"
            description: |
              {{ $value | humanize }} none-source matches over 10m
              (no claim, no tenant, no allowed_orgs resolved an org id).
              This precedes a fail-close 401/403; if sustained likely a
              multi-tenant onboarding user without org_id claim. Inspect
              upstream auth-service JWT enrichment + Keycloak realm org_id
              mapper config. Runbook: see SubscriberId cutover doc.

        # Per-namespace absent guard. Originally split into Test+Prod
        # alerts (Codex 019e08fa iter-2 P2 absorb), but live verification
        # showed test cluster has no Prometheus/operator at all (k3d-prod
        # is the only monitored cluster; k3d-test pods are not scraped by
        # any Prometheus). The `*Test` alert variant fired permanent
        # false-positive `pending` because the namespace-scoped `absent()`
        # cannot resolve in the prod Prometheus. Removed test variant
        # 2026-05-08 (PR fix/notify-prom-test-ns-absent-removal). Kept the
        # prod-only variant which catches the actual silent-green risk.
        - alert: NotifyStrictCutoverTelemetryAbsent
          expr: absent(up{job=~"notification-orchestrator", namespace="platform-prod"})
          for: 5m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify strict-cutover telemetry absent in platform-prod"
            description: |
              No `up` series for notification-orchestrator job in
              platform-prod for 5m. Strict cutover counter alerts evaluate
              against zero series → silent-green risk. Check ServiceMonitor
              selector + Service endpoints + Prometheus scrape config.

    # ----- Faz 23.7 Step C audit retention alerts (Codex 019e090d iter-1
    # follow-up; activates after PR #427 NOTIFY_AUDIT_RETENTION_ENABLED=true
    # rolls out) -----
    #
    # AuditPartitionRetentionService is `@Scheduled(cron="0 0 2 * * *",
    # zone="UTC")`. These alerts catch:
    # 1. Stale: cron tick hasn't advanced last_success in 26h
    #    (one missed daily tick + 2h grace)
    # 2. Errors: any error counter increment over 1h
    # 3. Telemetry absent: per-namespace, no retention metric series at all
    #    (means @ConditionalOnProperty disabled the bean)
    # 4. Lock skipped sustained: advisory lock contention (multi-pod race)
    #
    # Codex C.2 prereq: these alerts must be live BEFORE flipping
    # NOTIFY_AUDIT_RETENTION_DRY_RUN=false in follow-up PR — without them,
    # a silent failure on the first non-dry-run tick (DETACH/DROP regression)
    # would have no observability.

    - name: notification-orchestrator-audit-retention
      interval: 30s
      rules:
        - alert: NotifyAuditRetentionStale
          # Codex iter-1 P1 absorb (thread 019e0921):
          # 1. `max by(namespace)` instead of `sum by(namespace)`. Prod has
          #    replicas=2 + HPA up to 3; sum on a timestamp gauge double/
          #    triples epoch and breaks `time() - sum` arithmetic. max gives
          #    "most recent successful tick across pods".
          # 2. Age expression (time() - max(...)) on LHS so `$value` is age
          #    in seconds — humanizeDuration renders correctly.
          # 3. `> 0` guard on RHS: excludes "never succeeded" case
          #    (timestamp=0). NeverSucceeded handled by separate alert below.
          # Cron is daily 02:00 UTC; 26h threshold = one missed tick + 2h
          # grace for clock skew / pod restart timing.
          expr: |
            (time() - max by (namespace) (notify_audit_retention_last_success_timestamp_seconds)) > 93600
            and on(namespace)
            max by (namespace) (notify_audit_retention_last_success_timestamp_seconds) > 0
          for: 30m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify audit retention stale (>26h since last successful tick)"
            description: |
              {{ $value | humanizeDuration }} since last successful retention
              cycle in namespace {{ $labels.namespace }}. Cron is daily 02:00
              UTC; 26h threshold = one missed tick + 2h grace. Check pod
              schedule + advisory lock contention + DB connectivity. Triage
              steps in `RB-faz-23-2-notify-vault-paths.md` retention section
              (or extend that runbook in the same PR that flips
              dry-run=false).

        - alert: NotifyAuditRetentionNeverSucceeded
          # Companion to Stale (Codex iter-1 P1.2). NotifyAuditRetentionStale
          # excludes the gauge=0 case via the `> 0` RHS clause; this alert
          # catches it. Threshold 26h means: post-activation, if the bean
          # emits `last_success_timestamp_seconds=0` for a full day plus
          # grace, the cron isn't actually running. Either scheduling-enabled
          # was false, the cron expr was malformed at boot, or the lock
          # acquisition is failing on every tick.
          expr: max by (namespace) (notify_audit_retention_last_success_timestamp_seconds) == 0
          for: 26h
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify audit retention never succeeded (gauge=0 for >26h)"
            description: |
              `last_success_timestamp_seconds` has been 0 for >26h in namespace
              {{ $labels.namespace }}. AuditPartitionRetentionService bean is
              up but no successful tick observed. Check
              `kubectl logs deploy/notification-orchestrator | grep
              AuditPartitionRetentionService` for activation log + tick errors;
              verify `notify.audit.retention-scheduling-enabled=true`; verify
              cron expression parses; verify advisory lock isn't stuck.

        - alert: NotifyAuditRetentionErrors
          # Codex iter-1 P2 absorb: switched from rate(...[1h]) > 0 (fragile,
          # single error may not stay positive for the matching `for` clause)
          # to increase(...[2h]) > 0 with short `for: 30m` — semantic intent:
          # "any error in the last 2h, alert after 30m sustained signal".
          expr: sum by (namespace, phase) (increase(notify_audit_retention_errors_total[2h])) > 0
          for: 30m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify audit retention errors in {{ $labels.phase }}"
            description: |
              {{ $value | humanize }} retention errors in phase
              `{{ $labels.phase }}` over 2h (namespace {{ $labels.namespace }}).
              Phase tags: `partition_create`, `partition_detach`, `partition_drop`,
              `lock_acquire`, `cron_tick`, `unknown`. Investigate via
              `kubectl logs deploy/notification-orchestrator | grep
              AuditPartitionRetentionService`. May indicate DB privilege drift,
              partition lock contention, or schema invariant violation.

        # Removed NotifyAuditRetentionTelemetryAbsentTest (2026-05-08 PR
        # fix/notify-prom-test-ns-absent-removal). Test cluster has no
        # Prometheus/operator → namespace-scoped absent() in prod Prometheus
        # cannot resolve test series → permanent false-positive pending state.
        # Test retention activation observability is currently blackbox
        # (verified by `kubectl logs deploy/notification-orchestrator | grep
        # AuditPartitionRetentionService`). Future fix: federation or test
        # cluster Prometheus deployment, see Faz 23.8 monitoring follow-up.
        - alert: NotifyAuditRetentionTelemetryAbsent
          expr: absent(notify_audit_retention_last_success_timestamp_seconds{namespace="platform-prod"})
          for: 30m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify audit retention telemetry absent in platform-prod"
            description: |
              No `notify_audit_retention_last_success_timestamp_seconds` series
              in platform-prod for 30m. Possible causes (Codex iter-1 P2
              absorb): (1) NOTIFY_AUDIT_RETENTION_ENABLED env reverted to
              false (config drift); (2) ServiceMonitor selector / scrape
              dropped target — pair-check NotifyStrictCutoverTelemetryAbsent;
              (3) extended pod restart cycle (>30m). Inspect ConfigMap
              `notification-orchestrator-config` + `kubectl get pod`
              + `kubectl logs deploy/... | grep
              AuditPartitionRetentionService` for activation message.

        - alert: NotifyAuditRetentionLockSkippedSustained
          # Codex iter-1 P1 → live verification 2026-05-09 02:00 UTC iter-2 absorb:
          # iter-1 form (`increase(...[26h]) > 0`) interpreted as "any skip = missed
          # nightly cycle" but didn't account for multi-pod LEADER-FOLLOWER pattern
          # which legitimately produces 1 skip per non-leader pod per cron tick.
          # With 2 replicas + daily cron, expected baseline = 1 skip/26h on the
          # follower pod. iter-1 form fired permanent false-positive after first
          # cron cycle.
          #
          # Live evidence (post first 02:00 UTC tick on prod):
          #   - Pod m77zh (leader): last_success_timestamp=1.778292E9 (advanced),
          #     lock_skipped=0 — winner of advisory lock, ran cycle.
          #   - Pod pf8sd (follower): last_success_timestamp=0, lock_skipped=1 —
          #     lost lock, skipped (expected).
          #   - cycle log: future_created=0 detached=0 dropped=0 dry_run=true
          #     proves leader DID complete successful tick.
          #
          # iter-2 form: alert only when `lock_skipped > 0` AND no successful
          # tick advanced the gauge in the same window. This catches the real
          # failure mode (lock stuck on a defunct leader, no pod successfully
          # ran the cycle) while ignoring expected multi-pod skips.
          expr: |
            sum by (namespace) (increase(notify_audit_retention_lock_skipped_total[26h])) > 0
            unless on(namespace)
            (
              (
                time() - max by (namespace) (
                  max_over_time(notify_audit_retention_last_success_timestamp_seconds[26h])
                )
              ) < 93600
              and on(namespace)
              max by (namespace) (
                max_over_time(notify_audit_retention_last_success_timestamp_seconds[26h])
              ) > 0
            )
          for: 30m
          labels:
            severity: warning
            service: notification-orchestrator
          annotations:
            summary: "Notify audit retention advisory-lock stuck (no successful tick despite skips)"
            description: |
              {{ $value | humanize }} retention cron tick(s) skipped due to
              advisory-lock contention over 26h (namespace {{ $labels.namespace }})
              AND the leader pod did NOT successfully advance
              `last_success_timestamp_seconds` in the same window. This is the
              real failure mode: lock stuck on a defunct or hung leader. Multi-
              pod expected skip baseline (1 skip/cron-tick per non-leader pod)
              is filtered out by the `unless` clause checking the gauge advance.
              Investigate: leader pod liveness, advisory lock holder
              (`SELECT * FROM pg_locks WHERE locktype='advisory'`), retention
              cycle duration vs cron interval.
