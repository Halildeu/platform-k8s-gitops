# notification-orchestrator configmap (Faz 23 — ADR-0013, PR5 absorb).
# Non-secret config only. Provider credentials Vault/ESO üzerinden secret-stub'a
# inject edilir (Faz 23.1 PR5: SMTP, redaction pepper, webhook signing, slack URL,
# authz internal-api-key — overlay/eso/notify/externalsecret.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-orchestrator-config
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
data:
  SERVER_PORT: "8089"
  MANAGEMENT_SERVER_PORT: "8081"
  # Codex 019dfc6a P0 absorb: cluster-internal short DNS (postgres host bridge
  # Endpoints test/prod overlay'de patch'lenir; URL kendisi namespace-agnostik).
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/notify_db"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "20"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  NOTIFY_DB_SCHEMA: "notify"

  # PR2 dispatch toggle — PR4'te aktif; PR5'te authz/preference guard'lı
  NOTIFY_DISPATCH_ENABLED: "true"
  NOTIFY_INTAKE_MAX_PENDING: "10000"

  # PR4 worker config (Codex 019dfa47 absorb)
  NOTIFY_WORKER_POLL_DELAY_MS: "5000"
  NOTIFY_WORKER_INTENT_BATCH_SIZE: "25"
  NOTIFY_WORKER_RETRY_BATCH_SIZE: "50"
  NOTIFY_WORKER_LEASE_DURATION_MS: "60000"
  NOTIFY_WORKER_SCHEDULING_ENABLED: "true"

  # PR4 retry config (Codex absorb iter-2)
  NOTIFY_RETRY_MAX_ATTEMPTS: "5"
  NOTIFY_RETRY_BACKOFF_INITIAL_MS: "30000"
  NOTIFY_RETRY_BACKOFF_MULTIPLIER: "2.5"
  NOTIFY_RETRY_MAX_BACKOFF_MS: "3600000"
  NOTIFY_RETRY_JITTER_RATIO: "0.25"

  # PR2 audit + idempotency (PR2 contract)
  NOTIFY_AUDIT_RETENTION_DAYS: "90"
  NOTIFY_IDEMPOTENCY_WINDOW_HOURS: "24"
  NOTIFY_DEDUPE_WINDOW_MINUTES: "5"

  # PR5 absorb (Codex 019dfaaa): preference + authz guard activation
  NOTIFY_PREFERENCES_ENABLED: "true"
  NOTIFY_AUTHZ_ENABLED: "true"
  # Permission service URL (Codex 019dfc6a P0 absorb — env name backend
  # contract; cluster-local short DNS namespace-relative; port 8090 D-003
  # external Service contract — was incorrectly 8080 + hardcoded platform-test
  # FQDN, breaking prod overlay).
  NOTIFY_AUTHZ_PERMISSION_SERVICE_URL: "http://permission-service:8090"

  # #734: SERVICE-token decoder for the internal system-submit path
  # (/api/v1/internal/notify/intents). Env-gated — these activate the secondary
  # auth-service JWT decoder so a service token (iss=auth-service,
  # aud=notification-orchestrator, perm=notify:intents:system) can reach the
  # internal endpoint. The user-facing Keycloak decoder is unchanged.
  NOTIFY_INTERNAL_SERVICE_JWT_ISSUER: "auth-service"
  NOTIFY_INTERNAL_SERVICE_JWT_JWK_SET_URI: "http://auth-service:8088/oauth2/jwks"
  NOTIFY_INTERNAL_SERVICE_JWT_AUDIENCE: "notification-orchestrator"

  # SMTP / Slack / Webhook adapter defaults — provider URLs etc. ConfigMap;
  # secrets ESO ExternalSecret üzerinden inject edilir.
  NOTIFY_ADAPTERS_SMTP_HOST: "OVERLAY_MUST_OVERRIDE"
  NOTIFY_ADAPTERS_SMTP_PORT: "587"
  NOTIFY_ADAPTERS_SMTP_FROM_ADDRESS: "noreply@testai.acik.com"
  NOTIFY_ADAPTERS_SMTP_FROM_NAME: "ACIK Platform"

  # Faz 23.3 SMS multi-provider — JetSMS endpoint URL'leri (non-secret;
  # credential'lar ESO externalsecret-notify üzerinden). platform-backend
  # PR #250/#252 JetSmsProvider. Behavior-neutral: değerler backend @Value
  # inline default'larına eşit — GitOps config görünürlüğü için açık yazılır.
  # Provider routing (primary-provider / secondary-provider) PR-4'te BİLİNÇLİ
  # set EDİLMEZ: o flip PR-5 cutover'da, JetSMS-capable image digest bump ile
  # atomik gelir (mevcut cluster image PR #249/#250/#252 öncesi → SmsAdapter
  # 'primary jetsms not registered' FAILED döndürür). PR-4 sonrası backend
  # default primary-provider=netgsm geçerli kalır. Codex thread 019e4022.
  NOTIFY_ADAPTERS_SMS_JETSMS_API_URL: "https://api.jetsms.com.tr/SMS-Web/HttpSmsSend"
  NOTIFY_ADAPTERS_SMS_JETSMS_REPORT_URL: "https://api.jetsms.com.tr/SMS-Web/HttpSmsReport"

  # Outage fallback bypass receiver names (Alertmanager — D43)
  NOTIFY_OUTAGE_FALLBACK_DOCS: "docs/runbooks/RB-notification-outage-fallback.md"

  # Faz 23.8 M7 T4.3.a — Tempo OTLP trace export aktivasyonu.
  # Spring Boot 3 Micrometer Tracing + OpenTelemetry exporter chain;
  # base default %5 sampling (production-safe), test overlay'da %50'ye
  # patch'lenir kanıt toplama için. Tempo backend monitoring/tempo
  # ClusterIP 4318 HTTP endpoint (netpol-notification-tempo.yaml egress).
  MANAGEMENT_TRACING_ENABLED: "true"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.05"
  MANAGEMENT_TRACING_PROPAGATION_TYPE: "w3c"
  # Spring Boot 3 OpenTelemetryProperties.resourceAttributes Map<String,String>
  # binding — her attribute ayrı env (Spring relaxed binding convention):
  MANAGEMENT_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_NAME: "notification-orchestrator"
  MANAGEMENT_OPENTELEMETRY_RESOURCE_ATTRIBUTES_SERVICE_NAMESPACE: "platform"
  # Spring Boot 3.5+ OTLP exporter property path: management.otlp.tracing.*
  # (OTEL_EXPORTER_OTLP_* env'leri OpenTelemetry SDK native; Spring Boot
  # auto-config Spring property'lerini bekler). Tempo HTTP OTLP receiver
  # port 4318 path /v1/traces.
  MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"
  MANAGEMENT_OTLP_TRACING_TRANSPORT: "http"

  # Faz 23.7 M7 T4.2 PR-W4 — Web Push (RFC 8030 + RFC 8292 VAPID).
  # Browser-only WebPush kanalı; FCM/APNS mobile Faz 22.2 dep scope DIŞI.
  # WebPushConfig @ConfigurationProperties("notify.adapters.webpush") binding:
  #   - enabled → NOTIFY_ADAPTERS_WEBPUSH_ENABLED
  #   - publicKey → NOTIFY_ADAPTERS_WEBPUSH_PUBLIC_KEY (ESO ExternalSecret)
  #   - privateKey → NOTIFY_ADAPTERS_WEBPUSH_PRIVATE_KEY (ESO ExternalSecret)
  #   - vapidSubject → NOTIFY_ADAPTERS_WEBPUSH_VAPID_SUBJECT (ESO ExternalSecret)
  #   - requestTimeoutSeconds → NOTIFY_ADAPTERS_WEBPUSH_REQUEST_TIMEOUT_SECONDS
  #   - defaultTtlSeconds → NOTIFY_ADAPTERS_WEBPUSH_DEFAULT_TTL_SECONDS
  #   - paddingMode → NOTIFY_ADAPTERS_WEBPUSH_PADDING_MODE
  #   - maxPlaintextBytes → NOTIFY_ADAPTERS_WEBPUSH_MAX_PLAINTEXT_BYTES
  # Base default disabled (false): VapidKeyService @PostConstruct keys empty
  # ile fail-closed olmasın. Overlay-level enable: test cluster Vault keys
  # seedlendikten sonra `NOTIFY_ADAPTERS_WEBPUSH_ENABLED: "true"` ile aç.
  # Prod cutover ayrı karar (ADR/runbook).
  NOTIFY_ADAPTERS_WEBPUSH_ENABLED: "false"
  NOTIFY_ADAPTERS_WEBPUSH_REQUEST_TIMEOUT_SECONDS: "10"
  NOTIFY_ADAPTERS_WEBPUSH_DEFAULT_TTL_SECONDS: "3600"
  NOTIFY_ADAPTERS_WEBPUSH_PADDING_MODE: "none"
  NOTIFY_ADAPTERS_WEBPUSH_MAX_PLAINTEXT_BYTES: "3072"
