# Stub Secret — notification-orchestrator (Faz 23.2 PR-C iter-2 absorb,
# Codex 019dfc6a P0).
#
# PR #377 added `envFrom secretRef notification-orchestrator-secrets` with
# `optional: true`, so pod boots even without Secret. But "optional" path
# leaves backend services running on dev defaults (postgres/postgres,
# dev-only-pepper, dev-only-key). For test cluster activation pod readiness
# this stub is required so DB credentials and PII redaction config are
# actually populated.
#
# Pattern: auth-service / schema-service ile bire bir.
# - Bootstrap stub: dev sentinel values
# - PR-D ESO setup: test/prod overlay'lerde ExternalSecret aynı isimle
#   override eder (Owner policy)
apiVersion: v1
kind: Secret
metadata:
  name: notification-orchestrator-secrets
  annotations:
    platform.acik.com/stub: "true"
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  # Spring Boot convention — envFrom auto-map
  SPRING_DATASOURCE_USERNAME: "platform"
  SPRING_DATASOURCE_PASSWORD: "change-me-local-only"
  # PR-A redaction pepper (HMAC-SHA256 recipient hash); PR-D ESO Vault overrides
  NOTIFY_REDACTION_PEPPER: "dev-only-pepper-not-for-production"
  # PR-A webhook egress HMAC signing secret
  NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET: "dev-only-secret-not-for-production"
  # PR5 internal authz API key (permission-service /api/v1/internal/authz/check)
  NOTIFY_AUTHZ_INTERNAL_API_KEY: "dev-only-key-not-for-production"
