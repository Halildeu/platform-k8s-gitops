# Stub Secret — PoC bootstrap (Faz 23.2 PR-C — Codex 019dfc6a iter-2 P0 absorb).
# ESO + Vault ClusterSecretStore kurulunca (Faz 23.2 PR-D ESO setup) bu dosya
# kustomization'dan çıkarılır ve overlay-specific externalsecret.yaml aktif edilir.
#
# Pattern auth-service ile bire bir: envFrom secretRef pod boot için zorunlu;
# notification-orchestrator için DB credentials + redaction pepper +
# webhook signing secret + authz internal API key.
#
# Overlays/local: stub değerler lokal PG ile çalışır.
# Overlays/test, prod: ESO bu Secret'ı OVERRIDE eder (aynı isim, Owner policy).
apiVersion: v1
kind: Secret
metadata:
  name: notification-orchestrator-secrets
  annotations:
    platform.acik.com/stub: "true"
    platform.acik.com/source: "bootstrap"
type: Opaque
stringData:
  # Spring Boot convention — envFrom ile auto-map
  SPRING_DATASOURCE_USERNAME: "platform"
  SPRING_DATASOURCE_PASSWORD: "change-me-local-only"
  # PR-A redaction pepper (HMAC-SHA256 recipient hash); PR-D ESO Vault overrides
  NOTIFY_REDACTION_PEPPER: "dev-only-pepper-not-for-production"
  # PR-A webhook egress HMAC signing secret; PR-D ESO Vault overrides
  NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET: "dev-only-secret-not-for-production"
  # PR5 internal authz API key for permission-service /api/v1/internal/authz/check
  NOTIFY_AUTHZ_INTERNAL_API_KEY: "dev-only-key-not-for-production"
