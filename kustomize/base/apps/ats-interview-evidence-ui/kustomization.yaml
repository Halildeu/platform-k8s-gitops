# ats-interview-evidence UI — base.
#
# Bu base doğrudan apply edilmez. Yalnız
# kustomize/overlays/test/activation/ats-interview-evidence üzerinden test
# Argo-root'a alınır (digest-pin + ingress + netpol orada). Prod overlay bu
# base'i referanslamaz. Namespace'i test activation set eder.
#
# Build sanity (apply'sız):
#   kubectl kustomize kustomize/overlays/test/activation/ats-interview-evidence
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
