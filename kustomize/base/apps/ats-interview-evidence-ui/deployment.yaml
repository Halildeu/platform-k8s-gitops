# ats-interview-evidence UI (mfe-interview-evidence) — base.
#
# Mülakat inceleme ekranını sunan statik nginx. Bundle imaja gömülüdür;
# içerik volume'ü YOKTUR (artifact-host ile aynı model). Image OVERLAY pin'ler
# (digest; base'de kasıtlı geçersiz placeholder — D30 immutable artifact).
#
# Bu UI, API'yi kendi nginx'inden proxy'ler (imaj içi ATS_API_UPSTREAM):
# uygulama kendi origin'inde /api/v1/... çağırır, paylaşılan ingress ise ATS
# API'sini /api/ats/v1 altında yayınlar. Proxy burada olduğu için paylaşılan
# /api ad alanına dokunulmaz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-interview-evidence-ui
  labels:
    app: ats-interview-evidence-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: ats-interview-evidence-ui
  template:
    metadata:
      labels:
        app: ats-interview-evidence-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numerik UID: kubelet runAsNonRoot doğrulaması isimli kullanıcıyı
        # çözemez ('non-numeric user' CreateContainerConfigError). İmajdaki
        # 'ats' kullanıcısı 10001'dir.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/halildeu/ats-interview-evidence-ui:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Aynı namespace'teki app-boot servisi. Entrypoint bu değeri
            # doğrular: düz bir http(s) URL değilse veya '/' ile bitiyorsa
            # container fail-closed çıkar (proxy_pass semantiği değişir).
            - name: ATS_API_UPSTREAM
              value: "http://ats-interview-evidence:8080"
          resources:
            requests:
              memory: "32Mi"    # namespace LimitRange min 32Mi/container
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          # /healthz asla proxy'lenmez: API upstream düşse de UI Ready kalır.
          # Kendi hata durumunu gösteren bir ekran, bağımlılığı geciktiği için
          # CrashLoop'a giren bir pod'dan daha kullanışlıdır.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Yazılabilir tek yollar bunlar; nginx config'i entrypoint /tmp'ye
          # render eder, böylece kök dosya sistemi salt-okunur kalabilir.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
      terminationGracePeriodSeconds: 15
