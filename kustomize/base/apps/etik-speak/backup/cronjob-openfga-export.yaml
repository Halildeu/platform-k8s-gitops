apiVersion: batch/v1
kind: CronJob
metadata:
  name: etik-speak-openfga-export
  labels:
    app.kubernetes.io/part-of: etik-speak
    app.kubernetes.io/component: backup
    faz35.backup.type: openfga
spec:
  schedule: "10 3 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: etik-speak
            app.kubernetes.io/component: backup
            faz35.backup.type: openfga
        spec:
          serviceAccountName: etik-speak-backup
          restartPolicy: OnFailure
          # Fetching and encrypting are separate processes on purpose. The token that
          # can read every tuple and the key that decrypts the archive never coexist in
          # one process - and an OpenFGA export IS correlation data: it records which
          # staff subject is attached to which case.
          initContainers:
            - name: openfga-export
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              env:
                - name: FGA_API_URL
                  value: http://openfga-http.platform-test:8080
                - name: FGA_STORE_ID
                  valueFrom:
                    secretKeyRef: {name: etik-speak-backup-openfga, key: store_id}
                - name: FGA_TOKEN
                  valueFrom:
                    secretKeyRef: {name: etik-speak-backup-openfga, key: token}
                # Staging only: the plaintext export lives in this pod's memory-backed
                # scratch volume and never reaches the archive volume unencrypted.
                - name: ARCHIVE_ROOT
                  value: /work
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT_DIR="$ARCHIVE_ROOT/openfga/${TS}"
                  mkdir -p "$OUT_DIR"
                  # Store metadata + full authorization-model + tuple export
                  # (paginated). This gives a point-in-time snapshot suitable
                  # for restore into a new empty store.
                  curl -sf -H "Authorization: Bearer $FGA_TOKEN" \
                    "$FGA_API_URL/stores/$FGA_STORE_ID" > "$OUT_DIR/store.json"
                  curl -sf -H "Authorization: Bearer $FGA_TOKEN" \
                    "$FGA_API_URL/stores/$FGA_STORE_ID/authorization-models?page_size=100" \
                    > "$OUT_DIR/authorization-models.json"
                  # Tuple pages (up to 20 pages × 100 tuples). Runbook covers
                  # increasing this bound when cluster tuple count grows.
                  CONT=""
                  PAGE=0
                  while [ $PAGE -lt 20 ]; do
                    PAGE=$((PAGE+1))
                    if [ -z "$CONT" ]; then
                      BODY='{"page_size":100}'
                    else
                      BODY='{"page_size":100,"continuation_token":"'$CONT'"}'
                    fi
                    RESP=$(curl -sf -H "Authorization: Bearer $FGA_TOKEN" \
                      -H "Content-Type: application/json" -X POST \
                      -d "$BODY" "$FGA_API_URL/stores/$FGA_STORE_ID/read")
                    echo "$RESP" > "$OUT_DIR/tuples-${PAGE}.json"
                    CONT=$(echo "$RESP" | sed -n 's/.*"continuation_token":"\([^"]*\)".*/\1/p')
                    [ -z "$CONT" ] && break
                  done
                  ls -lh "$OUT_DIR"
                  echo "$TS" > "$ARCHIVE_ROOT/stamp"
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits:   {cpu: 200m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile: {type: RuntimeDefault}
          containers:
            # Holds the archive key and nothing else.
            - name: encrypt
              image: postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
              imagePullPolicy: IfNotPresent
              env:
                - name: ARCHIVE_ROOT
                  value: /archive
                - name: ARCHIVE_KEY
                  valueFrom:
                    secretKeyRef: {name: etik-speak-backup-archive-key, key: archive_key}
              command:
                # bash, not sh: dash has no `pipefail`, so a pg_dump or tar that
                # fails mid-pipeline would leave openssl happily encrypting an empty
                # stream and the job reporting success.
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  if [ -z "${ARCHIVE_KEY:-}" ]; then
                    echo "FATAL: ARCHIVE_KEY empty - refusing to write an unencrypted archive" >&2
                    exit 1
                  fi
                  TS=$(cat /work/stamp)
                  OUT="$ARCHIVE_ROOT/openfga/${TS}.tar.gz.enc"
                  mkdir -p "$ARCHIVE_ROOT/openfga"
                  tar -C /work/openfga -cf - "$TS" \
                    | gzip -c \
                    | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:ARCHIVE_KEY \
                    > "$OUT"
                  # A non-empty check is not enough: openssl writes a valid 48-byte
                  # header for an empty input, which is what the first live run produced.
                  SIZE=$(stat -c %s "$OUT")
                  if [ "$SIZE" -lt 512 ]; then
                    echo "FATAL: export archive is $SIZE bytes - below the 512-byte floor" >&2
                    rm -f "$OUT"; exit 1
                  fi
                  head -c 8 "$OUT" | grep -q "Salted__" \
                    || { echo "FATAL: archive is not OpenSSL-encrypted" >&2; rm -f "$OUT"; exit 1; }
                  echo "wrote $OUT"
                  # Housekeeping: keep last 30 daily archives.
                  find "$ARCHIVE_ROOT/openfga" -type f -name '*.tar.gz.enc' -mtime +30 -delete || true
                  # Plaintext export directories from an earlier revision map staff
                  # subjects onto cases. Remove them whatever their age.
                  find "$ARCHIVE_ROOT/openfga" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + || true
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
                - name: archive
                  mountPath: /archive
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits:   {cpu: 200m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 65532
                seccompProfile: {type: RuntimeDefault}
          volumes:
            # Memory-backed: the plaintext never touches a disk that outlives the pod.
            - name: work
              emptyDir: {medium: Memory, sizeLimit: 64Mi}
            - name: archive
              persistentVolumeClaim:
                claimName: etik-speak-backup-archive
