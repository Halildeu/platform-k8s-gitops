apiVersion: v1
kind: Service
metadata:
  name: ethics-service
  labels:
    app.kubernetes.io/name: ethics-service
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ethics-service}
  ports:
    - {name: http, port: 8099, targetPort: http, protocol: TCP}
    # Faz 35 SRE observability — Spring Boot Actuator /actuator/prometheus
    # ServiceMonitor scrape'i için management port'unu Service üzerinden expose.
    # NetworkPolicy (kustomize/overlays/*/activation/etik-speak/netpol.yaml)
    # bu porta yalnız monitoring namespace'ini geçirir; public/staff ingress
    # trafiği bu porta hiç ulaşmaz.
    - {name: management, port: 8081, targetPort: management, protocol: TCP}
