apiVersion: v1
kind: ConfigMap
metadata:
  name: ethics-evidence-worker-config
  labels:
    app.kubernetes.io/name: ethics-evidence-worker
data:
  # Loaded AFTER ethics-service-config in the worker's envFrom list, so these
  # keys override the request-facing values while everything else (database,
  # issuer, tenant, OpenFGA) stays identical. One image, two roles.
  ETHICS_EVIDENCE_PIPELINE_ENABLED: "true"
  # Bounded in-process processor for UTF-8 text, JPEG and PNG. PDF stays
  # fail-closed here by design: it needs the dedicated no-network CDR worker,
  # and accepting it with this processor would be a silent downgrade.
  ETHICS_EVIDENCE_PROCESSOR_MODE: "clamav-reference"
  ETHICS_EVIDENCE_CLAMAV_HOST: "clamav"
  ETHICS_EVIDENCE_CLAMAV_PORT: "3310"
  ETHICS_EVIDENCE_PROCESSOR_TIMEOUT: "20s"
  # A decompression-bomb ceiling: a small file can still declare an enormous
  # canvas, and decoding it is what exhausts the worker.
  ETHICS_EVIDENCE_MAX_IMAGE_PIXELS: "40000000"
  # Pinned scanner identity. The digest is the clamav image actually deployed
  # alongside this worker; the rules version is the definition set baked into
  # that image, because freshclam updates are disabled (no internet egress).
  ETHICS_EVIDENCE_SCANNER_DIGEST: "sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4"
  ETHICS_EVIDENCE_SANITIZER_DIGEST: "sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4"
  ETHICS_EVIDENCE_PARSER_DIGEST: "sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4"
  ETHICS_EVIDENCE_RULES_VERSION: "clamav-1.4.3-bundled"
  ETHICS_EVIDENCE_TRANSFORM_PROFILE: "faz35-baseline-v1"
  ETHICS_EVIDENCE_POLL_DELAY: "5s"
  ETHICS_EVIDENCE_BATCH_SIZE: "10"
  ETHICS_EVIDENCE_LEASE_DURATION: "2m"
  ETHICS_EVIDENCE_RETRY_DELAY: "1m"
  ETHICS_EVIDENCE_MAX_ATTEMPTS: "8"
  # The worker serves no traffic. It still binds a port because it is the same
  # Spring application, but no Service and no Ingress point at it, and its
  # NetworkPolicy admits nothing but the Prometheus scrape.
  SERVER_PORT: "8099"
  MANAGEMENT_SERVER_PORT: "8081"
  # Delivery loops belong to the request-facing deployment, which is the only
  # one holding the notification credential. Inheriting them here made the
  # worker demand a secret it must not have — and would have put two pollers on
  # the same outbox rows. The worker writes audit entries; it does not ship them.
  ETHICS_AUDIT_DELIVERY_ENABLED: "false"
  ETHICS_NOTIFICATION_DELIVERY_ENABLED: "false"
  # Migrations belong to the request-facing deployment. Flyway would take its
  # own lock and converge safely, but running it from two places makes the
  # schema owner ambiguous for no benefit.
  SPRING_FLYWAY_ENABLED: "false"
