apiVersion: apps/v1
kind: Deployment
metadata:
  name: etik-speak-public
  labels:
    app.kubernetes.io/name: etik-speak-public
    app.kubernetes.io/component: public-frontend
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: etik-speak-public}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etik-speak-public
        app.kubernetes.io/component: public-frontend
        app.kubernetes.io/part-of: etik-speak
    spec:
      serviceAccountName: etik-speak-public
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: public
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/etik-speak-public:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 150m, memory: 96Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: cache, emptyDir: {sizeLimit: 32Mi}}
        - {name: run, emptyDir: {sizeLimit: 8Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
      terminationGracePeriodSeconds: 15
