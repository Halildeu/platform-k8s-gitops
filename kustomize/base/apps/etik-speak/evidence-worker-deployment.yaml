apiVersion: v1
kind: ServiceAccount
metadata:
  name: ethics-evidence-worker
  labels:
    app.kubernetes.io/name: ethics-evidence-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ethics-evidence-worker
  labels:
    app.kubernetes.io/name: ethics-evidence-worker
    app.kubernetes.io/component: worker
spec:
  # Overlay-activated, like every other Etik Speak workload.
  replicas: 0
  strategy:
    # The pipeline leases work rows; a second replica mid-rollout would contend
    # for the same lease for no throughput gain in a test cell.
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: ethics-evidence-worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ethics-evidence-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: etik-speak
    spec:
      serviceAccountName: ethics-evidence-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ethics-evidence-worker
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/ethics-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            - {name: management, containerPort: 8081, protocol: TCP}
          envFrom:
            # Order is the mechanism: the worker overrides land last and win.
            - configMapRef: {name: ethics-service-config}
            - configMapRef: {name: ethics-evidence-worker-config}
            - secretRef: {name: ethics-service-secrets, optional: false}
            # Maps the worker's own MinIO identity onto the same variable names,
            # so the process can read quarantine, seal originals and publish
            # derivatives — and cannot read a derivative back.
            - secretRef: {name: ethics-evidence-worker-secrets, optional: false}
          resources:
            requests: {cpu: 75m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
      terminationGracePeriodSeconds: 60
