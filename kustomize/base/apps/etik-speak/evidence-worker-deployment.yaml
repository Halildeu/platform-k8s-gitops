apiVersion: v1
kind: ServiceAccount
metadata:
  name: ethics-evidence-worker
  labels:
    app.kubernetes.io/name: ethics-evidence-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ethics-evidence-worker
  labels:
    app.kubernetes.io/name: ethics-evidence-worker
    app.kubernetes.io/component: worker
spec:
  # Overlay-activated, like every other Etik Speak workload.
  replicas: 0
  strategy:
    # The pipeline leases work rows; a second replica mid-rollout would contend
    # for the same lease for no throughput gain in a test cell.
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: ethics-evidence-worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ethics-evidence-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: etik-speak
    spec:
      serviceAccountName: ethics-evidence-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ethics-evidence-worker
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/ethics-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            - {name: management, containerPort: 8081, protocol: TCP}
          envFrom:
            # Order is the mechanism: the worker overrides land last and win.
            - configMapRef: {name: ethics-service-config}
            - configMapRef: {name: ethics-evidence-worker-config}
            - secretRef: {name: ethics-service-secrets, optional: false}
            # Maps the worker's own MinIO identity onto the same variable names,
            # so the process can read quarantine, seal originals and publish
            # derivatives — and cannot read a derivative back.
            - secretRef: {name: ethics-evidence-worker-secrets, optional: false}
          env:
            # Without an explicit budget the JVM takes 25% of the container
            # limit as heap, which is far below what a contract-maximum
            # attachment needs while it is held in memory.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
          resources:
            # The processor holds the whole attachment in memory and then its
            # sanitized derivative alongside it, so the floor is roughly twice
            # ethics.evidence.max-bytes (25 MiB) plus the Spring baseline. At
            # 512Mi the worker was OOM-killed mid-scan at exactly the size the
            # contract admits: the lease expired, another attempt started, and
            # the attachment livelocked while every pod stayed green.
            requests: {cpu: 75m, memory: 512Mi}
            limits: {cpu: 1000m, memory: 1536Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
      terminationGracePeriodSeconds: 60
