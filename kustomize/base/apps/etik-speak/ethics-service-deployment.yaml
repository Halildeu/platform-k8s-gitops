apiVersion: apps/v1
kind: Deployment
metadata:
  name: ethics-service
  labels:
    app.kubernetes.io/name: ethics-service
    app.kubernetes.io/component: backend
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: ethics-service}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ethics-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: etik-speak
    spec:
      serviceAccountName: ethics-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ethics-service
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/ethics-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8099, protocol: TCP}
            - {name: management, containerPort: 8081, protocol: TCP}
          env:
            # Without a ceiling the JVM sizes itself from its own default heuristics and
            # grows into the container limit until the kernel kills it — 2026-07-28, three
            # OOMKills (exit 137) in ninety minutes, each roughly half an hour apart, which
            # read to the user as "Etik Speak servisine ulaşılamadı". Every sibling Spring
            # Boot service on this platform already carries this line; ethics-service was
            # the one that did not.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"
          envFrom:
            - configMapRef: {name: ethics-service-config}
            - secretRef: {name: ethics-service-secrets, optional: false}
          resources:
            # Matches permission-service, the closest sibling ("Spring Boot 3 + Flyway +
            # Tomcat"). This service carries more than that one does — JPA, the OpenFGA SDK,
            # the MinIO evidence client and two HTTP clients — and was running on half its
            # budget. Heap is pinned to 384m above so the remainder stays available for
            # metaspace, thread stacks and direct buffers rather than being contested.
            #
            # CPU was half the fleet's figure too, and it showed: cpu.stat reported 1186 of
            # 2866 periods throttled (41%, 74s of stall), which is why boot took 88 seconds
            # and the startup probe kept finding a socket that was not listening yet. Every
            # sibling here runs at 750m.
            requests: {cpu: 150m, memory: 384Mi}
            limits: {cpu: 750m, memory: 768Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      terminationGracePeriodSeconds: 30
