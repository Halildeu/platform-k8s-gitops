apiVersion: apps/v1
kind: Deployment
metadata:
  name: ethics-service
  labels:
    app.kubernetes.io/name: ethics-service
    app.kubernetes.io/component: backend
spec:
  replicas: 0
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: ethics-service}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ethics-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: etik-speak
    spec:
      serviceAccountName: ethics-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ethics-service
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/ethics-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8099, protocol: TCP}
            - {name: management, containerPort: 8081, protocol: TCP}
          envFrom:
            - configMapRef: {name: ethics-service-config}
            - secretRef: {name: ethics-service-secrets, optional: false}
          resources:
            requests: {cpu: 75m, memory: 128Mi}
            limits: {cpu: 400m, memory: 384Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      terminationGracePeriodSeconds: 30
