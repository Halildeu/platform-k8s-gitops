apiVersion: v1
kind: ConfigMap
metadata:
  name: ethics-service-config
  labels:
    app.kubernetes.io/name: ethics-service
data:
  SERVER_PORT: "8099"
  # Keep unauthenticated kubelet health endpoints off the public application
  # listener, matching the repository-wide spring-actuator contract.
  MANAGEMENT_SERVER_PORT: "8081"
  ETHICS_DB_URL: "jdbc:postgresql://postgres:5432/ethics"
  ETHICS_DB_SCHEMA: "ethics_service"
  # Same canonical platform-test tenant carried by the authorized staff JWT.
  # A phase-number placeholder here would commit reports to an invisible org.
  ETHICS_PUBLIC_ORG_ID: "00000000-0000-0000-0000-000000000001"
  ETHICS_MAILBOX_SESSION_TTL: "15m"
  ETHICS_SECRET_ITERATIONS: "210000"
  SECURITY_JWT_ISSUER: "https://testai.acik.com/realms/platform-test"
  SECURITY_JWT_JWK_SET_URI: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
  ETHICS_STAFF_AUDIENCE: "ethics-manager"
  ETHICS_STAFF_ROLE: "ethics-manager"
  # Every staff request re-checks current permission-service ETHIC=MANAGE.
  # Dependency failure or a revoked grant is a server-side deny.
  ETHICS_PERMISSION_SERVICE_BASE_URL: "http://permission-service:8090"
  ETHICS_PERMISSION_SERVICE_TIMEOUT: "PT3S"
  ERP_OPENFGA_ENABLED: "true"
  ERP_OPENFGA_API_URL: "http://openfga:8080"
  # Isolated TEST store/model created, semantically read back and exercised by
  # the reviewed provisioner before root activation. These IDs are non-secret.
  ERP_OPENFGA_STORE_ID: "01KXYKEBVTSGEDYJ5GJ0TY67JD"
  ERP_OPENFGA_MODEL_ID: "01KYQ1GX5SB1FBH5GK98A70T00"
  # --- ES-104G evidence custody, request-facing half -----------------------
  # This process admits an upload and streams a finished derivative back to an
  # authorized manager. It deliberately does NOT run the pipeline and does NOT
  # scan: processing lives in ethics-evidence-worker with its own credentials,
  # so a scanner outage or a worker compromise cannot take intake down with it.
  ETHICS_EVIDENCE_ENABLED: "true"
  ETHICS_EVIDENCE_PIPELINE_ENABLED: "false"
  ETHICS_EVIDENCE_PROCESSOR_MODE: "disabled"
  ETHICS_EVIDENCE_MAX_BYTES: "26214400"
  ETHICS_EVIDENCE_UPLOAD_TTL: "10m"
  ETHICS_EVIDENCE_SEALED_RETENTION: "30d"
  # Host-bridged MinIO (kustomize/base/host-services/minio-svc.yaml). AES256 is
  # pinned by the custody contract and the service refuses to start on anything
  # else, so the store must have a KMS — see scripts/faz35/provision-test-evidence-custody.sh.
  ETHICS_EVIDENCE_S3_ENDPOINT: "http://minio:9000"
  ETHICS_EVIDENCE_S3_REGION: "us-east-1"
  ETHICS_EVIDENCE_S3_PATH_STYLE: "true"
  ETHICS_EVIDENCE_S3_SSE: "AES256"
  ETHICS_EVIDENCE_QUARANTINE_BUCKET: "ethics-evidence-quarantine"
  ETHICS_EVIDENCE_SEALED_BUCKET: "ethics-evidence-sealed"
  ETHICS_EVIDENCE_DERIVATIVE_BUCKET: "ethics-evidence-derivative"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  SPRING_FLYWAY_ENABLED: "true"
