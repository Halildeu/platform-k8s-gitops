apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: api-gateway
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - pdb.yaml
  - serviceaccount.yaml      # D26: imagePullSecret binding
  - hpa.yaml             # 2026-05-10: HPA min=1 max=3 (CPU 70% / Mem 80%)
