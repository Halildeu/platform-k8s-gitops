# ops extras for api-gateway (Faz 17.2.5)
# CRD-gated resources: ServiceMonitor (monitoring.coreos.com)
# Label injection parent runtime kustomization ile simetrik.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: api-gateway
    includeSelectors: false
    includeTemplates: false
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: false

resources:
  - servicemonitor.yaml
