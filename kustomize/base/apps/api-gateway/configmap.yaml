# api-gateway route + bağımlılık URL'leri
# PoC Dilim 1'de sadece auth-service route'u. Dilim 2+'de diğer servisler eklenir.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
data:
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "8081"
  # `gateway` endpoint Spring Cloud Gateway Server API dependency gerektirir —
  # mevcut image'da yok, expose listesinde tutmak dead config. Codex Tur-1 #4.
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"

  # Graceful shutdown — Codex Tur-3 #6: pod SIGTERM sonra in-flight request'leri
  # tamamlasın (default "immediate" — hızlı ama istekleri keser).
  SERVER_SHUTDOWN: "graceful"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"

  # PG connection pool — canlı gözlem: PG max_conn 100, compose prod 50 conn +
  # k8s 7×10=70 pool → aşım → CrashLoop. Fix: pool 5/min 2. PG max_conn 200'e
  # artırıldı (compose hotfix runtime ALTER SYSTEM; kalıcı backend/docker-compose.yml
  # patch follow-up #7).
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"

  # D7 Eureka kapatma + K8s native route (ana repo temizliği gelene kadar runtime)
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED: "false"
  SPRING_CLOUD_LOADBALANCER_CACHE_ENABLED: "false"

  # Gateway discovery-based route otomatik kapalı (ReactiveDiscoveryClient bean
  # bulunamazsa auto-config patlar — explicit false ile initial bean arayışı durur)
  SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED: "false"

  # Auto-config'ten Eureka-ilişkili class'ları hariç tut (bean resolution erken)
  SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration,org.springframework.cloud.client.ReactiveCommonsClientAutoConfiguration"

  # Gateway route (application-k8s.yml eksikse env ile override)
  # Path prefix → gerekiyorsa backend native path'ine çevrilir → K8s svc DNS
  SPRING_CLOUD_GATEWAY_ROUTES_0_ID: "auth-service"
  SPRING_CLOUD_GATEWAY_ROUTES_0_URI: "http://auth-service:8088"
  SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: "Path=/auth/**"
  SPRING_CLOUD_GATEWAY_ROUTES_0_FILTERS_0: "StripPrefix=1"

  SPRING_CLOUD_GATEWAY_ROUTES_1_ID: "user-service"
  SPRING_CLOUD_GATEWAY_ROUTES_1_URI: "http://user-service:8089"
  SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0: "Path=/users/**"
  SPRING_CLOUD_GATEWAY_ROUTES_1_FILTERS_0: "StripPrefix=1"

  # Legacy external contract (`/variants/**`) korunur; host-level edge veya eski
  # consumer'lar hâlâ bunu vurabilir.
  SPRING_CLOUD_GATEWAY_ROUTES_2_ID: "variant-service"
  SPRING_CLOUD_GATEWAY_ROUTES_2_URI: "http://variant-service:8091"
  SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0: "Path=/variants/**"
  # Source backend v1 native path'i `/api/v1/variants/**`; dış kontrat `/variants/**`
  # korunur, gateway sadece `/api/v1` prefix'ini ekler.
  SPRING_CLOUD_GATEWAY_ROUTES_2_FILTERS_0: "PrefixPath=/api/v1"

  SPRING_CLOUD_GATEWAY_ROUTES_3_ID: "core-data-service"
  SPRING_CLOUD_GATEWAY_ROUTES_3_URI: "http://core-data-service:8092"
  SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0: "Path=/core/**"
  SPRING_CLOUD_GATEWAY_ROUTES_3_FILTERS_0: "StripPrefix=1"

  SPRING_CLOUD_GATEWAY_ROUTES_4_ID: "report-service"
  SPRING_CLOUD_GATEWAY_ROUTES_4_URI: "http://report-service:8095"
  SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0: "Path=/reports/**"
  SPRING_CLOUD_GATEWAY_ROUTES_4_FILTERS_0: "StripPrefix=1"

  SPRING_CLOUD_GATEWAY_ROUTES_5_ID: "schema-service"
  SPRING_CLOUD_GATEWAY_ROUTES_5_URI: "http://schema-service:8096"
  SPRING_CLOUD_GATEWAY_ROUTES_5_PREDICATES_0: "Path=/schemas/**"
  SPRING_CLOUD_GATEWAY_ROUTES_5_FILTERS_0: "StripPrefix=1"

  # Zanzibar authz hub — permission-service D-003 TRANSFORMED (Seviye 1 deploy)
  # Codex PR #1 iter-9 drift tespit: CHANGELOG "/api/v1/authz/** eklendi" diyor
  # ama configmap'te yoktu — dev repo'da var, K8s overlay'de eksikti. Fix edildi.
  # NOT: StripPrefix YOK (permission-service native endpoint: /api/v1/authz/*).
  SPRING_CLOUD_GATEWAY_ROUTES_6_ID: "permission-service"
  SPRING_CLOUD_GATEWAY_ROUTES_6_URI: "http://permission-service:8090"
  SPRING_CLOUD_GATEWAY_ROUTES_6_PREDICATES_0: "Path=/api/v1/authz/**"
  # StripPrefix yok — native route preserved

  # Theme contract — source repo public/native v1 surface. theme-registry public,
  # diğer theme uçları authenticated; path zaten backend native kontratı olduğu için
  # filter uygulanmaz.
  SPRING_CLOUD_GATEWAY_ROUTES_7_ID: "variant-service-v1-theme-route"
  SPRING_CLOUD_GATEWAY_ROUTES_7_URI: "http://variant-service:8091"
  SPRING_CLOUD_GATEWAY_ROUTES_7_PREDICATES_0: "Path=/api/v1/themes/**,/api/v1/me/theme/**,/api/v1/theme-registry/**"

  # Source repo public v1 variant contract — web shell `@mfe/shared-http`
  # baseURL=`/api` + `/v1/variants`. External edge/ingress `/api` prefix'ini
  # korur; burada ek PrefixPath YOK.
  SPRING_CLOUD_GATEWAY_ROUTES_8_ID: "variant-service-v1-public-route"
  SPRING_CLOUD_GATEWAY_ROUTES_8_URI: "http://variant-service:8091"
  SPRING_CLOUD_GATEWAY_ROUTES_8_PREDICATES_0: "Path=/api/v1/variants/**"

  # Faz 19.MSSQL.M (2026-04-25) — v1 public routes (frontend canonical paths)
  # Test cluster e2e simülasyon ile bulunan eksik route'lar:
  # - report/dashboard frontend `/api/v1/{reports,dashboards}` çağırır
  # - schema-explorer frontend `/api/v1/schema/...` çağırır
  # - mfe-users `/api/v1/users` + mfe-access `/api/v1/permissions` çağırır
  # - mfe-audit `/api/audit/events` çağırır (v1 prefix YOK, controller @RequestMapping("/api/audit/events"))
  # NOT: StripPrefix YOK — controller'lar /api/v1/<svc> tam path bekliyor.
  SPRING_CLOUD_GATEWAY_ROUTES_9_ID: "report-service-v1-public-route"
  SPRING_CLOUD_GATEWAY_ROUTES_9_URI: "http://report-service:8095"
  SPRING_CLOUD_GATEWAY_ROUTES_9_PREDICATES_0: "Path=/api/v1/reports/**"

  SPRING_CLOUD_GATEWAY_ROUTES_10_ID: "dashboard-service-v1-public-route"
  SPRING_CLOUD_GATEWAY_ROUTES_10_URI: "http://report-service:8095"
  SPRING_CLOUD_GATEWAY_ROUTES_10_PREDICATES_0: "Path=/api/v1/dashboards/**"

  SPRING_CLOUD_GATEWAY_ROUTES_11_ID: "schema-service-v1-public-route"
  SPRING_CLOUD_GATEWAY_ROUTES_11_URI: "http://schema-service:8096"
  SPRING_CLOUD_GATEWAY_ROUTES_11_PREDICATES_0: "Path=/api/v1/schema/**"

  SPRING_CLOUD_GATEWAY_ROUTES_12_ID: "user-service-v1-public-route"
  SPRING_CLOUD_GATEWAY_ROUTES_12_URI: "http://user-service:8089"
  SPRING_CLOUD_GATEWAY_ROUTES_12_PREDICATES_0: "Path=/api/v1/users/**"

  SPRING_CLOUD_GATEWAY_ROUTES_13_ID: "permission-service-v1-permissions-route"
  SPRING_CLOUD_GATEWAY_ROUTES_13_URI: "http://permission-service:8090"
  SPRING_CLOUD_GATEWAY_ROUTES_13_PREDICATES_0: "Path=/api/v1/permissions/**"

  # Faz 19.MSSQL.P (2026-04-25) — audit/events split:
  # - /api/audit/events (exact GET list) → user-service (UserAuditEvent mirror, basic shape)
  # - /api/audit/events/** (sub-paths /live SSE + /export + /export-jobs/*) → permission-service
  # Sebep: user-service AuditEventController sadece root @GetMapping; /live SSE + /export + /export-jobs
  # permission-service AuditEventController + AuditEventStream'de impl. ROUTES_14 öncesinde /api/audit/events/**
  # user-service'e rotalanıyordu → /live = 404. Split sonrası mfe-audit hem list hem live stream alır.
  SPRING_CLOUD_GATEWAY_ROUTES_14_ID: "user-service-audit-events-route"
  SPRING_CLOUD_GATEWAY_ROUTES_14_URI: "http://user-service:8089"
  SPRING_CLOUD_GATEWAY_ROUTES_14_PREDICATES_0: "Path=/api/audit/events"

  SPRING_CLOUD_GATEWAY_ROUTES_15_ID: "permission-service-audit-events-subpaths-route"
  SPRING_CLOUD_GATEWAY_ROUTES_15_URI: "http://permission-service:8090"
  SPRING_CLOUD_GATEWAY_ROUTES_15_PREDICATES_0: "Path=/api/audit/events/**"

  # Faz 19.MSSQL.Q (2026-04-25) — /api/v1/roles route eksikti:
  # mfe-access (RoleDrawer + roles.api.ts) + mfe-users (UserDetailDrawer) çağrıları:
  #   GET    /api/v1/roles                         → list roles
  #   GET    /api/v1/roles/{id}                    → role detail
  #   POST   /api/v1/roles                         → create role
  #   PUT    /api/v1/roles/{id}                    → update role
  #   DELETE /api/v1/roles/{id}                    → delete role
  #   POST   /api/v1/roles/{id}/clone              → clone
  #   PUT    /api/v1/roles/{id}/permissions        → set permissions
  #   PATCH  /api/v1/roles/{id}/permissions/bulk   → bulk add/remove
  #   PUT    /api/v1/roles/{id}/granules           → granule update
  #   GET    /api/v1/roles/{id}/members            → list members
  #   POST   /api/v1/roles/{id}/members            → add members
  #   DELETE /api/v1/roles/{id}/members/{userId}   → remove member
  #   GET    /api/v1/roles/users/{id}/scopes       → list user scopes (AccessControllerV1)
  #   POST   /api/v1/roles/users/{id}/scopes       → add user scope
  #   DELETE /api/v1/roles/users/{id}/scopes/{type}/{ref} → remove scope
  # Backend: permission-service AccessControllerV1 @RequestMapping("/api/v1/roles")
  # NOT: StripPrefix YOK (controller path tam eşler).
  SPRING_CLOUD_GATEWAY_ROUTES_16_ID: "permission-service-v1-roles-route"
  SPRING_CLOUD_GATEWAY_ROUTES_16_URI: "http://permission-service:8090"
  SPRING_CLOUD_GATEWAY_ROUTES_16_PREDICATES_0: "Path=/api/v1/roles/**"

  # D7: Eureka yok → K8s svc DNS
  AUTH_SERVICE_URL: "http://auth-service:8088"
  # Dilim 2+:
  # USER_SERVICE_URL: "http://user-service:8089"
  # CORE_DATA_URL: "http://core-data-service:8092"
  # VARIANT_URL: "http://variant-service:8091"
  # REPORT_URL: "http://report-service:8095"
  # SCHEMA_URL: "http://schema-service:8096"

  # Keycloak (host-level, ExternalName Service üzerinden)
  KEYCLOAK_URL: "http://keycloak:8080"
  # Source repo k8s profile fallback'i `serban`; GitOps tarafında explicit baz
  # değeri bırakıyoruz ama overlay'ler issuer'ı token `iss` claim'i ile aynı
  # edge hostname'e çevirir. JWK ise cluster içi Keycloak üzerinden okunur.
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/serban"
  KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/serban/protocol/openid-connect/certs"

  # Spring Cloud Gateway — PoC Dilim 1 için minimum route (application-k8s.yml
  # içinde tanımlı olabilir, burası sadece URL override eder)

  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY: "INFO"

  # Tracing (Tempo)
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
