apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: platform
spec:
  replicas: 2
  # Pod Ready olduktan sonra 10 sn bekle — ingress/service endpoint cache stale olmasın.
  # Codex Tur-3 #6: rolling restart sırasında 30 sn 502 sistemik riskini azaltır.
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: platform
      # D27: ServiceMonitor CR kullanılır, annotation YOK.
    spec:
      serviceAccountName: api-gateway     # D26: ghcr-pull secret için
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api-gateway
          image: api-gateway:poc
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: JAVA_TOOL_OPTIONS
              # Gateway biraz daha heap (route cache + reactive pool)
              value: "-Xmx512m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1 -Djdk.virtualThreadScheduler.parallelism=4 -Djdk.virtualThreadScheduler.maxPoolSize=8"
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"           # D22: gateway trafiği yoğun, request biraz yüksek
            limits:
              memory: "768Mi"
              cpu: "1000m"          # D22: limit cömert
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 60
            periodSeconds: 10        # 60*10 = 600 sn bütçe; ölçülen worst-case boot 243 sn (2026-07-23)
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Graceful shutdown: pod Service endpoint'ten düşsün, in-flight
          # request'ler tamamlansın, sonra SIGTERM ile Spring graceful shutdown tetiklensin.
          # Codex Tur-3 #6: ingress-nginx endpoint propagation gecikmesi için.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Codex Tur-4 önerisi: preStop sleep 5 + Spring graceful shutdown 30s budget
      # + buffer — K8s grace süresi preStop ile başlar, Spring'e ~25s kalırdı.
      terminationGracePeriodSeconds: 45
