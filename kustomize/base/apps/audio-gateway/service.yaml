# audio-gateway-service Service — Faz 24
apiVersion: v1
kind: Service
metadata:
  name: audio-gateway
  labels:
    app.kubernetes.io/name: audio-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: audio-gateway
  ports:
    # Dış trafik (ingress) http:8210'da kalır; management yalnız probe +
    # in-cluster actuator erişimi (#558)
    - name: http
      port: 8210
      targetPort: http
      protocol: TCP
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
