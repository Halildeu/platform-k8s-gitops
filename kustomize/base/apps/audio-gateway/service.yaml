# audio-gateway-service Service — Faz 24
apiVersion: v1
kind: Service
metadata:
  name: audio-gateway
  labels:
    app.kubernetes.io/name: audio-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: audio-gateway
  ports:
    # WebFlux + actuator tek port (8210)
    - name: http
      port: 8210
      targetPort: http
      protocol: TCP
