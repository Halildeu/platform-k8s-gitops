# endpoint-admin-service base kustomization — Faz 22 (sprint PR-9)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# app.kubernetes.io/name selector + Service selector + Deployment pod
# selector aynı label ile eşleşsin
labels:
  - pairs:
      app.kubernetes.io/name: endpoint-admin-service
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - serviceaccount.yaml
  # secret-stub.yaml KALDIRILDI Faz 22.1.1b onboard 2026-05-05:
  # ESO ExternalSecret direkt Secret oluşturuyor (target.creationPolicy: Owner).
  # Stub yerine overlay-specific ExternalSecret kullanılır (Vault path
  # kv/platform/endpoint-admin-service/* — D6 host-compose vault).
