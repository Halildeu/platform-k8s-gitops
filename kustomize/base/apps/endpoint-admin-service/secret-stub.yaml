# endpoint-admin-service Secret STUB — Faz 22 (sprint PR-9 + PR-8b)
#
# Codex 019de00f öneri: "ExternalSecret placeholder ve ConfigMap
# OVERLAY_MUST_OVERRIDE pattern'i kullan."
#
# Bu stub Secret yerini tutar; overlay-specific ExternalSecret
# (kustomize/overlays/{test,prod}/eso/externalsecret-endpoint-admin.yaml)
# Vault'tan kv/platform/endpoint-admin/* path'inden doldurur.
#
# Stub değer "OVERLAY_MUST_OVERRIDE" placeholder-leak-check.yaml CI guard
# tarafından runtime sızıntı kontrol edilir.
#
# PR-8b düzeltme (user 2026-05-02): code signing private key Vault/ESO
# runtime secret olarak taşınMAZ. Bu supply-chain root-of-trust; build-time
# CI pipeline (`platform-agent` repo + `platform-backend/endpoint-admin-service/`
# CI workflow) tarafında imza yapılır, runtime'da sadece public key ile
# cosign verify çalışır (ConfigMap COSIGN_KEY_REF — ayrı public ref).
# Bu yüzden COSIGN_KEY_PEM field'ı bu Secret'tan KALDIRILDI.
#
# 22.2'den itibaren scope (acik.local only): Entra/M365 secrets future,
# 22.3+ scope. Ad-hoc 22.1 lab tier yalnız OIDC + audit DSN + AD bind.
apiVersion: v1
kind: Secret
metadata:
  name: endpoint-admin-service-secrets
  labels:
    app.kubernetes.io/name: endpoint-admin-service
type: Opaque
stringData:
  # OIDC client secret (Keycloak — prod=serban realm, test=platform-test)
  ADMIN_AUTH_CLIENT_SECRET: "OVERLAY_MUST_OVERRIDE"

  # Audit log backend connection string (DD-EA-6 immutable storage)
  AUDIT_LOG_DSN: "OVERLAY_MUST_OVERRIDE"

  # AD bind credentials (Faz 22.2 acik.local pilot scope)
  # 22.1 lab ortamında kullanılmaz; 22.2'den itibaren aktif
  AD_BIND_DN: "OVERLAY_MUST_OVERRIDE"
  AD_BIND_PASSWORD: "OVERLAY_MUST_OVERRIDE"

  # Entra/M365 — Faz 22.3+ scope (BOREAS/CESS hibrit gerektirir)
  # 22.1 + 22.2 acik.local-only scope'da bu credentials kullanılmaz;
  # placeholder olarak korunur, DD-EA-5 Vault path allowlist'e dahil
  ENTRA_CLIENT_ID: "OVERLAY_MUST_OVERRIDE"
  ENTRA_CLIENT_SECRET: "OVERLAY_MUST_OVERRIDE"

  # Internal API key (gateway → endpoint-admin REST)
  INTERNAL_API_KEY: "OVERLAY_MUST_OVERRIDE"

  # Agent enrollment secret (platform-agent registration token)
  AGENT_ENROLLMENT_SECRET: "OVERLAY_MUST_OVERRIDE"
