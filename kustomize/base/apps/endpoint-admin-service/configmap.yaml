# endpoint-admin-service ConfigMap — Faz 22.1.1b live-aligned (2026-05-05)
#
# Live cluster (k3d-test platform-test) ConfigMap reverse-engineered into
# gitops base. Önceki charter skeleton (18 key, OVERLAY_MUST_OVERRIDE pattern)
# uygulamayla uyumsuzdu — bu revision live-aligned 35 key uygulama-spesifik
# config kontratı.
#
# Codex 019df86f drift dürüstlüğü mandate (PR #366 sonrası onboard sprint):
# live state authoritative, gitops manifest live'a hizalanır.
#
# Env-specific override: KEYCLOAK_ISSUER_URI + KEYCLOAK_JWKS_URI +
# SECURITY_JWT_AUDIENCE prod overlay tarafında (test base default'ları kabul,
# prod realm 'serban' için overlay patch).

apiVersion: v1
kind: ConfigMap
metadata:
  name: endpoint-admin-service-config
  labels:
    app.kubernetes.io/name: endpoint-admin-service
data:
  # Listen ports (uygulama Spring Boot default 8096)
  SERVER_PORT: "8096"
  SERVER_SHUTDOWN: "graceful"
  MANAGEMENT_SERVER_PORT: "8081"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"

  # Datasource (host-compose Postgres test cluster — D6 stateful contract)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/endpoint_admin"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
  DB_POOL_MAX: "5"

  # JPA / Flyway — BE-016 (Codex 019e4fbc plan-time consult). Flyway owns
  # schema evolution: V4 effective-state is baselined into the Flyway history
  # (application.yml baseline-version=4) and V5+ migrations are Flyway-applied.
  # baseline-on-migrate baselines an existing ddl-auto-built endpoint_admin
  # schema at V4 (one history row: version=4 type=BASELINE); V1-V4 are NOT
  # re-run against a populated schema.
  # ddl-auto=validate — Hibernate verifies the live schema matches the entity
  # mappings on startup but never mutates it; Flyway is the sole schema
  # authority. This is the ownership-hardening stage (was `update` during the
  # adoption rollout — Codex 019e4fbc two-stage: adoption first, ownership
  # second).
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
  ENDPOINT_ADMIN_DB_SCHEMA: "endpoint_admin_service"

  # Identity / OIDC — test=platform-test realm; prod overlay 'serban'
  KEYCLOAK_ISSUER_URI: "https://testai.acik.com/realms/platform-test"
  KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"

  # JWT Security
  SECURITY_AUTH_ALLOWED_CLIENT_IDS: "frontend,admin-cli,serban-web,account"
  SECURITY_JWT_AUDIENCE: "endpoint-admin-service,frontend,account,serban-web"

  # Spring profile — application-k8s.yml'ı aktive eder (Faz 22.1.1 C.5.persona
  # #960 fix 2026-05-22: profile yokken SecurityConfig fallback
  # http://localhost:8081/realms/serban/... JWKS URI'sını kullanıp
  # JWT validation 401 veriyordu; profile aktif olunca KEYCLOAK_JWKS_URI
  # env binding doğru spring.security.oauth2.resourceserver.jwt.jwk-set-uri'a
  # mapleniyor).
  SPRING_PROFILES_ACTIVE: "k8s"

  # Eureka / Spring Cloud (D7 — Eureka kaldırıldı)
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED: "false"

  # OpenFGA authz gate (Faz 22.1.1 BE-009; common-auth `erp.openfga.*` contract).
  # Provenance fix — gitops #1265 (2026-06-04). These four keys were live-only
  # drift: the live ConfigMap carried them (gate ON at runtime) but the gitops
  # base did NOT, so a full `apply -k` / ArgoCD sync would have dropped
  # ERP_OPENFGA_ENABLED → backend default `false`
  # (application-k8s.yml `${ERP_OPENFGA_ENABLED:false}`) → the @RequireModule
  # interceptor becomes a fail-OPEN no-op (EndpointAdminRequireModuleInterceptor:
  # `!authzService.isEnabled() → return true`) → a SILENT authz-gate downgrade
  # with the pod still green. enabled=true here is the secure, non-silent,
  # env-agnostic default (blank store/model fails loud at runtime → deny, never
  # silently open). Mirrors the permission-service base pattern (empty
  # store/model stubs overridden per environment).
  ERP_OPENFGA_ENABLED: "true"
  ERP_OPENFGA_API_URL: "http://openfga:8080"
  # Store/Model ID are env-specific empty stubs; EVERY overlay that includes
  # endpoint-admin MUST pin real values (the test overlay JSON6902-patches them
  # to the live test store/model). OpenFgaConfig applies store/model only when
  # non-blank; enabled=true with blank IDs → OpenFgaStartupGuard logs a SECURITY
  # WARNING and `check()` fails at call time — it WARNS, it does NOT block
  # startup. Leaving the stubs empty in base is therefore intentional
  # fail-loud-not-silent for any overlay that forgets to pin its IDs.
  ERP_OPENFGA_STORE_ID: ""
  ERP_OPENFGA_MODEL_ID: ""

  # AG-028 Managed Uninstall feature flag (endpoint-admin.uninstall.enabled).
  # DARK-LAUNCH default: false → the uninstall REST surface (propose / approve /
  # list / history) returns 503 "Service Unavailable" in dark mode (app default,
  # EndpointUninstallService throws ResponseStatusException(SERVICE_UNAVAILABLE)).
  # Ships dark so the destructive managed-uninstall capability is exposed only by
  # a deliberate, env-specific overlay flip. Base stays false (prod inherits
  # dark); the TEST overlay `replace`s this to "true" (AG-028 go-live on test —
  # gitops #1239: full build + deploy + destructive E2E SUCCEEDED_VERIFIED +
  # headless-browser acceptance). The overlay `replace` (not `add`) fails fast if
  # this base default is ever removed — same fail-loud discipline as the OpenFGA
  # store/model stubs above.
  ENDPOINT_ADMIN_UNINSTALL_ENABLED: "false"

  # Agent auth (HMAC nonce + timestamp window)
  ENDPOINT_ADMIN_AGENT_AUTH_NONCE_TTL_SECONDS: "600"
  ENDPOINT_ADMIN_AGENT_AUTH_NONCE_CLEANUP_INITIAL_DELAY_MS: "600000"
  ENDPOINT_ADMIN_AGENT_AUTH_NONCE_CLEANUP_INTERVAL_MS: "600000"
  ENDPOINT_ADMIN_AGENT_AUTH_TIMESTAMP_WINDOW_SECONDS: "300"

  # Command claim TTL
  ENDPOINT_ADMIN_COMMAND_CLAIM_TTL_SECONDS: "300"

  # Enrollment token
  ENDPOINT_ADMIN_ENROLLMENT_DEFAULT_TOKEN_TTL_MINUTES: "1440"
  ENDPOINT_ADMIN_ENROLLMENT_MAX_TOKEN_TTL_MINUTES: "10080"
  ENDPOINT_ADMIN_ENROLLMENT_CONSUME_RATE_LIMIT_PER_MINUTE: "5"

  # Secret encryption (key version + rotation grace; key kendisi Vault/ESO)
  ENDPOINT_ADMIN_SECRET_ENCRYPTION_KEY_VERSION: "k8s-v1"
  ENDPOINT_ADMIN_SECRET_ROTATION_GRACE_HOURS: "24"

  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_EXAMPLE_ENDPOINTADMIN: "INFO"

  # Management / actuator
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
