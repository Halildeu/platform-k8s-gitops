# endpoint-admin-service ConfigMap — Faz 22.1.1b live-aligned (2026-05-05)
#
# Live cluster (k3d-test platform-test) ConfigMap reverse-engineered into
# gitops base. Önceki charter skeleton (18 key, OVERLAY_MUST_OVERRIDE pattern)
# uygulamayla uyumsuzdu — bu revision live-aligned 35 key uygulama-spesifik
# config kontratı.
#
# Codex 019df86f drift dürüstlüğü mandate (PR #366 sonrası onboard sprint):
# live state authoritative, gitops manifest live'a hizalanır.
#
# Env-specific override: KEYCLOAK_ISSUER_URI + KEYCLOAK_JWKS_URI +
# SECURITY_JWT_AUDIENCE prod overlay tarafında (test base default'ları kabul,
# prod realm 'serban' için overlay patch).

apiVersion: v1
kind: ConfigMap
metadata:
  name: endpoint-admin-service-config
  labels:
    app.kubernetes.io/name: endpoint-admin-service
data:
  # Listen ports (uygulama Spring Boot default 8096)
  SERVER_PORT: "8096"
  SERVER_SHUTDOWN: "graceful"
  MANAGEMENT_SERVER_PORT: "8081"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"

  # Datasource (host-compose Postgres test cluster — D6 stateful contract)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/endpoint_admin"
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "2"
  DB_POOL_MAX: "5"

  # JPA / Flyway — uygulama Flyway kullanmıyor; Hibernate ddl-auto=update
  SPRING_FLYWAY_ENABLED: "false"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  ENDPOINT_ADMIN_DB_SCHEMA: "endpoint_admin_service"

  # Identity / OIDC — test=platform-test realm; prod overlay 'serban'
  KEYCLOAK_ISSUER_URI: "https://testai.acik.com/realms/platform-test"
  KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"

  # JWT Security
  SECURITY_AUTH_ALLOWED_CLIENT_IDS: "frontend,admin-cli,serban-web,account"
  SECURITY_JWT_AUDIENCE: "endpoint-admin-service,frontend,account,serban-web"

  # Eureka / Spring Cloud (D7 — Eureka kaldırıldı)
  EUREKA_CLIENT_ENABLED: "false"
  SPRING_CLOUD_DISCOVERY_ENABLED: "false"
  SPRING_CLOUD_SERVICE_REGISTRY_AUTO_REGISTRATION_ENABLED: "false"

  # Agent auth (HMAC nonce + timestamp window)
  ENDPOINT_ADMIN_AGENT_AUTH_NONCE_TTL_SECONDS: "600"
  ENDPOINT_ADMIN_AGENT_AUTH_NONCE_CLEANUP_INITIAL_DELAY_MS: "600000"
  ENDPOINT_ADMIN_AGENT_AUTH_NONCE_CLEANUP_INTERVAL_MS: "600000"
  ENDPOINT_ADMIN_AGENT_AUTH_TIMESTAMP_WINDOW_SECONDS: "300"

  # Command claim TTL
  ENDPOINT_ADMIN_COMMAND_CLAIM_TTL_SECONDS: "300"

  # Enrollment token
  ENDPOINT_ADMIN_ENROLLMENT_DEFAULT_TOKEN_TTL_MINUTES: "1440"
  ENDPOINT_ADMIN_ENROLLMENT_MAX_TOKEN_TTL_MINUTES: "10080"
  ENDPOINT_ADMIN_ENROLLMENT_CONSUME_RATE_LIMIT_PER_MINUTE: "5"

  # Secret encryption (key version + rotation grace; key kendisi Vault/ESO)
  ENDPOINT_ADMIN_SECRET_ENCRYPTION_KEY_VERSION: "k8s-v1"
  ENDPOINT_ADMIN_SECRET_ROTATION_GRACE_HOURS: "24"

  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_EXAMPLE_ENDPOINTADMIN: "INFO"

  # Management / actuator
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"
  MANAGEMENT_TRACING_ENABLED: "false"
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.1"
