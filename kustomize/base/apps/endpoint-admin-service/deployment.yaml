# endpoint-admin-service Deployment skeleton — Faz 22 (sprint PR-9)
#
# Codex 019de00f öneri:
# - "Manifest skeleton ekle, ama image/replicas canlı deploy etmeyecek
#   şekilde fail-closed bırak."
# - image: OVERLAY_MUST_OVERRIDE pattern (placeholder leak guard)
# - replicas: 0 default (D17 scale-to-zero) — overlay set eder
#
# Bu skeleton kabul edildi (ADR-0012-EA charter); image/digest/replicas
# 5 user clarify cevabı + DD-EA guard inventory PR-9b sonrası set edilir.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: endpoint-admin-service
  labels:
    app.kubernetes.io/name: endpoint-admin-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  replicas: 0  # D17 scale-to-zero default; overlay sets 1 (test) or 2 (prod)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-service
  template:
    metadata:
      annotations:
        # #1267 runtime reconcile: ConfigMap store/model pins moved to the
        # ESO-managed endpoint-admin-service-secrets Secret. Keep this stable
        # marker in the pod template so the first GitOps sync after migration
        # rolls pods and re-reads envFrom from the Secret.
        endpoint-admin.acik.io/openfga-selector-source: "eso-secret"
      labels:
        app.kubernetes.io/name: endpoint-admin-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: platform
    spec:
      automountServiceAccountToken: false
      serviceAccountName: endpoint-admin-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: endpoint-admin-service
          # PLACEHOLDER — overlay MUST set via images: + newName + digest
          # Fail-closed: literal "OVERLAY_MUST_OVERRIDE" sızması →
          # gate-enforcement-check.yml CI guard reddeder.
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/endpoint-admin-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            # Faz 22.1.1b live-aligned 2026-05-05: uygulama Spring Boot 8096
            # listen ediyor (live ConfigMap SERVER_PORT=8096). Önceki 8080
            # charter skeleton drift idi.
            - name: http
              containerPort: 8096
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
            # Faz 22.5 M2 (#1359): default-off passthrough mTLS connector.
            # The Spring Boot image only binds this when
            # ENDPOINT_ADMIN_MTLS_PASSTHROUGH_ENABLED=true and the mounted
            # keystore/truststore + password env are present. Keeping the port
            # declared now lets the staged endpoint-agent-mtls Service target
            # `mtls` without changing selectors during activation.
            - name: mtls
              containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: endpoint-admin-service-config
            - secretRef:
                name: endpoint-admin-service-secrets
                optional: false
            # Optional by design: base/prod/test stay default-off until the
            # operator seeds this secret and an overlay deliberately enables
            # the passthrough connector. Missing secret must not block the
            # normal HMAC/JWT endpoint-admin runtime.
            - secretRef:
                name: endpoint-admin-service-mtls-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Probe pattern aligned with auth-service / api-gateway / report-service
          # / notification-orchestrator (Spring Boot Actuator standard paths +
          # startupProbe gate). Pre-fix the deployment used non-existent
          # `/healthz/live` and `/healthz/ready` paths (skeleton-era artifact)
          # AND lacked a startupProbe, so liveness ran the 45s grace clock
          # against a Spring Boot startup that then took 50-60 seconds; every
          # restart was killed at the 45-second mark before the management
          # server could serve. 11-day silent CrashLoopBackOff (paired with
          # the eso-runtime missing-policy bug; once ESO sync started working,
          # the probe timing bug surfaced).
          # 2026-07-23: the same class of bug returned from the other side --
          # the service now boots in 243s, so the 150s budget SIGKILLed it
          # (exit 137) before management:8081 bound. Budget is now measured,
          # not assumed, and tests/deploy/test_startup_probe_budget_contract.py
          # fails the build if it is lowered again.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 60
            periodSeconds: 10        # 60*10 = 600 sn bütçe; ölçülen worst-case boot 243 sn (2026-07-23)
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: endpoint-admin-mtls-stores
              mountPath: /etc/endpoint-admin/mtls
              readOnly: true
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: tmp
          emptyDir: {}
        # Optional by design: when passthrough is disabled the directory may be
        # empty. When enabled, the backend validator fails closed unless the
        # expected PKCS12 files are readable.
        - name: endpoint-admin-mtls-stores
          secret:
            secretName: endpoint-admin-service-mtls-stores
            optional: true
