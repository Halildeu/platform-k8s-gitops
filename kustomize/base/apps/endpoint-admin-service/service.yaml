# endpoint-admin-service Service — Faz 22 (sprint PR-9)
apiVersion: v1
kind: Service
metadata:
  name: endpoint-admin-service
  labels:
    app.kubernetes.io/name: endpoint-admin-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: endpoint-admin-service
  ports:
    # Faz 22.1.1b live-aligned 2026-05-05: uygulama 8096 listen ediyor.
    # Service port 8096 → targetPort http (8096) — clusterIP routing tutarlı.
    - name: http
      port: 8096
      targetPort: http
      protocol: TCP
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
