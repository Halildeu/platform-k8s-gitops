# endpoint-admin-service Service — Faz 22 (sprint PR-9)
apiVersion: v1
kind: Service
metadata:
  name: endpoint-admin-service
  labels:
    app.kubernetes.io/name: endpoint-admin-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: endpoint-admin-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: management
      port: 8081
      targetPort: management
      protocol: TCP
