# redis-streams-exporter base kustomization — Faz 24 PR-obs-01a (gitops#1247)
#
# Redis Streams (staging-sw host-compose, ADR-0031 D2 chunk transport) için
# queue-depth/consumer-group görünürlüğü: oliver006/redis_exporter.
# Hedef: host-services redis-streams Service'i (D19 Service+Endpoints bridge).
#
# Sadece TEST overlay include eder (prod'da Redis Streams yok — D30 cutover'da
# prod overlay'e eklenir). ops/ alt dizini ServiceMonitor taşır (CRD-gated,
# Faz 17.2.5 disiplini) — overlay onu ayrıca include eder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: redis-streams-exporter
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/part-of: platform
    includeSelectors: false
    includeTemplates: true

resources:
  - deployment.yaml
  - service.yaml
  # Secret ESO ile gelir (overlay-specific ExternalSecret —
  # kustomize/overlays/test/eso/redis-streams-exporter/, dedicated Vault path
# kv/platform/redis-streams-exporter. The exporter ACL separation landed in
# gitops#1457; application-client ACL separation remains tracked by gitops#2614.
