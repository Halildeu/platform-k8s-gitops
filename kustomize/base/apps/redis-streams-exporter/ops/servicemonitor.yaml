# redis-streams-exporter ServiceMonitor — Faz 24 PR-obs-01a
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-streams-exporter
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-streams-exporter
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - platform-test
