# promtail → Loki bridge basic-auth Secret — test (gitops#1462)
#
# AYRI credential (Codex S1): remote-write-bridge Loki location'ının
# loki.htpasswd'ı ile AYNI parola. Vault path kv/platform/remote-write-bridge
# property loki_username/loki_password (Prometheus remote_write'ın
# username/password'ından AYRI key — credential izolasyonu).
# Tüketici: monitoring ns promtail (helm) — env expansion ile config'e
# enjekte (plaintext values'a girmez — Codex S5).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: promtail-loki-auth
  labels:
    app.kubernetes.io/name: promtail
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: promtail-loki-auth
    creationPolicy: Owner
  data:
    - secretKey: LOKI_BRIDGE_USERNAME
      remoteRef:
        key: kv/platform/remote-write-bridge
        property: loki_username
    - secretKey: LOKI_BRIDGE_PASSWORD
      remoteRef:
        key: kv/platform/remote-write-bridge
        property: loki_password
