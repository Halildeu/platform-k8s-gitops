# remote-write-bridge basic-auth Secret'i — ESO ile Vault'tan (gitops#1459)
#
# Vault path: kv/platform/remote-write-bridge (seed: host-compose/
# remote-write-bridge/README.md — htpasswd ile AYNI parola).
# Tüketici: test Prometheus CR remoteWrite[].basicAuth secretKeyRef
# (helm-values/kube-prometheus-stack/values-test.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: remote-write-bridge-auth
  labels:
    app.kubernetes.io/name: remote-write-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: remote-write-bridge-auth
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: kv/platform/remote-write-bridge
        property: username
    - secretKey: password
      remoteRef:
        key: kv/platform/remote-write-bridge
        property: password
