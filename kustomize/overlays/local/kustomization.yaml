# Local overlay — k3d-dev (Mac developer machine, Docker Desktop)  [Faz 17.0]
#
# Bu overlay MAC LOCAL dev cluster içindir (staging-sw runtime değildir).
# Cluster: k3d-dev  |  Namespace: platform-dev  |  Domain: *.localtest.me
# Image pull YOK (k3d image import ile yükleniyor).
# Host-level PG/KC/Vault: host.docker.internal (Docker Desktop DNS).
#
# Runtime hedefleri AYRI overlay'lerdedir:
#   - overlays/test  → testai.acik.com (staging-sw k3d-test)
#   - overlays/prod  → ai.acik.com     (staging-sw k3d-prod)
#
# NOT (Faz 17 Codex AGREE iter-4):
# - Bu overlay "authn-min" profilinin MVP'idir. Profile matrix (local-authn-min,
#   local-zanzibar-min, local-full) ve app base runtime/ops split (17.2.5)
#   ayrı PR zincirlerinde gelir.
# - Bu kustomization'ın ExternalSecret/ServiceMonitor'ü include etmesi 17.2.5
#   split öncesinde ham kalır; lokalde CRD yüklü değilse `kustomize build`
#   çıkıtısından manuel filtrelenir.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-dev

resources:
  - ../../base

patches:
  # Image pull policy Never (k3d image import sonrası)
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/replicas
        value: 1

  # ConfigMap namespace placeholder → platform-dev
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-dev.svc.cluster.local:8080"
      - op: replace
        path: /data/DB_URL
        value: "jdbc:postgresql://postgres.platform-dev.svc.cluster.local:5432/auth_db"
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/AUTH_SERVICE_URL
        value: "http://auth-service.platform-dev.svc.cluster.local:8088"
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-dev.svc.cluster.local:8080"

  # Host bridge Endpoints — lokal'de Docker Desktop'ın host-gateway IP'si
  # Docker Desktop 4.x host.docker.internal → 192.168.65.254 (macOS) veya
  # 172.17.0.1 (Linux). k3d cluster host.docker.internal'a resolve eder.
  # Burada statik IP yerine ikinci Endpoints kaydı yazmak yerine bir init script
  # docker container'ın bilgisinden IP çözer. PoC'de hardcoded host IP de yeter:
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"   # macOS Docker Desktop host gateway; Linux için değiştir
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8081
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200

  # Lokal kaynak tasarrufu: PDB devre dışı (tek replica ile anlamsız)
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # Debug logging açık (lokal test için)
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG

  # Ingress host — Faz 17.0: *.localtest.me otomatik 127.0.0.1 resolve (RFC2606)
  # Eski ai.acik.com değeri runtime target yolunu karıştırıyordu — kaldırıldı.
  # Lokal edge TLS (17.X): mkcert + Caddy `app.localtest.me:8443` → ingress 32443 proxy.
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.localtest.me
