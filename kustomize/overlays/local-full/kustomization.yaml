# Local profile: full (Faz 17.2 — PLAN §17.8 profile matrix)
#
# Cluster: k3d-dev  |  Namespace: platform-dev  |  Domain: *.localtest.me
# Workload count: 10 (9 Deployment + 1 StatefulSet)
#   - 9 app Deployment (api-gateway, auth, core-data, frontend, permission, report,
#     schema, user, variant)
#   - 1 StatefulSet (openfga)
#   - Host bridges (postgres + keycloak + vault) Service/Endpoints pattern
#
# D29 Gate: Up + Functional + Zanzibar-ready + testai desen paritesi
#   - zanzibar-min kapıları
#   - frontend UI render (ssot MFE artifact hazırsa)
#   - 9-app /actuator/health/readiness 200
#
# Bu overlay base/apps/ops-bundle include ETMEZ (CRD-free, Faz 17.2.5)
# Eşdeğeri: eski overlays/local (Faz 17.7 deprecation sonrası bu aktif kalacak)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-dev

resources:
  - ../../base    # Runtime-only base (ops-bundle hariç, 17.2.5 split)

patches:
  # Image pull policy Never + single replica
  - target:
      kind: Deployment
      labelSelector: "app.kubernetes.io/part-of=platform"
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/replicas
        value: 1

  # ConfigMap: platform-dev.svc substitution
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-dev.svc.cluster.local:8080"
      - op: replace
        path: /data/DB_URL
        value: "jdbc:postgresql://postgres.platform-dev.svc.cluster.local:5432/auth_db"
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/AUTH_SERVICE_URL
        value: "http://auth-service.platform-dev.svc.cluster.local:8088"
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-dev.svc.cluster.local:8080"
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG

  # Host bridge Endpoints — Docker Desktop host-gateway
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8081
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200

  # PDB devre dışı
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # StatefulSet tek replica (openfga)
  - target:
      kind: StatefulSet
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Ingress host
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.localtest.me
