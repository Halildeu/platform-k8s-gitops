# Local profile: authn-min (Faz 17.2 — PLAN §17.8 profile matrix)
#
# Cluster: k3d-dev  |  Namespace: platform-dev  |  Domain: *.localtest.me
# Workload count: 4 (Deployment + StatefulSet)
#   - api-gateway
#   - auth-service
#   - host-service postgres (bridge Endpoints)
#   - host-service keycloak (bridge Endpoints)
#
# D29 Gate: Up + Functional (auth-only)
#   - OIDC discovery + token mint (external edge)
#   - auth-service :8081/actuator/health/readiness (internal port-forward helper)
#   - Zanzibar-ready kanıt YOK (permission-service + openfga yok — zanzibar-min profiline geç)
#
# Bu overlay base/apps/ops-bundle include ETMEZ (CRD-free lokal, Faz 17.2.5 split)
# ES + SM resources inline fake Secret'lerle değiştirilir (Faz 17.1 fixtures)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-dev

resources:
  # Runtime-only (ops-bundle hariç)
  - ../../base/host-services
  - ../../base/apps/api-gateway
  - ../../base/apps/auth-service
  - ../../base/ingress
  # NOT: netpol + quota lokal dev için opsiyonel — Faz 17.3 dev-up.sh --strict bayrağı

patches:
  # Image pull policy Never (k3d image import sonrası)
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/replicas
        value: 1

  # ConfigMap namespace: platform-dev.svc.cluster.local
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-dev.svc.cluster.local:8080"
      - op: replace
        path: /data/DB_URL
        value: "jdbc:postgresql://postgres.platform-dev.svc.cluster.local:5432/auth_db"
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/AUTH_SERVICE_URL
        value: "http://auth-service.platform-dev.svc.cluster.local:8088"
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-dev.svc.cluster.local:8080"

  # Host bridge Endpoints — Docker Desktop host-gateway
  # macOS: 192.168.65.254 (Docker Desktop 4.x)
  # Linux: 172.17.0.1
  # dev-up.sh script OS detect edip IP override eder
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8081

  # PDB devre dışı (tek replica ile anlamsız)
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # Debug logging (lokal test için)
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG

  # Ingress host — app.localtest.me (RFC2606 127.0.0.1 resolve)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.localtest.me
