# Local profile: authn-min (Faz 17.2 — PLAN §17.8 profile matrix)
#
# Cluster: k3d-dev  |  Namespace: platform-dev  |  Domain: *.localtest.me
# Workload count: 4 (Deployment + StatefulSet)
#   - api-gateway
#   - auth-service
#   - host-service postgres (bridge Endpoints)
#   - host-service keycloak (bridge Endpoints)
#
# D29 Gate: Up + Functional (auth-only)
#   - OIDC discovery + token mint (external edge)
#   - auth-service :8081/actuator/health/readiness (internal port-forward helper)
#   - Zanzibar-ready kanıt YOK (permission-service + openfga yok — zanzibar-min profiline geç)
#
# Bu overlay base/apps/ops-bundle include ETMEZ (CRD-free lokal, Faz 17.2.5 split)
# ES + SM resources inline fake Secret'lerle değiştirilir (Faz 17.1 fixtures)

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-dev

resources:
  # Runtime-only (ops-bundle hariç)
  - ../../base/host-services
  - ../../base/apps/api-gateway
  - ../../base/apps/auth-service
  - ../../base/ingress
  # NOT: netpol + quota lokal dev için opsiyonel — Faz 17.3 dev-up.sh --strict bayrağı

# Faz 17.3 D34 dev realm self-contained — GHCR direct pull (Tiltfile yerine)
# Mac k3d-dev internet erişimi var → imagePullPolicy=IfNotPresent + GHCR :latest
# Test/prod cluster digest pin'i (ghcr.io/halildeu/...@sha256:...) overlays/{test,prod}/kustomization.yaml'da
# Dev'de :latest kullanılır (geliştirme akışı için), test/prod immutable digest (D30 atomic).
# ghcr-pull secret ad-hoc Mac k3d-dev'de oluşturulmalı (ayrı runbook):
#   kubectl --context k3d-dev -n platform-dev create secret generic ghcr-pull \
#     --from-file=.dockerconfigjson=$HOME/.docker/config.json \
#     --type=kubernetes.io/dockerconfigjson
#   for sa in default api-gateway auth-service; do
#     kubectl --context k3d-dev -n platform-dev patch sa $sa \
#       -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'
#   done
images:
  - name: auth-service
    newName: ghcr.io/halildeu/platform-backend-auth-service
    newTag: latest
  - name: api-gateway
    newName: ghcr.io/halildeu/platform-backend-api-gateway
    newTag: latest

patches:
  # Replicas=1 + IfNotPresent (Mac dev: image cache hit fast, miss=GHCR pull)
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/replicas
        value: 1

  # ConfigMap namespace: platform-dev.svc.cluster.local
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-dev.svc.cluster.local:8080"
      - op: replace
        path: /data/DB_URL
        value: "jdbc:postgresql://postgres.platform-dev.svc.cluster.local:5432/auth_db"
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/AUTH_SERVICE_URL
        value: "http://auth-service.platform-dev.svc.cluster.local:8088"
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-dev.svc.cluster.local:8080"

  # Host bridge Endpoints — Docker Desktop host-gateway
  # macOS: 192.168.65.254 (Docker Desktop 4.x)
  # Linux: 172.17.0.1
  # dev-up.sh script OS detect edip IP override eder
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "192.168.65.254"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8081

  # PDB devre dışı (tek replica ile anlamsız)
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # Debug logging (lokal test için) + Hibernate DDL update (Faz 17.1 fixture)
  # Lokal dev'de Flyway disable + Hibernate ddl-auto=update — schema otomatik oluşur
  # (test/prod overlay'lerde Flyway authoritative; lokal'de fixture daha esnek)
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: DEBUG

  # Ingress host — app.localtest.me (RFC2606 127.0.0.1 resolve)
  # NOT: tls.hosts[0] da override edilmek zorunda (base PLACEHOLDER_HOST ingress validator fail eder)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.localtest.me
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.localtest.me
