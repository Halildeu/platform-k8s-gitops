apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Faz 35 Etik Speak PROD kill-switch (emergency panic-off overlay).
#
# ⚠️ Kullanım: `docs/runbooks/RB-faz35-emergency-kill-switch.md` prosedürü.
# ArgoCD Application `platform-prod` source path bu overlay'e patch'lenir,
# reconcile → 3 workload scale=0 + public/staff ingress placeholder host'lara
# taşınır (public URL erişilemez). Prune=false safe; ArgoCD kaynak sahipliği
# korunur, reactivation için delete gerekmez.
#
# Trigger'lar: SEV1 alert 30 dk çözülmedi, veri sızıntısı sinyali, yargı
# kararı ile geçici durdurma. Reactivation ES-311 imza pack sonrası
# `RB-faz35-real-reporter-open.md` prosedürü.
resources:
  - ../../activation/etik-speak

patches:
  - target:
      kind: Deployment
      name: ethics-service|etik-speak-public|etik-speak-manager
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Ingress
      name: etik-speak-public-api|etik-speak-public-ui
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: etik-speak-disabled.invalid
      - op: replace
        path: /spec/rules/1/host
        value: speakup-disabled.invalid
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - etik-speak-disabled.invalid
          - speakup-disabled.invalid
  - target:
      kind: Ingress
      name: etik-speak-staff-api|etik-speak-manager-ui
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: etik-speak-manager-disabled.invalid
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - etik-speak-manager-disabled.invalid
