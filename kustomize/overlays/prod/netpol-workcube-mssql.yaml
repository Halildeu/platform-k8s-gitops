# Faz 20 LIVE — prod NetPol egress direct (Workcube MSSQL host)
# Önceki: 172.21.0.7/32:11433 (bridge proxy)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-workcube-mssql
  annotations:
    platform.acik.com/adr: "0005"
    platform.acik.com/purpose: "Dual DataSource Reporting: report/schema services → Workcube MSSQL direct (Faz 20 post-Calico fix)"
    platform.acik.com/direct-routing: "Faz 20 LIVE — pod direct via Calico containerIPForwarding"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - report-service
          - schema-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.9.193.201/32      # Workcube MSSQL host direct
      ports:
        - protocol: TCP
          port: 1433                    # MSSQL standart port
