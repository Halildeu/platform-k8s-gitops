# Faz 20 LIVE — prod cluster direct routing (bridge proxy decommissioned)
# Calico containerIPForwarding=Enabled (PR #136) → pod direct → 10.9.193.201:1433
# Önceki: 172.21.0.7:11433 (workcube-mssql-proxy-prod alpine/socat bridge container)
apiVersion: v1
kind: Endpoints
metadata:
  name: workcube-mssql
  labels:
    app.kubernetes.io/name: workcube-mssql
subsets:
  - addresses:
      - ip: 10.9.193.201              # Workcube MSSQL host direct (Faz 20 LIVE)
    ports:
      - name: mssql
        port: 1433                    # MSSQL standart port (TDS)
        protocol: TCP
