apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: etik-speak-vault
  labels:
    app.kubernetes.io/name: etik-speak-vault
    app.kubernetes.io/part-of: etik-speak
spec:
  provider:
    vault:
      server: http://vault.platform-prod.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        appRole:
          path: approle
          # Dedicated least-privilege TEST AppRole created and read back by
          # provision-test-pg-vault.sh before root activation.
          roleId: PENDING_FAZ35_PROD_VAULT_ROLE_ID
          secretRef:
            name: etik-speak-vault-approle
            key: secret-id
