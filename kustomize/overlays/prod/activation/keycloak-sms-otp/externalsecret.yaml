# gitops#3379 — PROD side of the keycloak-sms-otp client credential.
#
# Mirrors overlays/test/activation/keycloak-sms-otp/externalsecret.yaml. The
# auth-service half validates what the KC SPI presents to /oauth2/token; the KC
# half of the SAME value is a docker secret file next to the prod compose
# (host-compose/keycloak/prod/secrets/sms_otp_client_secret.txt). Rotation must
# update BOTH — see docs/runbooks/RB-kc-sms-otp.md.
#
# Seeded into prod Vault 2026-08-02 with `vault kv patch` (NOT put — the path
# carries seven other auth-service fields; put would have destroyed them, and
# the seed verified all seven byte-identical afterwards). Cross-side match
# sha256[:12] 6cd69fac1aaa.
#
# Nothing mounts this Secret yet. It exists so that activation is a restart,
# not a credential ceremony — see README.md in this directory.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-sms-otp-secret
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: auth-service-sms-otp-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SERVICE_CLIENT_KEYCLOAK_SMS_OTP_SECRET
      remoteRef:
        key: kv/platform/auth-service
        property: service_client_keycloak_sms_otp_secret
