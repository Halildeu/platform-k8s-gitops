  # Faz 23.9 prod cutover — notification-orchestrator pod-template
  # annotation rollout trigger + replicas override. ConfigMap envFrom
  # değişmesi pod restart tetiklemez; bu annotation rolling restart
  # sağlar. Base D17 scale-to-zero (replicas: 0) → prod replicas: 2
  # (D21 prod replica baseline; SSE multi-pod cross-broadcast PR-E.4
  # PG LISTEN/NOTIFY ile çözüldü, HPA min=max=1 lock kaldırıldı).
  - target:
      kind: Deployment
      name: notification-orchestrator
    patch: |-
      # 2026-05-10 (PR-471b): replicas 2 → 1 (kullanıcı kararı: prod default 1).
      # HPA min=1 max=3, custom metric backlog ile yük altında scale-up.
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/metadata/annotations
        value:
          security.acik.com/strict-cutover-activation: "faz-23-9-prod"
          # Faz 23.7 Step C audit retention activation rollout trigger
          # (Codex thread 019e090d iter-1 absorb): ConfigMap envFrom only
          # reads at pod start → annotation bump forces rolling restart so
          # AuditPartitionRetentionService bean gets instantiated under
          # the new NOTIFY_AUDIT_RETENTION_ENABLED=true config.
          compliance.acik.com/audit-retention-cycle: "pr-c-2-flip-2026-05-09"
          # Faz 23.A4 DKIM relay strategy activation (PR-B3 2026-05-20,
          # Codex 019e4514). Image bump + relay ConfigMap atomic — annotation
          # bump pod rolling restart tetikler so DkimSigner conditional bean
          # (enabled=false) takes effect on new pod boot.
          mail.acik.com/dkim-relay-strategy: "b3-prod-2026-05-20-sha-6307428"
          # Faz 23.3 M4 prod cutover RE-ATTEMPT (PR-B4 2026-05-20, Codex
          # iter-1 P1 absorb): ConfigMap envFrom yeni 8 JetSMS key + netpol
          # additive; rollout annotation pod restart tetikler so SmsAdapter
          # primary=jetsms reload + JetSmsDlrPollingWorker activate.
          sms.acik.com/jetsms-m4-cutover: "b4-prod-2026-05-20-sha-6307428"

  # Ingress host + TLS host: ai.acik.com (D18)
  # Faz 22.5 (gitops#1436): append the /artifacts path → artifact-host:80 so the
  # endpoint-admin UI one-command + manifest discovery resolve on ai.acik.com.
  # ingress-nginx matches most-specific path first, so /artifacts wins over `/`
  # regardless of list order; no rewrite-target → path passes verbatim to the
  # artifact-host nginx. Same host + existing wildcard-acik-com TLS cert (no TLS
  # change). DESIRED-STATE ONLY (prod manual-sync; owner-gated rollout).
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ai.acik.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: ai.acik.com
      - op: add
        path: /spec/rules/0/http/paths/-
        value:
          path: /artifacts
          pathType: Prefix
          backend:
