# Prod overlay — k3d-prod (staging-sw canlı)
# - Image: GHCR tag (sha-<short>)
# - Host bridge: 10.9.10.53:5432/8081/8200 (D20)
# - Replica: 2 sabit (D21)
# - Namespace: platform-prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-prod

resources:
  - namespace.yaml    # Namespace + labels (platform=true env=prod, ApplicationSet prereq)
  - ../../base
  - ../../base/apps/ops-bundle    # Faz 17.2.5: ExternalSecret + ServiceMonitor CRD paketi (runtime'dan ayrı)

images:
  # Gerçek GHCR path: halildeu/platform-ssot-<service> (tire ile)
  # Prod için sha-60611fa tag (runtime rolling). Canlı cutover öncesi CI'nın
  # verdiği specific digest'e (@sha256:...) pinlenir — D26 Codex Tur-4.
  - name: auth-service
    newName: ghcr.io/halildeu/platform-ssot-auth-service
    newTag: sha-60611fa
  - name: api-gateway
    newName: ghcr.io/halildeu/platform-ssot-api-gateway
    newTag: sha-60611fa
  - name: user-service
    newName: ghcr.io/halildeu/platform-ssot-user-service
    newTag: sha-60611fa
  - name: variant-service
    newName: ghcr.io/halildeu/platform-ssot-variant-service
    newTag: sha-60611fa
  - name: core-data-service
    newName: ghcr.io/halildeu/platform-ssot-core-data-service
    newTag: sha-60611fa
  - name: report-service
    newName: ghcr.io/halildeu/platform-ssot-report-service
    newTag: sha-60611fa
  - name: schema-service
    newName: ghcr.io/halildeu/platform-ssot-schema-service
    newTag: sha-60611fa
  # 2026-04-19 S1-C15: permission-service IMMUTABLE tag (test overlay S1-C14 ile simetrik).
  # CI 7-char short SHA konvansiyon: sha-60611fa (merge commit 39239011ba1d).
  # NOT: Prod overlay APPLY EDİLMİYOR — D32 staging-sw-2 bootstrap sonrası Seviye 4.
  # Bu satır sadece render hizası + kustomize build kontratı için.
  - name: permission-service
    newName: ghcr.io/halildeu/platform-ssot-permission-service
    newTag: sha-60611fa
  # 2026-04-20: Faz E env-per-build — prod frontend image (ai.acik.com + serban)
  # Matrix build: platform-ssot PR #534
  - name: frontend
    newName: ghcr.io/halildeu/platform-ssot-frontend
    newTag: sha-2169841

patches:
  # 2026-04-19 S2-A1 follow-up: Shortname refactor sonrası gereksiz replace
  # patches KALDIRILDI. Base zaten shortname (postgres:5432, keycloak:8080,
  # auth-service:8088, gateway routes 0-5). Prod-specific override YOK,
  # overlay sadece namespace (platform-prod) + Ingress host + Endpoints pin.
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
  - target:
      kind: ConfigMap
      name: variant-service-config
    patch: |-
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account"
  - target:
      kind: ConfigMap
      name: permission-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"

  # Ingress host + TLS host: ai.acik.com (D18)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ai.acik.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: ai.acik.com

  # Host bridge prod portları (D20)
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.21.0.4"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.21.0.5"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8080
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.21.0.6"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200

  # Prod ResourceQuota: 2 replica + openfga/job toplam limit bütçesi
  - target:
      kind: ResourceQuota
      name: platform-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "8"
      - op: replace
        path: /spec/hard/requests.memory
        value: 8Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "24"
      - op: replace
        path: /spec/hard/limits.memory
        value: 24Gi
