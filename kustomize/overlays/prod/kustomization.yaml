      # - Service account: notify-noreply@acik.com (operator: Microsoft 365 admin)
      #
      # Switch to other vendor (config-only):
      # - SendGrid: SPRING_MAIL_HOST=smtp.sendgrid.net + smtp_username='apikey'
      # - AWS SES: SPRING_MAIL_HOST=email-smtp.<region>.amazonaws.com + IAM SMTP
      # - Postmark: smtp.postmarkapp.com + server token
      # - Mailgun: smtp.mailgun.org + postmaster@<domain>
      # - Internal MTA: <host> + service account
      - op: add
        path: /data/SPRING_MAIL_HOST
        value: "smtp.office365.com"
      - op: add
        path: /data/SPRING_MAIL_PORT
        value: "587"
      - op: add
        path: /data/SPRING_MAIL_SMTP_AUTH
        value: "true"
      # NOTIFY_ADAPTERS_SMTP_HOST + FROM_ADDRESS prod overrides (placeholder fix)
      # Session 44 user clipboard share: Office 365 service account ai@acik.com
      # (display name: "Ai - Açık Holding"). FROM_ADDRESS = SMTP AUTH username
      # (Office 365 default policy: username == From; aksi halde "Send As" izni
      # gerekir Microsoft 365 admin'de). noreply@acik.com alias için ayrı PR
      # gerekirse — şu anki seçim user mailbox direct.
      - op: replace
        path: /data/NOTIFY_ADAPTERS_SMTP_HOST
        value: "smtp.office365.com"
      - op: replace
        path: /data/NOTIFY_ADAPTERS_SMTP_FROM_ADDRESS
        value: "ai@acik.com"
      - op: replace
        path: /data/NOTIFY_ADAPTERS_SMTP_FROM_NAME
        value: "Ai - Açık Holding"
      # A4 DKIM env prep — Codex iter (019e1307) RED absorb 2026-05-11:
      # NOTIFY_DKIM_ENABLED=false unchanged because prod overlay hâlâ
      # sha-204042d binary'sini çalıştırıyor (PR #126 era). PR #151 DKIM full
      # impl + SmtpAdapter wiring binary sha-264ba7f8'de; A5 PR-B (sha-c4a03fc
      # → veya sha-264ba7f8 promote) RAID I6 KC admin credential blocker
      # nedeniyle bekliyor. Eski binary'de SmtpAdapter DkimSigner inject
      # etmez → DKIM_ENABLED=true set edilirse mail signed olmaz + bean
      # parse fail riski (private-key-pem boş = IllegalStateException startup).
      #
      # DKIM live activation sequence:
      # 1. RAID I6 unblocked (KC admin credential)
      # 2. A5 PR-B reopen → prod backend digest sha-204042d → sha-264ba7f8
      #    (DKIM full impl binary)
      # 3. Vault prod seed: dkim_private_key_pem=<PKCS#8 RSA 2048>
      # 4. DNS TXT record propagation: acik2026._domainkey.acik.com
      # 5. Separate PR: NOTIFY_DKIM_ENABLED=false → true flip
      # 6. Verify pod log: "DkimSigner activated" + outbound mail
      #    DKIM-Signature header
      #
      # Selector + domain config env binding NOW prep — pod env değer
      # alınca activation hazır. NOTIFY_DKIM_ENABLED=false kaldığı sürece
      # backend DkimSigner bean ConditionalOnProperty disabled → SmtpAdapter
      # Optional<DkimSigner> empty → no DKIM-Signature header.
      # Faz 23.A4 DKIM relay strategy (PR-B3 2026-05-20, Codex 019e4514
      # plan-time consult — uzun vadeli kalıcı stabil; Office 365 Native DKIM):
      # - strategy=relay: provider-managed DKIM (Microsoft yönetir key rotation)
      # - enabled=false: app-side DkimSigner DISABLED (Optional empty)
      # - relay.provider=office365 + relay.domain=acik.com → validator branch
      # - SMTP TLS enforce zaten true (line 712); From: ai@acik.com aligned acik.com
      # **OPERATOR PREREQ (one-time setup)**:
      #   1. Office 365 admin tenant DKIM enable for acik.com:
      #      Microsoft 365 Defender > Email & Collaboration > Email auth settings
      #      > DKIM > acik.com > Rotate DKIM keys (generates tenant selector)
      #   2. DNS CNAME publish (acik.com DNS provider, **one-time** forever):
      #      selector1._domainkey.acik.com CNAME selector1-acik-com._domainkey.<tenant>.onmicrosoft.com
      #      selector2._domainkey.acik.com CNAME selector2-acik-com._domainkey.<tenant>.onmicrosoft.com
      #      (Microsoft tenant-specific; Office 365 admin UI gösterir)
      # Pre-setup deploy SAFE: ProductionConfigValidator relay branch geçer
      # (config-only validation); outbound mail unsigned olarak hâlâ deliver
      # olur; Office 365 admin DKIM enable + CNAME propagation sonrası signed.
      - op: add
        path: /data/NOTIFY_DKIM_STRATEGY
        value: "relay"
      - op: add
        path: /data/NOTIFY_DKIM_ENABLED
        value: "false"
      - op: add
        path: /data/NOTIFY_DKIM_RELAY_PROVIDER
        value: "office365"
      - op: add
        path: /data/NOTIFY_DKIM_RELAY_DOMAIN
        value: "acik.com"
      # Selector/domain prep (relay path'inde kullanılmıyor ama config görünür
      # kalır; app-side fallback için Vault'ta PKCS#8 key dormant — Codex
      # post-relay 72h stabil sonrası cleanup PR'da silinecek):
      - op: add
        path: /data/NOTIFY_DKIM_SELECTOR
        value: "acik2026"
      - op: add
        path: /data/NOTIFY_DKIM_DOMAIN
        value: "acik.com"
      # Faz 23.3 M4 prod cutover RE-ATTEMPT (PR-B4 2026-05-20, Codex 019e4514
      # test cluster LIVE 2026-05-20 + PR-B1+PR-B2+PR-B3 DKIM relay activation
      # MERGED + prod pod boot OK):
      # - JetSMS primary activation (R6: Biotekno mikrolink2 contract LIVE)
      # - 4 multipart/SOAP/channel/length keys (test cluster PR-A3.2 LIVE)
      # - R24 mitigation: OTP_TOPIC_KEYS="" initial; Biotekno OTP sender ID
      #   provisioning sonrası operator config patch ile enable
      - op: add
        path: /data/NOTIFY_ADAPTERS_SMS_PRIMARY_PROVIDER
        value: "jetsms"
      - op: add
        path: /data/NOTIFY_ADAPTERS_SMS_JETSMS_MULTIPART_ENABLED
        value: "true"
      - op: add
        path: /data/NOTIFY_ADAPTERS_SMS_JETSMS_ON_LENGTH_PROBLEM
        value: "SendAllPackage"
      - op: add
        path: /data/NOTIFY_ADAPTERS_SMS_JETSMS_SOAP_OPERATION
        value: "sendSMSSingle"
      - op: add
        path: /data/NOTIFY_ADAPTERS_SMS_JETSMS_CHANNEL
        value: "VF"
      - op: add
        path: /data/NOTIFY_ADAPTERS_SMS_JETSMS_CHANNEL_ALLOWED
        value: "VF,VFO"
      - op: add
        path: /data/NOTIFY_ADAPTERS_SMS_JETSMS_CHANNEL_OTP_TOPIC_KEYS
        value: ""
      - op: add
        path: /data/NOTIFY_ADAPTERS_SMS_JETSMS_CHANNEL_OTP_MAX_LENGTH
        value: "160"
      # NOTIFY_DISPATCH_ENABLED=false BAĞLANTILI: dispatch flip true sadece
      # smtp_username + smtp_password Vault'ta dolu olduğunda yapılmalı.
      # Operator post-merge sequence:
      # 1. Microsoft 365 admin: notify-noreply@acik.com service account create
      # 2. Microsoft 365 admin: App Password generate (2FA bypass for SMTP AUTH)
      # 3. Operator vault prod seed (Pre-Production Full Authority):
      #    vault kv patch kv/platform/notification-orchestrator \
      #      smtp_username='notify-noreply@acik.com' smtp_password='<app-password>'
      # 4. DKIM key generation + Vault seed:
      #    openssl genrsa -out dkim-prod.pem 2048
      #    openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in dkim-prod.pem -out dkim-prod-pkcs8.pem
      #    vault kv patch ... dkim_private_key_pem="$(cat dkim-prod-pkcs8.pem)"
      # 5. DNS TXT records (operator: acik.com domain DNS provider):
      #    acik2026._domainkey.acik.com IN TXT "v=DKIM1; k=rsa; p=<base64-public-key>"
      #    acik.com IN TXT "v=spf1 include:spf.protection.outlook.com -all"
      #    _dmarc.acik.com IN TXT "v=DMARC1; p=quarantine; rua=mailto:dmarc@acik.com"
      # 6. ESO force-sync: kubectl annotate externalsecret notification-orchestrator-secrets force-sync=$(date +%s)
      # 7. Verify Secret 18-key (was 15: +smtp_username +smtp_password +dkim_private_key_pem)
      # 8. Final flip: separate PR replace NOTIFY_DISPATCH_ENABLED=false → true
      #    (after smoke: outbound mail Mailpit/inbox delivered + DKIM-Signature header)
      #
      # A7 ACTIVATION (Session 44 — this PR):
      # - PR #506 MERGED (A6 SMTP gateway infra + Office 365 + multi-provider)
      # - Vault prod seed Session 44: smtp_username=ai@acik.com + smtp_password
      #   (Pre-Production Full Authority + user explicit override 2026-05-11)
      # - ESO sync 18-key Secret LIVE (post PR #506 merge + ArgoCD sync)
      # - Backend code: SmtpAdapter Optional<DkimSigner> wiring (PR #151 sha-264ba7f8)
      #   not in prod yet (sha-204042d eski binary); prod cluster signed mail
      #   olmaz ama unsigned dispatch live olur — Office 365 SMTP path active.
      # - DKIM live activation deferred A5 PR-B + RAID I6 unblock sonrası
      #   (DKIM-Signature header → mail-tester ≥9/10 score sonra).
      #
      # NOTIFY_DISPATCH_ENABLED=true → backend dispatch path active:
      # - SMTP adapter: ai@acik.com → smtp.office365.com:587 STARTTLS SMTP AUTH
      # - Subscriber preferences gate (T1.1 trilogy)
      # - Audit chain (DELIVERY_ATTEMPTED + DELIVERY_DELIVERED events)
      # - Unsubscribe link generation (UnsubscribeUrlBuilder)
      # - DKIM signing OFF (DKIM_ENABLED=false, eski binary, post A5 PR-B activation)
      - op: replace
        path: /data/NOTIFY_DISPATCH_ENABLED
        value: "true"

  # Faz 22.5 P2-A A1 first prod deploy — endpoint-admin-service ConfigMap
  # prod realm override + OpenFGA authz wiring (Codex 019e8cca post-impl
  # REVISE absorb: MUST-FIX OpenFGA fail-open gap — without ERP_OPENFGA_ENABLED=true
  # + valid STORE_ID + MODEL_ID, @RequireModule interceptor's authzService.isEnabled()
  # returns false → fail-open → D29 'Secured' claim cannot be made).
  #
  # KC realm: base = test realm platform-test; prod = serban.
  # JWT decoder bean uses KEYCLOAK_JWKS_URI (Faz 22.1.1 C.5.persona #960 fix:
  # profile=k8s active → KEYCLOAK_JWKS_URI binds to
  # spring.security.oauth2.resourceserver.jwt.jwk-set-uri).
  # SECURITY_JWT_AUDIENCE base ('endpoint-admin-service,frontend,account,
  # serban-web') already realm-neutral — no audience override needed.
  #
  # OpenFGA store/model: prod tenant (separate from test). Values sourced from
  # report-service-config prod live state (same OpenFGA tenant shared across
  # backend services on prod cluster). Tuples for module:endpoint-admin
  # can_view/can_manage authoritative seed via permission-service (out-of-band,
  # not in this PR).
  - target:
      kind: ConfigMap
      name: endpoint-admin-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
      - op: replace
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/serban/protocol/openid-connect/certs"
      # LOGGING_LEVEL_ROOT prod = INFO (test = DEBUG)
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "INFO"
      # ERP_OPENFGA_ENABLED/API_URL inherit from base. Store/model IDs:
      # 2026-06-11 cutover regression fix — the prior "moved to ESO Secret"
      # plan was NEVER completed (endpoint-admin-service-secrets has only
      # pepper/encryption/db keys, NOT store/model), so when the D30 full-sync
      # applied this ConfigMap (which had dropped the inline values) and rolled
      # the pod, the OpenFGA client got an empty storeId → FgaInvalidParameter
      # → fail-closed 403 on every @RequireModule call (devices + the
      # one-command enrollment modal). Store/model IDs are NON-SECRET
      # identifiers (permission-service/report-service carry them in env too),
      # so they belong in the ConfigMap. Pinned to the live prod OpenFGA tenant
      # (verified `allowed:true` against this model 2026-06-11).
      - op: add
        path: /data/ERP_OPENFGA_STORE_ID
        value: "01KPXCVBHCY2TQ6YHVK009NS1C"
      - op: add
        path: /data/ERP_OPENFGA_MODEL_ID
        value: "01KSFFK9K3V43DD211Z79K3FYA"

