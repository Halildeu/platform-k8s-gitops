  # 2026-04-19 S2-A1 follow-up: Shortname refactor sonrası gereksiz replace
  # patches KALDIRILDI. Base zaten shortname (postgres:5432, keycloak:8080,
  # auth-service:8088, gateway routes 0-5). Prod-specific override YOK,
  # overlay sadece namespace (platform-prod) + Ingress host + Endpoints pin.

  # Faz 23.2.A T1.1.8 P0.4 / P1.2 M3 next gate ACTIVATION 2026-05-10:
  # SPRING_PROFILES_ACTIVE=k8s,prod activates ProductionConfigValidator on
  # prod cluster path. Prerequisites complete (P1.2 sequence above):
  #   ✅ Prod ESO ExternalSecret extended 5→15 keys (parity with test)
  #   ✅ Prod Vault seed unsubscribe_signing_secret + 9 channel keys (Pre-Prod Full Authority)
  #   ✅ Prod ConfigMap NOTIFY_UNSUBSCRIBE_BASE_URL=https://ai.acik.com/...
  #   ✅ Prod ConfigMap NOTIFY_SMTP_TLS_ENFORCE=true + STARTTLS required + check-server-identity
  #   ✅ ProductionConfigValidator URI parser allowlist (PR #147 backend MERGED)
  # Validator startup fail-closed gate now safe to activate; pod ready means
  # all 9 production guards PASS.
  - target:
      kind: Deployment
      name: notification-orchestrator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0
        value:
          name: SPRING_PROFILES_ACTIVE
          value: "k8s,prod"

  # Codex iter-3 (019e1307) RED absorb history:
  # PR #498 initially attempted SPRING_PROFILES_ACTIVE=k8s,prod patch but Codex
  # iter-3 RED caught prod desired-state inconsistency (ESO 5-key, ConfigMap
  # base-url missing, SMTP TLS enforce missing, Vault prod seed pending).
  # Apply would have fail-closed prod pod startup. Patch deferred to this
  # P1.2 M3 next gate PR which completes all 5 prerequisites in single
  # atomic transaction (single PR = single render = single rollout):
  #   1. Prod ESO ExternalSecret 5→15 keys (line 74-141 above)
  #   2. Prod Vault seed (Pre-Production Full Authority — operator runs)
  #   3. Prod ConfigMap NOTIFY_UNSUBSCRIBE_BASE_URL + SMTP TLS env (line 442+)
  #   4. Prod profile flip k8s→k8s,prod (line 218 above)
  #   5. Backend ProductionConfigValidator URI parser allowlist (PR #147 MERGED)

  # Faz 23.9 Step D (Codex thread 019e08df iter-2 REVISE absorb 2026-05-08):
  # notify-orch base secret-stub.yaml workload render'a "dev-only-..." sentinel
  # değerlerle bir Secret yazıyor (kustomize/base/apps/notification-orchestrator/
  # secret-stub.yaml). ESO ExternalSecret aynı Secret adını creationPolicy=Owner
  # ile yönetmek istiyor. Aynı target Secret'in iki Application tarafından
  # yönetilmesi (platform-prod düz Secret + platform-eso-prod ExternalSecret)
  # full sync sırasında dev sentinel'a geri yazma penceresi açar. Stub'ı
  # base'den çıkarmak local/test bootstrap'i kırardı; prod overlay'de delete
  # patch ile yalnız prod render'dan kaldırıyoruz.
  - target:
      kind: Secret
      name: notification-orchestrator-secrets
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: notification-orchestrator-secrets

  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
      # Faz 21.3 D35-2-full follow-up (Codex 019dd409 gateway external 500
      # root cause fix): base'de KEYCLOAK_JWKS_URI artık OVERLAY_MUST_OVERRIDE
      # placeholder; prod overlay explicit JWKS path set etmeli (issuer
      # external `https://...` ama JWKS internal cluster Keycloak'tan okunur).
      - op: replace
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/serban/protocol/openid-connect/certs"
  - target:
      kind: ConfigMap
      name: variant-service-config
    patch: |-
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account"
  # 2026-05-04 Session 37 follow-up: user-service KC issuer prod override.
  # Base now has KEYCLOAK_ISSUER_URI set to internal cluster KC for test;
  # prod must point to the external issuer (ai.acik.com) so JWT validation
  # matches the iss claim emitted by the prod KC instance.
  - target:
      kind: ConfigMap
      name: user-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
  # 2026-05-04 Session 37 follow-up: schema-service + report-service KC
  # issuer prod override. Same pattern — base sets internal KC, prod points
  # to ai.acik.com for the iss claim match.
  - target:
      kind: ConfigMap
      name: schema-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
  - target:
      kind: ConfigMap
      name: report-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
  - target:
      kind: ConfigMap
      name: permission-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
      # 2026-05-04 Session 37: prod-only super-admin bootstrap addition.
      # halil.kocoglu@serban.com.tr was created as a Keycloak realm user
      # (KC ID d14c0a96-4e61-4b9a-9a69-43e8424e14fb) per the operator's
      # request. Bootstrap-admin-assigner re-asserts super-admin role on
      # every permission-service pod restart for emails in this list, so
      # adding halil.kocoglu here gives the account super-admin authority
      # on first login (KC → user-service sync → permission-service seed).
      # Test cluster keeps the base list (admin@example.com,
      # d35-admin@example.com) — no halil.kocoglu spillover.
      - op: replace
        path: /data/PERMISSION_BOOTSTRAP_DEFAULT_ADMIN_ASSIGNMENTS_ADMIN_EMAILS
        value: "admin@example.com,d35-admin@example.com,halil.kocoglu@serban.com.tr"

  # 2026-05-04 Faz 22.1.x: Prod'da REPORTS_DB_ENABLED=false → reports_db
  # secondary datasource bean instantiate olmaz (permission-service
  # ReportsDbDataSourceConfig @ConditionalOnProperty). Ama ExternalSecret
  # base'de reports_db_username + reports_db_password remoteRef referans var
  # → Vault'ta field yok → ESO SecretSyncedError → ArgoCD platform-prod
  # Healthy=Degraded.
  #
  # Codex 019dd296 verdict B test pattern: test cluster'da Vault'a
  # `reports_db_username/password` field'ları db_username/password aliases
  # olarak yazılmış (test scope, REPORTS_DB_ENABLED=true). Prod scope için
  # security separation: reports_db için ayrı read-only DB user gerek
  # (manuel operatör iş, ADR-0010 §2.5 Vault credential lifecycle).
  #
  # Geçici çözüm (REPORTS_DB_ENABLED=true olunca add-back):
  # ExternalSecret data[6]+data[7] (reports_db_username/password) prod
  # overlay'de remove. Base manifest aynı kalır (test'te 8 entry hepsi
  # gerekli). Prod'da 6 entry → ESO SecretSyncedError çözülür.
  - target:
      kind: ExternalSecret
      name: permission-service-secrets
    patch: |-
      - op: remove
        path: /spec/data/7
      - op: remove
        path: /spec/data/6

  # Faz 23.9 prod cutover (2026-05-08, tek-user pre-prod context):
  # notification-orchestrator-config prod overrides. Tüm strict mode
  # env'leri test cluster'da 41+ min sustained doğrulandı. Prod
  # cutover PR-5.4/5.5'i ai.acik.com'da aktive ediyor:
  #
  # - SPRING_DATASOURCE_URL: prod PG (notify_db, host bridge)
  # - SECURITY_JWT_ISSUER + JWK_SET_URI: prod KC (https://ai.acik.com/realms/serban
  #   public iss; internal cluster KC JWK URL — JwtDecoder bean
  #   permission-service'tekiyle aynı pattern)
  # - MANAGEMENT_TRACING_ENABLED=false + SAMPLING=0.0: Tempo deploy
  #   DEFER (Faz 23.8); tracing autoconfig komple disable
  # - NOTIFY_SECURITY_DEFAULT_ORG_ID="" (PR-5.4 strict)
  # - NOTIFY_SECURITY_SUBSCRIBER_IDENTITY_STRICT="true" (PR-5.5 strict)
  - target:
      kind: ConfigMap
      name: notification-orchestrator-config
    patch: |-
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://postgres:5432/notify_db"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "true"
      - op: add
        path: /data/LOGGING_LEVEL_ROOT
        value: "INFO"
      - op: add
        path: /data/LOGGING_LEVEL_COM_SERBAN_NOTIFY
        value: "INFO"
      # JWT validation — prod public issuer + internal cluster KC JWK
      # (JwtDecoder bean: NimbusJwtDecoder.withJwkSetUri + JwtValidators
      # .createDefaultWithIssuer; public-domain hairpin yok).
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/serban/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://ai.acik.com/realms/serban"
      # Faz 23.6 PR-5.4 strict default-org-id flip (test cluster bugün
      # LIVE, sustained 4h+ source="default"=0 increase; aynı strict
      # boundary prod'da da geçerli — multi-tenant canlı öncesi gate).
      - op: add
        path: /data/NOTIFY_SECURITY_DEFAULT_ORG_ID
        value: ""
      # Faz 23.6 PR-5.5 strict subscriber identity cutover (test cluster
      # bugün LIVE, denied counter sıfır kaldı 41+ min; aynı strict
      # mode prod'da da geçerli).
      - op: add
        path: /data/NOTIFY_SECURITY_SUBSCRIBER_IDENTITY_STRICT
        value: "true"
      # Tracing fully disabled — Tempo collector prod'da da deploy
      # edilmemiş; OTLP autoconfig'i aktive etmek pod boot'u kırardı
      # (test cluster'da PR #417 sırasında OtlpHttpSpanExporter
      # "Invalid endpoint" CrashLoopBackOff yaşandı). Faz 23.8 minimal
      # observability cycle'ında Tempo deploy + re-activate.
      - op: add
        path: /data/MANAGEMENT_TRACING_ENABLED
        value: "false"
      - op: add
        path: /data/MANAGEMENT_TRACING_SAMPLING_PROBABILITY
        value: "0.0"
      # Faz 23.7 Step C audit retention activation (Codex thread `019e0892`
      # priority 3, KVKK Art.7 compliance — saklama süresi sınırlandırma).
      # AuditPartitionRetentionService is @ConditionalOnProperty
      # (notify.audit.retention-enabled=true); base default is false.
      # Activated 2026-05-08 with retention-dry-run=true initial cycle.
      # First 02:00 UTC tick (2026-05-09) ran clean: leader pod m77zh
      # logged `cycle: future_created=0 detached=0 dropped=0 dry_run=true`
      # + `[dry-run] would CREATE partition audit_event_v2_2026_08`. NO
      # `[dry-run] would DETACH ...` log lines = no eligible candidates
      # for first non-dry-run flip (= NO-OP for DETACH/DROP).
      #
      # Step C.2 dry-run=false flip (Codex `019e0b9f` strategic continuation
      # + `019e0bb6` peer review chain): retention-dry-run flipped to false
      # so the next 02:00 UTC tick actually executes the
      # CREATE/DETACH/DROP code paths. Backend test gap closed by
      # platform-backend AuditPartitionRetentionDetachDropTest (PR #130);
      # alert observability hardened by gitops PR #435 (LockSkipped multi-
      # pod aware, preflight script schema-aligned, current-state truth
      # delta); SLO visualization extended by PR #436 (panels 13-15).
      # retention-days=90 inherited from base configmap (KVKK default).
      - op: add
        path: /data/NOTIFY_AUDIT_RETENTION_ENABLED
        value: "true"
      - op: add
        path: /data/NOTIFY_AUDIT_RETENTION_DRY_RUN
        value: "false"
      # P1.2 M3 next gate (Faz 23.2.A T1.1.8 P0.4 prod activation,
      # Codex 019e1307 iter-3 RED absorb 2026-05-10):
      # Unsubscribe email-link base URL prod-host. ProductionConfigValidator
      # validateUnsubscribeBaseUrl() URI parser allowlist:
      # - HTTPS scheme required
      # - Host: exact ai.acik.com OR .acik.com suffix (multi-tenant)
      # - Test/dev subdomain blocklist (testai, test.*, dev.*, staging.*, staging-sw.*)
      - op: add
        path: /data/NOTIFY_UNSUBSCRIBE_BASE_URL
        value: "https://ai.acik.com/api/v1/notify/unsubscribe"
      # SMTP TLS hard enforcement (Codex 019e1307 iter-3 prerequisite for
      # ProductionConfigValidator activation; aynı pattern test cluster'da
      # 41+ min sustained doğrulandı). validateSecret() ve validateSmtp*()
      # guards prod profile'da fail-closed; default false → NotifyConfigVal
      # exception → pod CrashLoopBackOff.
      - op: add
        path: /data/NOTIFY_SMTP_TLS_ENFORCE
        value: "true"
      - op: add
        path: /data/SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
        value: "true"
      - op: add
        path: /data/SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED
        value: "true"
      - op: add
        path: /data/SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_CHECKSERVERIDENTITY
        value: "true"

  # Faz 23.9 prod cutover — notification-orchestrator pod-template
  # annotation rollout trigger + replicas override. ConfigMap envFrom
  # değişmesi pod restart tetiklemez; bu annotation rolling restart
  # sağlar. Base D17 scale-to-zero (replicas: 0) → prod replicas: 2
  # (D21 prod replica baseline; SSE multi-pod cross-broadcast PR-E.4
  # PG LISTEN/NOTIFY ile çözüldü, HPA min=max=1 lock kaldırıldı).
  - target:
      kind: Deployment
      name: notification-orchestrator
    patch: |-
      # 2026-05-10 (PR-471b): replicas 2 → 1 (kullanıcı kararı: prod default 1).
      # HPA min=1 max=3, custom metric backlog ile yük altında scale-up.
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/metadata/annotations
        value:
          security.acik.com/strict-cutover-activation: "faz-23-9-prod"
          # Faz 23.7 Step C audit retention activation rollout trigger
          # (Codex thread 019e090d iter-1 absorb): ConfigMap envFrom only
          # reads at pod start → annotation bump forces rolling restart so
          # AuditPartitionRetentionService bean gets instantiated under
          # the new NOTIFY_AUDIT_RETENTION_ENABLED=true config.
          compliance.acik.com/audit-retention-cycle: "pr-c-2-flip-2026-05-09"

  # Ingress host + TLS host: ai.acik.com (D18)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ai.acik.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: ai.acik.com

  # Host bridge prod portları (D20)
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.21.0.4"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.21.0.5"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8080
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.21.0.6"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200

  # Prod ResourceQuota: 2 replica + openfga/job toplam limit bütçesi
  - target:
      kind: ResourceQuota
      name: platform-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "8"
      - op: replace
        path: /spec/hard/requests.memory
        value: 8Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "24"
      - op: replace
        path: /spec/hard/limits.memory
        value: 24Gi
