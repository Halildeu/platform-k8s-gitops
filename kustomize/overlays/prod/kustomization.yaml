# Prod overlay — k3d-prod (staging-sw canlı)
# - Image: GHCR tag (sha-<short>)
# - Host bridge: 10.9.10.53:5432/8081/8200 (D20)
# - Replica: 2 sabit (D21)
# - Namespace: platform-prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-prod

resources:
  - ../../base

images:
  # Gerçek GHCR path: halildeu/platform-ssot-<service> (tire ile)
  # Prod için main-stable tag (runtime rolling). Canlı cutover öncesi CI'nın
  # verdiği specific digest'e (@sha256:...) pinlenir — D26 Codex Tur-4.
  - name: auth-service
    newName: ghcr.io/halildeu/platform-ssot-auth-service
    newTag: main-stable
  - name: api-gateway
    newName: ghcr.io/halildeu/platform-ssot-api-gateway
    newTag: main-stable

patches:
  # ConfigMap: platform-prod namespace
  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-prod.svc.cluster.local:8080"
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://postgres.platform-prod.svc.cluster.local:5432/auth_db"
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/AUTH_SERVICE_URL
        value: "http://auth-service.platform-prod.svc.cluster.local:8088"
      - op: replace
        path: /data/KEYCLOAK_URL
        value: "http://keycloak.platform-prod.svc.cluster.local:8080"
      - op: replace
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_0_URI
        value: "http://auth-service.platform-prod.svc.cluster.local:8088"

  # Ingress host + TLS host: ai.acik.com (D18)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ai.acik.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: ai.acik.com

  # Host bridge prod portları (D20)
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "10.9.10.53"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "10.9.10.53"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8081
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "10.9.10.53"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200
