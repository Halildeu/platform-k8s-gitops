# Prod overlay — k3d-prod (staging-sw canlı)
# - Image: GHCR tag (sha-<short>)
# - Host bridge: 10.9.10.53:5432/8081/8200 (D20)
# - Replica: 2 sabit (D21)
# - Namespace: platform-prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-prod

resources:
  - namespace.yaml    # Namespace + labels (platform=true env=prod, ApplicationSet prereq)
  - ../../base
  - ../../base/apps/ops-bundle    # Faz 17.2.5: ExternalSecret + ServiceMonitor CRD paketi (runtime'dan ayrı)
  # Faz 19.MSSQL.F: bridge proxy container IP per-cluster (network teşhisi sonrası — k3d cluster → 10.9.193.0/24 routing fail)
  - endpoints-workcube-mssql.yaml    # 172.21.0.7 (workcube-mssql-proxy-prod, alpine/socat)
  - netpol-workcube-mssql.yaml       # egress 172.21.0.7/32:11433

images:
  # Gerçek GHCR path: halildeu/platform-ssot-<service> (tire ile)
  # Prod için sha-60611fa tag (runtime rolling). Canlı cutover öncesi CI'nın
  # verdiği specific digest'e (@sha256:...) pinlenir — D26 Codex Tur-4.
  # Faz 19.9 CUTOVER v2 (Codex AGREE 019dc0ef Option B, ADR-0004):
  # Source: platform-backend + platform-web (Faz 19.1 filter-repo + 19.8 ci-image-push).
  # Pin: @sha256:digest (D30 immutable, moving tag YASAK).
  # GHCR packages PRIVATE; erişim: ghcr-pull Secret (ESO kv/gitops/ghcr-token → Halildeu PAT).

  - name: auth-service
    newName: ghcr.io/halildeu/platform-backend-auth-service
    digest: sha256:c84bc6b04f7f17cc145024d6eeff2c624c52704a259ce843aeea63444da9ed37
  - name: api-gateway
    newName: ghcr.io/halildeu/platform-backend-api-gateway
    digest: sha256:5e7f0d48bfe080e59034ece9399390e6543c97d13c8e799c4a1bb9d1e9cd0d09
  - name: user-service
    newName: ghcr.io/halildeu/platform-backend-user-service
    digest: sha256:df8b84d0cd02d064cf455f40017bd5cb4ca1be271e5e7068afeb36fc4526a7f1
  - name: variant-service
    newName: ghcr.io/halildeu/platform-backend-variant-service
    digest: sha256:4a51a49f1b07cf6e211bff5bd01cc68946a85b522c5d7cc171718ac85d892d13
  - name: core-data-service
    newName: ghcr.io/halildeu/platform-backend-core-data-service
    digest: sha256:b803507ac6b17240a8cced6878606f2aad7b31856140d6b5071352135babf37f
  - name: report-service
    newName: ghcr.io/halildeu/platform-backend-report-service
    digest: sha256:1d38fe3f3439067eeaae1d2015d470a3273074c6509589b54e7422fd749cc8b1
  - name: schema-service
    newName: ghcr.io/halildeu/platform-backend-schema-service
    digest: sha256:1a0e3f02664b5f431496a3443bd6603dfea3dd01a9bb7694e45e6e24d46f9a02
  - name: permission-service
    newName: ghcr.io/halildeu/platform-backend-permission-service
    # 2026-05-03 Session 37 ArgoCD OutOfSync drift realign:
    # Prod cluster `kubectl set image` ile yeni digest'e geçirildi (manual
    # promotion önceki sprint'lerden), overlay yaml update edilmedi → ArgoCD
    # `platform-prod` application OutOfSync. Yeni digest cluster gerçeği ile
    # uyumlu. Önceki digest sha256:1da34913 (RequireModuleInterceptor relation
    # alias, PR #19+#20+#21+#22 chain) — replaced by sha256:10cba617 prod live.
    digest: sha256:10cba61702cd66798330c86b0eecdfb1786eae8ad65f60c80067056698d06d96
  # Frontend prod variant (ai.acik.com + serban realm)
  # 2026-05-03 Session 37: AG Grid lisans bytes-fix + single-source refactor +
  # buildx cache scope-v2 rename hotfix branch (`hotfix/ag-grid-license-rebuild`,
  # main-fix sub-task spawn'da blocked: Vite 8 + Module Federation top-level
  # await). Image build #25276216345 sha-331c515 prod variant. Cluster `kubectl
  # set image` Session 37 edge migration sırasında apply edildi. Önceki digest
  # sha256:d6baaf5838 (Faz 21.3 PR-E mfe-access Veri Erişimi panel) — replaced
  # by sha256:cc487c5584 cluster live.
  - name: frontend
    newName: ghcr.io/halildeu/platform-web-frontend
    digest: sha256:cc487c5584f96d78bb86101e871963203de2de5cc7f5741253e32a638a5d3b55

patches:
  # 2026-04-19 S2-A1 follow-up: Shortname refactor sonrası gereksiz replace
  # patches KALDIRILDI. Base zaten shortname (postgres:5432, keycloak:8080,
  # auth-service:8088, gateway routes 0-5). Prod-specific override YOK,
  # overlay sadece namespace (platform-prod) + Ingress host + Endpoints pin.
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
      # Faz 21.3 D35-2-full follow-up (Codex 019dd409 gateway external 500
      # root cause fix): base'de KEYCLOAK_JWKS_URI artık OVERLAY_MUST_OVERRIDE
      # placeholder; prod overlay explicit JWKS path set etmeli (issuer
      # external `https://...` ama JWKS internal cluster Keycloak'tan okunur).
      - op: replace
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/serban/protocol/openid-connect/certs"
  - target:
      kind: ConfigMap
      name: variant-service-config
    patch: |-
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account"
  - target:
      kind: ConfigMap
      name: permission-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://ai.acik.com/realms/serban"
      # 2026-05-04 Session 37: prod-only super-admin bootstrap addition.
      # halil.kocoglu@serban.com.tr was created as a Keycloak realm user
      # (KC ID d14c0a96-4e61-4b9a-9a69-43e8424e14fb) per the operator's
      # request. Bootstrap-admin-assigner re-asserts super-admin role on
      # every permission-service pod restart for emails in this list, so
      # adding halil.kocoglu here gives the account super-admin authority
      # on first login (KC → user-service sync → permission-service seed).
      # Test cluster keeps the base list (admin@example.com,
      # d35-admin@example.com) — no halil.kocoglu spillover.
      - op: replace
        path: /data/PERMISSION_BOOTSTRAP_DEFAULT_ADMIN_ASSIGNMENTS_ADMIN_EMAILS
        value: "admin@example.com,d35-admin@example.com,halil.kocoglu@serban.com.tr"

  # 2026-05-04 Faz 22.1.x: Prod'da REPORTS_DB_ENABLED=false → reports_db
  # secondary datasource bean instantiate olmaz (permission-service
  # ReportsDbDataSourceConfig @ConditionalOnProperty). Ama ExternalSecret
  # base'de reports_db_username + reports_db_password remoteRef referans var
  # → Vault'ta field yok → ESO SecretSyncedError → ArgoCD platform-prod
  # Healthy=Degraded.
  #
  # Codex 019dd296 verdict B test pattern: test cluster'da Vault'a
  # `reports_db_username/password` field'ları db_username/password aliases
  # olarak yazılmış (test scope, REPORTS_DB_ENABLED=true). Prod scope için
  # security separation: reports_db için ayrı read-only DB user gerek
  # (manuel operatör iş, ADR-0010 §2.5 Vault credential lifecycle).
  #
  # Geçici çözüm (REPORTS_DB_ENABLED=true olunca add-back):
  # ExternalSecret data[6]+data[7] (reports_db_username/password) prod
  # overlay'de remove. Base manifest aynı kalır (test'te 8 entry hepsi
  # gerekli). Prod'da 6 entry → ESO SecretSyncedError çözülür.
  - target:
      kind: ExternalSecret
      name: permission-service-secrets
    patch: |-
      - op: remove
        path: /spec/data/7
      - op: remove
        path: /spec/data/6

  # Ingress host + TLS host: ai.acik.com (D18)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ai.acik.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: ai.acik.com

  # Host bridge prod portları (D20)
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.21.0.4"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.21.0.5"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8080
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.21.0.6"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200

  # Prod ResourceQuota: 2 replica + openfga/job toplam limit bütçesi
  - target:
      kind: ResourceQuota
      name: platform-quota
    patch: |-
      - op: replace
        path: /spec/hard/requests.cpu
        value: "8"
      - op: replace
        path: /spec/hard/requests.memory
        value: 8Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "24"
      - op: replace
        path: /spec/hard/limits.memory
        value: 24Gi
