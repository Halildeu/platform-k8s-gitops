# #3888 — alertmanager-bridge SMS recipients (PROD).
#
# Phone numbers are PII: they live only in Vault, never in git.
# Vault leaf kv/platform/alert-recipients, property sms_to = comma-separated
# numbers in 90XXXXXXXXXX form (JetSMS format, no leading +). Seeded by the
# owner-approved #3888 step (stdin, no shell-history echo).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-bridge-recipients
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-bridge
    app.kubernetes.io/component: monitoring-paging
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: alertmanager-bridge-recipients
    creationPolicy: Owner
  data:
    - secretKey: ALERT_SMS_TO
      remoteRef:
        key: kv/platform/alert-recipients
        property: sms_to
