# #3888 — alertmanager-bridge operator paging credentials (PROD).
#
# Owner decision 2026-10-22: alerts page via SMS + email to ai@acik.com (no
# Teams); owner approved reusing the live notification-orchestrator JetSMS +
# Graph credentials for the bridge (#3888 comment, "1-4 onaylıyorum").
# The bridge calls JetSMS (SOAP SendSMSSingle) and Microsoft Graph sendMail
# directly — NOT through notification-orchestrator — so a notify outage still
# pages a human (D43 bypass principle).
#
# No new credential is minted: the leaf kv/platform/notification-orchestrator
# already backs prod SMS (JetSMS canary 2026-05-25) and Graph mail (sender
# ai@acik.com). Recipient phone numbers live in a separate PII leaf
# (externalsecret-alertmanager-bridge-recipients.yaml) so a missing recipient
# never breaks credential sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-bridge-notify
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-bridge
    app.kubernetes.io/component: monitoring-paging
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: alertmanager-bridge-notify
    creationPolicy: Owner
  data:
    - secretKey: JETSMS_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_jetsms_username
    - secretKey: JETSMS_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_jetsms_password
    - secretKey: JETSMS_ORIGINATOR
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_jetsms_originator
    - secretKey: GRAPH_TENANT_ID
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: graph_tenant_id
    - secretKey: GRAPH_CLIENT_ID
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: graph_client_id
    - secretKey: GRAPH_CLIENT_SECRET
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: graph_client_secret
