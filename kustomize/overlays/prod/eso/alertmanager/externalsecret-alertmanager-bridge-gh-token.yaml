# BL-008-bridge — Alertmanager Bridge GitHub Token ExternalSecret (PROD)
#
# Bağlam: D43 outage fallback chain'in 3. leg'i (Teams primary, SMTP secondary,
# GitHub Issue auto-create tertiary). Bridge GITHUB_TOKEN env eksik kaldığı için
# 12+ gündür `gh issue create` silent fail (`alertmanager-bridge-gh-token` Secret
# 13d age, `token` field length=0). NotifyServiceAbsent / PrometheusRuleFailures /
# OpenFGADown gibi kritik alarmlar undelivered.jsonl (emptyDir) içine düşüyor.
#
# Kalıcı çözüm (HARD RULE 2026-05-27 Uzun Vadeli Kalıcı Çözüm):
# Önceki manual `kubectl create secret --from-literal=token=...` pattern (RB
# §2.2, V2 scope) yerine ESO + Vault migration. Diğer monitoring receiver
# pattern'leri (alertmanager-fallback, perf-alertmanager-teams-secrets) ile
# tutarlı; 1h refresh + Vault rotation tek source-of-truth + Ready=True
# machine-enforced kanıt.
#
# Codex `019e6de3` AGREE B path: Operator fine-grained PAT acil restore;
# A path (GitHub App) long-term migration (90 gün); C path (PAT reuse) YASAK;
# D path (raw v4 mismatch) superseded.
#
# Operator init (PR merge öncesi/aynı saat — owner action — BL-008-bridge scope):
#   # 1. GitHub Settings → Developer Settings → Personal Access Tokens (fine-grained):
#   #    - Repository: Halildeu/platform-k8s-gitops
#   #    - Permissions: Issues: Read and write (only — scope minimal)
#   #    - Expiration: 90 days
#   #    - Note: "alertmanager-bridge prod D43 paging (BL-008-bridge)"
#   #    - Copy token (ekrana 1 kez gösterilir)
#   #
#   # 2. Vault seed (D43 stdin-pipe pattern, no-token-log HARD RULE):
#   read -r -s BRIDGE_PAT
#   [[ "$BRIDGE_PAT" =~ ^(ghp_|github_pat_) ]] && echo "PAT prefix OK"
#   printf '%s' "$BRIDGE_PAT" | ssh aiadmin@aiserver '
#     VAULT_ROOT_TOKEN=$(sudo -n jq -r .root_token /srv/platform/secrets/backup-auth/vault-init-prod.json)
#     sudo -n docker exec -i -e VAULT_TOKEN="$VAULT_ROOT_TOKEN" platform-vault-prod \
#       vault kv put kv/platform/alertmanager-bridge-gh GITHUB_TOKEN=-
#     unset VAULT_ROOT_TOKEN
#   '
#   unset BRIDGE_PAT
#
# Refresh interval 1h.
#
# K8s Secret mount (alertmanager-bridge Deployment env):
#   GITHUB_TOKEN ← secretKeyRef name=alertmanager-bridge-gh-token key=token (optional:true)
#   Bridge container `apk add github-cli` + gh CLI auth via env GITHUB_TOKEN.
#
# Migration pre-req:
#   Mevcut manual K8s secret `alertmanager-bridge-gh-token` (13d age, token='')
#   delete edilmeli ki ESO creationPolicy=Owner ile fresh create edebilsin:
#     kubectl --context k3d-prod -n monitoring delete secret alertmanager-bridge-gh-token
#   Sonra: kubectl apply -k kustomize/overlays/prod/eso/alertmanager/
#
# Acceptance:
#   - ExternalSecret Ready=True (Vault key var, ESO sync başarılı)
#   - K8s Secret `alertmanager-bridge-gh-token` token field length >40 (fine-grained ~93 char)
#   - Bridge pod rollout restart sonrası GITHUB_TOKEN env loaded
#   - D43 synthetic alert → GitHub Issue auto-create + comment + close on resolve
#   - Bridge metric `alertmanager_bridge_undelivered_by_reason_total{reason="gh_issue_create_failed"}` = 0
#
# Long-term migration (90 gün öncesi, Codex `019e6de3` A path):
#   PAT → GitHub App (org-level, no individual expiry, fine-grained installation token).
#   Bu ExternalSecret zaten Vault-managed; App geçişi sadece Vault property rename
#   (GITHUB_APP_PRIVATE_KEY + GITHUB_APP_INSTALLATION_ID) + bridge script update.
#
# Cross-AI peer review chain: Codex thread `019e6de3` plan-time AGREE B path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-bridge-gh-token
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager-bridge
    app.kubernetes.io/component: monitoring-fallback
    app.kubernetes.io/part-of: platform
    notify.acik.com/channel: github-issues
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: alertmanager-bridge-gh-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: kv/platform/alertmanager-bridge-gh
        property: GITHUB_TOKEN
