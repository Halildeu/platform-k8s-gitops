# Alertmanager fallback secret — Faz 23.2.D T1.4 D43 outage fallback (PROD).
#
# Bağlam: notification-orchestrator down olduğunda kritik alert/audit'lerin
# kaybolmaması için Alertmanager'a direct Microsoft Teams + SMTP credentials sağlar.
# Orchestrator path'i ile AYRI Vault path → bağımsız rotation + defense-in-depth.
#
# 2026-05-24 SLACK → TEAMS PIVOT (Codex thread `019e5ba9`):
#   Organizasyon Slack kullanmıyor, Microsoft Teams kullanıyor (kullanıcı kararı
#   2026-05-24). Alertmanager `slack_configs` → `webhook_configs` (Power Automate
#   workflow incoming webhook). Secret key `SLACK_WEBHOOK_URL` → `TEAMS_WEBHOOK_URL`.
#   Vault path `kv/platform/alertmanager-fallback` korunur; sadece key adı ve
#   `url_file` path'i değişir. Receiver type rename (slack_configs → webhook_configs)
#   helm-values/values-prod.yaml + values-test-d43-drill.yaml içinde.
#
# OPS-PREREQ (merge edilmeden apply EDİLMEZ):
#   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-prod \
#     vault kv put kv/platform/alertmanager-fallback \
#       TEAMS_WEBHOOK_URL=<Teams Power Automate workflow HTTP POST endpoint — drill+real-outage flow> \
#       SMTP_HOST=<prod SMTP relay; orchestrator ile aynı server kabul, ama AYRI user> \
#       SMTP_PORT=587 \
#       SMTP_USER=alertmanager-fallback@<prod-domain> \
#       SMTP_PASSWORD=<fallback user'a ait şifre>
#
# Teams Power Automate flow (operator-side, bu PR scope DIŞI):
#   Trigger: "When an HTTP request is received" → Alertmanager v4 webhook JSON parse
#   Action: "Post adaptive card in a chat or channel" → Teams target channel
#   Owner: service-account or team-owned flow (R-NEW: lifecycle risk)
#
# Refresh interval 1h.
#
# Mount path (Alertmanager pod, kube-prometheus-stack alertmanagerSpec.secrets[]):
#   /etc/alertmanager/secrets/alertmanager-fallback-secrets/<key>
#
# Backward-compat: eski SLACK_WEBHOOK_URL Vault path'te tutulabilir (rollback
# window); ama yeni desired-state Teams. Operator Teams seed sonrası eski
# Slack key Vault'tan silebilir (P2 cleanup, operator action).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-fallback-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring-fallback
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: alertmanager-fallback-secrets
    creationPolicy: Owner
  data:
    # 2026-05-24 Teams pivot (Codex thread `019e5ba9`): SLACK_WEBHOOK_URL →
    # TEAMS_WEBHOOK_URL. Vault path korunur, sadece property + secretKey rename.
    - secretKey: TEAMS_WEBHOOK_URL
      remoteRef:
        key: kv/platform/alertmanager-fallback
        property: TEAMS_WEBHOOK_URL
    - secretKey: SMTP_HOST
      remoteRef:
        key: kv/platform/alertmanager-fallback
        property: SMTP_HOST
    - secretKey: SMTP_PORT
      remoteRef:
        key: kv/platform/alertmanager-fallback
        property: SMTP_PORT
    - secretKey: SMTP_USER
      remoteRef:
        key: kv/platform/alertmanager-fallback
        property: SMTP_USER
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: kv/platform/alertmanager-fallback
        property: SMTP_PASSWORD
