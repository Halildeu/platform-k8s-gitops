apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: perf-alertmanager-teams-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: perf-alerts
    app.kubernetes.io/part-of: platform
    notify.acik.com/channel: teams        # ADR-0029 D5 multi-tenant marker (active)
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: perf-alertmanager-teams-secrets
    creationPolicy: Owner
  data:
    - secretKey: TEAMS_WEBHOOK_URL
      remoteRef:
        key: kv/platform/perf-alertmanager
        property: TEAMS_WEBHOOK_URL
