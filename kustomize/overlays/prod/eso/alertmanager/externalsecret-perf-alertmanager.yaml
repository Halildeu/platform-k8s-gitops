# V2.1 Ops-A — Perf alert receiver ESO ExternalSecret (A2 isolation, prod)
#
# Bağlam: test cluster pattern ile aynı; ayrı `kv/platform/perf-alertmanager`
# Vault path. Owner aynı path'i hem test hem prod Vault'a yazmalı; ya da
# alternatif olarak test/prod ayrı Vault path'leri (örn. `kv/platform/perf-alertmanager-test`
# ve `kv/platform/perf-alertmanager-prod`).
#
# 2026-05-24 SLACK → TEAMS PIVOT (Codex thread `019e5ba9`):
#   Organizasyon Microsoft Teams kullanıyor. perf-alerts-slack receiver →
#   perf-alerts-teams; Alertmanager `slack_configs` → `webhook_configs`
#   (Power Automate workflow). Secret key `SLACK_WEBHOOK_URL` → `TEAMS_WEBHOOK_URL`.
#   Vault path aynı. Owner Teams workflow channel-routing'i kendi flow'unda yönetir.
#
# Operator init (prod cluster için, owner action):
#   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-prod \
#     vault kv put kv/platform/perf-alertmanager \
#       TEAMS_WEBHOOK_URL=<Teams Power Automate workflow URL — #perf-alerts target channel>
#
# Refresh interval 1h.
#
# Mount path (kube-prometheus-stack alertmanagerSpec.secrets[]):
#   /etc/alertmanager/secrets/perf-alertmanager-secrets/TEAMS_WEBHOOK_URL
#
# Cross-AI peer review: Codex thread 019e267a iter-1 → iter-2 AGREE_AFTER_REVISIONS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: perf-alertmanager-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: perf-alerts
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: perf-alertmanager-secrets
    creationPolicy: Owner
  data:
    # 2026-05-24 Teams pivot (Codex thread `019e5ba9`): SLACK_WEBHOOK_URL →
    # TEAMS_WEBHOOK_URL.
    - secretKey: TEAMS_WEBHOOK_URL
      remoteRef:
        key: kv/platform/perf-alertmanager
        property: TEAMS_WEBHOOK_URL
