# V2.1 Ops-A — Perf alert receiver ESO ExternalSecret (A2 isolation, prod)
#
# Bağlam: test cluster pattern ile aynı; ayrı `kv/platform/perf-alertmanager`
# Vault path. Owner aynı path'i hem test hem prod Vault'a yazmalı; ya da
# alternatif olarak test/prod ayrı Vault path'leri (örn. `kv/platform/perf-alertmanager-test`
# ve `kv/platform/perf-alertmanager-prod`).
#
# Şu an aynı path tercih edildi (Codex tur-2 absorb: test→prod webhook
# differentiation Slack workspace channel'da değil URL'de). Owner Slack
# webhook'a `team=perf` ek field veya Slack workspace separate kanal
# kullanarak ortam ayrımı yapar.
#
# Operator init (prod cluster için, owner action):
#   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-prod \
#     vault kv put kv/platform/perf-alertmanager \
#       SLACK_WEBHOOK_URL=https://hooks.slack.com/services/T.../B.../...
#
# Refresh interval 1h.
#
# Mount path (kube-prometheus-stack alertmanagerSpec.secrets[]):
#   /etc/alertmanager/secrets/perf-alertmanager-secrets/SLACK_WEBHOOK_URL
#
# Cross-AI peer review: Codex thread 019e267a iter-1 → iter-2 AGREE_AFTER_REVISIONS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: perf-alertmanager-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: perf-alerts
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: perf-alertmanager-secrets
    creationPolicy: Owner
  data:
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: kv/platform/perf-alertmanager
        property: SLACK_WEBHOOK_URL
