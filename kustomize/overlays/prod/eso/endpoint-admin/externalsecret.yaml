# endpoint-admin-service ExternalSecret — prod overlay (Faz 22.5 P2-A A1 first prod deploy)
#
# Mirror of overlays/test/eso/endpoint-admin/externalsecret.yaml with
# namespace platform-prod. Vault path identical (kv/platform/endpoint-admin-service)
# but VALUES are prod-specific (independent rotation surface — operator-bound
# seed via DR-9 or generate-root pattern; ADR-0010 §2.5).
#
# Vault path: kv/platform/endpoint-admin-service (prod vault, host-compose
# 127.0.0.1:8202 via cluster Endpoints → ESO ClusterSecretStore
# vault-platform-gitops via approle).
#
# 6 secret key sync: SPRING_DATASOURCE_USERNAME + SPRING_DATASOURCE_PASSWORD +
# ENDPOINT_ADMIN_ENROLLMENT_TOKEN_PEPPER + ENDPOINT_ADMIN_SECRET_ENCRYPTION_KEY +
# ERP_OPENFGA_STORE_ID + ERP_OPENFGA_MODEL_ID.
#
# OpenFGA store/model selectors are sourced from shared kv/platform/openfga
# instead of endpoint-admin ConfigMap pins. Prod Vault values remain prod-
# specific; this manifest only removes stale hard-coded overlay IDs.
# Refresh interval 1h (mirrors test cadence).
#
# OPS-PREREQ (apply EDİLMEZ önce):
#   1. Prod Vault kv/platform/endpoint-admin-service path 4 key seed edilmiş olmalı
#      (db_username, db_password, enrollment_token_pepper, device_secret_encryption_key)
#   2. Prod Vault kv/platform/openfga path store_id + model_id seed edilmiş olmalı
#      (prod-specific values; not copied from test)
#   3. Prod PG `endpoint_admin` DB + role create edilmiş olmalı (password = vault.db_password)
#   4. ClusterSecretStore `vault-platform-gitops` prod cluster'da Ready=True
#      (kubectl --context k3d-prod get clustersecretstore — verify 40d Ready)
#
# Apply order: önce platform-eso-prod sync → ExternalSecret Ready=True → sonra
# platform-prod workload sync (Codex 019e8c3a Step 4 ESO-first gate).

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endpoint-admin-service-secrets
  namespace: platform-prod
  labels:
    app.kubernetes.io/name: endpoint-admin-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: endpoint-admin-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: db_password
    - secretKey: ENDPOINT_ADMIN_ENROLLMENT_TOKEN_PEPPER
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: enrollment_token_pepper
    - secretKey: ENDPOINT_ADMIN_SECRET_ENCRYPTION_KEY
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: device_secret_encryption_key
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef:
        key: kv/platform/openfga
        property: store_id
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef:
        key: kv/platform/openfga
        property: model_id
