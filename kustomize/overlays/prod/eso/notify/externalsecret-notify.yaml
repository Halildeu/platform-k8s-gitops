# notification-orchestrator prod ExternalSecret — Faz 23.9 Step D
# (Codex thread `019e0892` post-cutover ESO/Vault prod hardening).
#
# Vault path layout (flat, auth-service / user-service convention):
#   kv/platform/notification-orchestrator
#     - db_username
#     - db_password
#     - webhook_signing_secret
#     - authz_internal_api_key
#     - redaction_pepper
#
# Operator init (one-shot, populated 2026-05-08):
#   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-prod \
#     vault kv put kv/platform/notification-orchestrator \
#       db_username=platform \
#       db_password=<from existing notification-orchestrator-secrets> \
#       webhook_signing_secret=<...> \
#       authz_internal_api_key=<...> \
#       redaction_pepper=<...>
#
# Both test (`overlays/test/eso/notify/externalsecret-notify.yaml`) and prod use
# the same flat single-path layout (consolidated 2026-05-08 in Codex thread
# `019e08df` iter-1 REVISE absorb). Earlier test split layout (kv/platform/notify/
# {db,redaction,webhook,authz,smtp,slack}) was over-engineered for SMTP/Slack
# channels not yet wired and stayed in `SecretSyncedError` from 2026-05-07 to
# 2026-05-08. Flat path matches the working pattern of the other 10 platform
# service ExternalSecrets.
#
# Future SMTP/Slack additions: extend this manifest with extra remoteRef entries (no
# need to split into separate Vault paths until rotation policies actually diverge).
#
# Refresh interval 1h. creationPolicy=Owner — ESO takes over the existing
# notification-orchestrator-secrets Secret (currently a direct kubectl Secret created
# during prod cutover; this PR moves it under Vault management).

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-orchestrator-secrets
  namespace: platform-prod
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: notification-orchestrator-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: db_password
    - secretKey: NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: webhook_signing_secret
    - secretKey: NOTIFY_AUTHZ_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: authz_internal_api_key
    - secretKey: NOTIFY_REDACTION_PEPPER
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: redaction_pepper
    # P1.2 M3 next gate (Faz 23.2.A T1.1.8 P0.4 prod activation prerequisite,
    # 2026-05-10 Codex 019e1307 iter-3 RED absorb).
    # Test overlay 2026-05-09 onwards already had these 10 keys (sms_*, dlr_token,
    # teams_*, slack_*, fcm_*, apns_*, vapid_*, unsubscribe_signing_secret).
    # Prod parity required for ProductionConfigValidator activation
    # (SPRING_PROFILES_ACTIVE=k8s,prod) + multi-channel adapter + unsubscribe
    # email-link integrity in prod cluster.
    #
    # Vault prod seed sequence (Pre-Production Full Authority — same pattern
    # as test seed P0.3 2026-05-10 17:41Z + sms seed 2026-05-10 06:41Z):
    #   docker exec -e VAULT_TOKEN=$PROD_ROOT platform-vault-prod \
    #     vault kv patch kv/platform/notification-orchestrator \
    #       sms_netgsm_username='' sms_netgsm_password='' sms_netgsm_msgheader='Notify' \
    #       dlr_token='' \
    #       teams_webhook_url='' slack_bot_token='' \
    #       fcm_service_account_key='' apns_auth_key='' \
    #       unsubscribe_signing_secret="$(openssl rand -hex 32)"
    #
    # Empty defaults trigger fail-closed in their respective adapters
    # (NetGSM: "credentials missing", Teams/Slack/FCM/APNS: channel disabled).
    # unsubscribe_signing_secret is the only one populated with cryptographic
    # value (guard hits before any adapter); other keys filled post-channel-activation.
    #
    # NOT: WebPush VAPID triple (vapid_public_key, vapid_private_key,
    # vapid_subject) bu seed set'ine DAHİL DEĞİL — defer-aware pattern
    # (Faz 23.7 PR-W4). Backend WebPushConfig 3 key'in HEPSİNİ
    # @NotBlank doğrular; boş seed'le adapter @PostConstruct fail-closed
    # olur (channel disabled değil, pod boot break). Reactivation chain
    # bu dosyanın altındaki "WebPush VAPID 3 remoteRef entries —
    # DEFER-AWARE COMMENTED OUT" bloğunda detaylı.
    #
    # SMS NetGSM (Faz 23.3.1 — same as test):
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_netgsm_username
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_netgsm_password
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_MSGHEADER
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_netgsm_msgheader
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_DLR_TOKEN
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: dlr_token
    # Faz 23.3 SMS multi-provider — JetSMS primary credentials (prod parity).
    # platform-backend PR #249/#250/#252. Test overlay ile aynı flat path +
    # POLL-mode DLR (inbound webhook yok → dlr_token key'i yok). Empty default
    # → JetSmsProvider fail-closed.
    # Vault prod seed (operator, pre-PR-5 prod cutover — Pre-Production Full
    # Authority, test seed pattern'iyle aynı):
    #   docker exec -e VAULT_TOKEN=$PROD_ROOT platform-vault-prod \
    #     vault kv patch kv/platform/notification-orchestrator \
    #       sms_jetsms_username='' sms_jetsms_password='' sms_jetsms_originator=''
    # PR-5 prod cutover acceptance: ÜÇÜ de non-empty (primary-provider flip
    # öncesi). Codex thread 019e4022.
    - secretKey: NOTIFY_ADAPTERS_SMS_JETSMS_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_jetsms_username
    - secretKey: NOTIFY_ADAPTERS_SMS_JETSMS_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_jetsms_password
    - secretKey: NOTIFY_ADAPTERS_SMS_JETSMS_ORIGINATOR
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_jetsms_originator
    # T4.1 — Microsoft Teams + Slack Bot (M7 v1 prep):
    - secretKey: NOTIFY_ADAPTERS_TEAMS_WEBHOOK_URL
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: teams_webhook_url
    - secretKey: NOTIFY_ADAPTERS_SLACK_BOT_TOKEN
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: slack_bot_token
    # T4.2 — Push (FCM/APNS mobile — Faz 22.2 dep scope DIŞI; placeholders):
    - secretKey: NOTIFY_ADAPTERS_PUSH_FCM_SERVICE_ACCOUNT_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: fcm_service_account_key
    - secretKey: NOTIFY_ADAPTERS_PUSH_APNS_AUTH_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: apns_auth_key
    # Faz 23.7 M7 T4.2 PR-W4 — Web Push Protocol (RFC 8030 + RFC 8292 VAPID).
    # **DEFER-AWARE COMMENTED OUT** (Graph adapter pattern, ADR-0024):
    # ESO aggregate Ready=False if any remoteRef property missing.
    # Prod Vault'a vapid_* triple seedlenmeden bu entry'ler aktif edilmez.
    # Reactivation chain test overlay externalsecret-notify.yaml içinde detaylı.
    # Browser-only scope (Faz 22.2 mobile dep).
    #
    # --- WebPush VAPID 3 remoteRef entries — DEFER-AWARE COMMENTED OUT ---
    # - secretKey: NOTIFY_ADAPTERS_WEBPUSH_PUBLIC_KEY
    #   remoteRef:
    #     key: kv/platform/notification-orchestrator
    #     property: vapid_public_key
    # - secretKey: NOTIFY_ADAPTERS_WEBPUSH_PRIVATE_KEY
    #   remoteRef:
    #     key: kv/platform/notification-orchestrator
    #     property: vapid_private_key
    # - secretKey: NOTIFY_ADAPTERS_WEBPUSH_VAPID_SUBJECT
    #   remoteRef:
    #     key: kv/platform/notification-orchestrator
    #     property: vapid_subject
    # T1.1.8 — Unsubscribe email-link HMAC-SHA256 signing secret (Faz 23.2.A):
    # ProductionConfigValidator validateSecret() guard activates when
    # SPRING_PROFILES_ACTIVE=k8s,prod (P1.2 step 4 = profile flip patch).
    - secretKey: NOTIFY_UNSUBSCRIBE_SIGNING_SECRET
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: unsubscribe_signing_secret
    # A6 SMTP gateway prod credentials (Office 365 default + multi-provider:
    # generic SMTP AUTH 587 STARTTLS pattern; vendor değişimi ConfigMap-only).
    # Operator post-merge action — Vault prod seed:
    #   docker exec -e VAULT_TOKEN=$ROOT_TOKEN -e VAULT_ADDR=http://127.0.0.1:8200 \
    #     platform-vault-prod vault kv patch kv/platform/notification-orchestrator \
    #       smtp_username='<service@acik.com>' smtp_password='<O365 app password>'
    #
    # Office 365 service account setup (operator external):
    # 1. Create dedicated service account: notify-noreply@acik.com (Microsoft 365 admin)
    # 2. Generate App Password (2FA bypass for SMTP AUTH; admin → users → manage MFA)
    # 3. Vault seed (Pre-Production Full Authority — agent yetkisi)
    # 4. Switch vendor: just change SPRING_MAIL_HOST + smtp credentials; backend
    #    Spring Boot JavaMailSender autoconfig vendor-agnostic (587/STARTTLS standard)
    #
    # Multi-provider verified compatible (same env binding):
    # - Office 365: smtp.office365.com:587 + SMTP AUTH App Password (default)
    # - SendGrid: smtp.sendgrid.net:587 + SMTP AUTH apikey:<API_KEY>
    # - AWS SES: email-smtp.<region>.amazonaws.com:587 + IAM SMTP credentials
    # - Postmark: smtp.postmarkapp.com:587 + SMTP AUTH server token
    # - Mailgun: smtp.mailgun.org:587 + SMTP AUTH postmaster@<domain>
    # - Internal MTA: <host>:587 + SMTP AUTH service account
    - secretKey: SPRING_MAIL_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: smtp_username
    - secretKey: SPRING_MAIL_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: smtp_password
    # A4 DKIM RFC 6376 prod key (Faz 23.2 R3 mitigation — backend PR #151 MERGED).
    # ProductionConfigValidator validateDkim() activates when notify.dkim.enabled=true
    # in prod profile; signer signs all outbound mail with PKCS#8 RSA key.
    # Operator post-merge action (DKIM key generation + Vault seed):
    #   openssl genrsa -out dkim-prod.pem 2048
    #   openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in dkim-prod.pem -out dkim-prod-pkcs8.pem
    #   docker exec -e VAULT_TOKEN=$ROOT_TOKEN -e VAULT_ADDR=http://127.0.0.1:8200 \
    #     platform-vault-prod vault kv patch kv/platform/notification-orchestrator \
    #       dkim_private_key_pem="$(cat dkim-prod-pkcs8.pem)"
    #
    # DNS TXT record (operator external — acik.com DNS provider):
    #   acik2026._domainkey.acik.com IN TXT "v=DKIM1; k=rsa; p=<base64-public-key>"
    # Where public key from: openssl rsa -in dkim-prod.pem -pubout -outform PEM | sed -e '1d;$d' | tr -d '\n'
    - secretKey: NOTIFY_DKIM_PRIVATE_KEY_PEM
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: dkim_private_key_pem
    # A8 Microsoft Graph API mail adapter (prod parity with test overlay).
    # Codex thread `019e42d1` Session 42 AGREE_B (extracted staged scope from #510;
    # original Session 44 / Claude implementation. Activation flag + digest bump
    # NOT in this PR — Codex risk audit: `GraphTokenService` constructor fails on
    # missing credentials; latent activation trap if prod digest later carries
    # Graph binary with `NOTIFY_ADAPTERS_GRAPH_ENABLED=true` but empty Vault.)
    #
    # Backend PR #153 MERGED 2026-05-11 (sha-585b64f binary; not yet in prod
    # digest — A5 PR-B + RAID I6 blocker). Microsoft Graph REST via port 443
    # → Office 365 mail relay → external recipient.
    #
    # **Entra state (Session 42 2026-05-20 — Codex `019e44b1` defer contract)**:
    # Azure AD App Registration + Mail.Send Application permission + tenant-wide
    # admin consent **COMPLETE** (`acik-mail-graph-api`,
    # `client_id=6e3e5b4b-b819-41b0-a237-8774c6418e32`,
    # `tenant_id=6f49871e-cb5b-4b2f-b986-5b68f16365b9`, granted by ai.enes@acik.com
    # global admin). **PENDING** (deferred per ADR-0024 D5 atomic reactivation
    # chain): client_secret create + ApplicationAccessPolicy (ai@acik.com mailbox
    # restrict) + Vault graph_* seed + ConfigMap NOTIFY_ADAPTERS_GRAPH_ENABLED=true
    # flag flip + prod digest promotion (Graph-binary-inclusive sha; A5 PR-B + RAID
    # I6 sequencing). Aktif risk SIFIR (client_secret yok → permission kullanılamaz).
    # Bkz. ADR-0024 + RB-graph-mail-adapter-activation.md + #892 (P3 Backlog future-only).
    #
    # **DEFER-AWARE REFACTOR 2026-05-20 (Codex `019e45f8` AGREE)**: Graph 3
    # remoteRef entries previously caused ESO to report aggregate `Ready=False
    # reason=SecretSyncedError` because the 3 `graph_*` properties are not seeded
    # in Vault (defer per ADR-0024). ESO has a SINGLE aggregate Ready condition
    # (not per-property): one missing property fails the whole ExternalSecret,
    # so JetSMS/SMTP/DKIM/unsubscribe live key sync is blocked from reaching
    # the target Secret on force-sync. The previous claim that "other notify
    # keys remain Ready=True (per-property missing-key fallback)" was incorrect
    # — the K8s Secret merely retains previously-synced non-Graph keys from
    # earlier successful syncs (creationPolicy=Owner), but ESO itself reports
    # aggregate failure and refuses subsequent merge updates.
    #
    # Fix: the 3 Graph remoteRef entries are commented out below as a deferred-
    # activation snippet. ExternalSecret aggregate stays `Ready=True` for active
    # channels (JetSMS/SMTP/DKIM/Slack/Teams/Push as previously seeded), while
    # the Graph adapter binary remains disabled via `NOTIFY_ADAPTERS_GRAPH_ENABLED`
    # ConfigMap default (test=true backend-flag is fine because backend binary
    # currently has `SmtpAdapter` active via `havingValue=false` mutual exclusion;
    # Graph activation requires both binary digest + flag flip atomic).
    #
    # **Reactivation chain (RB-graph-mail-adapter-activation.md §5 ESO yaml
    # re-enable + §6 activation PR — operator/agent D5 atomic step set)**:
    # 1. Entra Admin Center → `acik-mail-graph-api` → Certificates & secrets →
    #    New client secret → copy value (one-time visibility)
    # 2. Exchange Online PowerShell: ApplicationAccessPolicy create
    #    (mail-enabled SG + PolicyScopeGroupId + RestrictAccess) for ai@acik.com
    # 3. Vault prod seed (stdin pipe, no argv plaintext):
    #      printf %s '<secret>' | docker exec -i -e VAULT_TOKEN=$PROD_ROOT \
    #        platform-vault-prod vault kv patch kv/platform/notification-orchestrator \
    #        graph_tenant_id='6f49871e-cb5b-4b2f-b986-5b68f16365b9' \
    #        graph_client_id='6e3e5b4b-b819-41b0-a237-8774c6418e32' \
    #        graph_client_secret=-
    # 4. **Re-enable Graph remoteRef entries below** (remove `#` from 3 secretKey
    #    blocks) + commit + Argo sync + verify ESO `Ready=True` + target Secret
    #    has 3 new keys
    # 5. ConfigMap `NOTIFY_ADAPTERS_GRAPH_ENABLED=true` (test→prod sequence) +
    #    backend digest bump (Graph-binary-inclusive sha) + rollout restart
    # 6. Smoke: SubmitIntentRequest `ai@acik.com → recipient` (canonical contract)
    #    + Sent Items verify + pod log `GraphMailAdapter initialized`
    #
    # See: docs/adr/0024-graph-mail-adapter-defer.md +
    #      docs/runbooks/RB-graph-mail-adapter-activation.md +
    #      issue #892 (P3 Backlog future-only tracker)
    #
    # --- Graph 3 remoteRef entries — DEFER-AWARE COMMENTED OUT ---
    # - secretKey: NOTIFY_ADAPTERS_GRAPH_TENANT_ID
    #   remoteRef:
    #     key: kv/platform/notification-orchestrator
    #     property: graph_tenant_id
    # - secretKey: NOTIFY_ADAPTERS_GRAPH_CLIENT_ID
    #   remoteRef:
    #     key: kv/platform/notification-orchestrator
    #     property: graph_client_id
    # - secretKey: NOTIFY_ADAPTERS_GRAPH_CLIENT_SECRET
    #   remoteRef:
    #     key: kv/platform/notification-orchestrator
    #     property: graph_client_secret
