# notification-orchestrator prod ExternalSecret — Faz 23.9 Step D
# (Codex thread `019e0892` post-cutover ESO/Vault prod hardening).
#
# Vault path layout (flat, auth-service / user-service convention):
#   kv/platform/notification-orchestrator
#     - db_username
#     - db_password
#     - webhook_signing_secret
#     - authz_internal_api_key
#     - redaction_pepper
#
# Operator init (one-shot, populated 2026-05-08):
#   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-prod \
#     vault kv put kv/platform/notification-orchestrator \
#       db_username=platform \
#       db_password=<from existing notification-orchestrator-secrets> \
#       webhook_signing_secret=<...> \
#       authz_internal_api_key=<...> \
#       redaction_pepper=<...>
#
# Both test (`overlays/test/eso/notify/externalsecret-notify.yaml`) and prod use
# the same flat single-path layout (consolidated 2026-05-08 in Codex thread
# `019e08df` iter-1 REVISE absorb). Earlier test split layout (kv/platform/notify/
# {db,redaction,webhook,authz,smtp,slack}) was over-engineered for SMTP/Slack
# channels not yet wired and stayed in `SecretSyncedError` from 2026-05-07 to
# 2026-05-08. Flat path matches the working pattern of the other 10 platform
# service ExternalSecrets.
#
# Future SMTP/Slack additions: extend this manifest with extra remoteRef entries (no
# need to split into separate Vault paths until rotation policies actually diverge).
#
# Refresh interval 1h. creationPolicy=Owner — ESO takes over the existing
# notification-orchestrator-secrets Secret (currently a direct kubectl Secret created
# during prod cutover; this PR moves it under Vault management).

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-orchestrator-secrets
  namespace: platform-prod
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: notification-orchestrator-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: db_password
    - secretKey: NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: webhook_signing_secret
    - secretKey: NOTIFY_AUTHZ_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: authz_internal_api_key
    - secretKey: NOTIFY_REDACTION_PEPPER
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: redaction_pepper
    # P1.2 M3 next gate (Faz 23.2.A T1.1.8 P0.4 prod activation prerequisite,
    # 2026-05-10 Codex 019e1307 iter-3 RED absorb).
    # Test overlay 2026-05-09 onwards already had these 10 keys (sms_*, dlr_token,
    # teams_*, slack_*, fcm_*, apns_*, vapid_*, unsubscribe_signing_secret).
    # Prod parity required for ProductionConfigValidator activation
    # (SPRING_PROFILES_ACTIVE=k8s,prod) + multi-channel adapter + unsubscribe
    # email-link integrity in prod cluster.
    #
    # Vault prod seed sequence (Pre-Production Full Authority — same pattern
    # as test seed P0.3 2026-05-10 17:41Z + sms seed 2026-05-10 06:41Z):
    #   docker exec -e VAULT_TOKEN=$PROD_ROOT platform-vault-prod \
    #     vault kv patch kv/platform/notification-orchestrator \
    #       sms_netgsm_username='' sms_netgsm_password='' sms_netgsm_msgheader='Notify' \
    #       dlr_token='' \
    #       teams_webhook_url='' slack_bot_token='' \
    #       fcm_service_account_key='' apns_auth_key='' vapid_private_key='' \
    #       unsubscribe_signing_secret="$(openssl rand -hex 32)"
    #
    # Empty defaults trigger fail-closed in their respective adapters
    # (NetGSM: "credentials missing", Teams/Slack/FCM/APNS/VAPID: channel disabled).
    # unsubscribe_signing_secret is the only one populated with cryptographic
    # value (guard hits before any adapter); other keys filled post-channel-activation.
    #
    # SMS NetGSM (Faz 23.3.1 — same as test):
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_netgsm_username
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_netgsm_password
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_MSGHEADER
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_netgsm_msgheader
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_DLR_TOKEN
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: dlr_token
    # T4.1 — Microsoft Teams + Slack Bot (M7 v1 prep):
    - secretKey: NOTIFY_ADAPTERS_TEAMS_WEBHOOK_URL
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: teams_webhook_url
    - secretKey: NOTIFY_ADAPTERS_SLACK_BOT_TOKEN
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: slack_bot_token
    # T4.2 — Push (FCM/APNS/VAPID — M7 v1 prep):
    - secretKey: NOTIFY_ADAPTERS_PUSH_FCM_SERVICE_ACCOUNT_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: fcm_service_account_key
    - secretKey: NOTIFY_ADAPTERS_PUSH_APNS_AUTH_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: apns_auth_key
    - secretKey: NOTIFY_ADAPTERS_PUSH_VAPID_PRIVATE_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: vapid_private_key
    # T1.1.8 — Unsubscribe email-link HMAC-SHA256 signing secret (Faz 23.2.A):
    # ProductionConfigValidator validateSecret() guard activates when
    # SPRING_PROFILES_ACTIVE=k8s,prod (P1.2 step 4 = profile flip patch).
    - secretKey: NOTIFY_UNSUBSCRIBE_SIGNING_SECRET
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: unsubscribe_signing_secret
