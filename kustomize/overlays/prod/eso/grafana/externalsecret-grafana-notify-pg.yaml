# grafana-notify-pg-secret ExternalSecret — M7 T4.3.7 per-template analytics
# Faz 23.8 BL-015-A (Codex 019e4ee2 plan-time + 019e5a75 iter-3 + 019e5aad
# post-impl AGREE absorb).
#
# Vault path: kv/platform/grafana/notify-pg-ro (operator seed required)
#   - password: RO PG user password (32-char alphanumeric)
#
# **SOURCE-SIDE ACTIVE** (BL-015-A absorb 2026-05-24): remoteRef uncomment'lı,
# helm-values envValueFrom optional:true defer-aware. Vault'ta password yoksa
# ESO Ready=False transient kalır; Grafana pod envValueFrom optional:true ile
# fail etmez (boş env). Operator B step ile Vault seed + helm upgrade sonrası
# ESO Ready=True + Grafana env populated + datasource LIVE.
#
# Operator B step chain (see RB-grafana-notify-pg-datasource.md §3):
#   1. PG RO role create:
#        CREATE USER grafana_notify_ro WITH LOGIN PASSWORD '<random 32 alnum>';
#        GRANT USAGE ON SCHEMA notify TO grafana_notify_ro;
#        GRANT SELECT ON notify.audit_event_v2, notify.notification_intent,
#          notify.notification_delivery TO grafana_notify_ro;
#   2. Generate password: openssl rand -hex 16 | head -c 32
#   3. Vault seed:
#        docker exec -e VAULT_TOKEN=$PROD_ROOT platform-vault-prod \
#          vault kv put kv/platform/grafana/notify-pg-ro password='<step 2 output>'
#   4. (Automatic) Argo sync → ESO Ready=True + Secret NOTIFY_PG_RO_PASSWORD populated
#   5. **Helm upgrade required** (Secret-backed env var pod-start-time):
#        helm upgrade kube-prometheus-stack ... -f helm-values/.../values-prod.yaml
#        (mevcut Grafana pod rollout restart → env var picked up)
#   6. Sidecar provisioner picks up datasource ConfigMap → datasource LIVE
#   7. G1-G8 verify (RB §3.10+): DB role auth, RO-only negative, Vault key,
#      ESO Ready, Secret key, Grafana env, datasource health, panel render
#
# See: docs/runbooks/RB-grafana-notify-pg-datasource.md
#      docs/notify/sprint-plan.md T4.3.7

# Codex 019e4f10 P1 #2 historical context: data: null (YAML empty mapping) ESO
# CRD reject riski. iter-2 fix was data: [] explicit empty array (defer-aware).
# BL-015-A absorb (Codex 019e5a75 iter-3): data array remoteRef uncomment;
# defer-aware now lives in helm-values envValueFrom optional:true (Grafana pod
# tolerates Vault seed öncesi state).

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-notify-pg-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: datasource-credentials
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: grafana-notify-pg-secret
    creationPolicy: Owner
  # remoteRef source-side active (BL-015-A 2026-05-24). Operator B step canonical
  # chain (7 step PG role → Vault seed → Argo automatic → Helm upgrade REQUIRED
  # → sidecar → G1-G8) header comment'inde + RB-grafana-notify-pg-datasource.md §3.
  data:
    - secretKey: NOTIFY_PG_RO_PASSWORD
      remoteRef:
        key: kv/platform/grafana/notify-pg-ro
        property: password
