# grafana-notify-pg-secret ExternalSecret — M7 T4.3.7 per-template analytics
# Faz 23.8 PR-1 (Codex 019e4ee2 plan-time AGREE absorb).
#
# Vault path: kv/platform/grafana/notify-pg-ro (operator seed required)
#   - password: RO PG user password (32-char alphanumeric)
#
# **DEFER-AWARE COMMENTED OUT** (Codex Graph adapter pattern, ADR-0024):
# ESO aggregate Ready=False if any remoteRef property missing → diğer Grafana
# Secret sync bozulur. Vault'a password seedlenmeden bu entry aktif edilmez.
#
# Reactivation chain (operator pre-cutover, see RB-grafana-notify-pg-datasource.md §3):
#   1. DB RO role create: grafana_notify_ro WITH LOGIN PASSWORD '<random>'
#      GRANT SELECT ON notify.audit_event_v2, notification_intent, notification_delivery
#   2. Generate password: openssl rand -hex 16 | head -c 32
#   3. Vault seed:
#      docker exec -e VAULT_TOKEN=$PROD_ROOT platform-vault-prod \
#        vault kv put kv/platform/grafana/notify-pg-ro password='<step 2 output>'
#   4. **Uncomment 1 remoteRef entry below** (remove # prefix) + commit + Argo sync
#   5. Verify ESO Ready=True + target Secret has password key
#   6. Grafana env injection: helm-values envValueFrom + helm upgrade
#   7. Sidecar provisioner picks up datasource ConfigMap → datasource LIVE
#   8. Smoke: per-tenant dashboard Top 20 Templates panel render (24h, tenant=$tenant)
#
# See: docs/runbooks/RB-grafana-notify-pg-datasource.md
#      docs/notify/sprint-plan.md T4.3.7

# Codex 019e4f10 P1 #2 absorb: data: null (YAML empty mapping) ESO CRD
# tarafından reject olabilir. iter-2 fix: data: [] explicit empty array
# (YAML flow syntax). ESO controller'ı data: [] geçerli kabul eder; aggregate
# Ready=True kalır (no remote refs to fetch). Operator uncomment + activation
# sonrası ESO Ready remains True with NOTIFY_PG_RO_PASSWORD synced.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-notify-pg-secret
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: datasource-credentials
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: grafana-notify-pg-secret
    creationPolicy: Owner
  # Codex iter-3 verdict thread `019e5a75-ebf3-7860-9832-2776a6d185b6` BL-015-A
  # activation absorb: remoteRef uncomment (source-side aktivasyon hazır).
  # Defer-aware: Vault'ta `kv/platform/grafana/notify-pg-ro` `password` key yok ise
  # ESO Ready=False kalır (transient); operator B step (PG role + Vault seed)
  # tamamlanınca ESO Ready=True + Secret NOTIFY_PG_RO_PASSWORD populated.
  # Grafana pod envValueFrom optional:true ile fail etmez (helm-values prod).
  #
  # Operator activation chain (B step — see RB-grafana-notify-pg-datasource.md §3):
  # 1. PG role: CREATE USER grafana_notify_ro WITH LOGIN PASSWORD '<random 32 alnum>'
  #    GRANT USAGE ON SCHEMA notify TO grafana_notify_ro
  #    GRANT SELECT ON notify.audit_event_v2, notification_intent, notification_delivery
  # 2. Vault seed: vault kv put kv/platform/grafana/notify-pg-ro password='<step 1 output>'
  # 3. (Automatic) Argo sync → ESO Ready=True + Secret populated
  # 4. (Automatic) Grafana sidecar reload datasource (NOTIFY_PG_RO_PASSWORD picked up)
  # 5. G1-G8 verify (RB §3.10+)
  data:
    - secretKey: NOTIFY_PG_RO_PASSWORD
      remoteRef:
        key: kv/platform/grafana/notify-pg-ro
        property: password
