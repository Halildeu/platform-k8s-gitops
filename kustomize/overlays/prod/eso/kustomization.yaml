# ESO prod overlay — k3d-prod (same-host prod Vault — ADR-0002 pending)
# Base'deki placeholder ClusterSecretStore FQDN'ini prod Vault'a çevirir.
#
# OPS-PREREQ (merge edilmeden apply EDİLMEZ):
#   1. Prod Vault instance aktif (platform-prod namespace, host compose veya k8s)
#   2. Vault'ta `eso-runtime` AppRole yaratıldı (policy adı da `eso-runtime` —
#      tek kanonik isim, bkz bootstrap/vault-policies/eso-runtime.hcl):
#        vault policy write eso-runtime bootstrap/vault-policies/eso-runtime.hcl
#        vault write auth/approle/role/eso-runtime \
#          token_policies=eso-runtime token_ttl=1h token_max_ttl=24h
#   3. role_id UUID okundu:
#        vault read auth/approle/role/eso-runtime/role-id
#   4. clustersecretstore-patch.yaml içine gerçek role_id UUID eklendi (test overlay
#      şablonunu izle: JSON6902 op:replace /spec/provider/vault/auth/appRole/roleId)
#   5. secret-id generate edildi → K8s Secret `vault-approle-secret` (ns external-secrets)
#   6. CI'da prod/eso render eklendi (bkz .github/workflows/ci.yml — şu an prod/eso
#      placeholder-leak-check'ten MUAF; re-enable PR'ı 4. adımla aynı PR)
#
# Apply (önkoşullar tamamlandıktan sonra):
#   kubectl --context k3d-prod apply -k kustomize/overlays/prod/eso
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/eso
  - externalsecret-ghcr-pull.yaml    # platform-prod ns (W1 Opsiyon B)
  - notify                            # notification-orchestrator-secrets (Faz 23.9 Step D)
  - alertmanager                      # Faz 23.2.D T1.4 D43 outage fallback (Codex 019e0dea iter-2)
  - grafana                           # Faz 23.8 M7 T4.3.7 — grafana-notify-pg-secret (defer-aware; PR-1 Codex 019e4ee2)
  - endpoint-admin                    # Faz 22.5 P2-A A1 first prod deploy (BE-024c v2-d) — Codex 019e8c3a iter-1 AGREE; prereq: Vault kv/platform/endpoint-admin-service seed + prod PG endpoint_admin DB+role+password match

patches:
  - target:
      kind: ClusterSecretStore
      name: vault-platform-gitops
    path: clustersecretstore-patch.yaml
