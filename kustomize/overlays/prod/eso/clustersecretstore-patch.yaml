# Prod Vault override — platform-prod namespace (D32 staging-sw-2)
# - Vault server: FQDN (cluster DNS) — Known Drift "Prod Vault URL" canlıda
#   `http://vault.platform-prod.svc.cluster.local:8200` ile Ready=True (x70+
#   reconcile over 5h40m). Hardcoded IP (örn. 172.21.0.6) restart'ta değişir,
#   FQDN korunmalı.
# - roleId: 2026-04-24 Known Drift §"Prod ESO roleId" kapatma.
#   Placeholder `"eso-runtime"` → gerçek AppRole UUID. Canlı kanıt:
#   `kubectl describe clustersecretstore vault-platform-gitops` → Role Id alanı.
#   Bu UUID low-sensitivity identity (secret_id ile çift), güvenlik katmanları:
#   etcd encryption-at-rest + CIDR binding + secret_id rotation.
- op: replace
  path: /spec/provider/vault/server
  value: "http://vault.platform-prod.svc.cluster.local:8200"
- op: replace
  path: /spec/provider/vault/auth/appRole/roleId
  value: "0db7ba83-b485-4afb-da7d-e1041b1f8a56"
