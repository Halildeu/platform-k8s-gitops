# ExternalSecret — ghcr-pull (platform-prod namespace)
# Codex iter-4 REVISE + iter-5 AGREE Opsiyon B: overlay-specific ES.
# Secret workload ns'inde (platform-prod) oluşur, ServiceAccount imagePullSecrets
# referansı çalışır.
#
# Source: docs/handoff-S2-B-artifact-hardening.md
# Prereq: ClusterSecretStore 'vault-platform-gitops' Ready (base/eso overlay apply ile)
# Prereq: Vault kv/gitops/ghcr-token path (ops seed)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: platform-prod
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/component: image-pull
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "auth": "{{ printf "%s:%s" .username .password | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: kv/gitops/ghcr-token
        property: username
    - secretKey: password
      remoteRef:
        key: kv/gitops/ghcr-token
        property: password
