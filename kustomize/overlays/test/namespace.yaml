# Namespace — platform-test (k3d-test)
# Labels: ApplicationSet cluster generator match prereq
apiVersion: v1
kind: Namespace
metadata:
  name: platform-test
  labels:
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/cluster: test
    platform: "true"
    env: test
    # kubernetes.io/metadata.name otomatik set edilir (NetworkPolicy namespaceSelector için)
    # Pod Security Admission (K8s 1.23+ built-in) — Kyverno paralel defense
    pod-security.kubernetes.io/enforce: baseline         # minimum — baseline pod'lar PASS
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted         # audit log — restricted ihlalleri görür
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted          # apply sırasında uyar
    pod-security.kubernetes.io/warn-version: latest
