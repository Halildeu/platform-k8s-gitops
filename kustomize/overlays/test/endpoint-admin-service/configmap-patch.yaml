# endpoint-admin-service ConfigMap patch — test overlay (Faz 22.1.1b FULL onboard)
# Test cluster (k3d-test platform-test ns) için OVERLAY_MUST_OVERRIDE
# placeholder'ları gerçek test platform değerleriyle doldurur.
#
# PR-8b düzeltme: prod realm = serban; test realm = platform-test (test=lab tier).
# 22.1 lab tier — ADR-0012-EA §Pilot tier matrisi.
apiVersion: v1
kind: ConfigMap
metadata:
  name: endpoint-admin-service-config
data:
  # Identity / OIDC — test realm platform-test (host-compose Keycloak 10.9.10.53:8081)
  KEYCLOAK_ISSUER_URI: "http://platform-keycloak.platform-test.svc.cluster.local:8080/realms/platform-test"
  KEYCLOAK_JWKS_URI: "http://platform-keycloak.platform-test.svc.cluster.local:8080/realms/platform-test/protocol/openid-connect/certs"

  # Audit storage — test cluster Loki (lab tier; postgres yok, prod 22.2'de Postgres aktif)
  AUDIT_LOG_BACKEND: "loki"

  # Pilot tier — 22.1 lab (ADR-0012-EA)
  PILOT_TIER: "lab"

  # Identity discovery — 22.1 lab Local Windows only; AD/Entra/M365 disabled
  DISCOVERY_LOCAL_WINDOWS_ENABLED: "true"

  # Code signing — 22.1 lab tier accepts self-signed lab-only-evidence
  COSIGN_KEY_REF: "lab-only-evidence:none"
  COSIGN_LAB_ONLY_EVIDENCE: "true"
