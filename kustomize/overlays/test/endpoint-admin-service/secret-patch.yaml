# endpoint-admin-service Secret patch — test overlay (Faz 22.1.1b FULL onboard)
#
# Test cluster için stub değerler. Production (Faz 22.2 acik.local pilot)
# değerleri ESO ExternalSecret + Vault kv/platform/endpoint-admin/* path
# üzerinden inject edilir (FULL prod onboard ayrı sprint, kullanıcı/ops Vault
# populate sonrası).
#
# Test cluster discovery=local-windows-only + audit=loki konfigürasyonu için
# AD_BIND, ENTRA_*, AUDIT_LOG_DSN gerek değil; lab-only stub yeterli.
apiVersion: v1
kind: Secret
metadata:
  name: endpoint-admin-service-secrets
type: Opaque
stringData:
  # OIDC client secret (Keycloak platform-test realm)
  # Test realm endpoint-admin-portal client — public client (no secret), bu placeholder
  ADMIN_AUTH_CLIENT_SECRET: "lab-only-test-stub-not-for-prod"

  # Audit log DSN — Loki HTTP endpoint (test cluster, no DSN gerek)
  AUDIT_LOG_DSN: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"

  # AD bind — disabled in 22.1 lab (DISCOVERY_AD_*=false), stub
  AD_BIND_DN: "lab-only-stub-not-for-prod"
  AD_BIND_PASSWORD: "lab-only-stub-not-for-prod"

  # Entra/M365 — disabled until Faz 22.3+, stub
  ENTRA_CLIENT_ID: "lab-only-stub-not-for-prod"
  ENTRA_CLIENT_SECRET: "lab-only-stub-not-for-prod"

  # Internal API key — Faz 22.1 stub (ESO populate Faz 22.2+)
  INTERNAL_API_KEY: "lab-only-internal-key-not-for-prod"

  # Agent enrollment secret — platform-agent registration token
  # Faz 22.1 lab Parallels lab kullanılırsa, 22.2 it-pilot'da ESO populate
  AGENT_ENROLLMENT_SECRET: "lab-only-agent-enrollment-stub-not-for-prod"
