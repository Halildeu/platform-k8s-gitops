apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-meeting-ai-secret
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: auth-service-meeting-ai-secret
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_CLIENT_MEETING_AI_SECRET
      remoteRef:
        key: kv/platform/auth-service
        property: service_client_meeting_ai_secret
