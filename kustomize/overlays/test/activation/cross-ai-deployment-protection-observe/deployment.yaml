apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-ai-deployment-protection
  labels:
    app.kubernetes.io/name: cross-ai-deployment-protection
    app.kubernetes.io/component: github-app-observer
    app.kubernetes.io/part-of: platform
  annotations:
    acik.com/tracked-by: "platform-k8s-gitops#2502"
    acik.com/product-slice: "platform-k8s-gitops#2373"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cross-ai-deployment-protection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cross-ai-deployment-protection
        app.kubernetes.io/component: github-app-observer
        app.kubernetes.io/part-of: platform
    spec:
      serviceAccountName: cross-ai-deployment-protection
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer
          # Main workflow 29577665709 published this exact OCI subject; registry
          # manifest and GitHub provenance attestation were independently verified.
          image: ghcr.io/halildeu/platform-k8s-gitops-cross-ai-deployment-protection@sha256:5b3532cdacc7d6f60bcf317982ab9bf7e1fcfe51f4c94de2a11aa3226c19af59
          imagePullPolicy: IfNotPresent
          args:
            - --mode
            - observe
            - --listen
            - 0.0.0.0
            - --port
            - "8080"
            - --db
            - /var/lib/cross-ai/observe.sqlite3
            - --webhook-secret-file
            - /run/secrets/github-webhook-current
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/cross-ai
            - name: webhook-secret
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cross-ai-deployment-protection-observe
        - name: webhook-secret
          secret:
            secretName: cross-ai-deployment-protection-observe
            # Files are root:fsGroup in the projected volume; grant only the
            # pod security group the read bit needed by UID/GID 10001.
            defaultMode: 0440
            items:
              - key: github-webhook-current
                path: github-webhook-current
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
