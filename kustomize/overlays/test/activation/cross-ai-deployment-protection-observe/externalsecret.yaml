apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cross-ai-deployment-protection-observe
  labels:
    app.kubernetes.io/name: cross-ai-deployment-protection
    app.kubernetes.io/component: github-app-observer
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: cross-ai-deployment-protection-observe
    creationPolicy: Owner
  data:
    - secretKey: github-webhook-current
      remoteRef:
        key: kv/platform/cross-ai-deployment-protection-test
        property: github_webhook_secret_current
