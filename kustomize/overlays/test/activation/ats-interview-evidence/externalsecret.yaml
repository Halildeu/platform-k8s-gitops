# ATS app-boot ExternalSecret — test activation (ATS-0019 39d-3).
# Vault path: kv/platform/ats (39d-2a'da seed'lendi: DB url/user/pass; parola
# yalnız staging-sw üzerinde üretildi). AI bearer BİLEREK yok — stub fazında
# gereksiz; live-STT promotion'da AYRI ExternalSecret olarak eklenir (D43 dersi:
# tek ES'te eksik key tüm Secret'ı Ready=False'a kilitler).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ats-interview-evidence-secret
  namespace: platform-test
  labels:
    app.kubernetes.io/name: ats-interview-evidence
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: ats-interview-evidence-secret
    creationPolicy: Owner
  data:
    - secretKey: ATS_DB_URL
      remoteRef:
        key: kv/platform/ats
        property: ATS_DB_URL
    - secretKey: ATS_DB_USERNAME
      remoteRef:
        key: kv/platform/ats
        property: ATS_DB_USERNAME
    - secretKey: ATS_DB_PASSWORD
      remoteRef:
        key: kv/platform/ats
        property: ATS_DB_PASSWORD
    # ats#235: aday giriş kodunun Microsoft Graph ile teslimi (sahip onayı
    # 2026-07-28 — "gerekirse gönderebiliriz maili tanımlı mailde"). Gönderen
    # tanımlı servis posta kutusu (ai@acik.com); SMTP altyapısı yok.
    #
    # AYNI ES'e eklendi, ayrı ES açılmadı: dosyanın başındaki D43 dersi tersini
    # söylemiyor — o ders "SEED EDİLMEMİŞ key ekleme" dersidir. Dört anahtar
    # test Vault'unda (kv/platform/ats) BU DEĞİŞİKLİKTEN ÖNCE tohumlandı;
    # doğrulandı (anahtar adları listelendi, değerler okunmadı). Ayrı ES açmak
    # ATS_MAIL_* için ikinci bir Ready yüzeyi yaratır ve envFrom tek secretRef
    # olduğu için deployment'ı da değiştirmek gerekirdi.
    #
    # Spring gevşek bağlama: ATS_MAIL_GRAPH_TENANT_ID → ats.mail.graph.tenant-id.
    # Dördünden biri boşsa GraphOtpMailSender.configured() false döner ve uç 503
    # verir — sessiz sahte "gönderdim" YOK.
    - secretKey: ATS_MAIL_GRAPH_TENANT_ID
      remoteRef:
        key: kv/platform/ats
        property: ATS_MAIL_GRAPH_TENANT_ID
    - secretKey: ATS_MAIL_GRAPH_CLIENT_ID
      remoteRef:
        key: kv/platform/ats
        property: ATS_MAIL_GRAPH_CLIENT_ID
    - secretKey: ATS_MAIL_GRAPH_CLIENT_SECRET
      remoteRef:
        key: kv/platform/ats
        property: ATS_MAIL_GRAPH_CLIENT_SECRET
    - secretKey: ATS_MAIL_GRAPH_SENDER
      remoteRef:
        key: kv/platform/ats
        property: ATS_MAIL_GRAPH_SENDER
