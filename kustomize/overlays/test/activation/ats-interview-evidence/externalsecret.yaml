# ATS app-boot ExternalSecret — test activation (ATS-0019 39d-3).
# Vault path: kv/platform/ats (39d-2a'da seed'lendi: DB url/user/pass; parola
# yalnız staging-sw üzerinde üretildi). AI bearer BİLEREK yok — stub fazında
# gereksiz; live-STT promotion'da AYRI ExternalSecret olarak eklenir (D43 dersi:
# tek ES'te eksik key tüm Secret'ı Ready=False'a kilitler).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ats-interview-evidence-secret
  namespace: platform-test
  labels:
    app.kubernetes.io/name: ats-interview-evidence
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: ats-interview-evidence-secret
    creationPolicy: Owner
  data:
    - secretKey: ATS_DB_URL
      remoteRef:
        key: kv/platform/ats
        property: ATS_DB_URL
    - secretKey: ATS_DB_USERNAME
      remoteRef:
        key: kv/platform/ats
        property: ATS_DB_USERNAME
    - secretKey: ATS_DB_PASSWORD
      remoteRef:
        key: kv/platform/ats
        property: ATS_DB_PASSWORD
