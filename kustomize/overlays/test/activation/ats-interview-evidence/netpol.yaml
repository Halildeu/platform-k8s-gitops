# NetPol — ats-interview-evidence (ATS-0019 39d-3).
# ingress: yalnız ingress-nginx → 8080. egress: DNS + host-bridge PG/KC
# (Endpoints IP'leri — Codex uyarısı: host-bridge hedefe podSelector işlemez,
# ipBlock zorunlu; IP'ler overlay Endpoints pin'leriyle AYNI kaynaktan) +
# canonical platform authz projection + live-STT.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ats-interview-evidence
  namespace: platform-test
spec:
  podSelector:
    matchLabels:
      app: ats-interview-evidence
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
  egress:
    # DNS — YALNIZ cluster DNS (kube-system CoreDNS; Codex 019f50b7 P1:
    # namespaceSelector:{} tüm namespace'lerde :53'ü açıyordu)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # host-bridge postgres (Endpoints "postgres" 172.19.0.6:5432 — D20 pin)
    - to:
        - ipBlock:
            cidr: 172.19.0.6/32
      ports:
        - port: 5432
    # host-bridge keycloak JWKS (Endpoints "keycloak" 172.19.0.7:8080)
    - to:
        - ipBlock:
            cidr: 172.19.0.7/32
      ports:
        - port: 8080
    # Recruiter yetkisi aynı bearer ile yalnız canonical platform authz
    # projeksiyonunda doğrulanır. Service selector ve tek port dışındaki
    # platform içi egress kapalı kalır.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - port: 8080
          protocol: TCP
    # live-STT (denetim-PC GPU host; WG 10.99.0.2:8243 Caddy mTLS) — 39d-5.
    # audio-gateway allow-audio-gateway-egress-live-stt-mtls aynası (ipBlock/32,
    # TCP/8243). Provider live-stt fail-closed; otomatik stub fallback yoktur.
    - to:
        - ipBlock:
            cidr: 10.99.0.2/32
      ports:
        - port: 8243
          protocol: TCP
---
# api-gateway baseline ingress'i yalnız app.kubernetes.io/part-of=platform
# kaynaklarını kabul eder. ATS kasıtlı olarak bu geniş etiketi taşımaz; bunun
# yerine sadece authz doğrulamasına gereken dar kaynak/port istisnası açılır.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-authz-from-ats-interview-evidence
  namespace: platform-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ats-interview-evidence
      ports:
        - port: 8080
          protocol: TCP
