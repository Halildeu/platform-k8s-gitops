# ats-interview-evidence ACTIVATION overlay — ATS-0019 39d-3 (test).
#
# Faz 25 #2526 ile Argo-root'a dahil: test ortamında kalıcı ürün yüzeyi ve
# self-heal sağlar. Doğrudan workload patch/set-image yok; tüm değişiklik bu
# desired-state overlay'inden gelir. Bağımsız salt-okunur build kontrolü:
#
#   kubectl kustomize kustomize/overlays/test/activation/ats-interview-evidence
#
# Önkoşullar (39d-2, 2026-07-11'de TAMAM):
#   - PG: ats DB + ats_app kullanıcı (test compose PG; canlı login kanıtlı)
#   - Vault: kv/platform/ats (DB url/user/pass) → ESO ClusterSecretStore
#   - KC platform-test: ats-api client + 14 client-role + 15 default-scope
#     scope'ları (Codex 019f50b7 verdict A: default scope + rol-kapısı ats#96)
#
# Güncel Faz 25 #2526 imaj pini. Numerik UID (10001:10001) ve deployment
# securityContext tutarlıdır; digest AUTHORITY, tag yalnız provenance alias'ıdır:
#   source  ats main a3cfb76570575acf9f81f582d94bc1ca16c3da66 (ats#175)
#   tag     ghcr.io/halildeu/ats-app-boot:sha-a3cfb76
#   digest  sha256:49aa5da5ee294942a16c30405f1a3f7b3995faa85b6246f5a5fc5d05fc5600e1
#   build   https://github.com/Halildeu/ats/actions/runs/29533845541
# Önceki canlı D29 kanıtlı pin: sha-3a93cff /
#   sha256:c2dcc1da2e169d676fec21a1acc60d6fd6be2b108e73ce705b0aa813010432b1
#
# Build sanity (apply'sız):
#   kubectl kustomize kustomize/overlays/test/activation/ats-interview-evidence
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-test

resources:
  - ../../../../base/apps/ats-interview-evidence
  - externalsecret.yaml
  - externalsecret-mtls.yaml
  - ingress-ats-api.yaml
  - netpol.yaml
  # ai-stub artık resource değildir: provider live-stt fail-closed; kullanılmayan
  # fallback pod'u test node kapasitesini tüketmez.

images:
  - name: ghcr.io/halildeu/ats-app-boot
    digest: sha256:49aa5da5ee294942a16c30405f1a3f7b3995faa85b6246f5a5fc5d05fc5600e1

patches:
  # 39d-5: Faz1 mount+hostAlias; Faz2 keystore-parola secretKeyRef (patch içinde).
  # Provider seçimi AŞAĞIDAKİ ConfigMap patch'inde stub → live-stt'ye çevrilir (Faz2).
  - path: patch-mtls-mount.yaml
  # test ortam değerleri (base fail-closed placeholder'larını doldurur)
  - target:
      kind: ConfigMap
      name: ats-interview-evidence-config
    patch: |-
      - op: replace
        path: /data/ATS_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: replace
        path: /data/ATS_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: replace
        path: /data/ATS_PUBLIC_TENANT_ID
        value: "00000000-0000-0000-0000-000000000001"
      # 39d-5 Faz2: provider flip stub → live-stt (Faz24 denetim STT, mTLS).
      # transcribe canlı denetim-PC motoruna gider; cite live-stt'de bilinçli
      # NOT_CONFIGURED (STT-only motor; F4 citation ayrı LLM işi, ADR-0043 T-C).
      # ATS-0017: stub↔live OTO-FALLBACK YASAK (provider=live-stt fail-closed).
      - op: replace
        path: /data/ATS_AI_BASE_URL
        value: "https://live-stt.denetim:8243"
      - op: add
        path: /data/ATS_AI_PROVIDER
        value: "live-stt"
      - op: add
        path: /data/ATS_AI_MTLS_MODE
        value: "required"
      - op: add
        path: /data/ATS_AI_MTLS_KEYSTORE
        value: "/etc/ats-mtls/keystore.p12"
      - op: add
        path: /data/ATS_AI_MTLS_TRUSTSTORE
        value: "/etc/ats-mtls/truststore.p12"
