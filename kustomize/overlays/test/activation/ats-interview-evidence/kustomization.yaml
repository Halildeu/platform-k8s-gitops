# ats-interview-evidence ACTIVATION overlay — ATS-0019 39d-3 (test).
#
# Faz 25 #2526 ile Argo-root'a dahil: test ortamında kalıcı ürün yüzeyi ve
# self-heal sağlar. Doğrudan workload patch/set-image yok; tüm değişiklik bu
# desired-state overlay'inden gelir. Bağımsız salt-okunur build kontrolü:
#
#   kubectl kustomize kustomize/overlays/test/activation/ats-interview-evidence
#
# Önkoşullar (39d-2, 2026-07-11'de TAMAM):
#   - PG: ats DB + ats_app kullanıcı (test compose PG; canlı login kanıtlı)
#   - Vault: kv/platform/ats (DB url/user/pass) → ESO ClusterSecretStore
#   - KC platform-test: ats-api client + 16 client-role + 17 default-scope
#     scope'ları (Faz 25 #2441: ats.screening.{read,write} eklendi; default scope
#     + rol-kapısı ats#96/#168 modeli değişmez)
#
# Faz 25 #2526 Full ATS ilk müşteri yüzeyinin backend pini. Bu kaynak;
# güvenli PDF alan önerisi, kalıcı başvuru makbuzu, recruiter detay/evaluation
# ve optimistic-lock aşama geçişlerini birlikte taşır. Numerik UID
# (10001:10001) ve deployment securityContext tutarlıdır; digest AUTHORITY,
# tag yalnız provenance alias'ıdır:
#   source  ats@ef2b3cc (ats#216 — yapisal deneyim/egitim girdileri, genisletme adimi)
#   tag     ghcr.io/halildeu/ats-app-boot:sha-ef2b3cc
#   digest  sha256:f3450fd6e59d1dd4f750fbcef4fc2866f31285ea95c4f8466d2476cdad7ea09c
# ats#208: bilinmeyen yan cubuk basligi artik aktif bolumu KAPATIR; boylece
# bir sonraki bolumun basligi bir onceki alanin sonuna yapismiyor. Kural
# yalnizca yan cubuk akisina uygulanir: olcum (gercek CV) ana kolondaki ayni
# sekilli satirlarin IS UNVANI oldugunu gosterdi (HSE MANAGER, SITE CHIEF) ve
# onlarda kapatmak deneyim bolumunu yok ederdi. Baslik iki satira sariyorsa
# (CERTIFICATIONS & / TRAINING) devam satiri yutulur, bolum kapanmaz.
# Lokal olcum (gercek CV, ayni motor) v5 -> v6:
#   education 61c -> 51c, languages 168c -> 45c, certifications 467c -> 158c,
#   kapsam 9/10 korundu.
# ats#212 (parserVersion v7): (a) Turkce ekli basliklar eslesir —
# "IS DENEYIMLERI" sozlukteki "deneyim" ile artik tutuyor, ek toleransi yalniz
# 5+ karakter etiketlerde acik; (b) korumali etiket eslesmesi kesinlestirildi —
# bare "saglik" onek eslesmesiyle MESRU IS UNVANINI siliyordu
# ("Saglik Emniyet Cevre Koordinatoru"), bu da aktif bolumu kapatip adayin tum
# deneyimini yok ediyordu. Cok kelimeli biçimler acikca listelendi; tek
# kelimeliler tam eslesmeyle korunmaya devam eder.
# Lokal olcum (4 gercek CV): kariyer.net CV'sinde deneyim 35c -> 170c,
# yanlis bastirma 10 -> 5; Ingilizce referans CV 9/10 korundu; 4 CV'de
# PII sizinti kontrolu temiz (dogum tarihi/cinsiyet/medeni durum/adres yok).
# KALAN: kariyer.net iki-kolon + mixed-case baslik duzeni ayri is (ats#213).
# ats#216 (#215 A): experience/education artik YAPISAL girdi olarak da kabul edilir.
# Genislet/daralt: V17 experience_entries/education_entries JSONB + languages/
# certifications TEXT kolonlarini ESKILERIN YANINA ekler; mevcut satirlar tek
# girdiye backfill edilir. Yeni istemci yalniz girdi gonderebilir, backend eski
# tek-string alani ondan turetir (effectiveExperience/-Education) — boylece IK
# gorunumu, export ve DSAR yuzeyleri degismez ve frontend ile backend'i ayni
# anda deploy etmek GEREKMEZ. Frontend hala eski bicimi gonderiyor; cogaltilabilir
# arayuz ayri PR (#215 B).
# API: experience/education artik `required` DEGIL (dogrulama turetilmis deger
# uzerinde kosar). OpenAPI snapshot diff'i incelenerek yeniden pinlendi:
# 2 yeni sema, 4 opsiyonel alan, silinen sema/yol YOK.
# Onceki pin: sha-21356f1 / v6 davranisi ama parserVersion yanlis "v5" /
#   sha256:4ced4cd00c82b3282352079679125d710c85641a629afca645845aecb01441bc
# Ondan onceki: sha-755c745 / v5 davranisi + v5 provenance (tutarli) /
#   sha256:0d2d03691ac3e982b37d94a18595b670695b575c9edaae623c05e80214171513
# Full ATS ilk müşteri yüzeyi için sonradan eklenen V15 DSAR legacy-data
# migration'ı bilinçli olarak ayrıştırıldı: TEST'teki 12 eski DSAR satırı
# identity-owner/DPO eşlemesi olmadan değiştirilemez. Bu pin V5..V13 ile
# ilan, CV import, pipeline/evaluation ve mülakat akışlarını taşır; DSAR
# remediation ayrı owner-gated iş olarak fail-closed kalır.
#   build   https://github.com/Halildeu/ats/actions/runs/29788943515
# Canlı D29 + aday/İK yolculuğu bu GitOps değişikliği ArgoCD ile
# eşitlendikten sonra faz25-fullats-live-browser-acceptance ile üretilecektir.
#
# Build sanity (apply'sız):
#   kubectl kustomize kustomize/overlays/test/activation/ats-interview-evidence
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-test

resources:
  - ../../../../base/apps/ats-interview-evidence
  - externalsecret.yaml
  - externalsecret-mtls.yaml
  - ingress-ats-api.yaml
  - netpol.yaml
  # ai-stub artık resource değildir: provider live-stt fail-closed; kullanılmayan
  # fallback pod'u test node kapasitesini tüketmez.

images:
  - name: ghcr.io/halildeu/ats-app-boot
    digest: sha256:f3450fd6e59d1dd4f750fbcef4fc2866f31285ea95c4f8466d2476cdad7ea09c

patches:
  # 39d-5: Faz1 mount+hostAlias; Faz2 keystore-parola secretKeyRef (patch içinde).
  # Provider seçimi AŞAĞIDAKİ ConfigMap patch'inde stub → live-stt'ye çevrilir (Faz2).
  - path: patch-mtls-mount.yaml
  # test ortam değerleri (base fail-closed placeholder'larını doldurur)
  - target:
      kind: ConfigMap
      name: ats-interview-evidence-config
    patch: |-
      - op: replace
        path: /data/ATS_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: replace
        path: /data/ATS_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: replace
        path: /data/ATS_PUBLIC_TENANT_ID
        value: "00000000-0000-0000-0000-000000000001"
      # 39d-5 Faz2: provider flip stub → live-stt (Faz24 denetim STT, mTLS).
      # transcribe canlı denetim-PC motoruna gider; cite live-stt'de bilinçli
      # NOT_CONFIGURED (STT-only motor; F4 citation ayrı LLM işi, ADR-0043 T-C).
      # ATS-0017: stub↔live OTO-FALLBACK YASAK (provider=live-stt fail-closed).
      - op: replace
        path: /data/ATS_AI_BASE_URL
        value: "https://live-stt.denetim:8243"
      - op: replace
        path: /data/ATS_AI_ENDPOINT_REF
        value: "faz24-stt-prod"
      - op: replace
        path: /data/ATS_AI_APPROVAL_TRANSCRIBE_REF
        value: "mapr_04cabd439b5b51992e86e215b9796f64d27b91dd951acdf542ab6635d517fc43"
      - op: add
        path: /data/ATS_AI_PROVIDER
        value: "live-stt"
      - op: add
        path: /data/ATS_AI_MTLS_MODE
        value: "required"
      - op: add
        path: /data/ATS_AI_MTLS_KEYSTORE
        value: "/etc/ats-mtls/keystore.p12"
      - op: add
        path: /data/ATS_AI_MTLS_TRUSTSTORE
        value: "/etc/ats-mtls/truststore.p12"
      # ats#200 — aday verisi politikası TEST ortamı beyanı.
      # Owner kararı (2026-07-23): KVKK kısıtı test ortamında uçtan uca
      # doğrulamayı engellememeli; prod'a geçişte engellemeli.
      # Bu iki satır YALNIZ test activation overlay'indedir; base
      # (synthetic-only + prod) prod tarafında değişmeden kalır ve app-boot
      # real-allowed+prod kombinasyonunda fail-closed boot düşürür.
      # Kapsam: sentetik olmayan e-posta/CV yalnız TEST tenant'ında kabul edilir;
      # gerçek aday PII production pilotu hâlâ Legal/DPO owner gate'indedir.
      - op: replace
        path: /data/ATS_CANDIDATE_DATA_MODE
        value: "real-allowed"
      - op: replace
        path: /data/ATS_CANDIDATE_DATA_ENVIRONMENT
        value: "test"
