# ATS app-boot mTLS ExternalSecret — live-STT promotion (ATS-0019 39d-5).
# AYRI ExternalSecret (D43 dersi: tek ES'te eksik key tüm Secret'ı Ready=False'a
# kilitler; mTLS materyali DB secret'inden bağımsız hayat döngüsü). Faz24
# audio-gateway-direct-stt-mtls aynası — fark: ATS boot kontratı PKCS12 ister
# (MtlsSslContextFactory.fromPkcs12), audio-gateway PEM. Vault kv/platform/ats:
#   KEYSTORE_B64   = base64(keystore.p12)   → ESO Base64-decode → keystore.p12
#   TRUSTSTORE_B64 = base64(truststore.p12) → ESO Base64-decode → truststore.p12
#   MTLS_PASSWORD  = keystore+truststore tek parola (fromPkcs12 tek-parola imzası)
# (Vault seed staging-sw'de; private-key denetim-PC dışına çıkmadı — b64 SSH-pipe.)
# p12'ler /etc/ats-mtls'e volume-mount; parola Faz2'de ATS_AI_MTLS_KEYSTORE_PASSWORD
# env'ine secretKeyRef ile bağlanır (envFrom DEĞİL — binary p12'leri env yapmaz).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ats-interview-evidence-mtls
  namespace: platform-test
  labels:
    app.kubernetes.io/name: ats-interview-evidence
    app.kubernetes.io/component: direct-stt-mtls
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: ats-interview-evidence-mtls
    creationPolicy: Owner
  data:
    - secretKey: keystore.p12
      remoteRef:
        key: kv/platform/ats
        property: KEYSTORE_B64
        decodingStrategy: Base64
    - secretKey: truststore.p12
      remoteRef:
        key: kv/platform/ats
        property: TRUSTSTORE_B64
        decodingStrategy: Base64
    - secretKey: MTLS_PASSWORD
      remoteRef:
        key: kv/platform/ats
        property: MTLS_PASSWORD
        decodingStrategy: None
