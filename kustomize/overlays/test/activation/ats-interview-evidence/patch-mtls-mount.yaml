# 39d-5 mTLS deployment patch — keystore/truststore mount + denetim hostAlias +
# keystore parolası (Faz2). Faz1'de mount+hostAlias eklendi (provider stub);
# Faz2'de ConfigMap provider flip (live-stt) + BU env (parola secretKeyRef).
# hostAliases live-stt.denetim → 10.99.0.2 (Faz24 audio-gateway aynası; Caddy
# SNI/Host route + server-cert SAN DNS+IP). Pod→WG yolu #1867 masq+FORWARD fix'le
# onarıldı (cluster-cidr 10.44 + UFW FORWARD ACCEPT br↔wg0; canlı REACHABLE).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ats-interview-evidence
spec:
  template:
    spec:
      hostAliases:
        - ip: 10.99.0.2
          hostnames:
            - live-stt.denetim
      containers:
        - name: app-boot
          # 39d-5 Faz2: keystore parolası secretKeyRef ile (envFrom DEĞİL — binary
          # p12'leri env'e taşımaz). Provider live-stt iken fromPkcs12 bunu okur.
          env:
            - name: ATS_AI_MTLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ats-interview-evidence-mtls
                  key: MTLS_PASSWORD
          volumeMounts:
            - name: ats-mtls
              mountPath: /etc/ats-mtls
              readOnly: true
      volumes:
        - name: ats-mtls
          secret:
            secretName: ats-interview-evidence-mtls
            defaultMode: 0440
            items:
              - key: keystore.p12
                path: keystore.p12
              - key: truststore.p12
                path: truststore.p12
