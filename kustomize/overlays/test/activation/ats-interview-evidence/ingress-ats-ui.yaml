# Mülakat inceleme ekranının yayın yolu.
#
# AYRI bir Ingress; ats-api'ye eklenemez. Oradaki
# nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$2 annotation'ı METADATA
# düzeyindedir ve o Ingress'teki TÜM yollara uygulanır — UI yolu oraya
# konsaydı her istek /api/v1/... olarak yeniden yazılır, statik dosyalar 404
# dönerdi. Bu Ingress rewrite kullanmaz: yol imajdaki base yoluyla birebir
# aynıdır (/ats/interview-evidence/), böylece asset URL'leri ve SPA deep-link
# fallback'i olduğu gibi çalışır.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ats-interview-evidence-ui
  namespace: platform-test
  annotations:
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    # Kanıt dışa aktarımı alıntıları dolaşır ve 60sn'yi aşabilir; imajın kendi
    # nginx'i de 120sn'ye ayarlı, ikisi hizalı olmalı yoksa kenar önce keser.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - testai.acik.com
      secretName: wildcard-acik-com-tls
  rules:
    - host: testai.acik.com
      http:
        paths:
          - path: /ats/interview-evidence
            pathType: Prefix
            backend:
              service:
                name: ats-interview-evidence-ui
                port:
                  number: 8080
