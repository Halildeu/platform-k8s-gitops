# Activation Service patch — Faz 22.6 D10-8 (Codex 019ebc51 P1)
#
# Runtime exposure is an ACTIVATION concern (the base Service stays ClusterIP).
# The standard edge path is now the dedicated ssl-passthrough Ingress:
# `remote-bridge-mtls.testai.acik.com:443` -> host-nginx stream ->
# ingress-nginx ssl-passthrough -> broker 9444. This legacy fallback patch still
# publishes ONLY 9444 as nodePort 31944 for rollback/diagnostic comparison.
# It does not publish 8096/8081 (control #5).
apiVersion: v1
kind: Service
metadata:
  name: endpoint-admin-remote-bridge
spec:
  type: NodePort
  ports:
    - name: grpc-bridge
      port: 9444
      targetPort: bridge
      protocol: TCP
      nodePort: 31944
