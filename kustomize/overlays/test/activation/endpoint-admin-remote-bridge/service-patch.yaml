# Activation Service patch — Faz 22.6 D10-8 (Codex 019ebc51 P1)
#
# Runtime exposure is an ACTIVATION concern (the base Service stays ClusterIP).
# The host nginx `stream` L4 TLS-passthrough edge proxies to the broker
# nodePort: RB-22-6-remote-bridge-pilot-flip.md §A3 expects
# `proxy_pass 127.0.0.1:31944` → broker 9444. This patch publishes ONLY 9444 as
# nodePort 31944. Still no 8096/8081 (control #5).
apiVersion: v1
kind: Service
metadata:
  name: endpoint-admin-remote-bridge
spec:
  type: NodePort
  ports:
    - name: grpc-bridge
      port: 9444
      targetPort: bridge
      protocol: TCP
      nodePort: 31944
