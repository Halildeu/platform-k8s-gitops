  # Re-pinned for backend #710/#711 after the primary test overlay moved to
  # sha-3216a6b5, so owner-gated broker-path close/reopen smoke does not run
  # on the older approved-script-only broker image.
  # Re-pinned for backend #713/#714 after the primary test overlay moved to
