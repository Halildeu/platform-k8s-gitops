# endpoint-admin-remote-bridge ACTIVATION overlay — Faz 22.6 D10-8 (test)
#
# ⚠️  OWNER-GATED. This overlay is the runtime-activation half of the broker
# isolation package. It is DELIBERATELY NOT referenced by
# kustomize/overlays/test/kustomization.yaml — it is NOT in the Argo root, so an
# ArgoCD reconcile / `apply -k overlays/test` can NEVER flip the broker live.
#
# Activation is a deliberate operator action AFTER:
#   1. T-4a-ii broker beans + permit-signing-key config land as merged backend code,
#   2. the broker mTLS / signer / WORM secrets are seeded to
#      kv/platform/endpoint-admin-remote-bridge,
#   3. the live exposure smoke passes (docs/RB-22-6-remote-bridge-pilot-flip.md §A3),
#   4. ADR-0034 §13/D10 owner sign-off for the first live session.
#
# 2026-06-18 #510 parent acceptance verification gate:
#   - topology: Option A true outbound-only agent -> broker mTLS/gRPC stream
#   - no broker -> device egress NetworkPolicy is part of this gate
#   - immutable test digest includes platform-backend#696
#     (`14e6390e9ae3d92a0c012c6220fdddf5b1d82d78`) so live product
#     sessions can capture redacted PERMIT metadata for #510 G6.
#   - immutable test digest includes platform-backend#697
#     (`2612786cd05d986c452ed4dbbf6bb1b12f4a7d4d`) so advisory
#     AgentHello.deviceId cannot veto active machine-cert enrollment trust.
#   - immutable test digest includes platform-backend#698
#     (`9a53fa745ec7dc27ed5166291ec3048e389615d3`) so any remaining live
#     DENY returns bounded/redacted deny.reason and deny.policyGate metadata.
#   - immutable test digest:
#     sha256:4203694562dae5f3ae57ca17f3d8354fce9920026a7e05ee42be550b95a35aa3
#
# Then, and only then:
#   kubectl --context k3d-test -n platform-test apply -k \
#     kustomize/overlays/test/activation/endpoint-admin-remote-bridge
#
# Build sanity (no apply):
#   kubectl kustomize kustomize/overlays/test/activation/endpoint-admin-remote-bridge
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-test

resources:
  - ../../../../base/apps/endpoint-admin-remote-bridge   # the inert scaffold
  - externalsecret.yaml                                   # control #3/#4/#10
  - netpol.yaml                                           # control #6/#7/#8

patches:
  # control #11 / product gate — explicit non-prod trust-basis and approval
  # config for the first Denetim PC product-channel session.
  - path: configmap-activation-patch.yaml
  # control #11 — flips replicas:1 + REMOTE_BRIDGE_ENABLED=true + mounts the
  # mTLS/signer secrets + makes the broker secret required (fail-closed).
  - path: patch-activate.yaml
  # L4 edge exposure — publishes 9444 as nodePort 31944 (still no 8096/8081).
  - path: service-patch.yaml

images:
  # control #11 — immutable digest (D30). SAME image as endpoint-admin-service
  # (Codex A+). Re-pinned after #698 redacted DENY metadata merged, because
  # the latest #510 product smoke on the #697 digest still returned DENY
  # without a visible policy gate. This activation overlay remains outside the
  # Argo root and still requires an explicit owner-gated operator apply before
  # #510 live product-session verification.
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/endpoint-admin-service
    newName: ghcr.io/halildeu/platform-backend-endpoint-admin-service
    digest: sha256:4203694562dae5f3ae57ca17f3d8354fce9920026a7e05ee42be550b95a35aa3
