#
# Build sanity (no apply):
#   kubectl kustomize kustomize/overlays/test/activation/endpoint-admin-remote-bridge
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-test

resources:
  - ../../../../base/apps/endpoint-admin-remote-bridge   # the inert scaffold
  - ingress-passthrough.yaml                             # dedicated 443/SNI broker path
  - externalsecret.yaml                                   # control #3/#4/#10
  - netpol.yaml                                           # control #6/#7/#8

patches:
  # control #11 / product gate — explicit non-prod trust-basis and approval
  # config for the first Denetim PC product-channel session.
  - path: configmap-activation-patch.yaml
  # control #11 — flips replicas:1 + REMOTE_BRIDGE_ENABLED=true + mounts the
  # mTLS/signer secrets + makes the broker secret required (fail-closed).
  - path: patch-activate.yaml
  # Legacy L4 fallback — publishes 9444 as nodePort 31944 (still no 8096/8081).
  # The accepted standard path is the passthrough Ingress above:
  # remote-bridge-mtls.testai.acik.com:443 -> host stream -> ingress-nginx
  # ssl-passthrough -> endpoint-admin-remote-bridge:9444.
  - path: service-patch.yaml

