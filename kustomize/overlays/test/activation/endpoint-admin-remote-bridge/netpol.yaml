# endpoint-admin-remote-bridge NetworkPolicies — Faz 22.6 D10-8 (activation)
#
# The broker is already DEFAULT-DENIED (ingress + egress) by the namespace
# baseline kustomize/base/netpol/default-deny.yaml (podSelector:{} covers every
# pod, including the broker). Because the broker carries NO part-of=platform
# label (control #1), it inherits NONE of the broad platform allowlists. These
# policies ADD the broker's narrow, explicit allows — nothing more.
#
# All policies select ONLY the broker pod:
#   app.kubernetes.io/name: endpoint-admin-remote-bridge
#
# 2026-06-17 product session gate selection: Option A true outbound-only.
# EndpointAgent opens the outbound mTLS/gRPC stream to the broker edge. The
# broker does not open a data-plane connection back to endpoint device IPs for
# this gate.
---
# control #6 — INGRESS allowlist: 9444 from the orchestrator / mTLS L4 edge ONLY.
# Never api-gateway or the part-of=platform blanket. ingress-nginx is allowed
# only for the dedicated ssl-passthrough Ingress/SNI route.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eab-bridge-allow-ingress-9444
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/part-of: remote-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-remote-bridge
  policyTypes:
    - Ingress
  ingress:
    - from:
        # (a) the operator/session orchestrator — a NARROW pod label the owner
        #     applies to the specific orchestrator pod, NOT part-of=platform.
        - podSelector:
            matchLabels:
              remote-bridge.platform/peer: orchestrator
        # (b) ingress-nginx ssl-passthrough controller for the standard 443/SNI
        #     product route. This is L4 passthrough; it does not terminate TLS
        #     or inject identity headers.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        # (c) the dedicated k3d node-netns TCP forwarder for the first
        #     product-channel gate. Host port 9445 forwards into the
        #     k3d-test-server-0 network namespace, then to broker:9444. This is
        #     intentionally narrower than allowing the whole k3d/docker bridge
        #     subnet.
        - ipBlock:
            cidr: 172.19.0.2/32
      ports:
        - protocol: TCP
          port: 9444
  # NOTE control #5 (documented pilot waiver; Codex 019ebc51 P2) — this policy
  # adds NO allow for 8096 (admin HTTP) or 8081 (management), so pod-to-pod and
  # edge paths to them are denied even though the shared image still binds them
  # in-pod. Caveat: kubelet health probes reach 8081 over the node→pod path,
  # which the CNI permits OUTSIDE NetworkPolicy — that same exemption may leave a
  # node-origin 8096/8081 reach un-governed by policy. So "every source denied"
  # is NOT claimed; Phase A acceptance MUST run the negative reachability tests
  # (same-ns pod, ingress-nginx ns, edge/host/node) in OWNER-APPROVAL.md, and the
  # durable close of admin HTTP is a T-4a-ii backend-profile follow-up before the
  # first live session. If smoke shows probes blocked, the owner adds a node-IP
  # ingress allow scoped to 8081.
---
# control #7 — EGRESS allow: DNS (kube-dns).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eab-bridge-allow-egress-dns
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/part-of: remote-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-remote-bridge
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# control #7 — EGRESS allow: OpenFGA-check (in-cluster openfga pod, port 8080).
# Scoped to the openfga pod ONLY — not the part-of=platform intra-ns blanket.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eab-bridge-allow-egress-openfga
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/part-of: remote-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-remote-bridge
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openfga
      ports:
        - protocol: TCP
          port: 8080
---
# control #7 — EGRESS allow: scoped host-bridge for least-priv Postgres (:5432,
# also the WORM recording sink — Postgres-backed DbRecordingSink) and JWKS-read
# (Keycloak :8080). Codex 019ebc51 P1: NOT 0.0.0.0/0 — pinned to the specific
# host-compose endpoint /32s, each on its OWN port (no cross-allow PG:8080 or
# KC:5432). No Vault :8200 — ESO delivers secrets, the broker never talks to
# Vault directly. The test Endpoints IPs (postgres 172.19.0.6, keycloak
# 172.19.0.5) are docker-network-assigned and CAN drift on compose recreate; the
# owner re-verifies from `kubectl -n platform-test get endpoints postgres keycloak`
# at flip (OWNER-APPROVAL.md). Drift = fail-closed (broker can't reach PG/KC →
# not-Ready), never silent-open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eab-bridge-allow-egress-host-bridge
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/part-of: remote-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-remote-bridge
  policyTypes:
    - Egress
  egress:
    # least-priv Postgres + WORM recording sink — ONLY 5432 to the PG host.
    - to:
        - ipBlock:
            cidr: 172.19.0.6/32     # postgres (test Endpoints — owner re-verifies at flip)
      ports:
        - protocol: TCP
          port: 5432
    # Keycloak JWKS-read — ONLY 8080 to the KC host.
    - to:
        - ipBlock:
            cidr: 172.19.0.5/32     # keycloak (test Endpoints — owner re-verifies at flip)
      ports:
        - protocol: TCP
          port: 8080
