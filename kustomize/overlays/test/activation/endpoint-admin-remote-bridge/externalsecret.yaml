# endpoint-admin-remote-bridge ExternalSecrets — Faz 22.6 D10-8 (activation)
#
# control #3 — a SEPARATE Vault path: kv/platform/endpoint-admin-remote-bridge.
# DELIBERATELY NOT kv/platform/endpoint-admin-service. The broker receives NO
# Keycloak-admin password, NO enrollment-token pepper, NO command-encryption key,
# NO broad-DB superuser — only its own broker-scoped credentials.
#
# control #9 — none of these keys is an ambient admin credential: no admin-REST
# token, no admin-JWT, no cluster token. A broker pod compromise yields only the
# least-priv DB role + the session/recording material.
#
# OPERATOR PREREQ (D10): seed kv/platform/endpoint-admin-remote-bridge before
# activation (Vault path + least-priv PG role + mTLS leaf + signer key). See
# OWNER-APPROVAL.md.
---
# (a) Broker runtime secret — least-priv DB role (control #4) + WORM/recording
#     material (control #10). Consumed via envFrom (deployment patch).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endpoint-admin-remote-bridge-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/component: remote-bridge-broker
    app.kubernetes.io/part-of: remote-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: endpoint-admin-remote-bridge-secrets
    creationPolicy: Owner
  data:
    # control #4 — least-privilege Postgres role (session/recording/ledger
    # SELECT/INSERT/UPDATE only; INSERT-only on session_recording_entry =
    # the WORM append-only recording cred, control #10). NOT the primary's
    # db superuser.
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge
        property: broker_db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge
        property: broker_db_password
    # OpenFGA store/model the broker must pin (env-specific). The broker still
    # enforces module authz (control #7 egress: OpenFGA-check).
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge
        property: openfga_store_id
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge
        property: openfga_model_id
    # control #10 — WORM recording anchor signing key (C-2 RecordingAnchorSigner,
    # out-of-band completeness proof over the hash-chain head). The durable WORM
    # sink itself is the Postgres DbRecordingSink (V65 append-only triggers); a
    # dedicated object-lock/immutable store is a production target.
    - secretKey: REMOTE_BRIDGE_RECORDING_ANCHOR_SIGNING_KEY
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge
        property: recording_anchor_signing_key
---
# (b) Broker mTLS leaf (control #6/#11) — mounted as files (T-2c
#     *-pem-path config). Separate from the runtime secret so the cert material
#     never lands in the process env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endpoint-admin-remote-bridge-tls
  namespace: platform-test
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/component: remote-bridge-broker
    app.kubernetes.io/part-of: remote-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: endpoint-admin-remote-bridge-tls
    creationPolicy: Owner
  data:
    # Filenames match RB-22-6-remote-bridge-pilot-flip.md §A2 verbatim so the
    # mounted paths line up with the documented *-pem-path config.
    - secretKey: server-chain.pem
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge
        property: broker_tls_cert_chain_pem
    - secretKey: server-key.pem
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge
        property: broker_tls_private_key_pem
    # The DEVICE CA (agent client certs) — split from the broker CA (Codex
    # dual split-CA: broker-ca ≠ device-ca). Only the device CA verifies
    # incoming agent mTLS.
    - secretKey: device-ca.pem
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge
        property: device_ca_pem
---
# (c) Permit-signing key (T-1b-i) — broker-private EC P-256, mounted as a file.
#     Dedicated asymmetric permit-issuance boundary; NOT the recorder/anchor HMAC.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endpoint-admin-remote-bridge-signer
  namespace: platform-test
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/component: remote-bridge-broker
    app.kubernetes.io/part-of: remote-bridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: endpoint-admin-remote-bridge-signer
    creationPolicy: Owner
  data:
    - secretKey: permit-signing.key
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge
        property: permit_signing_key_pem
