# Dedicated ClusterIP Service for the operator VIEW_ONLY viewer (HTTP 8096).
#
# NEVER NodePort — keeping this ClusterIP keeps 8096 off every node IP. The 9444
# mTLS gRPC bridge stays a SEPARATE Service (NodePort 31944, patched by
# ../endpoint-admin-remote-bridge/service-patch.yaml); this manifest does not touch it.
# Reachability is further constrained to api-gateway pods by
# viewer-from-api-gateway-netpol.yaml.
apiVersion: v1
kind: Service
metadata:
  name: endpoint-admin-remote-bridge-viewer
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
    app.kubernetes.io/part-of: remote-bridge
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: endpoint-admin-remote-bridge
  ports:
    - name: http
      port: 8096
      targetPort: http      # the containerPort named "http" added by deployment-http-port-patch.yaml
      protocol: TCP
