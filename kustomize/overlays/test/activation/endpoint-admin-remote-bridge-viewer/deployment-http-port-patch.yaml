# Viewer http containerPort patch — Faz 22.6 #1580 VIEW_ONLY.
#
# The public 443 SNI device-key bridge advertises ONLY 9444 (bridge) + 8081 (management);
# 8096 (http) is bound in-pod (SERVER_PORT=8096) but intentionally NOT declared
# (control #5). This strategic-merge ADDS the http containerPort so the dedicated
# ClusterIP viewer Service can target it by name. Merge key is containerPort, so
# 9444 + 8081 are preserved; this only adds 8096.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Original resource id; the device-key child renders the suffixed name.
  name: endpoint-admin-remote-bridge
spec:
  template:
    spec:
      containers:
        - name: endpoint-admin-remote-bridge
          ports:
            - name: http
              containerPort: 8096
              protocol: TCP
