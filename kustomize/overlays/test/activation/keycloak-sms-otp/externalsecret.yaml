# gitops#3212 — the auth-service side of the keycloak-sms-otp client
# credential (validates what the KC SPI presents to /oauth2/token). The KC
# side of the SAME value is a docker secret file next to the test compose
# (host-compose/keycloak/test/secrets/sms_otp_client_secret.txt); rotation
# must update BOTH, see RB-kc-sms-otp.md. Seeded 2026-07-31 (sha256[:12]
# cross-side match 5a493ce8da7c).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-sms-otp-secret
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: auth-service-sms-otp-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SERVICE_CLIENT_KEYCLOAK_SMS_OTP_SECRET
      remoteRef:
        key: kv/platform/auth-service
        property: service_client_keycloak_sms_otp_secret
