# Narrow NetworkPolicies for the #548 strong-path broker. The base broker pod is
# outside part-of=platform, so namespace default-deny applies; these policies add
# only the explicit paths required for a test pilot.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eab-device-key-allow-ingress-9444
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
    app.kubernetes.io/part-of: remote-bridge-device-key
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - ipBlock:
            cidr: 172.19.0.2/32
      ports:
        - protocol: TCP
          port: 9444
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eab-device-key-allow-egress-dns
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
    app.kubernetes.io/part-of: remote-bridge-device-key
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eab-device-key-allow-egress-openfga
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
    app.kubernetes.io/part-of: remote-bridge-device-key
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openfga
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eab-device-key-allow-egress-host-bridge
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
    app.kubernetes.io/part-of: remote-bridge-device-key
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.19.0.6/32
      ports:
        - protocol: TCP
          port: 5432
    # Keycloak host-bridge egress for operator-JWT JWKS verification
    # (REMOTE_BRIDGE_OPERATOR_AUTH_JWT_JWK_SET_URI -> keycloak:8080). The Keycloak
    # host container (platform-kc-test) is a docker-bridge endpoint whose IP is NOT
    # statically pinned, so it drifts across host reboots / container recreation
    # (observed 2026-07-10: 172.19.0.5 -> 172.19.0.7 after the host move). A /32 pin
    # then silently blocks JWKS fetch -> Nimbus decoder times out (15s) -> every
    # operator REST call 401s, which surfaced only as an attended-smoke failure.
    # The `keycloak` Service Endpoints already re-track the live IP; scope this egress
    # to the platform-test docker /24 so it stays valid wherever Keycloak lands in the
    # bridge (still restricted to the test docker subnet + port 8080). A durable
    # follow-up is to statically pin the host-service container IPs in host-compose.
    - to:
        - ipBlock:
            cidr: 172.19.0.0/24
      ports:
        - protocol: TCP
          port: 8080
