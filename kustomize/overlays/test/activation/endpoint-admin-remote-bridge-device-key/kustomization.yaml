# endpoint-admin-remote-bridge-device-key ACTIVATION overlay — Faz 22.6 #548 A1
#
# OWNER-GATED and deliberately outside the Argo root. This overlay stands up a
# separate broker for the #548 strong hardware-attestation run. It must never
# replace or mutate the existing denetim pilot broker, which remains on
# MACHINE_CERT_ENROLLMENT for the bounded product-channel pilot.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-test
nameSuffix: -device-key

resources:
  - ../../../../base/apps/endpoint-admin-remote-bridge
  - externalsecret.yaml
  - netpol.yaml

patches:
  - path: identity-patch.yaml
  - path: configmap-device-key-patch.yaml
  - path: patch-activate.yaml
  - path: strategy-patch.yaml
  - path: service-patch.yaml

images:
  # Immutable backend image carrying the #548 device-key challenge issuance path
  # (platform-backend d0911f4160e98c4e07dc735c45da6c3298427411,
  # CI image run 28464372731, digest artifact digest-endpoint-admin-service).
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/endpoint-admin-service
    newName: ghcr.io/halildeu/platform-backend-endpoint-admin-service
    digest: sha256:462bd7444a03e2b3fddcb720a1b563e90fc2425c8cf200dddf635670cd05aae6
