# endpoint-admin-remote-bridge-device-key ExternalSecrets — Faz 22.6 #548 A1.
#
# Separate Vault path from the shared denetim pilot:
#   kv/platform/endpoint-admin-remote-bridge-device-key
#
# Do not paste secret values into GitHub, Mavis, shell history, or evidence.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endpoint-admin-remote-bridge-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
    app.kubernetes.io/component: remote-bridge-device-key-broker
    app.kubernetes.io/part-of: remote-bridge-device-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: endpoint-admin-remote-bridge-secrets-device-key
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: broker_db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: broker_db_password
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: openfga_store_id
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: openfga_model_id
    - secretKey: ENDPOINT_ADMIN_REMOTE_ACCESS_CERT_TRUST_TRUST_ANCHOR_PEM
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: device_ca_pem
    - secretKey: ENDPOINT_ADMIN_REMOTE_ACCESS_CERT_TRUST_CRL_PEM
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: device_crl_pem
    - secretKey: REMOTE_BRIDGE_PEER_TRUST_DEVICE_CA_PEM
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: device_ca_pem
    - secretKey: ENDPOINT_ADMIN_REMOTE_ACCESS_ATTESTATION_PUBLIC_KEY_PEM
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: attestation_public_key_pem
    - secretKey: REMOTE_BRIDGE_STEP_UP_PUBLIC_KEY_PEM
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: operator_step_up_public_key_pem
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endpoint-admin-remote-bridge-tls
  namespace: platform-test
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
    app.kubernetes.io/component: remote-bridge-device-key-broker
    app.kubernetes.io/part-of: remote-bridge-device-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: endpoint-admin-remote-bridge-tls-device-key
    creationPolicy: Owner
  data:
    - secretKey: server-chain.pem
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: broker_tls_cert_chain_pem
    - secretKey: server-key.pem
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: broker_tls_private_key_pem
    - secretKey: device-ca.pem
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: device_ca_pem
    - secretKey: device-crl.pem
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: device_crl_pem
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endpoint-admin-remote-bridge-signer
  namespace: platform-test
  labels:
    app.kubernetes.io/name: endpoint-admin-remote-bridge-device-key
    app.kubernetes.io/component: remote-bridge-device-key-broker
    app.kubernetes.io/part-of: remote-bridge-device-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: endpoint-admin-remote-bridge-signer-device-key
    creationPolicy: Owner
  data:
    - secretKey: permit-signing.key
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: permit_signing_key_pem
    - secretKey: recording-anchor.key
      remoteRef:
        key: kv/platform/endpoint-admin-remote-bridge-device-key
        property: recording_anchor_signing_key
