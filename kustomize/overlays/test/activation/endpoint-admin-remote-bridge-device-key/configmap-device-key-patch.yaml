# Activation ConfigMap patch — Faz 22.6 #548 strong device-key broker.
#
# This is the only broker config that may use DEVICE_KEY_ATTESTATION_REAL. It is
# intentionally separate from the shared denetim pilot broker, which stays on
# MACHINE_CERT_ENROLLMENT until a migration policy is approved.
apiVersion: v1
kind: ConfigMap
metadata:
  name: endpoint-admin-remote-bridge-config
data:
  ENDPOINT_ADMIN_PRIMARY_PLANE_ENABLED: "false"

  REMOTE_BRIDGE_PORT: "9444"
  REMOTE_BRIDGE_HEARTBEAT_INTERVAL_MILLIS: "10000"
  REMOTE_BRIDGE_PERMIT_KID: "rb-test-denetim-device-key-20260627-01"
  REMOTE_BRIDGE_RECORDING_ANCHOR_KEY_PATH: "/etc/remote-bridge/signer/recording-anchor.key"
  REMOTE_BRIDGE_RECORDING_ANCHOR_KEY_ALGORITHM: "SHA256withECDSA"
  REMOTE_BRIDGE_BROKER_POLICY_VERSION: "rb-test-denetim-device-key-v1"
  REMOTE_BRIDGE_BROKER_PERMIT_TTL_MILLIS: "60000"
  # Runs 29406733575 and 29407140294 proved the 120000ms default can expire at
  # the attended Windows approval edge, leaving no lease headroom for policy
  # composition. The explicit 240000ms value is test-only, single-viewer,
  # owner-gated and watchdog-bound; the operation permit remains 60000ms.
  REMOTE_BRIDGE_CONSENT_PROMPT_TTL_MILLIS: "240000"
  REMOTE_BRIDGE_PEER_TRUST_FRESHNESS_TTL_MILLIS: "120000"
  REMOTE_BRIDGE_PEER_EVIDENCE_PARSER: "TRANSPORT_BOUND"
  REMOTE_BRIDGE_DEVICE_TRUST_VERIFIER: "DEVICE_KEY_ATTESTATION_REAL"
  REMOTE_BRIDGE_OWNER_GRANT_GATE_TYPE: "APPROVAL_BACKED_DURABLE_DB"
  # Fail-closed session-backed duress source for the strong #548/#1580 evidence
  # path. Missing or stale session signals still classify as AMBIGUOUS and kill;
  # only a fresh authenticated operator-session signal can assert NONE before
  # the VIEW_ONLY operation.
  REMOTE_BRIDGE_DURESS_SOURCE_TYPE: "SESSION_SIGNAL"
  REMOTE_BRIDGE_DURESS_SIGNAL_TTL_MILLIS: "120000"
  REMOTE_BRIDGE_DURESS_PILOT_RISK_ACCEPTED: "false"

  # The REAL verifier needs the EK-chain validator bean. Vault PKI issuance is
  # handled by the primary endpoint-admin-service /attest path; this broker only
  # needs tpm-attest enabled plus pinned manufacturer roots so it can validate
  # EK chains during the session verifier decision.
  ENDPOINT_ADMIN_TPM_ATTEST_ENABLED: "true"
  ENDPOINT_ADMIN_TPM_ATTEST_ALLOWED_TENANT_IDS: "00000000-0000-0000-0000-000000000001"
  # Public manufacturer roots only. Nuvoton TPM Root CA 2111 is required by
  # MKR-A1's NPCT75x EK certificate and is pinned by its official DER SHA-256.
  ENDPOINT_ADMIN_TPM_ATTEST_MANUFACTURER_ROOT_SHA256: "beb40bb7507b33967226aa80e084749fbb6593893c642e818d682e9a8d07fc24,899e35474c9807eb4c7f2f7a12da0028fb250cd02154d0009fca7d9c66574f3b,cd8185ff8995ed09811970090a8c36fafab34ef87f47fa51fdb9ecf95c9c2e04"
