apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-test
resources:
  - ../../../../base/apps/etik-speak
  - secretstore.yaml
  - externalsecret.yaml
  - ingress-public-api.yaml
  - ingress-public-ui.yaml
  - ingress-staff-api.yaml
  - ingress-manager-ui.yaml
  - netpol.yaml
  - resource-quota.yaml
  - priority-class.yaml
images:
  # Exact branch artifacts: backend source a5b6d3a5 / run 29803062932 (Faz 35
  # ES-306 transport boundary hardening — X-Forwarded-Proto fallback +
  # empty-Authorization bypass fix, platform-backend PR #908), public-web
  # source 4eaf02bf / run 29710051185, and dedicated manager-web source
  # 308a2777 / run 29716679615. Their immutable identities are content-bound
  # by signed provenance in the Faz 35 image-set ledger. Root activation is
  # included only by the post-provisioning commit that pins the reviewed
  # Vault role and OpenFGA store/model IDs.
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/ethics-service
    newName: ghcr.io/halildeu/platform-backend-ethics-service
    digest: sha256:f8fe0cd588c99ef78848bb4e0200d1268e0a4d6c6afc8599812dc7c18657db53
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/etik-speak-public
    newName: ghcr.io/halildeu/platform-web-etik-speak-public
    digest: sha256:b9a9e8b1bc0e60bd63f8f469f418f2d9b227dbdb86d199ee38502b47298c7b2f
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/etik-speak-manager
    newName: ghcr.io/halildeu/platform-web-etik-speak-manager
    digest: sha256:ab9b55a52f1cca362d6d69c548e1e9f038e69c07ded468adfee28c1a43c133da
patches:
  - target: {kind: Deployment, name: ethics-service}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
  - target: {kind: Deployment, name: etik-speak-public}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
  - target: {kind: Deployment, name: etik-speak-manager}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
