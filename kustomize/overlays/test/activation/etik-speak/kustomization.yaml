apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-test
resources:
  - ../../../../base/apps/etik-speak
  - externalsecret.yaml
  - ingress-public-api.yaml
  - ingress-public-ui.yaml
  - ingress-staff-api.yaml
  - netpol.yaml
  - resource-quota.yaml
  - priority-class.yaml
images:
  # Exact branch artifacts: backend source 69a1e672 / run 29672392833 and
  # public-web source 49eb6424 / run 29672789348. Root activation remains
  # forbidden until the exact-head review gate is satisfied.
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/ethics-service
    newName: ghcr.io/halildeu/platform-backend-ethics-service
    digest: sha256:1acca0d7c7edf900521b4418bb4fe8385d30086646e611c2081a85e10206ed8c
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/etik-speak-public
    newName: ghcr.io/halildeu/platform-web-etik-speak-public
    digest: sha256:c109e478afb6d297eb8cb6842cff6d30ece0532e12a3967ba2db1ab54cbd57ed
patches:
  - target: {kind: Deployment, name: ethics-service}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
  - target: {kind: Deployment, name: etik-speak-public}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
