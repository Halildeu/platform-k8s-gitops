apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-test
resources:
  - ../../../../base/apps/etik-speak
  - secretstore.yaml
  - externalsecret.yaml
  - externalsecret-notification.yaml
  - ingress-public-api.yaml
  - ingress-public-ui.yaml
  - ingress-staff-api.yaml
  - ingress-manager-ui.yaml
  - netpol.yaml
  - resource-quota.yaml
  - priority-class.yaml
images:
  # Exact branch artifacts: backend merge ffaa2352 / run 30192977173, which is
  # the first main build carrying the fail-closed evidence custody pipeline and
  # the lost-capability rotation fix (platform-backend #927 and #928 — the cell
  # had been running the 2026-07-21 image, in which the attachment endpoints do
  # not exist at all and every declaration answered 403). public-web source
  # 4eaf02bf / run 29710051185; dedicated manager-web source 2fae733d / run
  # 29787052080. Their immutable identities are content-bound by signed
  # provenance in the Faz 35 image-set ledger. Root activation is included only
  # by the post-provisioning commit that pins the reviewed Vault role and
  # OpenFGA store/model IDs.
  #
  # This digest was read back from an actual pull into the target cluster. A
  # build-log digest is not evidence that a tag is pullable, and pinning one has
  # already left a service silently un-rolled.
  #
  # 2026-07-27 bump: sha-48182b4 — platform-backend#947 (ES-203 B+ dilim 1).
  # Davada kisi artik etiketle degil principal olarak adlandiriliyor:
  # POST /api/v1/ethics/cases/{id}/participants. Katilimci satiri hicbir yetki
  # VERMEZ; erisim hala urun uyeliginden gelip conflicted/recused ile cikariliyor.
  # Onceki: sha-191005e — platform-backend#943. #942'nin yazdigi
  # `recusal.repeated` olayina hicbir istek ulasamiyordu (ilk beyan davayi
  # gorusten cikardigi icin ikinci POST 404 aliyor); olu dal kaldirildi.
  # Onceki: sha-e130caa — platform-backend#942 (ES-203). Personel artık
  # bir davadan kayda geçerek çekilebiliyor: POST /api/v1/ethics/cases/{id}/recusal.
  # Yaptırım zaten vardı (can() `recused` ilişkisini soruyordu); eksik olan beyandı
  # — çekilme yalnız OpenFGA'ya elle tuple yazılarak kurulabiliyordu, denetim
  # defterinde izi yoktu.
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/ethics-service
    newName: ghcr.io/halildeu/platform-backend-ethics-service
    # 2026-08-01 bump 5: sha-b446ae4 — platform-backend#1062 (ES-104K dilim 1).
    # WebP kaniti: saf Java decode (TwelveMonkeys exact pin), turev PNG'ye
    # duzlestirilir (metadata yapisal gider); TUM raster formatlara decode-oncesi
    # tuval kapisi. Digest gercek pull ile (smoke-dig-wp).
    # Onceki: sha-866dc21 @ sha256:bda8303d89bfa34b7...
    # 2026-08-01 bump 6+7 (birlesik): sha-c7e2795 — platform-backend#1064
    # (HEIC decode hatti) + #1065 (HeicConverter tek-bean duzeltmesi). Ilk HEIC
    # promosyonu (sha-28e1824) worker'i crash-loop'a soktu (havingValue=""
    # semantigi ile IKI bean); paralel oturum #3325 ile dogru sekilde rollback
    # etti. Bu pin ozellik+duzeltmeyi birlikte tasir; wiring testi ikiligi
    # pinler. Digest gercek pull ile (smoke-dig-bf).
    # Onceki: sha-b446ae4 @ sha256:ad6e28eb380bf16619b45795d7...
    digest: sha256:df77f7134bcb75d61b85c2c2cb44313bebc33bc2bba6e433269c54adf4e26a37
  # ES-104K dilim 2 (#2930): HEIC donusturucu. Digest hedef host'ta gercek
  # pull + probe ile dogrulandi (imaginary 1.2.4 / libvips 8.10; Apple-kodlu
  # HEIC -> PNG, HTTP 200). Cikti asla turev olmaz — worker in-JVM recode eder.
  - name: docker.io/h2non/imaginary
    digest: sha256:7facb4221047a5e79b9e902f380247f4e5bf4376400d0badbeb738d3e1c2f654
  # Pinned scanner. The same digest is handed to the pipeline as its declared
  # scanner identity, so recorded provenance and running container cannot drift.
  - name: docker.io/clamav/clamav
    digest: sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/etik-speak-public
    newName: ghcr.io/halildeu/platform-web-etik-speak-public
    # platform-web #1016 — indirilen erisim dosyasiyla posta kutusu acilir,
    # birden fazla ek eklenebilir, yuklemeler sirali.
    # 2026-08-01 bump 3: platform-web#1108 — WebP allowlist + accept + yardim
    # metni; issue sarti geregi backend canli kabulunden SONRA genisletildi.
    # Kaynak: f88437152bda1624808d4929caef819b0cc1c7ee (etiket TAM sha).
    # Digest gercek pull ile (smoke-dig-wu).
    # Onceki: 22ecb02d (#1103) @ sha256:eb356ebcf09102016...
    digest: sha256:f9a921ea8f63a9a46aba98cbd0dc51aca46c67c014ca3f6d3425fe10b9f54a9a
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/etik-speak-manager
    newName: ghcr.io/halildeu/platform-web-etik-speak-manager
    # platform-web #1081 — manager hücresi ana platformun kabuğunu giydi:
    # gerçek design-system ShellHeader+ShellSidebar, kanonik üretilmiş tema,
    # taklit adapter silindi. (Önceki blokta defter 69a4a304, yorum f5e32d6d
    # diyordu — aynı digest için iki farklı kaynak kaydı; bu blok ikisini de
    # tek gerçeğe bağlıyor.)
    # Kaynak: ca9ce3a9eeda58ea2e48a4ab95ea948031a73a49
    # Etiket: sha-ca9ce3a9eeda58ea2e48a4ab95ea948031a73a49 (bu hat TAM sha etiketi kullanır)
    # Digest registry manifest'inden çözüldü; build-log digest'i pin'lenmez.
    # 2026-08-01 bump: platform-web#1104 — vaka listesi is kuyruguna donustu:
    # aciliyet sirasi (suresi gecmis > yaklasan > sahipsiz > guncellik) +
    # ihlal oncesi geri sayim cipi. Kaynak: 8bcccc994c055d6cfb6870d9146d568db1919138
    # Etiket TAM sha; digest gercek pull ile okundu (smoke-dig-mgr pod).
    # Onceki: sha256:e658bd5f84b6abc11...
    # 2026-08-01 bump 2: platform-web#1106 — taslak kutusu sunucu sablonuna
    # baglandi: GET acknowledgement-draft + POST acknowledgement, eksik bolum
    # uyarisi duzenlerken. Kaynak: 72213c91d8462b1e5b1c1ffce51452cd10ac81ec
    # (etiket TAM sha; digest gercek pull ile, smoke-dig-au pod).
    # Onceki: 8bcccc99 @ sha256:4e7eb5f89712f1d58...
    digest: sha256:9807b816b7369c3b66c4fd410b2340edc034ced2081b4fec25bec6f2f0266ffa
patches:
  - target: {kind: ConfigMap, name: ethics-service-config}
    patch: |-
      # ES-2 (#3271): son-gun agi yalniz istek karsilayan dagitimda kosar —
      # delivery loop'lariyla ayni sebep: outbox-sekilli is basina tek poller.
      - op: add
        path: /data/ETHICS_ACK_NET_ENABLED
        value: "true"
      - op: add
        path: /data/ETHICS_AUDIT_DELIVERY_ENABLED
        value: "true"
      - op: add
        path: /data/ETHICS_NOTIFICATION_DELIVERY_ENABLED
        value: "true"
      - op: add
        path: /data/ETHICS_NOTIFICATION_RECIPIENT_SUBSCRIBER_ID
        value: "f8a3b6f6-a984-49d1-b666-c535b11c742f"
      - op: add
        path: /data/ETHICS_NOTIFICATION_CHANNEL
        # The orchestrator's allow-set spells this `in-app`. `inapp` was
        # rejected at the submit gate, so every Faz 35 signal dead-lettered
        # while both services looked healthy (platform-backend #937).
        value: "in-app"
      - op: add
        path: /data/ETHICS_NOTIFICATION_LOCALE
        value: "tr-TR"
      - op: add
        path: /data/ETHICS_NOTIFICATION_MAX_ATTEMPTS
        value: "8"
      - op: add
        path: /data/ETHICS_NOTIFICATION_RETRY_BASE_DELAY
        value: "10s"
      - op: add
        path: /data/ETHICS_NOTIFICATION_RETRY_MAX_DELAY
        value: "15m"
      # ES-301 (#882) — SLA erken uyarısı (SLA_APPROACHING) için iş günü penceresi.
      # Yasal son tarihe DOKUNMAZ (BusinessCalendarTest bunu kaynaktan doğrular);
      # yalnız "son tarihe <=N iş günü kaldı" sinyalinin eşiği. Owner-supplied:
      # bu değer test hücresinin tercihi, prod'da sahibin kararıyla ayrı verilir.
      # Env adı Spring relaxed binding'in kebab->ENV katlamasıyla eşleşir:
      # ethics.sla.calendar.warn-business-days -> ETHICS_SLA_CALENDAR_WARNBUSINESSDAYS.
      - op: add
        path: /data/ETHICS_SLA_CALENDAR_WARNBUSINESSDAYS
        value: "10"
      # Faz 35 — CANLI/TEST adres ayrımı (owner kararı 2026-07-23).
      #   etik.acik.com     = CANLI  -> default org ...0001 (gerçek çalışan ihbarları)
      #   speakup.acik.com  = TEST   -> org ...0003 (sentetik doğrulama)
      # M2 multi-tenant resolver (platform-backend #925) host'tan org çözer;
      # haritada olmayan host default org'a düşer. Bu ayrım sayesinde test
      # ihbarları canlı kayıtlarla ASLA aynı org'a yazılmaz — silme gerekmez,
      # kanunî delil zinciri temiz kalır.
      - op: add
        path: /data/SPRING_APPLICATION_JSON
        # Köşeli parantez ZORUNLU: Spring, SPRING_APPLICATION_JSON'ı düz
        # property'lere açarken noktalı key'i iç içe map sanır
        # (speakup -> acik -> com) ve host eşleşmesi sessizce kaçar; ihbar
        # default org'a düşer. `[...]` key'i tek parça olarak bağlar.
        # 2026-07-24 canlı doğrulamada bu tuzağa düşüldü, kanıtla saptandı.
        value: '{"ethics":{"tenancy":{"public-hosts":{"[speakup.acik.com]":"00000000-0000-0000-0000-000000000003"}}}}'
  - target: {kind: Deployment, name: ethics-service}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: ethics-service-notification-secret
            optional: false
  - target: {kind: Deployment, name: ethics-evidence-worker}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
  # ES-104J (#2929): PDF CDR işçisi aktivasyonu. Sanitizer/parser digest'i bu
  # işçinin KOŞTUĞU ethics-service imajının digest'idir (CDR renderer imajın
  # içinde) — hedef kümeye gerçek pull ile okundu (smoke-dig-cdr pod), build
  # log'undan kopyalanmadı. İnsan-okur etiket kabul edilmez (#2860): işlemci
  # sha256 olmayan değerle EVIDENCE_TOOL_PROVENANCE_UNVERIFIED verir.
  - target: {kind: Deployment, name: ethics-cdr-worker}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
  - target: {kind: ConfigMap, name: ethics-cdr-worker-config}
    patch: |-
      - op: replace
        path: /data/ETHICS_EVIDENCE_SANITIZER_DIGEST
        value: sha256:147950e79079926735e21424a65c468f938ed828e08ae31645aea3f81792a0de
      - op: replace
        path: /data/ETHICS_EVIDENCE_PARSER_DIGEST
        value: sha256:147950e79079926735e21424a65c468f938ed828e08ae31645aea3f81792a0de
  - target: {kind: Deployment, name: clamav}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
  - target: {kind: Deployment, name: heic-converter}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
  - target: {kind: Deployment, name: etik-speak-public}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
  - target: {kind: Deployment, name: etik-speak-manager}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
