apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-test
resources:
  - ../../../../base/apps/etik-speak
  - secretstore.yaml
  - externalsecret.yaml
  - ingress-public-api.yaml
  - ingress-public-ui.yaml
  - ingress-staff-api.yaml
  - netpol.yaml
  - resource-quota.yaml
  - priority-class.yaml
  - public-api-upstream-headers.yaml
images:
  # Exact branch artifacts: backend source 848e60a6 / run 29708989658 and
  # public-web source 1d45fec0 / run 29709320292. Their immutable identities
  # are content-bound by signed provenance in the Faz 35 image-set ledger.
  # Root activation remains
  # forbidden until the exact-head review and provisioning gates are satisfied.
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/ethics-service
    newName: ghcr.io/halildeu/platform-backend-ethics-service
    digest: sha256:24bf6ac027c0ee602ed5518e7dd6653739c3849be1ee59c798d974012f72e546
  - name: ghcr.io/OVERLAY_MUST_OVERRIDE/etik-speak-public
    newName: ghcr.io/halildeu/platform-web-etik-speak-public
    digest: sha256:6f6f51eb609906c7d1b220eed7e48ddfadad13506cc2ce2cae377c8ebf4cb297
patches:
  - target: {kind: Deployment, name: ethics-service}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
  - target: {kind: Deployment, name: etik-speak-public}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/priorityClassName
        value: etik-speak-test
