    # Kaynak: 6f9ee66d8d3b7a8f4c1f4cc971b4a17edc854bd1 (etiket TAM sha).
    # Digest gercek cekisle dogrulandi (syft registry pull, aiserver).
    # Onceki: 72213c91 (#1106) @ sha256:9807b816b7369c3b66c...
    # 2026-08-02 bump 4: platform-web #1114-#1117 — vaka yasam dongusunun son
    # iki halkasi arayuze cikti: yaptirim kaydi (ihlal agirlik puani -> band,
