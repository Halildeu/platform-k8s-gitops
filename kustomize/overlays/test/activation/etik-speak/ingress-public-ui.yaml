apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etik-speak-public-ui
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # ES-106 anonymous reporter boundary: public request metadata may be used
    # in-memory for rate limiting but must not become a durable access record.
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/enable-opentelemetry: "false"
    nginx.ingress.kubernetes.io/proxy-set-headers: platform-test/etik-speak-public-upstream-headers
    etik-speak.acik.com/no-correlation-policy: es106-v2
    # The anonymous reporter UI has no cookie dependency. Suppressing every
    # upstream Set-Cookie is a fail-closed superset of the Domain=.acik.com
    # prohibition and prevents suite-cookie propagation across public aliases.
    nginx.ingress.kubernetes.io/proxy-hide-headers: "Set-Cookie"
    # ES-313 (2026-07-21, owner explicit "riskleri anladım hemen aç"):
    # sentetik-test Basic Auth gate KALDIRILDI. Reporter UI artık anonim
    # erişime açık. Anti-abuse ingress rate-limit ile enforce edilir.
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-rpm: "300"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [etik.acik.com, speakup.acik.com]
      secretName: wildcard-acik-com-tls
  rules:
    - host: etik.acik.com
      http: &publicUi
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: etik-speak-public, port: {number: 80}}
    - host: speakup.acik.com
      http: *publicUi
