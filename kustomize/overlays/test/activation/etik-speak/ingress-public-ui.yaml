apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etik-speak-public-ui
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # ES-313 (2026-07-21, owner explicit "riskleri anladım hemen aç"):
    # sentetik-test Basic Auth gate KALDIRILDI. Reporter UI artık anonim
    # erişime açık. Anti-abuse ingress rate-limit ile enforce edilir.
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-rpm: "300"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [etik.acik.com, speakup.acik.com]
      secretName: wildcard-acik-com-tls
  rules:
    - host: etik.acik.com
      http: &publicUi
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: etik-speak-public, port: {number: 80}}
    - host: speakup.acik.com
      http: *publicUi
