apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etik-speak-public-ui
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # ES-106 anonymous reporter boundary: public request metadata may be used
    # in-memory for rate limiting but must not become a durable access record.
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/enable-opentelemetry: "false"
    # ES-313 (2026-07-21, owner explicit "riskleri anladım hemen aç"):
    # sentetik-test Basic Auth gate KALDIRILDI. Reporter UI artık anonim
    # erişime açık. ES-106 anti-abuse host edge'de gerçek client IP ile
    # volatile uygulanır; bu ingress'e client identity taşınmaz.
spec:
  ingressClassName: nginx
  tls:
    - hosts: [etik.acik.com, speakup.acik.com]
      secretName: wildcard-acik-com-tls
  rules:
    - host: etik.acik.com
      http: &publicUi
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: etik-speak-public, port: {number: 80}}
    - host: speakup.acik.com
      http: *publicUi
