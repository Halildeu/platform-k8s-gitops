apiVersion: v1
kind: ResourceQuota
metadata: {name: etik-speak-budget}
spec:
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: [etik-speak-test]
  hard:
    requests.cpu: "1"
    # Five Deployments may surge by one pod at the same time. The ceilings
    # cover the ten-pod rollout peak plus two repair/rollback pods, including
    # the memory-heavy immutable malware scanner.
    requests.memory: 2Gi
    limits.cpu: "6500m"
    limits.memory: 5Gi
    pods: "12"
