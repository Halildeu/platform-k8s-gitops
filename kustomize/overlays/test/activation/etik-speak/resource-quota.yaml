apiVersion: v1
kind: ResourceQuota
metadata: {name: etik-speak-budget}
spec:
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: [etik-speak-test]
  hard:
    requests.cpu: "200m"
    requests.memory: 256Mi
    limits.cpu: "750m"
    limits.memory: 640Mi
    pods: "4"
