apiVersion: v1
kind: ResourceQuota
metadata: {name: etik-speak-budget}
spec:
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: [etik-speak-test]
  hard:
    requests.cpu: "200m"
    # Both Deployments may surge by one pod at the same time. These ceilings
    # cover steady state plus both immutable-digest rollout/rollback pods.
    requests.memory: 384Mi
    limits.cpu: "1250m"
    limits.memory: 1Gi
    pods: "4"
