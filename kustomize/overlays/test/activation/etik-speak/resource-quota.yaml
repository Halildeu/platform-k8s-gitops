apiVersion: v1
kind: ResourceQuota
metadata: {name: etik-speak-budget}
spec:
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: [etik-speak-test]
  hard:
    # ES-104G added two workloads: the evidence worker and the malware scanner.
    # Both use the Recreate strategy and therefore never surge, but the three
    # request-facing Deployments still may, so the headroom that makes rollback
    # possible is preserved rather than consumed by the new pods.
    #
    # clamd dominates the memory line: it loads the whole signature database
    # into RSS, and a ceiling that merely looks generous gets it OOM-killed
    # during startup — which presents as a crash-loop with no scan ever run.
    # ES-104J (#2929) budu: CDR iscisi +100m/+512Mi request, +1000m/+1536Mi
    # limit, +1 pod (Recreate: surge yok). Olcumsuz buyutme degil — degerler
    # cdr-worker-deployment.yaml'daki butcenin kendisi.
    # ES-104K dilim 2'nin heic-converter butcesi ES-306 (#2665) bulgusuyla geri
    # cekildi: donusturucu 0 replika. Var olmayan bir pod icin rezerv tutmak
    # yanlis muhasebe olurdu ve sozlesme zaten tavani RENDER'dan turetiyor —
    # bakimli imajla geri acilirken ayni satirlar geri gelir (#3335).
    requests.cpu: "800m"
    requests.memory: 3584Mi
    limits.cpu: "5500m"
    limits.memory: 7680Mi
    pods: "11"
