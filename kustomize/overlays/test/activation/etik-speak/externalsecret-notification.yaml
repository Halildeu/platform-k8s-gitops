apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ethics-service-notification-secret
  labels:
    app.kubernetes.io/name: ethics-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: etik-speak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: etik-speak-vault
  target:
    name: ethics-service-notification-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ETHICS_NOTIFICATION_CLIENT_SECRET
      remoteRef:
        key: kv/platform/etik-speak
        property: ETHICS_NOTIFICATION_CLIENT_SECRET
