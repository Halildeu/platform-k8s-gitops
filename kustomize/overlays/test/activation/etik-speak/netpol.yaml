apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: etik-speak-public}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: etik-speak-public}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{port: 8080, protocol: TCP}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: etik-speak-manager}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: etik-speak-manager}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{port: 8080, protocol: TCP}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ethics-service}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ethics-service}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
      ports: [{port: 8099, protocol: TCP}]
    # Faz 35 SRE — Prometheus scrape /actuator/prometheus (management:8081).
    # Yalnız monitoring namespace'inden gelen scrape trafiği geçer; ingress-nginx
    # veya diğer application pod'ları bu porta ulaşamaz. Prometheus-operator'ın
    # canonical namespace label'ı kube-prometheus-stack helm chart default'u.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports: [{port: 8081, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 172.19.0.6/32}}]
      ports: [{port: 5432, protocol: TCP}]
    - to: [{ipBlock: {cidr: 172.19.0.7/32}}]
      ports: [{port: 8080, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: openfga}}}]
      ports: [{port: 8080, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: permission-service}}}]
      # Named port resolves against the destination pod (8084), while callers
      # keep using the stable Service port 8090. This remains correct across
      # kube-proxy DNAT ordering differences between NetworkPolicy engines.
      ports: [{port: http, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: auth-service}}}]
      ports: [{port: http, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: notification-orchestrator}}}]
      ports: [{port: http, protocol: TCP}]
    # ES-203/C: display-name resolution. The assignment picker needs a name to
    # show; the subject stays server-to-server and the name is pass-through —
    # ethics-service stores it nowhere. What this rule opens is bounded by the
    # token: the ethics identity may mint only `users:display-names:read`
    # against user-service, so it can resolve a name and nothing else.
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: user-service}}}]
      ports: [{port: http, protocol: TCP}]
    # ES-104G: host-bridged MinIO. The request-facing pod reaches the object
    # store to admit an upload and to stream a finished derivative; what it may
    # do once connected is bounded by its MinIO policy, not by this rule.
    - to: [{ipBlock: {cidr: 172.19.0.252/32}}]
      ports: [{port: 9000, protocol: TCP}]
---
# ES-104G evidence worker. It answers no traffic: the only ingress is the
# Prometheus scrape, so an attacker who reaches the namespace still has no
# request surface here. Egress is the exact processing path and nothing else —
# in particular there is no route to the public internet, which is what makes
# the pinned scanner definitions meaningful.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ethics-evidence-worker}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ethics-evidence-worker}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports: [{port: 8081, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 172.19.0.6/32}}]
      ports: [{port: 5432, protocol: TCP}]
    - to: [{ipBlock: {cidr: 172.19.0.252/32}}]
      ports: [{port: 9000, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: clamav}}}]
      ports: [{port: 3310, protocol: TCP}]
    # ES-104K dilim 2: HEIC donusturucuye tek hat. Yalniz core-serit worker'i
    # (pdf seridi ve API bu hatti hic kullanmaz; onlarin config'inde URL yok).
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: heic-converter}}}]
      ports: [{port: 9000, protocol: TCP}]
---
# ES-104J (#2929): the PDF CDR worker's world is exactly the core worker's —
# DNS, the database, the object store, the scanner. No general egress: the
# whole point of a no-network CDR sandbox is that a document which somehow
# executes anyway has nowhere to call. Proven the same way as the core worker:
# anything not listed here is denied by the namespace default-deny.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ethics-cdr-worker}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ethics-cdr-worker}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports: [{port: 8081, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to: [{ipBlock: {cidr: 172.19.0.6/32}}]
      ports: [{port: 5432, protocol: TCP}]
    - to: [{ipBlock: {cidr: 172.19.0.252/32}}]
      ports: [{port: 9000, protocol: TCP}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: clamav}}}]
      ports: [{port: 3310, protocol: TCP}]
---
# ES-104K dilim 2: the converter is not a shared service either. Only the
# core-lane evidence worker may hand it bytes; it initiates NOTHING (egress
# empty, and -enable-url-source=false in the container arguments besides).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: heic-converter}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: heic-converter}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ethics-evidence-worker
              app.kubernetes.io/part-of: etik-speak
      ports: [{port: 9000, protocol: TCP}]
  egress: []
---
# The scanner is not a shared service. Only the two custody workers may hand it
# bytes, and it initiates nothing itself.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: clamav}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: clamav}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ethics-evidence-worker
              app.kubernetes.io/part-of: etik-speak
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ethics-cdr-worker
              app.kubernetes.io/part-of: etik-speak
      ports: [{port: 3310, protocol: TCP}]
  egress: []
---
# The destination pods are selected by the namespace default-deny and their
# broad intra-namespace allow accepts only part-of=platform sources. Etik Speak
# is deliberately isolated, so grant only its backend the two exact authz hops.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ethics-service-to-openfga}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: openfga}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ethics-service
              app.kubernetes.io/part-of: etik-speak
      ports: [{port: 8080, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ethics-service-to-permission-service}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: permission-service}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ethics-service
              app.kubernetes.io/part-of: etik-speak
      # NetworkPolicy ingress is evaluated at the destination pod, not at the
      # Service's public port 8090; `http` resolves to containerPort 8084.
      ports: [{port: http, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ethics-service-to-auth-service}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: auth-service}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ethics-service
              app.kubernetes.io/part-of: etik-speak
      ports: [{port: http, protocol: TCP}]
---
# ES-203/C — the destination half of the display-name call.
#
# `allow-ingress-intra-ns` lets pods labelled `part-of: platform` reach each
# other, and user-service is one of them. etik-speak pods are NOT: they carry
# `part-of: etik-speak`, so intra-ns does not cover them and
# `default-deny-ingress` (podSelector {}) applies. That is why every
# etik-speak -> platform hop in this file needs its own ingress grant; the
# egress rule alone leaves the packet refused at the far end, which is exactly
# how this was measured on the running cell:
#
#   ethics-service netns -> user-service podIP:8089  ->  connect refused
#   ethics-service netns -> auth-service podIP:8088  ->  HTTP 401 (reachable)
#
# NetworkPolicy grants are additive, so this neither narrows nor replaces
# `allow-ingress-intra-ns`; every existing platform caller keeps reaching
# user-service exactly as before.
#
# The gateway is named nowhere here on purpose: a contract test forbids that
# literal anywhere in this file, because the etik-speak cell must never be
# granted platform-gateway reachability. This grant runs the other way — an
# etik-speak pod reaching a platform pod — and stays outside that rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ethics-service-to-user-service}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: user-service}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ethics-service
              app.kubernetes.io/part-of: etik-speak
      ports: [{port: http, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-ethics-service-to-notification-orchestrator}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: notification-orchestrator}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ethics-service
              app.kubernetes.io/part-of: etik-speak
      ports: [{port: http, protocol: TCP}]
