apiVersion: v1
kind: ServiceAccount
metadata:
  name: ethics-evidence-scanner
  labels:
    app.kubernetes.io/name: ethics-evidence-scanner
    app.kubernetes.io/component: malware-scanner
    app.kubernetes.io/part-of: etik-speak
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ethics-evidence-scanner
  labels:
    app.kubernetes.io/name: ethics-evidence-scanner
    app.kubernetes.io/component: malware-scanner
    app.kubernetes.io/part-of: etik-speak
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: ethics-evidence-scanner}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ethics-evidence-scanner
        app.kubernetes.io/component: malware-scanner
        app.kubernetes.io/part-of: etik-speak
    spec:
      serviceAccountName: ethics-evidence-scanner
      automountServiceAccountToken: false
      priorityClassName: etik-speak-test
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clamav
          image: docker.io/clamav/clamav@sha256:83130a3b60654a4f226feffea549792cfcf28ea6b9de1dee210c8064cd114006
          imagePullPolicy: IfNotPresent
          command: [/init-unprivileged]
          env:
            # Signature updates are delivered only through a reviewed immutable
            # image refresh. The scanner pod itself has zero egress.
            - {name: CLAMAV_NO_FRESHCLAMD, value: "true"}
            - {name: CLAMD_STARTUP_TIMEOUT, value: "600"}
          ports:
            - {name: clamd, containerPort: 3310, protocol: TCP}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 1500m, memory: 1Gi}
          startupProbe:
            tcpSocket: {port: clamd}
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: clamd}
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket: {port: clamd}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: log, mountPath: /var/log/clamav}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: log
          emptyDir: {sizeLimit: 64Mi}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ethics-evidence-scanner
  labels:
    app.kubernetes.io/name: ethics-evidence-scanner
    app.kubernetes.io/component: malware-scanner
    app.kubernetes.io/part-of: etik-speak
spec:
  selector: {app.kubernetes.io/name: ethics-evidence-scanner}
  ports:
    - {name: clamd, port: 3310, targetPort: clamd, protocol: TCP}
