apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etik-speak-public-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # ES-106 anonymous reporter boundary: public request metadata may be used
    # in-memory for rate limiting but must not become a durable access record.
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/enable-opentelemetry: "false"
    # ES-313 (2026-07-21, owner explicit "riskleri anladım hemen aç"):
    # sentetik-test Basic Auth gate KALDIRILDI. Kanal artık gerçek muhbir
    # trafiğine açık. Anti-abuse ingress rate-limit + boundary NetworkPolicy
    # + backend ES-306 hardening ile enforce edilir. ES-106 header/cookie
    # minimization and per-client rate limit run at the host edge, before the
    # cluster boundary.
    # ES-104G: the custody contract caps a declaration at 26214400 bytes and the
    # service enforces that ceiling itself. A 2m edge limit silently overrode it
    # — anything larger died as a 413 at nginx, so the published 25 MiB policy
    # was never the operative one. 26m leaves room for request framing above the
    # exact byte cap the application rejects on its own.
    nginx.ingress.kubernetes.io/proxy-body-size: "26m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    # A 25 MiB upload over a slow link must not be cut off mid-stream by a
    # timeout sized for small JSON intake calls.
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [etik.acik.com, speakup.acik.com]
      secretName: wildcard-acik-com-tls
  rules:
    - host: etik.acik.com
      http: &publicApi
        paths:
          - path: /api/v1/public/ethics
            pathType: Prefix
            backend:
              service: {name: ethics-service, port: {number: 8099}}
    - host: speakup.acik.com
      http: *publicApi
