apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etik-speak-public-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # ES-106 anonymous reporter boundary: public request metadata may be used
    # in-memory for rate limiting but must not become a durable access record.
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/enable-opentelemetry: "false"
    # ES-313 (2026-07-21, owner explicit "riskleri anladım hemen aç"):
    # sentetik-test Basic Auth gate KALDIRILDI. Kanal artık gerçek muhbir
    # trafiğine açık. Anti-abuse ingress rate-limit + boundary NetworkPolicy
    # + backend ES-306 hardening ile enforce edilir.
    nginx.ingress.kubernetes.io/proxy-set-headers: platform-test/etik-speak-public-upstream-headers
    # Public API authentication is access-secret based and cookie-free. Drop
    # every upstream Set-Cookie so a parent-domain suite cookie can never be
    # emitted through this boundary.
    nginx.ingress.kubernetes.io/proxy-hide-headers: "Set-Cookie"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    # ES-313 minimum defense — ES-306 residual backend rate-limit gelmeden
    # önce ingress-level anti-abuse:
    #   - limit-rps 3       → per-IP 3 req/sec ortalama (whistleblower akış)
    #   - limit-rpm 60      → per-IP 60 req/dk cap
    #   - limit-connections 10 → per-IP eşzamanlı 10 bağlantı
    #   - limit-burst-multiplier 2 → kısa burst 6 rps'e kadar tolere
    nginx.ingress.kubernetes.io/limit-rps: "3"
    nginx.ingress.kubernetes.io/limit-rpm: "60"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [etik.acik.com, speakup.acik.com]
      secretName: wildcard-acik-com-tls
  rules:
    - host: etik.acik.com
      http: &publicApi
        paths:
          - path: /api/v1/public/ethics
            pathType: Prefix
            backend:
              service: {name: ethics-service, port: {number: 8099}}
    - host: speakup.acik.com
      http: *publicApi
