apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: etik-speak-public-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # ES-106 anonymous reporter boundary: public request metadata may be used
    # in-memory for rate limiting but must not become a durable access record.
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/enable-opentelemetry: "false"
    # ES-313 (2026-07-21, owner explicit "riskleri anladım hemen aç"):
    # sentetik-test Basic Auth gate KALDIRILDI. Kanal artık gerçek muhbir
    # trafiğine açık. Anti-abuse ingress rate-limit + boundary NetworkPolicy
    # + backend ES-306 hardening ile enforce edilir. ES-106 header/cookie
    # minimization and per-client rate limit run at the host edge, before the
    # cluster boundary.
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [etik.acik.com, speakup.acik.com]
      secretName: wildcard-acik-com-tls
  rules:
    - host: etik.acik.com
      http: &publicApi
        paths:
          - path: /api/v1/public/ethics
            pathType: Prefix
            backend:
              service: {name: ethics-service, port: {number: 8099}}
    - host: speakup.acik.com
      http: *publicApi
