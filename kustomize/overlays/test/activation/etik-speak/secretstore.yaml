apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: etik-speak-vault
  labels:
    app.kubernetes.io/name: etik-speak-vault
    app.kubernetes.io/part-of: etik-speak
spec:
  provider:
    vault:
      server: http://vault.platform-test.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        appRole:
          path: approle
          # Non-secret role ID is patched after the reviewed test-only
          # provisioner creates the dedicated least-privilege AppRole.
          roleId: PENDING_FAZ35_VAULT_ROLE_ID
          secretRef:
            name: etik-speak-vault-approle
            key: secret-id
