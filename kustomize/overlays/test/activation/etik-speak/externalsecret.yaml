apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ethics-service-secrets
  labels:
    app.kubernetes.io/name: ethics-service
    app.kubernetes.io/part-of: etik-speak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: ethics-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: ETHICS_DB_USERNAME
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_DB_USERNAME}
    - secretKey: ETHICS_DB_PASSWORD
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_DB_PASSWORD}
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef: {key: kv/platform/etik-speak, property: ERP_OPENFGA_STORE_ID}
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef: {key: kv/platform/etik-speak, property: ERP_OPENFGA_MODEL_ID}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etik-speak-public-gate
  labels:
    app.kubernetes.io/name: etik-speak-public
    app.kubernetes.io/part-of: etik-speak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: etik-speak-public-gate
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef: {key: kv/platform/etik-speak, property: EDGE_BASIC_AUTH_HTPASSWD}
