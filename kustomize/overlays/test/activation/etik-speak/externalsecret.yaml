apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ethics-service-secrets
  labels:
    app.kubernetes.io/name: ethics-service
    app.kubernetes.io/part-of: etik-speak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: etik-speak-vault
  target:
    name: ethics-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: ETHICS_DB_USERNAME
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_DB_USERNAME}
    - secretKey: ETHICS_DB_PASSWORD
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_DB_PASSWORD}
    # ES-104G: the request-facing MinIO identity. It can write a quarantine
    # object and read a finished derivative; it cannot read quarantine back and
    # cannot touch a sealed original.
    - secretKey: ETHICS_EVIDENCE_S3_ACCESS_KEY
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_EVIDENCE_S3_ACCESS_KEY}
    - secretKey: ETHICS_EVIDENCE_S3_SECRET_KEY
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_EVIDENCE_S3_SECRET_KEY}
    - secretKey: ETHICS_EVIDENCE_MANIFEST_SIGNING_KEY
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_EVIDENCE_MANIFEST_SIGNING_KEY}
    # ES-203/D: keys the participant handle the manager's browser receives. The
    # service refuses to start without it — a handle minted from a default would
    # carry no scoping at all, and that failure belongs at boot rather than at the
    # first assignment. Rotating this retires outstanding handles rather than
    # silently changing what they mean.
    - secretKey: ETHICS_PARTICIPANT_HANDLE_KEY
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_PARTICIPANT_HANDLE_KEY}
---
# The worker's credential is a SEPARATE Kubernetes Secret, not another key in
# the service's own: the point of the split is that a compromise of the
# request-facing pod does not hand over the identity that can seal and publish.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ethics-evidence-worker-secrets
  labels:
    app.kubernetes.io/name: ethics-evidence-worker
    app.kubernetes.io/part-of: etik-speak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: etik-speak-vault
  target:
    name: ethics-evidence-worker-secrets
    creationPolicy: Owner
  data:
    # Deliberately mapped onto the same variable names the application reads:
    # the worker Deployment loads this Secret last, so its identity wins.
    - secretKey: ETHICS_EVIDENCE_S3_ACCESS_KEY
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_EVIDENCE_WORKER_S3_ACCESS_KEY}
    - secretKey: ETHICS_EVIDENCE_S3_SECRET_KEY
      remoteRef: {key: kv/platform/etik-speak, property: ETHICS_EVIDENCE_WORKER_S3_SECRET_KEY}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etik-speak-public-gate
  labels:
    app.kubernetes.io/name: etik-speak-public
    app.kubernetes.io/part-of: etik-speak
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: etik-speak-vault
  target:
    name: etik-speak-public-gate
    creationPolicy: Owner
  data:
    - secretKey: auth
      remoteRef: {key: kv/platform/etik-speak, property: EDGE_BASIC_AUTH_HTPASSWD}
