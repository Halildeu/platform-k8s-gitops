apiVersion: v1
kind: ServiceAccount
metadata:
  name: ethics-evidence-worker
  labels:
    app.kubernetes.io/name: ethics-evidence-worker
    app.kubernetes.io/component: evidence-processor
    app.kubernetes.io/part-of: etik-speak
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ethics-evidence-worker
  labels:
    app.kubernetes.io/name: ethics-evidence-worker
    app.kubernetes.io/component: evidence-processor
    app.kubernetes.io/part-of: etik-speak
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: ethics-evidence-worker}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ethics-evidence-worker
        app.kubernetes.io/component: evidence-processor
        app.kubernetes.io/part-of: etik-speak
    spec:
      serviceAccountName: ethics-evidence-worker
      automountServiceAccountToken: false
      priorityClassName: etik-speak-test
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: evidence-worker
          image: ghcr.io/OVERLAY_MUST_OVERRIDE/ethics-service:OVERLAY_MUST_OVERRIDE
          imagePullPolicy: IfNotPresent
          ports:
            - {name: management, containerPort: 8181, protocol: TCP}
          envFrom:
            - configMapRef: {name: ethics-service-config}
            - secretRef: {name: ethics-evidence-worker-secrets, optional: false}
          env:
            # Keep the Spring HTTP listener private and un-routed. Only the
            # management listener is exposed by the internal Service below.
            - {name: SERVER_PORT, value: "8199"}
            - {name: MANAGEMENT_SERVER_PORT, value: "8181"}
            - {name: ETHICS_AUDIT_DELIVERY_ENABLED, value: "false"}
            - {name: ETHICS_NOTIFICATION_DELIVERY_ENABLED, value: "false"}
            - {name: ETHICS_EVIDENCE_PIPELINE_ENABLED, value: "true"}
            - {name: ETHICS_EVIDENCE_PROCESSOR_MODE, value: clamav-reference}
            - {name: ETHICS_EVIDENCE_CLAMAV_HOST, value: ethics-evidence-scanner}
            - {name: ETHICS_EVIDENCE_CLAMAV_PORT, value: "3310"}
            - {name: ETHICS_EVIDENCE_PROCESSOR_TIMEOUT, value: 30s}
            - name: ETHICS_EVIDENCE_SCANNER_DIGEST
              value: sha256:83130a3b60654a4f226feffea549792cfcf28ea6b9de1dee210c8064cd114006
            - name: ETHICS_EVIDENCE_SANITIZER_DIGEST
              value: sha256:02f3f836175ed42cc0225a30e21272dfad1c8a5648c911fcee1f40e6b1c5463a
            - name: ETHICS_EVIDENCE_PARSER_DIGEST
              value: sha256:02f3f836175ed42cc0225a30e21272dfad1c8a5648c911fcee1f40e6b1c5463a
            - name: ETHICS_EVIDENCE_RULES_VERSION
              value: ClamAV 1.5.3/28058/Sun Jul 12 06:25:26 2026
            - {name: ETHICS_EVIDENCE_TRANSFORM_PROFILE, value: faz35-safe-metadata-v1}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 750m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 10
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: ethics-evidence-worker
  labels:
    app.kubernetes.io/name: ethics-evidence-worker
    app.kubernetes.io/component: evidence-processor
    app.kubernetes.io/part-of: etik-speak
spec:
  selector: {app.kubernetes.io/name: ethics-evidence-worker}
  ports:
    - {name: management, port: 8181, targetPort: management, protocol: TCP}
