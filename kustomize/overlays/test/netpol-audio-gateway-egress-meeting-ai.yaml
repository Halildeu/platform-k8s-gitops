# Faz 24 İ4 — audio-gateway cadenced /analyze/live publish to the GPU-host
# meeting-ai. Narrow test-only allow; no broad egress.
#
# Why this exists: the live-analyze trigger (platform-backend#902) posts the
# accumulated transcript window to meeting-ai while a recording is in progress.
# Only meeting-service had an egress allow to the GPU host, so enabling the
# gateway flag without this policy would fail closed at the network layer — the
# publish is best-effort and swallowed, so it would have looked like "the flag
# did nothing" with no error surfaced.
#
# Same target as the meeting-service policy (#2186): the host-bridge Endpoints
# for meeting-ai-service resolve to 10.99.0.2:8300 over WireGuard.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-audio-gateway-egress-meeting-ai
  labels:
    app.kubernetes.io/name: audio-gateway
    app.kubernetes.io/part-of: platform
    platform.acik.com/faz: "24"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audio-gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.99.0.2/32
      ports:
        - protocol: TCP
          port: 8300
