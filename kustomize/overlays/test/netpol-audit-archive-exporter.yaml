# audit-archive-exporter NetworkPolicy — Faz 24 PR-obs-02 (#1656, Codex 019ed602
# Must-Fix 3).
#
# The exporter pod carries app.kubernetes.io/part-of=audit-archive (NOT platform),
# so it does NOT match the namespace-wide allow-egress-dns / allow-egress-host-bridge
# / allow-egress-intra-ns / allow-monitoring-scrape (all select part-of=platform).
# These two policies — selecting the exporter by name — are therefore its SOLE
# allowlist: egress DNS + host-compose Postgres ONLY (no MinIO/Redis/Vault/KC/K8s
# API — it only reads audit_event + audit_archive), ingress monitoring→9187 only.
# Same TRUE-tight model as netpol-audit-retention-worker.yaml (the exporter does
# NOT need MinIO egress — that is the worker's; the exporter only reads PG).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-audit-archive-exporter
  annotations:
    platform.acik.com/adr: "0042"
    platform.acik.com/issue: "1656"
  labels:
    app.kubernetes.io/name: audit-archive-exporter
    app.kubernetes.io/part-of: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audit-archive-exporter
  policyTypes:
    - Egress
  egress:
    # DNS — resolve the selectorless `postgres` Service.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres host endpoint (audit_event source + audit_archive state, read-only).
    - to:
        - ipBlock:
            cidr: 172.19.0.6/32
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-audit-archive-exporter-scrape
  annotations:
    platform.acik.com/adr: "0042"
    platform.acik.com/issue: "1656"
  labels:
    app.kubernetes.io/name: audit-archive-exporter
    app.kubernetes.io/part-of: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audit-archive-exporter
  policyTypes:
    - Ingress
  ingress:
    # Prometheus scrape from the monitoring namespace → metrics port only.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
