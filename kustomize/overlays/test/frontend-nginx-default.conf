server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store" always; }
  location = /index.html { add_header Cache-Control "no-store" always; }
  location = /remoteEntry.js { try_files $uri =404; add_header Cache-Control "no-store" always; }
  location ~ ^/remotes/[^/]+/remoteEntry\.js$ { try_files $uri =404; add_header Cache-Control "no-store" always; }

  # PDF.js worker is an ES module. nginx:1.27-alpine has no built-in `.mjs`
  # mapping, so an explicit JavaScript MIME is required by modern browsers.
  location ~* \.mjs$ {
    try_files $uri =404;
    default_type application/javascript;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ { try_files $uri =404; access_log off; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location ~ ^/remotes/[^/]+/assets/ { try_files $uri =404; access_log off; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /remotes/ { try_files $uri =404; expires 1h; add_header Cache-Control "public, max-age=3600, immutable"; }
}
