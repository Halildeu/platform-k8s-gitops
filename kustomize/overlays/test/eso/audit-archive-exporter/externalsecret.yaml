# audit-archive-exporter ExternalSecret — test overlay (Faz 24 PR-obs-02, #1656).
#
# Dedicated READ-ONLY DB role audit_archive_exporter (Codex 019ed602 Must-Fix 7 —
# do NOT reuse the worker's OWNER role; that would hand the always-on scraper
# needless write/DDL surface). Least-priv grants (operator-seeded, NOT applied by
# this PR — shared platform-pg-test, same gate class as the worker D-slice):
#   GRANT USAGE ON SCHEMA audit_event, audit_archive TO audit_archive_exporter;
#   GRANT SELECT ON audit_event.audit_event TO audit_archive_exporter;
#   GRANT SELECT ON audit_archive.audit_archive_cursor, audit_archive.audit_archive_ledger
#         TO audit_archive_exporter;
#   ALTER DEFAULT PRIVILEGES FOR ROLE audit_retention_worker IN SCHEMA audit_archive
#         GRANT SELECT ON TABLES TO audit_archive_exporter;
# Vault seed: kv/platform/audit-archive-exporter (db_username + db_password).
# Until seeded (and until the worker's first Flyway creates audit_archive.*),
# pg_up=0 / scrape errors are EXPECTED — see RB-faz24-audit-archive-exporter.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audit-archive-exporter-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: audit-archive-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: audit-archive-exporter-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATA_SOURCE_USER
      remoteRef:
        key: kv/platform/audit-archive-exporter
        property: db_username
    - secretKey: DATA_SOURCE_PASS
      remoteRef:
        key: kv/platform/audit-archive-exporter
        property: db_password
