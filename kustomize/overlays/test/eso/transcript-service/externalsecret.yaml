# transcript-service ExternalSecret — test overlay (Faz 24 Meeting Intelligence #411)
#
# Pattern: meeting-service / endpoint-admin-service ExternalSecret replicated.
# Same ClusterSecretStore (vault-platform-gitops) + refreshInterval 1h +
# creationPolicy Owner.
#
# Vault path: kv/platform/transcript-service (test vault, host-compose) for DB
# credentials. OpenFGA store/model selectors sourced from shared
# kv/platform/openfga (same as meeting / endpoint-admin / permission-service —
# keeps transcript-service on the shared runtime-artifact model ledger).
#
# 6 secret key sync:
#   SPRING_DATASOURCE_USERNAME  ← kv/platform/transcript-service : db_username
#   SPRING_DATASOURCE_PASSWORD  ← kv/platform/transcript-service : db_password
#   ERP_OPENFGA_STORE_ID        ← kv/platform/openfga            : store_id
#   ERP_OPENFGA_MODEL_ID        ← kv/platform/openfga            : model_id
#   TRANSCRIPT_REDIS_PASSWORD   ← kv/platform/audio-gateway-service : redis_password
#   TRANSCRIPT_MEETING_SERVICE_CLIENT_SECRET ← kv/platform/auth-service : service_client_transcript_service_secret
#
# Redis currently uses one host-compose requirepass shared by stream clients.
# Bind the one live test credential into the transcript-owned target Secret;
# do not duplicate the raw value into another Vault path. The shared remote
# source is a test-only compatibility boundary, not target ownership or target
# architecture; gitops#2614 owns Vault DR repair and per-service Redis ACLs.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transcript-service-secrets
  namespace: platform-test
  annotations:
    # Wave 0 is local to platform-eso-test. Test rollout acceptance separately
    # requires this ExternalSecret to be Ready before transcript-service is
    # judged available; there is no cross-Application wave ordering guarantee.
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: transcript-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: transcript-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/transcript-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/transcript-service
        property: db_password
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef:
        key: kv/platform/openfga
        property: store_id
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef:
        key: kv/platform/openfga
        property: model_id
    - secretKey: TRANSCRIPT_REDIS_PASSWORD
      remoteRef:
        key: kv/platform/audio-gateway-service
        property: redis_password
    - secretKey: TRANSCRIPT_MEETING_SERVICE_CLIENT_SECRET
      remoteRef:
        key: kv/platform/auth-service
        property: service_client_transcript_service_secret
