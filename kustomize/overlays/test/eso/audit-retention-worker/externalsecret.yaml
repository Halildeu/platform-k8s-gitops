# audit-retention-worker ExternalSecret — test overlay (Faz 24 #1250, ADR-0042).
#
# MinIO `audit-archive` svcacct credential — least-privilege inline session
# policy (PutObject/GetObject/Get+PutObjectRetention/GetObjectLegalHold +
# ListBucket/GetBucket*; NO DeleteObject / NO BypassGovernanceRetention / NO
# admin). Vault path: kv/platform/audit-retention-worker
# (minio_access_key + minio_secret_key; non-secret endpoint/bucket/region the
# C-slice worker reads from its own ConfigMap). Naming: audio-gateway emsali
# kv/platform/* canonical.
#
# Consumer: standalone `audit-retention-worker` K8s CronJob (C-slice, ADR-0042
# §7 — fresh backend session). Bu ExternalSecret altyapı önden hazır; worker
# image deploy edilince Secret zaten senkron.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audit-retention-worker-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: audit-retention-worker
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: audit-retention-worker-secrets
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: kv/platform/audit-retention-worker
        property: minio_access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: kv/platform/audit-retention-worker
        property: minio_secret_key
    # Dedicated least-privilege DB role (#1250-D, Codex D2): SELECT on
    # audit_event.audit_event + OWNER of audit_archive. NOT the consumer's user.
    # Seeded into kv/platform/audit-retention-worker (db_username/db_password) by
    # the operator/agent role-bootstrap step (RB-faz24-minio-audit-archive §D2).
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/audit-retention-worker
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/audit-retention-worker
        property: db_password
