# meeting-service ExternalSecret — test overlay (Faz 24 Meeting Intelligence #410)
#
# Pattern: endpoint-admin-service ExternalSecret replicated. Same
# ClusterSecretStore (vault-platform-gitops) + refreshInterval 1h +
# creationPolicy Owner.
#
# Vault path: kv/platform/meeting-service (test vault, host-compose) for DB
# credentials. OpenFGA store/model selectors sourced from shared
# kv/platform/openfga (same as endpoint-admin / permission-service — keeps
# meeting-service on the shared runtime-artifact model ledger).
#
# 5 secret key sync:
#   SPRING_DATASOURCE_USERNAME  ← kv/platform/meeting-service : db_username
#   SPRING_DATASOURCE_PASSWORD  ← kv/platform/meeting-service : db_password
#   ERP_OPENFGA_STORE_ID        ← kv/platform/openfga         : store_id
#   ERP_OPENFGA_MODEL_ID        ← kv/platform/openfga         : model_id
#   MEETING_REDIS_PASSWORD      ← kv/platform/meeting-service : redis_password
#
# Redis still has one shared test-plane default-user credential, but each
# workload owns its Vault binding. Rotation can therefore reconcile one
# service without making meeting-service startup depend on another service's
# secret path. The values remain equal until per-service Redis ACL users land.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meeting-service-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: meeting-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: meeting-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/meeting-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/meeting-service
        property: db_password
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef:
        key: kv/platform/openfga
        property: store_id
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef:
        key: kv/platform/openfga
        property: model_id
    - secretKey: MEETING_REDIS_PASSWORD
      remoteRef:
        key: kv/platform/meeting-service
        property: redis_password
