# meeting-service analysis capability verifier key - TEST only (gitops#3144).
#
# Keep this trust root isolated from the service's DB/Redis/OpenFGA
# ExternalSecret. A missing or delayed capability property must block analysis
# verification without blocking unrelated credential refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: meeting-service-analysis-capability
  namespace: platform-test
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: meeting-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
    platform.acik.com/faz: "24"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: meeting-service-analysis-capability
    creationPolicy: Owner
  data:
    - secretKey: ANALYSIS_JOB_CAPABILITY_HMAC_SECRET
      remoteRef:
        key: kv/platform/meeting-analysis-capability
        property: hmac_secret_base64
