# ESO test overlay — k3d-test (staging-sw test Vault)
# Base'deki placeholder ClusterSecretStore FQDN'ini test Vault'a çevirir.
# Apply: kubectl --context k3d-test apply -k kustomize/overlays/test/eso
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/eso
  - externalsecret-ghcr-pull.yaml    # platform-test ns (W1 Opsiyon B)
  - endpoint-admin/externalsecret.yaml    # Faz 22.1.1b live-aligned (2026-05-05)
  - notify/externalsecret-notify.yaml    # Faz 23.1 PR5 (Codex 019dfaaa absorb 2026-05-06)
  - alertmanager/    # Faz 23.2.D T1.4 D43 outage fallback (Codex 019e0dea iter-2)
  - audio-gateway/externalsecret.yaml    # Faz 24 Aşama-2 staging (platform-ai#151)
  - redis-streams-exporter/externalsecret.yaml    # Faz 24 PR-obs-01a (gitops#1247; shared redis_password — ACL ayrımı #1457)

patches:
  - target:
      kind: ClusterSecretStore
      name: vault-platform-gitops
    path: clustersecretstore-patch.yaml
