# V2.1 Ops-A — Perf alert receiver ESO ExternalSecret (A2 isolation path)
#
# Bağlam: Codex `019e267a` spike AGREE_AFTER_REVISIONS — D43 fallback Vault
# path REUSE (A1) yerine ISOLATION (A2): perf alertları için ayrı Vault path,
# ayrı Teams kanal (perf-alerts target vs D43 outage fallback target).
#
# 2026-05-24 SLACK → TEAMS PIVOT (Codex thread `019e5ba9`):
#   Organizasyon Microsoft Teams kullanıyor. Receiver perf-alerts-slack →
#   perf-alerts-teams; `slack_configs` → `webhook_configs` (Power Automate).
#   Secret key + property `SLACK_WEBHOOK_URL` → `TEAMS_WEBHOOK_URL`.
#
# Vault path layout (owner-init, one-shot):
#   kv/platform/perf-alertmanager
#     - TEAMS_WEBHOOK_URL — perf-alerts Teams target Power Automate workflow URL
#
# Operator init (Halil tarafından, manuel; Vault root token operator'da):
#   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-test \
#     vault kv put kv/platform/perf-alertmanager \
#       TEAMS_WEBHOOK_URL=<Teams Power Automate workflow URL — perf-alerts channel target>
#
# Bu ESO manifest Vault write tamamlanmadan apply edilebilir; ESO retry-loop
# `SecretSynced=False` raporlar (fail-closed). Owner Vault write sonrası
# bir refresh-interval içinde `SecretSynced=True` döner.
#
# Refresh interval 1h (D43 fallback ile aynı pattern).
#
# Mount path (Alertmanager pod, kube-prometheus-stack alertmanagerSpec.secrets[]):
#   /etc/alertmanager/secrets/perf-alertmanager-secrets/TEAMS_WEBHOOK_URL
#
# Alertmanager config (helm values v2.1 receiver block, Codex tur-1 R1 absorb +
# 2026-05-24 Teams pivot):
#   receivers:
#     - name: perf-alerts-teams
#       webhook_configs:
#         - url_file: /etc/alertmanager/secrets/perf-alertmanager-secrets/TEAMS_WEBHOOK_URL
#           send_resolved: true
#           max_alerts: 50
#   Note: Alertmanager generic webhook (v4 JSON payload); Power Automate flow
#   parses + posts Adaptive Card to Teams channel.
#
# Cross-AI peer review: Codex thread 019e267a iter-1 → iter-2 AGREE_AFTER_REVISIONS.
# Implementer Claude / Reviewer Codex / Verdict AGREE.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: perf-alertmanager-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: perf-alerts
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: perf-alertmanager-secrets
    creationPolicy: Owner
  data:
    # 2026-05-24 Teams pivot (Codex thread `019e5ba9`): SLACK_WEBHOOK_URL →
    # TEAMS_WEBHOOK_URL.
    - secretKey: TEAMS_WEBHOOK_URL
      remoteRef:
        key: kv/platform/perf-alertmanager
        property: TEAMS_WEBHOOK_URL
