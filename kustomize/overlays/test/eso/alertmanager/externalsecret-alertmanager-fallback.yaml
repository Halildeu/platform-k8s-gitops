# Alertmanager fallback secret — Faz 23.2.D T1.4 D43 outage fallback bypass.
#
# Bağlam: notification-orchestrator down olduğunda kritik alert/audit'lerin
# kaybolmaması için Alertmanager'a direct SMTP credentials sağlar.
# Orchestrator path'i ile AYRI Vault path → bağımsız rotation + defense-in-depth.
#
# SMTP-only per user decision 2026-05-24 (Codex 019e5b9c REVISE absorb):
# "slack kullanmıyoruz. sonrasınd agelirse yapılacak". `SLACK_WEBHOOK_URL`
# key removed from active ExternalSecret data. Future reactivation atomic
# with §helm-values active config re-add + Vault seed + drill rerun in
# same PR. See docs/faz-23-evidence/2026-05-24-d43-slack-defer-smtp-only-acceptance.md.
#
# Vault path layout (operator init, one-shot):
#   kv/platform/alertmanager-fallback
#     - SMTP_HOST — fallback SMTP server (orchestrator ile aynı server tipik)
#     - SMTP_PORT — 587 default
#     - SMTP_USER — alertmanager-fallback@... (orchestrator'dan AYRI kullanıcı)
#     - SMTP_PASSWORD — fallback user'a ait şifre
#   (SLACK_WEBHOOK_URL key Vault'ta kalsa bile ExternalSecret tarafından
#    talep edilmiyor — SMTP-only per user decision 2026-05-24)
#
# Operator init (Codex 019e0dea iter-2 absorb; test cluster için):
#   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-test \
#     vault kv put kv/platform/alertmanager-fallback \
#       SMTP_HOST=mailpit.platform-test.svc.cluster.local \
#       SMTP_PORT=587 \
#       SMTP_USER=alertmanager-fallback@local \
#       SMTP_PASSWORD=<irrelevant for Mailpit; populate non-empty>
#
# Refresh interval 1h (Vault rotation pickup).
#
# Mount path (Alertmanager pod, kube-prometheus-stack alertmanagerSpec.secrets[]):
#   /etc/alertmanager/secrets/alertmanager-fallback-secrets/<key>
#
# Cross-AI peer review: Codex thread 019e0dea iter-2 AGREE-with-revisions.
# Iter-2 düzeltmeler absorb: alertmanagerSpec.secrets mount + file path
# Alertmanager config'te `api_url_file` / `auth_username_file` / `auth_password_file`
# ile (secret env injection değil).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-fallback-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring-fallback
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: alertmanager-fallback-secrets
    creationPolicy: Owner
  data:
    # SLACK_WEBHOOK_URL key removed per user decision 2026-05-24 Slack DEFER
    # (Codex 019e5b9c REVISE absorb). Future reactivation: re-add this data
    # block atomically with helm-values slack_configs receiver re-add +
    # Vault seed + drill rerun in same PR.
    # Historical:
    #   - secretKey: SLACK_WEBHOOK_URL
    #     remoteRef:
    #       key: kv/platform/alertmanager-fallback
    #       property: SLACK_WEBHOOK_URL
    - secretKey: SMTP_HOST
      remoteRef:
        key: kv/platform/alertmanager-fallback
        property: SMTP_HOST
    - secretKey: SMTP_PORT
      remoteRef:
        key: kv/platform/alertmanager-fallback
        property: SMTP_PORT
    - secretKey: SMTP_USER
      remoteRef:
        key: kv/platform/alertmanager-fallback
        property: SMTP_USER
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: kv/platform/alertmanager-fallback
        property: SMTP_PASSWORD
