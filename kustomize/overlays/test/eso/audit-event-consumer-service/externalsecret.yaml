# audit-event-consumer-service ExternalSecret — test overlay (Faz 24 #1249)
#
# Pattern: transcript-service / audio-gateway ExternalSecret replicated.
# Same ClusterSecretStore (vault-platform-gitops) + refreshInterval 1h +
# creationPolicy Owner.
#
# Vault path: kv/platform/audit-event-consumer-service (test vault, host-compose).
# OpenFGA selectors INTENTIONALLY ABSENT — this consumer has no @RequireModule
# gate (no HTTP API), so no ERP_OPENFGA_STORE_ID / ERP_OPENFGA_MODEL_ID.
#
# 3 secret key sync:
#   SPRING_DATASOURCE_USERNAME    ← kv/platform/audit-event-consumer-service : db_username
#   SPRING_DATASOURCE_PASSWORD    ← kv/platform/audit-event-consumer-service : db_password
#   AUDIT_CONSUMER_REDIS_PASSWORD ← kv/platform/audit-event-consumer-service : redis_password
#     (host-compose/redis-streams requirepass — same value the audio-gateway
#      producer uses; seed: docs/runbooks/redis-streams-staging-sw.md, D43
#      stdin-pipe pattern).

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audit-event-consumer-service-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: audit-event-consumer-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: audit-event-consumer-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/audit-event-consumer-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/audit-event-consumer-service
        property: db_password
    - secretKey: AUDIT_CONSUMER_REDIS_PASSWORD
      remoteRef:
        key: kv/platform/audit-event-consumer-service
        property: redis_password
