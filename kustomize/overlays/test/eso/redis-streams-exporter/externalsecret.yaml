# redis-streams-exporter ExternalSecret — test overlay (Faz 24, gitops#1457)
#
# ACL ayrımı (Codex 019ebb70): exporter artık AYRI read-only Redis user.
# Vault path: kv/platform/redis-streams-exporter (username=exporter +
# password) — audio-gateway'in default-user parolasından (kv/platform/
# audio-gateway-service.redis_password) BAĞIMSIZ rotation. Naming: mevcut
# audio-gateway emsali kv/platform/* (plan-doc'taki kv/platform-ai/redis/*
# eski; bu repo'da platform-* canonical — Codex naming notu absorb).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-streams-exporter-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: redis-streams-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: redis-streams-exporter-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_USER
      remoteRef:
        key: kv/platform/redis-streams-exporter
        property: username
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: kv/platform/redis-streams-exporter
        property: password
