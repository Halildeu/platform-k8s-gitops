# redis-streams-exporter ExternalSecret — test overlay (Faz 24 PR-obs-01a)
#
# Vault path: kv/platform/audio-gateway-service property redis_password —
# audio-gateway ile AYNI değer (Redis requirepass tek-parola; host-compose/
# redis-streams). Geçici paylaşımlı credential: exporter için read-only Redis
# ACL ayrımı follow-up issue gitops#1457 (Codex 019ebacc S2 absorb).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-streams-exporter-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: redis-streams-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: redis-streams-exporter-secrets
    creationPolicy: Owner
  data:
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: kv/platform/audio-gateway-service
        property: redis_password
