# notification-orchestrator test ExternalSecret — Faz 23.1 PR5 origin, Faz 23.9
# Step D rewrite (Codex thread 019e08df REVISE absorb).
#
# Vault path layout (flat, auth-service / user-service convention; matches
# overlays/prod/eso/notify):
#   kv/platform/notification-orchestrator
#     - db_username
#     - db_password
#     - webhook_signing_secret
#     - authz_internal_api_key
#     - redaction_pepper
#
# History: this file was originally split into kv/platform/notify/{db,redaction,
# webhook,authz,smtp,slack} with 7 remoteRef entries — over-engineered for SMTP/
# Slack channels not yet wired. The split paths were never populated in test
# Vault, so this ExternalSecret was in `SecretSyncedError` from 2026-05-07 to
# 2026-05-08. Rewrite to flat path matches the working convention used by 10
# other platform services + new prod manifest.
#
# Operator init (one-shot, perform before next test cluster bootstrap):
#   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-test \
#     vault kv put kv/platform/notification-orchestrator \
#       db_username=platform \
#       db_password=<from existing notification-orchestrator-secrets> \
#       webhook_signing_secret=<...> \
#       authz_internal_api_key=<...> \
#       redaction_pepper=<...>
#
# Future SMTP/Slack additions: extend this manifest with extra remoteRef entries.
#
# Refresh interval 1h.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-orchestrator-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: notification-orchestrator-secrets
    creationPolicy: Owner
    # ESO v1 defaults this to Retain in the live object. Keep the provider-key
    # deletion behavior explicit so ArgoCD does not report defaulting as
    # desired-state drift; creationPolicy: Owner still owns the target Secret.
    deletionPolicy: Retain
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: db_password
    - secretKey: NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: webhook_signing_secret
    # Faz 23.7 OpenFGA cutover follow-up (2026-05-23) — geçici ESO re-align:
    # OpenFGA model_id cutover (PR #995) sonrası push delivery hâlâ
    # BLOCKED_BY_AUTHZ döndü. Orchestrator log'larında root cause yakalandı:
    # `WARN AuthzClient: authz HTTP non-200 (fail-closed DENY): code=401`.
    # Permission-service'in @PreAuthorize("hasRole('INTERNAL')") +
    # InternalApiKeyAuthFilter, orchestrator'ın X-Internal-Api-Key'ini
    # reject ediyor çünkü iki Secret'taki değer ayrışmış (orchestrator
    # NOTIFY_AUTHZ_INTERNAL_API_KEY len=31 vs permission-service
    # PERMISSION_SERVICE_INTERNAL_API_KEY len=44; sha256 hash farklı).
    # Tüm pre-cutover BLOCKED_BY_AUTHZ outcome'ları aslında 401'di —
    # OpenFGA model gap diagnosis (PR #989/#990) latent/secondary blocker;
    # 401 fix sonrası model Check ALLOW dönecek (OpenFGA direct Check'te
    # `01KS8QE8` ile True kanıtlı). Cross-AI: Codex `019e5386` REVISE
    # AGREE C path (gitops/ESO re-align, kubectl Secret patch DEĞİL).
    # Bu remoteRef geçici olarak permission-service'in canonical key
    # path'ine pointer; ESO her iki Secret'i aynı Vault property'sinden
    # besleyince orchestrator + permission-service aynı key'le çalışır.
    # OPERATOR FOLLOW-UP (Vault token erişimiyle):
    #   1. `vault kv patch kv/platform/notification-orchestrator
    #      authz_internal_api_key=<permission-service-value>`
    #   2. Bu remoteRef'i canonical path'e geri al
    #      (key: kv/platform/notification-orchestrator,
    #       property: authz_internal_api_key)
    #   3. ESO force-sync + orchestrator rollout
    - secretKey: NOTIFY_AUTHZ_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/permission-service
        property: internal_api_key
    - secretKey: NOTIFY_REDACTION_PEPPER
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: redaction_pepper
    # Faz 23.3.1 SMS NetGSM (test overlay only, canonical path):
    # platform-backend PR #77 NetGSM SmsAdapter @Value placeholders.
    # Vault seed (Pre-Production Full Authority 2026-05-10 06:41:16Z):
    #   vault kv patch kv/platform/notification-orchestrator \
    #     sms_netgsm_username='' sms_netgsm_password='' sms_netgsm_msgheader='Notify'
    # Empty username triggers fail-closed in adapter ("netgsm credentials missing"),
    # so ESO sync OK + other 5 keys remain Ready=True. Real credentials populated
    # post-NetGSM contract activation (R1 D-N3, ETA 2026-05-30).
    # Codex thread 019e109b iter-3 REVISE absorb: PR #384 split-path deprecated;
    # this canonical flat path matches working 10-service convention.
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_netgsm_username
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_netgsm_password
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_MSGHEADER
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_netgsm_msgheader
    # Faz 23.3.1 SMS NetGSM DLR (Delivery Receipt) callback token (test overlay):
    # NetGSM DLR webhook ingress için HMAC verification token. Empty default
    # → DLR callback ingress disabled until contract activation. Real token
    # post-NetGSM contract activation R1 ETA 2026-05-30 populated via
    # `vault kv patch kv/platform/notification-orchestrator dlr_token=<value>`.
    # Codex thread 019e10a4 PR #482 iter-4 follow-up scope (DLR deferred).
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_DLR_TOKEN
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: dlr_token
    # Faz 23.3 SMS multi-provider — JetSMS primary credentials (test overlay).
    # platform-backend PR #249/#250/#252: SmsProvider abstraction + JetSmsProvider
    # send + JetSMS DLR polling. JetSmsProvider @Value placeholders
    # notify.adapters.sms.jetsms.{username,password,originator}. Empty default →
    # adapter fail-closed ("jetsms credentials missing"); ESO sync OK + diğer
    # key'ler Ready=True kalır. JetSMS DLR POLL-mode (backend HttpSmsReport poll
    # eder) — inbound webhook YOK → NetGSM'deki gibi dlr_token key'i YOK.
    # Vault seed (operator, pre-PR-5 cutover — Pre-Production Full Authority):
    #   vault kv patch kv/platform/notification-orchestrator \
    #     sms_jetsms_username='<JetSMS API user>' \
    #     sms_jetsms_password='<JetSMS API pass>' \
    #     sms_jetsms_originator='<onaylı gönderici başlığı>'
    # PR-5 cutover acceptance: ÜÇÜ de non-empty (JetSmsProvider password-blank
    # için erken gate yok — ESO Ready tek başına yetmez). Codex thread 019e4022.
    - secretKey: NOTIFY_ADAPTERS_SMS_JETSMS_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_jetsms_username
    - secretKey: NOTIFY_ADAPTERS_SMS_JETSMS_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_jetsms_password
    - secretKey: NOTIFY_ADAPTERS_SMS_JETSMS_ORIGINATOR
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: sms_jetsms_originator
    # T4.1 — Microsoft Teams webhook URL (Power Automate Incoming Webhook connector)
    # Empty default → Teams channel disabled until connector URL configured.
    # Vault seed: vault kv patch kv/platform/notification-orchestrator \
    #   teams_webhook_url=''
    - secretKey: NOTIFY_ADAPTERS_TEAMS_WEBHOOK_URL
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: teams_webhook_url
    # T4.1 — Slack Bot Token (Block Kit + threading; xoxb-* format)
    # Existing Slack adapter uses webhook URL; enhanced version uses Bot Token
    # for threading + Block Kit. Empty default → legacy webhook fallback.
    # Vault seed: vault kv patch kv/platform/notification-orchestrator \
    #   slack_bot_token=''
    - secretKey: NOTIFY_ADAPTERS_SLACK_BOT_TOKEN
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: slack_bot_token
    # T4.2 — Firebase Cloud Messaging (FCM) service account key (JSON)
    # Used by FCM adapter for Android push notifications.
    # Vault seed: vault kv patch kv/platform/notification-orchestrator \
    #   fcm_service_account_key=''
    - secretKey: NOTIFY_ADAPTERS_PUSH_FCM_SERVICE_ACCOUNT_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: fcm_service_account_key
    # T4.2 — APNS auth key (p8 format, Apple Push Notification Service)
    # Used by APNS adapter for iOS push notifications.
    # Vault seed: vault kv patch kv/platform/notification-orchestrator \
    #   apns_auth_key=''
    - secretKey: NOTIFY_ADAPTERS_PUSH_APNS_AUTH_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: apns_auth_key
    # Faz 23.7 M7 T4.2 PR-W4 — Web Push Protocol (RFC 8030 + RFC 8292 VAPID).
    # WebPushConfig @ConfigurationProperties("notify.adapters.webpush") binding;
    # Spring relaxed binding env var convention NOTIFY_ADAPTERS_WEBPUSH_*.
    # Browser-only scope (mobile FCM/APNS Faz 22.2 dep).
    #
    # **DEFER-AWARE COMMENTED OUT** (Codex Graph adapter pattern, ADR-0024):
    # ESO aggregate Ready=False if any remoteRef property missing → diğer
    # SMTP/SMS/DKIM live key sync bozulur. WEBPUSH 3 property Vault'a
    # seedlenmeden bu entry'ler aktif edilmez.
    #
    # Reactivation chain (operator pre-cutover):
    #   # 1) Generate VAPID key pair (BouncyCastle ECDSA P-256):
    #   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-test sh -c '
    #     # backend WebPushKeygenCli veya online tools (https://web-push-codelab.glitch.me/)
    #     # ile P-256 ECDSA pair generate edilir; sonra:
    #     vault kv patch kv/platform/notification-orchestrator \
    #       vapid_public_key="<base64url 65-byte uncompressed; 0x04 prefix>" \
    #       vapid_private_key="<base64url 32-byte scalar>" \
    #       vapid_subject="mailto:admin@testai.acik.com"
    #   '
    #   # 2) Bu üç remoteRef entry'sini comment-out'tan çıkar (uncomment)
    #   # 3) Argo sync → ESO Ready=True + Secret içinde 3 yeni key
    #   # 4) Test overlay ConfigMap patch: NOTIFY_ADAPTERS_WEBPUSH_ENABLED=true
    #   # 5) Image bump (PR-W3+W4 cumulative) + rollout restart
    #   # 6) Smoke: POST /api/v1/notify/push/subscribe + DELETE end-to-end
    #
    # --- WebPush VAPID 3 remoteRef entries — ACTIVATED 2026-05-22 ---
    # RB-webpush-activation §3.2/§3.3: Vault VAPID 3-key seed completed
    # (vapid_public_key 87ch + vapid_private_key 43ch + vapid_subject); the 3
    # remoteRef entries uncommented so ESO syncs them into the aggregate
    # Secret. ESO aggregate Ready stays True — all properties now present in
    # Vault (defer-aware gate satisfied).
    - secretKey: NOTIFY_ADAPTERS_WEBPUSH_PUBLIC_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: vapid_public_key
    - secretKey: NOTIFY_ADAPTERS_WEBPUSH_PRIVATE_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: vapid_private_key
    - secretKey: NOTIFY_ADAPTERS_WEBPUSH_VAPID_SUBJECT
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: vapid_subject
    # T1.1.8 — Unsubscribe email-link HMAC-SHA256 signing secret (Faz 23.2.A)
    # platform-backend PR #144 UnsubscribeTokenService HMAC-SHA256 token sign/verify.
    # Empty default → ProductionConfigValidator fail-closed in prod profile;
    # test profile uses `notify.unsubscribe.signing-secret` env binding.
    # Vault seed: vault kv patch kv/platform/notification-orchestrator \
    #   unsubscribe_signing_secret="$(openssl rand -hex 32)"
    # Codex thread 019e12d4 absorb: separate Vault key (not webhook_signing_secret
    # reuse) for cryptographic isolation — unsubscribe link tokens issued in email
    # body, public-facing GET endpoint, signature is auth boundary.
    - secretKey: NOTIFY_UNSUBSCRIBE_SIGNING_SECRET
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: unsubscribe_signing_secret
    # A6 SMTP gateway test credentials (Office 365 default + multi-provider —
    # backend SmtpAdapter @ConditionalOnProperty(notify.adapters.graph.enabled,
    # havingValue=false, matchIfMissing=true) sha-c4a03fc binary'sinde aktif).
    # Test cluster live aktivasyon Session 44 close 2026-05-11 (kullanıcı IT
    # outbound 587 firewall açıldı bildirimi sonrası; NetworkPolicy
    # allow-notification-orchestrator-egress-mail-providers paralel eklenmiş,
    # pod outbound smtp.office365.com:587 erişimi LIVE).
    - secretKey: SPRING_MAIL_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: smtp_username
    - secretKey: SPRING_MAIL_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: smtp_password
    # A8 Microsoft Graph API mail adapter (port 443 bypass outbound 587 ISP block).
    # Codex thread `019e42d1` Session 42 AGREE_B (extracted staged scope from #510;
    # original Session 44 / Claude implementation. Activation flag + digest bump
    # NOT in this PR — Codex risk audit: `GraphTokenService` constructor fails on
    # missing tenant_id/client_id/client_secret; pod boot would break.)
    #
    # Backend PR #153 MERGED 2026-05-11 (sha-585b64f binary). Microsoft Graph
    # REST via port 443 → Office 365 mail relay → external recipient (cluster
    # outbound 443 zaten açık; 587 ISP block bypass).
    #
    # **Entra state (Session 42 2026-05-20 — Codex `019e44b1` defer contract)**:
    # Azure AD App Registration + Mail.Send Application permission + tenant-wide
    # admin consent **COMPLETE** (`acik-mail-graph-api`,
    # `client_id=6e3e5b4b-b819-41b0-a237-8774c6418e32`,
    # `tenant_id=6f49871e-cb5b-4b2f-b986-5b68f16365b9`, granted by ai.enes@acik.com
    # global admin). **PENDING** (deferred per ADR-0024 D5 atomic reactivation
    # chain): client_secret create + ApplicationAccessPolicy (ai@acik.com mailbox
    # restrict) + Vault graph_* seed + ConfigMap NOTIFY_ADAPTERS_GRAPH_ENABLED=true
    # flag flip + digest bump. Aktif risk SIFIR (client_secret yok → permission
    # kullanılamaz). Bkz. ADR-0024 + RB-graph-mail-adapter-activation.md + #892
    # (P3 Backlog future-only tracker).
    #
    # **DEFER-AWARE REFACTOR 2026-05-20 (Codex `019e45f8` AGREE — test+prod parity)**:
    # Graph 3 remoteRef entries previously caused ESO aggregate `Ready=False
    # reason=SecretSyncedError` (3 `graph_*` properties not seeded; defer per
    # ADR-0024). ESO has a SINGLE aggregate Ready condition (not per-property);
    # one missing property fails the whole ExternalSecret, so JetSMS/SMTP/DKIM
    # live key sync is blocked from reaching the target Secret on force-sync.
    # Previous claim "Other notify ExternalSecret keys remain Ready=True
    # (per-property missing-key fallback)" was incorrect — the K8s Secret
    # retains previously-synced non-Graph keys from earlier successful syncs
    # (creationPolicy=Owner), but ESO reports aggregate failure and refuses
    # subsequent merge updates.
    #
    # Fix: the 3 Graph remoteRef entries are commented out as deferred-
    # activation snippet. ExternalSecret aggregate stays `Ready=True` for
    # active channels while Graph adapter remains disabled via
    # `NOTIFY_ADAPTERS_GRAPH_ENABLED` ConfigMap default + backend binary
    # `SmtpAdapter` active (`havingValue=false` mutual exclusion).
    #
    # **Reactivation chain (RB-graph-mail-adapter-activation.md §5 ESO yaml
    # re-enable + §6 activation PR)**:
    # 1. Entra Admin Center → `acik-mail-graph-api` → Certificates & secrets
    # 2. Exchange Online PowerShell: ApplicationAccessPolicy (ai@acik.com)
    # 3. Vault test seed (stdin pipe):
    #      printf %s '<secret>' | docker exec -i -e VAULT_TOKEN=$TEST_ROOT \
    #        platform-vault-test vault kv patch kv/platform/notification-orchestrator \
    #        graph_tenant_id='6f49871e-cb5b-4b2f-b986-5b68f16365b9' \
    #        graph_client_id='6e3e5b4b-b819-41b0-a237-8774c6418e32' \
    #        graph_client_secret=-
    # 4. **Re-enable Graph remoteRef entries below** (remove `#` prefix) + commit
    #    + Argo sync + verify ESO `Ready=True` + target Secret has 3 new keys
    # 5. ConfigMap `NOTIFY_ADAPTERS_GRAPH_ENABLED=true` + backend digest bump
    #    (Graph-binary-inclusive sha) + rollout restart
    # 6. Smoke: SubmitIntentRequest test mailbox → recipient
    #
    # See: docs/adr/0024-graph-mail-adapter-defer.md +
    #      docs/runbooks/RB-graph-mail-adapter-activation.md + issue #892
    #
    # --- Graph 3 remoteRef entries — TEST DESIRED-STATE active after merge (notify backend Graph cutover; live acceptance pending apply+smoke; Codex 019ebc0e; #892) ---
    - secretKey: NOTIFY_ADAPTERS_GRAPH_TENANT_ID
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: graph_tenant_id
    - secretKey: NOTIFY_ADAPTERS_GRAPH_CLIENT_ID
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: graph_client_id
    - secretKey: NOTIFY_ADAPTERS_GRAPH_CLIENT_SECRET
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: graph_client_secret
