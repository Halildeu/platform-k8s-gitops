# notification-orchestrator test ExternalSecret — Faz 23.1 PR5 origin, Faz 23.9
# Step D rewrite (Codex thread 019e08df REVISE absorb).
#
# Vault path layout (flat, auth-service / user-service convention; matches
# overlays/prod/eso/notify):
#   kv/platform/notification-orchestrator
#     - db_username
#     - db_password
#     - webhook_signing_secret
#     - authz_internal_api_key
#     - redaction_pepper
#
# History: this file was originally split into kv/platform/notify/{db,redaction,
# webhook,authz,smtp,slack} with 7 remoteRef entries — over-engineered for SMTP/
# Slack channels not yet wired. The split paths were never populated in test
# Vault, so this ExternalSecret was in `SecretSyncedError` from 2026-05-07 to
# 2026-05-08. Rewrite to flat path matches the working convention used by 10
# other platform services + new prod manifest.
#
# Operator init (one-shot, perform before next test cluster bootstrap):
#   docker exec -e VAULT_TOKEN="$ROOT_TOKEN" platform-vault-test \
#     vault kv put kv/platform/notification-orchestrator \
#       db_username=platform \
#       db_password=<from existing notification-orchestrator-secrets> \
#       webhook_signing_secret=<...> \
#       authz_internal_api_key=<...> \
#       redaction_pepper=<...>
#
# Future SMTP/Slack additions: extend this manifest with extra remoteRef entries.
#
# Refresh interval 1h.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-orchestrator-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: notification-orchestrator-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: db_password
    - secretKey: NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: webhook_signing_secret
    - secretKey: NOTIFY_AUTHZ_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: authz_internal_api_key
    - secretKey: NOTIFY_REDACTION_PEPPER
      remoteRef:
        key: kv/platform/notification-orchestrator
        property: redaction_pepper
