# notification-orchestrator ExternalSecret — Faz 23.1 PR5 (Codex 019dfaaa absorb).
#
# Tek ExternalSecret tüm notify secret keylerini bir Kubernetes Secret'a populate
# eder. Deployment.yaml `envFrom: secretRef: notification-orchestrator-secrets`
# ile inject ediliyor (PR5 absorb).
#
# Vault paths (operator populate eder D29-NOTIFY öncesi):
#   kv/platform/notify/smtp           — SMTP relay creds
#   kv/platform/notify/redaction      — HMAC pepper (PII redaction)
#   kv/platform/notify/webhook        — webhook signing secret
#   kv/platform/notify/slack          — slack incoming webhook URL
#   kv/platform/notify/authz          — internal-api-key for permission-service
#   kv/platform/notify/sms/netgsm     — NetGSM SMS provider creds (Faz 23.3.1)
#
# Refresh interval 1h.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-orchestrator-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: notification-orchestrator-secrets
    creationPolicy: Owner
  data:
    # PG datasource creds (notify schema dedicated user)
    # ConfigMap'tan zaten SPRING_DATASOURCE_URL geliyor; secret sadece creds.
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/notify/db
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/notify/db
        property: password


    # SMTP credentials (PR3 SmtpAdapter)
    - secretKey: NOTIFY_ADAPTERS_SMTP_HOST
      remoteRef:
        key: kv/platform/notify/smtp
        property: host
    - secretKey: NOTIFY_ADAPTERS_SMTP_USERNAME
      remoteRef:
        key: kv/platform/notify/smtp
        property: username
    - secretKey: NOTIFY_ADAPTERS_SMTP_PASSWORD
      remoteRef:
        key: kv/platform/notify/smtp
        property: password

    # PII redaction HMAC pepper (PR2)
    - secretKey: NOTIFY_REDACTION_PEPPER
      remoteRef:
        key: kv/platform/notify/redaction
        property: pepper

    # Webhook signing secret (PR3 WebhookEgressAdapter Stripe-style HMAC)
    - secretKey: NOTIFY_ADAPTERS_WEBHOOK_SIGNING_SECRET
      remoteRef:
        key: kv/platform/notify/webhook
        property: signing_secret

    # Slack default webhook URL (PR3 SlackWebhookAdapter)
    - secretKey: NOTIFY_ADAPTERS_SLACK_DEFAULT_WEBHOOK_URL
      remoteRef:
        key: kv/platform/notify/slack
        property: webhook_url

    # PR5 authz internal-api-key (permission-service S2S auth)
    - secretKey: NOTIFY_AUTHZ_INTERNAL_API_KEY
      remoteRef:
        key: kv/platform/notify/authz
        property: internal_api_key

    # NetGSM SMS provider creds (Faz 23.3.1).
    # username/password Basic Auth pair; msgheader = sender ID (default: Notify).
    # Operator SMS canlı kabul öncesi populate eder; boş kalırsa adapter
    # fail-closed davranır (DELIVERED yok, FAILED "netgsm credentials missing").
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_USERNAME
      remoteRef:
        key: kv/platform/notify/sms/netgsm
        property: username
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_PASSWORD
      remoteRef:
        key: kv/platform/notify/sms/netgsm
        property: password
    - secretKey: NOTIFY_ADAPTERS_SMS_NETGSM_MSGHEADER
      remoteRef:
        key: kv/platform/notify/sms/netgsm
        property: msgheader
