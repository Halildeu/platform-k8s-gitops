# audio-gateway-service ExternalSecret — test overlay (Faz 24 Aşama-2 staging)
#
# Current compatibility path: kv/platform/audio-gateway-service. The test Redis
# runtime still exposes one default-user requirepass and this is the only
# readable ESO source path. Do not copy the raw value into client-owned paths.
# Vault DR repair + per-service ACL migration is tracked in gitops#2614.
#
# Faz 24 direct-STT mTLS material is deliberately isolated in
# audio-gateway-direct-stt-mtls below. Do not add certificate/key properties to
# this aggregate Secret: one missing ESO property would move this object to
# SecretSyncedError and could disturb the existing Redis password sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audio-gateway-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: audio-gateway
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: audio-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATA_REDIS_PASSWORD
      remoteRef:
        key: kv/platform/audio-gateway-service
        property: redis_password
---
# direct-STT mTLS ExternalSecret — dedicated failure domain for #182/#198.
#
# It is safe to render before the Vault properties are seeded because the
# audio-gateway Deployment mounts this target Secret as optional while
# AUDIO_GATEWAY_DIRECT_STT_ENABLED=false. The runtime/preflight verifiers still
# require this ExternalSecret to be Ready=True and the Secret key names to exist
# before the flag can be flipped. Until seed, ESO may report SecretSyncedError
# on this dedicated object; that is expected fail-closed noise and does not
# poison audio-gateway-secrets/Redis sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audio-gateway-direct-stt-mtls
  namespace: platform-test
  labels:
    app.kubernetes.io/name: audio-gateway
    app.kubernetes.io/component: direct-stt-mtls
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: audio-gateway-direct-stt-mtls
    creationPolicy: Owner
  data:
    - secretKey: direct-stt-ca.crt
      remoteRef:
        key: kv/platform/audio-gateway-service
        property: direct_stt_ca_crt
    - secretKey: direct-stt-client.crt
      remoteRef:
        key: kv/platform/audio-gateway-service
        property: direct_stt_client_crt
    - secretKey: direct-stt-client.key
      remoteRef:
        key: kv/platform/audio-gateway-service
        property: direct_stt_client_key
---
# Speechmatics API key — isolated failure domain for Faz 24 #3240.
#
# The target Secret is optional in the Deployment while provider=internal. A
# missing Vault value therefore cannot poison Redis or the internal mTLS path.
# Selecting provider=speechmatics before this object is Ready=True still fails
# closed in AudioGatewayProperties; there is no silent provider fallback.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audio-gateway-speechmatics
  namespace: platform-test
  labels:
    app.kubernetes.io/name: audio-gateway
    app.kubernetes.io/component: speechmatics-stt
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: audio-gateway-speechmatics
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: kv/platform/audio-gateway-speechmatics
        property: api_key
