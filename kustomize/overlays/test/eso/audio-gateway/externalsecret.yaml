# audio-gateway-service ExternalSecret — test overlay (Faz 24 Aşama-2 staging)
#
# Vault path: kv/platform/audio-gateway-service (test vault, host-compose —
# ESO ClusterSecretStore vault-platform-gitops via approle; endpoint-admin
# emsali).
#
# Current active key: SPRING_DATA_REDIS_PASSWORD — host-compose/redis-streams
# requirepass ile AYNI değer (seed: docs/runbooks/redis-streams-staging-sw.md,
# D43 stdin-pipe pattern; shell history'ye düşmez).
#
# Faz 24 direct-STT mTLS follow-up keys are deliberately NOT added here until
# the Vault path is seeded. When seeded, use file-like target keys so envFrom
# skips PEM material while the Secret volume exposes files:
# - direct-stt-ca.crt
# - direct-stt-client.crt
# - direct-stt-client.key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audio-gateway-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: audio-gateway
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: audio-gateway-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATA_REDIS_PASSWORD
      remoteRef:
        key: kv/platform/audio-gateway-service
        property: redis_password
