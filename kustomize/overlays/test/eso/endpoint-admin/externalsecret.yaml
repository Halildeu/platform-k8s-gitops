# endpoint-admin-service ExternalSecret — test overlay (Faz 22.1.1b live-aligned)
#
# Live cluster ExternalSecret reverse-engineered into gitops:
#   kubectl --context k3d-test -n platform-test get externalsecret \
#     endpoint-admin-service-secrets -o yaml
#
# Vault path: kv/platform/endpoint-admin-service (test vault, host-compose
# 127.0.0.1:8301 via cluster Endpoints 172.19.0.4:8200 → ESO ClusterSecretStore
# vault-platform-gitops via approle).
#
# 8 secret key sync: SPRING_DATASOURCE_USERNAME + SPRING_DATASOURCE_PASSWORD +
# ENDPOINT_ADMIN_ENROLLMENT_TOKEN_PEPPER + ENDPOINT_ADMIN_SECRET_ENCRYPTION_KEY +
# ERP_OPENFGA_STORE_ID + ERP_OPENFGA_MODEL_ID +
# ENDPOINT_ADMIN_TPM_ATTEST_VAULT_ROLE_ID +
# ENDPOINT_ADMIN_TPM_ATTEST_VAULT_SECRET_ID.
#
# OpenFGA store/model selectors are sourced from shared kv/platform/openfga
# instead of endpoint-admin ConfigMap pins. This matches permission-service and
# keeps endpoint-admin on the runtime-artifact ledger-selected model.
# Refresh interval 1h (live default).

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: endpoint-admin-service-secrets
  namespace: platform-test
  labels:
    app.kubernetes.io/name: endpoint-admin-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: endpoint-admin-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: db_password
    - secretKey: ENDPOINT_ADMIN_ENROLLMENT_TOKEN_PEPPER
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: enrollment_token_pepper
    - secretKey: ENDPOINT_ADMIN_SECRET_ENCRYPTION_KEY
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: device_secret_encryption_key
    - secretKey: ERP_OPENFGA_STORE_ID
      remoteRef:
        key: kv/platform/openfga
        property: store_id
    - secretKey: ERP_OPENFGA_MODEL_ID
      remoteRef:
        key: kv/platform/openfga
        property: model_id
    - secretKey: ENDPOINT_ADMIN_TPM_ATTEST_VAULT_ROLE_ID
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: tpm_vault_role_id
    - secretKey: ENDPOINT_ADMIN_TPM_ATTEST_VAULT_SECRET_ID
      remoteRef:
        key: kv/platform/endpoint-admin-service
        property: tpm_vault_secret_id
