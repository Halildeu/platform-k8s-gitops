# Test Vault FQDN + roleId override — platform-test namespace (D6, D20 host bridge)
# Vault test instance staging-sw host compose, port 5433 host-side → 8200 intra.
# roleId: test Vault eso-runtime AppRole role_id UUID (low-sensitivity identifier;
# credential material ancak tek başına auth vermez — secret_id ile birlikte kullanılır).
# Rotate: Vault'ta `vault read auth/approle/role/eso-runtime/role-id` sonrası commit güncelle.
#
# 2026-05-09 19:55Z update (Session 41 — Faz 23.2.D T1.4 D43 drill prereq):
# Eski role-id (5f3f58d4-4a0a-5b76-aa83-fcb277a5573a) Vault test instance ile
# eşleşmiyordu → ClusterSecretStore "invalid role or secret ID" 4xx login fail
# 2 gündür sürüyordu. Vault'tan canonical role-id okundu:
#   docker exec platform-vault-test vault read auth/approle/role/eso-runtime/role-id
#   → role_id 6e2e8407-74d4-6e21-0ad7-ba200f601761
# Plus secret-id rotate (RB-eso-vault-approle-rotate.md #467 prosedürü).
# Plus eso-runtime policy re-apply: kv/data/platform/{notification-orchestrator,
# alertmanager-fallback,...} read kapsamı PR #457 ile eklenmişti, Vault'ta re-applied.
# Plus Vault path init: kv/platform/notification-orchestrator (Session 41 cluster
# apply sonrası — ESO drift süresinde K8s Secret cached değerler kullanıldı, şimdi
# Vault canonical kaynak).
- op: replace
  path: /spec/provider/vault/server
  value: "http://vault.platform-test.svc.cluster.local:8200"
- op: replace
  path: /spec/provider/vault/auth/appRole/roleId
  value: "6e2e8407-74d4-6e21-0ad7-ba200f601761"
