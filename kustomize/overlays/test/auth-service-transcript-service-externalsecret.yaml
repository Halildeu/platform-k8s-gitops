# auth-service <- transcript-service servis client secret'i (gitops#2568).
#
# NEDEN AYRI DOSYA: meeting-ai emsalindeki gerekce burada da gecerli — izole
# ExternalSecret, eksik/gec gelen bir anahtarin CEKIRDEK auth secret rotasyonunu
# durdurmasini engeller. Tek bir ExternalSecret'e ikinci bir zorunlu anahtar
# eklemek, o anahtar bos oldugunda tum secret'i Ready=False yapar ve auth
# zincirini bosuna kirar.
#
# AKTIVASYON ZINCIRI (gitops#2568): audio-gateway -> Redis stream -> transcript-
# service consumer -> meeting-service /sessions/resolve. Consumer 2026-07-25'te
# acikti ama resolver kapali oldugu icin 1650 mesajin TAMAMI metadata-only
# DLQ'ya dusuyordu (reason=RESOLVE). Bu secret, auth-service'in
# `transcript-service` servis client'ini dogrulayabilmesi icin gerekli son
# halka; auth-service tarafinda blank secret = client DISABLED (fail-closed).
#
# Vault'taki deger tek kaynak: kv/platform/auth-service. transcript-service
# tarafi ayni property'yi okur (kopyalanmaz) — cift yazim drift uretir.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-transcript-service-secret
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
    platform.acik.com/faz: "24"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: auth-service-transcript-service-secret
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_CLIENT_TRANSCRIPT_SERVICE_SECRET
      remoteRef:
        key: kv/platform/auth-service
        property: service_client_transcript_service_secret
