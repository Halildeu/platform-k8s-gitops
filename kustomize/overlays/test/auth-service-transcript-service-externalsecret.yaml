apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-transcript-service-secret
  annotations:
    # This ExternalSecret is intentionally owned by the platform-test workload
    # Application. Its wave therefore orders it before auth-service wave 10 in
    # the same Argo sync operation; no cross-Application wave claim is made.
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: auth-service-transcript-service-secret
    creationPolicy: Owner
  # Issuer-side client registration. The transcript-service workload reads the
  # same credential through transcript-service-secrets under its client-side
  # binding name; neither Secret is shared or mounted across workloads.
  data:
    - secretKey: SERVICE_CLIENT_TRANSCRIPT_SERVICE_SECRET
      remoteRef:
        key: kv/platform/auth-service
        property: service_client_transcript_service_secret
