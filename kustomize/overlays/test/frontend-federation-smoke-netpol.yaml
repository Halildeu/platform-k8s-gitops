# PERF-INIT-V2 PR-B5b3e Phase 2 — Kubernetes API egress for status writer.
#
# Codex thread `019e25a7` iter-1 P1 absorb: namespace default-deny
# egress (kustomize/base/netpol/default-deny.yaml) blocks every pod
# from reaching outside its namespace unless an explicit allow exists.
# The status writer needs to reach `kubernetes.default.svc:443` to
# upsert the status ConfigMap; without this allow it fails with
# connection refused.
#
# Egress is scoped to ONLY the kubernetes API service ClusterIP +
# port 443, NOT broader internet/egress.
#
# Test cluster `kubernetes.default.svc` ClusterIP: 10.45.0.1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-federation-smoke-kubernetes-api
  labels:
    app.kubernetes.io/name: frontend-federation-smoke
    app.kubernetes.io/component: smoke
    app.kubernetes.io/part-of: platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend-federation-smoke
      app.kubernetes.io/component: smoke
  policyTypes:
    - Egress
  egress:
    # Kubernetes API access — both Service ClusterIP (10.45.0.0/16 test
    # service network, default 443) AND the actual control-plane endpoint
    # CIDR (172.19.0.0/16 k3d docker bridge, default 6443).  Single /32
    # service-IP allow didn't work — k3d Flannel evaluates egress
    # NetworkPolicy AFTER kube-proxy DNAT in some packet flows, so the
    # ipBlock must cover the post-DNAT endpoint too.  Both cluster-internal,
    # TCP only on the two kube-apiserver ports.
    - to:
        - ipBlock:
            cidr: 10.45.0.1/32        # kubernetes.default.svc ClusterIP (pre-DNAT)
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 172.19.0.0/16       # k3d-test docker bridge (control-plane endpoint)
      ports:
        - protocol: TCP
          port: 6443
