    $BinaryPath = "C:\Program Files\EndpointAgent\endpoint-agent.exe"
    $ExpectedAgentSha256 = "0bf8aada0bf7b25f3e574e576a8401f9030168cbe60a487d6f6c5a6d4c610aec"
    $RemoteBridgeBrokerAddr = "remote-bridge-mtls.testai.acik.com:443"
    $RemoteBridgeTlsServerName = "remote-bridge-mtls.testai.acik.com"
    $RemoteBridgeMTLSSanUriPrefix = "adcomputer:"
    $RemoteBridgePermitKid = "rb-test-denetim-20260617-01"
    $RemoteBridgePermitBrokerPublicKeyB64 = @'
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEKrY41M+0Yt995yJrAAeARZ4tgnEvhO35KWR8BjJPM4JkwUBxCfMHCYhm9mQUz3PDbtCBUS9X9t3MtH9atSLb/Q==
    '@.Trim()
    $SelfUpdateAllowedHosts = "github.com,release-assets.githubusercontent.com,objects.githubusercontent.com,testai.acik.com"
    $SelfUpdateSignerThumbprints = "EB16FA8C2C2325295483ED2271D87632DA5EA631E3095039D6CFC358F16CAACD"
    $SelfUpdateHardMaxBytes = "52428800"
    $SelfUpdateMaxRedirects = "5"
    $SelfUpdateAutoActivate = "true"
    $SelfUpdateActivationTimeout = "2m"
    $SelfUpdateCommandTimeout = "30m"
    $SelfUpdateServiceName = "EndpointAgent"

    function Write-Step {
      param([string]$Message)
      Write-Host "[$PatchId] $Message"
    }

    function Assert-Administrator {
      $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
      $principal = New-Object Security.Principal.WindowsPrincipal($identity)
      if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
        throw "Administrator shell required."
      }
    }

    function Read-ServiceEnvMap {
      param([string]$Path)
      $raw = (Get-ItemProperty -Path $Path -Name Environment -ErrorAction SilentlyContinue).Environment
      $map = [ordered]@{}
      foreach ($entry in @($raw)) {
        $parts = $entry -split "=", 2
        if ($parts.Count -eq 2 -and -not [string]::IsNullOrWhiteSpace($parts[0])) {
          $map[$parts[0]] = $parts[1]
        }
      }
      return $map
    }

    function Write-ServiceEnvMap {
      param([string]$Path, $Map)
      $entries = @()
      foreach ($key in $Map.Keys) {
        $value = [string]$Map[$key]
        if (-not [string]::IsNullOrWhiteSpace($value)) {
          $entries += "$key=$value"
        }
      }
      Set-ItemProperty -Path $Path -Name Environment -Type MultiString -Value $entries
    }

    function Redact-ServiceEnvMap {
      param($Map)
      $rows = @()
      foreach ($key in ($Map.Keys | Sort-Object)) {
        $value = [string]$Map[$key]
        $sensitive = $key -match "TOKEN|SECRET|KEY|PASSWORD|CREDENTIAL|KID|ATTESTATION"
        $rows += [PSCustomObject]@{
          Key = $key
          Present = -not [string]::IsNullOrWhiteSpace($value)
          Length = $value.Length
          Value = if ($sensitive) { "<redacted>" } else { $value }
        }
      }
      return $rows
    }

    function Get-RemoteBridgeSignals {
      Get-Content "C:\ProgramData\EndpointAgent\logs\*.log" -Tail 1200 -ErrorAction SilentlyContinue |
        Select-String -Pattern "remote-bridge|bridge|mtls|mTLS|hello|HELLO|consent|CONSENT|active|ACTIVE|permit|operation|CONSTRAINED|error|failed|denied|certificate|remote-bridge-mtls.testai.acik.com" |
        ForEach-Object { $_.Line }
    }

    New-Item -ItemType Directory -Force -Path $EvidenceRoot | Out-Null
    $SummaryPath = Join-Path $EvidenceRoot "agentpc2-remote-bridge-canonical-env-patch-v7-summary.json"
    $SignalsPath = Join-Path $EvidenceRoot "agentpc2-remote-bridge-canonical-env-patch-v7-signals.txt"

    Assert-Administrator
    if (-not (Test-Path -Path $ServiceKey)) { throw "Service registry key not found: $ServiceKey" }
    if (-not (Test-Path -Path $BinaryPath)) { throw "EndpointAgent binary not found: $BinaryPath" }

