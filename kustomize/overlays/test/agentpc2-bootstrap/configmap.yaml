apiVersion: v1
kind: ConfigMap
metadata:
  name: agentpc2-first-install-bootstrap
data:
  README.md: |
    # AgentPC2 first-install bootstrap package

    This package was generated by scripts/faz22-remote-ops/agentpc2-first-install-bootstrap-gate.sh.

    Purpose:
    - Move AgentPC2 to EndpointAgent v0.2.28 when the currently installed agent does not advertise `UPDATE_AGENT`.
    - Preserve the product remote-ops acceptance boundary: this package is only a bootstrap step, not #208 acceptance.
    - Use outbound-only remote bridge configuration over remote-bridge-mtls.testai.acik.com:443.
    - Enable the signed, host-bounded EndpointAgent self-update policy required for
      the product `UPDATE_AGENT` capability.
    - Publish an endpoint-local v7 migration patch for already-installed v0.2.28
      endpoints that still carry earlier remote-bridge env aliases or lack the
      signed self-update local policy.

    Run on AgentPC2 from an elevated PowerShell session:

        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"
        $Base = "https://testai.acik.com/artifacts/endpoint-agent/bootstrap"
        $WorkDir = "C:\Temp\AgentPC2Bootstrap"
        $Script = Join-Path $WorkDir "agentpc2-first-install-bootstrap.ps1"
        $ExpectedScriptSha256 = "<see SHA256SUMS>"
        New-Item -ItemType Directory -Force $WorkDir | Out-Null
        Invoke-WebRequest -UseBasicParsing -Uri "$Base/agentpc2-first-install-bootstrap.ps1" -OutFile $Script
        $ActualScriptSha256 = (Get-FileHash $Script -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($ActualScriptSha256 -ne $ExpectedScriptSha256) { throw "Bootstrap script SHA256 mismatch: $ActualScriptSha256" }
        powershell.exe -NoProfile -ExecutionPolicy Bypass -File $Script

    If AgentPC2 already has EndpointAgent v0.2.28 installed but the product
    smoke still returns `session-not-active` or `UPDATE_AGENT` is not advertised,
    run the bounded canonical env patch instead:

        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"
        $Base = "https://testai.acik.com/artifacts/endpoint-agent/bootstrap"
        $WorkDir = "C:\Temp\AgentPC2Bootstrap"
        $Script = Join-Path $WorkDir "agentpc2-remote-bridge-canonical-env-patch-v7.ps1"
        $ExpectedScriptSha256 = "<see SHA256SUMS>"
        New-Item -ItemType Directory -Force $WorkDir | Out-Null
        Invoke-WebRequest -UseBasicParsing -Uri "$Base/agentpc2-remote-bridge-canonical-env-patch-v7.ps1" -OutFile $Script
        $ActualScriptSha256 = (Get-FileHash $Script -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($ActualScriptSha256 -ne $ExpectedScriptSha256) { throw "Patch script SHA256 mismatch: $ActualScriptSha256" }
        powershell.exe -NoProfile -ExecutionPolicy Bypass -File $Script

    Endpoint evidence will be written under:

        C:\ProgramData\EndpointAgent\rollout-evidence

    The scripts contain no HMAC enrollment token, bearer token, password, private
    key, or administrator credential. They contain the broker permit public key,
    which is intentionally public verifier material.

    The artifact bundle contains a top-level SHA256SUMS file with relative paths. Verify it from this directory before endpoint-local execution.

    After endpoint-local execution, rerun the #208 constrained-executor acceptance workflow. Do not close #208 from this bootstrap evidence alone.
  SHA256SUMS: |
    91570e68f60c7b789d44d748735d696f70dddb09534e84ce6124f09966396503  README.md
    ebd35f17b58eed8ffa4f5f73bfd5bd0a0df262fd96eced1d31c1b93fb5dbc5a6  agentpc2-self-update-policy-seed-v023.ps1
    0697369e93671e30de874b5f0589f8ed00355225284a70fa5f52ae1a0aac7aa1  agentpc2-self-update-policy-seed-v023-sha256.ps1
    c301386acbcee0297260495a1d4fc79f4e263130c39522a6137354d10f11bdbe  agentpc2-first-install-bootstrap.ps1
    9e3a7a89f5782ea54acb93e7c4bc1bbe411e0d5f29eacabca2a3911dbd8a5196  agentpc2-remote-bridge-canonical-env-patch-v7.ps1
    f695d8b3bf5b74ad200529bed823d1dc7228e1db9c0dac680eb1339355917c06  agentpc2-remote-bridge-attestation-patch-v0217-20260621T144928Z-14741b2e.ps1
    d9de569b166e0fe0a2b19b21acd60ea607499019c38260b3d446c1e6b5d211e6  agentpc2-tpm-autoenroll.ps1
    6082c2d092d2300325915addcda22bd50c44e15fd73ea38e3f6e66033df20e0c  agentpc2-tpm-autoenroll-runner.ps1
    fc3b145925603bf870cb39679ec725f5cebb4956b4167172acb1a454ee2a1243  agentpc2-tpm-autoenroll-README.md
    adcfb09000003493d900f79d3aae4c2fcf72d27772d23df72d6391a25bab61c6  agentpc2-tpm-autoenroll-packet-manifest.json
  agentpc2-self-update-policy-seed-v023.ps1: |
    <#
    .SYNOPSIS
    AgentPC2 bounded self-update local trust seed for v0.2.23.

    .DESCRIPTION
    Writes only ENDPOINT_AGENT_SELF_UPDATE_* service environment keys required for
    EndpointAgent v0.2.20 to accept the trusted internal-CA signed UPDATE_AGENT
    release. This is a one-time endpoint-local bootstrap step; it contains no
    secret, bearer token, password, private key, shell command payload, or HMAC
    enrollment token.
    #>

    [CmdletBinding()]
    param(
      [string]$EvidenceRoot = "C:\ProgramData\EndpointAgent\rollout-evidence",
      [int]$PostRestartWaitSeconds = 45
    )

    Set-StrictMode -Version Latest
    $ErrorActionPreference = "Stop"
    $ProgressPreference = "SilentlyContinue"

    $ReleaseId = "v0.2.23"
    $ExpectedSignerThumbprint = "D68F4F530137EB65CE44E3405E82B46205E753E5"
    $AllowedHosts = "github.com,release-assets.githubusercontent.com,objects.githubusercontent.com"
    $ServiceName = "EndpointAgent"
    $ServiceKey = "HKLM:\SYSTEM\CurrentControlSet\Services\$ServiceName"

    function Write-Step([string]$Message) {
      Write-Host "[agentpc2-self-update-seed] $Message"
    }

    function Assert-Administrator {
      $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
      $principal = New-Object Security.Principal.WindowsPrincipal($identity)
      if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
        throw "Administrator shell required."
      }
    }

    function Read-ServiceEnvMap([string]$Path) {
      $map = [ordered]@{}
      $raw = (Get-ItemProperty -Path $Path -Name Environment -ErrorAction SilentlyContinue).Environment
      if ($raw) {
        foreach ($entry in $raw) {
          $parts = $entry -split "=", 2
          if ($parts.Count -eq 2 -and -not [string]::IsNullOrWhiteSpace($parts[0])) {
            $map[$parts[0]] = $parts[1]
          }
        }
      }
      return $map
    }

    function Write-ServiceEnvMap([string]$Path, [System.Collections.Specialized.OrderedDictionary]$Map) {
      $entries = @()
      foreach ($kv in $Map.GetEnumerator()) {
        $entries += "$($kv.Key)=$($kv.Value)"
      }
      Set-ItemProperty -Path $Path -Name Environment -Type MultiString -Value $entries
    }

    function Redact-ServiceEnv([System.Collections.Specialized.OrderedDictionary]$Map) {
      $rows = @()
      foreach ($kv in $Map.GetEnumerator()) {
        $value = [string]$kv.Value
        $shown = if ($kv.Key -match "TOKEN|SECRET|KEY|PASSWORD|SIGNER") { "<redacted>" } else { $value }
        $rows += [PSCustomObject]@{
          Key = $kv.Key
          Present = -not [string]::IsNullOrWhiteSpace($value)
          Length = $value.Length
          Value = $shown
        }
      }
      return $rows
    }

    $startedAt = Get-Date
    New-Item -ItemType Directory -Force -Path $EvidenceRoot | Out-Null
    $TranscriptPath = Join-Path $EvidenceRoot "agentpc2-self-update-policy-seed-v023-transcript.log"
    $SummaryPath = Join-Path $EvidenceRoot "agentpc2-self-update-policy-seed-v023-summary.json"

    try {
      Start-Transcript -Path $TranscriptPath -Force | Out-Null
      Assert-Administrator

      if (-not (Test-Path $ServiceKey)) {
        throw "EndpointAgent service registry key not found: $ServiceKey"
      }

      Write-Step "read service environment"
      $map = Read-ServiceEnvMap -Path $ServiceKey

      Write-Step "write bounded self-update trust policy for $ReleaseId"
      $map["ENDPOINT_AGENT_SELF_UPDATE_ENABLED"] = "true"
      $map["ENDPOINT_AGENT_SELF_UPDATE_ALLOWED_HOSTS"] = $AllowedHosts
      $map["ENDPOINT_AGENT_SELF_UPDATE_SIGNER_THUMBPRINTS"] = $ExpectedSignerThumbprint
      $map["ENDPOINT_AGENT_SELF_UPDATE_HARD_MAX_BYTES"] = "52428800"
      $map["ENDPOINT_AGENT_SELF_UPDATE_MAX_REDIRECTS"] = "5"
      $map["ENDPOINT_AGENT_SELF_UPDATE_AUTO_ACTIVATE"] = "true"
      $map["ENDPOINT_AGENT_SELF_UPDATE_ACTIVATION_TIMEOUT"] = "2m"
      $map["ENDPOINT_AGENT_SELF_UPDATE_SERVICE_NAME"] = $ServiceName
      $map["ENDPOINT_AGENT_SELF_UPDATE_COMMAND_TIMEOUT"] = "30m"
      Write-ServiceEnvMap -Path $ServiceKey -Map $map

      Write-Step "restart EndpointAgent"
      Restart-Service $ServiceName -Force
      Start-Sleep -Seconds $PostRestartWaitSeconds

      $service = Get-CimInstance Win32_Service |
        Where-Object { $_.Name -eq $ServiceName } |
        Select-Object Name, DisplayName, State, StartMode, StartName, PathName

      $afterMap = Read-ServiceEnvMap -Path $ServiceKey
      $seeded = (
        $afterMap["ENDPOINT_AGENT_SELF_UPDATE_ENABLED"] -eq "true" -and
        $afterMap["ENDPOINT_AGENT_SELF_UPDATE_ALLOWED_HOSTS"] -eq $AllowedHosts -and
        $afterMap["ENDPOINT_AGENT_SELF_UPDATE_SIGNER_THUMBPRINTS"] -eq $ExpectedSignerThumbprint
      )

      if (-not $seeded) {
        throw "Self-update policy verification failed after registry write."
      }

      $logSignalsPath = Join-Path $EvidenceRoot "agentpc2-self-update-policy-seed-v023-log-signals.txt"
      Get-Content "C:\ProgramData\EndpointAgent\logs\*.log" -Tail 300 -ErrorAction SilentlyContinue |
        Select-String -Pattern "version|UPDATE_AGENT|self-update|remote-bridge|HELLO|hello|permit|operation|failed|error|denied|signer|allowlist" |
        ForEach-Object { $_.Line } |
        Set-Content -Path $logSignalsPath -Encoding UTF8

      $completedAt = Get-Date
      [PSCustomObject]@{
        schema = "faz22.1768.agentpc2-self-update-policy-seed.endpoint.v1"
        status = if ($service -and $service.State -eq "Running") { "seeded-service-running" } else { "seeded-service-not-running" }
        startedAt = $startedAt.ToString("o")
        completedAt = $completedAt.ToString("o")
        computerName = $env:COMPUTERNAME
        user = [Security.Principal.WindowsIdentity]::GetCurrent().Name
        release = @{ id = $ReleaseId; signerThumbprint = $ExpectedSignerThumbprint }
        selfUpdate = @{
          enabled = $true
          allowedHosts = $AllowedHosts
          signerThumbprintsConfigured = 1
          hardMaxBytes = "52428800"
          maxRedirects = "5"
          autoActivate = "true"
          activationTimeout = "2m"
          serviceName = $ServiceName
          commandTimeout = "30m"
        }
        service = $service
        redactedServiceEnvironment = @(Redact-ServiceEnv -Map $afterMap)
        evidence = @{ root = $EvidenceRoot; transcript = $TranscriptPath; logSignals = $logSignalsPath }
        boundary = @{
          proves = @(
            "Endpoint-local self-update signer allowlist was written for the trusted internal CA signer",
            "EndpointAgent service restarted after the policy change"
          )
          doesNotProve = @(
            "UPDATE_AGENT product dispatch succeeded",
            "Agent version changed through product self-update",
            "platform-agent#208 constrained operation acceptance",
            "broad GPO/MSI rollout",
            "unrestricted shell/RDP/WinRM/SMB/SSH support",
            "production/domain-wide support readiness",
            "TPM/device-key hardware attestation"
          )
        }
      } | ConvertTo-Json -Depth 8 | Set-Content -Path $SummaryPath -Encoding UTF8

      Write-Step "summary: $SummaryPath"
      Get-Content $SummaryPath
      Write-Host "`nAGENTPC2_SELF_UPDATE_POLICY_SEEDED"
    } catch {
      $completedAt = Get-Date
      [PSCustomObject]@{
        schema = "faz22.1768.agentpc2-self-update-policy-seed.endpoint.v1"
        status = "failed"
        startedAt = $startedAt.ToString("o")
        completedAt = $completedAt.ToString("o")
        computerName = $env:COMPUTERNAME
        user = [Security.Principal.WindowsIdentity]::GetCurrent().Name
        error = $_.Exception.Message
        evidence = @{ root = $EvidenceRoot; transcript = $TranscriptPath }
      } | ConvertTo-Json -Depth 6 | Set-Content -Path $SummaryPath -Encoding UTF8
      Write-Error $_.Exception.Message
      exit 1
    } finally {
      try { Stop-Transcript | Out-Null } catch {}
    }
