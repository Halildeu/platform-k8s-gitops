# gitops#3507 — meeting-service servis client secret (Görevler assignee
# resolution). Ayni izolasyon gerekcesi: eksik Vault key core auth
# secret rotasyonunu STALL EDEMEZ (ayrik ExternalSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-meeting-service-secret
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: auth-service-meeting-service-secret
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_CLIENT_MEETING_SERVICE_SECRET
      remoteRef:
        key: kv/platform/auth-service
        property: service_client_meeting_service_secret
