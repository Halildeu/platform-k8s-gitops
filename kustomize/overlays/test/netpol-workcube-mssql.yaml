# Faz 19.MSSQL.F overlay pin — test NetPol egress to bridge proxy IP/32
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-workcube-mssql
  annotations:
    platform.acik.com/adr: "0005"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - report-service
          - schema-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.19.0.8/32      # workcube-mssql-proxy-test bridge container IP
      ports:
        - protocol: TCP
          port: 11433
