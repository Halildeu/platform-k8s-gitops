# Faz 23.2.D T1.4 D43 outage fallback — NotifyServiceAbsent test-only PrometheusRule.
#
# Codex thread 019e0dea iter-3 P1 #1 absorb: bu rule base'de değil test overlay'e
# yerleşir. Prod overlay'e render edilirse prod cluster'da test namespace serisini
# görmediği için false-positive critical/page alarmı üretir. Test-only kapsam
# fail-positive engeli.
#
# Drill scale=0 durumunda Prometheus target tamamen kaybolur; `up{} == 0` yerine
# `absent(up{})` series üretilir. Drill için target disappearance coverage.
#
# Apply: kubectl apply -k kustomize/overlays/test/
# (overlay kustomization.yaml resources[]'a dahil edildi)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: notification-orchestrator-d43-drill-test-only
  namespace: platform-test
  labels:
    app.kubernetes.io/name: notification-orchestrator
    app.kubernetes.io/component: prometheus-rule-d43-drill-test-only
    app.kubernetes.io/part-of: platform
spec:
  groups:
    - name: notification-orchestrator-d43-drill-test-only
      interval: 30s
      rules:
        - alert: NotifyServiceAbsent
          # Drill scale=0 target disappearance coverage (Codex iter-1 P1 #2 absorb).
          # Test-only kapsam: namespace=platform-test selector + manifest test overlay'de.
          expr: absent(up{job="notification-orchestrator",namespace="platform-test"}) == 1
          for: 2m
          labels:
            severity: critical
            service: notification-orchestrator
            page: "true"
            bypass_orchestrator: "true"
            outage_fallback: "true"
            target_absent: "true"
          annotations:
            summary: "Notify service target absent (test cluster drill)"
            description: |
              notification-orchestrator scrape target tamamen kaybolmuş
              (absent series; 2 dakikadır). Test cluster D43 drill için
              `scale=0` failure mode kanıtı. Alertmanager direct-fallback
              receiver bu alarmı NotifyServiceDown ile birlikte yakalar.
