      - op: add
        path: /data/LOGGING_LEVEL_ROOT
        value: "INFO"
      - op: add
        path: /data/LOGGING_LEVEL_COM_SERBAN_NOTIFY
        value: "DEBUG"
      # Faz 23.4 PR-E.4 follow-up (Codex 019e015f iter-4 absorb):
      # notification-orchestrator JWT issuer test cluster'da
      # https://testai.acik.com/realms/platform-test olmalı; backend default
      # http://localhost:8081/realms/serban (application.yml SECURITY_JWT_ISSUER_URI:default)
      # test cluster'da invalid → /api/v1/notify/** authenticated endpoint'ler
      # JWT verify fail eder. Bu drift permission-service + report-service'da
      # zaten set'li (SECURITY_JWT_ISSUER + SECURITY_JWT_JWK_SET_URI), ama
      # notification-orchestrator-config'a hiç eklenmemiş. PR-E.4 cross-pod
      # SSE smoke için bu override gerekli; pre-existing gap kapatılır.
      #
      # 2026-05-08 fix v2: SECURITY_JWT_ISSUER restored alongside
      # SECURITY_JWT_JWK_SET_URI. Backend now ships a custom
      # `JwtDecoder` bean (notification-orchestrator PR #123, mirroring
      # permission-service's existing pattern) that combines:
      #   - NimbusJwtDecoder.withJwkSetUri(jwkSetUri)  ← internal Keycloak
      #     JWK URL only; resolves on cluster DNS in milliseconds, never
      #     triggers `.well-known/openid-configuration` auto-discovery
      #     (which is what timed out before — see live evidence below).
      #   - JwtValidators.createDefaultWithIssuer(issuer)  ← string compare
      #     against the public Keycloak frontend URL, no network call.
      # The pair gives us the same security posture permission-service
      # has run with for months: signature validation + issuer claim
      # assertion + audience allow-list, all without hitting the
      # public-domain hairpin.
      #
      # Earlier (v1) attempt removed SECURITY_JWT_ISSUER_URI to escape
      # the auto-discovery timeout but left issuer claim assertion off
      # entirely, which is unacceptable in pre-prod. Codex thread
      # `019e0649` flagged the gap; this v2 closes it.
      #
      # Live evidence (2026-05-08 testai before v2):
      #   notify-orch /actuator/prometheus
      #   http_server_requests_seconds_count{
      #     error="JwtDecoderInitializationException",
      #     status="500", uri="/api/v1/notify/inbox/me"} 17
      #   curl from notify-orch pod to public testai.acik.com → 5s timeout
      #   curl from permission-service pod → same timeout (cluster-wide)
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      # PR-5.4 strict cutover — close NotifyOrgAccessGuard's transitional
      # default-org fallback (Codex thread `019e0675` iter-7
      # `ready_for_impl=true`).
      #
      # F3 cutover gate close evidence (pre-prod 4h observation window):
      #   T0   2026-05-08T09:27:26Z  default=5.0 org_id=4.0
      #   T+34 2026-05-08T10:01:30Z  default=5.0 org_id=7.0  (Δ default 0)
      #   T+1h 2026-05-08T10:33:16Z  default=5.0 org_id=10.0 (Δ default 0)
      #   T+1h38 2026-05-08T11:05:12Z default=5.0 org_id=13.0 (Δ default 0)
      #   T+2h26 2026-05-08T11:53:22Z default=5.0 org_id=25.0 (Δ default 0)
      #   T+3h58 2026-05-08T13:25:48Z default=5.0 org_id=57.0 (Δ default 0)
      # `notify_org_access_match_total{source="default"}` increment stays
      # at zero across the full 4h window; `source="none"` never appears.
      # Real user traffic resolves identity through the JWT's `org_id`
      # claim path, the legacy single-tenant default fallback is dead
      # weight.
      #
      # Setting the env to the empty string flips
      # `NotifyOrgAccessGuard` into strict mode: requests whose JWT
      # carries no `org_id` / `tenant_id` / `allowed_orgs` claim fall
      # through to 401/403 instead of silently being routed to the
      # `"default"` org. This is the safety boundary the
      # `source="default"` counter has been guarding all along; closing
      # the fallback now also unblocks PR-5.5 subscriber identity strict
      # cutover.
      #
      # Rollback: drop this `add` op and re-apply; backend reverts to
      # the application.yml default `"default"`. Browser verify HARD
      # RULE will catch a regression: SSE 200 must hold and
      # `notify_org_access_match_total{source="none"}` must stay at zero.
      - op: add
        path: /data/NOTIFY_SECURITY_DEFAULT_ORG_ID
        value: ""
      # PR-5.5 strict subscriber identity cutover (platform-backend PR
      # #126; Codex thread `019e07d6` iter-1 PARTIAL absorb).
      #
      # When set to "true", `SubscriberIdentityGuard` fail-closes the
      # silent-pass branches (no Authentication in SecurityContextHolder;
      # principal that is not a `Jwt`). The previous code paths that let
      # anonymous / non-JWT calls through were intentional for slice tests
      # (`@WebMvcTest(addFilters=false)`) but unacceptable on a live route
      # where every `/api/v1/notify/**` request must carry a real JWT
      # principal.
      #
      # Strict-mode denials surface on the new
      # `notify_subscriber_identity_denied_total{reason="no_auth"|"non_jwt"}`
      # counter, kept separate from the existing match counter so the
      # claim-tag cardinality stays bounded. The browser-verified happy
      # path (PR-5.4 default-org strict flip) confirmed the live filter
      # chain injects `JwtAuthenticationToken` on every protected route,
      # so flipping this strict flag does not regress legitimate traffic.
      #
      # Rollback: drop this `add` op and re-apply; backend reverts to
      # `application.yml` default `false`. Browser verify HARD RULE will
      # catch any regression: SSE stream stable 200 and the `denied`
      # counter must stay at zero in normal traffic.
      - op: add
        path: /data/NOTIFY_SECURITY_SUBSCRIBER_IDENTITY_STRICT
        value: "true"
      # Faz 23.2 PR-D.2 — OTLP runtime activation (Codex 019dfe0f Q4 absorb).
      # PR-C tracing readiness (sampling=0.0, endpoint empty) → PR-D.2 test
      # cluster activation: 10% sampling, Tempo direct OTLP HTTP receiver.
      # Prod activation PR-D.3 atomic plan (defer).
      - op: add
        path: /data/MANAGEMENT_OTLP_TRACING_ENDPOINT
        value: "http://tempo.monitoring.svc.cluster.local:4318/v1/traces"
      - op: add
        path: /data/MANAGEMENT_TRACING_SAMPLING_PROBABILITY
        value: "0.1"

  # Faz 23.2 PR-D.2 — pod-template annotation rollout trigger (Codex Q4 absorb).
  # ConfigMap envFrom değişmesi pod restart tetiklemez; annotation bump rolling
