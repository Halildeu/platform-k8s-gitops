# Test overlay — k3d-test (staging-sw test cluster)
# - Image: GHCR sha-<short>
# - Host bridge: platform-test-net Docker network (172.19.0.x); fiili
#   Endpoints patch değerleri satır 240+ (postgres 172.19.0.4, keycloak
#   172.19.0.5, vault 172.19.0.6). 10.9.10.53 prod overlay'de kullanılır.
# - UYARI: Endpoints IP'leri deterministic değil (docker network connect sırası
#   IP atar). Compose recreate sonrası bootstrap/reconnect-compose-to-test-net.sh
#   hem docker bağlantısını hem kubectl Endpoints patch'ini çalıştırır. Git truth
#   bu ay kullanılan IP setini yansıtır; kalıcı çözüm için compose'da
#   ipv4_address sabitlemek ayrı roadmap item'ı (platform-ssot repo değişikliği).
# - Replica: 0 default (D17 scale-to-zero); test-toggle.sh up → 1
# - Namespace: platform-test
# - JVM daha dar heap (D24)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-test

resources:
  - namespace.yaml    # Namespace + labels (platform=true env=test, ApplicationSet prereq)
  - ../../base
  - ../../base/apps/ops-bundle    # Faz 17.2.5: ExternalSecret + ServiceMonitor CRD paketi (runtime'dan ayrı)
  # Faz 19.MSSQL.F: bridge proxy container IP per-cluster
  - endpoints-workcube-mssql.yaml    # 172.19.0.8 (workcube-mssql-proxy-test, alpine/socat)
  - netpol-workcube-mssql.yaml       # egress 172.19.0.8/32:11433

images:
  # Gerçek GHCR path: halildeu/platform-ssot-<service> (tire ile, slash değil)
  # 2026-04-20: Tüm 8 servis sha-60611fa immutable tag (D30 full uyum).
  # Dev repo PR #510/#511/#512 merge sonrası CI GHCR sha-60611fa push.
  # Yeni commit'ler → yeni sha-<short> → overlay güncellenir (manuel veya W3 CI).
  # moving tag main-stable D30 ihlal (cache hit, yeni image çekilmez).
  # Faz 19.9 CUTOVER v2 (Codex AGREE 019dc0ef Option B, ADR-0004):
  # Source: platform-backend + platform-web (Faz 19.1 filter-repo + 19.8 ci-image-push).
  # Pin: @sha256:digest (D30 immutable, moving tag YASAK).
  # GHCR packages PRIVATE; erişim: ghcr-pull Secret (ESO kv/gitops/ghcr-token → Halildeu PAT).
  # Live test smoke 2026-04-25 00:04 TR saati: D29 3-layer PASS (Up+Functional+Zanzibar-ready).

  - name: auth-service
    newName: ghcr.io/halildeu/platform-backend-auth-service
    digest: sha256:c84bc6b04f7f17cc145024d6eeff2c624c52704a259ce843aeea63444da9ed37
  - name: api-gateway
    newName: ghcr.io/halildeu/platform-backend-api-gateway
    digest: sha256:5e7f0d48bfe080e59034ece9399390e6543c97d13c8e799c4a1bb9d1e9cd0d09
  - name: user-service
    newName: ghcr.io/halildeu/platform-backend-user-service
    digest: sha256:df8b84d0cd02d064cf455f40017bd5cb4ca1be271e5e7068afeb36fc4526a7f1
  - name: variant-service
    newName: ghcr.io/halildeu/platform-backend-variant-service
    digest: sha256:4a51a49f1b07cf6e211bff5bd01cc68946a85b522c5d7cc171718ac85d892d13
  - name: core-data-service
    newName: ghcr.io/halildeu/platform-backend-core-data-service
    digest: sha256:b803507ac6b17240a8cced6878606f2aad7b31856140d6b5071352135babf37f
  - name: report-service
    newName: ghcr.io/halildeu/platform-backend-report-service
    digest: sha256:1d38fe3f3439067eeaae1d2015d470a3273074c6509589b54e7422fd749cc8b1
  - name: schema-service
    newName: ghcr.io/halildeu/platform-backend-schema-service
    digest: sha256:1a0e3f02664b5f431496a3443bd6603dfea3dd01a9bb7694e45e6e24d46f9a02
  - name: permission-service
    newName: ghcr.io/halildeu/platform-backend-permission-service
    # 2026-04-29 update: sha-149f62e — Codex 019dd818 PARTIAL absorb cycle 2:
    # PR #25 chore(authz-me): diag log INFO → DEBUG + email field kaldırıldı
    #   (PII guard + polling-noise minimum). LOGGING_LEVEL_COM_EXAMPLE_PERMISSION
    #   env override ile incident-aktif edilebilir.
    # Önceki sha-93a2ad6 (PR #23 diag log + PR #24 null FK NPE fix) üzerine.
    digest: sha256:17a5db02d9530a856363851cd97a00545d4da0813aa774a9a4580c1b129c6500
  # Frontend testai variant (testai.acik.com + platform-test realm)
  # 2026-04-29 update: sha-ef8fbc5 — Codex 019dd818 iter-10 final cycle:
  # PR #75 (cleanup): @mfe/auth ESLint warnings 13→0 (any → unknown helpers)
  # PR #76 (sha-e63df6d9): session_expired semantic + recovery via initialData
  # PR #77: shared-http 401 event dispatch + PermissionProvider listener
  # PR #78 (cleanup): shell+drawers ESLint warnings 31→0
  # PR #79: shell toast/CTA UX + drawer reason ayrımı + i18n keys (5 locale)
  # PR #80: edge case fix (token refresh ref reset) + 10/10 PASS test
  #   (safe redirect contract + episode-based dedupe semantic)
  # Önceki sha-a7d90cf (PR #76+#77) üzerine. Codex iter-1..10 cycle kapandı.
  # Açık 8 madde P2/P3 roadmap postmortem'de tracked.
  - name: frontend
    newName: ghcr.io/halildeu/platform-web-frontend-testai
    digest: sha256:bb2e4de8dae933ed6b09464de7be505b7f21780d61725f9df590193bf23a6712

patches:
  # Replica 0 default (scale-to-zero)
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "-Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "-Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"

  # 2026-04-19 S2-A1 follow-up: Shortname refactor sonrası gereksiz SPRING_DATASOURCE_URL
  # + KEYCLOAK_URL replace patch'leri KALDIRILDI (base zaten shortname).
  # Overlay test-specific add patches (DDL_AUTO + FLYWAY_ENABLED + LOGGING DEBUG) kalır.

  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "DEBUG"
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account,frontend,auth-service"

  # Dilim 2: 5 backend ConfigMap patches (DDL-auto + FLYWAY test override)
  # Faz 19.MSSQL.N (2026-04-25): SECURITY_JWT_* + KEYCLOAK_* (platform-test realm)
  # Test cluster e2e simülasyon ile bulundu: SecurityConfig firstNonBlank #3
  # (application.yml security.jwt.jwk-set-uri default-serban) override için #2
  # SECURITY_JWT_* env direkt set gerekli. Configmap'tan envFrom inject edilir.
  - target:
      kind: ConfigMap
      name: user-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account,frontend,user-service"
  - target:
      kind: ConfigMap
      name: variant-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account"   # variant-service AudienceValidator tek-string equals (CSV değil)
      - op: add
        path: /data/AUTHZ_USER_TABLE
        value: "users"
  - target:
      kind: ConfigMap
      name: core-data-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account,frontend,core-data-service"
  - target:
      kind: ConfigMap
      name: report-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account,frontend,report-service"
      # Faz 19.MSSQL.A activation (test cluster)
      - op: add
        path: /data/REPORT_PG_URL
        value: "jdbc:postgresql://postgres:5432/reports_db"
      - op: add
        path: /data/REPORT_MSSQL_ENABLED
        value: "true"
  - target:
      kind: ConfigMap
      name: schema-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account,frontend,schema-service"

  - target:
      kind: ConfigMap
      name: permission-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: replace
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account,frontend,permission-service"
      - op: replace
        path: /data/PERMISSION_AUTHZ_USER_TABLE
        value: "users"
      # Faz 21.3 outbox runtime: outbox poller + secondary HikariPool require
      # this flag at runtime. Test-overlay-only override; base + prod stay
      # fail-closed (REPORTS_DB_ENABLED=false in base) until per-env operator
      # rollout. Codex `019dd296` shared-cred era patch retired in
      # `019dd2af` follow-up — REPORTS_DB_USERNAME/PASSWORD now flow through
      # the base ExternalSecret contract from dedicated Vault keys
      # `reports_db_username`/`reports_db_password` populated by the
      # `docs/d35-dedicated-reports-role-runbook.md` operator step.
      - op: replace
        path: /data/REPORTS_DB_ENABLED
        value: "true"

  # Dilim 2: scale-to-zero 5 backend (D17)
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: variant-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: core-data-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: report-service
    patch: |-
      # Faz 19.MSSQL.A activation (test cluster):
      # - replicas=1 (D17 scale=0 override; MSSQL canlı 31 rapor + 12 dashboard)
      # - REPORT_PG_USERNAME/PASSWORD valueFrom secret (PG metadata için)
      # - PostgresDataSourceConfig'in default 'postgres'/'postgres' yetersiz, mevcut
      #   secret'taki SPRING_DATASOURCE_PASSWORD'u alias'lar.
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REPORT_PG_USERNAME
          valueFrom:
            secretKeyRef:
              name: report-service-secrets
              key: SPRING_DATASOURCE_USERNAME
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REPORT_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: report-service-secrets
              key: SPRING_DATASOURCE_PASSWORD
  - target:
      kind: Deployment
      name: schema-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

  # Dilim 3: OpenFGA scale-to-zero (D17 — test default, mode=normal)
  - target:
      kind: StatefulSet
      name: openfga
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # 2026-04-20: testai.acik.com authoritative live (e2e kanıtlı: curl 212.115.26.190
  # → HTTP 200 2899B Module Federation HTML). Frontend always-on (replicas=1); D17
  # scale-to-zero exception: UI public entrypoint her zaman erişilebilir olmalı.
  # Backend'ler mode=normal scale 0 kalır; frontend MFE static artifact DB bağımlı değil.
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # 2026-04-29 (Codex 019dd818 PARTIAL feedback): test cluster ResourceQuota
  # 8 CPU limit + 9 service × 750m = 6.75 CPU + frontend 200m + api-gateway
  # 1 CPU = 7.95 CPU dolu. Surge-based rollout (maxSurge=1) yer açamadığı
  # için yeni pod scheduling'den FailedCreate dönüyor; eski pod'u manuel
  # terminate etmek zorunda kaldık (sha-d58fa61 → sha-93a2ad6 cycle).
  # Test overlay için strategy patch: maxUnavailable=1/maxSurge=0 — yeni
  # pod yer için eski pod'u terminate edebilir (kısa süreli tek-replica
  # outage kabul edilir test cluster'da). Prod base'i etkilenmez (zero-
  # downtime maxSurge=1/maxUnavailable=0 korunur).
  - target:
      kind: Deployment
      name: permission-service
    patch: |-
      - op: replace
        path: /spec/strategy/rollingUpdate/maxSurge
        value: 0
      - op: replace
        path: /spec/strategy/rollingUpdate/maxUnavailable
        value: 1
      # 2026-04-29 Codex 019dd818 iter-2 PARTIAL ek bulgu: live cluster
      # permission-service replicas=1 (manuel scale geçmişi), base default 2
      # ile drift. Test overlay'de replicas=1 patch ile gitops desired-state
      # ↔ live state senkron. Quota matematiği zaten 1 replica üzerinden
      # düşünülmüştü (8 CPU - 7.45 used = 550m headroom; 750m surge fail).
      - op: replace
        path: /spec/replicas
        value: 1

  # Dilim 3: OpenFGA datastore URI (S2-A1 follow-up: shortname base'de zaten,
  # ama openfga_db + 'change-me-local-only' stub şifre bu patch'te test-specific.
  # ESO aktif olunca (S2-B1 pilot externalsecret.yaml) bu patch kaldırılır.)
  - target:
      kind: ConfigMap
      name: openfga-config
    patch: |-
      - op: replace
        path: /data/OPENFGA_DATASTORE_URI
        value: "postgres://openfga:change-me-local-only@postgres:5432/openfga?sslmode=disable"

  # 2026-04-19 S2-A1 follow-up: api-gateway shortname base'de zaten.
  # Overlay sadece LOGGING_LEVEL_ROOT DEBUG test override; gateway routes +
  # AUTH_SERVICE_URL + KEYCLOAK_URL replace'leri (eski patches) KALDIRILDI
  # (base shortname ile aynı değer → gereksiz).
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: replace
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "DEBUG"

  # Ingress host + TLS host: testai.acik.com (D18)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: testai.acik.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: testai.acik.com

  # Host bridge test portları (D20)
  # 2026-04-22 live truth: k3d-test node + test compose stateful container'lar
  # aynı `platform-test-net` Docker ağına bağlı. Bu yüzden host-service
  # endpoint'leri published host port yerine container bridge IP + native port
  # üzerinden çözülür. Controlled recreate sonrası bu IP'ler doğrulanmalıdır.
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.6"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.5"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8080
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.4"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200

  # Test PDB gevşek (tek replica olunca anlamsız)
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # Test ResourceQuota daralt: 3GiB/1vCPU (PLAN §2.4)
  - target:
      kind: ResourceQuota
      name: platform-quota
    patch: |-
      # Test quota (Dilim 1+2+3 tamamında 8+ pod çalışır; k3d lokal için)
      # 8 Spring Boot pod × 150m req × 750m limit + openfga + frontend
      - op: replace
        path: /spec/hard/requests.cpu
        value: "4"
      - op: replace
        path: /spec/hard/requests.memory
        value: 8Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "8"
      - op: replace
        path: /spec/hard/limits.memory
        value: 16Gi
