  # --- Faz 24 Meeting Intelligence (gitops#1615 activation) — TEST only ---
  # meeting-service (#410) + transcript-service (#411) admin API gateway routes.
  # These were moved OUT of the base api-gateway-config (Codex cross-AI REVISE
  # Must-Fix 1): prod overlay includes base, but meeting/transcript Deployments
  # are prod:deferred (NOT deployed to prod). A base route would make the prod
  # render produce routes to non-existent services (prod-leak). Test overlay is
  # the only place meeting/transcript run, so the routes live in this test-only
  # ConfigMap patch.
  # Native resource-specific path /api/v1/admin/meetings|transcripts → DIRECT
  # route, RewritePath YOK (notification-orchestrator /api/v1/admin/notify
  # route 19 emsali; Spring Boot 3.x trailing-slash strict → rewrite
  # empty-segment trailing-slash riskinden kaçınır). Servis-içi @RequireModule(
  # module:meeting|transcript) OpenFGA gate + SecurityConfig ROLE/SCOPE çift
  # kapı enforce eder. Shadowing yok: tek admin route /api/v1/admin/notify
  # (route 19, specific); catch-all yok.
  # INVARIANT: `kubectl kustomize overlays/test | grep ROUTES_26` → VAR;
  # `kubectl kustomize overlays/prod | grep ROUTES_26` → YOK (0 satır).
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: add
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_26_ID
        value: "meeting-admin-route"
      - op: add
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_26_URI
        value: "http://meeting-service:8097"
      - op: add
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_26_PREDICATES_0
        value: "Path=/api/v1/admin/meetings/**"
      - op: add
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_27_ID
        value: "transcript-admin-route"
      - op: add
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_27_URI
        value: "http://transcript-service:8098"
      - op: add
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_27_PREDICATES_0
        value: "Path=/api/v1/admin/transcripts/**"
      # Budget Control is TEST-first and PROD-deferred. The base gateway
      # ConfigMap owns indices 0..25 and this overlay already owns 26..27;
      # keep the product route in the same TEST-only list so environment
      # binding cannot shadow the route shipped in application-k8s.yml.
      - op: add
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_28_ID
        value: "budget-service-route"
      - op: add
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_28_URI
        value: "http://budget-service:8101"
      - op: add
        path: /data/SPRING_CLOUD_GATEWAY_ROUTES_28_PREDICATES_0
        value: "Path=/api/v1/budgets/**"

  # 2026-04-19 S2-A1 follow-up: Shortname refactor sonrası gereksiz SPRING_DATASOURCE_URL
  # + KEYCLOAK_URL replace patch'leri KALDIRILDI (base zaten shortname).
  # Overlay test-specific add patches (DDL_AUTO + FLYWAY_ENABLED + LOGGING DEBUG) kalır.

  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "DEBUG"
      # D1.1e (2026-05-17): Flyway RESTORED — DDL_AUTO=validate + FLYWAY=true.
      # D1.1b'nin (PR #581) live boot fail'i (`FATAL: password authentication
      # failed for user "platform"` at FlywayMigrationInitializer) bir Flyway
      # sorunu değildi — credential drift semptomuydu. D1.1c Phase 3 RCA:
      # auth-service'in Vault `db_password`'ü paylaşımlı `platform` PG rolünden
      # ayrışmıştı; eager Flyway connection drift'i yalnız görünür kılıyordu.
      # D1.1c (PR #727/#731) credential'ı düzeltti; D1.1d (PR #734) redundant
      # dialect env'leri temizledi. D1.1e rehearsal (disposable PG kopyası):
      # Flyway baseline v1 + V2 idempotent applied + Hibernate validate ile
      # clean boot kanıtlandı. Codex 019e3371 AGREE.
      # RCA: docs/d1.1c-flyway-rca-discovery-2026-05-14.md §5.Y
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "validate"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "true"
      # Codex 019e258a iter-5 + 019e25ba — D1.1a 2nd pass: PR #566 selective
      # apply dropped the inline env array (kubectl replace --force) and the
      # pod crashed with `Unable to determine Dialect without JDBC metadata`.
      # Root cause (Codex 019e25ba clarification): base ConfigMap already
      # carried `SPRING_DATASOURCE_URL` (verified via render of PR #566
      # merge commit 1ac92b3). The inline override also carried an explicit
      # Hibernate dialect property + Hikari fail-timeout; the dialect was
      # *believed* mandatory at the time. D1.1d (note below) disproved that:
      # the real cause was the D1.1c credential drift (broken DB connection
      # blocked Hibernate's JDBC metadata probe), not missing dialect config.
      #
      # SPRING_DATASOURCE_URL is pinned here too (defensive parity with
      # live override after kubectl set env recovery on 2026-05-14 ~12:00);
      # base value is identical so render is unaffected.
      # D1.1d cleanup (2026-05-17): HIBERNATE_DIALECT +
      # SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT removed — the PR #566
      # `Unable to determine Dialect` crash was a symptom of the D1.1c
      # credential drift (broken DB connection blocked Hibernate's JDBC
      # metadata probe). Post-fix debug-pod proof: DDL_AUTO=validate, no
      # explicit dialect -> clean boot, PostgreSQLDialect auto-detected.
      # Codex 019e32d8 Q1 AGREE.
      # SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT=30000 keeps
      # the pool seed tolerant of host-bridge PG short hiccups (already
      # paired with Hikari connection-timeout=30s in application-k8s.yml).
      - op: add
        path: /data/SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://postgres:5432/auth_db"
      - op: add
        path: /data/SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT
        value: "30000"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      # 2026-05-10 R-2 LIVE smoke discovery: Keycloak `frontend` client
      # has only one OIDC audience mapper (`notify-orch-audience` →
      # `notification-orchestrator`). Tokens minted via password grant
      # therefore carry `aud=notification-orchestrator` (single-string,
      # not list). Auth-service `oauth2ResourceServer.jwt` strict
      # audience validator rejects them unless `notification-orchestrator`
      # is in the expected audience list. Adding it here as an interim
      # workaround; permanent fix is a second OIDC audience mapper on the
      # `frontend` client that emits `auth-service` (DB row prepared but
      # KC realm cache reload is sandbox-blocked; follow-up).
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account,frontend,auth-service,notification-orchestrator"
      # User Impersonation v1 (PR-B): test cluster runs the platform-test
      # realm (not prod's `serban`). Without this overlay patch the broker
      # token-exchange would hit the wrong realm and fail with
      # TOKEN_EXCHANGE_FAILED even after broker-client-secret is wired.
      # Codex review iter-1 (thread 019e108a) flagged the realm drift; base
      # value (realms/serban) stays correct for prod desired state.
      - op: replace
        path: /data/AUTH_IMPERSONATION_KEYCLOAK_TOKEN_URL
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/token"

  # Dilim 2: 5 backend ConfigMap patches (DDL-auto + FLYWAY test override)
  # Faz 19.MSSQL.N (2026-04-25): SECURITY_JWT_* + KEYCLOAK_* (platform-test realm)
  # Test cluster e2e simülasyon ile bulundu: SecurityConfig firstNonBlank #3
  # (application.yml security.jwt.jwk-set-uri default-serban) override için #2
  # SECURITY_JWT_* env direkt set gerekli. Configmap'tan envFrom inject edilir.
  - target:
      kind: ConfigMap
      name: user-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      # D1.2 (2026-05-14): base'de OVERLAY_MUST_OVERRIDE placeholder var; replace.
      # AUDIENCE base'de env-agnostic literal — overlay patch gereksiz.
      - op: replace
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: replace
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      # Session 47 stabilization (Codex 019e1df7 REVISE):
      # SERVICE_AUTH_* uses auth-service-issued tokens (NOT Keycloak),
      # so the base defaults are environment-agnostic. No overlay patch
      # needed — base configmap already sets:
      #   SERVICE_AUTH_ISSUER=auth-service
      #   SERVICE_AUTH_JWK_SET_URI=http://auth-service:8088/oauth2/jwks
  - target:
      kind: ConfigMap
      name: variant-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_ISSUER
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account"   # variant-service AudienceValidator tek-string equals (CSV değil)
      - op: add
        path: /data/AUTHZ_USER_TABLE
        value: "users"
  - target:
      kind: ConfigMap
      name: core-data-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
