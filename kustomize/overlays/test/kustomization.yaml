# Test overlay — k3d-test (staging-sw test cluster)
# - Image: GHCR sha-<short>
# - Host bridge: platform-test-net Docker network (172.19.0.x); fiili
#   Endpoints patch değerleri satır 240+ (postgres 172.19.0.4, keycloak
#   172.19.0.5, vault 172.19.0.6). 10.9.10.53 prod overlay'de kullanılır.
# - UYARI: Endpoints IP'leri deterministic değil (docker network connect sırası
#   IP atar). Compose recreate sonrası bootstrap/reconnect-compose-to-test-net.sh
#   hem docker bağlantısını hem kubectl Endpoints patch'ini çalıştırır. Git truth
#   bu ay kullanılan IP setini yansıtır; kalıcı çözüm için compose'da
#   ipv4_address sabitlemek ayrı roadmap item'ı (platform-ssot repo değişikliği).
# - Replica: 0 default (D17 scale-to-zero); test-toggle.sh up → 1
# - Namespace: platform-test
# - JVM daha dar heap (D24)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-test

resources:
  - namespace.yaml    # Namespace + labels (platform=true env=test, ApplicationSet prereq)
  - ../../base
  - ../../base/apps/ops-bundle    # Faz 17.2.5: ExternalSecret + ServiceMonitor CRD paketi (runtime'dan ayrı)

images:
  # Faz 19.9 CUTOVER (Codex AGREE 019dc0ef Option B, ADR-0004):
  # Source: platform-backend + platform-web yeni repolar (Faz 19.1 filter-repo).
  # Pin: @sha256:digest (D30 immutable authoritative, moving tag YASAK).
  # Digest source: platform-backend ci-image-push + platform-web ci-web-image-push
  # workflow run 24908379838 + 24907995842 (2026-04-24 19:39 + 19:32 UTC).
  # Test overlay önce apply; D29 3-layer kanıt sonra prod (Codex gate).

  - name: auth-service
    newName: ghcr.io/halildeu/platform-backend-auth-service
    digest: sha256:c84bc6b04f7f17cc145024d6eeff2c624c52704a259ce843aeea63444da9ed37
  - name: api-gateway
    newName: ghcr.io/halildeu/platform-backend-api-gateway
    digest: sha256:5e7f0d48bfe080e59034ece9399390e6543c97d13c8e799c4a1bb9d1e9cd0d09
  - name: user-service
    newName: ghcr.io/halildeu/platform-backend-user-service
    digest: sha256:df8b84d0cd02d064cf455f40017bd5cb4ca1be271e5e7068afeb36fc4526a7f1
  - name: variant-service
    newName: ghcr.io/halildeu/platform-backend-variant-service
    digest: sha256:4a51a49f1b07cf6e211bff5bd01cc68946a85b522c5d7cc171718ac85d892d13
  - name: core-data-service
    newName: ghcr.io/halildeu/platform-backend-core-data-service
    digest: sha256:b803507ac6b17240a8cced6878606f2aad7b31856140d6b5071352135babf37f
  - name: report-service
    newName: ghcr.io/halildeu/platform-backend-report-service
    digest: sha256:13cc1b589d394533dc6077b07f043004db9dd95f62775b5f4ce5a924ff3c31f3
  - name: schema-service
    newName: ghcr.io/halildeu/platform-backend-schema-service
    digest: sha256:1a0e3f02664b5f431496a3443bd6603dfea3dd01a9bb7694e45e6e24d46f9a02
  - name: permission-service
    newName: ghcr.io/halildeu/platform-backend-permission-service
    digest: sha256:10cba61702cd66798330c86b0eecdfb1786eae8ad65f60c80067056698d06d96
  # Frontend — Faz 19.9 cutover testai variant (testai.acik.com + platform-test realm)
  - name: frontend
    newName: ghcr.io/halildeu/platform-web-frontend-testai
    digest: sha256:5901eaf4114e2b611c832abb5137be876339f7b067f1b9254ebc8d2104615e58

patches:
  # Replica 0 default (scale-to-zero)
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "-Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "-Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"

  # 2026-04-19 S2-A1 follow-up: Shortname refactor sonrası gereksiz SPRING_DATASOURCE_URL
  # + KEYCLOAK_URL replace patch'leri KALDIRILDI (base zaten shortname).
  # Overlay test-specific add patches (DDL_AUTO + FLYWAY_ENABLED + LOGGING DEBUG) kalır.

  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "DEBUG"
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"

  # Dilim 2: 5 backend ConfigMap patches (DDL-auto + FLYWAY test override)
  - target:
      kind: ConfigMap
      name: user-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
  - target:
      kind: ConfigMap
      name: variant-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
      - op: add
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: add
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account"
      - op: add
        path: /data/AUTHZ_USER_TABLE
        value: "users"
  - target:
      kind: ConfigMap
      name: core-data-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
  - target:
      kind: ConfigMap
      name: report-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
  - target:
      kind: ConfigMap
      name: schema-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"

  - target:
      kind: ConfigMap
      name: permission-service-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: replace
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: replace
        path: /data/PERMISSION_AUTHZ_USER_TABLE
        value: "users"

  # Dilim 2: scale-to-zero 5 backend (D17)
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: variant-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: core-data-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: report-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: schema-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

  # Dilim 3: OpenFGA scale-to-zero (D17 — test default, mode=normal)
  - target:
      kind: StatefulSet
      name: openfga
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # 2026-04-20: testai.acik.com authoritative live (e2e kanıtlı: curl 212.115.26.190
  # → HTTP 200 2899B Module Federation HTML). Frontend always-on (replicas=1); D17
  # scale-to-zero exception: UI public entrypoint her zaman erişilebilir olmalı.
  # Backend'ler mode=normal scale 0 kalır; frontend MFE static artifact DB bağımlı değil.
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Dilim 3: OpenFGA datastore URI (S2-A1 follow-up: shortname base'de zaten,
  # ama openfga_db + 'change-me-local-only' stub şifre bu patch'te test-specific.
  # ESO aktif olunca (S2-B1 pilot externalsecret.yaml) bu patch kaldırılır.)
  - target:
      kind: ConfigMap
      name: openfga-config
    patch: |-
      - op: replace
        path: /data/OPENFGA_DATASTORE_URI
        value: "postgres://openfga:change-me-local-only@postgres:5432/openfga?sslmode=disable"

  # 2026-04-19 S2-A1 follow-up: api-gateway shortname base'de zaten.
  # Overlay sadece LOGGING_LEVEL_ROOT DEBUG test override; gateway routes +
  # AUTH_SERVICE_URL + KEYCLOAK_URL replace'leri (eski patches) KALDIRILDI
  # (base shortname ile aynı değer → gereksiz).
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: replace
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "DEBUG"

  # Ingress host + TLS host: testai.acik.com (D18)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: testai.acik.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: testai.acik.com

  # Host bridge test portları (D20)
  # 2026-04-22 live truth: k3d-test node + test compose stateful container'lar
  # aynı `platform-test-net` Docker ağına bağlı. Bu yüzden host-service
  # endpoint'leri published host port yerine container bridge IP + native port
  # üzerinden çözülür. Controlled recreate sonrası bu IP'ler doğrulanmalıdır.
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.6"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.5"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8080
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.4"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200

  # Test PDB gevşek (tek replica olunca anlamsız)
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # Test ResourceQuota daralt: 3GiB/1vCPU (PLAN §2.4)
  - target:
      kind: ResourceQuota
      name: platform-quota
    patch: |-
      # Test quota (Dilim 1+2+3 tamamında 8+ pod çalışır; k3d lokal için)
      # 8 Spring Boot pod × 150m req × 750m limit + openfga + frontend
      - op: replace
        path: /spec/hard/requests.cpu
        value: "4"
      - op: replace
        path: /spec/hard/requests.memory
        value: 8Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "8"
      - op: replace
        path: /spec/hard/limits.memory
        value: 16Gi
