    # 2026-05-25 update — AuthBootstrapper cold-mount triple-init race fix
    # (platform-web PR #661 squash @ 642e5b4f):
    #
    # Live testai forensics (claude-in-chrome MCP, cold deep-link to
    # /endpoint-admin/devices) showed `[AuthBootstrapper] init starting`
    # log firing 3 times within one second of fresh page load. Same call
    # site, same useEffect deps. Sibling design-system `[ag-grid-license]`
    # fired the same N times → Module Federation eager-remote init pass
    # (5 eager remotes: mfe_endpoint_admin/users/audit/access/reporting)
    # churns a re-render path the MF runtime threads back into the shell's
    # React tree.
    #
    # Symptom chain pre-fix:
    #   - bootstrap #1: keycloak.init() → dispatches user/token + transportReady
    #   - bootstrap #2: kc-js hasn't re-emitted token via live getter →
    #     controller sees getToken()==null → dispatchSessionClear → wipes #1
    #   - bootstrap #3: may recover, but RTK subscriptions from the brief
    #     transportReady window stay stuck
    #   - Net: state.auth.user=null despite kcInit=true, auth.ready() never
    #     settles to transportReady, no /api/v1/endpoint-admin/* request
    #     fires, grid stuck "Cihazlar yükleniyor…", permission-gated nav
    #     items hidden, F5 reload masks the bug.
    #
    # Two-part fix in apps/mfe-shell/src/app/providers/AuthBootstrapper.tsx:
    #   1. Module-level `pageBootstrapOutcomeDeferred` singleton. Only the
    #      first useEffect mount per page lifecycle invokes bootstrap();
    #      subsequent mounts re-attach the keycloak event handlers but
    #      share the deferred so the unauthenticated-then-recover catch-up
    #      closure (PR-2 / Codex 019e362e) still works.
    #   2. `componentMountedRef` (useRef tied to []-deps cleanup useEffect
    #      with setup-side `true` re-assertion per Codex iter-1 P2 absorb)
    #      decouples bootstrap's isMounted liveness from useEffect re-run
    #      cleanup — so the local `let mounted` from the first run no
    #      longer flips false at the second run's cleanup-of-previous and
    #      aborts bootstrap mid-flight.
    #
    # Cross-AI peer review: Codex thread 019e6061 → REVISE iter-1
    # (componentMountedRef setup-side write missing + tests not exercising
    # real multi-fire) → iter-2 absorb (StrictMode + pending kc.init
    # regression spec asserting final {phase: transportReady, token: truthy})
    # → AGREE + ready_to_merge: true.
    #
    # Tests: full providers/ suite 34/34 pass (5 files, +1 net for new
    # StrictMode spec). ESLint clean. CI 30 pass / 0 fail / 2 skipping.
