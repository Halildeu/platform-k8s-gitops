      # Faz 23.3.2 PR-A2.1 — JetSMS multipart operational flag açma (Codex
      # thread 019e4514). PR-A1 + PR-A1.1 + PR-A1.2 + PR-A2.0 backend
      # hardening tamamlandıktan sonra test cluster'da operational multipart
