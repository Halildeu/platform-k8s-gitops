        path: /data/SECURITY_JWT_JWK_SET_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      # 2026-05-10 R-2 LIVE smoke discovery: Keycloak `frontend` client
      # has only one OIDC audience mapper (`notify-orch-audience` →
      # `notification-orchestrator`). Tokens minted via password grant
      # therefore carry `aud=notification-orchestrator` (single-string,
      # not list). Auth-service `oauth2ResourceServer.jwt` strict
      # audience validator rejects them unless `notification-orchestrator`
      # is in the expected audience list. Adding it here as an interim
      # workaround; permanent fix is a second OIDC audience mapper on the
      # `frontend` client that emits `auth-service` (DB row prepared but
      # KC realm cache reload is sandbox-blocked; follow-up).
      - op: add
        path: /data/SECURITY_JWT_AUDIENCE
        value: "account,frontend,auth-service,notification-orchestrator"
      # User Impersonation v1 (PR-B): test cluster runs the platform-test
      # realm (not prod's `serban`). Without this overlay patch the broker
      # token-exchange would hit the wrong realm and fail with
      # TOKEN_EXCHANGE_FAILED even after broker-client-secret is wired.
      # Codex review iter-1 (thread 019e108a) flagged the realm drift; base
      # value (realms/serban) stays correct for prod desired state.
      - op: replace
        path: /data/AUTH_IMPERSONATION_KEYCLOAK_TOKEN_URL
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/token"

