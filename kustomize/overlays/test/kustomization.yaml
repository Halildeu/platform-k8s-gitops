  # Faz 24 audio-gateway: test replicas=1 (HARD RULE test scale-to-zero YASAK;
  # base replicas:0 sadece skeleton fail-closed default'u)
  - target:
      kind: Deployment
      name: audio-gateway
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: audio-gateway
      spec:
        replicas: 1
        template:
          metadata:
            annotations:
              # Faz 24 #716 authz enforce flip consumes ConfigMap values via
              # envFrom. A ConfigMap-only edit does not restart pods, so this
              # test-only marker changes the pod template hash and makes the
              # enforce flip rollout GitOps-authoritative. Bump this rev on
              # any future authz env flip.
              audio-gateway.acik.com/authz-enforce-rev: "2026-06-26-716-enforce-v2"
              # Faz 24 #182 direct-STT enable flip consumes ConfigMap values via
              # envFrom too. Bump this rev whenever AUDIO_GATEWAY_DIRECT_STT_ENABLED
              # changes so ArgoCD/kustomize sync actually rolls the pod and it
              # re-reads the flag (rollback to "false" must also bump+roll).
              audio-gateway.acik.com/direct-stt-enable-rev: "2026-07-26-sentence-assembly-v1"

  # Faz 24 #716: test-only audience/capability enforcement flip. Base remains
  # default-off so future prod inclusion requires its own D30 review.
  - target:
      kind: ConfigMap
      name: audio-gateway-config
    patch: |-
      - op: replace
        path: /data/AUDIO_GATEWAY_SECURITY_ENFORCE_AUDIENCE
        value: "true"
      - op: replace
        path: /data/AUDIO_GATEWAY_SECURITY_REQUIRE_AUDIO_RECORD_ROLE
        value: "true"

  # Faz 24 ai#184: canli WS streaming flip (2. deneme, #803 fix'i ile birlikte).
  # 1. deneme (gitops#2283) crashloop etti; kok neden #788'in tasidigi bean
  # cakismasiydi ve platform-backend#803 ile kalici olarak cozuldu
  # (@Bean(defaultCandidate=false) + gercek-context LiveSttWebSocketWiringTest;
  # fix'siz halde test prod hatasinin ayni'sini uretiyor). Bu PR digest bump'i
  # ve flip'i BIRLIKTE yapar -> pod tek roll'da hem fix'i hem flag'i alir.
  # Upstream ayni app-mTLS hatti (transcribe-url ile ayni host/port, NetPol
  # netpol-audio-gateway-live-stt-mtls kapsaminda); live-stt /ws/stream mTLS
  # handshake'i 101 Switching Protocols ile canli dogrulandi.
  # ROLLBACK: iki degeri base default'una dondur ("false" + "") + rev bump.
  - target:
      kind: ConfigMap
      name: audio-gateway-config
    patch: |-
      - op: replace
        path: /data/AUDIO_GATEWAY_DIRECT_STT_STREAMING_ENABLED
        value: "true"
      # --- Faz 24 cumle birlestirme (platform-backend#918) ---
      #
      # SORUN: kullanicinin bildirdigi "ayni cumleyi on satirda okuyorsun".
      # live-stt AKUSTIK sinirda commit eder (sessizlik/sure), DILBILIMSEL
      # sinirda degil — bir cumle bu yuzden N parcaya boluner.
      #
      # Assembler bu parcalari okunabilir satirlara birlestirir ve UTTERANCE
      # olarak yayinlar; ham parcalar DRAFT olarak akmaya devam eder.
      #
      # SIRA ONEMLI: istemci UTTERANCE render'i ONCE inmeliydi
      # (platform-desktop#89, merged) — aksi halde UTTERANCE default'a dusup
      # 'draft' sayiliyor ve AYRI eventId tasidigi icin ayni metin hem parcali
      # hem butun goruntuleniyordu (cift satir).
      #
      # ON KOSUL: aggregation.enabled=true olmali. Kod fail-closed:
      # AudioGatewayProperties.validate() aksi halde BOOT ETTIRMEZ. Base'de
      # AUDIO_GATEWAY_DIRECT_STT_AGGREGATION_ENABLED=true (dogrulandi).
      #
      # ROLLBACK: bu uc satiri kaldir (assembly default false) + rev bump.
      - op: add
        path: /data/AUDIO_GATEWAY_DIRECT_STT_SENTENCE_ASSEMBLY_ENABLED
        value: "true"
      - op: add
        path: /data/AUDIO_GATEWAY_DIRECT_STT_SENTENCE_ASSEMBLY_MAX_SPEECH_MS
        value: "12000"
      - op: add
        path: /data/AUDIO_GATEWAY_DIRECT_STT_SENTENCE_ASSEMBLY_IDLE_MS
        value: "2000"
      - op: replace
        path: /data/AUDIO_GATEWAY_DIRECT_STT_STREAMING_STREAM_URL
        value: "wss://live-stt.denetim:8243/ws/stream"

