# Test overlay — k3d-test (staging-sw test cluster)
# - Image: GHCR sha-<short>
# - Host bridge: platform-test-net Docker network (172.19.0.x); fiili
#   Endpoints patch değerleri satır 240+ (postgres 172.19.0.2, keycloak
#   172.19.0.3, vault 172.19.0.1). 10.9.10.53 prod overlay'de kullanılır.
# - Replica: 0 default (D17 scale-to-zero); test-toggle.sh up → 1
# - Namespace: platform-test
# - JVM daha dar heap (D24)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-test

resources:
  - namespace.yaml    # Namespace + labels (platform=true env=test, ApplicationSet prereq)
  - ../../base

images:
  # Gerçek GHCR path: halildeu/platform-ssot-<service> (tire ile, slash değil)
  # 2026-04-19 akşam: Tüm 8 servis sha-3923901 immutable tag (D30 full uyum).
  # Dev repo main merge sonrası CI GHCR'a push ediyor, overlay bu sha'ya pin'lenir.
  # Yeni commit'ler → yeni sha-<short> → overlay güncellenir (manuel veya W3 CI).
  # moving tag main-stable D30 ihlal (cache hit, yeni image çekilmez).
  - name: auth-service
    newName: ghcr.io/halildeu/platform-ssot-auth-service
    newTag: sha-3923901
  - name: api-gateway
    newName: ghcr.io/halildeu/platform-ssot-api-gateway
    newTag: sha-3923901
  - name: user-service
    newName: ghcr.io/halildeu/platform-ssot-user-service
    newTag: sha-3923901
  - name: variant-service
    newName: ghcr.io/halildeu/platform-ssot-variant-service
    newTag: sha-3923901
  - name: core-data-service
    newName: ghcr.io/halildeu/platform-ssot-core-data-service
    newTag: sha-3923901
  - name: report-service
    newName: ghcr.io/halildeu/platform-ssot-report-service
    newTag: sha-3923901
  - name: schema-service
    newName: ghcr.io/halildeu/platform-ssot-schema-service
    newTag: sha-3923901
  # 2026-04-19 S1-C14: permission-service IMMUTABLE tag (Codex ping-pong Madde 3
  # uzlaşı; D30 HARD RULE uyumu). PR #502 merge commit 39239011ba1d → CI push
  # sha-3923901 tag (7-char short SHA, CI konvansiyon). "main-stable" tek başına
  # D30 ihlal. Diğer servislerde full digest pin W3 ayrı PR (S2-B2 platform-ssot CI),
  # permission-service burada pilot.
  - name: permission-service
    newName: ghcr.io/halildeu/platform-ssot-permission-service
    newTag: sha-3923901

patches:
  # Replica 0 default (scale-to-zero)
  - target:
      kind: Deployment
      name: auth-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "-Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"
  - target:
      kind: Deployment
      name: api-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "-Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:ActiveProcessorCount=1"

  # 2026-04-19 S2-A1 follow-up: Shortname refactor sonrası gereksiz SPRING_DATASOURCE_URL
  # + KEYCLOAK_URL replace patch'leri KALDIRILDI (base zaten shortname).
  # Overlay test-specific add patches (DDL_AUTO + FLYWAY_ENABLED + LOGGING DEBUG) kalır.

  - target:
      kind: ConfigMap
      name: auth-service-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "DEBUG"
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"

  # Dilim 2: 5 backend ConfigMap patches (DDL-auto + FLYWAY test override)
  - target:
      kind: ConfigMap
      name: user-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
  - target:
      kind: ConfigMap
      name: variant-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
  - target:
      kind: ConfigMap
      name: core-data-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
  - target:
      kind: ConfigMap
      name: report-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"
  - target:
      kind: ConfigMap
      name: schema-service-config
    patch: |-
      - op: add
        path: /data/SPRING_JPA_HIBERNATE_DDL_AUTO
        value: "update"
      - op: add
        path: /data/SPRING_FLYWAY_ENABLED
        value: "false"

  # Dilim 2: scale-to-zero 5 backend (D17)
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: variant-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: core-data-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: report-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: schema-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

  # Dilim 3: OpenFGA + Frontend scale-to-zero (D17)
  - target:
      kind: StatefulSet
      name: openfga
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0

  # Dilim 3: OpenFGA datastore URI (S2-A1 follow-up: shortname base'de zaten,
  # ama openfga_db + 'change-me-local-only' stub şifre bu patch'te test-specific.
  # ESO aktif olunca (S2-B1 pilot externalsecret.yaml) bu patch kaldırılır.)
  - target:
      kind: ConfigMap
      name: openfga-config
    patch: |-
      - op: replace
        path: /data/OPENFGA_DATASTORE_URI
        value: "postgres://openfga:change-me-local-only@postgres:5432/openfga?sslmode=disable"

  # 2026-04-19 S2-A1 follow-up: api-gateway shortname base'de zaten.
  # Overlay sadece LOGGING_LEVEL_ROOT DEBUG test override; gateway routes +
  # AUTH_SERVICE_URL + KEYCLOAK_URL replace'leri (eski patches) KALDIRILDI
  # (base shortname ile aynı değer → gereksiz).
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "DEBUG"

  # Ingress host + TLS host: testai.acik.com (D18)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: testai.acik.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: testai.acik.com

  # Host bridge test portları (D20)
  # Host bridge endpoints — compose container'lar platform-test-net Docker
  # network'üne ek bağlı (docker network connect). IP'ler docker-compose up
  # ile sabit kalır; rebuild sonrası yeniden connect gerekebilir.
  # TODO: compose dosyasına networks: [platform-test-net] kalıcı ekle.
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.2"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.3"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8080        # container port (host 8081 mapping yok platform-test-net için)
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.1"        # Vault henüz connect edilmedi — placeholder
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200

  # Test PDB gevşek (tek replica olunca anlamsız)
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # Test ResourceQuota daralt: 3GiB/1vCPU (PLAN §2.4)
  - target:
      kind: ResourceQuota
      name: platform-quota
    patch: |-
      # Test quota (Dilim 1+2+3 tamamında 8+ pod çalışır; k3d lokal için)
      # 8 Spring Boot pod × 150m req × 750m limit + openfga + frontend
      - op: replace
        path: /spec/hard/requests.cpu
        value: "4"
      - op: replace
        path: /spec/hard/requests.memory
        value: 8Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "8"
      - op: replace
        path: /spec/hard/limits.memory
        value: 16Gi
