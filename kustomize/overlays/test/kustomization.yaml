  - target:
      kind: ConfigMap
      name: notification-orchestrator-config
    patch: |-
      - op: replace
        path: /data/SPRING_DATASOURCE_URL
        value: "jdbc:postgresql://postgres:5432/notify_db"
      - op: replace
        path: /data/NOTIFY_ADAPTERS_SMTP_HOST
        value: "mailpit.platform-test.svc.cluster.local"
      - op: add
