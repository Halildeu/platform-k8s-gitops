  # endpoint-admin.uninstall.enabled dark-launch flag ON for the test cluster.
  # Justification (No Fake Work — all live-verified on testai.acik.com):
  #   - Backend (V32 schema + REST + maker-checker), agent adapter, web UI: LIVE.
  #   - Destructive E2E PASSED: real 7-Zip uninstall on HALILKOOLUB735 →
  #     endpoint_uninstall_audit result_status=SUCCEEDED_VERIFIED,
  #     verification=ABSENT_VERIFIED (maker-checker proposer≠approver enforced).
  #   - Headless-browser acceptance PASSED (test persona c5persona-admin-9001,
  #     ENDPOINT_ADMIN role + OpenFGA can_manage): Kaldır button + "Son
  #     Kaldırmalar" table rendering the real SUCCEEDED_VERIFIED/ABSENT_VERIFIED
  #     audit row + maker-checker confirm modal + device-scoped approval route;
  #     all uninstall endpoints returned 200, no console errors.
  #   - Cross-AI: Codex thread 019e9448 (posture) — go-live must be this governed
  #     overlay flip, NOT an ephemeral kubectl patch.
  # PROD stays DARK (inherits base default "false") — a separate, deliberately
  # evaluated go-live decision. `replace` (not `add`) is deliberate: it fails fast
  # if the base "false" default is ever removed (mirrors the OpenFGA pin above).
  - target:
      kind: ConfigMap
      name: endpoint-admin-service-config
    patch: |-
      - op: replace
        path: /data/ENDPOINT_ADMIN_UNINSTALL_ENABLED
        value: "true"

  # #676 Domain Ops Broker product-channel acceptance (TEST only). Base/prod
  # stay dark; test flips the broker ON so the authenticated Admin API smoke can
  # prove durable request state, credential-ref custody, typed connector
  # dispatch, bounded permit metadata and result/audit persistence. `replace`
  # is deliberate: if the base dark-launch default is removed, render fails
  # instead of silently inventing an enabled runtime key.
  - target:
      kind: ConfigMap
      name: endpoint-admin-service-config
    patch: |-
      - op: replace
        path: /data/ENDPOINT_ADMIN_DOMAIN_OPS_ENABLED
        value: "true"

  # Faz 22.5 M2 AD CS / edge mTLS activation (TEST only) — gitops #1359/#1376.
  # Preconditions live-proven 2026-06-14:
  #   - AD CS Enterprise Root CA Acik-Endpoint-CA on ERP-MOBIL.acik.local.
  #   - Server cert SAN covers mtls.testai.acik.com + mtls.ai.acik.com.
  #   - Kubernetes secrets endpoint-admin-service-mtls-stores and
  #     endpoint-admin-service-mtls-secrets are seeded out-of-band; no secret
  #     material is committed here.
  #   - Fixed tenant UUID is the current platform-test endpoint-admin tenant
  #     observed in endpoint_devices/enrollments/audit rows.
  # The forward-header mode must be OFF when passthrough is ON; the backend
  # fails closed if both are enabled. Prod inherits the base default-off state.
  - target:
      kind: ConfigMap
      name: endpoint-admin-service-config
    patch: |-
      - op: replace
        path: /data/ENDPOINT_ADMIN_MTLS_FORWARD_HEADER_ENABLED
        value: "false"
      - op: replace
        path: /data/ENDPOINT_ADMIN_MTLS_PASSTHROUGH_ENABLED
        value: "true"
      - op: replace
        path: /data/ENDPOINT_ADMIN_MTLS_PASSTHROUGH_FIXED_TENANT_ID
        value: "00000000-0000-0000-0000-000000000001"

  # Faz 22.6 #548 TPM-attest enrollment activation (ADR-0039 gate-4 / gate-4d)
  # — TEST only. Backend properties: endpoint-admin.tpm-attest.* bound by
  # TpmAttestProperties (@ConfigurationProperties prefix "endpoint-admin.tpm-attest")
  # + the manufacturer-root-pems @Value in TpmEnrollmentConfig. Disabled-by-default
  # + per-tenant opt-in: with enabled=false every enrollment is fail-closed
  # (TpmDenyCode.FEATURE_DISABLED); with an empty allowed-tenant-ids no tenant can
  # enroll. This overlay flips it ON for the live-proof M1 and opts the single
  # platform-test tenant in. Prod inherits the base default (no TPM keys → disabled).
  #
  # Trust anchors are PUBLIC manufacturer roots, so their PEM bytes + pinned
  # SHA-256 values belong in this ConfigMap (NO Vault, NO secret material).
  # The bundle includes the existing Intel/Infineon pilot roots plus the official
  # Nuvoton TPM Root CA 2111 required by MKR-A1's NPCT75x EK certificate:
  # https://www.nuvoton.com/security/NTC-TPM-EK-Cert/Nuvoton%20TPM%20Root%20CA%202111.cer
  # Nuvoton DER SHA-256:
  # cd8185ff8995ed09811970090a8c36fafab34ef87f47fa51fdb9ecf95c9c2e04.
  # It is self-signed CA:TRUE/pathlen:0 with Certificate Sign usage; it is a
  # trust anchor, not an intermediate. TpmEnrollmentConfig
  # fail-closes (EkChainException) at startup if the PEM bundle is empty or any
  # cert is not in the pinned SHA-256 set — so an enabled-but-unanchored deploy
  # crashes fast instead of enrolling against an empty trust set.
  #
  # ENDPOINT_ADMIN_TPM_ATTEST_PCR_REQUIRED_BITMAP_HEX is DELIBERATELY OMITTED: the
  # agent's -auto-enroll-tpm sends no PCR selection, and the TpmPcrPolicy bean is
  # @ConditionalOnProperty(...pcr.required-bitmap-hex) — absent ⇒ no PCR policy
  # bean ⇒ no startup failure ⇒ PCR quote is not mandated. Setting a strict bitmap
  # would fail closed against the agent's no-PCR evidence.
  #
  # `op: add` (not replace) is deliberate — these keys do not exist in the base
  # ConfigMap; this overlay introduces the TPM-attest contract for the test
  # cluster only.
  - target:
      kind: ConfigMap
      name: endpoint-admin-service-config
    patch: |-
      - op: add
        path: /data/ENDPOINT_ADMIN_TPM_ATTEST_ENABLED
        value: "true"
      - op: add
        path: /data/ENDPOINT_ADMIN_TPM_ATTEST_ALLOWED_TENANT_IDS
        value: "00000000-0000-0000-0000-000000000001"
      - op: add
        path: /data/ENDPOINT_ADMIN_TPM_ATTEST_MANUFACTURER_ROOT_SHA256
        value: "beb40bb7507b33967226aa80e084749fbb6593893c642e818d682e9a8d07fc24,899e35474c9807eb4c7f2f7a12da0028fb250cd02154d0009fca7d9c66574f3b,cd8185ff8995ed09811970090a8c36fafab34ef87f47fa51fdb9ecf95c9c2e04"
