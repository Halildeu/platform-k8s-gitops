  # Test ResourceQuota (2026-05-10: scale-to-zero deprecation sonrasi tum 12
  # deploy + STS replicas=1 sürekli çalışıyor; rolling update surge için
  # extra headroom gerek).
  # 2026-07-11 ats-39d4a: node allocatable 50 pod TAVANINA dayanildi (Running=50;
  # ats-interview-evidence Pending 'Too many pods'). artifact-host statik dosya
  # sunucusu — test'te HA gereksiz; base 2 replika prod tercihi olarak kalir,
  # test 1'e indirilir (Scale-to-Zero YASAK kuralina uygun: 0 degil, 1).
  - target:
      kind: Deployment
      name: artifact-host
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: ResourceQuota
      name: platform-quota
    patch: |-
      # Test quota — 12 Deployment + OpenFGA STS replicas=1 default
      # (HARD RULE — Scale-to-Zero YASAK). Ortalama declared usage ~7350m
      # Session 42 evidence: PR #485 DLR rollout FailedCreate at 7675m+400m=8075m
      # over 8000m hard cap. Manifest 10 CPU previously not synced to cluster.
      # 12 CPU + 6 requests = matched live cluster patch 2026-05-10 07:48Z.
      - op: replace
        path: /spec/hard/requests.cpu
        value: "6"
      - op: replace
        path: /spec/hard/requests.memory
        value: 12Gi
      # 2026-07-11 ats-interview-evidence (39d-3): LimitRange 500m limit enjekte
      # eder; 12000m tavan 11925m kullanimda 500m'e yer birakmadi (ReplicaSet
      # exceeded quota kaniti). +1 CPU limit-overcommit (host gercek yuku degil).
      # 2026-07-11 faz22.6 device-key VIEW_ONLY smoke: broker step-up rollout
      # (maxUnavailable:1) sirasinda 750m yeni-pod slot'u limits.cpu=13'te
      # 12325m kullanimla sigmadi (FailedCreate exceeded quota) -> broker DOWN.
      # 16 CPU: rolling-surge + ATS/audio-gateway buyumesi icin headroom
      # (limits ceiling; host gercek CPU yuku %9, overcommit guvenli). Asil
      # tavan node max-pods=50 (ayri kapasite-hardening isi, board item).
      - op: replace
        path: /spec/hard/limits.cpu
        value: "16"
      - op: replace
        path: /spec/hard/limits.memory
        value: 24Gi
      # 2026-06-18: audit-archive-exporter Service made the live namespace hit
      # services=28/28, blocking ArgoCD sync before artifact-host v0.2.9 could
      # reconcile. 2026-07-03: Faz 24 #2186 meeting-ai test bridge found live
      # services=32/32 after Endpoints/NetPolicy synced; keep small test-only
      # headroom so the selectorless Service can reconcile via GitOps.
      # 2026-07-19: Faz 35 Etik Speak adds three Services. Live was 34/36, so
      # the old ceiling could not admit the product cell; 40 leaves three slots
      # after activation. Test-only; prod quota is unchanged.
      - op: replace
        path: /spec/hard/services
        value: "40"
      # 2026-06-28: Faz 22.6 #548 dedicated device-key broker adds three
      # isolated ExternalSecret-owned Secrets (runtime, TLS, signer). Live
      # namespace was already secrets=30/30, so keep this test-only object
      # quota honest instead of reusing the shared broker secret path.
      # Faz 35 adds two ESO-owned Secrets; 44 retains four steady-state slots.
      - op: replace
        path: /spec/hard/secrets
        value: "44"
      # Faz 35 steady state adds three pods; simultaneous maxSurge adds three.
      # Live was 26/30, so 34 preserves two slots at the six-pod rollout peak.
      - op: replace
        path: /spec/hard/pods
        value: "34"
      # Faz 35 adds two ConfigMaps. Live was 30/31; 35 preserves three slots.
      - op: replace
        path: /spec/hard/configmaps
        value: "35"
