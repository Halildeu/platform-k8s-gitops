  # Faz 23.4 PR-E.4 absorb (revert PR-E.3 HPA min=max=1 lock):
  # Backend PR Halildeu/platform-backend#89 lands cross-pod broadcast via PG
  # LISTEN/NOTIFY. PG-only stateful kanonik referansı ADR-0013 §"Stateful"
