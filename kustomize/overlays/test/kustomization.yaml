  # board #2559 (umbrella #2530) — TEST-ONLY. Do NOT promote to the prod overlay.
  #
  # Measured on testai 2026-07-17: an admin whose token resolves to org
  # 68c73eb9-c410-37dc-aff7-5ade8fbbcbb7 saw an EMPTY fleet, because all 11 enrolled devices
  # carry the fixed tenant 00000000-…-0001 that agent mTLS passthrough stamps at enrolment.
  # Query returned 200 with zero rows — isolation was working; the two sides simply never met.
  #
  # `replace` (not `add`) on purpose: if the base ever drops the key, this fails loudly instead
  # of silently reintroducing the empty fleet. The resolver applies an alias ONLY to a proven
  # canonical org claim, and refuses a non-injective map at startup.
  - target:
      kind: ConfigMap
      name: endpoint-admin-service-config
    patch: |-
      - op: replace
        path: /data/ENDPOINT_ADMIN_TENANT_ORG_ALIASES
        value: "68c73eb9-c410-37dc-aff7-5ade8fbbcbb7=00000000-0000-0000-0000-000000000001"
      # TEST tokens currently carry both canonical org_id and a legacy numeric
      # companyId. The resolver must trust the proven canonical org during this
      # migration instead of rejecting the otherwise valid Platform Admin token.
      - op: replace
        path: /data/ENDPOINT_ADMIN_TENANT_ENFORCE_CLAIM_CONSISTENCY
        value: "false"
  # A ConfigMap edit alone does NOT reach a running pod: env is computed at container start and
  # envFrom leaves the Deployment hash untouched, so Argo reports Synced while the process keeps
  # the old value (learned the hard way on #2533). This marker rolls the pods.
  - target:
      kind: Deployment
      name: endpoint-admin-service
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/endpoint-admin.acik.com~1org-alias-rev
        value: "2913-tenant-claim-transition-1"
  - target:
      kind: ConfigMap
      name: user-service-config
    patch: |-
      - op: replace
        path: /data/USER_PENDING_ACTIVATION_NOTIFICATION_ENABLED
        value: "true"
      # board #2533 (umbrella #2530) — TEST-ONLY. Do NOT promote to the prod overlay.
      #
      # JwtAutoProvisionGate is fail-closed: without the M365 marker claim `entra_tid` it denies
      # ("missing-entra-tid") unless auto-provision.allow-local-keycloak=true
      # (${AUTO_PROVISION_ALLOW_LOCAL_KEYCLOAK:false} — never set anywhere until now).
      # Consequence: local-Keycloak users never get a `user_service.users` row → no numeric user id
      # → the authz chain reads with the wrong subject and returns 403.
      #
      # Scope of this flag (precise): it removes ONLY the `entra_tid` requirement. The remaining
      # fail-closed gates stay: issuer allow-list, valid `sub`, email present, email_verified.
      # So this admits "local-Keycloak users that satisfy the remaining claim/issuer gates",
      # not "every non-M365 login".
      #
      # What it does NOT change: the persisted activation state. UserService still creates the row
      # role=USER, enabled=false, companyId=null (pinned by UserServiceTest). The cross-service
      # invariant "a disabled account cannot consume protected product surfaces" is NOT proven by
      # this PR — AuthenticatedUserLookupService resolves the numeric id without carrying `enabled`
      # into the authorization decision. That gate is verified negatively during #2533 runtime
      # acceptance (grant first, expect 403 while disabled, activate, expect 200 — activation the
      # only variable). Until then no grant is issued to a persona before activation.
      - op: add
        path: /data/AUTO_PROVISION_ALLOW_LOCAL_KEYCLOAK
        value: "true"
  # board #2533 — TEST-ONLY pod-template rollout marker.
  # user-service reads the ConfigMap via `envFrom: configMapRef`, and Kubernetes computes process
  # env ONLY at pod start: changing the ConfigMap alone leaves the running pod on the old value and
  # does not change the Deployment/ReplicaSet hash, so Argo reports Synced while the flag never
  # reaches the process. ADR-0023 forbids fixing that with an out-of-band `kubectl rollout restart`
  # on this shared cluster, so the rollout must be GitOps-authoritative: bump this marker whenever
  # the TEST-only env contract above changes. Strategic-merge (not a JSON patch on /annotations) so
  # future pod annotations are merged rather than overwritten.
  - target:
      kind: Deployment
      name: user-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: user-service
      spec:
        template:
          metadata:
            annotations:
              user-service.acik.com/local-kc-provision-rev: "2533-1"
  - target:
      kind: ConfigMap
      name: meeting-service-config
    patch: |-
      - op: add
        path: /data/MEETING_AI_BASE_URL
        value: "http://meeting-ai-service:8080"
      # #2360 test-only migration window. Defaults remain false in source and
      # prod. Remove both flags only after stable-sub tuple backfill, exact
      # allow/deny verification, and old/new desktop meeting smoke evidence.
      - op: add
        path: /data/MEETING_AUTHZ_LEGACY_USER_ID_FALLBACK_ENABLED
        value: "true"
      - op: add
        path: /data/MEETING_AUTHZ_LEGACY_USER_ID_DUAL_WRITE_ENABLED
        value: "true"

