        value: 0
      - op: replace
        path: /spec/strategy/rollingUpdate/maxUnavailable
        value: 1
      # 2026-04-29 Codex 019dd818 iter-2 PARTIAL ek bulgu: live cluster
      # permission-service replicas=1 (manuel scale geçmişi), base default 2
      # ile drift. Test overlay'de replicas=1 patch ile gitops desired-state
      # ↔ live state senkron. Quota matematiği zaten 1 replica üzerinden
      # düşünülmüştü (8 CPU - 7.45 used = 550m headroom; 750m surge fail).
      - op: replace
        path: /spec/replicas
        value: 1

  # Dilim 3: OpenFGA datastore URI (S2-A1 follow-up: shortname base'de zaten,
  # ama openfga_db + 'change-me-local-only' stub şifre bu patch'te test-specific.
  # ESO aktif olunca (S2-B1 pilot externalsecret.yaml) bu patch kaldırılır.)
  - target:
      kind: ConfigMap
      name: openfga-config
    patch: |-
      - op: replace
        path: /data/OPENFGA_DATASTORE_URI
        value: "postgres://openfga:change-me-local-only@postgres:5432/openfga?sslmode=disable"

  # 2026-04-19 S2-A1 follow-up: api-gateway shortname base'de zaten.
  # Overlay sadece LOGGING_LEVEL_ROOT DEBUG test override; gateway routes +
  # AUTH_SERVICE_URL + KEYCLOAK_URL replace'leri (eski patches) KALDIRILDI
  # (base shortname ile aynı değer → gereksiz).
  - target:
      kind: ConfigMap
      name: api-gateway-config
    patch: |-
      - op: replace
        path: /data/KEYCLOAK_ISSUER_URI
        value: "https://testai.acik.com/realms/platform-test"
      - op: replace
        path: /data/KEYCLOAK_JWKS_URI
        value: "http://keycloak:8080/realms/platform-test/protocol/openid-connect/certs"
      - op: replace
        path: /data/LOGGING_LEVEL_ROOT
        value: "DEBUG"

  # Ingress host + TLS host: testai.acik.com (D18)
  - target:
      kind: Ingress
      name: platform
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: testai.acik.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: testai.acik.com

  # Host bridge test portları (D20)
  # 2026-04-22 live truth: k3d-test node + test compose stateful container'lar
  # aynı `platform-test-net` Docker ağına bağlı. Bu yüzden host-service
  # endpoint'leri published host port yerine container bridge IP + native port
  # üzerinden çözülür. Controlled recreate sonrası bu IP'ler doğrulanmalıdır.
  - target:
      kind: Endpoints
      name: postgres
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.6"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 5432
  - target:
      kind: Endpoints
      name: keycloak
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.5"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8080
  - target:
      kind: Endpoints
      name: vault
    patch: |-
      - op: replace
        path: /subsets/0/addresses/0/ip
        value: "172.19.0.4"
      - op: replace
        path: /subsets/0/ports/0/port
        value: 8200

  # Test PDB gevşek (tek replica olunca anlamsız)
  - target:
      kind: PodDisruptionBudget
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0

  # Test ResourceQuota (2026-05-10: scale-to-zero deprecation sonrasi tum 12
  # deploy + STS replicas=1 sürekli çalışıyor; rolling update surge için
  # extra headroom gerek).
  - target:
      kind: ResourceQuota
      name: platform-quota
    patch: |-
      # Test quota — 12 Deployment + OpenFGA STS replicas=1 default
      # (HARD RULE — Scale-to-Zero YASAK). Ortalama declared usage ~7350m
      # Session 42 evidence: PR #485 DLR rollout FailedCreate at 7675m+400m=8075m
      # over 8000m hard cap. Manifest 10 CPU previously not synced to cluster.
      # 12 CPU + 6 requests = matched live cluster patch 2026-05-10 07:48Z.
      - op: replace
        path: /spec/hard/requests.cpu
        value: "6"
      - op: replace
        path: /spec/hard/requests.memory
        value: 12Gi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "12"
      - op: replace
        path: /spec/hard/limits.memory
        value: 24Gi
