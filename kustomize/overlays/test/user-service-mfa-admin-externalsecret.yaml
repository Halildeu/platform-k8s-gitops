# gitops#3211 — the user-mfa-admin KC client secret for the panel MFA
# section proxy (user-service KeycloakAdminClient, platform-backend#1034).
# Seeded by scripts/keycloak/setup-user-mfa-admin-client.sh; blank/absent
# keeps the whole MFA admin surface disabled fail-closed (503).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-service-mfa-admin-secret
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-platform-gitops
  target:
    name: user-service-mfa-admin-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: KEYCLOAK_ADMIN_API_CLIENT_SECRET
      remoteRef:
        key: kv/platform/user-service
        property: keycloak_admin_api_client_secret
