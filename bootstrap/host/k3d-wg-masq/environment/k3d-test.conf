# EnvironmentFile for k3d-test pod->WireGuard masq (installed as /etc/default/k3d-wg-masq).
# CANONICAL desired-state per bootstrap/k3d-test.yaml (clusterCIDR 10.44.0.0/16,
# docker network platform-test-net). prod leg uses 10.42.0.0/16 (bootstrap/k3d-prod.yaml)
# with a separate service instance/config.
# Named .conf (not .env) so the repo-wide `*.env` .gitignore does not drop it.
WGMASQ_POD_CIDR=10.44.0.0/16
WGMASQ_NODE=k3d-test-server-0
# Bridge + node IP are DERIVED every reconcile from the stable docker network NAME
# (platform-test-net) so they survive network recreation. Do NOT hard-pin a br-<netid>.
WGMASQ_NETWORK=platform-test-net
WGMASQ_WG_CIDR=10.99.0.0/24
WGMASQ_WG_IF=wg0
