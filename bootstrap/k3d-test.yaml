# k3d cluster: test
# Docs: https://k3d.io/stable/usage/configfile/
# Kullanım: k3d cluster create --config bootstrap/k3d-test.yaml

apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: test

servers: 1
agents: 0

image: rancher/k3s:v1.31.2-k3s1

# Prod cluster'dan ayrı Docker network
network: platform-test-net

kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "7443"         # prod (6443)'ten farklı

ports:
  - port: "127.0.0.1:31080:80"    # prod (30080)'den farklı
    nodeFilters:
      - server:0
  - port: "127.0.0.1:31443:443"
    nodeFilters:
      - server:0

options:
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters: [server:*]
      - arg: "--disable=servicelb"
        nodeFilters: [server:*]
      # 2026-05-10 (Codex iter-22 absorb): k3s built-in metrics-server
      # KAPALI — GitOps declarative install (kustomize/base/metrics-server +
      # ArgoCD metrics-server-test Application). Tek kaynak, GitOps tarafı.
      - arg: "--disable=metrics-server"
        nodeFilters: [server:*]
      - arg: "--flannel-backend=none"
        nodeFilters: [server:*]
      - arg: "--disable-network-policy"
        nodeFilters: [server:*]
      # Prod'dan farklı pod/svc CIDR — potansiyel routing karışıklığını önle
      - arg: "--cluster-cidr=10.44.0.0/16"
        nodeFilters: [server:*]
      - arg: "--service-cidr=10.45.0.0/16"
        nodeFilters: [server:*]
      - arg: "--cluster-dns=10.45.0.10"
        nodeFilters: [server:*]
      # Pod cap: raised 50 -> 80 (#2306/#2308, Codex 019f533d "Controlled D").
      # 50 was too small once Faz 24 (audio-gateway, meeting/transcript/audit
      # pipeline, ...) + Faz 25 ats-* landed — node hit 51/50 and rollouts
      # surge-blocked. 80 is a conservative intermediate (not 110) given the
      # shared staging-sw host's ~6 GiB RAM; max-pods loosens only the kubelet
      # pod-count gate, not memory, so re-evaluate before going higher.
      # LIVE 2026-07-12 (#2306): recreated via Method A v2 (commit-based, cluster-
      # preserving) — node Allocatable pods == 80 verified, Ready, no pressure,
      # cluster identity preserved (no ArgoCD re-reg / Vault rebootstrap), zero
      # data loss. See docs/runbooks/RB-faz-capacity-test-node-recreate.md.
      - arg: "--kubelet-arg=max-pods=80"
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false

registries:
  create:
    name: platform-test-registry
    # 2026-07-27 — GÜVENLİK: 0.0.0.0 idi; kimlik doğrulaması OLMAYAN bir Docker
    # Registry v2'yi kurum LAN'ının tamamına açıyordu (ölçüldü: /v2/ → 200,
    # 401+WWW-Authenticate DEĞİL; /v2/_catalog okunabiliyordu). Registry v2
    # varsayılanı auth'suz READ-WRITE olduğu için LAN'daki bir aktör cluster'ın
    # çektiği etiketi üzerine yazabilirdi → tedarik zinciri riski.
    #
    # 127.0.0.1 fonksiyonel olarak yeterli: cluster node'ları registry'ye HOST
    # yayını üzerinden DEĞİL, docker ağı içindeki hostname ile ulaşır
    # (node registries.yaml: platform-test-registry:5001 → http://platform-test-registry:5000).
    # Host'tan push (docker push localhost:5001/...) çalışmaya devam eder.
    # Bu satır desired-state; cluster her recreate'te (#2306 Method A v2) buradan okunur.
    host: "127.0.0.1"
    hostPort: "5001"         # prod (5000)'den farklı
