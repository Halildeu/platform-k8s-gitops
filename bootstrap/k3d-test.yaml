# k3d cluster: test
# Docs: https://k3d.io/stable/usage/configfile/
# Kullanım: k3d cluster create --config bootstrap/k3d-test.yaml

apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: test

servers: 1
agents: 0

image: rancher/k3s:v1.31.2-k3s1

# Prod cluster'dan ayrı Docker network
network: platform-test-net

kubeAPI:
  hostIP: "127.0.0.1"
  hostPort: "7443"         # prod (6443)'ten farklı

ports:
  - port: "127.0.0.1:31080:80"    # prod (30080)'den farklı
    nodeFilters:
      - server:0
  - port: "127.0.0.1:31443:443"
    nodeFilters:
      - server:0

options:
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters: [server:*]
      - arg: "--disable=servicelb"
        nodeFilters: [server:*]
      # 2026-05-10 (Codex iter-22 absorb): k3s built-in metrics-server
      # KAPALI — GitOps declarative install (kustomize/base/metrics-server +
      # ArgoCD metrics-server-test Application). Tek kaynak, GitOps tarafı.
      - arg: "--disable=metrics-server"
        nodeFilters: [server:*]
      - arg: "--flannel-backend=none"
        nodeFilters: [server:*]
      - arg: "--disable-network-policy"
        nodeFilters: [server:*]
      # Prod'dan farklı pod/svc CIDR — potansiyel routing karışıklığını önle
      - arg: "--cluster-cidr=10.44.0.0/16"
        nodeFilters: [server:*]
      - arg: "--service-cidr=10.45.0.0/16"
        nodeFilters: [server:*]
      - arg: "--cluster-dns=10.45.0.10"
        nodeFilters: [server:*]
      # Pod cap: raised 50 -> 80 (#2306/#2308, Codex 019f533d "Controlled D").
      # 50 was too small once Faz 24 (audio-gateway, meeting/transcript/audit
      # pipeline, ...) + Faz 25 ats-* landed — node hit 51/50 and rollouts
      # surge-blocked. 80 is a conservative intermediate (not 110) given the
      # shared staging-sw host's ~6 GiB RAM; max-pods loosens only the kubelet
      # pod-count gate, not memory, so re-evaluate before going higher.
      # NOTE: this is the DESIRED source of truth. The live kubelet still runs
      # max-pods=50 until k3d-test-server-0 is recreated in a coordinated
      # maintenance window (tracked by #2306/#2308; recreate runbook pending).
      # "capacity raised" is only true after live kubelet Allocatable pods == 80
      # is verified post-recreate.
      - arg: "--kubelet-arg=max-pods=80"
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false

registries:
  create:
    name: platform-test-registry
    host: "0.0.0.0"
    hostPort: "5001"         # prod (5000)'den farklı
